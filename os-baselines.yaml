# OS baselines — fixed overhead for the operating system and Docker runtime.
# The AF API adds these once per deployment when calculating total server requirements.
# Values are NOT included in recipe app_min_* fields.
baselines:
  ubuntu-26.04:
    os_min_ram_mb: 768   # +256 MiB for Traefik+WUD composition apps at idle
    os_min_cpu_cores: 1
    os_min_disk_mb: 6656  # +1.5 GB for Traefik+WUD images + pull-time peak
