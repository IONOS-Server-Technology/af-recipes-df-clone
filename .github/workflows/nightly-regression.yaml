name: Nightly Regression Tests

# Dedicated nightly workflow. It does NOT re-implement anything — it reuses the real
# live pipeline via `workflow_call`, so the nightly runs the exact production path
# (af-api /compose + /bootstrap on a real VM) over every enabled recipe. Running in
# the same run (no trigger-and-wait, no second runner). Scheduled runs fire only from
# the default branch; use workflow_dispatch to run it by hand.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  live:
    name: Live recipe tests (all enabled recipes)
    uses: ./.github/workflows/test-recipes-live.yaml
    with:
      all_enabled: true
    secrets: inherit
