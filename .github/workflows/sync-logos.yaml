name: Sync Recipe Logos to S3

on:
  pull_request:
    paths:
      - "recipes/*/logo.svg"
      - "recipes/*/metadata.yaml"
  push:
    branches: [main]
    paths:
      - "recipes/*/logo.svg"
      - "recipes/*/metadata.yaml"

jobs:
  sync:
    name: Upload changed logos
    runs-on:
      - ${{ vars.IF_DEFAULT_RUNNER }}
    permissions:
      id-token: write
      contents: read
    env:
      AWS_ENDPOINT_URL: https://s3.eu-central-3.ionoscloud.com
      AWS_DEFAULT_REGION: eu-central-3
      BUCKET: ${{ github.event_name == 'push' && 'appfactory' || 'appfactory-dev' }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get CI secrets
        uses: IONOS-Server-Technology/if-ci-actions/.github/actions/get-secrets@main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Determine changed recipes
        id: changed
        run: |
          set -euo pipefail
          changed_recipes=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -E '^recipes/[^/]+/(logo\.svg|metadata\.yaml)$' \
            | cut -d/ -f2 \
            | sort -u)
          {
            echo "recipes<<EOF"
            echo "$changed_recipes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$changed_recipes" ]; then
            echo "No recipe logo or metadata changes — nothing to sync."
          else
            echo "Recipes to sync:"
            echo "$changed_recipes"
          fi

      - name: Enforce recipe_version bump when logo changes
        if: steps.changed.outputs.recipes != ''
        env:
          RECIPES: ${{ steps.changed.outputs.recipes }}
        run: |
          python3 - <<'PYEOF'
          import os, subprocess, sys, yaml
          from pathlib import Path
          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          recipes = [r for r in os.environ["RECIPES"].strip().split("\n") if r]
          errors = []
          for recipe in recipes:
              changed_files = subprocess.run(
                  ["git", "diff", "--name-only", base, head, "--",
                   f"recipes/{recipe}/logo.svg"],
                  capture_output=True, text=True, check=True,
              ).stdout.strip()
              if not changed_files:
                  continue  # only metadata changed — no version bump required
              # Logo file changed. recipe_version must also change.
              meta_diff = subprocess.run(
                  ["git", "diff", base, head, "--", f"recipes/{recipe}/metadata.yaml"],
                  capture_output=True, text=True, check=True,
              ).stdout
              # Crude but adequate: any +/- on a recipe_version line counts as a bump.
              version_lines = [l for l in meta_diff.splitlines()
                               if l.startswith(("+", "-")) and "recipe_version" in l
                               and not l.startswith(("+++", "---"))]
              if len(version_lines) < 2:
                  errors.append(
                      f"{recipe}: logo file changed but recipe_version was not bumped. "
                      f"Bump metadata.yaml recipe_version (semver) before merging — "
                      f"the S3 path is versioned and Cache-Control is immutable, so "
                      f"without a bump consumers see stale logos forever."
                  )
          if errors:
              for e in errors:
                  print(f"::error::{e}", file=sys.stderr)
              sys.exit(1)
          print("Version-bump check passed.")
          PYEOF

      - name: Upload logos to ${{ env.BUCKET }}
        if: steps.changed.outputs.recipes != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ env.IONOS_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.IONOS_S3_SECRET_ACCESS_KEY }}
          RECIPES: ${{ steps.changed.outputs.recipes }}
        run: |
          python3 - <<'PYEOF'
          import hashlib
          import os
          import subprocess
          import sys
          import yaml
          from pathlib import Path

          bucket = os.environ["BUCKET"]
          recipes = [r for r in os.environ["RECIPES"].strip().split("\n") if r]
          mime = {"svg": "image/svg+xml"}  # SVG only (RFC-001 §4.6)
          errors = []

          for recipe in recipes:
              recipe_dir = Path("recipes") / recipe
              meta_path = recipe_dir / "metadata.yaml"
              if not meta_path.exists():
                  errors.append(f"{recipe}: metadata.yaml missing")
                  continue
              meta = yaml.safe_load(meta_path.read_text())
              recipe_id = meta.get("id")
              version = meta.get("recipe_version")
              if not recipe_id or not version:
                  errors.append(f"{recipe}: id or recipe_version missing")
                  continue

              logo_files = sorted(recipe_dir.glob("logo.*"))
              if not logo_files:
                  print(f"{recipe}: no logo file, skipping")
                  continue
              logo = logo_files[0]
              ext = logo.suffix.lstrip(".").lower()
              if ext not in mime:
                  errors.append(f"{recipe}: unsupported logo extension .{ext}")
                  continue

              digest = hashlib.sha256(logo.read_bytes()).hexdigest()
              declared = meta.get("logo_sha256")
              if declared and declared != digest:
                  errors.append(f"{recipe}: logo_sha256 mismatch (file={digest[:12]} meta={declared[:12]})")
                  continue

              key = f"recipes/{recipe_id}/{version}/logo.{ext}"
              s3_url = f"s3://{bucket}/{key}"
              print(f"Uploading {logo} -> {s3_url}")
              subprocess.run(
                  [
                      "aws", "s3", "cp", str(logo), s3_url,
                      "--cache-control", "public, max-age=31536000, immutable",
                      "--content-type", mime[ext],
                  ],
                  check=True,
              )

          if errors:
              for e in errors:
                  print(f"::error::{e}", file=sys.stderr)
              sys.exit(1)
          PYEOF

      - name: Verify uploaded logos are reachable over HTTPS
        if: steps.changed.outputs.recipes != ''
        env:
          RECIPES: ${{ steps.changed.outputs.recipes }}
        run: |
          python3 - <<'PYEOF'
          import os
          import subprocess
          import sys
          import yaml
          from pathlib import Path

          bucket = os.environ["BUCKET"]
          recipes = [r for r in os.environ["RECIPES"].strip().split("\n") if r]
          errors = []
          for recipe in recipes:
              meta = yaml.safe_load((Path("recipes") / recipe / "metadata.yaml").read_text())
              recipe_id = meta.get("id")
              version = meta.get("recipe_version")
              logo_files = sorted((Path("recipes") / recipe).glob("logo.*"))
              if not logo_files:
                  continue
              ext = logo_files[0].suffix.lstrip(".").lower()
              url = f"https://{bucket}.s3.eu-central-3.ionoscloud.com/recipes/{recipe_id}/{version}/logo.{ext}"
              r = subprocess.run(["curl", "-fsI", url], capture_output=True, text=True)
              if r.returncode != 0:
                  errors.append(f"{recipe}: {url} not reachable\n{r.stderr}")
              else:
                  print(f"OK {url}")
          if errors:
              for e in errors:
                  print(f"::error::{e}", file=sys.stderr)
              sys.exit(1)
          PYEOF
