name: Test Recipes Live

on:
  push:
    branches: ["feature/IF-547-**"]
  pull_request:
    branches: [main]
    paths:
      - "recipes/**"
      # IF-1458: the test harness itself was outside the filter, so a PR that only
      # touched the suite config, the helper scripts or this workflow never ran the
      # pipeline it changes -- it went to main unexercised and first ran that night.
      # scripts/ is in scope in full: every script in there is part of this pipeline
      # (call-compose, run-imagetester, the IP reserve/release pair, the cloud-init
      # patcher). tests/ holds the ImageTester configs this workflow passes with
      # --test-config.
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/test-recipes-live.yaml"
  workflow_dispatch:
    inputs:
      recipes:
        description: "Comma-separated recipe names (leave empty for all changed)"
        required: false
        default: ""
      image_uuid:
        description: "IONOS image UUID to use directly (skips image discovery)"
        required: false
        default: ""
      finalize_disabled:
        description: "true = boot with af-finalize switched off, so it skips its scrub and teardown and only unlocks access; false = let af-finalize run for real"
        required: false
        default: "true"
      mode:
        description: "dev = ephemeral af-api on a ClusterIP/NodePort (branch/PR); prod = validate a production image against the real dev+prod clusters"
        required: false
        default: "dev"
      bootstrap_log_replicas:
        description: "IF-1310 ONLY: number of identical VMs to boot. 0 = normal recipe testing. Replaces the recipe matrix with N replicas of one recipe and asserts exactly N distinct bootstraps in the API log — the bootstrap-log checks themselves run either way. N>1 is what proves N concurrent bootstraps stay N distinguishable groups."
        required: false
        default: "0"
      bootstrap_log_recipe:
        description: "IF-1310 ONLY: recipe each VM installs. Needed only because /compose must mint a token against something; pick the cheapest enabled recipe."
        required: false
        default: "vaultwarden"
      combos:
        description: 'Combination matrix as JSON, e.g. [{"apps":"immich n8n","label":"immich+n8n","size":2}] — skips selection entirely'
        required: false
        default: ""
      sizes:
        description: "Combination sizes to draw, e.g. 1,2,3 — setting this runs select-combinations.py instead of testing each recipe on its own"
        required: false
        default: ""
      fixed_combos:
        description: 'Combinations to use verbatim, e.g. "immich+n8n,vaultwarden"'
        required: false
        default: ""
      seed:
        description: "Seed for the combination draw. Empty = a random seed drawn from system entropy. The effective seed is recorded in the job summary either way, so any run can be replayed by passing it back here"
        required: false
        default: ""
      base_domain:
        description: "base_domain passed to /compose. Empty = fall back to the sslip.io name derived from the reserved test IP (IF-1386), which is what single-recipe runs use. Combinations pass af-test.invalid. There is no no-Traefik mode: af-api requires a base_domain for any multi-app combination, and a run without one is treated as an error"
        required: false
        default: ""
      template_id:
        description: "IONOS VM template UUID for the test VMs (default: vars.IONOS_TEMPLATE_ID)"
        required: false
        default: ""
  # Reusable entry point so a dedicated caller (e.g. nightly-regression.yaml) can run
  # this exact pipeline in the same run — no second runner, no trigger-and-wait action.
  workflow_call:
    inputs:
      recipes:
        type: string
        required: false
        default: ""
      image_uuid:
        type: string
        required: false
        default: ""
      all_curated:
        description: "Test every curated recipe (set by the nightly caller). Conjunctive with enabled: the nightly set is curated AND enabled (IF-1542)"
        type: boolean
        required: false
        default: false
      finalize_disabled:
        description: "true = boot with af-finalize switched off, so it skips its scrub and teardown and only unlocks access; false = let af-finalize run for real"
        type: string
        required: false
        default: "true"
      mode:
        description: "dev = ephemeral af-api on a ClusterIP/NodePort (branch/PR); prod = validate a production image against the real dev+prod clusters"
        type: string
        required: false
        default: "dev"
      combos:
        description: 'Combination matrix as JSON, e.g. [{"apps":"immich n8n","label":"immich+n8n","size":2}] — skips selection entirely'
        type: string
        required: false
        default: ""
      sizes:
        description: "Combination sizes to draw, e.g. 1,2,3 — setting this runs select-combinations.py instead of testing each recipe on its own"
        type: string
        required: false
        default: ""
      fixed_combos:
        description: 'Combinations to use verbatim, e.g. "immich+n8n,vaultwarden"'
        type: string
        required: false
        default: ""
      seed:
        description: "Seed for the combination draw. Empty = a random seed drawn from system entropy. The effective seed is recorded in the job summary either way, so any run can be replayed by passing it back here"
        type: string
        required: false
        default: ""
      base_domain:
        description: "base_domain passed to /compose. Empty = fall back to the sslip.io name derived from the reserved test IP (IF-1386), which is what single-recipe runs use. Combinations pass af-test.invalid. There is no no-Traefik mode: af-api requires a base_domain for any multi-app combination, and a run without one is treated as an error"
        type: string
        required: false
        default: ""
      template_id:
        description: "IONOS VM template UUID for the test VMs (default: vars.IONOS_TEMPLATE_ID)"
        type: string
        required: false
        default: ""

jobs:
  detect-changed-recipes:
    name: Detect Changed Recipes
    runs-on:
      - ${{ vars.IF_DEFAULT_RUNNER }}
    permissions:
      id-token: write
      contents: read
    outputs:
      recipes: ${{ steps.detect.outputs.recipes }}
      combos: ${{ steps.combos.outputs.combos }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get CI secrets
        # Needed for the mTLS client certs the catalogue check below presents.
        # if-ci-actions is the action carrying AF_RECIPES_MTLS_CLIENT_*, same as
        # the test-recipes job.
        uses: IONOS-Server-Technology/if-ci-actions/.github/actions/get-secrets@main

      - name: Detect changed recipe directories
        id: detect
        # Inputs come in via env, not ${{ }}: the runner substitutes an expression
        # as literal text before bash parses the script, so a free-text input
        # interpolated into a run block becomes shell source rather than data.
        env:
          RECIPES_INPUT: ${{ inputs.recipes }}
          ALL_CURATED: ${{ inputs.all_curated }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Keep only recipes marked `enabled: true` in metadata.yaml. Disabled
          # recipes cannot be deployed via /compose — af-api's validator rejects
          # them with recipe_not_found (see af_api/core/validator.py) — so they would
          # always fail at the cloud-init step. Live-test only activated recipes.
          filter_enabled() {
            local out='[]'
            for r in $(echo "$1" | jq -r '.[]'); do
              if grep -q '^enabled:[[:space:]]*true' "recipes/$r/metadata.yaml" 2>/dev/null; then
                out=$(echo "$out" | jq -c --arg r "$r" '. + [$r]')
              else
                echo "Skipping non-enabled recipe: $r" >&2
              fi
            done
            echo "$out"
          }

          # Keep only recipes marked `curated: true` in metadata.yaml (IF-1542). The
          # nightly used to deploy every enabled recipe, which is affordable at the six
          # of the MVP and stops being affordable well before the 200+ the catalogue is
          # heading for, so the scheduled run follows this flag instead. `enabled` is a
          # separate axis and still decides what a customer may order — it is applied on
          # top by filter_enabled below, so the nightly set is the conjunction of the two.
          filter_curated() {
            local out='[]'
            for r in $(echo "$1" | jq -r '.[]'); do
              if grep -q '^curated:[[:space:]]*true' "recipes/$r/metadata.yaml" 2>/dev/null; then
                out=$(echo "$out" | jq -c --arg r "$r" '. + [$r]')
              else
                echo "Skipping non-curated recipe: $r" >&2
              fi
            done
            echo "$out"
          }

          # The curated set as selected, before `enabled` narrows it. Kept so the run can
          # report which curated recipes it had to leave out (see below); stays empty on
          # every non-nightly path, where there is no curated selection to compare against.
          curated_selection='[]'

          if [ -n "$RECIPES_INPUT" ]; then
            # explicit list (manual dispatch or a caller passing recipes)
            recipes=$(echo "$RECIPES_INPUT" | tr ',' '\n' | jq -c -R -s 'split("\n") | map(select(length > 0))')
          elif [ "$ALL_CURATED" = "true" ]; then
            # The nightly caller (workflow_call with all_curated=true). Tested BEFORE the
            # workflow_dispatch branch on purpose: dispatching nightly-regression.yaml by
            # hand satisfies both conditions, and it has to keep meaning "run the nightly"
            # rather than silently widening to every recipe.
            all=$(ls -d recipes/*/ | xargs -n1 basename | jq -c -R -s 'split("\n") | map(select(length > 0))')
            curated_selection=$(filter_curated "$all")
            recipes="$curated_selection"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # manual dispatch without a list: test every recipe (filter_enabled narrows to
            # activated). Deliberately NOT narrowed to curated — this is the escape hatch
            # for exercising an enabled-but-uncurated recipe on a real VM on demand.
            recipes=$(ls -d recipes/*/ | xargs -n1 basename | jq -c -R -s 'split("\n") | map(select(length > 0))')
          else
            changed=$(git diff --name-only origin/main...HEAD)
            recipes=$(echo "$changed" | grep -E '^recipes/[^/]+/' | cut -d/ -f2 | sort -u | jq -c -R -s 'split("\n") | map(select(length > 0))' || echo '[]')
            # If an auto-inject recipe changed but no user-selectable recipe is in the matrix,
            # add a carrier recipe so the auto-inject health check can run on a real VM.
            has_auto_inject=false
            for r in $(echo "$changed" | grep -E '^recipes/[^/]+/' | cut -d/ -f2 | sort -u); do
              if grep -q '^docker_auto_inject:[[:space:]]*true' "recipes/$r/metadata.yaml" 2>/dev/null; then
                has_auto_inject=true
                break
              fi
            done
            if [ "$has_auto_inject" = "true" ]; then
              # Remove auto-inject recipes from the matrix (they cannot be deployed
              # standalone — /compose returns recipe_not_selectable) and add a
              # carrier recipe so the auto-inject health check runs on a real VM.
              filtered='[]'
              for r in $(echo "$recipes" | jq -r '.[]'); do
                if ! grep -q '^docker_auto_inject:[[:space:]]*true' "recipes/$r/metadata.yaml" 2>/dev/null; then
                  filtered=$(echo "$filtered" | jq -c --arg r "$r" '. + [$r]')
                fi
              done
              recipes=$(echo "$filtered" | jq -c '. + ["n8n"] | unique')
            fi
            # IF-1458: a PR that changes the harness but no recipe would otherwise
            # produce an empty matrix and report success without testing anything --
            # which is what adding tests/scripts/this-workflow to the paths filter
            # would have bought on its own. Run a two-recipe probe instead, covering
            # both directions of every assertion on two VMs rather than 20:
            #
            #   n8n         enabled, basic_auth -- the 401 and credentialed-200 paths.
            #               Until IF-1465 it also carried the auto-injected wud; with
            #               nothing injected any more it instead proves the opposite --
            #               that a docker-compose VM still installs cleanly when the
            #               renderer emits no auto-inject block at all
            #   vaultwarden enabled, no basic_auth -- the "must NOT answer 401" half.
            #               Chosen over any other unprotected recipe on purpose: its
            #               metadata mentions basic_auth in a comment about ADMIN_TOKEN
            #               without setting it, so it is exactly the recipe a
            #               grep-based check would misclassify. If anyone ever
            #               simplifies recipe-wants-basic-auth.py into a grep, this
            #               probe fails.
            #
            # Both must be `enabled: true` to survive filter_enabled below -- gitea,
            # the obvious unprotected candidate, is disabled and would vanish here,
            # silently dropping the negative assertion.
            #
            # IF-1465: narrow to activated recipes *before* the emptiness test, not only
            # in the trailing filter_enabled. A PR touching a disabled recipe (wud) plus
            # the harness arrived here with a non-empty matrix, skipped this probe, and
            # was then emptied by that trailing call -- reporting success having tested
            # nothing, the exact hole IF-1458 opened this branch to close. filter_enabled
            # is idempotent, so the trailing call still covers the dispatch and
            # explicit-list branches above.
            recipes=$(filter_enabled "$recipes")
            if [ "$(echo "$recipes" | jq 'length')" -eq 0 ]; then
              harness_changed=$(echo "$changed" | grep -cE '^(tests/|scripts/|\.github/workflows/test-recipes-live\.yaml)' || true)
              if [ "$harness_changed" -gt 0 ]; then
                echo "No enabled recipe changed, but the test harness did — running the n8n/vaultwarden probe" >&2
                recipes='["n8n","vaultwarden"]'
              fi
            fi
          fi
          # Restrict the matrix to activated (enabled: true) recipes regardless of
          # how it was assembled above. The auto-inject carrier (n8n) is enabled,
          # so it survives this filter.
          recipes=$(filter_enabled "$recipes")
          # Report the effective selection — the "Skipping" lines above only show
          # what was dropped, not what actually ends up in the matrix.
          count=$(echo "$recipes" | jq 'length')
          selected=$(echo "$recipes" | jq -r 'join(", ")')
          if [ "$ALL_CURATED" = "true" ]; then scope="curated + enabled"; else scope="enabled"; fi
          echo "Selected $count $scope recipe(s) for live test: ${selected:-<none>}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "### Recipes selected for live test ($count, $scope)" >> "$GITHUB_STEP_SUMMARY"
            echo "${selected:-_none — no recipe in scope_}" >> "$GITHUB_STEP_SUMMARY"
          fi
          # A curated recipe that is currently disabled is a legal state, not an error:
          # the two flags are independent axes, so an app withdrawn for maintenance or a
          # pending security fix stays curated. It does drop out of tonight's run, and the
          # only trace of that was a "Skipping non-enabled recipe" line on stderr. Name it
          # where the nightly is actually read, so a gap meant to last a day cannot become
          # permanent unnoticed.
          if [ "$ALL_CURATED" = "true" ]; then
            withheld=$(jq -nc --argjson c "$curated_selection" --argjson s "$recipes" '$c - $s')
            if [ "$(echo "$withheld" | jq 'length')" -gt 0 ]; then
              withheld_names=$(echo "$withheld" | jq -r 'join(", ")')
              echo "::warning::Curated but currently disabled, so not deployed tonight: $withheld_names"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "⚠️ **Curated but currently disabled**, so not deployed tonight: $withheld_names" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
          # IF-1542: the nightly branch needs its own emptiness guard now. It never did
          # while it selected every recipe directory, and the PR-diff branch above has
          # one of its own. Following a flag reopens the "green having tested nothing"
          # hole that IF-1458 and IF-1465 each closed for that other branch: an empty
          # curated set would sail through as a zero-length matrix.
          if [ "$ALL_CURATED" = "true" ] && [ "$count" -eq 0 ]; then
            echo "::error::No recipe is both curated: true and enabled: true — the nightly would have reported success having deployed nothing."
            exit 1
          fi
          echo "recipes=$recipes" >> $GITHUB_OUTPUT

      - name: Select recipe combinations
        id: combos
        # A combination is one VM. `apps` is the space-separated selection handed to
        # /compose; `label` names the job and every path and artifact derived from it,
        # because `apps` contains spaces as soon as there is more than one app.
        #
        # The single-recipe pipeline is just the size-1 case, so all three branches
        # emit the same shape and nothing downstream has to know which one ran.
        # select-combinations.py reads only catalogue.json and the standard library, so
        # this step needs no pip install — but it does need an interpreter, and there is
        # no setup-python here: it relies on the system python3 of IF_DEFAULT_RUNNER, as
        # the test-recipes job below already does. Only combination dispatches reach it.
        env:
          COMBOS_INPUT: ${{ inputs.combos }}
          SIZES: ${{ inputs.sizes }}
          FIXED_COMBOS: ${{ inputs.fixed_combos }}
          SEED: ${{ inputs.seed }}
          RECIPES_JSON: ${{ steps.detect.outputs.recipes }}
        run: |
          set -o pipefail

          if [ -n "$COMBOS_INPUT" ]; then
            # Supplied verbatim: validate the shape here rather than letting a typo
            # surface as a mysteriously empty matrix, or as a job that composes the
            # literal string "null". Checked with an explicit `if !` rather than left
            # to errexit on the assignment, so the failure carries a message that says
            # what to fix and does not depend on which shell options are in force.
            #
            # `label` is shape-checked, not just type-checked: it names jobs, paths and
            # artifacts, and it is the only field here a caller can fill with arbitrary
            # text. \A and \z rather than ^ and $ -- Oniguruma lets $ match before a
            # trailing newline, which ^…$ would therefore accept.
            #
            # `apps` is normalised, not just type-checked: the catalogue intersection in
            # the matrix step below does `.apps | split(" ")`, so a doubled, leading or
            # trailing space would inject an empty member that is in no catalogue and
            # would silently drop the whole combination, reporting an unnamed recipe as
            # missing. Blank members are dropped and an `apps` with nothing left is an
            # error -- the same two rules parse_fixed_combos() applies in
            # scripts/select-combinations.py. `size` is always counted from the
            # normalised list, so it cannot drift from what the VM actually installs.
            if ! combos=$(echo "$COMBOS_INPUT" | jq -c '
              def members: [.apps | split("[[:space:]]+"; "")[] | select(length > 0)];
              if type != "array" or length == 0 then
                error("combos must be a non-empty JSON array")
              else
                [ .[]
                  | if (.apps | type) != "string"
                       or (.label | type) != "string"
                       or ((.label | test("\\A[a-z0-9][a-z0-9._+-]*\\z")) | not)
                    then error("every combos entry needs a string `apps` and a `label` of the form immich+n8n -- recipe-id characters, plus `+` between members")
                    elif (members | length) == 0
                    then error("combos entry `\(.label)` has an empty `apps`: it must name at least one recipe id, space-separated, e.g. \"immich n8n\"")
                    elif (.size != null) and (.size != (members | length))
                    then error("combos entry `\(.label)` declares size \(.size) but its `apps` names \(members | length) recipe id(s) -- leave `size` out and it is counted from `apps`")
                    else members as $m | {apps: ($m | join(" ")), label, size: ($m | length)}
                    end
                ]
              end'); then
              echo "::error::the combos input is not a usable combination matrix. Expected a non-empty JSON array of objects, each with a string 'apps' (space-separated recipe ids) and a string 'label' built from recipe-id characters (lower-case alphanumerics, '.', '_', '-') joined by '+', e.g. immich+n8n. Extra spaces inside 'apps' are collapsed, but it must name at least one recipe id, and any 'size' you pass must match how many it names. See jq's message above." >&2
              exit 1
            fi
            echo "Using the combination matrix supplied by the caller."
          elif [ -n "$SIZES" ] || [ -n "$FIXED_COMBOS" ] || [ -n "$SEED" ]; then
            args=()
            if [ -n "$SIZES" ]; then args+=(--sizes "$SIZES"); fi
            if [ -n "$FIXED_COMBOS" ]; then args+=(--fixed-combos "$FIXED_COMBOS"); fi
            if [ -n "$SEED" ]; then args+=(--seed "$SEED"); fi
            # Diagnostics (pool, effective seed, declared RAM/disk per draw) go to
            # stderr and land in this step's log; stdout is the matrix. Capture stderr
            # to a file so we can both echo it back into the log AND parse the
            # effective seed out of it — stdout must stay exactly the matrix.
            seed_log=$(mktemp)
            if ! combos=$(python3 scripts/select-combinations.py "${args[@]}" 2>"$seed_log"); then
              cat "$seed_log" >&2
              rm -f "$seed_log"
              echo "::error::select-combinations.py could not produce a matrix — its diagnostics are above. An unknown, disabled or auto-inject recipe id, or a size larger than the eligible pool, all land here." >&2
              exit 1
            fi
            cat "$seed_log" >&2
            # The script prints `seed: <n>, sizes: ...` on stderr for a random draw
            # (not for --fixed-combos). Capture it so the job summary can record the
            # effective seed and a nightly run can be replayed with --seed.
            effective_seed=$(sed -n 's/^seed: \([0-9][0-9]*\),.*/\1/p' "$seed_log" | tail -n1)
            rm -f "$seed_log"
          else
            # Fall-through: the PR trigger and the nightly caller land here. One
            # combination per detected recipe, size 1, no base_domain — the same set
            # of VMs and the same requests as before combinations existed.
            combos=$(echo "$RECIPES_JSON" | jq -c '[.[] | {apps: ., label: ., size: 1}]')
          fi

          combo_count=$(echo "$combos" | jq 'length')
          echo "Combinations selected ($combo_count): $(echo "$combos" | jq -r '[.[].label] | join(", ")')"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ "$combo_count" -gt 0 ]; then
            echo "### Combinations selected for live test ($combo_count)" >> "$GITHUB_STEP_SUMMARY"
            echo "$combos" | jq -r '.[] | "- `\(.label)` (\(.size) app(s))"' >> "$GITHUB_STEP_SUMMARY"
          fi
          # Record the effective seed so a nightly (or any random) draw is replayable.
          # Only set on the random-draw path; a --fixed-combos or caller-supplied matrix
          # has no seed and nothing to record here.
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -n "${effective_seed:-}" ]; then
            {
              echo ""
              echo "**Effective seed:** \`$effective_seed\`"
              echo ""
              echo "If a leg fails, re-run this workflow with this seed (the \`seed\` input, or \`scripts/select-combinations.py --seed $effective_seed\`) to reproduce the exact same combination draw."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "combos=$combos" >> $GITHUB_OUTPUT

      # The golden check runs gen-health-check-conf.py, which imports PyYAML (to read
      # manifest.yaml and each recipe's metadata.yaml). This job has no container, so it
      # uses the runner's bare system python3, which lacks PyYAML -- unlike the generator's
      # normal invocation in the test-recipes job, which runs inside build_werkzeugkiste.
      # Install it here, matching the repo idiom in recipe-pipeline.yaml. The stdlib-only
      # select-combinations.py step above deliberately stays on system python3.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python3 -m ensurepip --upgrade --default-pip || true
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml

      - name: Verify health-check generator output against golden snapshots
        # IF-1140 #7/#8: gen-health-check-conf.py is the definition of the live-test
        # config, but nothing guarded it against silent drift. The golden fixtures under
        # tests/golden/ and the helper below are the source of truth; running the helper
        # with no args regenerates the config for each committed case and diffs it against
        # its golden snapshot, failing (with an actionable ::error::) on any difference.
        # Runs here in the early detect job so drift is caught before a single VM boots.
        run: |
          python3 scripts/golden-health-checks.py

      - name: Write mTLS client certs for the catalogue check
        # Both real clusters serve /api/v1/catalogue on the mTLS main host (only
        # /api/v1/bootstrap has its own public listener), so the check needs a
        # client cert per cluster. umask 077 keeps the private keys off 0644.
        if: ${{ (inputs.mode || 'dev') == 'prod' }}
        run: |
          umask 077
          printf '%s' "$AF_RECIPES_MTLS_CLIENT_CRT_PEM_DEV"  > /tmp/af_client_dev.crt
          printf '%s' "$AF_RECIPES_MTLS_CLIENT_KEY_PEM_DEV"  > /tmp/af_client_dev.key
          printf '%s' "$AF_RECIPES_MTLS_CLIENT_CRT_PEM_PROD" > /tmp/af_client_prod.crt
          printf '%s' "$AF_RECIPES_MTLS_CLIENT_KEY_PEM_PROD" > /tmp/af_client_prod.key

      - name: Expand recipe/cluster matrix
        id: matrix
        # Expand the recipe list into the test-recipes job matrix. The dev-mode run
        # tests each recipe once against the ephemeral af-api; the prod-mode run
        # tests each recipe against BOTH real clusters (dev + prod legs), so a
        # single prod-mode invocation exercises both signing paths.
        #
        # A prod-mode leg can only validate a recipe the cluster's af-api actually
        # serves: af-api bakes an af-recipes snapshot at build time, so a recipe
        # activated here but not yet carried by the deployed af-api would fail with
        # recipe_not_found. On the blocking prod leg that stops every production
        # image build, so derive the legs from the live catalogue instead of
        # assuming the two are in step.
        env:
          MODE: ${{ inputs.mode || 'dev' }}
          COMBOS_JSON: ${{ steps.combos.outputs.combos }}
          BOOTSTRAP_LOG_REPLICAS: ${{ inputs.bootstrap_log_replicas || '0' }}
          BOOTSTRAP_LOG_RECIPE: ${{ inputs.bootstrap_log_recipe || 'vaultwarden' }}
        run: |
          set -o pipefail

          # IF-1310 bootstrap-log mode: N identical VMs instead of one per recipe.
          # Identical on purpose — the property under test is that N bootstraps stay N
          # distinguishable groups in the API log, which is hardest exactly when their
          # log lines are the same. Short-circuits before the catalogue intersection,
          # which exists to keep recipe coverage honest and has no meaning when every
          # leg installs the same thing. Ephemeral only: these legs deploy an af-api
          # from this branch, and pointing N VMs at a shared cluster is not something
          # to trigger from a dispatch input.
          if [ "${BOOTSTRAP_LOG_REPLICAS:-0}" -gt 0 ] 2>/dev/null; then
            if [ "$MODE" = "prod" ]; then
              echo "::error::bootstrap_log_replicas is incompatible with mode=prod — these legs must not load the real clusters."
              exit 1
            fi
            include=$(jq -cn --arg r "$BOOTSTRAP_LOG_RECIPE" --argjson n "$BOOTSTRAP_LOG_REPLICAS" \
              '[range($n) | {recipe: $r, apps: $r, label: $r, cluster: "ephemeral", replica: (. + 1)}]')
            echo "IF-1310 bootstrap-log mode: $BOOTSTRAP_LOG_REPLICAS replicas of '$BOOTSTRAP_LOG_RECIPE'"
            echo "matrix={\"include\":$include}" >> $GITHUB_OUTPUT
            exit 0
          fi

          report() {  # message goes to the log AND the run summary
            echo "::${1}::${2}"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              echo "- ${2}" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          # Catalogue ids for one cluster, or non-zero if the call itself failed.
          # A failed call is an outage and must never be reported as "the recipe is
          # missing from the catalogue" — the two need different responses.
          catalogue_ids() {  # $1 cluster, $2 api url, $3 crt, $4 key
            local body
            if ! body=$(curl -sS --fail-with-body -m 30 \
                          --cert "$3" --key "$4" "${2}/api/v1/catalogue"); then
              echo "GET ${2}/api/v1/catalogue failed: ${body}" >&2
              return 1
            fi
            echo "$body" | jq -r '.applications[].id'
          }

          combo_count=$(echo "$COMBOS_JSON" | jq 'length')
          if [ "$MODE" = "prod" ]; then
            clusters="dev prod"
            echo "### Prod-mode catalogue check" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            clusters="ephemeral"
          fi

          include='[]'
          for c in $clusters; do
            case "$c" in
              dev)  api="https://api.dev.appfactory.ionos.com"
                    crt=/tmp/af_client_dev.crt;  key=/tmp/af_client_dev.key ;;
              prod) api="https://api.appfactory.ionos.com"
                    crt=/tmp/af_client_prod.crt; key=/tmp/af_client_prod.key ;;
              # The ephemeral af-api is built from this branch, so its catalogue is
              # in sync by construction — nothing to intersect against.
              ephemeral) api="" ;;
            esac

            if [ -z "$api" ]; then
              legs="$COMBOS_JSON"
            elif ! ids=$(catalogue_ids "$c" "$api" "$crt" "$key"); then
              if [ "$c" = "prod" ]; then
                report error "prod cluster catalogue is unreachable — cannot tell which recipes production can validate. This is an outage or a cert/allowlist problem, NOT a stale catalogue."
                exit 1
              fi
              # A dev-cluster outage must never block a production image build,
              # for the same reason the whole dev leg is continue-on-error.
              report warning "dev cluster catalogue is unreachable — dropping all dev legs (non-blocking). The prod leg still gates the build."
              continue
            else
              avail=$(printf '%s\n' "$ids" \
                | jq -R -s -c 'split("\n") | map(select(length > 0))')
              # Intersect per COMBINATION, not per recipe: one VM installs every
              # member of a combination, so it is testable on this leg only if the
              # cluster's catalogue carries all of them. Keeping a combination and
              # quietly dropping the missing member would turn a 3-app test into a
              # 2-app test that still reports as the 3-app one.
              legs=$(echo "$COMBOS_JSON" | jq -c --argjson a "$avail" \
                '[.[] | select(((.apps | split(" ")) - $a) | length == 0)]')
              while IFS=$'\t' read -r label missing; do
                [ -n "$label" ] || continue
                report notice "combination '${label}' is not testable on the ${c} cluster: ${missing} absent from its catalogue — skipping the whole combination on the ${c} leg. The af-api deployed there predates this recipe activation."
              done < <(echo "$COMBOS_JSON" | jq -r --argjson a "$avail" \
                '.[] | ((.apps | split(" ")) - $a) as $missing
                     | select($missing | length > 0)
                     | "\(.label)\t\($missing | join(", "))"')
              # Silently shipping zero production validation behind a green build is
              # the exact false-green this pipeline exists to remove.
              if [ "$c" = "prod" ] && [ "$combo_count" -gt 0 ] \
                 && [ "$(echo "$legs" | jq 'length')" -eq 0 ]; then
                report error "no combination in scope is fully present in the prod cluster catalogue — nothing would be validated against production. Deploy an af-api carrying these recipes to prod first."
                exit 1
              fi
            fi

            include=$(echo "$include" | jq -c --argjson legs "$legs" --arg c "$c" \
              '. + [$legs[] | . + {cluster: $c}]')
          done

          echo "Pipeline mode: $MODE; matrix legs: $(echo "$include" | jq 'length')"
          echo "matrix={\"include\":$include}" >> $GITHUB_OUTPUT

  trigger-af-api-build:
    name: Trigger af-api image build
    # Ephemeral af-api is only for the dev-mode run. The prod-mode run targets
    # the real clusters, so it skips build/deploy/cleanup entirely.
    if: ${{ (inputs.mode || 'dev') != 'prod' }}
    runs-on:
      - ${{ vars.IF_DEFAULT_RUNNER }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get CI secrets
        uses: IONOS-Server-Technology/if-ci-actions/.github/actions/get-secrets@main

      - name: Resolve af-api branch ref
        id: af-api-ref
        run: |
          branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          if git ls-remote --exit-code \
              "https://x-access-token:${GH_APP_TOKEN}@github.com/IONOS-Server-Technology/af-api.git" \
              "refs/heads/${branch}" > /dev/null 2>&1; then
            echo "value=${branch}" >> "$GITHUB_OUTPUT"
          else
            echo "value=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive Harbor image tag from af-recipes branch
        id: image-tag
        run: |
          # Same sanitisation + ephemeral- prefix as deploy-af-api's tag derivation —
          # must match so the deploy step finds the image at harbor.../af-api:<tag>.
          # The ephemeral- prefix also drives af-api's scan skip: build.yaml gates its
          # security job on this prefix, so these unscanned recipe-test images are both
          # produced without the OWASP scan and visibly distinct from real af-api builds.
          raw="${{ github.event.pull_request.head.ref || github.ref_name }}"
          safe=$(echo "$raw" | tr '[:upper:]' '[:lower:]' | sed 's|/|-|g' | sed 's/[^a-z0-9-]/-/g' | sed 's/-\+/-/g' | sed 's/^-*//' | sed 's/-*$//')
          echo "value=ephemeral-$safe" >> "$GITHUB_OUTPUT"

      - uses: IONOS-Server-Technology/trigger-workflow-and-wait@v1.6.7
        with:
          owner: IONOS-Server-Technology
          repo: af-api
          github_token: ${{ env.GH_APP_TOKEN }}
          app_id: ${{ env.GH_APP_ID }}
          app_private_key: ${{ env.GH_APP_PRIVATE_KEY }}
          workflow_file_name: build.yaml
          ref: ${{ steps.af-api-ref.outputs.value }}
          client_payload: >-
            {"ref": "${{ steps.af-api-ref.outputs.value }}",
             "image_tag": "${{ steps.image-tag.outputs.value }}",
             "af_recipes_ref": "${{ github.event.pull_request.head.ref || github.ref_name }}"}

  deploy-af-api:
    name: Deploy af-api for branch
    needs: trigger-af-api-build
    if: ${{ (inputs.mode || 'dev') != 'prod' }}
    runs-on:
      - ${{ vars.IF_DEFAULT_RUNNER }}
    permissions:
      id-token: write
      contents: read
    outputs:
      name: ${{ steps.ref.outputs.name }}
      url: ${{ steps.url.outputs.url }}
      bootstrap_verification_key: ${{ steps.signing_key.outputs.bootstrap_verification_key }}
    steps:
      - uses: actions/checkout@v5

      - name: Get CI secrets
        uses: IONOS-Server-Technology/af-ci-actions/.github/actions/get-secrets@main

      - name: Checkout python-dwh-image-build-algorithm
        uses: actions/checkout@v5
        with:
          repository: IONOS-Server-Technology/python-dwh-image-build-algorithm
          ref: main
          path: image-builder-src
          token: ${{ env.GH_APP_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ./image-builder-src

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.30.0

      - name: Compute deployment name and image tag from branch ref
        id: ref
        run: |
          raw="${{ github.event.pull_request.head.ref || github.ref_name }}"
          safe=$(echo "$raw" | tr '[:upper:]' '[:lower:]' | sed 's|/|-|g' | sed 's/[^a-z0-9-]/-/g' | sed 's/-\+/-/g' | sed 's/^-*//' | sed 's/-*$//')
          # Deployment + Service name is per-run so concurrent runs on the
          # same branch get their own pod and NodePort instead of stomping
          # on each other. k8s Service names cap at 63 chars (DNS subdomain),
          # so trim the branch portion to leave room for the run-id suffix.
          # The name stays unprefixed; only the image tag carries ephemeral-.
          # Image tag is ephemeral-<branch> — must match the trigger-af-api-build
          # derivation so this deploy finds the artifact af-api built.
          run_id="${{ github.run_id }}"
          name_branch="${safe:0:44}"
          name="af-api-${name_branch}-${run_id}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=ephemeral-$safe" >> "$GITHUB_OUTPUT"

      - name: Ensure Harbor pull secret
        env:
          KUBECONFIG_CONTENT: ${{ env.AF_CI_KUBECONFIG }}
          HARBOR_USERNAME: ${{ env.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ env.HARBOR_PASSWORD }}
        run: python scripts/k8s_helper.py ensure-pull-secret harbor.infra.cluster.ionos.com

      - name: Generate per-deployment JWE signing key
        # Match the production code path: af-api loads the JWE key from env
        # rather than the DEV_MODE auto-generate branch. Without this, each
        # uvicorn worker generates its own ephemeral key (Dockerfile CMD uses
        # --workers 2), so /compose and /bootstrap round-robined to different
        # workers fail decryption. Generate one fresh key per deployment and
        # pin it via JWE_PRIVATE_KEY_PEM so every worker uses the same one.
        # Not a prod key — single-use per pipeline run.
        run: |
          openssl genrsa 2048 > /tmp/af_api_jwe_key.pem
          {
            echo "JWE_PRIVATE_KEY_PEM<<__AF_API_KEY_EOF__"
            cat /tmp/af_api_jwe_key.pem
            echo "__AF_API_KEY_EOF__"
          } >> "$GITHUB_ENV"

      - name: Generate per-deployment bootstrap signing key
        # Ed25519 key pair scoped to this pipeline run. Private key goes to
        # af-api via BOOTSTRAP_SIGNING_KEY_PEM; public key is injected into
        # the test VM cloud-config as bootstrap_verification_key (dev mode).
        # No pre-shared secret — fresh pair per run satisfies IF-1037 AC#3.
        run: |
          openssl genpkey -algorithm ed25519 > /tmp/af_signing_key.pem
          openssl pkey -in /tmp/af_signing_key.pem -pubout > /tmp/af_signing_key.pub
          {
            echo "BOOTSTRAP_SIGNING_KEY_PEM<<__AF_SIGNING_EOF__"
            cat /tmp/af_signing_key.pem
            echo "__AF_SIGNING_EOF__"
          } >> "$GITHUB_ENV"

      - name: Capture verification key for test jobs
        id: signing_key
        run: |
          {
            echo "bootstrap_verification_key<<__AF_VERIF_EOF__"
            cat /tmp/af_signing_key.pub
            echo "__AF_VERIF_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy af-api Deployment + Service
        env:
          KUBECONFIG_CONTENT: ${{ env.AF_CI_KUBECONFIG }}
          AF_API_JWE_PRIVATE_KEY_PEM: ${{ env.JWE_PRIVATE_KEY_PEM }}
          AF_API_BOOTSTRAP_SIGNING_KEY_PEM: ${{ env.BOOTSTRAP_SIGNING_KEY_PEM }}
        run: |
          python scripts/k8s_helper.py deploy \
            "${{ steps.ref.outputs.name }}" \
            "harbor.infra.cluster.ionos.com/imagefactory/af-api:${{ steps.ref.outputs.tag }}"

      - name: Wait for rollout
        env:
          KUBECONFIG_CONTENT: ${{ env.AF_CI_KUBECONFIG }}
        run: python scripts/k8s_helper.py rollout-status "${{ steps.ref.outputs.name }}"

      - name: Diagnose rollout failure
        if: failure()
        env:
          KUBECONFIG_CONTENT: ${{ env.AF_CI_KUBECONFIG }}
        run: |
          python scripts/k8s_helper.py describe "${{ steps.ref.outputs.name }}"

      - name: Get af-api ClusterIP URL
        id: url
        env:
          KUBECONFIG_CONTENT: ${{ env.AF_CI_KUBECONFIG }}
        run: |
          url=$(python scripts/k8s_helper.py get-url "${{ steps.ref.outputs.name }}" 8000)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify af-api reachable from runner
        run: |
          set -x
          url="${{ steps.url.outputs.url }}"
          for i in $(seq 1 15); do
            if curl -sf -m 5 "${url}/api/v1/health"; then
              echo "af-api reachable at $url after attempt $i"
              exit 0
            fi
            sleep 2
          done
          echo "af-api NOT reachable at $url" >&2
          exit 1

  test-recipes:
    name: Test Recipes - ${{ matrix.label }} (${{ matrix.cluster }})
    # deploy-af-api is skipped in prod mode, so gate on !failure rather than
    # success — otherwise a skipped dependency would skip this job too.
    if: ${{ !cancelled() && needs.detect-changed-recipes.result == 'success' && needs.deploy-af-api.result != 'failure' }}
    container:
      image: harbor.infra.cluster.ionos.com/imagefactory/build_werkzeugkiste:latest
      credentials:
        username: ${{ secrets.DOCKER_REGISTRY_USER }}
        password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
    # The ONLY containerised job in this repo, and therefore the only one where a
    # `run:` block does not get bash by default: GHA resolves container-job steps to
    # `sh -e {0}`, and /bin/sh in build_werkzeugkiste is dash. Bash is installed, it
    # just has to be asked for. Declared job-wide rather than per step so the next
    # step added here cannot silently reintroduce the trap.
    # Note this is `bash --noprofile --norc -eo pipefail {0}`, not the implicit
    # `bash -e {0}` — pipefail is deliberate: it stops a failing `… | tee` from
    # passing the step off with a half-written file.
    defaults:
      run:
        shell: bash
    needs: [detect-changed-recipes, deploy-af-api]
    runs-on:
      - ${{ vars.IF_DEFAULT_RUNNER }}
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix: ${{ fromJson(needs.detect-changed-recipes.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v5

      - name: Get CI secrets
        uses: IONOS-Server-Technology/if-ci-actions/.github/actions/get-secrets@main

      - name: Generate SSH keypair
        # RSA, not ed25519 — python-dwh-testsuite hardcodes
        # paramiko.RSAKey.from_private_key_file for SSH auth.
        run: |
          ssh-keygen -t rsa -b 4096 -m PEM -N "" -f /tmp/vm_key -q
          echo "SSH_KEY_ABSPATH=/tmp/vm_key" >> "$GITHUB_ENV"

      - name: Generate VM root password
        # IF-1458: /compose has always been handed a root password -- call-compose.py
        # generated one internally and threw it away (`args.root_password or
        # random_password()`). Generating it out here instead makes it available to
        # the test step, which needs it to authenticate against the Traefik basic-auth
        # middleware (IF-1312) the same way a customer would.
        #
        # Kept in a file rather than a step output, matching how /tmp/vm_key is
        # handled: step outputs are readable through the workflow API for anyone with
        # repo read access, a file is confined to this runner. It dies with the
        # ephemeral runner, and the VM it belongs to is deleted at the end of the leg.
        #
        # add-mask makes GHA redact the value from all subsequent log output. Alphanumeric
        # because that is what call-compose.py's own generator produced, so this changes
        # no behaviour beyond making the value knowable. Note this still exercises the
        # dollar-escaping path that IF-1312 got wrong: the bcrypt *hash* af-api derives is
        # dollar-heavy ($2b$05$...) regardless of how plain the password is.
        run: |
          # head reads a bounded chunk FIRST (closes nothing upstream), tr then hits EOF,
          # and cut reads to EOF -- so no stage dies of SIGPIPE. The earlier
          # `tr </dev/urandom | head -c 20` form was replaced as a robustness improvement;
          # the step ran under bash -e (no pipefail), so SIGPIPE from tr was not the actual
          # failure mode, but this form is unambiguously safe regardless of shell flags.
          root_password=$(head -c 4096 /dev/urandom | LC_ALL=C tr -dc 'A-Za-z0-9' | cut -c1-20)
          # A short read here would otherwise surface much later as a stage-2 401 and be
          # read as the IF-1312 hash bug, when it would really be this generator.
          if [ "${#root_password}" -ne 20 ]; then
            echo "generated root password is ${#root_password} chars, expected 20" >&2
            exit 1
          fi
          echo "::add-mask::$root_password"
          umask 077
          # printf '%s', not echo: no trailing newline. check-basic-auth.sh reads this
          # file with $(<file) and call-compose.py with read_text() and no strip -- those
          # two agree byte for byte only because nothing appends a newline here. This step
          # is the only writer of the file.
          printf '%s' "$root_password" > /tmp/vm_root_password

      - name: Discover Ubuntu 26.04 image UUID
        id: image
        if: ${{ inputs.image_uuid == '' }}
        env:
          IONOS_USERNAME: ${{ env.INSTALLTEST_DCD_USERNAME }}
          IONOS_PASSWORD: ${{ env.INSTALLTEST_DCD_PASSWORD }}
        # if-main-ubuntu-2604-af uploads its built qcow2 to IONOS Cloud with
        # the image NAME set to the qcow2 filename (see
        # IonosImageUploader._upload_once `--name` argument). The FTP
        # filename gets a random hex suffix to dodge the ionos overwrite
        # restriction, but the IONOS image NAME stays the original. We
        # match by substring and pick the newest HDD entry.
        run: |
          image_json=$(ionosctl image list -o json)
          uuid=$(echo "$image_json" | jq -r '
            [.items[]? | select(
              ((.properties.name // "") | test("ubuntu-26.04-server-cloudimg-amd64_af.qcow2";"i"))
              and ((.properties.imageType // "HDD") == "HDD")
            )]
            | sort_by(.metadata.createdDate // "")
            | last
            | .id // empty
          ')
          if [ -z "$uuid" ] || [ "$uuid" = "null" ]; then
            echo "No matching Ubuntu 26.04 image found in IONOS Cloud" >&2
            echo "Available images (first 50):" >&2
            echo "$image_json" | jq -r '.items[]? | "\(.id) \(.properties.name)"' | head -50 >&2
            exit 1
          fi
          echo "Discovered Ubuntu image UUID: $uuid"
          echo "uuid=$uuid" >> "$GITHUB_OUTPUT"

      - name: Resolve leg configuration
        id: leg
        # One matrix entry = one combination of apps on one cluster leg. Map the leg
        # to its af-api URL; the ephemeral leg uses the per-run deploy job's NodePort.
        env:
          CLUSTER: ${{ matrix.cluster }}
        run: |
          case "$CLUSTER" in
            ephemeral) api_url="${{ needs.deploy-af-api.outputs.url }}" ;;
            dev)       api_url="https://api.dev.appfactory.ionos.com" ;;
            prod)      api_url="https://api.appfactory.ionos.com" ;;
            *) echo "unknown cluster leg: $CLUSTER" >&2; exit 1 ;;
          esac
          echo "api_url=$api_url" >> "$GITHUB_OUTPUT"

      - name: Write mTLS client cert for the leg
        # Both real-cluster legs hit an af-api mTLS ingress and present the
        # recipes-pipeline PUKI client cert for that cluster. umask 077 so the
        # private key is not world-readable in the job workspace. The ephemeral
        # leg talks to a plain-HTTP NodePort and needs no cert.
        if: ${{ matrix.cluster != 'ephemeral' }}
        env:
          CLUSTER: ${{ matrix.cluster }}
        run: |
          umask 077
          case "$CLUSTER" in
            dev)
              crt="$AF_RECIPES_MTLS_CLIENT_CRT_PEM_DEV"
              key="$AF_RECIPES_MTLS_CLIENT_KEY_PEM_DEV"
              ;;
            prod)
              crt="$AF_RECIPES_MTLS_CLIENT_CRT_PEM_PROD"
              key="$AF_RECIPES_MTLS_CLIENT_KEY_PEM_PROD"
              ;;
            *)
              echo "no client cert defined for cluster leg: $CLUSTER" >&2
              exit 1
              ;;
          esac
          if [ -z "$crt" ] || [ -z "$key" ]; then
            echo "mTLS client cert/key for the $CLUSTER leg is empty — check get-secrets" >&2
            exit 1
          fi
          printf '%s' "$crt" > /tmp/af_client.crt
          printf '%s' "$key" > /tmp/af_client.key

      - name: Reserve test IP
        # Reserves the VM's public IP before /compose exists to be able to
        # derive a routable base_domain (IF-1438) -- the sslip.io hostname
        # needs the IP up front, but IONOS only hands one out once the server
        # is created. Released in "Release test IP" below with if: always(),
        # independent of how compose/probe/imagetester turn out.
        id: reserve_ip
        env:
          IONOS_USERNAME: ${{ env.INSTALLTEST_DCD_USERNAME }}
          IONOS_PASSWORD: ${{ env.INSTALLTEST_DCD_PASSWORD }}
        run: |
          # Combination labels carry a '+' (e.g. immich+n8n), which has never
          # reached an IONOS block name before, so fold anything outside the
          # safe set to a dash.
          label="${{ matrix.label }}"
          ip_block_name="${label//[^A-Za-z0-9_-]/-}_${{ matrix.cluster }}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_ip"
          python3 scripts/reserve-test-ip.py --name "$ip_block_name"

      - name: Resolve base_domain
        id: domain
        # MUST stay after "Reserve test IP": the fall-through reads that step's output,
        # and a step reading a later step's output gets "" with no error.
        # Combination runs pass base_domain explicitly (af-test.invalid: RFC 2606-reserved,
        # so LE rejects the identifier at order creation — no rate-limit exposure, no cert
        # for a VM that lives minutes). Single-recipe runs fall back to the routable
        # sslip.io name derived from the IP reserved above (IF-1386).
        env:
          INPUT_BASE_DOMAIN: ${{ inputs.base_domain }}
          RESERVED_BASE_DOMAIN: ${{ steps.reserve_ip.outputs.base_domain }}
        run: |
          base_domain="${INPUT_BASE_DOMAIN:-$RESERVED_BASE_DOMAIN}"
          if [ -z "$base_domain" ]; then
            echo "::error::base_domain resolved empty — /compose would render no Traefik. Reserve test IP must run before this step." >&2
            exit 1
          fi
          echo "base_domain=${base_domain}" >> "$GITHUB_OUTPUT"
          echo "base_domain: ${base_domain}"

      - name: Generate cloud-init via /compose
        id: compose
        # Dev-cluster leg runs against pre-release af-api/recipes and only
        # exercises non-customer paths (mTLS, dev-mode). A recipe-test failure
        # there is a forward-compat signal, not a production gate — keep it
        # non-blocking so it never fails a production image build. See the
        # "Flag dev-cluster leg outcome" step below and test-results.
        continue-on-error: ${{ matrix.cluster == 'dev' }}
        env:
          CLUSTER: ${{ matrix.cluster }}
          APPS: ${{ matrix.apps }}
          LABEL: ${{ matrix.label }}
          BASE_DOMAIN: ${{ steps.domain.outputs.base_domain }}
          FINALIZE_DISABLED: ${{ inputs.finalize_disabled }}
        run: |
          keep_finalize_flag=""
          if [ "$FINALIZE_DISABLED" = "false" ]; then
            keep_finalize_flag="--keep-finalize"
          fi

          # Split into an array and expand as "${apps[@]}". Passing "$APPS" as one
          # quoted word hands argparse the single recipe name "immich n8n", which dies
          # as an unknown recipe — the size-1 case papered over this for as long as
          # every combination had exactly one member.
          read -ra apps <<< "$APPS"

          case "$CLUSTER" in
            ephemeral)
              # Dev-mode run: ephemeral af-api over plain-HTTP NodePort. The
              # per-run ed25519 pubkey is injected as the user-data verification
              # key; patch downgrades bootstrap_url https->http and switches on
              # dev mode. bootstrap_verification_key is a multiline PEM — GHA
              # expands it inline and bash keeps the quoted newlines as one arg.
              python3 scripts/call-compose.py \
                --api-url "${{ steps.leg.outputs.api_url }}" \
                --ssh-public-key "$(cat /tmp/vm_key.pub)" \
                --bootstrap-verification-key "${{ needs.deploy-af-api.outputs.bootstrap_verification_key }}" \
                --base-domain "$BASE_DOMAIN" \
                --root-password-file /tmp/vm_root_password \
                --use-staging-le \
                "${apps[@]}" | tee /tmp/cloudinit.yaml
              ;;
            dev)
              # Prod-mode dev-cluster leg: reach the real dev af-api and present the
              # recipes-pipeline PUKI client cert to its mTLS ingress; no user-data key
              # (the archive is signed by the real dev-cluster key, verified via the
              # baked key).
              python3 scripts/call-compose.py \
                --api-url "${{ steps.leg.outputs.api_url }}" \
                --ssh-public-key "$(cat /tmp/vm_key.pub)" \
                --client-cert /tmp/af_client.crt \
                --client-key /tmp/af_client.key \
                --base-domain "$BASE_DOMAIN" \
                --root-password-file /tmp/vm_root_password \
                --use-staging-le \
                "${apps[@]}" | tee /tmp/cloudinit.yaml
              ;;
            prod)
              # Prod-mode prod-cluster leg: reach the real prod af-api. The prod main
              # host is mTLS-required host-wide, so present the _PROD recipes client
              # cert exactly as the dev leg does — a certless request dies in the TLS
              # handshake, it does not get a 4xx. The always-trusted baked prod key
              # verifies the prod-signed archive and af-finalize runs for real
              # (production first-boot lifecycle).
              python3 scripts/call-compose.py \
                --api-url "${{ steps.leg.outputs.api_url }}" \
                --ssh-public-key "$(cat /tmp/vm_key.pub)" \
                --client-cert /tmp/af_client.crt \
                --client-key /tmp/af_client.key \
                --base-domain "$BASE_DOMAIN" \
                --root-password-file /tmp/vm_root_password \
                --use-staging-le \
                "${apps[@]}" | tee /tmp/cloudinit.yaml
              ;;
          esac

          # One patch invocation for every leg — the script maps the leg to what its
          # cloud-init needs: dev mode plus the https->http downgrade on the ephemeral
          # NodePort, dev mode with https kept on the dev cluster (so the production
          # image trusts the baked dev-cluster key), and normal mode on the prod
          # cluster, where only the .finalize-disabled sentinel is written. That is how
          # an explicit finalize_disabled request is honoured on the prod leg too;
          # --leg prod with finalize left running patches nothing.
          python3 scripts/patch-cloudinit-dev-mode.py \
            --leg "$CLUSTER" $keep_finalize_flag /tmp/cloudinit.yaml

          # Publish the bootstrap_url the VM will actually use. Downstream steps must
          # not derive it from the /compose host: with the Envoy host split, bootstrap
          # is served on a separate public host and the mTLS main host refuses a
          # certless request. This is the same value probe-bootstrap.py follows, read
          # after the patch so the ephemeral leg's https->http downgrade is included.
          bootstrap_url=$(python3 -c "import yaml; print(yaml.safe_load(open('/tmp/cloudinit.yaml'))['application_factory']['bootstrap_url'])")
          echo "bootstrap_url=$bootstrap_url" >> "$GITHUB_OUTPUT"

          cat /tmp/cloudinit.yaml

      - name: Verify the af-api host split
        # BLOCKING ON EVERY REAL-CLUSTER LEG, INCLUDING DEV — deliberately not
        # continue-on-error. The dev leg is advisory for *recipe* outcomes, because it
        # runs pre-release recipes against a pre-release af-api. A broken host split or
        # an mTLS gate that stopped enforcing is not a recipe outcome, it is our
        # infrastructure, and collapsing the two is how the dev leg sat green while its
        # bootstrap reachability check had been failing ever since the dev cluster moved
        # to Envoy Gateway. The prod cutover is what finally surfaced it.
        if: ${{ matrix.cluster != 'ephemeral' }}
        env:
          BOOTSTRAP_URL: ${{ steps.compose.outputs.bootstrap_url }}
          MAIN_URL: ${{ steps.leg.outputs.api_url }}
        run: |
          set -uo pipefail
          rc=0

          if [ -z "$BOOTSTRAP_URL" ]; then
            echo "::error::no bootstrap_url captured from /compose — cannot verify the host split" >&2
            exit 1
          fi

          # Probe certless and report BOTH curl's exit code and the HTTP status. The
          # verdict keys on curl's exit code, which is what distinguishes the layers:
          # 0 = handshake completed and HTTP answered, 6 = DNS, 7 = connect,
          # 28 = timeout, 35 = TLS, 56/55 = peer reset mid-request (what an Envoy
          # mTLS rejection looks like). http_code is logged for context.
          probe() {  # $1 url -> sets PROBE_EXIT and PROBE_CODE
            # This step runs under errexit — the job's `defaults.run.shell: bash`
            # resolves to `bash --noprofile --norc -eo pipefail {0}`. (It is NOT the
            # implicit default: this job is containerised, and without that `defaults`
            # block GHA would hand these steps to `sh -e`, i.e. dash.) A bare
            # `X=$(cmd)` adopts cmd's exit status, so a failing curl would kill the
            # step before the verdict below runs — including the expected mTLS
            # refusal. The && / || list keeps errexit out of it.
            PROBE_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$1") \
              && PROBE_EXIT=0 || PROBE_EXIT=$?
          }

          # The public bootstrap host must ANSWER a request carrying no client cert:
          # that is the only network position a customer VM ever has. A GET on the
          # POST-only endpoint is expected to be a 4xx — any HTTP answer proves the
          # handshake completed, which is the property under test.
          probe "$BOOTSTRAP_URL"
          if [ "$PROBE_EXIT" -ne 0 ]; then
            echo "::error::certless request to the bootstrap host never reached HTTP (${BOOTSTRAP_URL}): curl exit ${PROBE_EXIT}, http_code ${PROBE_CODE}. A VM cannot redeem its token, so first boot would fail. curl 6/7/28 points at DNS or routing for the bootstrap host; 35/55/56 means it is demanding a client cert it must not." >&2
            rc=1
          else
            echo "OK: bootstrap host answered a certless request with HTTP ${PROBE_CODE} (${BOOTSTRAP_URL})"
          fi

          # ...and the mTLS main host must REFUSE one. /api/v1/bootstrap on the main
          # host was certless-reachable under nginx via a per-path exemption; under
          # Envoy the SecurityPolicy covers the whole main route and it must not be.
          # Asserted from the runner rather than from the VM on purpose: the runner is
          # on the IP allowlist, so a rejection here isolates the mTLS gate instead of
          # being masked by the IP gate the VM would also hit.
          probe "${MAIN_URL}/api/v1/bootstrap"
          if [ "$PROBE_EXIT" -ne 0 ]; then
            echo "OK: mTLS main host refused a certless request as expected (curl exit ${PROBE_EXIT}) (${MAIN_URL}/api/v1/bootstrap)"
          else
            echo "::error::mTLS main host answered a certless request with HTTP ${PROBE_CODE} (${MAIN_URL}/api/v1/bootstrap) — the mTLS gate is not enforcing on the main route" >&2
            rc=1
          fi

          exit $rc

      - name: Probe /bootstrap with the JWT before booting the VM
        id: probe
        continue-on-error: ${{ matrix.cluster == 'dev' }}
        # Calls /compose and /bootstrap from a single Python process so the
        # token never goes through the shell. Rules out awk/jq quoting from
        # the earlier-observed "Token is malformed or cannot be decrypted"
        # we got back from variant 1.
        env:
          CLUSTER: ${{ matrix.cluster }}
          APPS: ${{ matrix.apps }}
          LABEL: ${{ matrix.label }}
          # Same base_domain passed to the real /compose call above — probe-bootstrap.py
          # makes its own separate /compose call, so without this its diagnostic
          # archive silently omits the Traefik block the real VM actually gets (IF-1386).
          BASE_DOMAIN: ${{ steps.domain.outputs.base_domain }}
        run: |
          # Both real-cluster legs need the cert: probe-bootstrap.py makes its own
          # /compose call against the mTLS main host. Its /bootstrap redemption
          # follows the cloud-init bootstrap_url and stays certless on every leg,
          # mirroring what a real VM does.
          cert_args=""
          if [ "$CLUSTER" != "ephemeral" ]; then
            cert_args="--client-cert /tmp/af_client.crt --client-key /tmp/af_client.key"
          fi

          read -ra apps <<< "$APPS"

          # The output path keys on LABEL, not APPS: a multi-app APPS contains spaces
          # and would produce several bogus filenames instead of one.
          python3 scripts/probe-bootstrap.py \
            --api-url "${{ steps.leg.outputs.api_url }}" \
            --ssh-public-key "$(cat /tmp/vm_key.pub)" \
            --bootstrap-output "/tmp/bootstrap-response-${LABEL}.tar.gz" \
            --base-domain "$BASE_DOMAIN" \
            --use-staging-le \
            $cert_args \
            "${apps[@]}"
      - uses: actions/upload-artifact@v7
        name: Upload bootstrap response as Artifact
        if: always()
        with:
          # Cluster in the name: a prod-mode run has two legs per combination, and
          # without it downloading the failed prod leg's artifact hands you the
          # dev leg's instead.
          # Replica suffix (empty outside replica mode): N replica legs share recipe
          # AND cluster, so without it every leg writes the same artifact name and
          # only one survives.
          name: bootstrap-response-${{ matrix.label }}-${{ matrix.cluster }}${{ matrix.replica && format('-r{0}', matrix.replica) || '' }}
          path: /tmp/bootstrap-response-${{ matrix.label }}.tar.gz
          archive: false
          if-no-files-found: warn
          retention-days: 30

      - name: Checkout if-image-tests
        # Same branch-then-main-fallback pattern as if-main-ubuntu-2604-af's
        # build_release.yaml test-install job. run-imagetester.py's ImageTester
        # invokes `python3 -m TestSuite` from the workflow cwd, so the test repo
        # must be on disk before that step, at the same relative path convention.
        id: image_tests_checkout
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: IONOS-Server-Technology/if-image-tests
          path: if-image-tests
          token: ${{ env.GH_APP_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Checkout if-image-tests (fallback to main)
        if: steps.image_tests_checkout.outcome == 'failure'
        uses: actions/checkout@v5
        with:
          repository: IONOS-Server-Technology/if-image-tests
          path: if-image-tests
          token: ${{ env.GH_APP_TOKEN }}

      - name: Generate the health-check config for this combination
        id: healthconf
        # One conf per combination, generated by scripts/gen-health-check-conf.py --
        # which is the definition of this suite; there is no committed config to fall
        # back on. A static one would have to assert a single $RECIPE_NAME, so on a
        # 3-app VM it would check one app and report green for the other two.
        env:
          APPS: ${{ matrix.apps }}
          BASE_DOMAIN: ${{ steps.domain.outputs.base_domain }}
          # Same value the Run ImageTester step exports as RECIPE_NAME. The generator
          # needs it to decide whether the served-cert check can pass, because that
          # check curls https://$RECIPE_NAME.$BASE_DOMAIN. Routed through env: because
          # a `combos` dispatch controls this label, and an expression interpolated
          # into a run block becomes shell source rather than data. (The Reserve test
          # IP step above still interpolates matrix.label directly; the combos input
          # validator rejects every shell metacharacter, so it is safe today.)
          LABEL: ${{ matrix.label }}
        run: |
          read -ra apps <<< "$APPS"
          # Must be written into tests/: [include_auto_inject] uses a relative path,
          # which the TestSuite resolves against the including conf's own directory,
          # and a missing include target exits hard before a single test runs.
          out=tests/recipe-health-check.combo.conf
          # Unconditional on every leg. Since IF-1385 the staging directory is a
          # property of the request, not of the deployment: every /compose call in
          # this workflow passes --use-staging-le (all three legs above, plus the
          # probe-bootstrap call), so af-api renders the staging caserver line into
          # the Traefik compose it hands back regardless of what env vars that
          # cluster's own deployment carries.
          python3 scripts/gen-health-check-conf.py \
            --base-domain "$BASE_DOMAIN" \
            --recipe-label "$LABEL" \
            --expect-le-staging \
            --output "$out" \
            "${apps[@]}"
          echo "config=$out" >> "$GITHUB_OUTPUT"
          echo "--- $out ---"
          cat "$out"

      - name: Run ImageTester
        id: imagetester
        continue-on-error: ${{ matrix.cluster == 'dev' }}
        env:
          IONOS_USERNAME: ${{ env.INSTALLTEST_DCD_USERNAME }}
          IONOS_PASSWORD: ${{ env.INSTALLTEST_DCD_PASSWORD }}
          IONOS_DATACENTER_ID: ${{ vars.IONOS_DATACENTER_ID }}
          # Overridable so a combination that needs more RAM than VPS 6-8-240 can be
          # dispatched against a bigger template without editing this file. The
          # literal stays as the last fallback: it is what every run used before the
          # input existed, so an unset input and an undefined repo variable must keep
          # landing on it rather than on an empty template id.
          IONOS_TEMPLATE_ID: ${{ inputs.template_id || vars.IONOS_TEMPLATE_ID || '2713068b-f0bb-441a-9bdc-b2961e81408b' }} # default: VPS 6-8-240
          # Combination label, for logging and for the tests that report which VM they
          # ran on. The per-app assertions do not read it — they have the app name
          # substituted into their section names at generation time. check-traefik-cert.sh
          # in if-image-tests does read it, as the host $RECIPE_NAME.$BASE_DOMAIN, which
          # is exactly why the generator emits the served-cert check only when this label
          # is itself a routable app id: Traefik routes <recipe-id>.<base_domain> and
          # nothing else, so a combination label (immich+n8n) or a custom one from a
          # `combos` dispatch (n8n-smoke) names a host no router matches.
          RECIPE_NAME: ${{ matrix.label }}
          # Exported ONCE, and from the same step that fed /compose. It is both expanded
          # inside the generated conf and read straight out of the process env by
          # check-traefik-cert.sh. It used to be exported twice under two names —
          # AF_BASE_DOMAIN from steps.domain and BASE_DOMAIN from steps.reserve_ip —
          # which on a combination run described two different domains: the explicitly
          # passed af-test.invalid and the sslip.io name of the reserved IP.
          BASE_DOMAIN: ${{ steps.domain.outputs.base_domain }}
          TEST_CONFIG: ${{ steps.healthconf.outputs.config }}
          # Used by the diagnostic SSH tests to verify the VM can reach af-api
          # (the per-run NodePort in dev mode, or the real cluster in prod mode).
          AF_API_URL: ${{ steps.leg.outputs.api_url }}/api/v1
          # The endpoint the VM actually redeems its token against. NOT derivable from
          # AF_API_URL: on both real clusters bootstrap lives on a separate public host,
          # while the mTLS main host refuses the certless request a VM makes.
          AF_BOOTSTRAP_URL: ${{ steps.compose.outputs.bootstrap_url }}
          FINALIZE_DISABLED: ${{ inputs.finalize_disabled }}
          IMAGE_ID: ${{ inputs.image_uuid || steps.image.outputs.uuid }}
          # No bootstrap-log endpoint is passed in: the forwarder on the VM derives it
          # from its own bootstrap_url by appending -log, so there is one address to
          # configure rather than two that can disagree.
          # Reuse the IP reserved in "Reserve test IP" instead of having
          # run-imagetester.py reserve its own -- that IP already went into
          # base_domain for /compose above, so the server must come up bound
          # to this exact address.
          RESERVED_SERVER_IP: ${{ steps.reserve_ip.outputs.ip }}
        run: |
          # Where to find the password that went to /compose, so the suite can
          # authenticate through the middleware. The path, not the value: TestSuite's
          # ShellExecutor copies the whole environment into every test process and logs
          # it at DEBUG, and these logs are uploaded as a 30-day artifact -- and add-mask
          # redacts console output only, never artifact contents. Handing over a path
          # means no later -v debug can turn this into a leak.
          export AF_ROOT_PASSWORD_FILE=/tmp/vm_root_password

          testsuite_exclude_flag=""
          if [ "$FINALIZE_DISABLED" != "false" ]; then
            # With af-finalize switched off it performs no scrub and no teardown, so
            # the FIN-marked tests — which assert exactly that those happened — would
            # always fail. They only make sense when finalize_disabled=false.
            testsuite_exclude_flag="--testsuite-exclude af_FIN_"
          fi
          python3 scripts/run-imagetester.py \
            --image-id "$IMAGE_ID" \
            --cloudinit /tmp/cloudinit.yaml \
            --ssh-keypair-private /tmp/vm_key \
            --ssh-keypair-public /tmp/vm_key.pub \
            --test-config "$TEST_CONFIG" \
            $testsuite_exclude_flag > "imagetester-output-${RECIPE_NAME}.log"

      - name: Release test IP
        # Counterpart to "Reserve test IP" -- must run regardless of whether
        # compose/probe/imagetester succeeded, failed, or never ran, so a
        # reserved block is never leaked into the (currently 128-IP) quota.
        if: ${{ always() && steps.reserve_ip.outcome == 'success' }}
        env:
          IONOS_USERNAME: ${{ env.INSTALLTEST_DCD_USERNAME }}
          IONOS_PASSWORD: ${{ env.INSTALLTEST_DCD_PASSWORD }}
        run: |
          python3 scripts/release-test-ip.py \
            --uuid "${{ steps.reserve_ip.outputs.uuid }}" \
            --name "${{ steps.reserve_ip.outputs.name }}"

      - uses: actions/upload-artifact@v7
        name: Upload Test Results as Artifact
        if: always()
        # if-no-files-found: error would hard-fail the leg when ImageTester
        # soft-failed on dev and produced no logs — keep it non-blocking there
        # too so the dev leg stays advisory.
        continue-on-error: ${{ matrix.cluster == 'dev' }}
        with:
          # Replica suffix (empty outside replica mode). Without it the N replica legs
          # collide on one name and overwrite: true silently leaves a single VM's
          # results behind — a destroyed run that still looks green.
          name: AppTestResults-${{ matrix.label }}-${{ matrix.cluster }}${{ matrix.replica && format('-r{0}', matrix.replica) || '' }}
          path: tests/af-logs/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Flag dev-cluster leg outcome (non-blocking)
        # The dev-cluster leg is advisory (pre-release control plane, non-customer
        # paths). Its recipe-test steps are continue-on-error, so surface any
        # failure loudly here instead of letting it silently pass.
        if: ${{ always() && matrix.cluster == 'dev' }}
        env:
          LABEL: ${{ matrix.label }}
        run: |
          if [ "${{ steps.compose.outcome }}" = "failure" ] \
             || [ "${{ steps.probe.outcome }}" = "failure" ] \
             || [ "${{ steps.imagetester.outcome }}" = "failure" ]; then
            msg="dev-cluster leg for ${LABEL} failed — non-blocking. Dev runs pre-release af-api/recipes; this is a forward-compat signal, not a production gate. The prod-cluster leg gates the build."
            echo "::warning::${msg}"
            {
              echo "### ⚠️ dev-cluster leg failed (non-blocking): ${LABEL}"
              echo "$msg"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "dev-cluster leg for ${LABEL} passed."
          fi

  bootstrap-log-verify:
    name: IF-1310 verify (bootstrap logs arrived and stayed attributable)
    needs: [deploy-af-api, test-recipes]
    # Runs whenever there is an ephemeral af-api to read the log off, which is every
    # dev-mode run -- not only the replica ones. !cancelled() rather than success():
    # a leg that failed is exactly when the arriving log matters most, and whether the
    # VM's log reached the API is the first thing worth knowing about that failure.
    if: ${{ !cancelled() && needs.deploy-af-api.result == 'success' }}
    runs-on:
      - ${{ vars.IF_DEFAULT_RUNNER }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Get CI secrets
        uses: IONOS-Server-Technology/af-ci-actions/.github/actions/get-secrets@main

      - name: Checkout python-dwh-image-build-algorithm
        uses: actions/checkout@v5
        with:
          repository: IONOS-Server-Technology/python-dwh-image-build-algorithm
          ref: main
          path: image-builder-src
          token: ${{ env.GH_APP_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ./image-builder-src

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.30.0

      - name: Assert the VMs' bootstrap logs arrived and stayed attributable
        env:
          KUBECONFIG_CONTENT: ${{ env.AF_CI_KUBECONFIG }}
          # Only the replica scenario asserts an exact count -- that is what booting N
          # identical VMs is for. On an ordinary run a leg can fail before its VM ever
          # boots, and demanding a count would report a logging failure for something
          # that never reached the logging.
          EXPECTED: ${{ inputs.bootstrap_log_replicas || '0' }}
        run: |
          # The evidence is af-api's own log, not a counter: nothing in the API holds
          # state. Reading the container log also makes the worker count irrelevant,
          # since all workers write to the same stdout.
          #
          # Must run before cleanup-af-api deletes the Deployment -- hence cleanup
          # depends on this job. Once the pod is gone its log is gone with it.
          #
          # --tail=-1 is essential: k8s_helper defaults to 1000 lines, and the first
          # run silently read only the tail. The install-log lines are sent before the
          # journal, so they fell outside the window and the check reported them as
          # missing when they had in fact arrived.
          python scripts/k8s_helper.py logs "${{ needs.deploy-af-api.outputs.name }}" \
            --tail=-1 > /tmp/af-api-pod.log
          # No pipe into tee: the pipeline's status would be tee's, so a failed check
          # left the job green. Write the summary first, then let the exit code stand.
          expect_flag=""
          if [ "${EXPECTED:-0}" -gt 0 ] 2>/dev/null; then
            expect_flag="--expect $EXPECTED"
          fi
          python3 scripts/verify_bootstrap_log.py $expect_flag < /tmp/af-api-pod.log \
            > /tmp/bootstrap-log-verify.txt 2>&1 || verify_rc=$?
          cat /tmp/bootstrap-log-verify.txt
          cat /tmp/bootstrap-log-verify.txt >> "$GITHUB_STEP_SUMMARY"
          exit "${verify_rc:-0}"

      - uses: actions/upload-artifact@v7
        name: Upload af-api pod log
        if: always()
        with:
          name: bootstrap-log-af-api-pod-log
          path: /tmp/af-api-pod.log
          if-no-files-found: warn
          retention-days: 30

  cleanup-af-api:
    name: Cleanup af-api deployment
    # bootstrap-log-verify included so the ephemeral af-api survives until its log has
    # been read -- that log IS the evidence, and it dies with the pod. always() below
    # still runs cleanup when the verify job is skipped (every non-IF-1310 run) or
    # failed, so nothing can leak the deployment.
    needs: [deploy-af-api, test-recipes, bootstrap-log-verify]
    if: always() && needs.deploy-af-api.result == 'success'
    runs-on:
      - ${{ vars.IF_DEFAULT_RUNNER }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Get CI secrets
        uses: IONOS-Server-Technology/af-ci-actions/.github/actions/get-secrets@main

      - name: Checkout python-dwh-image-build-algorithm
        uses: actions/checkout@v5
        with:
          repository: IONOS-Server-Technology/python-dwh-image-build-algorithm
          ref: main
          path: image-builder-src
          token: ${{ env.GH_APP_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ./image-builder-src

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.30.0

      - name: Dump af-api pod logs and metadata
        env:
          KUBECONFIG_CONTENT: ${{ env.AF_CI_KUBECONFIG }}
        run: |
          python scripts/k8s_helper.py describe "${{ needs.deploy-af-api.outputs.name }}" || true
          python scripts/k8s_helper.py logs "${{ needs.deploy-af-api.outputs.name }}" || true

      - name: Delete af-api Deployment + Service
        env:
          KUBECONFIG_CONTENT: ${{ env.AF_CI_KUBECONFIG }}
        run: |
          python scripts/k8s_helper.py delete \
            "deployment/${{ needs.deploy-af-api.outputs.name }}" \
            "svc/${{ needs.deploy-af-api.outputs.name }}"

  test-results:
    name: Report Test Results
    runs-on:
      - ${{ vars.IF_DEFAULT_RUNNER }}
    needs: [detect-changed-recipes, test-recipes]
    if: always()
    steps:
      - name: Check test status
        env:
          # Via env, not ${{ }}: the value carries recipe names that originate in
          # the workflow_dispatch input, and the shell single-quoting below would
          # not survive one containing a quote.
          #
          # Combinations, not detected recipes: a dispatch that passes `combos` or
          # `sizes` tests VMs regardless of what changed, so gating the no-op on the
          # detected-recipe count would report "nothing to do" — and exit 0 — for a
          # run whose combinations had in fact just failed.
          COMBOS_JSON: ${{ needs.detect-changed-recipes.outputs.combos }}
        run: |
          if [ "${{ needs.detect-changed-recipes.result }}" != "success" ]; then
            echo "Recipe detection failed"
            exit 1
          fi
          # An empty matrix means nothing was in scope (e.g. only disabled recipes
          # changed). That's a clean no-op, not a failure — test-recipes is 'skipped'
          # in that case.
          count=$(echo "$COMBOS_JSON" | jq 'length' 2>/dev/null || echo 0)
          if [ "${count:-0}" = "0" ]; then
            echo "No combinations to test — nothing to do."
            exit 0
          fi
          if [ "${{ needs.test-recipes.result }}" == "success" ]; then
            echo "All recipe tests passed!"
            exit 0
          else
