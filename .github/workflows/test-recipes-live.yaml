name: Test Recipes Live

on:
  pull_request:
    branches: [main]
    paths:
      - "recipes/**"
  workflow_dispatch:
    inputs:
      recipes:
        description: "Comma-separated recipe names to test (e.g. n8n,ollama). Leave empty to test all."
        required: false
        default: ""
      ssh_only:
        description: "If true, use minimal cloud-init (SSH test only, no app install)"
        required: false
        default: "false"

jobs:
  detect-changed-recipes:
    name: Detect Changed Recipes
    runs-on: ubuntu-latest
    outputs:
      recipes: ${{ steps.detect.outputs.recipes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed recipe directories
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.recipes }}" ]; then
            # Manual trigger with explicit recipe list
            recipes=$(echo "${{ inputs.recipes }}" | tr ',' '\n' | jq -c -R -s 'split("\n") | map(select(length > 0))')
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger with no input — test all recipes
            recipes=$(ls -d recipes/*/ | xargs -n1 basename | jq -c -R -s 'split("\n") | map(select(length > 0))')
          else
            # PR trigger — detect changed recipes
            changed=$(git diff --name-only origin/main...HEAD)
            recipes=$(echo "$changed" | grep -E '^recipes/[^/]+/' | cut -d/ -f2 | sort -u | jq -c -R -s 'split("\n") | map(select(length > 0))' || echo '[]')
          fi

          echo "recipes=$recipes" >> $GITHUB_OUTPUT
          echo "Recipes to test: $recipes"

  test-recipes:
    name: Test Recipe - ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    needs: detect-changed-recipes
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        recipe: ${{ fromJson(needs.detect-changed-recipes.outputs.recipes) }}
      fail-fast: false
    env:
      VM_NAME: "af-recipe-${{ matrix.recipe }}-${{ github.run_id }}-${{ strategy.job-index }}"
    steps:
      - uses: actions/checkout@v4

      - name: Get CI secrets
        uses: IONOS-Server-Technology/if-ci-actions/.github/actions/get-secrets@main

      - name: Checkout af-core
        uses: actions/checkout@v4
        with:
          repository: IONOS-Server-Technology/af-core
          path: af-core-src
          token: ${{ env.GH_APP_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install af-core
        run: pip install ./af-core-src

      - name: Generate cloud-init
        id: cloudinit
        run: |
          if [ "${{ inputs.ssh_only }}" = "true" ]; then
            echo "#cloud-config" > /tmp/cloudinit.yaml
            echo "package_update: false" >> /tmp/cloudinit.yaml
            echo "Generated minimal cloud-init (SSH test only)"
          else
            python scripts/render-cloudinit.py recipes/${{ matrix.recipe }} > /tmp/cloudinit.yaml
            echo "Generated cloud-init YAML for recipe: ${{ matrix.recipe }}"
          fi

      - name: Save cloud-init to file
        id: encode
        run: |
          ssh-keygen -t ed25519 -f /tmp/vm_key -N "" -q
          pub_key=$(cat /tmp/vm_key.pub)
          sed -i "1s|.*|#cloud-config|" /tmp/cloudinit.yaml
          echo "ssh_authorized_keys:" >> /tmp/cloudinit.yaml
          echo "  - ${pub_key}" >> /tmp/cloudinit.yaml
          cp /tmp/cloudinit.yaml /tmp/cloudinit.txt
          echo "cloudinit_file=/tmp/cloudinit.txt" >> $GITHUB_OUTPUT

      - name: Discover IONOS Datacenter
        id: datacenter
        run: |
          dc_id="${{ secrets.IONOS_DATACENTER_ID }}"

          if [ -z "$dc_id" ]; then
            echo "IONOS_DATACENTER_ID not set, discovering from API..."
            dc_response=$(curl -s \
              -u "${{ env.INSTALLTEST_DCD_USERNAME }}:${{ env.INSTALLTEST_DCD_PASSWORD }}" \
              "https://api.ionos.com/cloudapi/v6/datacenters?pretty=false&depth=1")
            dc_id=$(echo "$dc_response" | jq -r '.items[0].id // empty')
            echo "Available datacenters:"
            echo "$dc_response" | jq -r '.items[] | "\(.id) \(.properties.name) \(.properties.location)"' 2>/dev/null || echo "none"
          fi

          if [ -z "$dc_id" ]; then
            echo "ERROR: No datacenter available"
            exit 1
          fi

          dc_location=$(echo "$dc_response" | jq -r --arg id "$dc_id" '.items[] | select(.id == $id) | .properties.location' 2>/dev/null || \
            curl -s -u "${{ env.INSTALLTEST_DCD_USERNAME }}:${{ env.INSTALLTEST_DCD_PASSWORD }}" \
            "https://api.ionos.com/cloudapi/v6/datacenters/$dc_id" | jq -r '.properties.location')

          echo "datacenter_id=$dc_id" >> $GITHUB_OUTPUT
          echo "datacenter_location=$dc_location" >> $GITHUB_OUTPUT
          echo "Using datacenter: $dc_id with location: $dc_location"

      - name: Find or create public LAN
        id: lan
        run: |
          dc_id="${{ steps.datacenter.outputs.datacenter_id }}"

          # List LANs in datacenter and find a public one
          lans=$(curl -s \
            -u "${{ env.INSTALLTEST_DCD_USERNAME }}:${{ env.INSTALLTEST_DCD_PASSWORD }}" \
            "https://api.ionos.com/cloudapi/v6/datacenters/${dc_id}/lans?depth=1")

          echo "=== Available LANs ==="
          echo "$lans" | jq -r '.items[] | "\(.id) public=\(.properties.public) name=\(.properties.name)"' 2>/dev/null || echo "none"

          lan_id=$(echo "$lans" | jq -r '.items[] | select(.properties.public == true) | .id' 2>/dev/null | head -1)

          if [ -z "$lan_id" ]; then
            echo "No public LAN found, creating one..."
            lan_response=$(curl -s -X POST \
              -u "${{ env.INSTALLTEST_DCD_USERNAME }}:${{ env.INSTALLTEST_DCD_PASSWORD }}" \
              -H "Content-Type: application/json" \
              "https://api.ionos.com/cloudapi/v6/datacenters/${dc_id}/lans" \
              -d '{"properties":{"name":"af-test-public-lan","public":true}}')
            lan_id=$(echo "$lan_response" | jq -r '.id')
            echo "Created public LAN: $lan_id"
          fi

          if [ -z "$lan_id" ] || [ "$lan_id" = "null" ]; then
            echo "ERROR: Could not find or create public LAN"
            exit 1
          fi

          echo "lan_id=$lan_id" >> $GITHUB_OUTPUT
          echo "Using public LAN: $lan_id"

      - name: Get Ubuntu 22.04 image UUID
        id: image
        run: |
          echo "=== Raw IONOS API response (first 500 chars) ==="
          api_response=$(curl -s \
            -u "${{ env.INSTALLTEST_DCD_USERNAME }}:${{ env.INSTALLTEST_DCD_PASSWORD }}" \
            "https://api.ionos.com/cloudapi/v6/images?pretty=false&depth=1")
          echo "$api_response" | head -c 500

          echo ""
          echo "=== Filtering for Ubuntu 22.04 ==="
          image_uuid=$(echo "$api_response" | jq -r '
            .items[]?
            | select(.properties.imageType == "HDD")
            | select(.properties.licenceType == "LINUX")
            | select(.properties.location == "${{ steps.datacenter.outputs.datacenter_location }}")
            | select(.properties.name | ascii_downcase | contains("ubuntu"))
            | select(.properties.name | contains("22"))
            | .id
          ' 2>/dev/null | head -1)

          if [ -z "$image_uuid" ]; then
            echo "ERROR: Could not find Ubuntu 22.04 image"
            echo "=== All image names ==="
            echo "$api_response" | jq -r '.items[]?.properties.name' 2>/dev/null | head -30 || echo "no items in response"
            exit 1
          fi

          echo "image_uuid=$image_uuid" >> $GITHUB_OUTPUT
          echo "Found Ubuntu 22.04 image: $image_uuid"

      - name: Install ionosctl
        run: |
          curl -sL https://github.com/ionos-cloud/ionosctl/releases/download/v6.9.9/ionosctl-6.9.9-linux-amd64.tar.gz -o /tmp/ionosctl.tar.gz
          tar -xzf /tmp/ionosctl.tar.gz -C /usr/local/bin/ ionosctl
          chmod +x /usr/local/bin/ionosctl
          ionosctl version

      - name: Provision test VM via IONOS API
        id: provision
        run: |
          echo "Creating VM: ${{ env.VM_NAME }}"

          cloudinit_b64=$(base64 -w 0 < /tmp/cloudinit.yaml)

          response=$(curl -s -X POST \
            -u "${{ env.INSTALLTEST_DCD_USERNAME }}:${{ env.INSTALLTEST_DCD_PASSWORD }}" \
            -H "Content-Type: application/json" \
            "https://api.ionos.com/cloudapi/v6/datacenters/${{ steps.datacenter.outputs.datacenter_id }}/servers" \
            -d "{
              \"properties\": {
                \"name\": \"${{ env.VM_NAME }}\",
                \"cores\": 2,
                \"ram\": 2048
              },
              \"entities\": {
                \"volumes\": {
                  \"items\": [{
                    \"properties\": {
                      \"name\": \"vol-${{ env.VM_NAME }}\",
                      \"size\": 50,
                      \"type\": \"SSD\",
                      \"image\": \"${{ steps.image.outputs.image_uuid }}\",
                      \"userData\": \"${cloudinit_b64}\"
                    }
                  }]
                },
                \"nics\": {
                  \"items\": [{
                    \"properties\": {
                      \"name\": \"nic-${{ env.VM_NAME }}\",
                      \"lan\": ${{ steps.lan.outputs.lan_id }},
                      \"dhcp\": true
                    }
                  }]
                }
              }
            }")

          echo "API response: $(echo $response | jq -r '.id // .httpStatus // "unknown"')"

          vm_id=$(echo "$response" | jq -r '.id')
          if [ -z "$vm_id" ] || [ "$vm_id" = "null" ]; then
            echo "ERROR: VM creation failed"
            echo "$response" | jq .
            exit 1
          fi

          echo "vm_id=$vm_id" >> $GITHUB_OUTPUT
          echo "VM created with ID: $vm_id"

      - name: Wait for VM to boot and SSH ready
        id: wait
        run: |
          max_attempts=120
          attempt=0
          vm_ip=""

          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))

            # Get VM details via curl
            curl -s \
              -u "${{ env.INSTALLTEST_DCD_USERNAME }}:${{ env.INSTALLTEST_DCD_PASSWORD }}" \
              "https://api.ionos.com/cloudapi/v6/datacenters/${{ steps.datacenter.outputs.datacenter_id }}/servers/${{ steps.provision.outputs.vm_id }}?depth=5" \
              > /tmp/vm_details.json

            # Extract primary IP
            vm_ip=$(jq -r '.entities.nics.items[0].properties.ips[0]' /tmp/vm_details.json 2>/dev/null || echo "")

            if [ -n "$vm_ip" ] && [ "$vm_ip" != "null" ]; then
              echo "VM IP: $vm_ip"

              # Try SSH connection
              if timeout 5 ssh -o StrictHostKeyChecking=no \
                   -o UserKnownHostsFile=/dev/null \
                   -i /tmp/vm_key \
                   root@$vm_ip "echo 'SSH ready'" 2>/dev/null; then
                echo "VM is ready for testing"
                echo "vm_ip=$vm_ip" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi

            echo "Waiting for VM to boot... (attempt $attempt/$max_attempts)"
            sleep 10
          done

          echo "ERROR: VM failed to boot after $max_attempts attempts"
          exit 1

      - name: Debug VM state
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -i /tmp/vm_key \
              root@${{ steps.wait.outputs.vm_ip }} \
              "echo '=== FULL cloud-init-output.log ===' && cat /var/log/cloud-init-output.log 2>/dev/null || echo 'no cloud-init-output.log'; echo '=== cloud-init.log errors ===' && grep -i 'error\|fail\|warn' /var/log/cloud-init.log 2>/dev/null | tail -30 || echo 'no cloud-init.log'; echo '=== runcmd script ===' && cat /var/lib/cloud/instance/scripts/runcmd 2>/dev/null || echo 'no runcmd script'; echo '=== Files in /opt ===' && ls -la /opt/ 2>/dev/null; echo '=== Docker status ===' && docker ps -a 2>/dev/null || echo 'docker not available'; echo '=== systemd status ===' && systemctl is-system-running 2>/dev/null || true; echo '=== /etc/cloud/cloud.cfg (final_modules) ===' && grep -A 50 'cloud_final_modules\|final_modules' /etc/cloud/cloud.cfg 2>/dev/null || echo 'no cloud.cfg'; echo '=== cloud-init.log (last 50 lines) ===' && tail -50 /var/log/cloud-init.log 2>/dev/null || echo 'no cloud-init.log'" || echo "SSH connection failed for debug"

      - name: Run health-check script
        id: health
        run: |
          recipe_name="${{ matrix.recipe }}"

          # Wait for cloud-init to complete
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -i /tmp/vm_key \
              root@${{ steps.wait.outputs.vm_ip }} \
              "cloud-init status --wait" || true

          # Copy health-check script to VM
          scp -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -i /tmp/vm_key \
              "recipes/$recipe_name/health-check.sh" \
              root@${{ steps.wait.outputs.vm_ip }}:/tmp/health-check.sh

          # Execute health-check on VM
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -i /tmp/vm_key \
              root@${{ steps.wait.outputs.vm_ip }} \
              "bash -x /tmp/health-check.sh"

      - name: Cleanup VM (always)
        if: always()
        run: |
          if [ -n "${{ steps.provision.outputs.vm_id }}" ]; then
            echo "Destroying VM: ${{ env.VM_NAME }}"
            curl -s -X DELETE \
              -u "${{ env.INSTALLTEST_DCD_USERNAME }}:${{ env.INSTALLTEST_DCD_PASSWORD }}" \
              "https://api.ionos.com/cloudapi/v6/datacenters/${{ steps.datacenter.outputs.datacenter_id }}/servers/${{ steps.provision.outputs.vm_id }}?deleteVolumes=true" \
              || true
          fi

  test-results:
    name: Report Test Results
    runs-on: ubuntu-latest
    needs: [test-recipes]
    if: always()
    steps:
      - name: Check test status
        run: |
          if [ "${{ needs.test-recipes.result }}" == "success" ]; then
            echo "All recipe tests passed!"
            exit 0
          else
            echo "Some recipe tests failed"
            exit 1
          fi
