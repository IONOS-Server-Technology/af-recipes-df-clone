name: Test Recipes Live

on:
  push:
    branches: ["feature/IF-547-**"]
  pull_request:
    branches: [main]
    paths:
      - "recipes/**"
  workflow_dispatch:
    inputs:
      recipes:
        description: "Comma-separated recipe names (leave empty for all changed)"
        required: false
        default: ""

jobs:
  detect-changed-recipes:
    name: Detect Changed Recipes
    runs-on:
      - ${{ vars.IF_DEFAULT_RUNNER }}
    outputs:
      recipes: ${{ steps.detect.outputs.recipes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed recipe directories
        id: detect
        env:
          FOCUS_RECIPE: uptime-kuma
        run: |
          if [ -n "$FOCUS_RECIPE" ]; then
            recipes="[\"$FOCUS_RECIPE\"]"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.recipes }}" ]; then
            recipes=$(echo "${{ inputs.recipes }}" | tr ',' '\n' | jq -c -R -s 'split("\n") | map(select(length > 0))')
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            recipes=$(ls -d recipes/*/ | xargs -n1 basename | jq -c -R -s 'split("\n") | map(select(length > 0))')
          else
            changed=$(git diff --name-only origin/main...HEAD)
            recipes=$(echo "$changed" | grep -E '^recipes/[^/]+/' | cut -d/ -f2 | sort -u | jq -c -R -s 'split("\n") | map(select(length > 0))' || echo '[]')
          fi
          echo "recipes=$recipes" >> $GITHUB_OUTPUT

  trigger-af-api-build:
    name: Trigger af-api image build
    # TEMP: skipped while we iterate on pipeline plumbing. The current
    # branch already has an af-api image at the expected Harbor tag from
    # earlier builds. Remove this `if` to re-enable per-push rebuilds.
    if: false
    runs-on:
      - ${{ vars.IF_DEFAULT_RUNNER }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get CI secrets
        uses: IONOS-Server-Technology/if-ci-actions/.github/actions/get-secrets@main

      - name: Resolve af-api branch ref
        id: af-api-ref
        run: |
          branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          if git ls-remote --exit-code \
              "https://x-access-token:${GH_APP_TOKEN}@github.com/IONOS-Server-Technology/af-api.git" \
              "refs/heads/${branch}" > /dev/null 2>&1; then
            echo "value=${branch}" >> "$GITHUB_OUTPUT"
          else
            echo "value=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: IONOS-Server-Technology/trigger-workflow-and-wait@v1.6.7
        with:
          owner: IONOS-Server-Technology
          repo: af-api
          github_token: ${{ env.GH_APP_TOKEN }}
          app_id: ${{ env.GH_APP_ID }}
          app_private_key: ${{ env.GH_APP_PRIVATE_KEY }}
          workflow_file_name: test.yaml
          ref: ${{ steps.af-api-ref.outputs.value }}
          client_payload: >-
            {"af_recipes_ref": "${{ github.event.pull_request.head.ref || github.ref_name }}"}

  deploy-af-api:
    name: Deploy af-api for branch
    needs: trigger-af-api-build
    if: always() && (needs.trigger-af-api-build.result == 'success' || needs.trigger-af-api-build.result == 'skipped')
    runs-on:
      - ${{ vars.IF_DEFAULT_RUNNER }}
    permissions:
      id-token: write
      contents: read
    outputs:
      name: ${{ steps.ref.outputs.name }}
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Get CI secrets
        uses: IONOS-Server-Technology/af-ci-actions/.github/actions/get-secrets@feature/IF-547-k8s-kubeconfig-secret

      - name: Checkout python-dwh-image-build-algorithm
        uses: actions/checkout@v4
        with:
          repository: IONOS-Server-Technology/python-dwh-image-build-algorithm
          ref: feature/ionostestvm-image-id
          path: image-builder-src
          token: ${{ env.GH_APP_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ./image-builder-src

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Compute deployment name and image tag from branch ref
        id: ref
        run: |
          raw="${{ github.event.pull_request.head.ref || github.ref_name }}"
          safe=$(echo "$raw" | tr '[:upper:]' '[:lower:]' | sed 's|/|-|g' | sed 's/[^a-z0-9-]/-/g' | sed 's/-\+/-/g' | sed 's/^-*//' | sed 's/-*$//')
          name="af-api-${safe:0:55}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$safe" >> "$GITHUB_OUTPUT"

      - name: Ensure Harbor pull secret
        env:
          KUBECONFIG_CONTENT: ${{ env.AF_CI_KUBECONFIG }}
          HARBOR_USERNAME: ${{ env.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ env.HARBOR_PASSWORD }}
        run: python scripts/k8s_helper.py ensure-pull-secret harbor.infra.cluster.ionos.com

      - name: Deploy af-api Deployment + Service
        env:
          KUBECONFIG_CONTENT: ${{ env.AF_CI_KUBECONFIG }}
        run: |
          python scripts/k8s_helper.py deploy \
            "${{ steps.ref.outputs.name }}" \
            "harbor.infra.cluster.ionos.com/imagefactory/af-api:${{ steps.ref.outputs.tag }}"

      - name: Wait for rollout
        env:
          KUBECONFIG_CONTENT: ${{ env.AF_CI_KUBECONFIG }}
        run: python scripts/k8s_helper.py rollout-status "${{ steps.ref.outputs.name }}"

      - name: Diagnose rollout failure
        if: failure()
        env:
          KUBECONFIG_CONTENT: ${{ env.AF_CI_KUBECONFIG }}
        run: |
          python scripts/k8s_helper.py describe "${{ steps.ref.outputs.name }}"

      - name: Get af-api ClusterIP URL
        id: url
        env:
          KUBECONFIG_CONTENT: ${{ env.AF_CI_KUBECONFIG }}
        run: |
          url=$(python scripts/k8s_helper.py get-url "${{ steps.ref.outputs.name }}" 8000)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify af-api reachable from runner
        run: |
          set -x
          url="${{ steps.url.outputs.url }}"
          for i in $(seq 1 15); do
            if curl -sf -m 5 "${url}/api/v1/health"; then
              echo "af-api reachable at $url after attempt $i"
              exit 0
            fi
            sleep 2
          done
          echo "af-api NOT reachable at $url" >&2
          exit 1

  test-recipes:
    name: Test Recipe - ${{ matrix.recipe }}
    needs: deploy-af-api
    # always() is required for the if to override GitHub's auto-skip when
    # a transitive ancestor (trigger-af-api-build) is SKIPPED. Without a
    # status function, the explicit condition isn't even evaluated.
    if: always() && needs.deploy-af-api.result == 'success'
    runs-on:
      - ${{ vars.IF_DEFAULT_RUNNER }}
    permissions:
      id-token: write
      contents: read
    strategy:
      # TEMP: hardcoded while debugging the e2e path. Restore the
      # detect-changed-recipes-driven matrix once the pipeline is green.
      matrix:
        recipe: [uptime-kuma]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Get CI secrets
        uses: IONOS-Server-Technology/if-ci-actions/.github/actions/get-secrets@main

      - name: Checkout python-dwh-image-build-algorithm
        uses: actions/checkout@v4
        with:
          repository: IONOS-Server-Technology/python-dwh-image-build-algorithm
          ref: feature/ionostestvm-image-id
          path: image-builder-src
          token: ${{ env.GH_APP_TOKEN }}

      - name: Checkout python-dwh-testsuite
        uses: actions/checkout@v4
        with:
          repository: IONOS-Server-Technology/python-dwh-testsuite
          path: testsuite-src
          token: ${{ env.GH_APP_TOKEN }}

      - name: Install ionosctl
        run: |
          curl -sL https://github.com/ionos-cloud/ionosctl/releases/download/v6.9.9/ionosctl-6.9.9-linux-amd64.tar.gz -o /tmp/ionosctl.tar.gz
          sudo tar -xzf /tmp/ionosctl.tar.gz -C /usr/local/bin/ ionosctl
          sudo chmod +x /usr/local/bin/ionosctl

      # ImageBuilder.Util.ImageDownloader does `from sh import aws, qemu_img`
      # at import-time, so both CLIs must be on PATH before run-imagetester.py
      # can even import the module. The IF runner image does not bundle them.
      # aws install copied from if-operative-docker-image (1-BaseImage/Dockerfile):
      # awscli v2 downloaded from upstream, GPG-verified, installed into
      # /usr/local/bin.
      - name: Install qemu-utils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-utils

      - name: Install awscli v2
        working-directory: /tmp
        run: |
          curl -sS "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.34.1.zip" -o awscliv2.zip
          curl -sS "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.34.1.zip.sig" -o awscliv2.sig
          cat > aws-cli-pubkey.asc <<'PUBKEY'
