          PUBKEY
          gpg --import aws-cli-pubkey.asc
          gpg --verify awscliv2.sig awscliv2.zip
          unzip -qq awscliv2.zip
          sudo ./aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update
          aws --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install ./image-builder-src ./testsuite-src

      - name: Generate SSH keypair
        run: |
          ssh-keygen -t ed25519 -N "" -f /tmp/vm_key -q
          echo "SSH_KEY_ABSPATH=/tmp/vm_key" >> "$GITHUB_ENV"

      - name: Pin Ubuntu image UUID
        id: image
        # Hardcoded HDD + cloud-init-compatible Ubuntu image. Restore the
        # ionosctl-based discovery once it filters on imageType=HDD and
        # cloudInit!=NONE.
        run: echo "uuid=c20bbf54-4e86-11f1-8e50-0ebdf53ef869" >> "$GITHUB_OUTPUT"

      - name: Generate cloud-init via /compose
        run: |
          python scripts/call-compose.py \
            --api-url "${{ needs.deploy-af-api.outputs.url }}" \
            --ssh-public-key "$(cat /tmp/vm_key.pub)" \
            "${{ matrix.recipe }}" > /tmp/cloudinit.yaml

