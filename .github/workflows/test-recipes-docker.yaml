name: Test Recipes (Docker)

# Phase 1 CI path: runs recipes locally via docker compose on the GitHub runner.
# No VM provisioning needed — results available in ~2-5 min vs ~10-15 min for live VM tests.
# Phase 2 (CoreVPS live VM) is handled by test-recipes-live.yaml.

on:
  pull_request:
    branches: [main]
    paths:
      - "recipes/**"
  workflow_dispatch:
    inputs:
      recipes:
        description: "Comma-separated recipe names to test (empty = changed or pilot set)"
        required: false
        default: ""

jobs:
  detect:
    name: Detect recipes to test
    runs-on:
      - ${{ vars.IF_DEFAULT_RUNNER }}
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build test matrix
        id: build
        run: |
          is_docker_compose_recipe() { [ -f "recipes/$1/docker-compose.yaml" ]; }

          filter_compose_recipes() {
            local filtered="[]"
            while IFS= read -r r; do
              [ -n "$r" ] || continue
              if is_docker_compose_recipe "$r"; then
                filtered=$(printf '%s' "$filtered" | jq -c --arg r "$r" '. + [$r]')
              else
                echo "Skipping non-docker-compose recipe: $r" >&2
              fi
            done < <(printf '%s' "$1" | jq -r '.[]')
            printf '%s' "$filtered"
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.recipes }}" ]; then
            candidates=$(echo "${{ inputs.recipes }}" | tr ',' '\n' | jq -c -R -s 'split("\n") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
            candidates=$(echo "$changed" \
              | grep -E '^recipes/[^/]+/' | cut -d/ -f2 | sort -u \
              | jq -c -R -s 'split("\n") | map(select(length > 0))' || echo '[]')
          else
            # workflow_dispatch without input: pilot set
            candidates='["n8n","portainer","ollama"]'
          fi
          recipes=$(filter_compose_recipes "$candidates")

          count=$(echo "$recipes" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "No docker-compose recipes changed."
            echo "matrix=" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"recipe\":$(echo "$recipes")}" >> "$GITHUB_OUTPUT"
            echo "Recipes to test: $recipes"
          fi

  test:
    name: Test ${{ matrix.recipe }} (docker)
    needs: detect
    if: ${{ needs.detect.outputs.matrix != '' }}
    runs-on:
      - ${{ vars.IF_DEFAULT_RUNNER }}
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v5

      - name: Get CI secrets
        uses: IONOS-Server-Technology/if-ci-actions/.github/actions/get-secrets@main

      - name: Pick af-api ref (PR branch if it exists, else main)
        id: af_api_ref
        env:
          PR_BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_APP_TOKEN: ${{ env.GH_APP_TOKEN }}
        run: |
          # Refuse anything that isn't a legal git branch name.
          if [[ ! "$PR_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid branch name '$PR_BRANCH' — falling back to main"
            echo "ref=main" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GH_APP_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/IONOS-Server-Technology/af-api/branches/$PR_BRANCH")
          if [ "$status" = "200" ]; then
            echo "af-api has branch '$PR_BRANCH' — using it"
            echo "ref=$PR_BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "af-api branch lookup returned HTTP $status — falling back to main"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout af-api
        uses: actions/checkout@v5
        with:
          repository: IONOS-Server-Technology/af-api
          path: af-api-src
          ref: ${{ steps.af_api_ref.outputs.ref }}
          token: ${{ env.GH_APP_TOKEN }}

      - uses: astral-sh/setup-uv@v7

      - name: Install the af-validate CLI from af-api
        run: |
          # The validator used to live in af-core; it is now af-api's in-tree
          # af_api.core package (IF-1327), installed via af-api's *lean base* —
          # no `server` extra, so none of the FastAPI stack is pulled in here.
          #
          # uv rather than setup-python: af-api requires Python 3.14 and this
          # runner's tool cache only carries 3.12. uv downloads the interpreter
          # itself, which is how af-api's own CI gets 3.14.
          uv venv --python 3.14 .venv-af-api
          # The `logo` extra adds resvg-py + pillow, which the IF-1416 logo spec
          # rules need. --require-logo-render below fails if it is missing.
          uv pip install --python .venv-af-api './af-api-src[logo]'
          # Put the venv first on PATH so both `af-validate` and the inline
          # `python3` heredocs below resolve against it (they need pyyaml, which
          # is one of af-api's base dependencies).
          echo "$PWD/.venv-af-api/bin" >> "$GITHUB_PATH"

      - name: Validate recipe schema
        run: af-validate recipe recipes/${{ matrix.recipe }} --require-logo-render

      # Two steps below replace a single "Generate test .env" step that substituted
      # {{PLACEHOLDER}} tokens with generated values of its own (IF-1417). That made the
      # test exercise a configuration production never produces — nothing has substituted
      # placeholders since IF-944 — so no placeholder defect could ever fail here. These
      # two do what the real install does instead: ship the template verbatim, add the
      # platform's reserved keys, then let the recipe's install.sh fill in its own secrets.
      - name: Stage .env the way the install archive does
        run: |
          set -euo pipefail
          d="recipes/${{ matrix.recipe }}"
          if [ ! -f "$d/.env.template" ]; then
            echo "No .env.template — nothing to stage"
            exit 0
          fi
          # Verbatim, exactly as the renderer ships it.
          cp "$d/.env.template" "$d/.env"
          # AF_APP_DOMAIN is written by the renderer from the customer's base domain
          # (IF-1417). There is no Traefik and no real domain in this test, so stand in
          # with localhost — enough for apps that put their own FQDN in their config.
          printf 'AF_APP_DOMAIN=%s\n' "localhost" >>"$d/.env"
          # generated_from parameters are filled by af-api at compose time (IF-1420,
          # IF-1454), not by install.sh, so a staged .env leaves them empty — and
          # hermes-agent refuses to start on a non-loopback bind with no dashboard
          # credential at all. Stand in with a hash of a throwaway password, the same role
          # localhost plays for AF_APP_DOMAIN above. Read out of metadata.yaml rather than
          # hardcoded, so a recipe that adds such a parameter is covered without touching
          # this workflow.
          python3 - "$d" <<'PY'
          import base64, hashlib, pathlib, secrets, sys
          import yaml

          recipe = pathlib.Path(sys.argv[1])
          meta = yaml.safe_load((recipe / "metadata.yaml").read_text()) or {}
          env_path = recipe / ".env"
          for param in meta.get("parameters", []) or []:
              if not isinstance(param, dict):
                  continue
              spec = param.get("generated_from")
              name = param.get("name")
              if not spec or not name:
                  continue
              algorithm = spec.split(":", 1)[0]
              if algorithm != "scrypt":
                  # argon2/bcrypt consumers so far treat an empty value as "feature off"
                  # (vaultwarden disables /admin), which is a valid state to boot in.
                  print(f"  {name}: {algorithm} — left empty, app boots without it")
                  continue
              salt, n, r, p = secrets.token_bytes(16), 2**14, 8, 1
              derived = hashlib.scrypt(
                  b"docker-test-throwaway", salt=salt, n=n, r=r, p=p, dklen=32, maxmem=0
              )
              value = (
                  f"scrypt${n}${r}${p}$"
                  f"{base64.b64encode(salt).decode()}${base64.b64encode(derived).decode()}"
              )
              # Doubled, exactly as the renderer writes it: Compose interpolates .env
              # values too, and these hashes are dollar-heavy.
              lines = env_path.read_text().splitlines()
              needle = f"{name}="
              out = [f"{needle}{value.replace('$', '$$')}" if ln.startswith(needle) else ln
                     for ln in lines]
              if out == lines:
                  out.append(f"{needle}{value.replace('$', '$$')}")
              env_path.write_text("\n".join(out) + "\n")
              print(f"  {name}: staged a {algorithm} hash")
          PY
          echo "Staged $d/.env:"
          sed -e 's/=.*/=<redacted>/' "$d/.env"

      - name: Run the recipe's install.sh
        run: |
          set -euo pipefail
          # The real install runs this from /opt/<app> as root: it creates the bind-mount
          # directories and generates the app's per-VM secrets into .env. Running it here
          # is what makes the placeholder-free .env actually usable by the containers.
          d="recipes/${{ matrix.recipe }}"
          run_install() {
            if [ "$(id -u)" -eq 0 ]; then
              ( cd "$d" && bash install.sh )
            else
              sudo -E bash -c "cd '$d' && bash install.sh"
            fi
          }
          run_install

          # Second run, asserting the generated secrets survive it. Recipes rely on this:
          # re-running an install must not rotate an encryption key whose data is already
          # encrypted, nor a database password Postgres has already committed to its data
          # directory. Without this the property is only ever claimed in a comment, since
          # the .env staged above starts out empty every time.
          if [ -f "$d/.env" ]; then
            cp "$d/.env" /tmp/env-after-first-install
            run_install
            if ! diff -q /tmp/env-after-first-install "$d/.env" >/dev/null; then
              echo "::error::install.sh is not idempotent — re-running it changed .env"
              diff <(sed -e 's/=.*/=<redacted>/' /tmp/env-after-first-install) \
                   <(sed -e 's/=.*/=<redacted>/' "$d/.env") || true
              exit 1
            fi
            echo "install.sh is idempotent — .env unchanged by a second run"
          fi

      - name: Ensure Docker Compose v2 is available
        run: |
          set -euo pipefail
          # The IF default runner image ships Docker but not the Compose v2 plugin
          # (see the structural-only check in recipe-pipeline.yaml). Install it as a
          # user-level CLI plugin so `docker compose` works for the steps below.
          if docker compose version >/dev/null 2>&1; then
            echo "docker compose already present:"
            docker compose version
            exit 0
          fi
          arch="$(uname -m)"
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-${arch}" \
            -o "$HOME/.docker/cli-plugins/docker-compose"
          chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version
        env:
          COMPOSE_VERSION: v5.1.4

      # Why this step exists at all: install.sh created the bind-mount directories and
      # chowned them to the uid the app runs as, but that happened in *this* job's
      # filesystem. The Docker daemon resolves an absolute bind-mount path in its own, so
      # the app container gets a directory the daemon auto-created as root:root and a
      # non-root app cannot write it. On a real VM the two are the same filesystem and the
      # question never arises.
      #
      # The symptom was 12 of 19 recipes failing this test with EACCES while 7 passed, and
      # the split was not arbitrary: the 7 either run as root or use an image whose
      # entrypoint starts as root, chowns its data directory and only then drops privileges
      # (postgres does this, which is why a recipe's database came up healthy while the app
      # beside it did not). Nothing was wrong with the 12 recipes.
      #
      # So do the same chown from inside the daemon's namespace, where it lands on the
      # directory the app will actually see. The uid comes out of the image itself rather
      # than a table here, so a recipe that switches to a different base image stays covered.
      - name: Give bind-mounted directories the ownership the app expects
        run: |
          set -euo pipefail
          d="recipes/${{ matrix.recipe }}"
          python3 - "$d" "${{ matrix.recipe }}" <<'PY' > /tmp/mounts.txt
          import os
          import pathlib
          import sys

          import yaml

          recipe_dir, app_id = pathlib.Path(sys.argv[1]), sys.argv[2]
          # Only the app's own data directories under /opt/<app>, and only read-write ones.
          # Recipes also bind-mount things that must never be touched: /etc/localtime and
          # /etc/timezone (gitea, immich, home-assistant), the Docker socket (portainer,
          # runtipi, wud) and, in wud's case, the whole of /opt. A recursive chown over any
          # of those would be a far worse bug than the one this step fixes.
          #
          # Normalised before comparing, not compared as a string: `/opt/<app>/../../etc`
          # passes a plain startswith, and Docker would then resolve the source to /etc and
          # the chown would land on the daemon's /etc. Normalising also lets a recipe mount
          # its own root (`/opt/<app>:/x`), which a trailing-slash prefix would have dropped.
          allowed = f"/opt/{app_id}"
          compose = yaml.safe_load((recipe_dir / "docker-compose.yaml").read_text())
          for name, svc in (compose.get("services") or {}).items():
              image = svc.get("image")
              if not image:
                  # Build-only service. Warned about rather than dropped quietly: a future
                  # recipe using one would otherwise lose this coverage invisibly, which is
                  # the kind of silence that let a blocking defect reach main.
                  if svc.get("volumes"):
                      print(f"WARN\tservice '{name}' has volumes but no image — not prepared",
                            file=sys.stderr)
                  continue
              for vol in svc.get("volumes") or []:
                  if not isinstance(vol, str):
                      print(f"WARN\tservice '{name}' uses a long-form volume — not prepared",
                            file=sys.stderr)
                      continue
                  parts = vol.split(":")
                  host = os.path.normpath(parts[0])
                  read_only = len(parts) > 2 and "ro" in parts[2].split(",")
                  inside = host == allowed or host.startswith(allowed + "/")
                  if inside and not read_only:
                      print(f"{image}\t{host}")
          PY
          if [ ! -s /tmp/mounts.txt ]; then
            echo "No absolute bind mounts — nothing to prepare"
            exit 0
          fi
          while IFS=$'\t' read -r image host; do
            # `id` in the image resolves a named user (node, hermes) as well as a numeric
            # one. One container start for both ids rather than two.
            #
            # Its exit status is kept separate from its output on purpose. Treating any
            # failure as "runs as root" would skip the chown for a distroless image that
            # ships no `id` at all — the app would then hit the very EACCES this step
            # exists to prevent, while the log claimed the image runs as root. So fall
            # back to what the image declares, and if that names a user this cannot
            # resolve, fail instead of guessing.
            if idout="$(docker run --rm --entrypoint sh "$image" -c 'id -u; id -g' 2>/dev/null)"; then
              ids="$(echo "$idout" | sed -n 1p)"
              gids="$(echo "$idout" | sed -n 2p)"
            else
              declared="$(docker image inspect --format '{{.Config.User}}' "$image" 2>/dev/null || true)"
              if [ -z "$declared" ]; then
                echo "  $host: image declares no user and has no 'id' — treating as root"
                continue
              fi
              case "$declared" in
                *[!0-9:]*)
                  echo "::error::cannot resolve user '$declared' of $image — $host would be left root-owned"
                  exit 1
                  ;;
              esac
              ids="${declared%%:*}"
              gids="${declared##*:}"
              [ "$gids" = "$declared" ] && gids="$ids"
              echo "  $host: no 'id' in image, using declared user $ids:$gids"
            fi
            if [ "$ids" = "0" ]; then
              echo "  $host: image runs as root, leaving it alone"
              continue
            fi
            echo "  $host: chown ${ids}:${gids} (from $image)"
            docker run --rm -v "$host:/target" alpine:3 chown -R "${ids}:${gids}" /target
          done < /tmp/mounts.txt

      # A second thing the daemon's namespace lacks. Three recipes bind-mount the host's
      # /etc/localtime (and gitea also /etc/timezone) so the app shows the customer's local
      # time — standard practice, and correct on a VM. The daemon here runs on an Alpine
      # base, which ships neither file, so Docker creates a *directory* at that path and
      # then fails to bind it onto the file the image expects:
      #   error mounting "/etc/localtime" to rootfs: mount src=/etc/localtime ... MS_BIND
      #
      # So put a real file there first, and only when the recipe under test actually wants
      # it.
      #
      # ⚠️ The daemon's /etc appears to survive between jobs: one recipe failed on the
      # missing file, and after this step had run in other jobs a different recipe mounted
      # it successfully on a branch that does not contain this step at all. The runner pod
      # is per-job (three different names observed), so what persists is the daemon, not the
      # runner. Treat this as writing to shared state: the step is therefore idempotent and
      # replaces the file atomically, and it must never be pointed at a real host.
      - name: Provide the timezone files the daemon's namespace is missing
        run: |
          set -euo pipefail
          compose="recipes/${{ matrix.recipe }}/docker-compose.yaml"
          if ! grep -qE '/etc/(localtime|timezone)' "$compose"; then
            echo "Recipe mounts no timezone files — nothing to provide"
            exit 0
          fi
          # Written to a temp file and moved into place, not created where it belongs. With
          # fail-fast disabled the gitea, home-assistant and immich legs run this
          # concurrently; if they turn out to share one daemon, creating in place would leave
          # the other leg a window where the file is missing or half-written, while an atomic
          # rename never does. Cheap insurance against a topology this workflow does not
          # declare: it names no `services:` and no DOCKER_HOST, so whether each leg gets its
          # own daemon is a property of the runner rather than of this file.
          docker run --rm -v /etc:/hostetc debian:stable-slim sh -c '
            set -e
            for f in localtime timezone; do
              # A directory here is Docker having auto-created the missing path on an
              # earlier attempt; it has to go, or the bind fails the same way.
              [ -d "/hostetc/$f" ] && rm -rf "/hostetc/$f"
              [ -f "/hostetc/$f" ] && continue
              if [ "$f" = localtime ]; then
                cp /usr/share/zoneinfo/Etc/UTC "/hostetc/.af-$f.tmp"
              else
                printf "Etc/UTC\n" > "/hostetc/.af-$f.tmp"
              fi
              mv -f "/hostetc/.af-$f.tmp" "/hostetc/$f"
            done
            ls -l /hostetc/localtime /hostetc/timezone'

      - name: Start services
        run: |
          docker compose \
            --project-directory "recipes/${{ matrix.recipe }}" \
            -f "recipes/${{ matrix.recipe }}/docker-compose.yaml" \
            up -d

      - name: Run health check
        timeout-minutes: 7
        run: bash "recipes/${{ matrix.recipe }}/health-check.sh"

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose \
            --project-directory "recipes/${{ matrix.recipe }}" \
            -f "recipes/${{ matrix.recipe }}/docker-compose.yaml" \
            logs --tail=150

      - name: Write job summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          case "$STATUS" in
            success)   ICON="✅" ;;
            failure)   ICON="❌" ;;
            cancelled) ICON="⚪" ;;
            *)         ICON="⏳" ;;
          esac
          {
            echo "## ${ICON} Docker test: \`${{ matrix.recipe }}\`"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Status | \`${STATUS}\` |"
            echo "| Mode | docker-on-runner (Phase 1) |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "_Phase 2 (CoreVPS live VM): [test-recipes-live.yaml](../../actions/workflows/test-recipes-live.yaml)_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: |
          docker compose \
            --project-directory "recipes/${{ matrix.recipe }}" \
            -f "recipes/${{ matrix.recipe }}/docker-compose.yaml" \
            down -v
