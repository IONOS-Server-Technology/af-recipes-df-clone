slug: calibre-web
name: Calibre-Web
source_description: "Calibre-Web is a web application for browsing, reading, and managing your ebook library"

upstream:
  url: https://github.com/janeczku/calibre-web
  repo_url: https://github.com/janeczku/calibre-web
  license: GPL-3.0
  docker_image: lscr.io/linuxserver/calibre-web
  compose_file_url: https://github.com/linuxserver/docker-calibre-web/blob/master/README.md
  compose_file_notes: >
    Upstream janeczku/calibre-web publishes no docker image and no compose
    file of its own — the README only says to add DOCKER_MODS via "your
    Docker run/compose file" without providing one. The actual image used
    by this recipe (lscr.io/linuxserver/calibre-web) is built and
    maintained by LinuxServer.io in a separate repo,
    github.com/linuxserver/docker-calibre-web, and that repo's README
    (mirrored at docs.linuxserver.io/images/docker-calibre-web/) is the
    closest thing to an official compose file: it is not a standalone
    downloadable file but an embedded example block, generated from that
    repo's readme-vars.yml and kept in sync with the image by its
    maintainers. The example pins to the ":latest" tag (rolling reference,
    not a specific version), and is the single variant they publish — no
    separate GPU/CPU or sqlite/postgres variants exist for this
    single-container app. Chose the GitHub README over the docs.linuxserver.io
    mirror since it is the primary source the docs page is generated from.

version_health:
  latest_version: "0.6.26"
  latest_release_date: "2026-02-06"
  release_cadence: slowing
  eol_status: active
  notes: >
    0.6.26 shipped 2026-02-06 — 6 months before today (2026-08-05).
    Release gaps have been widening: 0.6.22 (2024-07-06) → 0.6.23
    (2024-08-05, 1 month) → 0.6.24 (2024-11-16, 3 months) → 0.6.25
    (2025-08-24, 9 months) → 0.6.26 (2026-02-06, 5.5 months). Not archived
    and not stalled, though: master's commit history shows daily commits
    as recently as 2026-08-01 through 2026-08-03 (UI fixes, metadata-search
    changes), so upstream development itself is active — it is specifically
    the cadence of cutting a numbered release that has slowed. The
    linuxserver/calibre-web image tag "0.6.26" was rebuilt 4 days before
    today, but that is a base-image/security rebuild of the same app
    version, not a new release.

catalogue_fit:
  categories: [media, ebooks, self-hosting, file-management]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue manages an ebook library.
    Immich and Paperless-ngx are the closest by shape (self-hosted media/
    document library with a browser UI, per-user accounts, OPDS/API-style
    access from external apps) but neither indexes or serves EPUB/MOBI/PDF
    books against a Calibre metadata.db, converts between ebook formats,
    or exposes an OPDS feed for e-reader apps. Calibre-Web fills a distinct
    "personal ebook library" niche.
  usefulness: medium
  usefulness_rationale: >
    Self-hosted ebook library management (with Kobo sync, "send to
    Kindle/e-reader", and OPDS feed for reader apps) is a well-known and
    frequently self-hosted use case with a large, stable user base, so it
    would plausibly draw customers who wouldn't otherwise pick our
    catalogue. Usefulness is capped at medium rather than high because it
    is a personal/hobbyist niche (fewer commercial or team use cases than,
    say, monitoring or automation tools already in the catalogue) and
    upstream's slowing release cadence adds some long-term risk.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [basic_auth_password]
  secrets_expressible_today:
    - secret: basic_auth_password
      mechanism: traefik_basic_auth
  blocking_issues:
    - >
      The app ships with a fixed, non-configurable default admin login
      (admin / admin123) baked into a freshly-initialized database. There
      is no environment variable or first-boot flag to set a different
      admin password (confirmed against LinuxServer's own docs, which say
      changing it requires manually exec-ing into the container or editing
      the SQLite DB after boot) — so `generated_from` cannot project the
      customer's root-password hash into Calibre-Web's own login. Per
      SCHEMA.md this is not a hard blocker: it is the "fixed/default
      admin credential the app itself gives no way to change" case, so the
      recipe should gate the whole app behind a Traefik `basic_auth`
      credential derived from the customer's root password, leaving the
      app's own admin/admin123 login as an internal detail behind that
      boundary (same pattern already used for n8n, WUD, Open WebUI,
      Immich).
  installable_today: true
  recommendation: build_now

summary: >
  Calibre-Web is a single-container app (official image is
  linuxserver/calibre-web; upstream itself ships no first-party image) on
  one HTTP port (8083), backed by a bind-mounted Calibre library folder
  and its own config volume — structurally closest to recipes/uptime-kuma
  or recipes/vaultwarden (single container, no external DB dependency,
  persistent volume) rather than the Postgres-backed recipes. It needs no
  external API keys or OAuth registration to boot: a fresh install can
  ship an empty/sample Calibre library and let the customer upload books
  after login. Its only wrinkle is a hardcoded default admin/admin123
  login with no supported way to change it via config, which SCHEMA.md
  explicitly treats as installable by gating the app behind Traefik
  basic_auth rather than a blocker. Upstream is not archived or EOL —
  commits are landing weekly as of August 2026 — but its cadence of
  cutting tagged releases has been slowing (6 months since 0.6.26, and
  each of the prior three gaps was longer than the one before). No
  catalogue overlap and no structural blockers make this a reasonable
  build_now candidate, with the release-cadence trend as the one thing
  worth rechecking before or shortly after shipping.
