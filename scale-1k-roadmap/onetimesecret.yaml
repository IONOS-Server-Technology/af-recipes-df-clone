slug: onetimesecret
name: OneTimeSecret
source_description: "Share self-destructing secrets through one-time-view links"

upstream:
  url: https://onetimesecret.com
  repo_url: https://github.com/onetimesecret/onetimesecret
  license: AGPL-3.0
  docker_image: onetimesecret/onetimesecret:v0.26.4
  compose_file_url: https://raw.githubusercontent.com/onetimesecret/onetimesecret/main/docker/compose/docker-compose.simple.yml
  compose_file_notes: >
    Official file, at docker/compose/docker-compose.simple.yml in the
    onetimesecret/onetimesecret repo (documented in docker/README.md). This
    is a rolling reference to the default branch (main), not a
    version-pinned tag or release-asset link — no per-release compose
    asset is published. The file itself pins the app image tag internally
    via OTS_IMAGE_TAG (defaulting to v0.26.1 at time of writing, lagging
    slightly behind the latest v0.26.4 release), overridable at
    `docker compose up` time. Picked "simple" over the repo's other
    compose variants (e.g. full stack with Postgres/RabbitMQ/workers) as
    it matches the anonymous/guest deployment mode already assessed in
    installability/summary below: just app + Valkey, no extra services.

version_health:
  latest_version: "v0.26.4"
  latest_release_date: "2026-08-05"
  release_cadence: active
  eol_status: active
  notes: >
    Latest release (v0.26.4) shipped today (2026-08-05), with v0.26.3
    (2026-08-02), v0.26.2 (2026-07-27), and v0.26.1 (2026-07-21) landing in
    the same month — a near-weekly cadence. The v0.26.0 line (rc0 through
    stable) shipped across June-July 2026 with a new "Colonel" admin
    console and branding features, and v0.25.x releases run back through
    at least June 2026. No sign of slowdown, archival, or EOL; this reads
    as a well-maintained, continuously-shipping project.

catalogue_fit:
  categories: [security, productivity]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    No recipe in the current 24 covers ephemeral, burn-after-reading secret
    sharing. This is the same niche already surveyed in
    apps-gaps/hemmelig.yaml (build_now) and apps-gaps/cryptgeon.yaml
    (build_with_caveats) — OneTimeSecret is in fact the original/reference
    implementation of the one-time-secret-link pattern that both of those
    apps were inspired by, and is the most widely recognized name in this
    space (SaaS product at onetimesecret.com plus long-running OSS
    project). If more than one of these three ships, they will visibly
    duplicate each other in the catalogue — a reviewer decision point, not
    a technical blocker, since none is a recipe yet.
  usefulness: high
  usefulness_rationale: >
    Best brand recognition of the three one-time-secret candidates
    surveyed so far (widely used SaaS + long OSS history, AGPL-3.0,
    actively developed), and the simple/anonymous deployment mode needs no
    login at all for its core feature — cheap to run (one app container +
    Valkey, no Postgres/RabbitMQ/worker processes required in this mode).
    Scored high on its own merits; actual priority depends on whether the
    catalogue wants one, two, or all three of Hemmelig/Cryptgeon/
    OneTimeSecret.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [SECRET, VALKEY_PASSWORD]
  secrets_expressible_today:
    - secret: SECRET
      mechanism: server_generated_no_customer_input
    - secret: VALKEY_PASSWORD
      mechanism: server_generated_no_customer_input
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  OneTimeSecret's official "simple" deployment (onetimesecret/onetimesecret
  web container + Valkey 8.1, per docker/compose/docker-compose.simple.yml
  in the upstream repo) is a two-service, single-HTTP-port (3000) stack
  behind Traefik with no raw ports or extra protocols. With AUTH_ENABLED=
  false (the anonymous/guest mode) its core feature — creating and viewing
  a self-destructing secret link — needs no account or login, so the only
  secrets it needs at first boot are SECRET (site encryption key) and
  VALKEY_PASSWORD, both patternless values nothing customer-facing ever
  reads and can be generated server-side, same as a DB password. The
  optional "Colonel" admin console and full-auth signup/SMTP flow are not
  needed to boot and are managed via CLI, not a web credential we'd need to
  project. Mechanically installable today with zero blockers, so this is
  build_now. It overlaps with apps-gaps/hemmelig.yaml and
  apps-gaps/cryptgeon.yaml, which already stake out the identical
  burn-after-reading secret-sharing niche; whether the catalogue wants one,
  two, or all three of these is a separate prioritization call for whoever
  schedules the work, not a reason to downgrade this recommendation.
