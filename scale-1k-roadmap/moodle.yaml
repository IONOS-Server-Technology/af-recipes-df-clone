slug: moodle
name: Moodle
source_description: "Open-source learning management system trusted by over 489 million users worldwide"

upstream:
  url: https://moodle.org/
  repo_url: https://github.com/moodle/moodle
  license: GPL-3.0
  docker_image: null
  compose_file_url: null
  compose_file_notes: >
    No official production docker-compose file exists. moodlehq's own
    moodle-docker repo (github.com/moodlehq/moodle-docker) is the closest
    thing to an "official" compose setup, but its README states it is
    "aimed at Moodle developers and testers to easily deploy a testing
    environment for Moodle" — it drives docker via a wrapper script
    (bin/moodle-docker-compose) that assembles base.yml plus swappable
    db.*.yml fragments, and it expects a separately-cloned Moodle source
    tree mounted in as a volume rather than shipping the app itself (see
    the docker_image blocking_issues note above). moodle.org/moodledev.io
    do not publish any docker-compose file for production self-hosting;
    the only "install" guidance for docker is third-party tutorials
    building their own compose files around community images, which do
    not qualify as official.

version_health:
  latest_version: "5.2.1"
  latest_release_date: "2026-06-08"
  release_cadence: active
  eol_status: active
  notes: >
    Actively released: 5.0 shipped April 2025, 5.1 followed on the usual
    ~6-month minor cadence, 5.2 landed 2026-04-20 with a 5.2.1 point release
    2026-06-08 (about two months before this analysis on 2026-08-05). Next
    release is 5.3, the LTS, scheduled for October 2026 (Moodle cuts an LTS
    roughly every two years with 36-month security support; non-LTS minors
    like 5.2 get 18 months). No sign of maintenance-only mode — active
    core development and a published forward roadmap.

catalogue_fit:
  categories: [education, productivity]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    None of the current 24 recipes touch learning-management / course
    delivery. Moodle would be the catalogue's first education-sector app —
    genuinely new ground, not a variant of anything already offered
    (closest structural cousins are other PHP+DB web apps like Gitea or
    Paperless-ngx, not anything overlapping in purpose).
  usefulness: high
  usefulness_rationale: >
    LMS software serves a large, distinct customer segment (schools,
    training providers, corporate L&D) that none of our other recipes
    address, and Moodle is the dominant open-source player in that space
    (self-reported 489M users). High potential demand if it can be shipped
    responsibly.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [MOODLE_ADMIN_PASSWORD]
  secrets_expressible_today: []
  blocking_issues:
    - >
      No maintained, freely-available official Docker image exists to pin.
      bitnami/moodle (the de-facto standard self-hosting image for years)
      is "no longer available for free through Docker Hub" and now ships
      only as a paid Bitnami Secure Images OCI artifact; the free fallback
      bitnamilegacy/moodle is an explicitly frozen, unmaintained snapshot
      that "will receive no further updates or support." moodlehq's own
      moodlehq/moodle-php-apache is a PHP+Apache *base* image for Moodle's
      own CI/dev workflow — it does not bundle the Moodle application code
      at all; it expects a separately-cloned Moodle source tree mounted in
      as a volume (`MOODLE_DOCKER_WWWROOT`) and is explicitly documented
      for developer/Behat/PHPUnit use, not production. There is no single
      self-contained, actively-maintained, free image matching the
      "one official image, pinned tag" pattern every other recipe uses.
    - >
      Even setting the image question aside, MOODLE_ADMIN_PASSWORD (the
      secret in secrets_required_at_first_boot) has no confirmed
      expressible mechanism today: Moodle's standard installer
      (admin/cli/install_database.php) only accepts the admin password as
      plaintext and hashes it internally — there is no built-in hook to
      accept a pre-computed hash. Projecting `generated_from` would need a
      nonstandard install script: run the installer with a throwaway
      password, then overwrite the resulting mdl_user.password row
      directly with a bcrypt hash (Moodle's default hash format happens to
      be PHP bcrypt, so the algorithm lines up) — plausible in principle
      but untested and well outside the standard install flow used by
      every other recipe in the catalogue, so not counted as expressible
      today.
  installable_today: false
  recommendation: not_recommended

summary: >
  Moodle is a genuinely differentiated, high-demand catalogue addition (the
  first LMS/education app, actively released with a public roadmap through
  the 5.3 LTS in October 2026) but is not buildable today on our
  mechanism: there is no free, actively-maintained, self-contained official
  Docker image to pin — the historical answer (bitnami/moodle) is now
  paywalled, its free fallback (bitnamilegacy/moodle) is a frozen,
  unmaintained snapshot, and moodlehq's own image is a dev/CI base that
  requires mounting Moodle's source tree separately rather than shipping
  the app. That image-sourcing gap is upstream/packaging, not something
  IF-1420/1312 merging would fix, so this lands as not_recommended for now
  rather than blocked_on_platform — worth revisiting if Moodle or a
  trustworthy third party ships a maintained, free, self-contained image
  again.
