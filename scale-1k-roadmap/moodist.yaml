slug: moodist
name: Moodist
source_description: "Ambient soundscape mixer with productivity tools for deep focus and relaxation"

upstream:
  url: https://moodist.mvze.net/
  repo_url: https://github.com/remvze/moodist
  license: MIT (third-party sound assets under Pixabay Content License or CC0)
  docker_image: ghcr.io/remvze/moodist
  compose_file_url: https://raw.githubusercontent.com/remvze/moodist/main/docker-compose.yml
  compose_file_notes: >
    Official — the file lives at the repo root and the README's
    "Run with Docker Compose" self-hosting step explicitly points to it
    ("A docker-compose.yml is included at the project root"). Only one
    variant exists (single moodist service, no GPU/CPU or db split). This
    is a rolling link to the default branch (main), not a version-pinned
    tag or release asset — the project doesn't publish the compose file as
    a versioned release artifact.

version_health:
  latest_version: v2.6.1
  latest_release_date: 2026-07-11
  release_cadence: active
  eol_status: active
  notes: >
    v2.6.1 published ~25 days before today (2026-08-05); v2.6.0 ~3 months
    prior, v2.4.0 ~8 months before that. Repo is not archived, has ongoing
    commit activity and a maintained CHANGELOG. Steady, if not fast, release
    cadence — treat as actively maintained.

catalogue_fit:
  categories: [wellness, productivity]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    No existing recipe covers ambient sound / focus-and-relaxation tooling;
    the catalogue's closest neighbors (uptime-kuma, adguard-home, pihole,
    portainer, etc.) are all infra/ops tools, not personal wellness apps. A
    customer would want this purely for the ambient-sound mixer, Pomodoro
    timer, and sleep timer feature set — a differentiated, low-stakes
    single-container app with mass consumer appeal.
  usefulness: medium
  usefulness_rationale: >
    Genuinely novel category for the catalogue and trivially cheap to run
    (static-ish frontend + tiny backend, single container, no DB), but it's
    a low-engagement personal-productivity toy rather than infrastructure —
    unlikely to be a primary reason a customer buys a VM, more a pleasant
    bundled extra.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [traefik_basic_auth_gate]
  secrets_expressible_today:
    - secret: traefik_basic_auth_gate
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Moodist is a small, actively maintained, MIT-licensed ambient-sound/focus
  app with an official single-container Docker image (ghcr.io/remvze/moodist,
  pinned tags back to v2.3.0, current v2.6.1), one reverse-proxy-friendly
  HTTP port, no environment-variable configuration, and no overlap with
  anything currently in the 24-recipe catalogue — a genuinely new
  personal-wellness/productivity category. It has no login of its own, so it
  needs a Traefik basic_auth gate (root-password-derived) to avoid sitting
  open on the internet; that mechanism makes it mechanically installable
  today. Recommend build_now, with the caveat that it's a low-engagement
  nice-to-have rather than infrastructure a customer is likely to buy a VM
  for on its own.
