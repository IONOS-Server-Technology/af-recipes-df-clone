slug: beszel
name: Beszel
source_description: "Lightweight server monitoring platform with Docker statistics and alerts"

upstream:
  url: https://beszel.dev/
  repo_url: https://github.com/henrygd/beszel
  license: MIT
  docker_image: henrygd/beszel
  compose_file_url: https://raw.githubusercontent.com/henrygd/beszel/main/supplemental/docker/same-system/docker-compose.yml
  compose_file_notes: >
    Official, from the project's own repo under supplemental/docker/. This
    is a rolling reference to the default branch (main), not
    version-pinned to a release tag — no `/releases/latest/download/...`
    equivalent is published for this file. The repo ships three variants
    under supplemental/docker/: hub/, agent/, and same-system/ (hub +
    agent together on one host). Picked same-system/ because it matches
    this recipe's shape described in the summary (hub plus a sidecar
    agent container on the same machine); the hub/ and agent/ variants
    are the split-out pieces of the same compose for separate-host setups
    (e.g. monitoring a remote box via the standalone agent/
    docker-compose.yml).

version_health:
  latest_version: "v0.18.7"
  latest_release_date: "2026-04-05"
  release_cadence: slowing
  eol_status: active
  notes: >
    v0.18.7 shipped 2026-04-05, about four months before today
    (2026-08-05). Release velocity was high through Q1 2026 (eight
    0.18.x releases between 2026-01-11 and 2026-04-05, roughly weekly),
    then stopped abruptly — no tagged release since. Commits to `main`
    continued a bit longer (last seen 2026-05-28) before also going
    quiet; no commits visible June-August 2026. Repo is not archived,
    issues/PRs are still open and being discussed, so this reads as a
    real slowdown rather than abandonment — worth flagging as "watch"
    rather than "dormant."

catalogue_fit:
  categories: [monitoring, infrastructure]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: [uptime-kuma]
  differentiation: >
    Uptime Kuma checks external reachability of URLs/services (black-box
    uptime pings); Beszel is host-level resource monitoring — CPU,
    memory, disk, network, temperature, and per-container Docker stats
    with historical graphs and threshold alerts. Nothing in the current
    24-recipe catalogue does host/container resource monitoring, so this
    is a distinct, generally-useful capability rather than a duplicate of
    Uptime Kuma.
  usefulness: high
  usefulness_rationale: >
    Resource monitoring with alerting is broadly applicable to any
    customer running an AF server, independent of what else they've
    deployed, unlike more niche/companion apps in this catalogue sweep.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues:
    - >
      Beszel's hub has no env-var-driven admin bootstrap: the only
      documented ways to set the superuser account are (a) the
      interactive "create an account" wizard shown to whoever first
      loads the web UI, or (b) `beszel superuser upsert <email>
      <plaintext-password>` via CLI/docker exec. Both require a
      plaintext password; the platform's `generated_from` mechanism only
      ever projects a *hash* of the root password, so it cannot populate
      either path. This mirrors n8n's shipped owner-setup wizard and
      WUD's unauthenticated-until-basic-auth-lands state (both accepted
      as interim states in this catalogue today), so it is not a novel
      blocker — just carried forward as the same open item (IF-1312
      basic_auth still unmerged would additionally close the
      first-visitor race for Beszel's own signup, same as it would for
      WUD).
  installable_today: true
  recommendation: build_with_caveats

summary: >
  Beszel is a two-part app (hub: henrygd/beszel on port 8090; agent:
  henrygd/beszel-agent, host-network, port 45876 or a Unix socket for
  local-host monitoring) that is otherwise simple and reverse-proxy
  friendly — structurally close to uptime-kuma with an extra sidecar
  agent container for self-monitoring, similar in shape to how WUD is
  set up. It needs no external API keys or OAuth registration to boot:
  the agent's hub-connection KEY/TOKEN are generated by the hub itself
  with no customer input, so they carry no blocking issue. The only open
  item is the admin account, which Beszel's own first-run wizard lets
  whoever visits first create directly in the browser — no customer
  value needs to flow through af-api for it, exactly like n8n's shipped
  owner-setup flow. Until IF-1312 (Traefik basic_auth) lands, that first
  visit is a race against the public internet, but the catalogue already
  tolerates this exact interim state for n8n and WUD. installable_today
  is true on that same precedent; recommend build_with_caveats so the
  basic_auth gate gets added once available, closing the race properly.
