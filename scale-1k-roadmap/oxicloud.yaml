slug: oxicloud
name: OxiCloud
source_description: "Lightweight Rust-based self-hosted cloud storage with Nextcloud client support"

upstream:
  url: https://atalayalabs.github.io/OxiCloud/
  repo_url: https://github.com/AtalayaLabs/OxiCloud
  license: MIT
  docker_image: diocrafts/oxicloud

version_health:
  latest_version: "v0.8.7"
  latest_release_date: "2026-07-22"
  release_cadence: active
  eol_status: active
  notes: >
    v0.8.7 released 2026-07-22, ~14 days before today (2026-08-05), with
    six more 0.8.x point releases in the month before that (0.8.6 07-20,
    0.8.5 07-19, 0.8.4 07-15, 0.8.3 07-10, 0.8.2 07-06, 0.8.0 06-21) —
    a rapid, multiple-times-per-month cadence. The project's first tagged
    release (0.1.0-rc1) is just over a year old, so this is a young but
    clearly actively-developed project, not dormant. Docker Hub tags track
    releases in lockstep (0.8.6 pushed ~16 days ago at time of check).
    Naming note: the repository was previously at DioCrafts/OxiCloud and
    is now AtalayaLabs/OxiCloud (github.com/DioCrafts/OxiCloud 301-redirects
    to github.com/AtalayaLabs/OxiCloud) — a rename/transfer, not a
    competing fork; there is only one active upstream. The Docker image
    still publishes under the maintainer's personal `diocrafts/oxicloud`
    namespace rather than an org-owned one, a minor packaging quirk worth
    noting but not a blocker.

catalogue_fit:
  categories:
    - productivity
    - file-storage
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    OxiCloud is another entrant in the "self-hosted Google-Drive-alternative"
    niche already flagged as a catalogue gap by three prior analyses —
    Nextcloud (apps-gaps/nextcloud.yaml), OpenCloud (apps-gaps/opencloud.yaml),
    and ownCloud (apps-gaps/owncloud.yaml) — none of which are built recipes
    yet, so there is no actual recipe to mark as overlapping. Its pitch is
    narrower than those three: a single Rust binary/container (~40MB image,
    <1s cold start, 30-50MB idle RAM) offering files, WebDAV/CalDAV/CardDAV,
    sharing, trash, full-text search, and OIDC/SSO, explicitly *not*
    attempting Nextcloud's plugin ecosystem. That makes it a lighter-weight
    but functionally thinner alternative to the same three candidates, not
    a distinct customer need. None of the existing 24 recipes cover general
    file storage/sync with a web UI (Syncthing is P2P device sync with no
    server UI; Immich is media-only; Paperless-ngx is documents-only).
  usefulness: medium
  usefulness_rationale: >
    Fills a real, currently-unaddressed niche (general file storage/sync
    with a web UI), but OxiCloud itself has far less brand recognition
    than Nextcloud/ownCloud and a materially smaller/younger community
    (single-maintainer-flavored project, ~1 year old) than the
    established alternatives already gap-analyzed for the same slot. A
    customer researching this category is far more likely to have heard
    of Nextcloud or ownCloud. Worth keeping on file as a lightweight
    option, but not a stronger pick than the existing candidates for the
    same niche.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues: []
  installable_today: true
  recommendation: build_with_caveats

summary: >
  OxiCloud (diocrafts/oxicloud, pin to a stable tag like 0.8.7, not
  :latest) is a single container serving its whole web UI + WebDAV/CalDAV/
  CardDAV on one HTTP port (8086, configurable), documented to run behind
  a reverse proxy via OXICLOUD_BASE_URL and trusted X-Forwarded-*
  handling, with PostgreSQL as its only backing service (its password can
  be server-generated with no customer input, same pattern as Immich).
  Unlike Nextcloud/ownCloud, OxiCloud has no admin-password env var at
  all: the first visitor completes a POST /api/setup flow in the web UI
  to create the initial admin account entirely client-side, the same
  self-service pattern Immich already uses in this catalogue — so there
  is no first-boot secret needing generated_from or basic_auth projection.
  Mechanically installable_today with no blockers. The caveat is
  strategic: this is the fourth gap-analysis (after Nextcloud, OpenCloud,
  ownCloud) targeting the same "self-hosted file drive" customer need,
  and the weakest of the four on brand recognition and project maturity —
  recommend build_with_caveats, and decide alongside the other three
  rather than in isolation, since the catalogue likely only needs one or
  two recipes for this niche.
