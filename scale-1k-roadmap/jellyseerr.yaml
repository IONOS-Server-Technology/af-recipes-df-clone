slug: jellyseerr
name: Jellyseerr
source_description: "Media request management tool for Jellyfin, Emby, and Plex with approval workflow"

upstream:
  url: https://seerr.dev/
  repo_url: https://github.com/seerr-team/seerr
  license: MIT
  docker_image: seerr/seerr (pin to a version tag, e.g. v3.4.1 — do not follow upstream docs' :latest example)

version_health:
  latest_version: "v3.4.1"
  latest_release_date: "2026-07-30"
  release_cadence: active
  eol_status: active
  notes: >
    "Jellyseerr" as a standalone project name is superseded: as of v3.0.0
    (2026-02-14), the Jellyseerr and Overseerr teams officially merged into
    one project and codebase called "Seerr". The old
    github.com/Fallenbagel/jellyseerr repo now redirects to
    github.com/seerr-team/seerr, and the old `fallenbagel/jellyseerr` Docker
    Hub image is stale (tags last pushed ~10-11 months ago, no recent
    activity) — the actively maintained image is `seerr/seerr` (mirrored at
    `ghcr.io/seerr-team/seerr`). This is not a case of two distinct
    unrelated projects sharing a name; it is the same lineage continuing
    under a new name, so a recipe built today should target Seerr/the
    `seerr/seerr` image, not the dormant `fallenbagel/jellyseerr` one, even
    though the Hostinger catalogue slug says "jellyseerr". Release history
    under the new name is active: v3.0.0/v3.0.1 (2026-02-14), v3.1.0
    (2026-02-27), v3.1.1 (2026-04-13), v3.2.0 (2026-04-15), v3.3.0
    (2026-06-02), v3.4.0 (2026-07-28), v3.4.1 (2026-07-30) — roughly monthly,
    with the latest release only 6 days old as of 2026-08-05. Repo is not
    archived; clearly active development.

catalogue_fit:
  categories: [media, automation]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue touches media-request
    management. Jellyseerr/Seerr sits on top of an existing Jellyfin, Plex,
    or Emby media server and lets non-admin household/family users browse
    a catalogue (via TMDB) and submit requests for movies/shows, which an
    admin approves and routes to Sonarr/Radarr. Closest catalogue neighbor
    conceptually is Immich (self-hosted media, own admin signup), but
    Immich is a photo library, not a request-approval front end for a video
    media server — no functional overlap. Critically, none of Jellyfin,
    Plex, Emby, Sonarr, or Radarr exist as AF recipes today, so this app is
    only useful to a customer who already runs one of those media servers
    somewhere else (self-hosted elsewhere, or a separate AF install) — like
    Jackett/autobrr/Bazarr, it is a dependent piece of a larger media-stack
    pipeline rather than a self-contained destination.
  usefulness: medium
  usefulness_rationale: >
    Recognized, popular tool in the self-hosted media community and the
    natural next piece after a media server, but its entire value
    proposition requires an existing Jellyfin/Plex/Emby instance the
    customer already has elsewhere — the catalogue has no such recipe to
    pair it with, so on its own it is a request UI with nothing to serve
    requests, and its first-run setup is where its severest installability
    problem also shows up (see below).

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [media_server_admin_account]
  secrets_expressible_today: []
  blocking_issues:
    - >
      Jellyseerr/Seerr has no standalone local-signup admin account. The
      first-run setup wizard requires selecting Jellyfin, Plex, or Emby and
      authenticating against that server (server URL plus that server's own
      admin username/password, or Plex OAuth) — the app's initial "admin"
      user is imported from the connected media server, not created inside
      Jellyseerr itself. There is no environment variable that pre-seeds an
      admin login, so `generated_from: "<algo>:ROOT_PASSWORD"` has no
      parameter to attach to.
    - >
      This is third-party account linking, not a login the platform can
      hash or generate on the customer's behalf — the customer must already
      hold valid credentials for an external (or separately-hosted)
      Jellyfin/Plex/Emby server, and there is no channel today for the
      customer to hand that arbitrary third-party credential to `/compose`.
    - >
      A Traefik `basic_auth` gate could keep the public URL from sitting
      open before setup completes, but it does not solve the underlying
      problem: setup itself cannot complete without a real, working
      Jellyfin/Plex/Emby account, which the platform has no way to supply
      or substitute.
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  Jellyseerr has effectively been superseded by "Seerr" (a 2026-02 merger of
  the Jellyseerr and Overseerr projects/teams under one codebase and one
  Docker image, `seerr/seerr`); the project itself is active and
  well-maintained under that name. It is a single-container, reverse-proxy-
  friendly web app with no exotic port requirements, but it cannot be
  installed via the current recipe mechanism: its entire first-run flow
  requires linking a real external Jellyfin, Plex, or Emby account, which is
  third-party account linking with no input channel today (not a
  root-password hash, not something Traefik basic_auth can substitute for).
  Even setting installability aside, the catalogue has no Jellyfin/Plex/Emby
  recipe for it to pair with, so its practical value here is capped until
  both a generic external-credential input channel and a paired media-server
  recipe exist. Recommend `blocked_on_platform`, revisit if/when the
  platform gains a customer-supplied external-credential channel.
