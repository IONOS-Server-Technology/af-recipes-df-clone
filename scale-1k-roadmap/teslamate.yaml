slug: teslamate
name: TeslaMate
source_description: "Self-hosted Tesla data logger with trip history and Grafana dashboards"

upstream:
  url: https://docs.teslamate.org
  repo_url: https://github.com/teslamate-org/teslamate
  license: AGPL-3.0
  docker_image: teslamate/teslamate

version_health:
  latest_version: "v4.0.1"
  latest_release_date: "2026-06-14"
  release_cadence: active
  eol_status: active
  notes: >
    v4.0.1 tagged 2026-06-14, about 8 weeks before today (2026-08-05).
    Release history is dense through 2026: v3.0.0 (2026-02-28), v3.1.0
    (2026-06-07), v4.0.0 (2026-06-13), v4.0.1 (2026-06-14) — a burst of
    three releases in a week resolving a Tesla refresh-token regression,
    following a steadier v2.x cadence back through 2025 (v2.0.0 2025-04-26,
    v2.1.0 2025-07-21, v2.1.1 2025-08-16, v2.2.0 2025-11-06). Repo is not
    archived, actively maintained by teslamate-org, clearly active rather
    than maintenance-only.

catalogue_fit:
  categories: [monitoring]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24 recipes touches personal vehicle telemetry.
    uptime-kuma and wud are the closest "monitoring" recipes but watch
    services/containers, not a physical device's location, battery,
    charging, and drive history. TeslaMate would be a new vertical: an
    always-on data logger for a customer's own Tesla, with a live
    dashboard and a pre-built set of Grafana reports (efficiency, charging
    cost, trips, vampire drain, etc.).
  usefulness: low
  usefulness_rationale: >
    Well-regarded within its niche (8.7k+ GitHub stars) but the addressable
    audience is narrow: it's only useful to someone who owns a Tesla, which
    is a small slice of a general VPS-hosting customer base compared to the
    broad-appeal apps already in the catalogue (n8n, paperless-ngx, immich).

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot:
    - database_password
    - encryption_key
    - teslamate_dashboard_basic_auth_password
    - grafana_basic_auth_password
  secrets_expressible_today:
    - secret: database_password
      mechanism: server_generated_no_customer_input
    - secret: encryption_key
      mechanism: server_generated_no_customer_input
    - secret: teslamate_dashboard_basic_auth_password
      mechanism: traefik_basic_auth
    - secret: grafana_basic_auth_password
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  TeslaMate is a four-container Compose stack (teslamate + postgres +
  teslamate/grafana + eclipse-mosquitto) with two separate single-HTTP-port
  web UIs — the Phoenix live dashboard on :4000 and Grafana on :3000 — each
  reverse-proxy-friendly on its own subdomain. Postgres password and the
  Tesla-API-token ENCRYPTION_KEY are patternless secrets the server can
  generate with no customer input. Neither web UI has a login the customer
  needs to configure at boot: the teslamate app itself has no built-in auth
  at all (it shows live GPS location and drive history, so it needs a
  mandatory Traefik basic_auth gate, same pattern as Adminer), and Grafana
  ships a fixed default admin/admin login that should likewise sit behind a
  basic_auth gate rather than rely on Grafana's own unchangeable-by-us
  credential. Linking the actual vehicle happens after deployment, when the
  customer signs into their own Tesla account directly inside the running
  app — that's a manual in-browser step the customer performs themselves
  (like configuring API keys inside hermes-agent or n8n post-provision), not
  a value af-api needs to inject, so it isn't a blocker. All required
  secrets are expressible today with existing mechanisms and there are no
  blocking issues, so this is build_now.
