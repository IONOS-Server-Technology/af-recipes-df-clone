slug: jaeger
name: Jaeger
source_description: "Jaeger is an open-source distributed tracing system for monitoring microservices"

upstream:
  url: https://www.jaegertracing.io/
  repo_url: https://github.com/jaegertracing/jaeger
  license: Apache-2.0
  docker_image: jaegertracing/jaeger

version_health:
  latest_version: "2.20.0"
  latest_release_date: "2026-07-20"
  release_cadence: active
  eol_status: active
  notes: >
    v2.20.0 published 2026-07-20 (confirmed via GitHub Releases API), ~2
    weeks before today (2026-08-05). Recent tag cadence is roughly monthly
    through 2026 (2.19.0 2026-06-03, 2.18.0 2026-05-13, 2.17.0 2026-03-30,
    2.16.0 2026-03-07, 2.15.0 2026-02-06) — clearly active. Note a major
    architectural transition: Jaeger v1 (the classic collector/query/agent/
    all-in-one component split, image `jaegertracing/all-in-one`) reached
    end-of-life 2025-12-31 and stopped receiving updates at 1.76.0; starting
    with 2.14.0 (2026-01-02) the legacy v1 binaries are no longer published
    separately and everything ships as v2.x, a unified binary built on the
    OpenTelemetry Collector framework (image `jaegertracing/jaeger`). Any
    recipe built today must target the v2 image/config format, not the
    deprecated v1 all-in-one image that older tutorials still reference.

catalogue_fit:
  categories: [monitoring, observability, tracing]
  has_web_ui: true
  reverse_proxy_compatible: false
  overlaps_with: []
  differentiation: >
    No shipped recipe touches distributed tracing today. Unlike Grafana
    Tempo (apps-gaps/grafana-tempo.yaml, already analyzed and
    not_recommended), Jaeger ships its own web UI for browsing and
    searching traces directly — it doesn't need a separately-deployed
    Grafana instance to be useful, which is a real self-containment
    advantage over Tempo. It still requires the customer's own services to
    be instrumented with an OpenTelemetry (or legacy Jaeger/Zipkin) SDK and
    configured to export spans to this instance, so it has no value in
    complete isolation, but it's a one-hop dependency (customer's own apps)
    rather than Tempo's two-hop one (customer's apps + a second self-hosted
    Grafana).
  usefulness: medium
  usefulness_rationale: >
    Genuinely useful to a customer running multiple microservices who wants
    request-level tracing without standing up a heavier observability
    stack, and the built-in UI means it delivers value on its own once
    something is sending it traces. Held to medium rather than high because
    it's a developer/ops tool with a narrower audience than the catalogue's
    typical appliance (password manager, ticketing, file sync), and the
    all-in-one deployment's default in-memory storage means traces don't
    survive a restart unless a customer also wires up a real storage
    backend (Elasticsearch/Cassandra/ClickHouse) — out of scope for a
    single-instance recipe.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [basic_auth_password]
  secrets_expressible_today:
    - secret: basic_auth_password
      mechanism: traefik_basic_auth
  blocking_issues:
    - "The Jaeger UI/query API (port 16686) has no built-in login of its own, so it fits the Traefik basic_auth gate pattern for a human browsing the UI. But that gate only covers one HTTP port — Jaeger's actual data-plane, the trace-ingestion endpoints (OTLP gRPC 4317, OTLP HTTP 4318, Zipkin-compatible 9411, legacy Jaeger Thrift/gRPC 14268/14250), also ship with zero built-in authentication, and a browser-style basic_auth prompt is not something OpenTelemetry SDKs/exporters can satisfy transparently in the general case — the app's core purpose (receiving traces from a customer's own instrumented services) needs those ports reachable, and there is no channel today to project any customer-chosen credential into an SDK the customer configures on their own infrastructure."
    - "Same underlying limitation flagged for Grafana Tempo (apps-gaps/grafana-tempo.yaml): the ingestion surface that makes the app actually useful is not reasonably gate-able with the one supported mechanism (Traefik basic_auth), so leaving it open on the public internet is the only way the recipe would function as advertised."
    - "Default all-in-one storage is in-memory only (traces lost on restart/redeploy) — not a blocker on the installability question but a real limitation worth surfacing to whoever scopes a recipe."
  installable_today: false
  recommendation: not_recommended

summary: >
  Jaeger (2.20.0, actively maintained, monthly release cadence through
  2026) is a healthier, more self-contained candidate than Grafana Tempo —
  it ships its own web UI and needs no second observability tool to be
  useful. It still fails the same installability test Tempo did: the UI's
  lack of built-in auth is coverable with Traefik basic_auth, but the
  trace-ingestion ports that are the actual point of running Jaeger have no
  built-in auth and no expressible mechanism to gate them today, so
  exposing them on the public internet (required for the app to receive
  traces from a customer's own services) is not something the current
  recipe mechanism can do safely. Also note the v1→v2 architecture cutover
  (v1 EOL 2025-12-31): any future recipe attempt must target the v2 image
  and config format, not the deprecated v1 all-in-one image most existing
  tutorials still show. Recommend not_recommended for now, on the same
  basis as Tempo — revisit only if a per-protocol credential/mTLS channel
  for the ingestion ports becomes expressible.
