slug: bookstack
name: BookStack
source_description: "Structured self-hosted wiki for teams with books, chapters, pages, and search"

upstream:
  url: https://www.bookstackapp.com/
  repo_url: https://codeberg.org/bookstack/bookstack
  license: MIT
  docker_image: lscr.io/linuxserver/bookstack

version_health:
  latest_version: "v26.05.3"
  latest_release_date: "2026-07-29"
  release_cadence: active
  eol_status: active
  notes: >
    v26.05.3 (security release) shipped 2026-07-29 — 7 days before today
    (2026-08-05). Preceding history is dense: v26.05.2 (2026-07-02),
    v26.05.1 (2026-06-09), v26.05 (2026-05-28, feature release),
    v26.03.5 (2026-05-21), v26.03.4 (2026-04-30), v26.03.3 (2026-04-05),
    v26.03.2 (2026-03-23), v26.03.1 (2026-03-17), v26.03 (2026-03-15,
    feature release) — multiple releases most months, no gap over ~5
    weeks anywhere in the last year. The project moved its canonical repo
    from GitHub to Codeberg in early 2026 (the GitHub repo is now a mirror
    marked "NOW MANAGED ON CODEBERG"); this is a hosting migration, not a
    slowdown — v26.03 was explicitly the first feature release cut under
    the new Codeberg-managed process, and the pace since has if anything
    been faster (frequent security patch releases). Clearly active.

catalogue_fit:
  categories: [productivity, knowledge-base, documentation]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    No recipe in the current 24-recipe catalogue is a wiki/knowledge-base
    tool. Gitea hosts git repos and OpenGist hosts snippets, but neither
    gives a browsable, structured wiki with books/chapters/pages, WYSIWYG
    + Markdown editing, and full-text search. BookStack's specific angle
    is an opinionated "books > chapters > pages" hierarchy aimed at teams
    writing structured documentation (runbooks, internal docs, knowledge
    bases) rather than a flat wiki or a git-backed page tree — a distinct,
    broadly-recognized product (it is one of the most commonly
    self-hosted documentation tools) that the catalogue currently answers
    with nothing.
  usefulness: high
  usefulness_rationale: >
    Team documentation/wiki is a very common self-hosting request and
    BookStack is a well-known, actively developed, MIT-licensed option
    with broad name recognition. This gap-analysis pass has already
    surfaced two other wiki-shaped candidates (An Otter Wiki — see
    apps-gaps/an-otter-wiki.yaml, and Apache JSPWiki — see
    apps-gaps/apache-jspwiki.yaml); BookStack sits between them in weight
    (PHP/Laravel + MySQL, heavier than An Otter Wiki's single git-backed
    process, lighter than JSPWiki's JVM/Tomcat stack) and is the most
    widely recognized of the three by name, which matters for a customer-
    facing catalogue. If the catalogue only has room for one wiki recipe,
    BookStack's popularity and structured-docs feature set make it a
    strong, arguably the strongest, candidate; An Otter Wiki remains the
    lightest-footprint option if minimal resource use is the priority.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [basic_auth_password, DB_PASSWORD, APP_KEY]
  secrets_expressible_today:
    - secret: basic_auth_password
      mechanism: traefik_basic_auth
    - secret: DB_PASSWORD
      mechanism: server_generated_no_customer_input
    - secret: APP_KEY
      mechanism: server_generated_no_customer_input
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  BookStack ships no official Docker image of its own — upstream docs
  explicitly point to community images (LinuxServer.io's
  lscr.io/linuxserver/bookstack, actively maintained and versioned in step
  with upstream releases, or solidnerd/bookstack). LinuxServer's image is
  the reasonable pick: single web container plus a required external
  MySQL/MariaDB service (same Postgres/MySQL-sidecar shape as our n8n and
  paperless-ngx recipes), one HTTP port, fully Traefik-compatible. Its
  boot-time needs are: DB_PASSWORD and APP_KEY (a Laravel session-
  encryption key), both patternless secrets nothing customer-facing ever
  reads, so both can be server-generated with no customer input channel
  needed. The app itself has no admin-provisioning env var — every fresh
  install boots with a fixed, undocumented-changeable-at-launch default
  login (admin@admin.com / password) that the customer must change after
  first sign-in. Per the same reasoning already applied to Adminer/n8n/
  WUD/An Otter Wiki/Apache JSPWiki in this catalogue, a fixed default
  credential the app gives no way to set at boot is not a hard blocker:
  gating the whole app behind a Traefik basic_auth:true credential
  (projected from the customer's root password via generated_from) makes
  that the real auth boundary, so the weak default sitting behind it is no
  longer customer-facing risk. That clears the /compose constraint today
  with zero hard blocking issues — installable_today, release cadence is
  unambiguously active, and there are no blocking issues, hence build_now.
