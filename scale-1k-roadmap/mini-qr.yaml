slug: mini-qr
name: Mini QR
source_description: "Self-hosted QR code generator with custom styles and batch export"

upstream:
  url: https://minigenerator.pages.dev/
  repo_url: https://github.com/lyqht/mini-qr
  license: GPL-3.0
  docker_image: ghcr.io/lyqht/mini-qr
  compose_file_url: https://github.com/lyqht/mini-qr/raw/main/docker-compose.yml
  compose_file_notes: >
    Official file, referenced directly from the repo's SELF_HOSTING.md
    ("wget https://github.com/lyqht/mini-qr/raw/main/docker-compose.yml").
    This is a rolling reference to the default (`main`) branch, not
    version-pinned to a release tag — the project does not publish a
    versioned/release-asset copy of this file. It uses the `:latest` image
    tag (not a pinned semver like v0.32.0). There is only one variant: a
    single mini-qr container plus a bundled nginx-alpine reverse proxy
    (config embedded inline via Compose `configs:`), exposing port 80 — no
    GPU/CPU, dev/prod, or database-backend variants exist since the app is
    stateless and client-side.

version_health:
  latest_version: v0.32.0
  latest_release_date: "2026-07-29"
  release_cadence: active
  eol_status: active
  notes: >
    ~1 week since v0.32.0 as of 2026-08-05. Release cadence over the last
    year is roughly monthly (v0.27.0 Mar 11, v0.28.0 Mar 13, v0.28.1,
    v0.29.0/v0.30.0/v0.30.1/v0.30.2 in May, v0.31.0 Jun 5, v0.32.0 Jul 29),
    with a `main` branch image tag pushed within the last day and PR-build
    images pushed within hours — clearly active, not archived or in
    maintenance mode. Note there is a naming collision: a separate,
    unrelated fork/rewrite "chaunnt/MiniQR" and "asonf/mini-qr-code" also
    surface under the same search terms; the analysis here is for the
    original and most-starred project, lyqht/mini-qr, which is also the one
    with official Docker publishing and a SELF_HOSTING.md.

catalogue_fit:
  categories: [productivity]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    No existing recipe generates or scans QR codes. Mini QR is a small,
    single-purpose utility: styled/branded QR code creation (custom colors,
    frames, logos, multiple export formats) plus a camera/image QR scanner
    and CSV-driven batch export. Distinct from anything currently in the
    24-recipe catalogue, and a plausible low-friction addition for
    marketing/small-business customers who want a private alternative to
    public QR generator sites (some of which have been flagged for
    inserting tracking or malicious redirects into generated codes).
  usefulness: medium
  usefulness_rationale: >
    Genuinely useful, low-risk utility with no backend/database, but it's a
    lightweight tool rather than a platform — the ceiling on "why a customer
    provisions a whole VM for this" is lower than for apps like Immich or
    n8n. Fits as a quick, cheap-to-run addition rather than a flagship
    recipe.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Mini QR is a small, actively maintained (weekly-to-monthly releases,
  official GHCR image with pinned semver tags like v0.32.0) client-side QR
  code generator/scanner with no database and no login system — it fits the
  same "single container, no auth" pattern as Uptime Kuma, so it needs no
  generated_from projection and no basic_auth gate; there is nothing to
  block installability under the current /compose mechanism. It doesn't
  overlap with anything already in the catalogue. It's a modest, low-effort
  win rather than a high-value platform, but there's no reason not to build
  it.
