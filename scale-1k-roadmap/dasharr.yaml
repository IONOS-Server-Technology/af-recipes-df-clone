slug: dasharr
name: Dasharr
source_description: "Self-hosted history dashboard for private torrent tracker statistics"

upstream:
  url: https://github.com/Arcadia-Solutions/Dasharr
  repo_url: https://github.com/Arcadia-Solutions/Dasharr
  license: AGPL-3.0
  docker_image: ghcr.io/arcadia-solutions/dasharr (pin to a version tag, e.g. 0.3.0 — upstream's own compose.yml uses :latest, which we would not follow)
  compose_file_url: https://raw.githubusercontent.com/Arcadia-Solutions/Dasharr/main/compose.yml
  compose_file_notes: >
    Official — this is the project's own root-level compose.yml, linked
    directly from the README's "Quickstart" section ("Copy compose.yml").
    Rolling reference to the default branch (main), not version-pinned:
    the file has no release-asset equivalent (no per-release compose.yml
    attached to GitHub releases), so this raw main-branch link is the only
    variant the project publishes. There is only one variant shipped (a
    single Postgres-backed app + db pair) — no GPU/CPU or sqlite/postgres
    alternative to choose between. Note the file itself pins the app image
    to :latest rather than a version tag, consistent with the
    version_health/docker_image note above about not following that
    practice in our own recipe.

version_health:
  latest_version: "0.3.0"
  latest_release_date: "2026-03-18"
  release_cadence: slowing
  eol_status: active
  notes: >
    As of today (2026-08-05), the latest tagged release (0.3.0,
    2026-03-18) is about 4.5 months old. Release history before that was
    dense: 0.2.0 (2025-11-16), 0.1.9 (2025-10-31), 0.1.8 (2025-10-13),
    0.1.7 (2025-10-11), 0.1.6 (2025-10-06), 0.1.5/0.1.4 (2025-10-04), down
    to the initial 0.1 release (2025-10-02) — a burst of near-daily point
    releases in the first month, tapering to roughly monthly, then
    nothing tagged since March. The repo is not archived and did receive
    two more commits after 0.3.0 (bug fixes, 2026-06-27, ~5.5 weeks ago),
    so it is not dormant, but the pace has clearly slowed: only 2 commits
    and 0 releases in the ~4.5 months since 0.3.0, versus dozens of
    commits/releases in the prior 5 months. Open issue #44 ("Blutopia
    broken", opened 2026-04-10) is still unaddressed as of this analysis.
    Small project (107 stars, 5 forks, single small team/maintainer per
    CONTRIBUTING.md) — active but low-velocity right now, worth
    re-checking before committing engineering time.

catalogue_fit:
  categories: [media, monitoring]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue tracks private-tracker
    statistics (upload/download/ratio/bonus-points history across
    trackers like RED, BTN, GGn, MAM, and ~20 others). Unlike cross-seed
    (previously analyzed, apps-gaps/cross-seed.yaml), Dasharr does not
    need a companion torrent client or indexer manager to be useful — it
    scrapes each configured tracker's own site/API directly using
    credentials the customer enters into Dasharr's web UI after boot, so
    it stands alone rather than depending on apps we don't otherwise ship.
  usefulness: low
  usefulness_rationale: >
    Real but narrow niche (private-tracker hobbyists checking their own
    ratio/bonus-point history over time) — smaller and more specialized
    audience than the cross-seed/torrent-automation space already scored
    low in prior analysis, and Dasharr itself is a young, low-star, single
    small-team project rather than an established brand.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [API_KEY]
  secrets_expressible_today: []
  blocking_issues:
    - >
      Dasharr's own web UI login is gated by a single shared secret,
      API_KEY, set as a plaintext env var and checked in the backend
      (backend/src/middleware.rs) via a direct string-equality comparison
      against the `api-key` request header — there is no hashed/pre-hashed
      form accepted. The customer must know and type this exact value to
      log in and use the app at all, so it functions as Dasharr's real
      admin password. Our only customer-secret channel today
      (`generated_from: "<algo>:ROOT_PASSWORD"`) only ever produces a
      *hash* of the root password — it cannot produce the plaintext value
      Dasharr's comparison requires, so this credential cannot be
      projected from the root password.
    - >
      A Traefik `basic_auth` gate in front of the app does not substitute
      here either: unlike Adminer/WUD-style apps with no login of their
      own (where the outer gate *is* the auth boundary), Dasharr still
      enforces its own mandatory API_KEY login behind any outer gate. Even
      with a fixed/hardcoded API_KEY value baked into the recipe and an
      outer basic_auth gate for perimeter security, the customer would
      still need to know that hardcoded API_KEY to pass Dasharr's own
      login screen — and there is no channel today to communicate a
      recipe-fixed secret to the customer, so this is a genuine
      plaintext-password requirement per apps-gaps/SCHEMA.md's blocking
      criteria, not a soft caveat.
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  Dasharr is a small, single-container-plus-Postgres app (reverse-proxy
  friendly on one port) with real but narrow value: a history dashboard
  for private-tracker upload/ratio/bonus stats, with no overlap against
  the current 24-recipe catalogue. It is blocked from installable_today
  because its own web login is gated by a plaintext-compared API_KEY with
  no hashed-value support, which our root-password-hash-only
  `generated_from` mechanism cannot supply and which a perimeter Traefik
  `basic_auth` gate does not bypass, since the app's internal login still
  has to be satisfied separately. Combined with a slowing release cadence
  (no tagged release in ~4.5 months, only 2 commits since) and a
  fairly niche/low-usefulness audience, this is not a strong build
  candidate even setting the platform blocker aside — recommend
  `blocked_on_platform`, revisit only if a genuine external-API-key/plaintext-secret
  input channel is added to the platform.
