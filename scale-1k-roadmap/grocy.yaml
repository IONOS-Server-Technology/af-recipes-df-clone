slug: grocy
name: Grocy
source_description: "Self-hosted grocery and household management solution for tracking food inventory"

upstream:
  url: https://grocy.info/
  repo_url: https://github.com/grocy/grocy
  license: MIT
  docker_image: linuxserver/grocy

version_health:
  latest_version: "v4.6.0"
  latest_release_date: "2026-03-06"
  release_cadence: slowing
  eol_status: active
  notes: >
    v4.6.0 shipped 2026-03-06 — about 5 months before today (2026-08-05).
    Tagged-release cadence has slowed sharply: monthly-ish through late
    2024/early 2025 (v4.3.0 2024-12-23 → v4.4.0 2025-01-24 → v4.4.1
    2025-01-31 → v4.4.2 2025-02-28 → v4.5.0 2025-03-28), then an 11-month
    gap before v4.6.0. However the upstream repo is not dormant: the
    `master` branch had commits as recently as 2026-07-21 (9,356 stars,
    140 open issues, not archived), and the linuxserver/grocy image is
    still being rebuilt against v4.6.0 every 1-2 weeks (latest
    v4.6.0-ls334, published 2026-07-26). So the project is active in
    development but has gone quiet on cutting new tagged releases —
    worth re-checking cadence in a few months rather than treating this
    5-month gap as EOL.

catalogue_fit:
  categories: [household, productivity, self-hosting]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue covers household/grocery
    inventory, expiry tracking, shopping lists, recipe/meal planning, or
    chore management — Grocy's niche ("ERP for your fridge") is entirely
    distinct from the automation (n8n), monitoring (uptime-kuma),
    document (paperless-ngx), media (immich) and security (vaultwarden)
    tools already offered.
  usefulness: medium
  usefulness_rationale: >
    Well-known, long-running self-hosted app with a dedicated hobbyist
    following (household/grocery management), but it's a single-user/
    single-household personal-productivity tool rather than a
    team/business use case, which caps demand versus the automation and
    infrastructure tools that make up most of the catalogue.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [basic_auth_password]
  secrets_expressible_today:
    - secret: basic_auth_password
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Grocy is a single-container app (linuxserver/grocy, SQLite-backed, no
  separate DB service) on one HTTP port with a single `/config` bind
  mount — structurally closest to recipes/uptime-kuma and
  recipes/vaultwarden (single-container web app, no extra raw ports,
  reverse-proxy friendly). It ships a fixed `admin` / `admin` login with
  no env var, config flag, or first-run wizard to set a different
  password at boot time (only a "please change it in the UI after
  logging in" prompt), so `generated_from` has no field to target. Per
  SCHEMA.md's "fixed/default/hardcoded admin credential the app itself
  gives no way to change" case, this is not a blocker: gating the whole
  app behind a Traefik `basic_auth` credential derived from the
  customer's root-password hash closes the real risk (public exposure
  of the default login) the same way n8n/WUD/Open WebUI/Immich already
  do. Upstream is still actively developed (commits as recently as
  2026-07-21) even though tagged releases have slowed from monthly to
  roughly every 5+ months, and the community Docker image is kept
  current. Mechanically installable today; the main open question is
  catalogue value, since this is a personal/household tool rather than
  a business use case.
