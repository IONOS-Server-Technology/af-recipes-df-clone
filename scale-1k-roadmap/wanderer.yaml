slug: wanderer
name: Wanderer
source_description: "Self-hosted trail database with GPX track management and interactive maps"

upstream:
  url: https://wanderer.to/
  repo_url: https://github.com/open-wanderer/wanderer
  license: AGPL-3.0
  docker_image: flomp/wanderer-web, flomp/wanderer-db (plus getmeili/meilisearch:v1.36.0 as a required search dependency)

version_health:
  latest_version: "v0.20.0"
  latest_release_date: "2026-07-07"
  release_cadence: active
  eol_status: active
  notes: >
    v0.20.0 released 2026-07-07, about 1 month before today (2026-08-05).
    Release history from the GitHub releases feed is dense and recent:
    v0.18.2 (2025-09-13), v0.18.3 (2025-09-19), v0.18.4 (2026-02-03), v0.18.5
    (2026-02-20), v0.19.0 (2026-05-10), v0.19.1 (2026-05-14), v0.19.2
    (2026-06-02), v0.19.3 (2026-07-02), v0.20.0 (2026-07-07). Aside from one
    ~4.5-month quiet stretch (Sep 2025 - Feb 2026), cadence has been
    near-weekly-to-monthly since. v0.19.3 was a security release (fixed
    unauthenticated IDOR and stored XSS issues), which is a good sign of an
    actively-triaged security process. Repo is not archived and a plugin
    SDK (plugins/sdk/v0.1.0, 2026-07-03) shipped the same week — clearly
    active development, not maintenance-only.

    Note on name ambiguity: the project has moved organizations at least
    once — originally under Flomp/wanderer (per wiki URLs still surfaced in
    search results, e.g. github.com/Flomp/wanderer/wiki/OAuth), now
    canonically open-wanderer/wanderer. A separate hamiltonsl/wanderergps
    repo also surfaced in search results and appears to be an unrelated
    fork/mirror sharing the same tagline; open-wanderer/wanderer (the repo
    the project's own domain, wanderer.to, links to) was used as the
    canonical upstream for this analysis.

catalogue_fit:
  categories: [productivity, media, maps]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24 recipes covers GPS trail/track cataloguing
    (GPX/TCX import, route planning, elevation profiles, AllTrails/Komoot-
    style trail discovery). Immich is the closest neighbor by "personal
    media with location metadata" flavor but is a photo/video backup tool
    with no route-planning or trail-database concept. The apps-gaps
    candidate `adventurelog.yaml` (travel diary / trip planner) is
    thematically adjacent but a distinct use case — trip/itinerary logging
    vs. trail/GPX track management — so a customer could plausibly want
    both.
  usefulness: medium
  usefulness_rationale: >
    Clear, well-defined niche (self-hosted alternative to AllTrails/Komoot)
    with an active upstream and a real audience among hikers/cyclists who
    want to own their GPS data. Capped at medium rather than high because
    the audience is narrower than general-purpose catalogue staples
    (monitoring, password management, photo backup), and the stack has more
    moving parts (frontend + PocketBase + Meilisearch, optionally Valhalla/
    Nominatim/Overpass for routing/geocoding) than a typical single-
    container niche app.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [admin_signup_credential]
  secrets_expressible_today: []
  blocking_issues:
    - >
      Wanderer has no environment variable or config option to
      pre-provision an admin/user account. Confirmed against the official
      docs (wanderer.to/run/environment-configuration and
      wanderer.to/use/authentication): account creation happens exclusively
      through the app's own `/register` form (username + email + password,
      chosen freely by whoever gets there first), and "the first registered
      user becomes the admin." The only registration-related env var is
      `PUBLIC_DISABLE_SIGNUP` (boolean, disables signup once set), which — as
      with the structurally identical `apps-gaps/wakapi.yaml` and
      `apps-gaps/2fauth.yaml` cases — only lets an operator close the door
      after the fact; it provides no channel to inject a specific
      admin credential up front.
    - >
      A Traefik `basic_auth: true` gate in front of the whole app (via
      root-password projection) does not resolve this either, per the same
      precedent set in `apps-gaps/2fauth.yaml` and `apps-gaps/wakapi.yaml`:
      it would just move the same open self-registration race one layer
      in — the first person who reaches the app through the gate still
      wins the one admin account, and today's mechanism has no channel to
      hand the customer a second, distinct credential for the app's own
      login beyond the single root-password projection already spent on
      the gate itself.
    - >
      Even setting the login-provisioning issue aside, Wanderer's stack
      also needs `MEILI_MASTER_KEY` (Meilisearch) and
      `POCKETBASE_ENCRYPTION_KEY` (32-char AES key) — both of these ARE
      expressible today as server-generated random secrets with no
      customer-facing input (`server_generated_no_customer_input`), so they
      are not blockers on their own; they are noted here only for
      completeness since they are not listed in
      `secrets_required_at_first_boot` (that field is reserved for secrets
      with a customer-facing input requirement).
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  Wanderer is an active, well-maintained self-hosted trail/GPX database
  (SvelteKit + PocketBase + Meilisearch) that would fill a genuine gap in
  the catalogue — nothing among the current 24 recipes covers GPS trail
  cataloguing or route planning, and it's adjacent to but distinct from the
  `adventurelog` gap-analysis candidate. It fails the installability test on
  the same platform-mechanism grounds as `wakapi` and `2fauth`: the single
  admin account is provisioned via an open, unauthenticated self-registration
  form with no env-var hook, so neither `generated_from:ROOT_PASSWORD` nor a
  `basic_auth` gate alone gives the customer an exclusive, platform-
  provisioned credential. Revisit once the platform supports injecting a
  preset admin login via env var (would require an upstream feature request)
  or a second customer-facing credential channel beyond the single
  root-password projection.
