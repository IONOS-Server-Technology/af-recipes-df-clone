slug: cops
name: COPS
source_description: "Lightweight PHP OPDS and HTML server that exposes a Calibre ebook library to mobile readers and browsers"

upstream:
  url: https://github.com/mikespub-org/seblucas-cops
  repo_url: https://github.com/mikespub-org/seblucas-cops
  license: GPL-2.0
  docker_image: lscr.io/linuxserver/cops

version_health:
  latest_version: "4.5.2"
  latest_release_date: "2026-06-23"
  release_cadence: active
  eol_status: active
  notes: >
    The original upstream, seblucas/cops, is effectively dead — last
    tagged release 1.1.3 on 2019-06-24, over 7 years before today
    (2026-08-05), with no signs of maintenance. However, the project was
    forked and is now actively maintained as mikespub-org/seblucas-cops,
    which is the codebase LinuxServer.io's image actually tracks. That
    fork released 4.5.2 six weeks before today (2026-06-23), with prior
    releases at roughly 1-3 month intervals through 2026 (4.3.1 on
    2026-03-03, 4.3.3 on 2026-05-15, 4.3.5 on 2026-06-07, 4.5.1 and 4.5.2
    both on 2026-06-23). That is a healthy, active cadence. See the
    ambiguous-name note in blocking_issues below.

catalogue_fit:
  categories: [media, ebooks, self-hosting, file-management]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue serves a Calibre ebook
    library. COPS is deliberately minimal by design (a stateless PHP
    front-end that reads an existing Calibre metadata.db and library
    folder read-only, generating OPDS/HTML browsing and downloads) rather
    than a full library manager — it has no upload UI, no metadata
    editor, no format conversion, and expects the library to already
    exist and be managed elsewhere (e.g. desktop Calibre, or synced in).
    This is a near-duplicate of the `apps-gaps/calibre-web.yaml` candidate
    analyzed separately (also not yet a recipe): both read a Calibre
    library and serve an OPDS feed plus a browser UI, but Calibre-Web is
    the fuller "manage and read" experience (in-browser reader, upload,
    Kobo/Kindle sync, per-user accounts) while COPS is a much lighter
    "browse and download/OPDS-only" server with no editing or upload
    capability at all. If both were ever built, they would compete for
    the same customer need and shipping both would be redundant.
  usefulness: medium
  usefulness_rationale: >
    Serving an existing Calibre library over OPDS for e-reader apps is a
    real, recognizable self-hosting use case, but COPS's minimalism cuts
    both ways: it's a smaller/simpler footprint than Calibre-Web, but it
    also can't do anything useful without a library the customer already
    has and must get onto the volume some other way (no upload flow),
    which raises first-use friction for anyone starting from empty.
    Usefulness is capped at medium and is really a choice between this
    and Calibre-Web rather than an addition alongside it.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [basic_auth_password]
  secrets_expressible_today:
    - secret: basic_auth_password
      mechanism: traefik_basic_auth
  blocking_issues:
    - >
      Name ambiguity: "COPS" here refers to Calibre OPDS (and HTML) PHP
      Server (seblucas/cops, now maintained as mikespub-org/seblucas-cops
      and packaged by LinuxServer.io as linuxserver/cops), which matches
      Hostinger's source_description exactly. No other unrelated project
      shares the "COPS" name in this space, so this identification is not
      in doubt — noted here only because the upstream repo itself moved
      from seblucas/cops to mikespub-org/seblucas-cops mid-life, which
      could otherwise read as two different apps.
    - >
      COPS has no runtime-configurable admin account of its own: any
      authentication is static htaccess/htpasswd-style config baked into
      config/local.php at build/deploy time, not something exposed via an
      environment variable af-api could populate at first boot. This is
      the same "app has no first-class login channel" shape as Adminer
      and Calibre-Web, not a harder blocker — it is solved by gating the
      whole app behind Traefik basic_auth rather than app-level auth.
  installable_today: true
  recommendation: build_with_caveats

summary: >
  COPS is a single-container, single-HTTP-port PHP app (LinuxServer.io's
  lscr.io/linuxserver/cops image, pin to tag 4.5.2) with two bind
  mounts — /config for app config and /books for the Calibre library
  folder containing metadata.db — structurally closest to
  recipes/uptime-kuma or recipes/vaultwarden (single container, no
  external DB dependency). It needs no external API keys or OAuth to
  boot, and its lack of a built-in customer-settable admin login is
  handled the same way as Calibre-Web and Adminer: a mandatory Traefik
  basic_auth gate derived from the customer's root password via
  `generated_from`. The real caveat isn't installability but redundancy:
  this is functionally the same "serve my Calibre library" job as the
  separately-analyzed Calibre-Web candidate, just with a lighter,
  read-only, no-upload feature set. Upstream health is fine once you
  track the actively-maintained mikespub-org fork rather than the
  long-dead original seblucas/cops repo. Recommend build_with_caveats:
  mechanically installable today, but only worth building if the fuller
  Calibre-Web is not built first (or vice versa) — building both would
  just split the same demand.
