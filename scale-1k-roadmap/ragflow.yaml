slug: ragflow
name: RAGFlow
source_description: "Production-grade RAG engine with deep document parsing and knowledge graphs"

upstream:
  url: https://ragflow.io
  repo_url: https://github.com/infiniflow/ragflow
  license: Apache-2.0
  docker_image: infiniflow/ragflow

version_health:
  latest_version: v0.26.4
  latest_release_date: "2026-07-07"
  release_cadence: active
  eol_status: active
  notes: >
    Latest stable v0.26.4 released 2026-07-07, about 4 weeks before today
    (2026-08-05). A dev build (dev-20260724-2) shipped 2026-07-24, roughly
    two weeks before today, confirming ongoing active development between
    stable tags. Release history shows a steady near-monthly cadence
    (v0.26.3 on 2026-07-02). No archival, EOL notice, or maintenance-only
    signal found.

catalogue_fit:
  categories: [ai, productivity]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    None of the 24 current recipes are a document-grounded RAG engine.
    Open WebUI + Ollama covers local LLM chat but has no document
    ingestion/parsing/knowledge-graph pipeline; Paperless-ngx/Paperless-AI
    do document storage and AI tagging but not retrieval-augmented Q&A over
    a corpus. RAGFlow adds "ask questions of your own documents" as a
    distinct capability.
  usefulness: medium
  usefulness_rationale: >
    Real differentiated capability (deep document parsing, knowledge
    graphs, agent workflows) with an active upstream, but it is a very
    heavy multi-service stack (official minimum RAM 16 GB, disk 50 GB —
    2-4x the floor of any recipe currently in the catalogue) and it needs
    a customer-supplied LLM API key to do anything useful post-install,
    which caps its out-of-the-box value for a typical AF customer.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues: []
  installable_today: true
  recommendation: build_with_caveats

summary: >
  RAGFlow is an active, Apache-2.0 licensed RAG engine with a genuine
  capability gap versus the current catalogue (no existing recipe does
  document-grounded retrieval + knowledge graphs). It boots via
  self-service signup — whoever visits first and clicks "Sign Up" becomes
  the tenant admin, with no admin-provisioning env var of its own — the
  same no-secret-needed pattern already accepted for recipes/open-webui,
  so nothing here is structurally blocked by the `/compose`
  no-arbitrary-input constraint. The caveats are resource footprint (16 GB
  RAM / 50 GB disk minimum — the heaviest stack in scope, needing MySQL,
  Elasticsearch/Infinity, MinIO, and Redis at minimum) and the fact that a
  customer must supply their own LLM provider API key through RAGFlow's
  Settings > Model providers screen after login before it does anything
  useful (configured post-boot via the app's own UI, not read at container
  start, so it does not block install — but the instance is an empty shell
  until they do it, same as Open WebUI needing Ollama models pulled in).
  Recommend build_with_caveats: worth building, but size the offer and set
  expectations around the bring-your-own-LLM-key requirement and the
  first-to-sign-up-wins admin claim.
