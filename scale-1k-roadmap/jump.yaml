slug: jump
name: Jump
source_description: "Self-hosted startpage and real-time status dashboard for your favourite sites"

upstream:
  url: https://github.com/daledavies/jump
  repo_url: https://github.com/daledavies/jump
  license: MIT
  docker_image: daledavies/jump

version_health:
  latest_version: "v1.4.1"
  latest_release_date: "2024-04-16"
  release_cadence: dormant
  eol_status: maintenance-only
  notes: >
    No GitHub "archived" banner and no explicit EOL announcement, but the
    project has gone quiet: last release v1.4.1 was 2024-04-16 (~28 months
    before today, 2026-08-05) and the last commit to main was 2024-05-15
    (~27 months ago, a small doc-fix PR). Release history even while active
    was sparse (roughly one release every few months to a year: v1.2.0 in
    2022-06 through v1.4.1 in 2024-04). 15 open issues remain untriaged since
    then. Treating this as functionally dormant rather than "maintenance-only"
    in spirit, even though the enum's closest available value is
    maintenance-only.

catalogue_fit:
  categories: [dashboard, startpage, monitoring]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    None of the 24 current recipes are a link/startpage dashboard. Uptime
    Kuma (recipes/uptime-kuma) is the closest sibling but is a dedicated
    uptime-monitoring tool with its own alerting, not a bookmark/launcher
    homepage; Jump's status checks are a secondary feature bolted onto a
    startpage UI. So it would add a genuinely new category rather than
    duplicate an existing recipe.
  usefulness: low
  usefulness_rationale: >
    A self-hosted startpage is a real homelab/small-team convenience item,
    but Jump specifically is a small project (607 GitHub stars), has no
    built-in auth (see installability), and has been dormant for over two
    years with unaddressed issues — shipping it now means shipping an
    unmaintained dependency with a known gap (no security patches) for a
    feature that's nice-to-have rather than differentiating.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [BASIC_AUTH_PASSWORD]
  secrets_expressible_today:
    - secret: BASIC_AUTH_PASSWORD
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: not_recommended

summary: >
  Jump is a single-container PHP startpage/status-dashboard with one HTTP
  port and no built-in authentication, so mechanically it is installable
  today behind a Traefik basic_auth gate — no secrets it needs (OWM/Unsplash
  API keys are optional, not boot-blocking) lack an input channel. The block
  is not the platform but the upstream itself: v1.4.1 (2024-04-16) is the
  last release, the last commit was 2024-05-15, and the repo has sat quiet
  for roughly 27-28 months with 15 open issues untouched. Recommend against
  building this recipe now; revisit only if upstream activity resumes.
