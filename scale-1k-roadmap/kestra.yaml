slug: kestra
name: Kestra
source_description: "Open-source workflow orchestration platform for data pipelines and automation"

upstream:
  url: https://kestra.io/
  repo_url: https://github.com/kestra-io/kestra
  license: Apache-2.0
  docker_image: kestra/kestra

version_health:
  latest_version: "1.3.31"
  latest_release_date: "2026-08-04"
  release_cadence: active
  eol_status: active
  notes: >
    v1.3.31 published 2026-08-04 (2 days before this analysis), with v1.3.30
    a week before that and v1.3.29 the week before — a tight, near-weekly
    cadence on the 1.3.x line. A parallel v1.0.5x backport/LTS line and a
    v2.0.0-rc6 pre-release (also dated 2026-08-04) are both shipping
    concurrently, and the develop branch's own default docker-compose.yml
    still points at :latest for day-to-day use. Repo is not archived,
    27.6k stars, 381 open issues and 134 open PRs under active triage.
    Clearly an active, fast-moving project, not maintenance-only.

catalogue_fit:
  categories: [automation, data]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: [n8n]
  differentiation: >
    Conceptually adjacent to n8n (both are "workflow orchestration" tools
    and both need Postgres + a single web UI port), but a different job:
    n8n is a no-code/low-code node editor for wiring together SaaS APIs,
    while Kestra is a declarative-YAML, event-driven scheduler aimed at
    data-pipeline and infrastructure orchestration (the open-source
    Airflow-alternative niche) — DAGs, triggers, backfills, millions of
    scheduled executions. No recipe in the current catalogue covers that
    data-engineering/DAG-scheduler use case, so for a customer specifically
    wanting pipeline orchestration rather than app-to-app automation,
    Kestra adds real incremental value over n8n.
  usefulness: medium
  usefulness_rationale: >
    Popular (27.6k stars), actively developed, and fills a niche (DAG-style
    data-pipeline orchestration) that n8n doesn't really address. Usefulness
    is capped at medium rather than high because it's a fairly technical,
    engineer-facing tool (declarative YAML flows, plugin ecosystem) with a
    narrower target audience than most of the catalogue's simpler
    self-hosted apps, and the installability blocker below further limits
    near-term value.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [KESTRA_BASIC_AUTH_PASSWORD, POSTGRES_PASSWORD]
  secrets_expressible_today:
    - secret: POSTGRES_PASSWORD
      mechanism: server_generated_no_customer_input
  blocking_issues:
    - >
      Since OSS 0.24.0, Kestra requires basic authentication (username +
      password) to reach the app at all. There are exactly two ways to set
      it, and neither fits the current mechanism: (1) a first-boot "Setup
      Page" at /ui/main/setup where whoever visits first types in an
      admin email + password and self-registers as the sole admin — the
      same open first-visitor race condition flagged as a structural
      blocker in apps-gaps/activepieces.yaml — or (2) a `basic-auth:
      username / password` block baked into the KESTRA_CONFIGURATION
      env var (application.yaml), which per Kestra's own migration-guide
      examples takes the password as **plaintext**, not a bcrypt/argon2
      hash. Confirmed against the migration guide's sample config
      (`password: Admin1234`) — no hashed-password field is documented.
      `generated_from: "<algo>:ROOT_PASSWORD"` only ever projects a hash,
      so it cannot populate this field; this is the genuine
      plaintext-only case the schema calls out as a structural blocker,
      not a solvable algo-support gap.
    - >
      A Traefik `basic_auth: true` gate in front of the whole app would
      stop it sitting open on the internet, but per the Activepieces
      precedent it can't also hand the customer a second, distinct
      credential for Kestra's own setup-page/basic-auth login beyond the
      single root-password projection already spent on the gate — so
      it doesn't resolve the underlying first-boot admin-provisioning gap
      either.
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  Kestra is an active, well-regarded, near-weekly-shipping data-pipeline
  orchestration platform (Apache-2.0, Postgres-backed, single web UI port,
  Traefik-friendly) that would add a genuinely new DAG/data-engineering
  capability rather than duplicate n8n outright. It's blocked from shipping
  as a recipe today for the same structural reason as Activepieces: Kestra
  OSS now mandates basic-auth, and the only two ways to set it are an open
  first-visitor self-registration setup page, or a config-file field that
  Kestra's own docs only document as accepting a plaintext password — a
  case the platform's root-password projection (hash-only) cannot satisfy.
  Revisit if Kestra adds a hashed-password config option, or once the
  platform gains a second customer-facing credential channel beyond the
  single root-password projection.
