slug: karaoke-eternal
name: Karaoke Eternal
source_description: "Self-hosted karaoke party platform where guests queue songs via mobile browser"

upstream:
  url: https://www.karaoke-eternal.com/
  repo_url: https://github.com/bhj/KaraokeEternal
  license: ISC
  docker_image: radrootllc/karaoke-eternal:2.0.2
  compose_file_url: null
  compose_file_notes: >-
    No official docker-compose file is published anywhere — not in the
    GitHub repo (github.com/bhj/KaraokeEternal has no docker-compose.yml/
    .yaml at root or under any docker/deploy/contrib directory) and not
    as a downloadable/linked file from the docs. The official install
    docs (karaoke-eternal.com/docs/karaoke-eternal-server/#installation)
    show Docker as the preferred method for dedicated servers/NAS and
    include an example "docker compose" YAML block, but it's only an
    inline example embedded in the docs page prose, not a file the
    project publishes or versions — there's nothing to link to as an
    upstream-maintained artifact.

version_health:
  latest_version: "v2.0.2 (2026-02-14)"
  latest_release_date: "2026-02-14"
  release_cadence: slowing
  eol_status: active
  notes: >-
    v2.0.2 shipped 2026-02-14, roughly 5.7 months before this analysis
    (2026-08-05). It capped a short, dense burst of activity: v2.0.0
    (2025-12-26, the "Karaoke Forever" → "Karaoke Eternal" rebrand plus
    guest accounts/QR-code joining/video visualizers), v2.0.1
    (2026-01-10), and v2.0.2 (2026-02-14), with the last commit on record
    ("docs: update changelog") dated 2026-02-14 — nothing since. That
    burst itself followed a ~3.5-year gap after v1.0.0 (2022-05-17), so
    long quiet stretches between bursts appear to be this single
    maintainer's (bhj) normal cadence rather than a new abandonment
    signal: the repo is not archived, has 8 open issues that read as
    still triaged, and shows no EOL announcement. Treat as active but
    watch for a further-lengthening quiet period before shipping.

catalogue_fit:
  categories: [media, entertainment]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >-
    None of the current 24 recipes cover party/karaoke entertainment —
    Immich, Ampache/Airsonic-style media servers aren't in the shipped
    catalogue either, and nothing else offers a mobile-browser song-queue
    + fullscreen-player experience. This would be a genuinely new,
    lighthearted use case rather than an incremental variant of an
    existing recipe.
  usefulness: medium
  usefulness_rationale: >-
    Karaoke-party hosting is a real, well-loved self-hosting niche (it's
    a long-standing entry on awesome-selfhosted) and this is the most
    actively maintained option in that niche, but it's inherently a
    narrower/occasional-use app (party nights) versus daily-driver
    categories like password managers or automation tools — hence
    medium rather than high usefulness.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >-
  Karaoke Eternal is a single-container, SQLite-backed (no external DB)
  web app exposing one HTTP port (KES_PORT, default 8080, serving both the
  guest-queue UI and the fullscreen Player over the same origin), making
  it straightforwardly reverse-proxy-compatible with no raw ports or
  extra protocols to expose. Its only credential is an admin
  username/password the operator sets themselves through a first-run web
  wizard on first visit — the same pattern already accepted for the
  shipped `immich` recipe, with no external API keys, OAuth, or
  pre-seeded secret needed, so there's no platform gap blocking it today.
  The one caveat is upstream's activity: a lively three-release burst
  ended 2026-02-14 with silence since, consistent with this single
  maintainer's historically bursty cadence rather than abandonment, but
  worth re-checking for a fresh release before actually cutting a recipe.
