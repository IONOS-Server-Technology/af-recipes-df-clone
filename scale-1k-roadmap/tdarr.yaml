slug: tdarr
name: Tdarr
source_description: "Distributed media transcoding automation with FFmpeg and HandBrake"

upstream:
  url: https://tdarr.io/
  repo_url: https://github.com/HaveAGitGat/Tdarr
  license: "Custom (source-available, free for personal/non-commercial use — see upstream LICENSE)"
  docker_image: ghcr.io/haveagitgat/tdarr

version_health:
  latest_version: "2.86.01"
  latest_release_date: "2026-08-05"
  release_cadence: active
  eol_status: active
  notes: >
    2.86.01 shipped 2026-08-05, the same day as this analysis. Preceding
    releases landed roughly weekly to every few weeks through mid-2026
    (2.85.01 2026-07-24, 2.84.01 2026-07-18, 2.83.01 2026-07-12, 2.82.02
    2026-07-05, 2.82.01 2026-07-04, 2.81.01 2026-06-26), confirmed via
    upstream commit history (Flatpak metadata bump commits accompany each
    tagged release). This is an actively developed project — the maintainer
    is also mid-way through a Rust rewrite (alpha/beta releases alongside
    the stable NodeJS line, per GitHub issue #1387) — not dormant or EOL.

catalogue_fit:
  categories: [media, automation]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue does automated media-library
    transcoding/remuxing. Immich is a photo/video backup and library tool,
    not a transcode pipeline; nothing else touches FFmpeg/HandBrake
    automation. Tdarr would appeal to customers who host a media library
    (Plex/Jellyfin elsewhere, or plain file storage on the VM) and want to
    normalize codecs/containers, shrink storage footprint, or health-check
    files on a schedule, plugin-driven and hands-off.
  usefulness: medium
  usefulness_rationale: >
    Real, standalone utility — unlike Tautulli/SyncLounge it does not
    require pairing with a specific third-party media server to do
    something useful; a customer can point it at any folder of video files
    on the VM and get automated transcode/health-check jobs. Value is
    highest for customers who also host a media server (Plex/Jellyfin/
    Immich) or who dump raw recordings into the VM's storage, which is a
    real but not universal audience. Transcoding is CPU/GPU-intensive, so
    the resource floor and any hardware-acceleration story matter more
    here than for most catalogue apps.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [webui_basic_auth_gate]
  secrets_expressible_today:
    - secret: webui_basic_auth_gate
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_with_caveats

summary: >
  Tdarr (ghcr.io/haveagitgat/tdarr, single web UI port 8265, plus an
  internal server-node port 8266 that only needs to be reachable
  server-to-node and not exposed publicly) is actively maintained with
  weekly-cadence releases and no functional overlap in our current
  catalogue. Its own authentication is off by default (`auth=false`) and,
  even when enabled, is set up interactively via a first-run web UI prompt
  rather than through any environment variable or config field we could
  hash and project — so the only viable gate is fronting the deployment
  with Traefik `basic_auth` using the customer's root-password hash, the
  same no-built-in-login pattern documented for apps like n8n and WUD in
  apps-gaps/SCHEMA.md. That makes it installable_today with no plaintext
  or third-party credential blocker. Flagged
  build_with_caveats rather than build_now because Tdarr's whole value
  proposition is CPU/GPU-heavy transcoding — a recipe needs a realistic
  resource floor and an explicit call on whether GPU passthrough is in
  scope (transcoding without it will be slow and CPU-bound) before this is
  a good customer experience, not just a mechanically installable one.
