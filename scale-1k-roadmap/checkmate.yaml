slug: checkmate
name: Checkmate
source_description: "Open source server monitoring and uptime tracking application"

upstream:
  url: https://checkmate.so/
  repo_url: https://github.com/bluewave-labs/checkmate
  license: AGPL-3.0
  docker_image: ghcr.io/bluewave-labs/checkmate:3.10.0
  compose_file_url: https://raw.githubusercontent.com/bluewave-labs/checkmate/master/docker/docker-compose.yaml
  compose_file_notes: >
    Official file, published at docker/docker-compose.yaml in the
    project's own repo and linked directly from the README's "quickest
    way to run Checkmate" install instructions (curl -O ... then
    JWT_SECRET=... docker compose up -d). The README's curl command
    points at the master branch, so this is a rolling reference to the
    default branch, not pinned to a release tag — it will track future
    changes to the file rather than staying fixed at the 3.10.0 state
    described elsewhere in this record. Only one variant is offered (no
    separate GPU/CPU or sqlite/postgres flavors): the all-in-one
    Checkmate app container plus a MongoDB 8.0 service.

version_health:
  latest_version: "v3.10.0"
  latest_release_date: "2026-07-28"
  release_cadence: active
  eol_status: active
  notes: >
    Not archived; last code push to the repo was 2026-08-05 (today), and
    releases have landed roughly every 2-4 weeks since early 2026 (v3.4.0
    2026-02-20, v3.5.0/v3.5.1 early March, v3.6.1 late April, v3.7.1 late
    April, v3.8.0/v3.8.1 early June, v3.9.1/v3.9.2 early July, v3.10.0
    2026-07-28 — one week before today). This reads as a genuinely active
    project, not a diplomatic softening.

catalogue_fit:
  categories: [monitoring]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: [uptime-kuma]
  differentiation: >
    Core uptime/HTTP/ping/SSL/port monitoring is a near-exact duplicate of
    the existing uptime-kuma recipe. Checkmate's differentiators are
    heavier-weight: Docker container monitoring, an optional remote
    "Capture" agent for hardware metrics (CPU/RAM/disk/temp) on monitored
    servers, incident tracking with team/multi-user support, themeable
    public status pages, and DNS/game-server monitor types. It needs
    MongoDB as a separate service, versus uptime-kuma's single
    self-contained SQLite container.
  usefulness: low
  usefulness_rationale: >
    The uptime-monitoring use case a typical customer wants is already
    covered by uptime-kuma with a much lighter footprint (single
    container, no DB dependency). Checkmate's extra features (hardware
    metrics via a separate agent, team management) target a more
    infra-heavy, multi-server use case that's a poor fit for the kind of
    customer provisioning a single AF app instance, so the added value
    over uptime-kuma is marginal for this catalogue.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [JWT_SECRET]
  secrets_expressible_today:
    - secret: JWT_SECRET
      mechanism: server_generated_no_customer_input
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Checkmate is mechanically installable today: it needs only a
  server-generated JWT_SECRET and an internal MongoDB connection string,
  neither of which requires a customer-supplied value — the first admin
  account is created by whoever visits the app's own /register page after
  deploy, the same self-service pattern already accepted for uptime-kuma.
  The project itself is healthy and actively maintained (release a week
  ago, commits today). It overlaps with uptime-kuma's core uptime-monitoring
  job and adds a MongoDB dependency plus heavier multi-server features
  (hardware agent, teams, incidents), but with no blocking installability
  issues it is build_now.
