slug: wbo
name: WBO
source_description: "Real-time collaborative whiteboard for team brainstorming and remote meetings"

upstream:
  url: https://wbo.ophir.dev
  repo_url: https://github.com/lovasoa/whitebophir
  license: AGPL-3.0
  docker_image: lovasoa/wbo

version_health:
  latest_version: "v2.17.0"
  latest_release_date: "2026-08-05"
  release_cadence: active
  eol_status: active
  notes: >
    v2.17.0 tagged today (2026-08-05), preceded by v2.16.0 (2026-07-13) and
    v2.15.0/v2.14.0 (both 2026-07-05) — a release roughly every 1-4 weeks
    over the last month, with continuous commit activity from the primary
    maintainer (lovasoa) in between (moderation UI, presence display,
    dependency bumps). No signs of slowdown, archival, or EOL.

catalogue_fit:
  categories: [productivity, collaboration, whiteboard]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    None of the current 24 recipes offer a whiteboard/sketching tool, so WBO
    would open a new category. The closest comparison is not in the
    catalogue itself but in a sibling gap-analysis candidate, Excalidraw
    (apps-gaps/excalidraw.yaml): Excalidraw's official Docker image is a
    client-only static frontend with no server-side collaboration relay,
    whereas WBO's official image ships a real Node/Socket.io server that
    persists boards to disk and relays live multi-cursor drawing between
    connected clients out of the box — it is the more literal match for
    Hostinger's "real-time collaborative whiteboard" description of the two.
  usefulness: high
  usefulness_rationale: >
    Fills a genuine category gap and, unlike Excalidraw, delivers real
    server-side real-time collaboration with the stock image rather than
    needing an extra websocket-relay build to earn the word
    "collaborative." Simple single-container footprint (~120MB image, one
    Node process, no database) makes it cheap to run per customer.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [basic_auth_password]
  secrets_expressible_today:
    - secret: basic_auth_password
      mechanism: traefik_basic_auth
  blocking_issues:
    - >
      WBO has no built-in username/password login of its own: any board URL
      is openly readable/editable by anyone who has (or guesses) the link
      unless the operator wires up its optional AUTH_SECRET_KEY JWT
      capability system (canOpen/canEdit/canClear claims). That JWT flow
      needs externally-issued signed tokens per board/user, not a single
      admin credential — there's no channel to project a customer value
      into it today. Not a hard blocker for the recipe overall since a
      mandatory Traefik basic_auth gate in front of the whole app covers
      the same "don't sit open on the internet" need (the WUD/Excalidraw
      pattern), but it does mean the recipe ships without WBO's own
      per-board access control, just the outer gate.
  installable_today: true
  recommendation: build_now

summary: >
  WBO is a single-container, single-port (HTTP) Node app with an official,
  actively-maintained, frequently-tagged Docker image (lovasoa/wbo,
  AGPL-3.0) — it is Traefik-friendly and mechanically installable today
  behind a mandatory basic_auth gate, since the app itself has no login of
  its own out of the box. It would be the catalogue's first real
  collaborative-whiteboard recipe, and does so with genuine server-side
  real-time collaboration built into the stock image (unlike the
  client-only Excalidraw candidate), making it a strong build_now
  candidate.
