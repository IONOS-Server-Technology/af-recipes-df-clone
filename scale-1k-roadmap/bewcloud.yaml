slug: bewcloud
name: bewCloud
source_description: "Lightweight self-hosted cloud storage with file sync and CalDAV/CardDAV support"

upstream:
  url: https://bewcloud.com
  repo_url: https://github.com/bewcloud/bewcloud
  license: AGPL-3.0
  docker_image: ghcr.io/bewcloud/bewcloud
  compose_file_url: https://github.com/bewcloud/bewcloud/blob/main/docker-compose.yml
  compose_file_notes: >
    Official compose file, checked into the project's own repo root
    (github.com/bewcloud/bewcloud), not a third-party template. The link
    above points at the `main` branch, so it's a rolling reference that
    tracks whatever is current on the default branch rather than a
    version-pinned tag or release asset — bewCloud does not publish
    release-tagged compose assets, so there is no pinned alternative to
    use instead. The file itself pins the `website` service to a specific
    image tag (currently ghcr.io/bewcloud/bewcloud:v4.15.0), so the app
    version served is pinned even though the compose file's own location
    is not. There is only one variant shipped (this repo also has
    docker-compose.dev.yml for development, which was not picked since
    it's not meant for production use); the file bundles postgres and an
    optional tomsquest/docker-radicale sidecar for CalDAV/CardDAV, which
    the existing summary already notes can be omitted for a minimal
    install.

version_health:
  latest_version: "v4.13.2"
  latest_release_date: "2026-08-02"
  release_cadence: active
  eol_status: active
  notes: >
    Latest release v4.13.2 published 2026-08-02, 3 days before today
    (2026-08-05). Release history shows a fast, steady cadence through
    2026: v4.5.1 (2026-05-06), v4.6.0 (2026-06-05), v4.7.0 (2026-06-10),
    v4.8.0 (2026-06-16), v4.9.0 (2026-06-27), v4.10.0 (2026-06-29), v4.12.0
    (2026-07-03), v4.13.0 (2026-07-25), v4.13.1 (2026-07-31), v4.13.2
    (2026-08-02) — multiple releases per month, all signed by the same
    maintainer (BrunoBernardino). Not archived, actively developed
    (WebDAV, passkey login, and security fixes all shipped within the
    last two months). No EOL signals whatsoever.

catalogue_fit:
  categories: [productivity, file-storage, groupware]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24 recipes offers centralized personal cloud
    storage with a web UI plus built-in CalDAV/CardDAV sync — Syncthing is
    p2p device-to-device sync with no central storage or calendar/contacts
    support, and no Nextcloud/ownCloud-class app exists in the catalogue.
    bewCloud fills that "lightweight Nextcloud alternative" niche: file
    storage, calendar, and contacts in one low-resource (Deno-based,
    <50MB RAM claimed) container.
  usefulness: high
  usefulness_rationale: >
    Personal cloud storage + calendar/contacts sync is one of the most
    commonly requested self-hosting use cases, and bewCloud covers it with
    a single lightweight stack instead of a heavyweight Nextcloud install
    — good fit for smaller VPS-class instances that this catalogue targets.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  bewCloud is a Postgres-backed, actively maintained (release 3 days ago,
  multiple releases per month) Deno app with its own web UI, reverse-proxy
  compatible on a single HTTP port. It ships an official pinned image
  (ghcr.io/bewcloud/bewcloud:v4.13.2) plus a documented docker-compose.yml
  (postgres:18.4, and an optional tomsquest/docker-radicale sidecar for
  CalDAV/CardDAV — can be omitted for a minimal install). There is no admin
  env var; like Uptime Kuma/BeaverHabits, the account is created
  interactively and the first person to sign up becomes admin. Upstream's
  own docs note that even with `config.auth.allowSignups=false` baked into
  the shipped config, "the first signup will work and become an admin" —
  so setting that flag as a fixed (non-customer) config value closes
  registration immediately after the customer's first visit, the same
  pattern already accepted for BeaverHabits. No customer-supplied secret is
  needed at first boot, JWT_SECRET/PASSWORD_SALT can be generated
  server-side, and SMTP/OIDC/MFA env vars are all optional and unneeded to
  boot. No overlap with the current catalogue and clear differentiation.
  Recommend building the recipe.
