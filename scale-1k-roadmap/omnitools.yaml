slug: omnitools
name: OmniTools
source_description: "OmniTools is an all-in-one web toolkit with 80+ utilities for everyday tasks"

upstream:
  url: https://github.com/iib0011/omni-tools
  repo_url: https://github.com/iib0011/omni-tools
  license: MIT
  docker_image: iib0011/omni-tools
  compose_file_url: null
  compose_file_notes: >
    No docker-compose.yaml/.yml file exists anywhere in the repo (root,
    docker/, deploy/, contrib/ all 404). The README's "Docker Compose"
    section only embeds an inline YAML snippet as documentation text (a
    single omni-tools service on image iib0011/omni-tools:latest, port
    8080:80) — it is not a file the project publishes or updates, so there
    is nothing to link to as an official compose file per this issue's
    criteria.

version_health:
  latest_version: "0.6.0"
  latest_release_date: "2025-10-03"
  release_cadence: slowing
  eol_status: active
  notes: >
    Releases were roughly monthly through 2025 (0.1.0 Feb 2025 through 0.6.0
    Oct 2025), then stopped — no new version tag in the ~10 months since
    (today is 2026-08-05). The `latest` Docker tag was pushed only 3 days
    ago, so commits/image builds are still landing on main; it's just that
    nothing has been cut into a new semver release/tag since 0.6.0. Repo is
    not archived, has 10k+ stars, 60 open issues, and shows ongoing
    issue/PR activity — read as active-but-slowing, not dormant or EOL.

catalogue_fit:
  categories: [productivity, developer-tools]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue is a general-purpose
    utility toolkit (image/PDF/video/audio conversion, text/code
    formatting, JSON/CSV/XML transforms, calculators, encoders). Closest
    adjacent tools (OpenGist for snippets, Paperless-ngx for documents) are
    narrowly scoped; OmniTools would be additive rather than duplicative.
  usefulness: medium
  usefulness_rationale: >
    All processing is client-side in the browser (WASM/Canvas/File APIs) —
    the server does nothing but serve a static SPA, so there's no server-side
    differentiator once self-hosted beyond "a page full of bookmarklet-like
    tools that data never leaves your browser for." Handy day-to-day
    convenience for a customer, but low technical depth and no persistent
    data, so it's a nice-to-have rather than a flagship recipe.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [basic_auth_gate_credential]
  secrets_expressible_today:
    - secret: basic_auth_gate_credential
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  OmniTools is a single lightweight (~30MB) container serving a static,
  purely client-side React SPA on port 80/8080 — no database, no volumes,
  no env vars, and no login of its own. It's mechanically trivial to ship
  behind Traefik with a basic_auth gate (the only meaningful "secret" it
  needs), and doesn't duplicate anything in the current catalogue.
  Versioned releases have gone quiet for ~10 months even though the image
  still gets rebuilt, but the repo remains active (10k+ stars, ongoing
  issue/PR activity) and there are no blocking issues for a first boot.
  Mechanically installable today with no caveats — build_now.
