slug: foxel
name: Foxel
source_description: "Self-hosted private cloud storage with AI semantic search for photos and files"

upstream:
  url: https://foxel.cc
  repo_url: https://github.com/DrizzleTime/Foxel
  license: MIT
  docker_image: ghcr.io/drizzletime/foxel:v2.2.2

version_health:
  latest_version: "v2.2.2"
  latest_release_date: "2026-05-10"
  release_cadence: slowing
  eol_status: active
  notes: >
    Today is 2026-08-05. v2.2.2 (2026-05-10) is the newest tagged release,
    about 3 months old. Releases were roughly monthly through the project's
    first half of 2026 (v1.7.2 2026-01-16 through v2.2.2 2026-05-10, six
    tagged releases in under 4 months), but no new version tag has landed
    since — only a rolling `dev` image tag (last pushed ~13 days ago,
    ~2026-07-24). Commit history on `main` shows activity as recently as
    2026-07-24 (dependency bumps plus small feature/fix commits), so the
    project is not dormant, but the pace of cut releases has visibly slowed
    relative to the Jan-May cadence. Repo is young (first tag Jan 2026, ~1.0k
    GitHub stars, 91 forks) with no maintenance-only or EOL signal.

catalogue_fit:
  categories: [media, productivity]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: [immich]
  differentiation: >
    Immich is the closest existing recipe (also AI-search-over-photos), but
    Immich is scoped to mobile photo/video backup and organizing. Foxel is a
    general-purpose private cloud drive (Nextcloud-style unified browser for
    local storage, S3, WebDAV, SFTP/FTP, Google Drive/OneDrive/Dropbox,
    Telegram, AList) with AI semantic search layered across all file types,
    not just photos. None of the current 24 recipes cover general
    multi-backend cloud storage, so Foxel would fill that gap; the overlap
    with Immich is real but partial (photo AI search vs. general file
    storage AI search).
  usefulness: medium
  usefulness_rationale: >
    Self-hosted "own your files" cloud storage is a consistently popular
    self-hosting want, and the AI semantic search angle differentiates it
    from a plain file browser. Capped at medium rather than high because
    full semantic search depends on configuring an external embedding
    provider (OpenAI-compatible API key) and a vector database (Milvus or
    Qdrant) — the headline AI feature isn't fully usable out of the box
    the way it is for Immich, which ships local ML models.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues:
    - >
      Full AI semantic search requires the customer to supply an external
      embedding-provider API key (OpenAI-compatible) with no input channel
      today; this is not a hard blocker on the base app (storage/browsing
      works without it) but means the app's headline feature would ship
      non-functional out of the box.
  installable_today: true
  recommendation: build_with_caveats

summary: >
  Foxel is mechanically simple to install today: one container
  (ghcr.io/drizzletime/foxel:v2.2.2), a single HTTP port (8088→80, Traefik
  friendly), SQLite plus an embedded Milvus Lite vector store with no
  required external database, and a first-boot setup wizard where the
  customer creates their own admin username/password interactively through
  the app's own UI — the same no-boot-secret pattern already used for
  gitea and Immich, so it is not blocked by the root-password-hash /
  basic-auth-only mechanism. The catch is the marquee AI semantic search
  feature: it needs an externally-configured embedding provider (API key)
  and optionally a standalone Milvus/Qdrant instance, neither of which have
  a customer-input channel today, so a shipped recipe would boot fine but
  land with search effectively disabled until a customer manually configures
  it post-install. Combined with a recent slowdown in tagged releases (last
  one 3 months ago against a prior near-monthly cadence), recommend
  build_with_caveats rather than build_now.
