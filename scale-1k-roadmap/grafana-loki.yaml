slug: grafana-loki
name: Grafana Loki
source_description: "Prometheus-inspired log aggregation system with bundled Grafana query UI"

upstream:
  url: https://grafana.com/oss/loki/
  repo_url: https://github.com/grafana/loki
  license: AGPL-3.0
  docker_image: grafana/loki
  compose_file_url: https://raw.githubusercontent.com/grafana/loki/v3.7.0/examples/getting-started/docker-compose.yaml
  compose_file_notes: >
    Official - linked directly from Grafana's own Loki installation docs
    (grafana.com/docs/loki/latest/setup/install/docker/), which instruct
    users to download this exact file. Version-pinned to the v3.7.0 tag (not
    a rolling main-branch reference) - the docs page embeds whichever
    release tag matches its own doc version, so this URL will need
    re-checking against grafana.com/docs/loki/latest/setup/install/docker/
    as newer releases ship rather than auto-following upstream. This is the
    "getting-started" example: an 8-service simple-scalable deployment
    (read/write/backend Loki components behind an nginx gateway, MinIO for
    object storage, Grafana for the query UI, plus Alloy for log
    collection and a `flog` test log generator) - the only compose file
    Grafana ships in this examples directory, so no variant choice was
    needed. Note this is heavier than the two-container
    Loki+Grafana stack assumed in this file's installability/summary
    sections (monolithic Loki + Grafana) - a future recipe author should
    decide whether to follow this upstream scalable topology or the
    simpler monolithic one already analyzed here.

version_health:
  latest_version: "3.7.5"
  latest_release_date: "2026-08-05"
  release_cadence: active
  eol_status: active
  notes: >
    v3.7.5 shipped 2026-08-05 (today), a bugfix release (packaging, an
    ingester flush race condition, and security patches for compression and
    crypto libraries) on top of the 3.7.x line. Recent history: v3.6.14
    (2026-08-04), v3.6.13 (2026-07-23), v3.7.4 (2026-07-22), v3.7.3 /
    v3.6.12 (2026-06-24), v3.7.2 / v3.6.11 (2026-05-13) — two parallel
    maintained minor lines (3.6.x and 3.7.x) both receiving patches every
    3-5 weeks. Clearly active development, not archived or maintenance-only.

catalogue_fit:
  categories: [monitoring, observability, developer-tools]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24 recipes covers log aggregation/observability.
    Uptime Kuma checks whether a service is up; Loki+Grafana lets a
    customer centralize and query logs from multiple apps/containers
    (including several already in this catalogue) via LogQL, with
    dashboards, alerting rules, and a proper query UI. Distinct niche from
    anything currently offered.
  usefulness: medium
  usefulness_rationale: >
    Real value for a self-hosted-stack customer running several other AF
    apps who wants a single place to search logs, but it's a
    developer/ops-facing tool rather than a consumer app, and on its own
    (without log shippers like Promtail/Alloy pointed at other containers)
    it has nothing to ingest — most of its value depends on setup work
    outside what a recipe installs.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [BASIC_AUTH_GATE]
  secrets_expressible_today:
    - secret: BASIC_AUTH_GATE
      mechanism: traefik_basic_auth
  blocking_issues:
    - >
      Same underlying issue as apps-gaps/grafana.yaml, since "bundled
      Grafana query UI" (per Hostinger's description) means the
      customer-facing login is Grafana's own admin account, normally set
      via a plaintext-only, first-boot-only GF_SECURITY_ADMIN_PASSWORD that
      `generated_from` cannot populate (it only ever carries a hash of the
      customer's root password). Resolved the same way as grafana.yaml:
      Grafana supports fully disabling its own login
      (GF_AUTH_ANONYMOUS_ENABLED=true, GF_AUTH_ANONYMOUS_ORG_ROLE=Admin,
      GF_AUTH_DISABLE_LOGIN_FORM=true), which removes the in-app credential
      requirement and shifts the sole auth boundary to a Traefik
      basic_auth gate - an expressible mechanism today.
    - >
      Unlike a bare Grafana recipe, this app is marketed specifically for
      its per-user login/RBAC (viewer/editor/admin roles a customer would
      reasonably expect to assign to a team), so disabling native auth in
      favor of one shared basic-auth credential is a lossier compromise
      here than in grafana.yaml. Not a hard blocker - mechanically
      identical to the accepted grafana.yaml resolution - but flagged as a
      caveat for reviewer judgment rather than a clean build_now.
    - >
      Loki itself (the log-storage/query API on port 3100) has no
      authentication of its own and is not designed to be exposed directly
      to customers - only Grafana's UI should be public; Loki should stay
      on the internal docker network only. This is a recipe-design detail,
      not a structural blocker, but worth noting since it affects the
      ports/parameters section of any future recipe draft.
  installable_today: true
  recommendation: build_with_caveats
summary: >
  Grafana Loki (image `grafana/loki`, pin `3.7.5`) is a log aggregation
  backend with no UI or auth of its own; the customer-facing product per
  Hostinger's description is Loki + a bundled Grafana container as the
  query UI, a clean two-container stack behind Traefik (only Grafana's
  port needs to be public - Loki's API port 3100 stays internal). Its
  login boundary is Grafana's own admin account, the identical issue
  already resolved in apps-gaps/grafana.yaml: Grafana's anonymous-auth
  settings (GF_AUTH_ANONYMOUS_ENABLED=true,
  GF_AUTH_ANONYMOUS_ORG_ROLE=Admin, GF_AUTH_DISABLE_LOGIN_FORM=true) disable
  the plaintext-only, first-boot-only GF_SECURITY_ADMIN_PASSWORD entirely
  and shift the sole auth boundary to a Traefik basic_auth gate - an
  expressible mechanism today via `generated_from` on BASIC_AUTH_GATE.
  Upstream is actively maintained (two parallel patch lines, releases every
  3-5 weeks, a release as recent as today). Fills a genuine observability
  gap not covered by the current 24 recipes, but is a narrower ops-tooling
  play with most of its value dependent on external log-shipper setup, and
  the basic_auth gate is a lossier compromise here than in grafana.yaml
  since this app's differentiator is specifically its per-user RBAC -
  recommend `build_with_caveats`, flagging that RBAC-loss tradeoff for
  reviewer sign-off.
