slug: skyvern
name: Skyvern
source_description: "Skyvern is an AI-powered browser automation tool using LLMs and computer vision"

upstream:
  url: https://www.skyvern.com/
  repo_url: https://github.com/Skyvern-AI/skyvern
  license: AGPL-3.0
  docker_image: public.ecr.aws/skyvern/skyvern (paired with public.ecr.aws/skyvern/skyvern-ui — two-image stack, no single "the" image)

version_health:
  latest_version: "v1.0.48"
  latest_release_date: "2026-08-05"
  release_cadence: active
  eol_status: active
  notes: >
    v1.0.48 published today (2026-08-05). Preceding tags show a near-weekly
    or faster cadence through mid-2026: v1.0.47 (2026-07-16), v1.0.46
    (2026-07-08), v1.0.45 (2026-07-07), v1.0.44 (2026-06-30), v1.0.43/v1.0.42
    (2026-06-18), v1.0.41 (2026-06-11), v1.0.40 (2026-06-10), v1.0.39
    (2026-06-08). The project crossed from the v0.2.x line (last seen
    ~2025-10) to 1.0.x by mid-2026, and June 2026 also brought a product
    rename (Workflows → Agents, public API moved under /v1/run/agents) —
    both signs of active, ongoing development rather than stagnation.
    22k+ GitHub stars, YC-backed, repo not archived, commit activity
    current. Clearly active, no maintenance-only or EOL signal found.

catalogue_fit:
  categories: [ai, automation, browser-automation]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: [openclaw, hermes-agent]
  differentiation: >
    No recipe today covers browser/RPA-style automation specifically —
    Skyvern drives a real headless/headful browser via LLM + computer
    vision to fill forms, navigate sites, and complete workflows it has
    never seen before, without brittle site-specific selectors. openclaw
    and hermes-agent are the closest existing entries (also "self-hosted AI
    agent" positioning) but both are messaging-app-first (Telegram
    gateway/bot with a secondary dashboard) and don't operate a browser as
    their core mechanism. Skyvern is web-UI-first (workflow builder,
    livestreaming of the browser session, artifact/file management) and its
    use case — automating web-based tasks a business already does by hand
    (data entry, form submission, scraping behind logins) — is genuinely
    distinct from "chat with an agent over Telegram." Real differentiator,
    but conceptually adjacent enough to both existing agent recipes that it
    should be weighed against them, not treated as filling an empty niche.
  usefulness: medium
  usefulness_rationale: >
    Popular, well-funded, actively-developed browser-automation-via-LLM
    tool with a distinct RPA-flavored use case versus the catalogue's
    existing chat-first AI agents. Capped at medium rather than high because
    it is presently blocked on installability (see below) and because two
    adjacent "AI agent" recipes already exist, so the incremental catalogue
    value depends on whether a customer specifically wants browser-driving
    automation rather than a chat-driven agent.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot:
    - llm_provider_api_key
    - "Traefik basic-auth gate credential"
  secrets_expressible_today:
    - secret: "Traefik basic-auth gate credential"
      mechanism: traefik_basic_auth
  blocking_issues:
    - >
      Confirmed against upstream self-hosting docs and the shipped
      docker-compose.yml: at least one LLM provider (OpenAI, Anthropic,
      Azure OpenAI, AWS Bedrock, Gemini, OpenRouter, Groq, or a
      self-hosted Ollama endpoint) must be enabled and its API key set in
      the `skyvern` container's `.env` *before* first startup —
      ENABLE_<PROVIDER>=true, <PROVIDER>_API_KEY=..., and LLM_KEY=... are
      read at container start, not configured later through the UI. This
      is a mandatory external API key with no projection channel under the
      current `/compose` mechanism (root-password hashing cannot produce a
      third party's LLM API key), matching the "external API key the app
      can't function without" no-channel case in apps-gaps/SCHEMA.md.
      Ollama does not remove the blocker: it just shifts the requirement to
      standing up and reaching a separate LLM endpoint, which the customer
      still has to configure post-boot and which the compose stack does not
      include.
    - >
      The `skyvern-ui` frontend has no built-in username/password login
      surfaced in the docs or compose env — it would need a Traefik
      `basic_auth` gate (root-password hash) to avoid sitting open on the
      internet, the same pattern used for n8n/OpenClaw/WUD/Open
      WebUI/Immich. That gate alone is expressible today; it just doesn't
      resolve the LLM-key blocker above.
    - >
      The app's own internal API_KEY (used for API-server auth) is
      generated automatically on first container startup — that piece is
      server_generated_no_customer_input and not a blocker on its own, only
      called out for completeness.
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  Skyvern is an active, fast-shipping (multiple releases in the last month,
  latest v1.0.48 today, 2026-08-05), well-funded browser-automation tool
  that fills a real gap — no current recipe drives a real browser via LLM +
  computer vision the way Skyvern does, distinguishing it from the
  catalogue's existing chat-first agents (openclaw, hermes-agent). It is
  reverse-proxy-compatible (skyvern-ui on a single HTTP port) and would
  otherwise be a reasonable build. It is blocked today purely on the
  external-API-key problem: at least one LLM provider's API key must be
  baked into the `skyvern` container's `.env` before the stack can do
  anything useful, and there is no channel today for a customer to supply
  that at `/compose` time. Revisit once the platform has a real
  arbitrary-secret input channel (beyond root-password hash projection);
  until then this is blocked_on_platform, not build_now.
