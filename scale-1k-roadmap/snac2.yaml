slug: snac2
name: Snac2
source_description: "Minimalist ActivityPub server in portable C for joining the Fediverse"

upstream:
  url: https://codeberg.org/grunfink/snac2
  repo_url: https://codeberg.org/grunfink/snac2
  license: MIT
  docker_image: null  # no official published image; the shipped docker-compose.yml builds the image from source (Dockerfile in-repo) rather than pulling a pinned tag from a registry

version_health:
  latest_version: "2.93"
  latest_release_date: "2026-06-26"
  release_cadence: active
  eol_status: active
  notes: >
    41 days since the latest tag (2.93, 2026-06-26) as of today (2026-08-05).
    Tag history shows a steady near-monthly cadence: 2.92 (2026-05-13), 2.91
    (2026-03-23), 2.90 (2026-02-17), 2.89 (2026-01-22), 2.88 (2026-01-13),
    2.87 (2026-01-06), 2.86 (2026-01-05), 2.85 (2025-12-04), 2.84
    (2025-10-27) — 93 tags total, 4,400+ commits. Genuinely active
    single-maintainer project, no signs of maintenance-only mode or
    abandonment.

catalogue_fit:
  categories: [social, communication]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    No recipe in the current 24-recipe catalogue covers federated social
    networking / microblogging. Snac2's pitch is extreme minimalism: no
    database (flat-file storage), only OpenSSL + curl as dependencies, no
    JavaScript in the UI, cookie-free, single static binary — a much
    lighter-weight "run your own fediverse presence" option than Mastodon
    or even the Rust/`.NET` alternatives already covered in sibling
    gap-analyses (apps-gaps/mitra.yaml, apps-gaps/iceshrimp.yaml), both
    also flagged blocked_on_platform for the same class of admin-account
    provisioning gap seen here.
  usefulness: medium
  usefulness_rationale: >
    Genuine niche appeal for hobbyists wanting a personal, low-resource
    Fediverse account without Mastodon's Ruby/Rails+Sidekiq+Postgres+Redis
    footprint. Capped at medium rather than high: it's a much smaller/less
    recognized brand than Mastodon, Mastodon-API compatibility only covers
    read-side client apps (snac2 has no built-in signup flow at all), and
    — see installability below — first-user provisioning is entirely
    outside our current mechanism.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot:
    - admin_user_password
  secrets_expressible_today: []
  blocking_issues:
    - >
      There is no first-boot admin account at all. Per the admin manual
      (snac(8)) and Debian manpages, every user — including the first/only
      admin-equivalent account on a single-user instance — is created by
      running `snac adduser <basedir>` as an interactive command inside the
      container after it is already running: it prompts for information at
      a terminal, one field at a time. There is no env var, config-file
      field, or non-interactive CLI flag documented anywhere (upstream
      README, snac.1/snac.8 manpages, Debian packaging) to preset a
      username/password at container boot. This is a strictly worse shape
      than the "web self-registration race" problem already documented for
      Iceshrimp.NET and Mitra: it isn't even reachable from an automated
      `/compose`/`/bootstrap` flow, since there's no TTY for our bootstrap
      pipeline to answer — it requires a human operator to `docker exec -it`
      into the running container post-boot.
    - >
      Even setting aside the interactivity problem, `generated_from` only
      ever projects a pre-computed hash of the customer's root password
      onto a `type: password` metadata parameter that the app reads at
      boot (env var or config). Snac2 has no such parameter to target —
      the credential is typed at an interactive prompt, not read from
      config — so neither `generated_from` nor a plaintext-password
      channel exists today.
    - >
      A Traefik `basic_auth: true` gate does not substitute: snac2 has its
      own real password-based web login (it's not a no-login app), so
      gating the domain with basic auth would add an extra password on
      top of an admin account that still has no way to be provisioned
      with a customer-known credential — same reasoning as
      apps-gaps/mitra.yaml.
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  Snac2 is an actively maintained (near-monthly tags, latest 41 days old),
  extremely lightweight ActivityPub server with no overlap in the current
  24-recipe catalogue and a real differentiation angle (flat-file storage,
  minimal dependencies, far lighter than Mastodon). It's reverse-proxy
  friendly (single HTTP port, no raw protocols) and would open a new
  social/fediverse category alongside the already-analyzed Mitra and
  Iceshrimp.NET candidates. It fails installability more decisively than
  either sibling: the only account-creation path is an interactive
  `snac adduser` terminal prompt run after the container is already up,
  with no env var, config field, or non-interactive flag to preset a
  credential — there is no automation channel at all, not just a missing
  hash-projection mechanism. Recommend `blocked_on_platform`: revisit only
  if upstream adds a non-interactive, config- or env-var-driven first-user
  bootstrap path.
