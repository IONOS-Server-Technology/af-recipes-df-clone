slug: profilarr
name: Profilarr
source_description: "Sync quality profiles and custom formats to Radarr and Sonarr automatically"

upstream:
  url: https://github.com/Dictionarry-Hub/profilarr
  repo_url: https://github.com/Dictionarry-Hub/profilarr
  license: AGPL-3.0
  docker_image: ghcr.io/dictionarry-hub/profilarr
  compose_file_url: null
  compose_file_notes: >
    No standalone official compose file exists for the documented
    production stack. The root-level compose.yml and compose.dev.yml in
    Dictionarry-Hub/profilarr are the maintainers' own dev/test harness:
    compose.yml pins the profilarr image to the :develop tag (the
    project's own release-channel table calls :develop pre-release/beta,
    "not guaranteed stable") and maps port 6869:6868, while compose.dev.yml
    builds both images from source (build: context/dockerfile). Neither is
    the config the project recommends to end users. The actual "Production"
    guidance is a fenced docker-compose YAML block embedded directly in
    README.md under "## Getting Started > ### Production"
    (https://github.com/Dictionarry-Hub/profilarr#-getting-started), using
    ghcr.io/dictionarry-hub/profilarr:latest (the stable release channel,
    not :develop) on port 6868:6868 plus its own parser sidecar, also on
    :latest. This is a rolling reference — :latest tracks whatever the
    stable channel currently resolves to, not pinned to a specific release
    — the README also documents develop, an exact version tag (e.g.
    2.1.0), and a major-only tag (2) as alternative channels.

version_health:
  latest_version: "v2.0.9"
  latest_release_date: "2026-06-24"
  release_cadence: active
  eol_status: active
  notes: >
    v2.0.9 shipped 2026-06-24, about 6 weeks before today (2026-08-05).
    Before that the project cut nine tagged releases (v2.0.1 through
    v2.0.9) in roughly five weeks (2026-05-19 to 2026-06-24), a fast
    cadence. No new tag since, but the repo's default branch was last
    pushed to 2026-08-04, one day before today, and it carries 39 open
    issues that are still being triaged — so upstream development is
    ongoing even though tagging has slowed slightly. Repo is not archived.
    Note the project went through a major rewrite: v1.x (last release
    v1.1.5, 2026-06-23) is explicitly deprecated in favor of the v2.x line,
    which is the version this analysis targets.

catalogue_fit:
  categories: [media, automation]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue touches media-library
    automation. Profilarr manages and syncs Radarr/Sonarr quality profiles
    and custom formats (optionally pulling curated rule sets from a
    community "Dictionarry" repo) across one or more *arr instances. Like
    Bazarr (see apps-gaps/bazarr.yaml), it has zero standalone value: it is
    a pure companion tool that must be pointed at existing Radarr and/or
    Sonarr installations, entered through its own UI after boot. Neither
    Radarr nor Sonarr exists as an AF recipe today, so a customer
    installing Profilarr alone gets a configuration tool with nothing to
    configure until they separately run Radarr/Sonarr themselves.
  usefulness: low
  usefulness_rationale: >
    Niche even within the self-hosted media-server community — it is a
    power-user layer on top of Radarr/Sonarr, not a replacement or
    standalone utility, and both of its required targets are themselves
    absent from our catalogue (same structural gap flagged for Bazarr).
    Shipping it in isolation would hand customers a dead-end app; it only
    makes sense bundled with a future "media automation stack" decision
    that also adds Radarr/Sonarr.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Profilarr is a two-container app (ghcr.io/dictionarry-hub/profilarr web
  UI on port 6868, plus a companion "parser" sidecar with no public port)
  that is mechanically simple to deploy behind Traefik — single public
  HTTP port, no raw protocols, structurally close to uptime-kuma/
  anytype-server in the catalogue. Auth defaults to built-in mode ("on"):
  the first visitor to the web UI creates their own admin username and
  password directly in-app, the same pattern already accepted for
  uptime-kuma, so no customer-supplied secret or basic_auth gate is
  required to boot safely. Profilarr does nothing without at least one
  Radarr or Sonarr instance to sync against (their URL/API key entered
  through Profilarr's own UI post-login, not needed to boot), and neither
  exists in our catalogue yet — but that is a usefulness/overlap
  consideration, not an installability blocker. installable_today is true
  with no blocking issues, so recommendation is build_now; whether to
  prioritize it alongside a broader media-automation stack (Bazarr,
  Radarr, Sonarr) is a separate scheduling decision.
