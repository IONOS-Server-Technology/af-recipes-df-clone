slug: wallos
name: Wallos
source_description: "Self-hosted subscription tracker for managing recurring payments and budgets"

upstream:
  url: https://wallosapp.com/
  repo_url: https://github.com/ellite/Wallos
  license: GPL-3.0
  docker_image: bellamy/wallos
  compose_file_url: https://raw.githubusercontent.com/ellite/Wallos/main/docker-compose.yaml
  compose_file_notes: >
    Official file, published by the project at the repo root and embedded
    verbatim (matching content) in the README's "Docker Compose"
    installation section. This is a rolling reference to the default
    branch (main), not version-pinned — there is no tagged-release asset
    or /releases/latest/download/ redirect for it, so watch the main
    branch file directly for changes. Only one variant is shipped (single
    bellamy/wallos:latest image, no separate GPU/CPU or sqlite/postgres
    flavors), so no variant choice was needed.

version_health:
  latest_version: "5.4.2"
  latest_release_date: "2026-07-19"
  release_cadence: active
  eol_status: active
  notes: >
    Very active: v5.0.0 through v5.4.2 all shipped within an eight-day
    window (2026-07-11 to 2026-07-19), including same-day point releases
    (5.1.0/5.1.1, 5.4.0/5.4.1/5.4.2). Only ~17 days old as of 2026-08-05.
    8.3k GitHub stars, no signs of archival or slowdown — clearly active
    development with regular feature and bugfix releases.

catalogue_fit:
  categories: [productivity, finance]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Wallos is a personal-finance/subscription-management app — it tracks
    recurring payments, renewal dates, and budgets across multiple
    currencies and household members. Nothing in the current 24-recipe
    catalogue covers personal finance or subscription tracking; the
    closest neighbors by shape (single-container PHP+SQLite web app,
    e.g. uptime-kuma) are functionally unrelated. This would be a new
    category for the catalogue rather than an overlap.
  usefulness: medium
  usefulness_rationale: >
    Subscription/budget tracking is a common self-hoster want-list item
    and Wallos is a popular, actively developed, low-resource choice for
    it. Capped at medium rather than high because it's a single-user
    personal tool with a narrower audience than infrastructure or
    productivity apps already in the catalogue, not because of any
    technical weakness.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Wallos is a single-container app (image bellamy/wallos, single HTTP
  port 8282->80, SQLite storage under two bind-mounted volumes) that fits
  behind Traefik on <slug>.<base_domain> like uptime-kuma or vaultwarden.
  It has no admin credential to inject at boot: the first visitor to the
  web UI creates their own account and password directly through Wallos's
  own registration wizard, the same pattern already accepted for
  uptime-kuma, so no generated_from or basic_auth gate is needed. Optional
  OIDC env vars exist for SSO but are not required to boot. Upstream is
  very actively maintained (multiple releases within the last three
  weeks) and adds a personal-finance category the catalogue doesn't
  currently have. Recommend build_now.
