slug: apache-solr
name: Apache Solr
source_description: "Enterprise open-source search platform built on Apache Lucene"

upstream:
  url: https://solr.apache.org
  repo_url: https://github.com/apache/solr
  license: Apache-2.0
  docker_image: solr

version_health:
  latest_version: "10.0.0"
  latest_release_date: "2026-03-04"
  release_cadence: active
  eol_status: active
  notes: >-
    Solr 10.0.0 (announced 2026-03-04 on the Solr PMC mailing list) is ~5
    months old as of today (2026-08-05) and is the most recent release,
    superseding the 9.x line (last 9.x release: 9.10.1, the closing release
    of that series). Solr is a top-level ASF project under normal PMC
    governance; the official `solr` Docker Hub image (maintained via
    `apache/solr-docker`, ownership transferred from the community
    maintainer to the Apache Solr project in 2019) has both `10.0.0` and
    `9.10.1` tags rebuilt within the last day at time of research (base-image
    security patching, not a new version). Historically Solr ships roughly
    one major/minor line per 1-2 years with patch releases in between —
    steady, not sporadic. No EOL or maintenance-only signal.

catalogue_fit:
  categories: [developer-tools, data]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >-
    Solr is a standalone full-text search/indexing engine (schema-based
    cores/collections, faceting, vector search as of 10.0) exposed over one
    HTTP port with a browser admin console. Nothing in the current 24-recipe
    catalogue provides this — the closest adjacent tools (paperless-ngx,
    immich) embed their own private search internally rather than exposing a
    general-purpose search backend a customer could point other apps or
    custom code at. This would be a genuinely new category (search
    infrastructure) rather than an overlap.
  usefulness: low
  usefulness_rationale: >-
    Solr's admin UI is an operations console for managing cores/collections
    and running test queries, not an end-user application — there's nothing
    to "use" out of the box beyond an empty engine with no schema, no data,
    and no built-in ingestion pipeline for a customer's content. Value only
    materializes once a customer (or their own app) talks to the Solr HTTP
    API to define a schema and index documents, which is a developer-level
    task well outside the profile of a typical AF customer clicking through
    a recipe. Compares unfavorably to the (also-flagged-low-value) Adminer-
    style "raw infra tool with a mandatory basic-auth gate" pattern, but
    without even a familiar UI (a DB browser) — Solr's console is
    Solr-specific and has a steep learning curve.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [BASIC_AUTH_GATE]
  secrets_expressible_today:
    - secret: BASIC_AUTH_GATE
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >-
  Apache Solr is an actively-maintained ASF project (latest release 10.0.0,
  2026-03-04, ~5 months old, no EOL signal) with an official, regularly
  rebuilt Docker image (`solr:10.0.0`, single exposed port 8983, no path
  prefix) that runs fine in standalone mode (no ZooKeeper needed for a
  single instance) behind Traefik on `<slug>.<base_domain>` —
  reverse-proxy-compatible. Solr ships with no security.json / auth plugin
  configured by default, so the admin UI and the full read/write HTTP API
  (create/delete cores, index and query documents) sit open with no login of
  its own; that makes it mechanically installable today only by treating the
  entire app as needing a mandatory Traefik `basic_auth` gate, same pattern
  as Adminer/Apache Hop. It's a genuinely new category for the catalogue
  (no existing recipe exposes a general-purpose search engine). With no
  blocking issues and a mechanism (Traefik basic auth) available for its
  only required secret, it's `build_now`.
