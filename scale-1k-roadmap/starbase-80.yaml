slug: starbase-80
name: Starbase 80
source_description: "Lightweight static server homepage for Docker containers and services"

upstream:
  url: https://github.com/notclickable-jordan/starbase-80
  repo_url: https://github.com/notclickable-jordan/starbase-80
  license: MIT
  docker_image: jordanroher/starbase-80:1.6.6

version_health:
  latest_version: "1.6.6"
  latest_release_date: "2026-07-15"
  release_cadence: sporadic
  eol_status: active
  notes: >
    No GitHub Releases are published for this repo at all ("There aren't any
    releases here") — versioning is tracked only via Docker Hub tags and a
    "Bump version to X" commit/PR. 1.6.6 and 1.6.5 both landed 2026-07-15
    (PR #68, merged same day as this analysis's 3-week lookback point,
    about 3 weeks before 2026-08-05), following 1.6.4 which shipped
    roughly 11 months earlier. Commit history shows real but irregular
    activity: a cluster in Jul 2026, then gaps of months back through
    2025 (Aug, Jul, Jun-Apr 2025). 555 stars, 24 forks, no archived flag,
    no deprecation notice — small hobby project maintained by one person,
    alive but with long quiet stretches between bursts of work.

catalogue_fit:
  categories: [dashboard, homelab, productivity]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Starbase 80 is a startpage/link-launcher dashboard — a static HTML
    page of categorized bookmarks/icons rendered from a single config.json,
    with zero client-side JavaScript and no live status pinging, Docker
    integration, or widgets. None of the 24 shipped recipes fill this
    "front door" role (uptime-kuma monitors uptime with alerting, portainer
    manages containers — neither is a landing page). However this is now
    the sixth candidate analyzed for the identical startpage/dashboard
    niche, after dashy.yaml, homepage.yaml, heimdall.yaml, flame.yaml,
    glance.yaml and homarr.yaml — all previously flagged has_web_ui/
    reverse_proxy_compatible true with only medium usefulness. Starbase 80
    is the most minimal of the six (no live widgets, no Docker/API
    integrations, config only editable by bind-mounting a JSON file and
    restarting the container), so it's the weakest of the group on
    features while sharing the exact same use case.
  usefulness: low
  usefulness_rationale: >
    The startpage gap itself is real, but it is already saturated with
    five prior candidates that each offer more (live status checks,
    in-app config UI, or Docker auto-discovery) than Starbase 80's fully
    static, restart-to-reconfigure approach. Shipping a sixth near-duplicate
    — and the least featureful one — adds no differentiated value; at most
    one app should occupy this catalogue slot, and Starbase 80 is not a
    strong pick among the six.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: ["Traefik basic-auth gate credential"]
  secrets_expressible_today:
    - secret: "Traefik basic-auth gate credential"
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: not_recommended

summary: >
  Starbase 80 is a single-container, MIT-licensed static homepage app with
  an official multi-arch Docker image (jordanroher/starbase-80:1.6.6), one
  HTTP port (4173 internally, mapped to 80), and no built-in login — so it
  would be mechanically installable today by gating it behind Traefik
  basic_auth on the customer's root-password hash, the same pattern used
  for Dashy/Heimdall/Adminer. The blocker is not mechanics but catalogue
  redundancy and low differentiation: it is the sixth startpage/dashboard
  candidate analyzed (after Dashy, Homepage, Heimdall, Flame, Glance,
  Homarr) for the identical gap, and the most feature-thin of the six
  (fully static, no live widgets, no Docker discovery, config requires a
  file bind-mount plus container restart). Combined with a solo-maintainer
  upstream that ships no formal GitHub Releases and has long multi-month
  gaps between activity bursts, this is not a good pick versus the other
  five candidates for the same slot — not_recommended unless product
  specifically wants a minimal/no-JS option distinct from the richer
  alternatives.
