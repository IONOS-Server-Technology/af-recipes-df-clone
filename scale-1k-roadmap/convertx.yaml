slug: convertx
name: ConvertX
source_description: "Self-hosted online file converter supporting 1000+ formats"

upstream:
  url: https://github.com/C4illin/ConvertX
  repo_url: https://github.com/C4illin/ConvertX
  license: AGPL-3.0
  docker_image: ghcr.io/c4illin/convertx
  compose_file_url: null
  compose_file_notes: >
    No official standalone docker-compose file to link to. The repo does
    ship a root-level compose.yaml
    (https://github.com/C4illin/ConvertX/blob/main/compose.yaml), but its
    own leading comment says "This compose file is for development and
    testing purposes only. See README for production deployment
    instructions" — it builds the image locally from source rather than
    pulling ghcr.io/c4illin/convertx, so it is not the production
    artifact. The actual production guidance
    (https://github.com/C4illin/ConvertX#readme, "Deployment" section) is
    a docker-compose.yml snippet embedded directly in the README's
    Markdown prose, not a separate fetchable file — there is no raw link
    or release asset for it, version-pinned or otherwise, so there is
    nothing that meets the "direct file the project publishes" bar.

version_health:
  latest_version: "v0.18.0"
  latest_release_date: "2026-06-21"
  release_cadence: active
  eol_status: active
  notes: >
    Latest tag v0.18.0 published 2026-06-21, about 6.5 weeks before today
    (2026-08-05). Release history (from the GitHub releases atom feed):
    v0.17.0 (2026-01-13), v0.16.1/v0.16.0 (2025-12-14), v0.15.1/v0.15.0
    (2025-10-07), v0.14.1 (2025-06-04), v0.14.0 (2025-06-03), v0.13.0
    (2025-05-14), v0.12.1 (2025-04-01). Cadence is uneven — a ~5-month gap
    between v0.17.0 and v0.18.0 and an earlier ~4-month gap between v0.14.x
    and v0.15.0 — but the project keeps shipping (18.3k GitHub stars, active
    issue/PR triage, most recent commit activity recent), so it reads as
    active rather than slowing or dormant.

catalogue_fit:
  categories: [utilities, file-management]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24 recipes covers general-purpose file format
    conversion. Immich, Paperless-ngx, and Gitea handle domain-specific file
    storage/processing but don't offer an ad-hoc "convert any file to any
    format" utility. ConvertX wraps FFmpeg, ImageMagick, LibreOffice,
    Pandoc, and other converters (~1000+ format pairs across images, video,
    audio, documents, e-books, and 3D assets) behind one web UI, which is a
    genuinely new capability for the catalogue.
  usefulness: high
  usefulness_rationale: >
    Broad, non-technical appeal — file conversion is a common everyday need
    (documents, images, media) and this is the only recipe candidate that
    covers it, unlike niche developer tools or apps that duplicate existing
    catalogue entries.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [admin_signup_credential, JWT_SECRET]
  secrets_expressible_today:
    - secret: JWT_SECRET
      mechanism: server_generated_no_customer_input
  blocking_issues:
    - >
      Confirmed against the upstream README and docker-compose example:
      ConvertX has no admin-username/admin-password environment variable at
      all. Accounts are created through an in-app registration form, gated
      only by the `ACCOUNT_REGISTRATION` env var (default `false`, which
      would also block the customer's own first signup unless set to
      `true`). With registration enabled, the first visitor to reach the
      public URL becomes the account holder — there is no `type: password`
      field on an admin login to target with
      `generated_from: "<algo>:ROOT_PASSWORD"`, because the credential is
      created client-side via self-registration, not injected via env var.
      This is the same shape of problem documented in
      apps-gaps/2fauth.yaml and apps-gaps/activepieces.yaml.
    - >
      A Traefik `basic_auth: true` gate in front of the whole app would
      close the "random internet stranger races to register first" version
      of this problem, but per the 2FAuth/Activepieces precedent, today's
      basic_auth mechanism has no channel to also hand the customer a
      *second*, distinct credential for the in-app signup form beyond the
      single root-password projection already used for the gate itself —
      so it does not fully resolve the underlying provisioning gap.
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  ConvertX is an active, well-starred, single-container app (no external
  database required) that would fill a genuine gap in the catalogue — none
  of the current 24 recipes offer general file-format conversion. It fails
  the installability test for the same structural reason as 2FAuth and
  Activepieces: the app provisions its one account via an open
  self-registration form with no env-var hook for a preset admin login, so
  neither `generated_from:ROOT_PASSWORD` nor a `basic_auth` gate alone can
  safely hand the customer their own exclusive first-run credential.
  Revisit once upstream adds an env-var-driven initial-admin flow, or the
  platform gains a second customer-facing credential channel beyond the
  single root-password projection.
