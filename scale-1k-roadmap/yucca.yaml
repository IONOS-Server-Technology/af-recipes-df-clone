slug: yucca
name: Yucca
source_description: "Simple NVR video surveillance solution for home and business"

upstream:
  url: https://yucca.app
  repo_url: null
  license: proprietary (freemium — free "Yucca Free" tier, paid Plus/Enterprise tiers)
  docker_image: yuccastream/yucca
  compose_file_url: null
  compose_file_notes: >
    No standalone compose file is published anywhere — no repo_url exists
    (Yucca is closed-source/proprietary) and the yuccastream GitHub org
    (github.com/yuccastream) ships only unrelated tooling (an installer for
    a different product, a go2rtc fork, a Hikvision unbrick tool, etc.),
    no compose file. The only compose content that exists is inlined
    directly in the docs page prose at
    https://yucca.app/en/docs/install/docker (there is no separate
    downloadable/hosted .yaml/.yml asset to link to) — it is a copy-paste
    snippet, not a fetchable file. That page offers two tab variants,
    "Yucca Free" (image yuccastream/yucca:latest) and "Yucca Plus /
    Enterprise" (image yuccastream/yucca:latest-ent); both pin only the
    rolling `latest`/`latest-ent` tags, not a version-pinned release.

version_health:
  latest_version: "0.13.4"
  latest_release_date: "2026-08-06"
  release_cadence: active
  eol_status: active
  notes: >
    Docker Hub tag history shows very frequent recent pushes: 0.12.3
    (2026-05-05), 0.13.0 (2026-07-17), 0.13.1 (2026-08-06), 0.13.3
    (2026-08-06), 0.13.4 (2026-08-06) — several patch releases landing
    within the same day, on top of a steady ~monthly minor-version cadence
    going back through a 30+ version changelog to 0.1.0. This reads as an
    actively developed, commercially-backed product (Yucca Stream), not a
    hobby project going stale. Note: the 0.13.4 push timestamp
    (2026-08-06T12:18Z) is nominally one day after the stated "today"
    (2026-08-05) for this analysis — most likely clock skew between the
    live Docker Hub registry and the fixed analysis date rather than a
    real anomaly; it does not change the active/active verdict either way.

catalogue_fit:
  categories: [security, media, monitoring]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue does IP-camera NVR/video
    surveillance. Home Assistant touches camera integrations only as one
    of many smart-home features, and Immich is personal photo/video
    library management, not live RTSP/ONVIF camera recording — so this
    would open a genuinely new category (home/business security) rather
    than compete with an existing recipe.
  usefulness: high
  usefulness_rationale: >
    Self-hosted NVR is a well-understood, high-intent use case (replacing
    cloud camera subscriptions or a NAS-based Frigate/Shinobi setup) with
    broad appeal to both home and small-business customers. The free tier
    is fully functional (unlimited cameras, single user, no license key),
    so a customer gets real value immediately after deploy without any
    external account or payment step.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Yucca is a single-container, actively-maintained self-hosted NVR with an
  official Docker image (yuccastream/yucca, pinned tag 0.13.4), a single
  HTTP web-UI port (9910) that is reverse-proxy compatible, and a free
  tier with no license key or external account required. Its admin
  account is created via a first-visit web setup wizard (or CLI) where
  the visitor freely chooses login/email/password — the same
  self-registration pattern already shipped for recipes/uptime-kuma/, so
  it needs no `generated_from` projection or Traefik basic_auth gate to
  be installable under the current mechanism. It fills a genuinely new
  category (video surveillance/NVR) with no overlap in the existing
  catalogue and is a strong build_now candidate.
