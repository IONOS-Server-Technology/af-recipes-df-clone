slug: expensave
name: Expensave
source_description: "Personal and family expense tracking application"

upstream:
  url: https://expensave.app/
  repo_url: https://github.com/algirdasc/expensave
  license: GPL-3.0
  docker_image: algirdasc/expensave

version_health:
  latest_version: "v1.0.10"
  latest_release_date: "2026-07-23"
  release_cadence: active
  eol_status: active
  notes: >
    v1.0.0 shipped 2026-06-16 and the project has released ten more tags
    since, several on the same day (five on 2026-07-04 alone). Latest tag
    v1.0.10 is 13 days old as of 2026-08-05. Very young project (556 commits,
    23 stars, 7 forks) but clearly actively developed right now, not dormant.

catalogue_fit:
  categories: [finance, productivity]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    None of the current 24 recipes cover personal/family finance or expense
    tracking. This would open a new category for the catalogue: a
    self-hosted alternative to commercial expense-tracking subscriptions
    (e.g. Splitwise-style shared calendars, recurring bill automation, bank
    statement import) with full data ownership.
  usefulness: medium
  usefulness_rationale: >
    Clear differentiated niche with no in-catalogue competitor, but the
    upstream project is very new (first major release less than two months
    ago) and small (23 GitHub stars), so long-term stability/support is
    unproven compared to established finance tools like Firefly III or
    Actual Budget.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Expensave is a single-web-UI, two-container (app + MariaDB) expense
  tracker with a self-service first-run registration flow — like
  Uptime Kuma, the first visitor creates the admin account through the
  app's own UI, so /compose needs to inject nothing beyond the customer's
  domain and server-generated (non-customer-facing) DB credentials. It
  runs on a single HTTP port (18000) that is trivially reverse-proxy
  compatible via Traefik, and official version-pinned Docker tags (e.g.
  v1.0.10) exist for a clean pin. The project is small and very young but
  currently releasing actively. It fills a genuinely open category (no
  existing recipe covers personal/family finance), making it a reasonable
  build_now candidate, with the caveat that upstream maturity should be
  re-checked before committing to long-term support.
