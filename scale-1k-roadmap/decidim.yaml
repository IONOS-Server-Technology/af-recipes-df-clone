slug: decidim
name: Decidim
source_description: "Open-source participatory democracy framework for citizen consultations"

upstream:
  url: https://decidim.org
  repo_url: https://github.com/decidim/decidim
  license: AGPL-3.0
  docker_image: decidim/decidim

version_health:
  latest_version: "0.32.1"
  latest_release_date: "2026-07-30"
  release_cadence: active
  eol_status: active
  notes: >
    Six days before this analysis (today 2026-08-05). Two release lines are
    maintained in parallel (0.32.x current, 0.31.x LTS-style backport line),
    with releases on both roughly monthly (0.32.0 on 2026-07-02, 0.32.1 on
    2026-07-30, 0.31.6/0.31.7 in the same window). Governed by a foundation
    (Decidim Association) with corporate/municipal backing, not a single
    maintainer — low abandonment risk.

catalogue_fit:
  categories: [community, civic-engagement, collaboration]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    None of the current 24 recipes cover participatory/civic-engagement
    tooling (voting, proposals, budgeting consultations, assemblies). Closest
    conceptual neighbors (n8n, gitea, opengist) are automation/dev-collab
    tools, not citizen-facing consultation platforms, so this would open a
    genuinely new category rather than compete with an existing recipe.
  usefulness: medium
  usefulness_rationale: >
    Real niche (municipalities, NGOs, unions running participatory
    processes) with no substitute in the catalogue, but it's a heavyweight
    Ruby-on-Rails stack (app + Postgres + Redis, plus a background worker for
    notifications) aimed at a narrower customer segment than most of our
    current self-hosting audience.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot:
    - "Decidim system-admin email"
    - "Decidim system-admin password"
  secrets_expressible_today: []
  blocking_issues:
    - >
      The only way to create the first Decidim account (`bin/rails
      decidim_system:create_admin`) is an interactive rake task that reads a
      plaintext email/password pair from stdin and hashes the password
      itself via Devise/bcrypt at that point. There is no env var or field
      that accepts a pre-computed hash, so `generated_from` (which only ever
      carries a hash of the customer's root password, never the plaintext)
      cannot supply it — this is the "genuine requirement for the plaintext
      password" case SCHEMA.md calls a structural blocker, not the
      unsupported-hash-algorithm case.
    - >
      A Traefik `basic_auth` gate doesn't substitute here either: unlike
      Adminer-style tools, the customer must actually know a working
      Decidim system-admin (and later, organization-admin) login to use the
      product at all — putting a second, unrelated gate in front doesn't
      give them that credential.
    - >
      Beyond the admin account, first-run organization setup emails an
      invitation to the organization-admin address, which needs a working
      SMTP relay configured — an additional external dependency with no
      customer-input channel today, though secondary to the admin-account
      blocker above.
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  Decidim is an active, well-governed Rails app filling a real catalogue gap
  (participatory democracy / civic engagement) with a standard reverse-proxy-
  compatible web UI. It cannot ship today: the first system-admin account is
  created via an interactive CLI prompt for a plaintext password that the
  app hashes itself, which the current root-password-hash-only projection
  mechanism cannot feed, and no basic_auth gate can substitute for that
  missing login. Revisit once the platform has a channel for handing the
  customer an actual generated credential (not just a hash), or once Decidim
  ships a non-interactive/env-var admin bootstrap.
