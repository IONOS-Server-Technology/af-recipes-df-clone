slug: jfa-go
name: jfa-go
source_description: "Invite-based user management and account automation for Jellyfin"

upstream:
  url: https://jfa-go.com/
  repo_url: https://github.com/hrfee/jfa-go
  license: MIT
  docker_image: hrfee/jfa-go (only "latest" and "unstable" tags exist — no semver-tagged
    releases on Docker Hub; "latest" currently matches the v0.6.0 GitHub release)

version_health:
  latest_version: "v0.6.0"
  latest_release_date: "2025-11-27"
  release_cadence: sporadic
  eol_status: maintenance-only
  notes: >
    v0.6.0 shipped 2025-11-27, about 8.3 months before today (2026-08-05).
    Tagged-release history is sparse and irregular: v0.5.1 (2023-12-26),
    v0.5.0 (2023-09-08), v0.4.0 (2022-01-30) — gaps of 1-2 years between
    tagged releases, then a ~2-year gap before v0.6.0. However, repo is not
    archived and commit activity on main continues well past the last tag
    (latest commit 2026-06-10, "unstable" Docker tag pushed 2026-06-16),
    so the project is not dormant, just very tag-light. The maintainer's
    own README states the project is "Active-ish": "Studies mean I can't
    work on this project a lot outside of breaks... New features and such
    will likely come in short bursts throughout the year (if they do at
    all)." That single-maintainer, hobby-time-permitting framing, plus the
    lack of a semver-tagged Docker image to pin to, is why this is
    "sporadic"/"maintenance-only" rather than "active" despite recent
    commits — feature velocity is real but self-described as unreliable.

catalogue_fit:
  categories: [media, user-management, automation]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue does invite-based account
    provisioning for a media server. jfa-go is a pure companion/add-on to
    Jellyfin (or Emby): it sends signup invite links, applies user
    profiles/library-access templates, handles self-service password
    resets, and optionally syncs with Ombi/Jellyseerr. It has no media
    library, no transcoding, and does nothing standalone — it exists
    purely to manage accounts on an already-running Jellyfin/Emby server.
    We do not offer a Jellyfin (or Emby) recipe today (see
    apps-gaps/jellyfin.yaml, itself blocked), so jfa-go only pays off for a
    customer who already self-hosts Jellyfin/Emby elsewhere — the same
    dependent-add-on shape as apps-gaps/jellyseerr.yaml,
    apps-gaps/jellystat.yaml, and apps-gaps/jelly-clipper.yaml.
  usefulness: low
  usefulness_rationale: >
    Genuinely useful, well-known tool in the Jellyfin self-hosting
    community for anyone running a "family/friends" Jellyfin server, but
    its entire value proposition depends on an existing Jellyfin/Emby
    instance the catalogue does not host, and its installability is
    structurally blocked (see below) in a way that isn't a quick fix.
    Usefulness would rise if a Jellyfin recipe existed to pair it with, but
    even then the setup-time external-account requirement remains.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [jellyfin_admin_account, dashboard_basic_auth_gate]
  secrets_expressible_today:
    - secret: dashboard_basic_auth_gate
      mechanism: traefik_basic_auth
  blocking_issues:
    - >
      jfa-go's setup wizard has a mandatory server-connection step that
      calls the app's own /setup/test/jf endpoint (confirmed by reading
      setup.go on main), which authenticates the supplied username/password
      against the real Jellyfin (or Emby) server at the given URL and
      requires the resulting account to have IsAdministrator == true before
      setup can proceed. This is not an optional "add a feature later"
      step — jfa-go's core purpose (sending invites, applying library
      profiles to new users) is meaningless without a live, connected
      Jellyfin server, so setup cannot complete, and the app cannot do
      anything useful, without a real external admin credential the
      customer must already hold. This is the same shape as
      apps-gaps/jellyseerr.yaml's blocker, not
      apps-gaps/jellystat.yaml's (where the external API key is an
      optional feature added after a fully independent local admin login
      already works) — Traefik basic_auth can keep the wizard from sitting
      open to the internet, but it does not create an input channel for
      the mandatory external Jellyfin admin account itself.
    - >
      Separately, jfa-go's own admin login (the wizard's "custom
      username/password OR connect your Jellyfin admin account" choice)
      has no environment variable or config-seed mechanism either — it is
      only ever set interactively in the wizard, so even that half of
      setup has no generated_from attachment point today.
    - >
      Minor secondary issue, not the primary blocker: Docker Hub only
      publishes "latest" and "unstable" tags for hrfee/jfa-go, no
      semver-pinned tags, which is a normal pinning inconvenience rather
      than a platform blocker.
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  jfa-go is a single-container, reverse-proxy-friendly Jellyfin/Emby
  companion app (HTTP on 8056, optional TLS on 8057) structurally similar
  to the other Jellyfin-ecosystem add-ons already analyzed
  (jellyseerr, jellystat, jelly-clipper), and shares their core problem:
  the current catalogue has no Jellyfin/Emby recipe of its own, so this
  only serves customers already self-hosting one elsewhere. Beyond that
  value-cap, jfa-go is structurally blocked on the installability
  mechanism today: its setup wizard requires successfully authenticating
  as a real Jellyfin/Emby administrator before setup can finish at all
  (confirmed in the app's own setup.go source), which is third-party
  account linking with no /compose input channel — the same
  blocked_on_platform shape as Jellyseerr, not the lighter
  build_with_caveats shape Jellystat got. Upstream itself is a
  single-maintainer, "active-ish" hobby project with sparse, irregular
  tagged releases (v0.6.0 landed 2025-11-27 after a ~2-year gap since
  v0.5.1) and no semver Docker tags, which further tempers enthusiasm even
  setting the installability blocker aside. Recommend revisiting only if a
  Jellyfin/Emby recipe and a customer-supplied external-credential channel
  both materialize.
