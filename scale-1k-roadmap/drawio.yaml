slug: drawio
name: draw.io
source_description: "Free open-source diagramming tool for flowcharts, UML, and network diagrams"

upstream:
  url: https://www.drawio.com/
  repo_url: https://github.com/jgraph/drawio
  license: Apache-2.0
  docker_image: jgraph/drawio

version_health:
  latest_version: "31.1.5"
  latest_release_date: "2026-08-03"
  release_cadence: active
  eol_status: active
  notes: >
    Docker Hub tag history shows a near-weekly cadence through 2026 (e.g.
    30.2.4 -> 30.2.5 -> 30.2.6 -> 30.2.7 -> 30.3.x -> 30.4.x -> 31.0.2 ->
    31.1.2 -> 31.1.5, spanning June through early August 2026), with the
    latest tag pushed 2026-08-03 — 3 days before today (2026-08-05). This is
    a well-maintained, frequently-shipped project, not slowing or dormant.

catalogue_fit:
  categories: [productivity, developer-tools]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24 recipes covers diagramming/whiteboarding.
    draw.io (diagrams.net) is a widely-recognized, broad-appeal tool for
    flowcharts, UML, network diagrams, and org charts — distinct from the
    developer-niche tools already in the catalogue (Gitea, OpenGist,
    Adminer-style utilities) and from the media/monitoring/automation
    recipes we have (Immich, Uptime Kuma, n8n, etc.).
  usefulness: high
  usefulness_rationale: >
    Diagramming is a common need across technical and non-technical users
    alike, draw.io is one of the most popular free diagramming tools in
    general, and a self-hosted instance appeals to privacy-conscious teams
    who don't want diagrams passing through the hosted diagrams.net/Google
    Drive integration. Broad appeal plus an active upstream makes this a
    strong catalogue candidate.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [basic_auth_password]
  secrets_expressible_today:
    - secret: basic_auth_password
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  draw.io ships as a single-container Tomcat app (jgraph/drawio) serving the
  editor over one HTTP port, with no database and no built-in
  authentication — it's a client-side diagram editor with no server-side
  accounts to log into (diagrams are worked on in-browser and saved to a
  local file, browser storage, or an optional third-party integration like
  Google Drive/OneDrive/GitHub, none of which are required to use it).
  That makes it directly installable today: front it with the domain param
  plus a Traefik basic_auth:true gate (same n8n/WUD/Adminer pattern), with
  the basic-auth password projected from the customer's root password via
  `generated_from`, so the otherwise-open editor isn't exposed unauthenticated
  on the internet. Upstream is very actively maintained (releases roughly
  weekly through mid-2026, latest tag 3 days old as of this analysis) and
  fills a genuine gap in the current 24-recipe catalogue — no existing
  recipe covers diagramming/whiteboarding. Recommend building the recipe.
