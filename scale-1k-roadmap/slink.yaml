slug: slink
name: Slink
source_description: "Privacy-first image sharing platform with complete control over your content"

upstream:
  url: https://docs.slinkapp.io/
  repo_url: https://github.com/andrii-kryvoviaz/slink
  license: AGPL-3.0
  docker_image: anirdev/slink

version_health:
  latest_version: "v1.13.0"
  latest_release_date: "2026-08-01"
  release_cadence: active
  eol_status: active
  notes: >
    v1.13.0 was published 2026-08-01, 4 days before today (2026-08-05), and
    the matching Docker Hub tag `anirdev/slink:v1.13.0` (also `latest`) was
    pushed the same day. Preceding releases: v1.12.3 (2026-07-15), v1.12.2
    (2026-06-27), v1.12.1 (2026-06-20), v1.12.0 (2026-06-12), v1.11.6
    (2026-05-26), v1.11.5 (2026-05-25), v1.11.4 (2026-05-22), v1.11.3
    (2026-05-17), v1.11.2 (2026-05-12) — a new release roughly every 1-3
    weeks over the past several months, with several patch releases per
    minor version. No archived/EOL/maintenance-only notice found; upstream
    docs reference planned "upcoming features," indicating ongoing active
    development.

catalogue_fit:
  categories: [media, file-sharing]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    No recipe in the current 24-recipe catalogue covers link-based image
    hosting/sharing. Immich is the closest adjacent app but is a personal
    photo/video *backup and library* tool (AI search, albums, mobile auto-sync
    of an entire photo library) rather than a lightweight image host built
    around generating shareable links — Slink targets quick screenshot/image
    sharing (ShareX integration, expiring links, optional per-link password,
    S3/SMB storage backends) closer to an Imgur or CloudApp alternative than
    to Immich's Google-Photos-alternative use case.
  usefulness: medium
  usefulness_rationale: >
    Self-hosted "paste an image, get a private link" tooling is a common,
    well-understood self-hosting want (screenshot hosting for docs/support,
    ShareX targets, quick sharing without third-party CDNs) with no
    representation in the catalogue today. Single lightweight container,
    active upstream, clear differentiation from Immich. Scored medium rather
    than high because it is a narrower-audience utility than a
    password-manager or note-taking app, and the admin-bootstrap workaround
    below (see installability) means the built-in user-management/admin
    console is not cleanly reachable through our current provisioning flow.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot:
    - "Traefik basic-auth gate credential"
  secrets_expressible_today:
    - secret: "Traefik basic-auth gate credential"
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_with_caveats

summary: >
  Slink is a single official container (`anirdev/slink`, pin to `v1.13.0`)
  listening on port 3000 with no external database — it stores its SQLite
  metadata and uploaded images on local volumes (S3/SMB backends are
  optional, not required) — so it needs nothing beyond a domain to boot.
  Its built-in admin-bootstrap path needs a plaintext `ADMIN_PASSWORD`,
  which `generated_from` cannot supply; the workaround is to skip that
  bootstrap entirely and put the whole app behind a Traefik `basic_auth`
  gate keyed off the root-password hash, letting the customer self-register
  as an ordinary (non-admin) user once inside. Reverse-proxy compatible (one
  HTTP port, standard web UI), no overlap with any of the current 24
  recipes — closest neighbor Immich serves a different use case (photo
  library backup vs. link-based image sharing) — and upstream is releasing
  actively every 1-3 weeks. Recommend building with the basic_auth-gate
  caveat noted above; the admin console will not be reachable through our
  provisioning flow as a known limitation.
