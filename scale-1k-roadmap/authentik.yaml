slug: authentik
name: Authentik
source_description: "Open-source identity provider focused on flexibility and versatility"

upstream:
  url: https://goauthentik.io/
  repo_url: https://github.com/goauthentik/authentik
  license: MIT
  docker_image: ghcr.io/goauthentik/server
  compose_file_url: https://docs.goauthentik.io/compose.yml
  compose_file_notes: >
    Official file, served by the project's own docs site (linked from the
    "Docker Compose" install page at
    docs.goauthentik.io/install-config/install/docker-compose via `wget`/
    `curl -O`). Single variant — Postgres-backed server+worker+postgresql
    stack, no GPU/CPU or sqlite alternative is offered for this install
    method. Rolling, not version-pinned: the URL itself always serves the
    current docs-site build, and within the file the image tag is
    `${AUTHENTIK_TAG:-2026.5.6}` — a default that tracks whatever was
    latest when the docs were last built, not a fixed release tag, so the
    effective version can change on a future docs update even though the
    URL stays the same.

version_health:
  latest_version: "2026.5.6"
  latest_release_date: "2026-07-22"
  release_cadence: active
  eol_status: active
  notes: >
    Latest stable 2026.5.6 shipped 2026-07-22, about two weeks before today
    (2026-08-05). The project runs parallel supported branches (2026.5.x and
    2026.2.x both received patches within the last two months) and already
    has 2026.8.0 release candidates in progress. Repo is not archived,
    commit and PR activity is continuous — this is a well-funded,
    fast-moving project, not a maintenance-mode one.

catalogue_fit:
  categories: [security, identity, networking]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24 recipes provides identity/SSO functionality —
    Authentik is an IdP (SAML/OAuth2/OIDC/LDAP provider, forward-auth
    proxy-provider) that other self-hosted apps and even other AF recipes
    could federate against. Closest conceptual neighbor is Vaultwarden
    (also a "security" recipe) but that's a password vault for end users,
    not an SSO/identity broker for other services — genuinely distinct
    use case with real demand from customers running multiple self-hosted
    apps who want one login.
  usefulness: high
  usefulness_rationale: >
    Self-hosted SSO/IdP is one of the most commonly requested categories in
    the self-hosting community (competes with Authelia, Keycloak, Zitadel).
    A customer running several AF recipes side by side has an obvious use
    for a central identity provider, so this would meaningfully round out
    the catalogue rather than duplicate it.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [AUTHENTIK_SECRET_KEY, akadmin_password]
  secrets_expressible_today:
    - secret: AUTHENTIK_SECRET_KEY
      mechanism: server_generated_no_customer_input
  blocking_issues:
    - >
      Authentik provisions its initial `akadmin` superuser via two
      mutually-exclusive env vars: `AUTHENTIK_BOOTSTRAP_PASSWORD` (plaintext,
      explicitly discouraged by upstream) or `AUTHENTIK_BOOTSTRAP_PASSWORD_HASH`
      (a pre-hashed value, generated with `docker compose run --rm server
      hash_password '<pw>'`). The hash upstream produces is a Django-native
      hash — `pbkdf2_sha256` by default — not `argon2` or `bcrypt`, the only
      two algorithms `generated_from` currently supports. Per SCHEMA.md this
      is not a hard structural blocker (only a plaintext-only requirement
      would be) — it's a genuine gap in the supported-algorithm list. Flag
      as `blocked_on_platform` with `pbkdf2_sha256` named as the algo
      needed, rather than `not_recommended`.
    - >
      A Traefik `basic_auth` gate in front of the whole app is not a good
      substitute here: Authentik's own web UI is the product (it needs to
      stay reachable for end users completing SSO flows against other apps,
      not just the admin), so gating the entire origin behind a second,
      unrelated basic-auth layer would break the app's actual purpose
      rather than just protecting an admin panel the way it does for e.g.
      Adminer or WUD.
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  Authentik is a mature, extremely actively maintained identity
  provider that would be a genuinely high-value, non-duplicate addition to
  the catalogue — nothing else we ship covers SSO/IdP, and demand for
  self-hosted identity brokering is real. It is mechanically a clean
  Postgres-backed multi-service stack (server + worker + postgresql, no
  Redis dependency in current releases) and is fully reverse-proxy
  compatible on a single public port. It fails installability today purely
  on the admin-bootstrap secret: the only supported hash format for
  `AUTHENTIK_BOOTSTRAP_PASSWORD_HASH` is Django's `pbkdf2_sha256`, which
  `generated_from` does not yet support (only `argon2`/`bcrypt`). Revisit as
  `build_now` as soon as `generated_from` gains `pbkdf2_sha256` support;
  until then this is `blocked_on_platform`, not a fundamental fit problem.
