slug: ombi
name: Ombi
source_description: "Self-hosted request system for Plex, Emby, and Jellyfin with auto-fulfillment"

upstream:
  url: https://ombi.io
  repo_url: https://github.com/Ombi-app/Ombi
  license: GPL-2.0
  docker_image: linuxserver/ombi
  compose_file_url: null
  compose_file_notes: >
    No official compose file exists. Ombi's own installation guide
    (docs.ombi.app/guides/installation/) states plainly that "the Ombi
    team don't maintain official docker containers" and directs users to
    linuxserver.io's community-maintained image instead ("linuxserver.io
    keep their image the most up-to-date, and they have pretty
    comprehensive instructions for installation"). The Ombi-app/Ombi
    GitHub repo itself has no docker-compose.yaml/.yml at its root or in
    a docker/deploy/contrib directory. linuxserver.io does publish its
    own docker-compose snippet on the linuxserver/ombi Docker Hub page,
    but that is a third-party (community) template, not an official one
    from the Ombi project, so it is not adopted here.

version_health:
  latest_version: "4.53.10 (linuxserver stable tag); develop branch has advanced to ~4.60.12"
  latest_release_date: "2026-08-01"
  release_cadence: active
  eol_status: active
  notes: >
    linuxserver/ombi:4.53.10 was pushed to Docker Hub ~4 days before today
    (2026-08-05), i.e. around 2026-08-01. Upstream develop-branch commits run
    right up to 2026-07-29 (v4.60.12), with a steady stream of chore(release)
    tags every few days through June-July 2026 — this is an actively
    maintained project, not dormant. The dedicated Ombi-app/Ombi.Releases
    repo was archived in Feb 2022, but that repo was only a release-notes
    mirror; the main Ombi-app/Ombi application repo is unaffected and still
    active. Note the gap between the linuxserver "stable" tag (4.53.10) and
    upstream develop (4.60.12) is normal lag in linuxserver's stable/testing
    promotion pipeline, not a sign of staleness.

catalogue_fit:
  categories: [media]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    No recipe in the current 24-app catalogue touches media-server request
    management. Ombi sits in front of a customer's existing Plex/Emby/
    Jellyfin server (run elsewhere, not part of this recipe) and lets their
    users browse and request movies/TV, with auto-approval and optional
    Sonarr/Radarr hookups configured later through its own settings UI. It's
    a genuinely new category for the catalogue, not a variant of anything we
    ship today.
  usefulness: medium
  usefulness_rationale: >
    Real demand exists among self-hosted media enthusiasts, but the app is
    only useful to a customer who already runs Plex/Emby/Jellyfin (and
    typically Sonarr/Radarr) somewhere else — those aren't in our catalogue
    either, so Ombi is a satellite app for an existing setup rather than a
    complete standalone offering.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Ombi is a single-container app (linuxserver/ombi, port 3579, one HTTP
  endpoint, no raw protocols) that fits our Traefik-fronted deployment model
  cleanly and is actively maintained upstream. Its admin account is created
  through its own first-run setup wizard directly in the browser — like
  Portainer and Gitea already in this catalogue, no secret needs to travel
  through /compose, so it clears the current root-password-projection
  constraint with just a domain parameter. The open question is less about
  mechanics and more about value: Ombi is only useful to customers who
  already run a Plex/Emby/Jellyfin media server, which we don't offer, so
  recommend build_now on installability grounds but flag that its addressable
  audience within our catalogue is narrower than a typical recipe.
