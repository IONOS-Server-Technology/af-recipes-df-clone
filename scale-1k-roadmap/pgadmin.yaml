slug: pgadmin
name: pgAdmin
source_description: "Open-source PostgreSQL administration and development platform for the web"

upstream:
  url: https://www.pgadmin.org/
  repo_url: https://github.com/pgadmin-org/pgadmin4
  license: "PostgreSQL License (permissive, BSD/MIT-style)"
  docker_image: dpage/pgadmin4

version_health:
  latest_version: "9.17 (2026-07-31)"
  latest_release_date: "2026-07-31"
  release_cadence: active
  eol_status: active
  notes: >
    9.17 shipped 2026-07-31, five days before today (2026-08-05) — the
    same release also fixed seven CVEs (CVE-2026-17346 through
    CVE-2026-17351, CVE-2026-17566). Prior releases: 9.16 (2026-06-18),
    9.15 (2026-05-11), 9.14 (2026-04-02) — a steady roughly-monthly
    cadence with no gaps, plus intermediate daily-tagged snapshot builds
    (e.g. 2026-07-30-1) on Docker Hub. This is a well-maintained, actively
    developed project with an official upstream Docker image kept in
    lockstep with releases.

catalogue_fit:
  categories: [databases, developer-tools]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    No existing recipe provides a PostgreSQL administration/query UI.
    n8n and paperless-ngx both run on Postgres internally, but neither
    exposes it for general-purpose database administration. pgAdmin
    would let a customer browse schemas, run queries, and manage
    permissions on their own Postgres instance(s) — a genuinely distinct,
    developer-tool-oriented use case not covered by anything currently
    in the catalogue.
  usefulness: medium
  usefulness_rationale: >
    Real demand exists for a hosted Postgres admin UI among customers
    running Postgres-backed apps (their own or ones deployed via other
    recipes), and pgAdmin is the de facto standard tool for this. Value
    is somewhat narrower than a general productivity app since it's
    aimed at technically inclined customers who already run Postgres,
    but within that audience it is high-value and low-effort to deploy
    (single container, no extra services required).

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [PGADMIN_DEFAULT_EMAIL, PGADMIN_DEFAULT_PASSWORD]
  secrets_expressible_today: []
  blocking_issues:
    - "pgAdmin's container entrypoint requires PGADMIN_DEFAULT_PASSWORD (or PGADMIN_DEFAULT_PASSWORD_FILE, which just reads the plaintext from a file instead of an env var) to set up the initial admin account — the upstream docs give no mechanism to seed the account from a pre-computed hash. generated_from only ever projects a hash (argon2/bcrypt) of the customer's root password, never the plaintext, so there is no channel to supply this value. Per SCHEMA.md this is the one genuine structural blocker case: 'a genuine requirement for the plaintext password (not any hash) is a structural blocker.'"
    - "PGADMIN_DEFAULT_EMAIL is also required and must be a syntactically valid email address (the login is validated as an email, not an arbitrary username) — a fixed placeholder like admin@<domain> would work mechanically, but the real blocker is the plaintext-password requirement above, which makes this a moot secondary issue."
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  pgAdmin is a healthy, actively released project (monthly cadence,
  recent CVE fixes shipped promptly, official pinned Docker image) and
  would fill a real gap — no database-administration UI exists in the
  current 24-recipe catalogue. It is architecturally simple to deploy
  (single container, no dependent services, one HTTP port, reverse-proxy
  friendly). However, its container entrypoint requires
  PGADMIN_DEFAULT_PASSWORD as plaintext to bootstrap the initial admin
  login, with no supported way to instead supply a pre-hashed value —
  exactly the structural gap the root-password-projection mechanism
  cannot cross today. Recommend `blocked_on_platform`: revisit once
  either a plaintext customer-supplied credential input channel exists,
  or pgAdmin adds support for seeding the admin account from a hash
  (neither exists today).
