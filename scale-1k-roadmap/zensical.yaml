slug: zensical
name: Zensical
source_description: "Markdown-based documentation platform with live preview and full-text search"

upstream:
  url: https://zensical.org/
  repo_url: https://github.com/zensical/zensical
  license: MIT
  docker_image: zensical/zensical:0.0.53

version_health:
  latest_version: "0.0.53"
  latest_release_date: "2026-08-04"
  release_cadence: active
  eol_status: active
  notes: >
    Latest tag 0.0.53 was cut 2026-08-04, one day before today (2026-08-05).
    Release history shows a rapid cadence — 0.0.43 through 0.0.53 (11 tags)
    across roughly May-August 2026, several weeks with more than one
    release. Built by the Material for MkDocs team (squidfunk) as a
    from-scratch Rust-core successor to MkDocs, publicly introduced via
    their blog in November 2025. Still pre-1.0 (all releases are 0.0.x),
    so the API/CLI surface should be treated as unstable, but activity and
    maintenance are unambiguously healthy — no dormancy or EOL concern.

catalogue_fit:
  categories: [developer-tools, static-site-generator, documentation]
  has_web_ui: false
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    None of the current 24 recipes are documentation/static-site tooling —
    this would be a new category if it fit the model. Zensical, however,
    is a CLI/build tool, not a hosted application with a persistent
    admin surface: it compiles a customer-supplied source tree (Markdown +
    config) into a static HTML site. It ships a "preview" server
    (`zensical serve`, default port 8000) with live-reload and search, but
    upstream's own Get Started docs state the official Docker image is
    "not intended for hosting the site," and the Preview docs explicitly
    call the built-in server "intended for preview purposes only" and
    "not designed for production deployment" — directing users to a
    dedicated web server (nginx/Apache) for anything live. This is the
    same shape already documented for Hugo: a build step over customer
    content, not a runtime service.
  usefulness: low
  usefulness_rationale: >
    A "Zensical recipe" with no site content is an empty shell — there is
    nothing to preview, build, or serve until the customer supplies their
    own Markdown source and config, and Hostinger's "live preview" framing
    describes a local authoring aid upstream explicitly disclaims for
    production, not a feature of a standing hosted service.

installability:
  recipe_type_guess: native
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues:
    - "No channel for customer content: Zensical has no value without the customer's own Markdown source and mkdocs-style config. /compose carries no mechanism for arbitrary file/content upload at install time, so a deployed instance would have nothing to build or preview."
    - "Not a persistent production service by design: the official Docker image is documented upstream as not intended for hosting the built site, and the built-in preview server is explicitly dev-only (not for production exposure) — there is no admin UI or long-running app process for the recipe model to gate or install into."
  installable_today: false
  recommendation: not_recommended

summary: >
  Zensical is an actively maintained, fast-moving static site generator
  (latest 0.0.53, 2026-08-04) built by the Material for MkDocs team as a
  Rust-core successor to MkDocs — no EOL or dormancy concern, though it's
  still pre-1.0. It doesn't overlap with anything in the current
  24-recipe catalogue, but structurally it's a CLI build tool, not a
  self-hosted application: no admin UI, no login, and no value without
  customer-supplied Markdown source content, for which the recipe
  mechanism has no delivery channel today. Upstream itself disclaims both
  the official Docker image and the built-in preview/search server as
  unsuitable for production hosting, directing users to a separate web
  server for anything live. Recommend not pursuing this as a recipe — the
  same structural mismatch already identified for Hugo, independent of
  the root-password/basic-auth secret mechanism.
