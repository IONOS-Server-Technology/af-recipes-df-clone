slug: peertube
name: PeerTube
source_description: "Federated peer-to-peer video platform for self-hosted YouTube-style hosting"

upstream:
  url: https://joinpeertube.org/
  repo_url: https://github.com/Chocobozzz/PeerTube
  license: AGPL-3.0
  docker_image: chocobozzz/peertube (production tag family, e.g. v8.2.4-bookworm; companion chocobozzz/peertube-webserver image ships the bundled nginx)

version_health:
  latest_version: v8.2.4
  latest_release_date: "2026-08-04"
  release_cadence: active
  eol_status: active
  notes: >
    v8.2.4 shipped 2026-08-04, one day before today (2026-08-05). Recent
    history shows a steady, security-driven cadence: v8.2.3 (2026-07-20),
    v8.2.2 (2026-07-02), v8.2.1 (2026-06-12), v8.2.0 (2026-05-27), v8.1.8
    (2026-05-23, patched a SQL-injection vulnerability that had been
    exploited in the wild since at least 2026-05-18), v8.1.7 (2026-05-22).
    No archival or EOL signal; upstream is actively developed and quick to
    ship security patches.

catalogue_fit:
  categories: [media, social]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Immich (our only "media" recipe) is a personal photo/video backup and
    library tool for one household; PeerTube is a federated (ActivityPub),
    public-facing video-hosting platform — a self-hosted YouTube/Vimeo
    alternative with channels, subscriptions, comments, and optional P2P
    delivery across a federation of instances. No existing recipe covers
    public video publishing/streaming, so this is a genuinely new niche
    for the catalogue rather than a duplicate of Immich.
  usefulness: high
  usefulness_rationale: >
    Self-hosted video publishing is a well-known, recurring "escape
    YouTube/Vimeo" use case (creators, communities, educational orgs), and
    PeerTube is the dominant open-source project in that space with an
    active federation and healthy release cadence. It would meaningfully
    broaden the catalogue's consumer/creator appeal beyond the current
    dev-tools/monitoring/personal-storage slant.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [PEERTUBE_ROOT_PASSWORD, PEERTUBE_SECRET, DB_PASSWORD]
  secrets_expressible_today:
    - secret: PEERTUBE_SECRET
      mechanism: server_generated_no_customer_input
    - secret: DB_PASSWORD
      mechanism: server_generated_no_customer_input
  blocking_issues:
    - >
      PeerTube has its own mandatory built-in login for the `root` admin
      account (email + password, gating the whole admin UI and most
      publishing features), so a Traefik `basic_auth` gate cannot
      substitute for it — same shape as apps-gaps/parseable.yaml and
      apps-gaps/openobserve.yaml.
    - >
      There is no environment variable or config key to set the root
      password at first boot. Per upstream docs (docs.joinpeertube.org
      install/docker), the password is auto-generated on first startup and
      surfaces only by grepping the container's startup logs; the only
      post-boot way to change it is the interactive CLI helper
      `npm run reset-password -- -u root`, which prompts for a new
      plaintext password rather than accepting one as an argument, an env
      var, or a pre-computed hash. `generated_from` only ever projects a
      hash of the customer's root password onto an app-read parameter —
      there is no such parameter here to project onto, and no plaintext
      channel either, so this is the genuine "no input channel" case, not
      a missing-algorithm gap.
    - >
      The official docker-compose stack bundles its own nginx
      (`chocobozzz/peertube-webserver`) and certbot containers for
      TLS/reverse-proxy duties; upstream docs confirm these can be
      commented out to front the `peertube` app container directly with
      an external reverse proxy (Traefik), so this is a mechanical, not
      structural, integration issue.
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  PeerTube is an actively maintained (latest v8.2.4, shipped one day
  before this analysis, with a fast security-patch cadence) federated
  video-hosting platform that would fill a real, currently-empty niche in
  the catalogue — no existing recipe covers public video publishing, and
  it is not a duplicate of Immich's personal-photo-library use case. It is
  a multi-service Postgres+Redis stack similar in shape to n8n/paperless-ngx,
  and its bundled nginx/certbot containers can be dropped in favor of
  Traefik per upstream's own documented guidance, so reverse-proxy
  integration is not a blocker. The hard blocker is the root admin
  account: PeerTube auto-generates its own password on first boot with no
  env var, CLI argument, or hash-accepting input to set it, so there is no
  channel today to project the customer's server-root-password hash into
  it, and its mandatory built-in login means a Traefik basic_auth gate
  cannot stand in for it either. Revisit as build_now once either an
  env-var/CLI path for the root password ships upstream or a broader
  password-injection mechanism than root-password-hash projection exists
  on our platform.
