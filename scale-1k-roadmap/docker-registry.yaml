slug: docker-registry
name: Docker Registry
source_description: "Private Docker registry for storing and distributing container images"

upstream:
  url: https://distribution.github.io/distribution/
  repo_url: https://github.com/distribution/distribution
  license: Apache-2.0
  docker_image: registry
  compose_file_url: https://distribution.github.io/distribution/about/deploying/
  compose_file_notes: >
    No standalone compose file is published by the project — no
    docker-compose.yaml/.yml exists at the repo root, under any docker/,
    deploy/, or contrib/ directory in github.com/distribution/distribution,
    and no release-asset compose file is attached to releases. The official
    docs page above (under "Deploy your registry using a Compose file") is
    the only source, and it only embeds a short inline docker-compose.yml
    example (image: registry:3, htpasswd auth, TLS cert/key volumes) as
    prose within the page, not a linked or downloadable file. The example
    pins the image to the "registry:3" rolling major-version tag rather
    than an exact release, so treat this as a rolling reference to the
    current v3 line, not a version-pinned artifact — there is nothing more
    specific to watch for changes than the docs page itself.

version_health:
  latest_version: "3.1.1"
  latest_release_date: "2026-05-01"
  release_cadence: active
  eol_status: active
  notes: >
    v3.1.1 (2026-05-01) is ~3 months old as of 2026-08-05. The v3 line
    reached stable in April 2026 (v3.0.0 on 2026-04-03) after a run of
    release candidates through late 2025/early 2026, with v3.1.0 following
    within days and v3.1.1 a few weeks later — a healthy, tightening
    cadence, not a stale project. Recent releases close CVEs, and the repo
    (formerly docker/distribution, now under the CNCF-adjacent
    distribution/ org) shows ongoing multi-contributor activity. Not
    ambiguous: this is the canonical OCI registry implementation behind the
    official `registry` Docker Hub image; not to be confused with
    third-party registry UIs (e.g. Joxit/docker-registry-ui) which are
    separate optional add-ons, not the registry itself.

catalogue_fit:
  categories: [developer-tools]
  has_web_ui: false
  reverse_proxy_compatible: true
  overlaps_with: [gitea]
  differentiation: >
    Gitea (already in the catalogue) ships a built-in OCI-compatible
    container/package registry as one of its many features, which covers
    the "push/pull private images" use case for anyone already running
    Gitea. Docker Registry is a dedicated, standalone alternative for
    customers who want just a registry without a full git forge attached —
    lighter weight, single purpose, and usable independently of any git
    hosting choice.
  usefulness: low
  usefulness_rationale: >
    Real but narrow demand (teams wanting a private image registry without
    Docker Hub/GHCR), further narrowed by Gitea already covering the same
    need for anyone using it as their git host. It's also a headless HTTP
    API with no web UI at all — a customer manages it purely via `docker
    login`/`push`/`pull`, so there's nothing to browse in the AF app
    catalogue beyond a working endpoint.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [basic_auth_password]
  secrets_expressible_today:
    - secret: basic_auth_password
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Docker Registry (the `registry:3.1.1` official image) is a single
  container, single HTTP port (5000) service with no login or web UI of
  its own — upstream's own docs document running it behind a reverse
  proxy for TLS termination, which fits our Traefik-fronted model
  directly. It has no built-in admin auth mechanism reachable via our
  `generated_from` root-password projection (its own htpasswd-based auth
  requires customer-uploaded credential files, not a single hashed
  parameter), so the correct gate is the same Traefik `basic_auth: true`
  pattern used for Adminer/n8n, with the registry's own
  `REGISTRY_AUTH=htpasswd` left disabled since Traefik becomes the actual
  auth boundary. Mechanically installable today with no blocking issues,
  so recommend building now; it overlaps with Gitea's built-in registry
  and is headless (no web UI), but that's a fact about the catalogue
  landscape, not a reason to hold back a mechanically clean recipe.
