slug: adventurelog
name: AdventureLog
source_description: "Self-hosted travel tracker and trip planner with interactive maps"

upstream:
  url: https://adventurelog.app/
  repo_url: https://github.com/seanmorley15/AdventureLog
  license: GPL-3.0
  docker_image: ghcr.io/seanmorley15/adventurelog-backend, ghcr.io/seanmorley15/adventurelog-frontend

version_health:
  latest_version: "v0.12.1"
  latest_release_date: "2026-05-25"
  release_cadence: active
  eol_status: active
  notes: >
    v0.12.1 released 2026-05-25, about 2.5 months before today (2026-08-05).
    Release history is steady: v0.8.0 (2025-01-08), v0.9.0 (2025-03-19),
    v0.10.0 (2025-06-09), v0.11.0 (2025-09-01), v0.12.0 (2026-02-23), v0.12.1
    (2026-05-25) — roughly a release every 2-5 months, no long gaps. A
    v0.13.0 "Acadia" feature branch was already open as of 2026-06-27.
    Repo is not archived, commit/PR activity is ongoing — clearly active.

catalogue_fit:
  categories: [productivity, media]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24 recipes covers travel logging/trip planning
    with interactive maps. Immich is the closest neighbor by
    "personal-media-on-a-map" flavor, but Immich is a photo/video backup
    tool with no trip-planning, itinerary, or location-visited-tracking
    concept — AdventureLog is a distinct use case (travel diary + trip
    planner) that customers would search for separately.
  usefulness: medium
  usefulness_rationale: >
    Clear single-purpose niche app with genuine appeal to self-hosting
    travel enthusiasts, and it is a well-defined stack (SvelteKit frontend +
    Django/DRF backend + Postgres/PostGIS, no unusual runtime needs). Capped
    at medium rather than high because the audience is narrower than
    general-purpose tools already in the catalogue (photo backup, password
    management, monitoring) — it is a nice-to-have addition, not a
    high-demand category gap.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [DJANGO_ADMIN_PASSWORD]
  secrets_expressible_today:
    - secret: DJANGO_ADMIN_PASSWORD
      mechanism: generated_from_root_password
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  AdventureLog is an active, well-maintained self-hosted travel tracker with
  a clean Postgres/PostGIS + Django + SvelteKit stack, structurally similar
  to n8n/paperless-ngx (Postgres-backed) in our catalogue. It has its own
  admin login provisioned via a single DJANGO_ADMIN_PASSWORD env var (with a
  fixed DJANGO_ADMIN_USERNAME=admin default), which maps cleanly onto the
  generated_from:ROOT_PASSWORD projection mechanism — no external API key or
  OAuth registration is required to boot. It fills a genuine gap (travel
  logging/trip planning, distinct from Immich's photo-backup scope) and is
  installable under the current recipe mechanism today, contingent on the
  generated_from:ROOT_PASSWORD mechanism itself (IF-1420) landing.
