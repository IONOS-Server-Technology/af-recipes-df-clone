slug: it-tools
name: IT Tools
source_description: "Collection of handy online tools for developers and IT professionals"

upstream:
  url: https://it-tools.tech/
  repo_url: https://github.com/CorentinTh/it-tools
  license: GPL-3.0
  docker_image: corentinth/it-tools

version_health:
  latest_version: "2024.10.22-7ca5933"
  latest_release_date: "2024-10-22"
  release_cadence: dormant
  eol_status: active
  notes: >
    No tagged release since 2024-10-22 — about 22 months as of 2026-08-05 —
    despite a fairly regular tag cadence (roughly every 2-6 months) through
    2023-2024. However the repo is not stale in the "abandoned" sense: the
    `nightly` Docker tag was rebuilt as recently as ~6 months ago (~Feb 2026),
    and issues/PRs continued to be opened into July 2026. This reads as a
    single-maintainer project that has stopped cutting proper version tags
    but keeps building images off `main` and triaging issues — call it
    dormant on release_cadence (no real version to pin confidently) while
    still active/maintenance-adjacent on eol_status, not archived or EOL.

catalogue_fit:
  categories: [developer-tools, productivity]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24 recipes covers this ground. Gitea and
    opengist are git-hosting tools; IT Tools is a generic single-page
    toolbox (JWT decoder, base64/hash/UUID generators, regex tester, JSON
    formatter, CIDR calculator, QR codes, etc.) — a different, complementary
    use case with no functional overlap.
  usefulness: medium
  usefulness_rationale: >
    Broadly useful to developers/sysadmins as a quick self-hosted
    alternative to scattered public utility sites (avoids pasting
    secrets/tokens into random third-party pages), but it's a convenience
    toolbox rather than something customers depend on operationally, so
    demand is real but not high-urgency.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [basic_auth_password]
  secrets_expressible_today:
    - secret: basic_auth_password
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_with_caveats

summary: >
  IT Tools is a single-container, single-HTTP-port (listens on 80 inside
  the container, commonly published as 8080) static Vue app with no
  built-in login or user accounts of its own, so it fits the domain +
  Traefik basic_auth:true gate pattern (basic-auth password projected from
  the customer's root password via generated_from) — the same shape as
  Adminer/n8n/WUD. Mechanically installable today with no blocking issues.
  The caveat is upstream health: no tagged release in ~22 months, so any
  recipe would pin to a stale version tag or track `nightly`/`latest` off
  an unversioned main branch, which is a maintenance smell worth flagging
  even though the project isn't dead — recommend build_with_caveats rather
  than an unqualified build_now.
