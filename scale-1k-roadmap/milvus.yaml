slug: milvus
name: Milvus
source_description: "Open-source vector database built for AI applications and similarity search"

upstream:
  url: https://milvus.io
  repo_url: https://github.com/milvus-io/milvus
  license: Apache-2.0
  docker_image: milvusdb/milvus
  compose_file_url: https://github.com/milvus-io/milvus/releases/download/v3.0.0/milvus-standalone-docker-compose.yml
  compose_file_notes: >
    Official — milvus.io/docs/install_standalone-docker-compose.md instructs
    downloading this exact release-asset URL and saving it as
    docker-compose.yaml. Version-pinned to the v3.0.0 tag (not a
    /latest/download/... redirect), so this link will not silently change
    contents on a future release; watching for updates means bumping the
    tag when Milvus cuts a new one. This is the CPU/standalone variant
    (Milvus + etcd + MinIO) — the docs also publish a separate GPU compose
    variant (install_standalone-docker-compose-gpu.md) which was not
    chosen here since standalone is the default install path.

version_health:
  latest_version: "v2.6.22"
  latest_release_date: "2026-08-04"
  release_cadence: active
  eol_status: active
  notes: >
    Stable v2.6.x line ships roughly every 1-3 weeks (v2.6.16 2026-05-14 through
    v2.6.22 2026-08-04, i.e. yesterday relative to today 2026-08-05). A parallel
    v3.0.0 major line went GA on 2026-07-29, adding lakehouse/external-table
    integration on top of the same core. Both lines are actively maintained;
    no signs of slowdown or archival.

catalogue_fit:
  categories: [ai, database]
  has_web_ui: false
  reverse_proxy_compatible: false
  overlaps_with: []
  differentiation: >
    No existing recipe is a vector database. Milvus would serve AI/RAG
    pipelines (embedding storage + similarity search) that customers build
    themselves, which is a different role than any of the 24 shipping
    recipes — closest in spirit is recipes/ollama (also an unauthenticated
    API-first backend with no bundled browser UI, and notably shipped with
    enabled: false in its own metadata).
  usefulness: medium
  usefulness_rationale: >
    Real demand exists for a managed vector DB backing custom AI apps, but
    it's infrastructure a developer wires an SDK into, not something an AF
    customer opens in a browser and uses directly — narrower audience than
    our current UI-first catalogue.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [MILVUS_ROOT_PASSWORD_OR_GATE]
  secrets_expressible_today: []
  blocking_issues:
    - >
      Milvus's client protocol is gRPC (port 19530), not HTTP form-based
      login. Authentication is disabled by default, and when enabled the
      root user's password stays the hardcoded default ("Milvus") until an
      operator calls the runtime UpdateCredential RBAC API post-boot —
      there is no env var or startup config that accepts a pre-hashed
      password, so `generated_from: "<algo>:ROOT_PASSWORD"` has nothing to
      project into.
    - >
      Traefik `basic_auth` assumes an HTTP browser login challenge; gRPC
      SDK clients (Python/Java/Go/Node) don't perform an interactive
      basic-auth handshake, so gating the gRPC port with basic auth would
      break normal client access rather than securing it. Exposing the
      port ungated leaves the database open to anyone who reaches the
      domain.
    - >
      Standalone minimum viable deployment is a 3-container stack (Milvus
      + etcd + MinIO) with no bundled browser UI; the built-in port 9091
      "webui" is a read-only health/metrics page, not an admin console. A
      real GUI would require bundling the separate Attu project, which
      itself needs the same root-password channel to connect to Milvus —
      doesn't resolve the underlying gap, just moves it.
    - >
      recipes/ollama shows this catalogue already has a precedent for an
      unauthenticated-API-only backend, and it ships with `enabled: false`
      — suggesting this exact class of app (browser-less, SDK-driven,
      no auth channel) has already been judged not ready to expose to AF
      customers.
  installable_today: false
  recommendation: not_recommended

summary: >
  Milvus is an actively maintained, well-regarded vector database, but it's
  architecturally a backend a developer's own code talks to over gRPC, not
  a browser-facing self-hosted app — it has no bundled web UI and no
  mechanism to receive a customer-supplied or root-password-derived admin
  credential at boot. Its default posture is no authentication at all, and
  neither of the two supported secret-projection mechanisms (generated_from
  hash, Traefik basic_auth) maps onto its gRPC client protocol. Recommend
  not building this recipe now; revisit only if a future platform version
  adds raw-TCP/gRPC-aware gating or Milvus itself grows a config-time
  password-hash input.
