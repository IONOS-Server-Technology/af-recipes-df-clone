slug: mafl
name: Mafl
source_description: "Minimalistic YAML-driven homepage dashboard for self-hosted services"

upstream:
  url: https://mafl.hywax.space
  repo_url: https://github.com/hywax/mafl
  license: MIT
  docker_image: hywax/mafl (also published as ghcr.io/hywax/mafl)

version_health:
  latest_version: "v0.15.4"
  latest_release_date: "2024-07-13"
  release_cadence: dormant
  eol_status: maintenance-only
  notes: >-
    No tagged release since v0.15.4 (2024-07-13) — roughly 25 months before
    today (2026-08-05). The Docker Hub `latest`/`v0` tags still resolve to
    that same 2-year-old v0.15.4 build. The repo itself is not archived and
    still receives pushes (last push 2026-06-07), but recent activity is
    almost entirely an automated `hywax-assistant` bot repeatedly committing
    "chore: update CONTRIBUTORS" — the last actual human feature/fix commit
    found was "Added Dutch locale (#134)" merged 2024-11-28, about 21 months
    ago. 48 open issues with no visible recent maintainer response. This
    reads as a project on autopilot rather than actively maintained: not
    formally EOL or archived, but effectively dormant.

catalogue_fit:
  categories: [dashboard, productivity]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >-
    None of the current 24 recipes is a homepage/service-directory dashboard
    — Mafl would be the first "landing page that links out to your other
    self-hosted services" style app. Its practical value is highest when a
    customer has several AF recipes deployed and wants one page linking and
    monitoring all of them; for a customer with a single app this adds
    limited value over just bookmarking that app's URL directly.
  usefulness: low
  usefulness_rationale: >-
    The dashboard concept is genuinely novel versus the current catalogue,
    but the specific upstream artifact is stale (no release in ~2 years,
    only bot-noise commits since late 2024) and the value proposition
    depends on the customer already running multiple self-hosted apps to
    link together, which is a narrower use case than a standalone tool.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [access-gate credential]
  secrets_expressible_today:
    - secret: access-gate credential
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: not_recommended

summary: >-
  Mafl is a single-container, single-port (3000) YAML-configured dashboard
  with no built-in authentication of its own, so it is mechanically
  installable today behind a Traefik `basic_auth` gate with no blocking
  secret-channel issue. It would also be a genuinely new category for the
  catalogue (no existing recipe is a homepage/service-directory dashboard).
  However, the upstream project looks dormant: the image has been frozen at
  v0.15.4 since 2024-07-13 (~25 months), and the repo's only recent activity
  is an automated bot updating a contributors file, with the last real
  human commit dated 2024-11-28. Combined with a value proposition that
  mainly pays off for customers running several other self-hosted apps
  rather than as a standalone product, this is a `not_recommended` candidate
  pending signs of renewed upstream activity.
