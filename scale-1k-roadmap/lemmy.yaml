slug: lemmy
name: Lemmy
source_description: Federated link aggregator and discussion platform for self-hosted forums

upstream:
  url: https://join-lemmy.org
  repo_url: https://github.com/LemmyNet/lemmy
  license: AGPL-3.0
  docker_image: dessalines/lemmy (backend), dessalines/lemmy-ui (frontend), plus asonix/pictrs (image hosting), pgautoupgrade/pgautoupgrade (Postgres), nginx (bundled internal proxy)

version_health:
  latest_version: "0.19.20"
  latest_release_date: "2026-07-21"
  release_cadence: active
  eol_status: active
  notes: >
    15 days since 0.19.20 (2026-07-21) as of 2026-08-05. Repo also has an
    active 1.0.0 pre-release track running in parallel (1.0.0-beta.1 tagged
    2026-07-03, 1.0.0-alpha.20 tagged 2026-05-30) — dual-track stable/beta
    development, not a stalled project. 14.5k stars, 109 open issues, 11 open
    PRs, not archived. Clearly active upstream.

catalogue_fit:
  categories: [social, community, federation]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    No app in the current 24-recipe catalogue covers federated social/forum
    software — everything close (gitea, opengist) is developer-tooling, not
    community/discussion. Lemmy is a genuinely new category: self-hosted
    Reddit-style link aggregation and discussion, federated via ActivityPub
    with other Lemmy/fediverse instances. Appeals to customers who want to
    run their own community forum rather than depend on a third-party
    platform.
  usefulness: medium
  usefulness_rationale: >
    Fills a real gap (zero overlap) and has an active, growing upstream, but
    the audience — people willing to operate a public federated community
    instance, with the moderation and abuse-handling responsibility that
    implies — is narrower than general productivity/infra tools already in
    the catalogue.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Lemmy is an active federated discussion/link-aggregation platform (backend
  0.19.20 released 2026-07-21, ~15 days ago, with a parallel 1.0.0-beta track
  in progress, 14.5k stars, AGPL-3.0) that fills a genuinely new category in
  the catalogue — nothing today covers federated social/community software.
  Verified against upstream's shipped docker-compose.yml
  (lemmy-docs/assets/docker-compose.yml): the stack is lemmy (backend),
  lemmy-ui (frontend), postgres, pictrs (image hosting), and an internal
  nginx that unifies all of them behind one public port by path-based
  routing — meaning it fits our single-Traefik-port model cleanly (Traefik
  replaces nginx as the single public entry point). Crucially, Lemmy needs no
  customer-supplied secret at all at first boot: per upstream docs
  (administration/from_scratch.html), visiting a fresh instance's domain
  shows an in-browser setup screen where the visitor themselves creates the
  first admin account interactively (same open-registration pattern as
  n8n's owner-setup flow already shipping in the catalogue) — the backend's
  optional `setup.admin_password` config field (which would need a plaintext
  password we structurally cannot supply, only a hash) can simply be omitted.
  Postgres and pictrs credentials are ordinary server-generated internal
  secrets nothing customer-facing ever reads. No blockers identified;
  recommend build_now.
