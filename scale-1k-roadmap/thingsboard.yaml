slug: thingsboard
name: ThingsBoard
source_description: "Open-source IoT platform for device management and real-time dashboards"

upstream:
  url: https://thingsboard.io
  repo_url: https://github.com/thingsboard/thingsboard
  license: Apache-2.0
  docker_image: thingsboard/tb-node

version_health:
  latest_version: "v4.3.1.3"
  latest_release_date: "2026-06-30"
  release_cadence: active
  eol_status: active
  notes: >
    v4.3.1.3 published 2026-06-30, about 5 weeks before today (2026-08-05).
    Upstream runs two parallel maintenance lines (4.3.x and 4.2.x) with
    synchronized patch releases roughly every 4-8 weeks throughout 2026:
    v4.3/v4.2.1.1 (2026-01-20/2025-12-24), v4.3.0.1/v4.2.1.2 (2026-02-03),
    v4.3.1/v4.2.2 (2026-03-10), v4.3.1.1/v4.2.2.1 (2026-03-31),
    v4.3.1.2/v4.2.2.2 (2026-05-28), v4.3.1.3/v4.2.2.3 (2026-06-30). Repo is
    not archived and clearly actively maintained, not maintenance-only.

catalogue_fit:
  categories: [automation, monitoring]
  has_web_ui: true
  reverse_proxy_compatible: false
  overlaps_with: []
  differentiation: >
    home-assistant is the closest existing recipe by keyword ("IoT"/smart
    home) but serves a completely different use case: it's a consumer
    local-automation hub with hundreds of built-in integrations that talk
    directly to specific smart-home devices/hubs on the customer's own
    network. ThingsBoard has no built-in device integrations at all — it's
    a generic device-management and telemetry-dashboard backend that a
    customer's own hardware/firmware (sensors, gateways, industrial
    equipment) must be programmed to connect to over MQTT/HTTP/CoAP/LwM2M.
    Nothing in the current 24 recipes covers this "build your own IoT
    backend" developer-platform niche, so it would be a genuinely new
    vertical, not a duplicate.
  usefulness: medium
  usefulness_rationale: >
    Well-known, widely deployed IoT platform (20k+ GitHub stars) with a
    real dashboard/rule-engine web UI a customer can use without writing
    backend code, unlike a pure SDK-only platform. But its core value —
    ingesting live telemetry from real devices — only materializes once the
    customer has hardware that can speak MQTT/CoAP/HTTP to it, which is a
    narrower, more technical audience than broad-appeal recipes like n8n or
    Vaultwarden.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot:
    - thingsboard_basic_auth_password
    - postgres_password
  secrets_expressible_today:
    - secret: thingsboard_basic_auth_password
      mechanism: traefik_basic_auth
    - secret: postgres_password
      mechanism: server_generated_no_customer_input
  blocking_issues:
    - >
      Real device connectivity — the actual point of an IoT platform — needs
      the MQTT (1883/8883) and CoAP/LwM2M (5683-5688/udp) transports
      reachable directly, not just the HTTP web UI on :8080. These are raw
      TCP/UDP ports rather than HTTP routes behind Traefik; the platform's
      `ports` metadata does support declaring raw tcp/udp ports (as
      wg-easy's VPN port already does), so this is an exposure-mechanism
      limitation to flag, not a hard secrets-input blocker: no customer
      value needs to be injected into those ports at boot, since device
      auth (per-device MQTT access tokens) is generated inside the running
      app after the admin logs in, the same "configure it in-browser after
      deploy" pattern already accepted for TeslaMate's Tesla-account link
      and n8n's post-install API credentials.
  installable_today: true
  recommendation: build_with_caveats

summary: >
  A clean single-instance install (thingsboard/tb-node + Postgres, no
  LOAD_DEMO flag) creates exactly one login: sysadmin@thingsboard.org with
  a fixed default password the app gives no env var to set at container
  startup — same pattern as TeslaMate/Adminer, addressed by gating the
  whole app behind a mandatory Traefik basic_auth credential rather than
  relying on the app's own unchangeable-at-boot default. Postgres's
  password is a patternless secret the server can generate with no
  customer input. Mechanically installable today, but build_with_caveats
  rather than build_now: the platform's real usefulness depends on
  exposing raw MQTT/CoAP/LwM2M ports beyond the reverse-proxied web UI
  (mechanically supported via the existing tcp/udp `ports` field, as
  wg-easy already does, but a heavier network footprint than our typical
  single-HTTP-port recipe).
