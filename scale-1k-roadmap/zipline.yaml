catalogue_fit:
  categories: [file-sharing, productivity]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24 recipes covers ShareX-style screenshot/file
    upload hosting. Immich is a photo/video library with albums and ML
    search, aimed at personal media backup rather than generating quick
    shareable links; Syncthing continuously syncs files between the
    customer's own devices rather than serving public/shared upload links;
    Opengist shares text/code snippets specifically, not arbitrary files
    or images. Zipline's niche — a personal "screenshot/file drop" server
    that ShareX, Flameshot, and similar tools upload directly to, returning
    a shareable URL — is distinct from all of these.
  usefulness: medium
  usefulness_rationale: >
    Popular among a specific but sizeable audience (people replacing
    imgur/Discord-CDN-style screenshot hosting with a self-hosted
    ShareX-compatible endpoint), with a modern dashboard and URL shortener
    features. Narrower appeal than a general-purpose consumer app like a
    password manager or budgeting tool, but a clean, well-defined,
    frequently-requested self-hosting use case.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Zipline is a two-service stack (its own Node app plus a PostgreSQL
  database, matching the n8n/paperless-ngx template) serving its dashboard
  and upload API on a single HTTP port (3000) — fully Traefik-compatible.
  It needs a `CORE_SECRET` cookie-signing key and a Postgres password at
  boot, but both are patternless server-side secrets nothing customer-
  facing ever needs to read, so af-api can generate them internally with
  no input channel required. Confirmed against current (v4) docs and the
  official docker-compose: on first browser visit the customer is
  redirected to a one-time setup page to create their own super-admin
  username and password directly through the app's UI (the same
  self-locking first-visit pattern already accepted for the shipped
  Uptime Kuma and gap-analyzed Actual Budget recipes) — unlike an
  open-ended self-registration app (e.g. An Otter Wiki), this setup path
  closes itself off permanently once the first admin account is created,
  so it does not need a Traefik basic_auth gate to avoid an indefinite
  registration-race window. That clears the /compose constraint today
  with zero blocking issues and no customer-supplied secret needed at
  all — just the domain param. Release cadence is active (latest release
  8 days old, near-daily trunk builds) with no maintenance-only or EOL
  signal. Recommend building the recipe: it fills a real, currently-unfilled
  niche in the catalogue with a well-maintained upstream project.
