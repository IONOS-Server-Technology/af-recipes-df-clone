slug: blinko
name: Blinko
source_description: "AI-powered note-taking and microblogging platform with Markdown support and task management"

upstream:
  url: https://blinko.space
  repo_url: https://github.com/blinkospace/blinko
  license: GPL-3.0
  docker_image: blinkospace/blinko:1.8.8

version_health:
  latest_version: "1.8.8"
  latest_release_date: "2026-06-20"
  release_cadence: active
  eol_status: active
  notes: >
    Latest release (1.8.8) shipped ~1.5 months before today (2026-08-05);
    prior releases (1.8.7, 1.8.6, 1.8.5 ...) landed roughly monthly going
    back through late 2025. Repo has ~10.8k stars, 767 forks, 394 open
    issues, 14 open PRs, and continuous commit activity — clearly
    actively maintained, not dormant or archived.

catalogue_fit:
  categories: [productivity, notes]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: [anytype-server]
  differentiation: >
    anytype-server only ships a sync backend for AnyType's separate desktop/
    mobile client — it has no browser UI of its own. Blinko is a
    self-contained web app (notes + microblog-style flow + Markdown +
    tasks + optional AI-assisted search) usable entirely from the browser,
    which is a materially different customer experience despite both being
    "notes" tools.
  usefulness: medium
  usefulness_rationale: >
    Popular, actively developed self-hosted notes app with a real web UI
    that fronts cleanly behind Traefik — a good fit for the productivity
    category, which currently only has paperless-ngx/paperless-ai
    (documents) and anytype-server (sync-only, no UI).

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Blinko is a single web-app container plus Postgres, needs only a domain,
  and requires no customer-supplied secret at deploy time: NEXTAUTH_SECRET
  and the Postgres password are internal, server-generated values nothing
  customer-facing ever reads, and the admin account is created by the
  customer themselves via an in-app /signup form after first boot (the same
  pattern already used by uptime-kuma), not through a compose-time
  parameter. Optional AI-assisted note retrieval needs an external LLM
  provider key, but it's off by default and not required to use the app.
  Actively maintained (~monthly releases, large community), reverse-proxy
  friendly, and distinct enough from anytype-server's sync-only offering to
  be worth adding. Recommended for a real af-create-recipe pass.
