  url: https://rxresu.me
  repo_url: https://github.com/AmruthPillai/Reactive-Resume
  license: MIT
  docker_image: amruthpillai/reactive-resume

version_health:
  latest_version: "v5.2.5"
  latest_release_date: "2026-07-30"
  release_cadence: active
  eol_status: active
  notes: >
    Very tight release cadence: v5.2.5 (2026-07-30), v5.2.4 (2026-07-28),
    v5.2.3 (2026-07-08), v5.2.2 (2026-07-07), v5.2.1 (2026-07-05) — five
    tagged releases in the ~4 weeks before today (2026-08-05), several only
    a day or two apart. Docker Hub image tags (v5.2.5, v5.2, v5, latest,
