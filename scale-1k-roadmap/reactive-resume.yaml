slug: reactive-resume
name: Reactive Resume
source_description: "Privacy-first open-source resume builder with 14+ templates and PDF export"

upstream:
  url: https://rxresu.me
  repo_url: https://github.com/AmruthPillai/Reactive-Resume
  license: MIT
  docker_image: amruthpillai/reactive-resume
  compose_file_url: https://raw.githubusercontent.com/AmruthPillai/Reactive-Resume/main/compose.yml
  compose_file_notes: >
    Official, from the project's own repo root (also linked from the
    project's self-hosting docs at docs.rxresu.me/self-hosting/docker).
    Rolling reference to the main branch, not version-pinned — no
    per-release compose asset is published. The repo ships two compose
    files; picked compose.yml (the "production" one) over compose.dev.yml
    (bind-mounts source with file-watch, uses Dockerfile.dev, binds all
    ports to 127.0.0.1 only — clearly a local-dev loop, not a deployment
    target). Note a discrepancy worth watching: the docs page embeds an
    older, simpler two-service example (postgres + reactive-resume using
    the published amruthpillai/reactive-resume:latest image, no
    redis/seaweedfs), while the current compose.yml in the repo has grown
    to five services (postgres, redis, seaweedfs, a seaweedfs bucket-init
    job, and the app) and builds the app from local Dockerfile source
    rather than pulling the published image (the image: line is present
    but commented out). The repo file is more current and was used as the
    recorded reference since it's canonical over a docs-embedded snippet,
    but the two have drifted apart.

