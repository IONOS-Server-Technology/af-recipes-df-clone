slug: denokv
name: DenoKV
source_description: "The Denoland key-value database for Deno Deploy"

upstream:
  url: https://github.com/denoland/denokv
  repo_url: https://github.com/denoland/denokv
  license: MIT
  docker_image: ghcr.io/denoland/denokv:0.14.0

version_health:
  latest_version: "0.14.0"
  latest_release_date: 2026-06-06
  release_cadence: slowing
  eol_status: active
  notes: >
    ~2 months since 0.14.0 (2026-06-06) as of today (2026-08-05) — still
    actively maintained. Cadence had been fairly regular every ~2-3 months
    from 0.8.1 (2024-06) through 0.12.0 (2025-07-29), but the gap between
    0.13.0 (2025-11-21) and 0.14.0 (2026-06-06) stretched to ~6.5 months,
    the widest gap in the release history — worth flagging as a slowdown,
    not yet dormant.

catalogue_fit:
  categories: [developer-tools]
  has_web_ui: false
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    No existing recipe provides a standalone database/KV backend service.
    DenoKV is a self-hosted implementation of the Deno KV protocol (SQLite-
    backed, ACID transactions) so a customer's own Deno/Deno Deploy
    applications can point at an external, persistent KV store instead of
    the single-instance built-in one. It would be a genuinely new capability
    in the catalogue, not a duplicate of anything we ship today.
  usefulness: low
  usefulness_rationale: >
    Purely a headless API backend with no web UI and no admin surface at
    all — the customer interacts with it exclusively by pointing their own
    Deno code at it via `Deno.openKv(url)`. That's a narrow niche (customers
    already building Deno/Deno Deploy applications who specifically want an
    external KV backend) compared to the general-purpose, UI-driven apps
    that make up the rest of the catalogue, and it has no standalone value
    without that specific developer workflow.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [DENO_KV_ACCESS_TOKEN]
  secrets_expressible_today:
    - secret: DENO_KV_ACCESS_TOKEN
      mechanism: server_generated_no_customer_input
  blocking_issues: []
  installable_today: true
  recommendation: not_recommended

summary: >
  DenoKV is mechanically installable today: it needs only a single bearer
  access token, which is a plain server-generated secret (not a customer-
  chosen credential and not a login the app itself hashes), so it fits the
  server_generated_no_customer_input mechanism cleanly, and it exposes one
  plain-HTTP port with no other raw protocols, making it reverse-proxy
  compatible. However, it has no web UI whatsoever and its only interface is
  a developer-facing KV protocol consumed from a customer's own Deno code —
  a narrow audience relative to the rest of the catalogue, with release
  cadence recently slowing. Given the mechanical ease to ship but very
  limited general-audience appeal, it is not recommended for the current
  catalogue; revisit if Deno adoption among AF customers becomes a
  requested use case.
