slug: docassemble
name: docassemble
source_description: "Open-source expert system for guided interviews and automated document assembly"

upstream:
  url: https://docassemble.org
  repo_url: https://github.com/jhpyle/docassemble
  license: MIT
  docker_image: "jhpyle/docassemble"
  compose_file_url: null
  compose_file_notes: >
    No static official docker-compose.yaml/.yml exists. docassemble.org's
    own Docker docs (docassemble.org/docs/docker.html) point to the
    official multi-container setup at github.com/jhpyle/docassemble-compose,
    but that repo has no docker-compose.yml checked in — its
    templates/docker-compose.yml.template
    (raw.githubusercontent.com/jhpyle/docassemble-compose/master/templates/docker-compose.yml.template)
    contains non-YAML `# include if USE_PANDOC` / `# endinclude` directives
    and is only turned into a real, runnable docker-compose.yml by running
    the repo's interactive setup.sh (which prompts for choices like
    Pandoc/LibreOffice/Tesseract inclusion, external vs. containerized
    Postgres/Redis/RabbitMQ, and TLS/Certbot vs. reverse-proxy mode) — there
    is no single fixed variant to point to. The simpler, single-container
    jhpyle/docassemble image (already recorded as docker_image above) is
    documented via a bare `docker run` command, not a compose file, on the
    same docs page.

version_health:
  latest_version: "1.10.7"
  latest_release_date: "2026-08-01"
  release_cadence: active
  eol_status: active
  notes: >
    Latest tag 1.10.7 pushed 2026-08-01, 4 days before this analysis
    (2026-08-05). Release history shows near-weekly cadence through 2026
    (1.10.0 on 2026-06-28, then 1.10.1 through 1.10.7 roughly every few days
    to a week through early August). Actively maintained by a single lead
    maintainer (jhpyle); no signs of dormancy, archival, or EOL. Note: the
    upstream GitHub repo has no tagged "Releases" (empty Releases page) —
    version history is tracked via the changelog on docassemble.org and
    Docker Hub / PyPI tags instead, not GitHub Releases.

catalogue_fit:
  categories: [productivity, legal-tech]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue covers guided-interview /
    document-assembly ("expert system" that walks an end user through a
    Q&A interview and generates filled legal/business documents from
    templates). Paperless-ngx is the closest structural neighbor (Postgres-
    backed single web app) but solves a different problem — archiving and
    searching existing documents, not generating new ones from an interview
    flow. This would be a genuinely new category (document generation /
    legal-tech tooling) rather than a duplicate.
  usefulness: medium
  usefulness_rationale: >
    Real, distinct niche (law firms, HR, compliance teams automating form
    generation) with no current coverage, but it's a narrower, more
    specialized audience than most of the existing catalogue (e.g. n8n,
    Vaultwarden) and comes with meaningfully heavier resource needs (4GB RAM,
    40GB disk minimum) for a single-purpose app.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [DA_ADMIN_EMAIL, DA_ADMIN_PASSWORD, DA_ADMIN_API_KEY]
  secrets_expressible_today: []
  blocking_issues:
    - >
      DA_ADMIN_PASSWORD, the container's initial-admin-login mechanism, only
      accepts a plaintext password at first boot (used to create the admin
      account, then upstream docs recommend deleting it) — there is no
      option to supply a pre-hashed value in any algorithm. Per
      apps-gaps/SCHEMA.md, generated_from only ever projects a hash of the
      customer's root password, never the plaintext itself, so this is a
      genuine structural blocker rather than an "unsupported algorithm"
      case: no channel exists today to get a customer-specific admin
      password into this app.
    - >
      DA_ADMIN_API_KEY (optional but recommended for programmatic access) is
      an arbitrary API key with no customer input channel either, though it
      is not required to boot.
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  docassemble is active and well-maintained (near-weekly releases, latest
  2026-08-01), MIT-licensed, and fills a genuine gap in the catalogue
  (guided-interview document assembly, nothing comparable in the current 24
  recipes). It is also reverse-proxy-compatible: BEHINDHTTPSLOADBALANCER=true
  plus USEHTTPS=false lets it sit cleanly behind Traefik with no internal
  TLS termination needed. The blocker is the admin-login mechanism: unlike
  Vaultwarden-style apps that accept a pre-hashed admin credential,
  docassemble's DA_ADMIN_PASSWORD only takes a plaintext password at
  container init, which the current /compose mechanism has no channel to
  supply (generated_from only ever carries a hash). Revisit once the
  platform supports projecting a plaintext value derived from the
  customer's root password, or if upstream adds a hashed-password init
  option.
