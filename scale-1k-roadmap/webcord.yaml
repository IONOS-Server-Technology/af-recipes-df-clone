slug: webcord
name: WebCord
source_description: "Privacy-focused Discord client with enhanced security and custom features"

upstream:
  url: https://github.com/SpacingBat3/WebCord
  repo_url: https://github.com/SpacingBat3/WebCord
  license: MIT
  docker_image: lscr.io/linuxserver/webcord
  compose_file_url: null
  compose_file_notes: >
    No standalone official docker-compose.yml/.yaml file exists. The
    LinuxServer.io project (which packages WebCord as
    lscr.io/linuxserver/webcord) publishes a docker-compose example only
    inline in its per-image docs page
    (docs.linuxserver.io/images/docker-webcord/), generated from
    readme-vars.yml in github.com/linuxserver/docker-webcord — that repo's
    root has no docker-compose.yml/.yaml file (checked: Dockerfile,
    Dockerfile.aarch64, README.md, readme-vars.yml, jenkins-vars.yml, no
    compose file). The inline example pins to the `:latest` tag (a rolling
    reference, not a version-pinned release), so there is nothing that
    would qualify as a project-published, watchable compose file per the
    Immich-style bar for "official". Upstream WebCord itself
    (github.com/SpacingBat3/WebCord) is a desktop Electron app with no
    compose file of its own; the only Docker packaging is LinuxServer's.

version_health:
  latest_version: "v4.14.0"
  latest_release_date: "2026-07-12"
  release_cadence: active
  eol_status: active
  notes: >
    v4.14.0 released 2026-07-12, about 24 days before today (2026-08-05).
    Prior releases: v4.13.2 (2026-06-28, hotfix), v4.13.0 (2026-04-06),
    v4.12.1 (2025-11-18) — cadence has been roughly monthly through 2026
    with an earlier gap around late 2025. Upstream repo is not archived
    and actively receives feature/fix commits (v4.14.0 notes include a
    Discord GIF-provider migration fix and a TS v7/OXLint toolchain
    switch), so the client itself is under active development. The
    LinuxServer.io Docker packaging (linuxserver/docker-webcord, built on
    their kasmvnc base image) tracks upstream releases and is likewise
    actively maintained.

catalogue_fit:
  categories: [productivity, communication]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    WebCord is not a server application — it is a desktop Electron app
    (an alternative Discord/SpaceBar client) that the LinuxServer.io image
    runs inside a virtual Linux desktop and exposes over a browser via
    KasmVNC (a noVNC-style remote-desktop protocol), on ports 3000 (HTTP)
    and 3001 (HTTPS). Nothing in the current 24-recipe catalogue is a
    personal chat-client remote desktop; the closest structural cousin is
    Guacamole, which is a generic remote-desktop *gateway* rather than a
    single packaged app. WebCord's "web UI" is a rendered virtual desktop,
    not an HTTP application with real multi-user server value — it is
    functionally a single end-user's personal Discord session, streamed
    from a container instead of run locally.
  usefulness: low
  usefulness_rationale: >
    The appeal of self-hosting a chat client for personal Discord use
    inside a hosted VM is thin next to genuine infrastructure/productivity
    tools already in the catalogue: nearly every user already has a native
    or web Discord client, and running a full container + virtual desktop
    just to reach it adds cost and latency without a corresponding
    capability (no multi-user server role, no data ownership benefit — the
    account and messages still live on Discord's own servers).

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot:
    - "Traefik basic-auth gate credential"
  secrets_expressible_today:
    - secret: "Traefik basic-auth gate credential"
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  WebCord is an actively maintained, MIT-licensed Discord client with an
  official LinuxServer.io Docker image (lscr.io/linuxserver/webcord)
  exposing a single browser-reachable port via KasmVNC — mechanically it
  is installable today: the container has no built-in login by default,
  so a mandatory Traefik `basic_auth` gate covers the one secret it needs,
  the same pattern used for n8n and WUD. It is not a server application in
  the usual sense: it packages a personal desktop chat client as a remote
  virtual desktop, with no multi-user or self-hosted-data value
  proposition, and nothing in the current 24-recipe catalogue overlaps
  with it. With `installable_today: true` and no blocking issues,
  recommendation is `build_now`.
