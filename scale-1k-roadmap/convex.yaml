slug: convex
name: Convex
source_description: "Open-source reactive database platform for modern application development"

upstream:
  url: https://www.convex.dev
  repo_url: https://github.com/get-convex/convex-backend
  license: MIT (community/self-hosted OSS backend and dashboard)
  docker_image: ghcr.io/get-convex/convex-backend (paired with ghcr.io/get-convex/convex-dashboard)

version_health:
  latest_version: "Precompiled 2026-08-05-38abb46 (rolling date+commit-hash tags, no semver releases)"
  latest_release_date: "2026-08-05"
  release_cadence: active
  eol_status: active
  notes: >
    Releases are rolling precompiled builds tagged by date + short commit
    hash rather than semver — multiple tags cut on 2026-08-04 and
    2026-08-05 alone (the day before/of this analysis), several hours
    apart. 7,500+ commits on main, 147 open issues, 50 open PRs, 12.3k
    GitHub stars; maintainers describe internal changes as synced to the
    public repo within days. No archival, deprecation, or EOL signal
    anywhere upstream — this is a venture-backed, actively-developed
    product at the core of Convex's commercial offering.

catalogue_fit:
  categories: [development, database, backend-as-a-service]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue is a backend-as-a-service /
    reactive database platform. Closest structural neighbors are n8n and
    paperless-ngx (Postgres-backed multi-container app), but those are
    finished end-user applications; Convex is an application *backend*
    with no end-user-facing product of its own — customers write and
    deploy their own TypeScript functions against it from a separate
    frontend (e.g. a Vercel-hosted app), using the Convex CLI. It's a
    genuinely distinct capability (live-query reactive database + serverless
    functions + file storage), but it targets developers building on top
    of the instance rather than someone using the instance directly, which
    is a different usage pattern than every other recipe in the catalogue.
  usefulness: medium
  usefulness_rationale: >
    Real demand exists for self-hosted Firebase/Supabase-style backends,
    and Convex is a well-funded, popular entrant in that space. The
    ceiling is capped by the fact that the value only materializes once a
    customer writes and deploys their own application code against this
    instance via the Convex CLI — it's a developer building-block, not a
    ready-to-use product, closer to a hosted database (which we don't
    otherwise offer standalone) than to any existing recipe.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot:
    - Convex admin key (`convex-self-hosted|<hash>`) — required by the customer's own machine to run `npx convex deploy`/`convex dev` against this instance, and to authenticate in the dashboard UI; without it the instance is unusable by its owner
    - INSTANCE_SECRET (internal — backend/dashboard shared secret, never read by the customer directly)
    - basic_auth_password (dashboard, port 6791, has no server-side login wall of its own — needs a Traefik gate as a network-exposure precaution)
  secrets_expressible_today:
    - secret: INSTANCE_SECRET
      mechanism: server_generated_no_customer_input
    - secret: basic_auth_password
      mechanism: traefik_basic_auth
  blocking_issues:
    - >
      The customer-critical secret is the Convex admin key, not
      INSTANCE_SECRET. The admin key is not an env var at all — it is
      computed at runtime by running `./generate_admin_key.sh` inside the
      already-running backend container (a deterministic function of
      INSTANCE_SECRET + INSTANCE_NAME), and printed to stdout in the format
      `convex-self-hosted|<hash>`. It is not a login-form field on the app
      (so `generated_from` on an app parameter doesn't apply — there is no
      admin username/password screen to project a hash into), and it must
      reach the customer verbatim to be useful (so `traefik_basic_auth` and
      `server_generated_no_customer_input` don't apply either — this is a
      customer-facing plaintext value the customer needs on their own
      machine, not something gate-worthy or gate-satisfied).
    - >
      No channel exists today to surface a value computed post-boot by
      install.sh (as opposed to a metadata-declared `auto_generate`
      parameter set at compose time) back to the customer. Even if
      install.sh ran `docker compose exec backend ./generate_admin_key.sh`
      automatically during provisioning and captured its output, there is
      no post-install "here is your credential" delivery surface in the
      current recipe/API mechanism to hand that string to the customer —
      this is a distinct gap from the three documented mechanisms, not a
      variant of any of them.
    - >
      The dashboard itself (port 6791) has no server-side login wall — it
      loads for anyone who reaches it and simply prompts for the admin key
      client-side before it can do anything. That means it should sit
      behind a Traefik `basic_auth` gate purely as a network-exposure
      precaution (same as n8n/Open WebUI), but that gate is orthogonal to
      — and does not solve — the missing admin-key-delivery problem above.
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  Convex is active, well-funded, and fills a real gap (no backend-as-a-
  service / reactive-database recipe exists today), but it doesn't fit the
  "self-contained end-user app" shape of the rest of the catalogue — the
  product only becomes useful once the customer deploys their own code
  against it via the Convex CLI, using an admin key that self-hosted
  Convex computes at container runtime rather than accepting or emitting
  through any env var. That admin key is customer-facing and mandatory
  from the very first use, and there is no existing mechanism
  (generated_from, traefik_basic_auth, or server-generated-no-customer-
  input) that can deliver it, nor any general post-install
  credential-reveal channel to fall back on. This is blocked on a platform
  gap distinct from IF-1420/IF-1312 — a way to compute a value after boot
  and hand it to the customer — not just on those two tickets landing.
