slug: projectsend
name: ProjectSend
source_description: "Client-focused file sharing platform for securely sending files to clients"

upstream:
  url: https://www.projectsend.org/
  repo_url: https://github.com/projectsend/projectsend
  license: GPL-2.0
  docker_image: linuxserver/projectsend

version_health:
  latest_version: "r2029"
  latest_release_date: "2026-03-29"
  release_cadence: active
  eol_status: active
  notes: >
    Confirmed via the GitHub API, not training-data recall. As of today
    2026-08-05: latest tagged release is r2029 (2026-03-29), part of a
    burst of three releases in March 2026 (r1994 -> r2002 -> r2029) after a
    longer r1720 (2024-08-03) -> r1945 (2025-10-10) gap. No new tag in the
    ~4 months since r2029, but the default `develop` branch is not stalled:
    `pushed_at` is 2026-08-04 and commits land multiple times a week
    (latest 2026-07-17), including active dependency bumps and bug fixes,
    with 352 forks / 1956 stars and 176 open issues still being triaged.
    Repo is not archived. Reading this as active development with irregular
    (not dormant) tagging, not a maintenance-only or EOL project.

catalogue_fit:
  categories: [productivity, file-sharing]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue covers client-facing file
    delivery. Syncthing is peer-to-peer file sync (no client-portal
    concept), Vaultwarden is a password manager, and immich/paperless-ngx
    are personal media/document archives rather than tools for sending
    files to external clients with per-client access lists and public
    download links. ProjectSend's niche (accountant/agency/freelancer
    sending deliverables to named clients) is genuinely new ground.
  usefulness: medium
  usefulness_rationale: >
    Real demand exists for a lightweight "send files to clients" tool as a
    Nextcloud alternative, and the upstream is healthy and widely deployed
    (1956 stars, official LinuxServer image with >1M pulls). Usefulness is
    capped at medium rather than high because the deployment model
    available today (see installability) undermines the app's actual
    selling point — reaching external clients who have no account on the
    server.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [DB_PASSWORD, ADMIN_SETUP_GATE]
  secrets_expressible_today:
    - secret: DB_PASSWORD
      mechanism: server_generated_no_customer_input
  blocking_issues:
    - >
      ProjectSend has no env-var-driven admin account provisioning. The
      LinuxServer image only documents PUID/PGID/TZ/UMASK; the admin
      username and password are created interactively through the app's
      own browser-based install wizard on first visit (confirmed against
      ProjectSend's own install docs: DB connection can be pre-seeded by
      writing includes/sys.config.php before first boot, but "system and
      administrator user information" is still collected by the wizard
      itself, with no documented pre-seed or CLI path for that step). That
      install wizard sits open and unauthenticated on the public domain
      until someone completes it, so whoever reaches the URL first claims
      the admin account — a real race condition our recipe mechanism has
      no channel to close (there is no admin secret we could project via
      `generated_from`, since the app never accepts a pre-set/pre-hashed
      credential).
    - >
      The only available mitigation, a Traefik `basic_auth: true` gate on
      the whole domain (same pattern used for Adminer/n8n), would close
      that install-wizard race but comes at a cost specific to this app:
      ProjectSend's core feature is giving external clients (who have no
      account of their own, and in many cases use the app's public/guest
      download links — see the "public download" feature referenced in
      upstream's own commit history) direct access to files sent to them.
      A permanent whole-domain basic_auth gate would force every client to
      also learn and enter the tenant's shared root-password-derived
      credential before they can reach their files or a public download
      link, defeating the product's actual purpose. This is the same
      class of blocker `apps-gaps/prestashop.yaml` and
      `apps-gaps/bagisto.yaml` hit: gating an entire single-port app behind
      basic_auth to protect one admin/setup surface also locks out the
      public-facing audience the app exists to serve, and there is no
      path-scoped or setup-only-then-auto-removed basic_auth mechanism
      today to gate just the install wizard/admin login without touching
      client-facing paths.
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  ProjectSend is upstream-healthy (active `develop` branch, latest tagged
  release r2029 from 2026-03-29, an official LinuxServer Docker image with
  broad adoption) and would fill a genuine gap in the catalogue — no
  existing recipe covers client-facing file delivery. It cannot ship as a
  recipe today: the app has no way to accept a pre-set or pre-hashed admin
  credential (admin creation only happens via an unauthenticated
  first-visit web wizard), and the one available gating mechanism,
  whole-domain Traefik basic_auth, would permanently block the external
  clients the app is built to serve, not just the setup window. Recommend
  `blocked_on_platform`: revisit if a path-scoped or setup-only basic_auth
  gate becomes available (protecting the install wizard and admin login
  without also gating client/public-download paths), or if ProjectSend
  adds an env-var/CLI path to provision the admin account non-interactively.
