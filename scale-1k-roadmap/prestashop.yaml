slug: prestashop
name: PrestaShop
source_description: "Open-source e-commerce platform for creating and managing online stores"

upstream:
  url: https://www.prestashop-project.org
  repo_url: https://github.com/PrestaShop/PrestaShop
  license: OSL-3.0 (core), AFL-3.0 (bundled modules/themes)
  docker_image: prestashop/prestashop
  compose_file_url: https://github.com/PrestaShop/PrestaShop/blob/develop/docker-compose.yml
  compose_file_notes: >
    Official — lives at the root of the PrestaShop/PrestaShop repo itself
    (not a third party). It's a rolling reference to the `develop` branch,
    not version-pinned to a tag/release. It is a source-build/dev-environment
    variant, not a "run the published prestashop/prestashop image" variant:
    it builds the app container from the repo's own `.docker/Dockerfile`
    and bind-mounts the working tree into `/var/www/html`, rather than
    pulling the published `prestashop/prestashop` Docker Hub image referenced
    above. It pairs MySQL 8.4 (a `docker-compose.mariadb.yml` sibling swaps
    in MariaDB) with a MailDev container for local email capture, and
    supports the same PS_INSTALL_AUTO/ADMIN_PASSWD env vars discussed under
    installability. Picked the MySQL variant over the MariaDB sibling only
    because MySQL is the compose file without a qualifier in its name
    (docker-compose.yml vs docker-compose.mariadb.yml); no other significance
    to that choice for this record.

version_health:
  latest_version: "9.1.4"
  latest_release_date: "2026-06-04"
  release_cadence: active
  eol_status: active
  notes: >
    Confirmed via the GitHub releases page, not training-data recall. As of
    today 2026-08-05: latest stable is 9.1.4 (2026-06-04, released alongside
    a matching 8.2.7 maintenance release on the older 8.2.x line), and a
    9.2.0-beta.1 followed on 2026-07-22 — about 2 weeks ago — with 9.2
    reportedly in feature-freeze per PrestaShop's own build blog. The 9.1.x
    line has shipped 5 releases since March 2026 (9.1.0 → 9.1.1 → 9.1.2 →
    9.1.3 → 9.1.4), with 8.2.x receiving matching security/maintenance
    releases the same days (8.2.5, 8.2.6, 8.2.7) — the same dual-branch
    support pattern seen in other actively maintained candidates. No
    dormancy signal.

catalogue_fit:
  categories: [ecommerce, business]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    No recipe in the current 24-app catalogue covers e-commerce/online
    storefronts — closest neighbors (gitea, opengist, portainer, n8n) are
    dev-tooling/ops, not customer-facing storefronts. PrestaShop (PHP/Symfony,
    MySQL-backed, one of the most widely deployed self-hosted e-commerce
    platforms globally) would be a genuinely new category. Note:
    `apps-gaps/bagisto.yaml` already analyzed a competing self-hosted
    e-commerce candidate (Laravel-based) and found it blocked_on_platform
    for a different reason (no admin-credential override at all) — the two
    are not mutually exclusive per the "overlapping apps are fine"
    convention, so `overlaps_with` is left empty rather than pointing at
    bagisto.
  usefulness: high
  usefulness_rationale: >
    Fills a real category gap (self-hosted online store) with an upstream
    that has by far the largest install base and community of any
    self-hosted e-commerce project. Usefulness is high on fit grounds; see
    installability below for why it can't ship as-is today.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [ADMIN_PASSWD, DB_PASSWD]
  secrets_expressible_today:
    - secret: DB_PASSWD
      mechanism: server_generated_no_customer_input
  blocking_issues:
    - >
      The official prestashop/prestashop image's automated-install path
      (PS_INSTALL_AUTO=1) only accepts the back-office admin password as a
      plaintext value via the ADMIN_MAIL/ADMIN_PASSWD env vars (confirmed
      against PrestaShop's own Docker devdocs page); the install script
      hashes it internally (PrestaShop has used bcrypt for
      employee/admin passwords since 1.7). There is no documented CLI flag,
      env var, or install option to inject an already-hashed value instead
      — no channel reachable by `generated_from`, which only ever carries a
      hash of the customer's root password, never the plaintext. This is
      the genuine-plaintext-requirement case called out in SCHEMA.md as a
      structural blocker (distinct from "app only supports an unsupported
      hash algorithm", which would just be `blocked_on_platform` pending
      algorithm support).
    - >
      Traefik basic_auth is not a viable substitute either, for the same
      reason `apps-gaps/bagisto.yaml` found with the competing Bagisto
      candidate: PrestaShop serves the public storefront (/) and the
      back-office admin login (a configurable but still same-port,
      same-domain path, default /admin-dev) out of one container on one
      port. Gating the whole domain behind basic_auth to protect the
      back-office login would also lock out every storefront visitor,
      defeating the purpose of an e-commerce recipe. There is no
      path-scoped basic_auth mechanism in the current platform to gate only
      the admin path while leaving the storefront open.
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  PrestaShop is upstream-healthy (active dual-branch releases, latest stable
  9.1.4 from 2026-06-04, a 9.2 beta already out) and would fill a genuine
  category gap — no existing recipe covers self-hosted e-commerce. It fails
  installability today for the same class of reason as the competing
  Bagisto candidate: the only mechanism available for a customer-facing
  admin credential (Traefik basic_auth on the whole port) would also block
  the public storefront, since both share one container and port. Unlike
  Bagisto, PrestaShop does support setting the admin password via env var
  at install time (ADMIN_PASSWD) — but only as plaintext, hashed internally
  by the install script, with no way to feed in a pre-hashed value the way
  `generated_from` produces. Recommend `blocked_on_platform`: revisit once
  either a path-scoped basic_auth capability exists (gate /admin-dev only)
  or PrestaShop's install path gains a way to accept a pre-hashed admin
  password.
