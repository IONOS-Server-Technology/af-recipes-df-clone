slug: ddns-updater
name: DDNS Updater
source_description: "Self-hosted dynamic DNS updater for 40+ providers, runs as headless agent"

upstream:
  url: https://github.com/qdm12/ddns-updater
  repo_url: https://github.com/qdm12/ddns-updater
  license: MIT
  docker_image: ghcr.io/qdm12/ddns-updater:v2.10.0

version_health:
  latest_version: "v2.10.0"
  latest_release_date: "2026-05-01"
  release_cadence: slowing
  eol_status: active
  notes: >
    Latest tagged release v2.10.0 shipped 2026-05-01 (also mirrored as
    qmcgaw/ddns-updater:v2.10.0 on Docker Hub), about 3 months before this
    analysis (2026-08-05). Tagged-release cadence is uneven: v2.9.0 landed
    2024-12-24, then a ~17-month gap before v2.9.1/v2.10.0 both shipped
    2026-05-01. However the `latest` image tag on Docker Hub was pushed
    ~23 hours before this analysis, meaning master is still built and
    published continuously between tagged releases — so the project reads
    as under active, if irregular, maintenance rather than dormant. No
    archived flag, no deprecation notice.

catalogue_fit:
  categories: [networking, infrastructure]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Pi-hole and AdGuard Home (already in the catalogue) are DNS
    resolvers/ad-blockers for traffic leaving a customer's network — a
    different job from DDNS Updater, which periodically checks the
    server's public IP and pushes A/AAAA record updates to an external DNS
    provider (Cloudflare, GoDaddy, Route53, etc.) so a *changing* IP stays
    reachable at a fixed hostname. No existing recipe covers that.
  usefulness: low
  usefulness_rationale: >
    DDNS Updater's core use case is keeping a hostname pointed at a
    residential/home-lab server behind a dynamic IP. AF customers run on
    IONOS cloud infrastructure with a static IP and a domain the platform
    itself already provisions and resolves (<slug>.<base_domain>) — the
    problem this app solves largely doesn't exist in that context. It would
    mainly appeal to a customer additionally running services on a home
    network they want an AF-hosted watcher for, a narrow secondary use case.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot:
    - "Per-DNS-provider API credentials (e.g. Cloudflare API token, GoDaddy key/secret, Route53 IAM keys) configured in config.json/CONFIG"
    - "Traefik basic-auth gate credential (app ships no login of its own)"
  secrets_expressible_today:
    - secret: "Traefik basic-auth gate credential (app ships no login of its own)"
      mechanism: traefik_basic_auth
  blocking_issues:
    - "Core function is entirely dependent on a customer-supplied, third-party DNS provider API credential (different per provider, e.g. Cloudflare token vs GoDaddy key+secret) passed via config.json or the CONFIG env var. This is an external API key with no current /compose input channel — not expressible via generated_from (which only projects a hash of the customer's root password) or via any other mechanism today. Without it the app cannot perform its one job at all, so this isn't a gate-the-UI problem like Adminer/Dashy — the whole recipe is non-functional without a channel for this secret."
  installable_today: false
  recommendation: not_recommended

summary: >
  DDNS Updater is a small, actively-built, MIT-licensed single-container app
  with an official multi-arch image and a lightweight web UI on one HTTP
  port (8000, plus a 9999 health port), so it would be mechanically
  reverse-proxy-compatible. It fails installability for a more fundamental
  reason than most gated apps, though: its entire function depends on a
  customer-supplied DNS provider API credential that our current /compose
  mechanism has no channel to receive — gating the web UI behind Traefik
  basic_auth (as we do for Dashy/Adminer) would still leave the app unable
  to update anything. Combined with a use case (dynamic-IP home servers)
  that doesn't map well onto AF's static-IP cloud hosting model, this is a
  `not_recommended` rather than a `blocked_on_platform` — even a future
  arbitrary-secret input channel wouldn't make this a compelling recipe for
  our customer base.
