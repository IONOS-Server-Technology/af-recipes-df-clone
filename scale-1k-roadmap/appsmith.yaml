slug: appsmith
name: Appsmith
source_description: Open-source low-code platform for building internal tools and applications

upstream:
  url: https://www.appsmith.com/
  repo_url: https://github.com/appsmithorg/appsmith
  license: Apache-2.0
  docker_image: appsmith/appsmith-ce:v2.2

version_health:
  latest_version: v2.2
  latest_release_date: 2025-07-09
  release_cadence: slowing
  eol_status: active
  notes: >
    No new GitHub semver release has been tagged since v2.2 (2025-07-09) —
    about 13 months as of 2026-08-05, versus a roughly monthly cadence for
    v2.0/v2.1/v2.2 in the months before that. However the project ships
    continuously via a rolling `release` Docker tag that was rebuilt within
    the last 9 hours at time of research and carries 2026-dated CVE fixes
    (handlebars, joi, spring-security, postgresql-jdbc, netty). Repo has
    40.6k stars, no archive notice, and active issue/commit traffic. Read
    as "engineering is active, semver tagging has stalled" rather than a
    dormant or abandoned project — do not read the 13-month tag gap alone
    as an EOL signal.

catalogue_fit:
  categories: [low-code, developer-tools, internal-tools]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    None of the current 24 recipes cover low-code/no-code app building or
    internal-admin-panel construction. n8n is the closest existing recipe
    (also "low-code", also needs an admin identity at setup) but n8n
    automates workflows between existing services, while Appsmith builds
    custom CRUD UIs/dashboards over 25+ databases and APIs — a distinct use
    case a customer would reach for separately.
  usefulness: medium
  usefulness_rationale: >
    Real demand exists for self-hosted internal-tool builders, but the
    all-in-one container's ~8GB RAM footprint (bundles Mongo, Redis and
    Postgres inside the app image) is heavy relative to most of the
    catalogue and raises the effective hosting-plan floor for this recipe.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot:
    - traefik basic-auth gate credential (prevents an anonymous visitor from
      winning the race to sign up before the customer and claiming the
      workspace)
  secrets_expressible_today:
    - secret: traefik basic-auth gate credential
      mechanism: traefik_basic_auth
  blocking_issues:
    - "Appsmith has no env var to preset an admin password at boot — the
      account (email + password) is always created interactively through
      the app's own web signup form, so generated_from projection has no
      field to target."
    - "Instance Administrator rights are not granted to the first signed-up
      user automatically (see appsmithorg/appsmith#36699) — they require
      APPSMITH_ADMIN_EMAILS to name the customer's email at boot. That is an
      arbitrary customer-supplied value with no input channel in the
      current /compose mechanism, so the customer would sign up as a
      workspace user but never reach the instance-wide Admin Settings panel
      through our provisioning flow alone."
  installable_today: true
  recommendation: build_with_caveats

summary: >
  Appsmith is mechanically installable today as a single-container
  docker-compose recipe behind Traefik basic_auth (closing the open-signup
  race; internal Mongo/Redis/Postgres passwords are all server-generated,
  no customer input needed). It fills a genuine gap versus the current
  24-recipe catalogue. The catch: without a channel for the customer's
  admin email, they get a normal signed-up user, not an Instance
  Administrator, inside their own instance — workable for solo use but a
  real caveat worth calling out in the recipe README. Combined with the
  ~8GB RAM floor and a release-tagging cadence that has stalled for over a
  year (even though upstream engineering is still active), this is a
  build-with-caveats candidate rather than an immediate build_now.
