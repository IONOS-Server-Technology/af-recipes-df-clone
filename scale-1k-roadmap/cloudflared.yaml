slug: cloudflared
name: Cloudflared
source_description: "Cloudflare Tunnel daemon for secure remote access without opening ports"

upstream:
  url: https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/
  repo_url: https://github.com/cloudflare/cloudflared
  license: Apache-2.0
  docker_image: cloudflare/cloudflared:2026.7.3

version_health:
  latest_version: "2026.7.3"
  latest_release_date: "2026-07-23"
  release_cadence: active
  eol_status: active
  notes: >
    Cloudflare cuts a new dated release roughly monthly (2026.2.0, 2026.3.0,
    2026.5.0/2026.5.1, 2026.6.0/2026.6.1, 2026.7.3). Latest release is 13 days
    before today (2026-08-05). This is an actively maintained, first-party
    Cloudflare product with no signs of slowing.

catalogue_fit:
  categories: [networking, security]
  has_web_ui: false
  reverse_proxy_compatible: false
  overlaps_with: []
  differentiation: >
    Nothing in the current 24 recipes does this: cloudflared makes only
    outbound connections from the customer's server to Cloudflare's edge and
    exposes no inbound port at all — it's the inverse of our Traefik/domain
    model, not a variant of it. wg-easy is the closest thing we have to
    "secure remote access," but wg-easy is a self-contained VPN server we
    fully control, whereas cloudflared's routing, DNS, and access policy all
    live in the customer's own Cloudflare account and dashboard.
  usefulness: low
  usefulness_rationale: >
    The pitch (expose a local service without opening firewall ports) is
    genuinely useful, but it only works if the customer already has a domain
    on Cloudflare's nameservers and creates a tunnel + token themselves in
    their Cloudflare Zero Trust dashboard first. That's a heavier prerequisite
    than any app we currently ship, and the app itself has no UI, no login,
    and nothing for our own domain/Traefik machinery to front.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [TUNNEL_TOKEN]
  secrets_expressible_today: []
  blocking_issues:
    - "cloudflared needs a TUNNEL_TOKEN generated by Cloudflare when the customer creates a tunnel in their own Cloudflare Zero Trust dashboard. This is an external, per-customer, arbitrary credential with no projection mechanism — it is not a hash of the root password and there is no login screen to gate with Traefik basic_auth."
    - "The app has no web UI and, in the standard remotely-managed-tunnel setup, publishes no inbound port at all — there is nothing for our Traefik/domain layer to front, so even the mechanically simplest secret channel (basic_auth gate on the app's own port) does not apply here."
    - "Name is unambiguous: 'cloudflared' refers only to Cloudflare's own tunnel-connector binary/image (cloudflare/cloudflared); no other project shares the name."
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  Cloudflared is an actively maintained, monthly-release first-party
  Cloudflare product, so there's no version-health concern. But it cannot
  ship as a recipe under the current mechanism: first boot requires a
  TUNNEL_TOKEN the customer generates in their own Cloudflare account, which
  is exactly the kind of external, arbitrary credential neither
  generated_from root-password projection nor Traefik basic_auth can carry.
  It also has no web UI and, in its normal configuration, no inbound port to
  put behind our domain/Traefik model at all, making it a poor structural fit
  even setting the secret problem aside. Blocked on a real external-token
  input channel, not just IF-1420/IF-1312.
