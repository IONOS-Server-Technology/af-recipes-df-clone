slug: notediscovery
name: NoteDiscovery
source_description: "Self-hosted markdown knowledge base with graph view and AI integration"

upstream:
  url: https://www.notediscovery.com/
  repo_url: https://github.com/gamosoft/NoteDiscovery
  license: MIT
  docker_image: ghcr.io/gamosoft/notediscovery
  compose_file_url: https://raw.githubusercontent.com/gamosoft/NoteDiscovery/main/docker-compose.ghcr.yml
  compose_file_notes: >
    Rolling reference to the default (main) branch, not version-pinned to
    a release tag. The repo ships three compose files at its root:
    docker-compose.ghcr.yml (pulls the pre-built ghcr.io image, README
    calls this the "Recommended" option for deployment), docker-compose.yml
    (builds from local source, for development), and
    docker-compose.ollama-stack.yml (bundles NoteDiscovery with Ollama +
    Open WebUI). Picked docker-compose.ghcr.yml since it matches our
    docker_image above and is the project's own recommended production
    path; no GitHub release-asset link is published, so this raw
    repo-file link is the most direct official source.

version_health:
  latest_version: v0.30.1
  latest_release_date: 2026-08-04
  release_cadence: active
  eol_status: active
  notes: >
    Releases roughly every few days to two weeks over the last two months
    (v0.27.3 on 2026-06-29 through v0.30.1 on 2026-08-04, 10 releases in
    ~5 weeks). Latest release is 1 day before today (2026-08-05). 2.7k
    GitHub stars, 230 forks, only 1 open issue — clearly active, not
    maintenance-only.

catalogue_fit:
  categories: [productivity, knowledge-base]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: [anytype-server]
  differentiation: >
    anytype-server in our catalogue is a sync backend only (three raw
    non-HTTP ports for any-sync-coordinator/filenode/node) — the actual
    AnyType notes UI lives in a separate client app the customer runs
    locally, not on the server. NoteDiscovery is the opposite shape: a
    single container that serves its own full web UI directly, works
    behind Traefik on one HTTP port, needs no companion client, and stores
    notes as plain Markdown files (importable/exportable, no proprietary
    sync protocol). It also ships an MCP server for AI-assistant
    integration, which nothing else in the catalogue offers for notes.
  usefulness: high
  usefulness_rationale: >
    Fills a real gap — an Obsidian/Notion-style self-hosted markdown KB
    with graph view, reachable entirely through a browser, is not
    something any of the 24 current recipes provide. Single container, no
    database, low resource floor.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [access-gate credential]
  secrets_expressible_today:
    - secret: access-gate credential
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Actively maintained (releases every few days, 2.7k stars), MIT-licensed,
  single-container app with no database dependency and a real, unique
  differentiator (browser-based markdown KB with graph view + MCP/AI
  integration) versus the sync-backend-only anytype-server already in the
  catalogue. NoteDiscovery's own login (AUTHENTICATION_ENABLED / _PASSWORD)
  only accepts a plaintext password via env var (hashed internally at
  startup) with no way to inject a pre-computed hash, so it can't use
  generated_from projection directly — but the app's auth can simply be
  left disabled and the whole thing gated behind Traefik basic_auth
  instead, the same pattern used for n8n/Vaultwarden/Open WebUI. That makes
  it installable under the current mechanism with no platform blockers.
  Recommend building this recipe now.
