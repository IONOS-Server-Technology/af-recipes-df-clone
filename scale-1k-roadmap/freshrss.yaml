slug: freshrss
name: FreshRSS
source_description: "Self-hosted RSS feed aggregator for managing and reading your feeds"

upstream:
  url: https://freshrss.org/
  repo_url: https://github.com/FreshRSS/FreshRSS
  license: AGPL-3.0
  docker_image: freshrss/freshrss
  compose_file_url: https://raw.githubusercontent.com/FreshRSS/FreshRSS/edge/Docker/freshrss/docker-compose.yml
  compose_file_notes: >
    Official file, published by the project itself under Docker/freshrss/ in
    its own repo (documented in Docker/README.md's "Docker Compose"
    section). This link is a rolling reference to the default branch
    (`edge`, which is also this project's default/rolling-release branch,
    not a stable tag), so it tracks whatever the base compose currently
    looks like rather than a pinned release. Picked the base
    docker-compose.yml (SQLite backend, no separate DB container, no
    published port by default) over the sibling overlay files in the same
    directory that the project composes on top of it via `docker compose
    -f`: docker-compose-local.yml (adds a published port for local/dev use),
    docker-compose-proxy.yml (adds Traefik + Let's Encrypt), and
    docker-compose-db.yml (adds a PostgreSQL container instead of the
    default SQLite) — the base file matches the single-container,
    default-SQLite installability assessment already in this file.

version_health:
  latest_version: "1.29.1"
  latest_release_date: "2026-05-20"
  release_cadence: active
  eol_status: active
  notes: >
    Regular releases roughly every 2-3 months over the past year: 1.26.1
    (2025-03-13), 1.26.2 (2025-05-03), 1.26.3 (2025-06-02), 1.27.0
    (2025-08-18), 1.27.1 (2025-09-27), 1.28.0 (2025-12-24), 1.28.1
    (2026-01-25), 1.29.0 (2026-05-10), 1.29.1 (2026-05-20). About 2.5
    months since the last release as of 2026-08-05, well within the
    established cadence. Repo is not archived, actively maintained.

catalogue_fit:
  categories: [productivity, media]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24 recipes covers RSS/Atom feed aggregation and
    reading. FreshRSS gives customers a self-hosted alternative to
    Feedly/Inoreader with a mobile-client API (Fever/Google Reader
    compatible), multi-user support, and OPML import/export.
  usefulness: medium
  usefulness_rationale: >
    RSS readers are a smaller niche than the automation/monitoring/media
    tools already in the catalogue, but FreshRSS is a well-known,
    lightweight, low-resource app with broad appeal to anyone tracking
    blogs/news feeds, and it needs no external services to be useful.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  FreshRSS is a single-container (with the default SQLite backend, no
  separate DB container needed), single-HTTP-port web app with a
  browser-based first-run installer: the customer visits the URL and
  creates their own admin account/password directly through FreshRSS's own
  setup wizard, the same pattern already used by the n8n recipe. No
  platform-supplied secret (root-password projection or basic_auth gate)
  is required at first boot, since the admin credential is never something
  af-api needs to provision. The project is actively maintained with a
  consistent release cadence and no overlap with the existing catalogue.
  Recommend building the recipe now.
