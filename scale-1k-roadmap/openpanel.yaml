slug: openpanel
name: OpenPanel
source_description: "Privacy-first product analytics with real-time dashboards and session replay"

upstream:
  url: https://openpanel.dev
  repo_url: https://github.com/Openpanel-dev/openpanel
  license: AGPL-3.0
  docker_image: lindesvard/openpanel-api:2 (+ lindesvard/openpanel-dashboard:2, lindesvard/openpanel-worker:2)

version_health:
  latest_version: "2.0.0"
  latest_release_date: null
  release_cadence: active
  eol_status: active
  notes: >
    No GitHub Releases are published for this repo (releases page is empty),
    so version tracking has to go through the in-docs self-hosting changelog
    (2.0.0 is the newest entry there, following 1.2.0 and 1.1.1) and raw
    commit history instead of tags. Main branch had multiple commits as
    recently as 2026-07-06 ("feat: bot detection", billing/logging fixes),
    about one month before today (2026-08-05) — clearly active, not
    dormant. Docker Hub images are tagged only with the floating major
    version `2`, not a pinned patch/date tag, so there is no way to pin to
    an exact upstream build the way we normally would (e.g. `2.4.1`); this
    is an upstream release-hygiene gap, not an activity concern.

catalogue_fit:
  categories: [analytics, monitoring, developer-tools]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    None of the current 24 recipes cover product/web analytics (event
    tracking, funnels, session replay, real-time dashboards). OpenPanel
    would be a genuinely new category for the catalogue — a privacy-first,
    cookieless alternative to Mixpanel/Google Analytics that customers can
    point their own sites/apps at instead of a third-party SaaS tracker.
  usefulness: high
  usefulness_rationale: >
    Product analytics is a common self-hosting want (data ownership, GDPR),
    and OpenPanel is one of the more actively developed open-source options
    in that space. It fills a real gap rather than competing with anything
    we already ship.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot:
    - basic_auth gate credential (front-door protection until the customer completes first-run signup)
  secrets_expressible_today:
    - secret: basic_auth gate credential
      mechanism: traefik_basic_auth
  blocking_issues:
    - >
      OpenPanel has no env-var/API path to pre-seed the initial admin
      account. Per its own self-hosting docs, "the first user to register
      becomes the admin" and registration is auto-disabled after that —
      there is no `ADMIN_EMAIL`/`ADMIN_PASSWORD`-style seed variable
      documented anywhere (env var reference only covers infra: DATABASE_URL,
      REDIS_URL, CLICKHOUSE_URL, COOKIE_SECRET, ALLOW_REGISTRATION, etc). This
      means the app cannot be pre-provisioned with a customer login the way
      `generated_from: "<algo>:ROOT_PASSWORD"` normally handles it — the
      customer has to do an interactive signup themselves after the domain
      is up. That in itself is not a hard blocker (the customer choosing
      their own arbitrary in-app credential through the UI is fine, same
      as any first-run wizard), but it does create a race: whoever reaches
      the public domain first and submits the registration form becomes the
      permanent admin. The mitigation is the same pattern already used for
      n8n/WUD/Open WebUI — front the whole app with a Traefik `basic_auth`
      gate (projected from the root-password hash) so no outsider can reach
      the registration form before the customer does. With that gate in
      place, installability is otherwise unblocked.
    - >
      Upstream Docker images are tagged only with the floating major
      version `2` (lindesvard/openpanel-api:2, -dashboard:2, -worker:2), not
      a pinned patch/date tag — a recipe would need to either accept that
      floating tag (against our usual pin-a-stable-tag practice) or track
      a `sha256` digest instead, since no more specific tag exists on Docker
      Hub for this image today.
    - >
      5-service stack (Postgres + Redis + ClickHouse + api + dashboard +
      worker, bundled Caddy dropped in favor of our Traefik) is heavier than
      most of our current single/two-container recipes — closer in shape to
      `recipes/immich/` than to `recipes/uptime-kuma/`. Not a blocker, just a
      sizing/RAM note for `app_min_ram_mb`.
  installable_today: true
  recommendation: build_with_caveats

summary: >
  OpenPanel is an actively developed, AGPL-3.0 privacy-first product
  analytics platform with a real web UI, filling a category the current
  24-recipe catalogue has no coverage of at all. It is installable today by
  gating the whole app behind Traefik basic_auth (root-password-derived) to
  close the "first registrant becomes admin" race, since OpenPanel itself
  has no way to pre-seed an admin account via env vars. The main caveats are
  a 5-service footprint (Postgres/Redis/ClickHouse/api/dashboard/worker) and
  upstream only publishing a floating `:2` image tag rather than a pinned
  version — worth a `build_with_caveats` recipe pass rather than treating it
  as blocked.
