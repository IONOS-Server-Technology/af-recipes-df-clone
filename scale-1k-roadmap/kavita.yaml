slug: kavita
name: Kavita
source_description: "Self-hosted digital library for comics, manga, and ebooks"

upstream:
  url: https://www.kavitareader.com/
  repo_url: https://github.com/Kareadita/Kavita
  license: GPL-3.0
  docker_image: jvmilazz0/kavita

version_health:
  latest_version: "v0.9.0.2"
  latest_release_date: "2026-05-12"
  release_cadence: active
  eol_status: active
  notes: >
    Latest tagged release (v0.9.0.2, a security hotfix) shipped 2026-05-12
    — about 2 months 24 days before today (2026-08-05). Prior releases show
    a steady ~3-3.5 month cadence for minor versions with quick patch
    releases right after (v0.8.6 2025-04-14 → v0.8.7 2025-07-05 → v0.8.8
    2025-10-20 → v0.8.9 2026-01-14 → v0.9.0 2026-04-30 → v0.9.0.2
    2026-05-12). The official jvmilazz0/kavita Docker image also ships a
    `nightly` channel that was rebuilt as recently as 2 days before today,
    so upstream development is continuous even between numbered releases.
    Not archived (11.4k stars, 156 open issues, no archive banner), no EOL
    announcement.

catalogue_fit:
  categories: [media, ebooks, comics, self-hosting]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue manages a comics/manga/
    ebook library. Immich is the closest recipe by shape (self-hosted
    personal media library with a browser UI and mobile-app ecosystem)
    but only handles photos/videos, not reading material. Note there is
    an existing (not-yet-built) gap-analysis candidate for Calibre-Web
    (apps-gaps/calibre-web.yaml) that covers very similar ground — ebook
    library management with an OPDS feed — so if both were ever built,
    Kavita (comics/manga-first, richer reader UI, active dev) and
    Calibre-Web (Calibre-metadata-driven ebook management, slowing release
    cadence) would need clear differentiation in the catalogue rather than
    shipping both as near-duplicates.
  usefulness: high
  usefulness_rationale: >
    Kavita is one of the most popular self-hosted comics/manga/ebook
    readers (11.4k GitHub stars, active development, dedicated mobile
    apps), fills a media niche with no current catalogue coverage, and
    would appeal to a distinct hobbyist audience from the monitoring/
    automation/security tools already in the catalogue.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Kavita is a single-container app (official image jvmilazz0/kavita, one
  HTTP port — 5000 internally) with a bundled database and no external
  service dependency, structurally closest to recipes/uptime-kuma or
  recipes/vaultwarden (single container, persistent config/library
  volumes, no Postgres needed). It ships no default admin credential at
  all: the first visitor to the web UI is presented with a registration
  wizard where they set their own admin username, email, and password
  directly in the app — the same "first visitor claims the root account"
  pattern already accepted unmitigated for n8n, Open WebUI, and (per its
  own gap analysis) Audiobookshelf. That means no `generated_from`
  projection or Traefik `basic_auth` gate is required to reach a working
  install; the recipe needs only a domain parameter. Upstream is actively
  maintained (releases roughly every 3 months, nightly Docker builds
  updated within the last 2 days, not archived). No functional overlap
  with the existing 24 recipes, real and well-documented customer demand,
  and installable under the current `/compose` mechanism with zero
  blocking issues — recommend building this now.
