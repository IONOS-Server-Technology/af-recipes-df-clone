slug: phpipam
name: phpIPAM
source_description: "Self-hosted IP address management for subnet tracking and network discovery"

upstream:
  url: https://phpipam.net/
  repo_url: https://github.com/phpipam/phpipam
  license: GPL-3.0
  docker_image: phpipam/phpipam-www
  compose_file_url: null
  compose_file_notes: >
    No official compose file exists. The phpipam/phpipam project's own
    README states plainly: "Community maintained docker images are
    available at https://hub.docker.com/u/phpipam" — the project
    maintainers explicitly disclaim the Docker packaging, including the
    phpipam/phpipam-www image this recipe is built on, as community work
    rather than an official deliverable. That image is built from a
    separate, unaffiliated repo (github.com/phpipam-docker/phpipam-docker,
    formerly known under a different maintainer handle), whose own README
    confirms it is not officially affiliated with phpipam/phpipam and
    points app-level issues back to the upstream repo. Even that
    community repo ships no discrete docker-compose.yml/.yaml file in its
    tree — its README only embeds two inline compose examples (full stack
    with bundled MariaDB, vs. connecting to an external MySQL server) as
    documentation text, not a file the project publishes or versions.
    With no official source and no single file to link (inline-only,
    two variants, no repo path or release asset), compose_file_url is
    null.

version_health:
  latest_version: "v1.8.1"
  latest_release_date: "2026-04-27"
  release_cadence: active
  eol_status: active
  notes: >
    v1.8.1 was released upstream 2026-04-27 (per the GitHub releases
    feed), about 3.5 months before today (2026-08-05) — not the
    2026-07-03 date a Docker Hub tag rebuild timestamp would suggest;
    that date is a rebuild/push of the existing v1.8.1 image, not a new
    software release, and is kept below as a separate signal. Release
    history shows a long quiet stretch (v1.7.0 2024-10-30 -> v1.7.4
    2025-11-27, over a year with only backport patches) followed by a
    clear pickup in 2026: v1.8.0 on 2026-04-21 and v1.8.1 on 2026-04-27.
    Separately, Docker Hub shows the v1.8.1 tag rebuilt 2026-07-03 and
    `nightly`/`xhprof` dev tags rebuilt 2026-08-04, one day before this
    analysis — confirming CI/base-image infra is currently active, even
    though no new version has shipped since April. Treated as `active`
    on the strength of the 2026 release pickup and live build activity,
    despite the ~3.5-month gap since the last actual release.

catalogue_fit:
  categories: [networking, it-operations]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    No recipe in the current 24-recipe catalogue covers IP address
    management. A separate gap analysis for NetBox (apps-gaps/netbox.yaml)
    targets the same IPAM niche with a heavier DCIM/network-documentation
    tool; that file is blocked_on_platform today. phpIPAM is the
    lighter-weight, IPAM-only alternative in the same slot: a single
    PHP/Apache app plus MariaDB versus NetBox's Django/PostgreSQL stack.
    phpIPAM does have a Racks module (rack creation, rack diagram view,
    device-to-rack placement, subracks, with active 2026 work per the
    v1.8.0 changelog), but it is lighter and less comprehensive than
    NetBox's full DCIM feature set — phpIPAM stays primarily an IPAM tool
    with rack modeling as a secondary feature, not a DCIM-first platform.
    Shipping both would be redundant; phpIPAM is
    arguably the better first pick for this niche since — see
    installability below — it is not structurally blocked the way NetBox
    is.
  usefulness: medium
  usefulness_rationale: >
    Real, recurring need among technical customers/MSPs managing their own
    network address space (subnet tracking, VLANs, DNS/DHCP audit trail),
    but it's a specialist admin tool rather than a broad-appeal app —
    narrower audience than most of the catalogue, similar in kind to
    NetBox or Guacamole.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [basic_auth_password, IPAM_DATABASE_PASS]
  secrets_expressible_today:
    - secret: basic_auth_password
      mechanism: traefik_basic_auth
    - secret: IPAM_DATABASE_PASS
      mechanism: server_generated_no_customer_input
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  phpIPAM (official image phpipam/phpipam-www, pin e.g. v1.8.1) ships no
  admin account and no env-var/CLI channel to seed one — first boot
  presents its own unauthenticated, multi-step web installer (choose
  "New phpipam installation", let it create the DB schema, then define
  the admin password directly into the app's own form). Unlike NetBox,
  where the container refuses to create any login without a plaintext
  SUPERUSER_PASSWORD env var and there is no self-service alternative,
  phpIPAM's installer *is* the vendor-documented, built-in way a customer
  provisions their own admin account — nothing needs to flow through
  af-api/`/compose` for it. The only real gap is that this installer page
  is open to anyone who reaches the domain before the customer completes
  it, so the whole app must sit behind a mandatory Traefik `basic_auth`
  gate (credential projected from the customer's root password via
  `generated_from`) until setup is done — the same "no login of its own
  yet" pattern used for Adminer/n8n/WUD. The MariaDB password is a
  server-generated secret nothing customer-facing reads. Notable
  follow-on details, none of which block installability: (1) the customer
  must manually click through phpIPAM's installer once after deploy; (2)
  the web and cron containers both request NET_ADMIN/NET_RAW capabilities
  for ping/SNMP discovery; (3) upstream recommends setting
  IPAM_DISABLE_INSTALLER after setup completes, which is a customer
  follow-up step rather than something install.sh can do before the
  wizard has run. All required secrets are expressible today via existing
  mechanisms and there are no blocking issues, so this is build_now.
