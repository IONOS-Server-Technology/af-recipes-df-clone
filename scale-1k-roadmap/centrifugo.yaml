slug: centrifugo
name: Centrifugo
source_description: "Centrifugo is a scalable real-time messaging server for building live applications"

upstream:
  url: https://centrifugal.dev/
  repo_url: https://github.com/centrifugal/centrifugo
  license: Apache-2.0
  docker_image: centrifugo/centrifugo (Docker Hub; latest numbered tag v6.9.1)

version_health:
  latest_version: "v6.9.1"
  latest_release_date: "2026-07-13"
  release_cadence: active
  eol_status: active
  notes: >
    v6.9.1 released 2026-07-13 (~3 weeks before this analysis, 2026-08-05),
    preceded by v6.9.0 (2026-07-07), v6.8.4 (2026-06-30), v6.8.3
    (2026-06-16), v6.8.2 (2026-06-08), v6.8.1 (2026-05-27), v6.8.0
    (2026-05-22) — a release roughly every 1-2 weeks over the last several
    months. 10.6k GitHub stars, ~1,900 commits on master, active issue
    triage and CI. This is a fast-moving, clearly active project, not
    slowing or dormant.

catalogue_fit:
  categories: [developer-tools, real-time-messaging]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24 recipes offers a real-time pub/sub messaging
    backend (WebSocket, SSE, HTTP-streaming, WebTransport) for chat, live
    comments, multiplayer, or collaborative features. Like Cap, it is
    developer/backend infrastructure that a customer wires into their own
    separately-hosted application rather than a stand-alone consumer app —
    a genuinely new category for the catalogue, not an overlap with
    anything existing.
  usefulness: medium
  usefulness_rationale: >
    Valuable to a technical customer building a chat/live-update feature
    who wants a self-hosted alternative to Pusher/Ably/PubNub, but it's a
    narrow, integration-requiring tool rather than something usable on its
    own out of the box — the customer must still write client code against
    it. Audience is closer to Adminer/WUD/Cap than to a broad-appeal app
    like Vaultwarden or Immich.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [api_key, token_hmac_secret_key, admin_password, admin_secret]
  secrets_expressible_today:
    - secret: api_key
      mechanism: server_generated_no_customer_input
    - secret: token_hmac_secret_key
      mechanism: server_generated_no_customer_input
  blocking_issues:
    - >
      Centrifugo's optional admin web UI (`admin.enabled: true`) requires
      `admin_password` and `admin_secret`. Per upstream docs and forum
      threads, `admin_password` is compared as a plaintext string
      (constant-time compare, but not hashed) against whatever the
      customer types into the dashboard login form — there is no
      bcrypt/argon2 option. `generated_from` only ever projects a hash of
      the customer's root password, never plaintext, so it structurally
      cannot populate `admin_password`. This is the genuine
      "requires-the-plaintext" case SCHEMA.md calls a hard blocker, not a
      `generated_from`-algorithm gap.
    - >
      Unlike a pure single-purpose app, admin UI is optional here: the
      core pub/sub server (client WebSocket/HTTP connections, the
      customer's own integration) runs fine with `admin.enabled: false`,
      needing only `api_key` and `token_hmac_secret_key`, both of which are
      internal secrets the customer's app is configured with post-deploy
      (server-generated, never customer-supplied at boot). So — unlike
      Cap, where the blocked admin login and the always-on public function
      share one port and both are core to the product — Centrifugo's core
      function does not depend on the blocked admin login at all.
  installable_today: true
  recommendation: build_with_caveats

summary: >
  Centrifugo is an actively maintained (release ~3 weeks old as of
  2026-08-05, roughly biweekly cadence), single-port, reverse-proxy-friendly
  real-time messaging backend with no overlap in the current catalogue —
  it would fill a genuinely new category (pub/sub infrastructure for a
  customer's own app). Its optional admin web UI cannot ship today because
  `admin_password` is checked as plaintext with no hash option, which
  `generated_from` cannot project and which a whole-port Traefik
  `basic_auth` gate can't substitute for either (it would need to sit only
  in front of the admin path, not the client-facing API/WebSocket port).
  However, the admin UI is optional, not core to the product: with
  `admin.enabled: false` the recipe can ship as a headless pub/sub server
  using only server-generated `api_key`/`token_hmac_secret_key` (no
  customer-supplied secret needed at all), so it is installable today —
  just without the dashboard. Recommend `build_with_caveats`: ship
  headless, and revisit enabling the admin UI if `generated_from` ever
  supports the specific hash Centrifugo would need, or the platform gains
  path-scoped basic_auth.
