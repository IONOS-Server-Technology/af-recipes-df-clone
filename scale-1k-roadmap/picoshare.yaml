slug: picoshare
name: PicoShare
source_description: "Minimalist self-hosted file sharing with expiring links and no size limits"

upstream:
  url: https://github.com/mtlynch/picoshare
  repo_url: https://github.com/mtlynch/picoshare
  license: AGPL-3.0-or-later
  docker_image: mtlynch/picoshare
  compose_file_url: null
  compose_file_notes: >
    No docker-compose file exists anywhere in the repo (root,
    docker/, deploy/, and contrib/ all 404 on raw.githubusercontent.com
    for master). The README's "Using Docker Compose" section only embeds
    a docker-compose.yml snippet inline as text for the user to copy into
    a file themselves ("copy the following to a file called
    docker-compose.yml") — there is no file the project itself publishes
    or updates, so there is nothing to link to as an official
    compose_file_url.

version_health:
  latest_version: "v1.5.4"
  latest_release_date: "2026-05-26"
  release_cadence: active
  eol_status: active
  notes: >
    v1.5.4 released 2026-05-26, ~2.3 months before this analysis
    (2026-08-05). Releases have landed roughly every 1-3 months over the
    past year (1.5.0 2025-07-28, 1.5.1 2025-08-24, 1.5.2 2026-05-13, v1.5.3
    2026-05-25, v1.5.4 2026-05-26), and commit activity continues past the
    last tag (a docs commit merged 2026-07-14). Single maintainer
    (mtlynch) describes it as a hobby project, but it is not archived and
    is clearly still triaged and shipped.

catalogue_fit:
  categories: [file-sharing, productivity]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24 recipes covers ad-hoc file/link sharing.
    Syncthing does continuous multi-device folder sync, not one-off
    shareable download links with expiry; Immich/Paperless are media/doc
    archives, not general file drop tools. PicoShare fills a distinct
    "send someone a file with a link that expires" use case with no size
    or file-type restriction.
  usefulness: medium
  usefulness_rationale: >
    Handy, low-friction utility for anyone who wants a private
    WeTransfer/Firefox-Send alternative on their own domain. Single
    maintainer and modest feature set (no teams, no encryption at rest)
    keep it a niche/personal tool rather than a broad-appeal app.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [PS_SHARED_SECRET]
  secrets_expressible_today: []
  blocking_issues:
    - >
      PicoShare's admin login has no separate hashed-secret storage path.
      The server holds PS_SHARED_SECRET (or PS_SHARED_SECRET_FILE) and, on
      each login attempt, runs the SAME key-derivation function over both
      the stored value and the value the admin types in before comparing
      the derived keys
      (handlers/auth/shared_secret/shared_secret.go: StartSession()). That
      means whatever string is placed in PS_SHARED_SECRET must be the
      exact literal passphrase the customer types at login — functionally
      a plaintext requirement, not a hash PicoShare separately knows how
      to verify against (unlike Vaultwarden's ADMIN_TOKEN, which does
      accept a pre-hashed value). Our platform's only channel,
      `generated_from: "<algo>:ROOT_PASSWORD"`, projects a hash of the
      customer's root password, never the plaintext — so there is no way
      to hand the customer a passphrase they know and also satisfy
      PS_SHARED_SECRET's literal-match requirement. A Traefik
      basic_auth gate in front does not resolve this either: it would add
      a second, independent login, but the customer would still need the
      real (unknowable, since server-generated) PS_SHARED_SECRET to get
      past PicoShare's own admin screen and actually use the app (upload
      files, create share/guest links) — there's no anonymous-admin path.
      This is a structural requirement for a plaintext customer-known
      secret, not merely an unsupported hash algorithm, so it doesn't fit
      the "flag as blocked_on_platform with the algo named" carve-out in
      SCHEMA.md.
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  PicoShare is a small, actively maintained (releases every 1-3 months,
  latest v1.5.4 on 2026-05-26), reverse-proxy-friendly single-container app
  that would add a genuinely new "expiring file link" capability not
  covered by the existing 24 recipes. It is blocked today only because its
  admin login requires the literal passphrase the customer will type, and
  af-api's only secret-projection mechanism (`generated_from`) ever
  supplies a hash of the root password, never the plaintext. Revisit if
  the platform ever adds a plaintext-secret projection channel; until then
  this is not mechanically installable via the current recipe mechanism.
