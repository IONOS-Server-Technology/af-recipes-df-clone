slug: faraday
name: Faraday
source_description: "Open-source vulnerability management platform for security teams"

upstream:
  url: https://faradaysec.com/
  repo_url: https://github.com/infobyte/faraday
  license: GPL-3.0
  docker_image: faradaysec/faraday:5.23.0

version_health:
  latest_version: v5.23.0
  latest_release_date: 2026-07-23
  release_cadence: active
  eol_status: active
  notes: >
    Latest release (v5.23.0) was 13 days before today (2026-08-05). Release
    history shows a roughly monthly cadence over the past year (v5.22.0
    2026-06-19, v5.21.0 2026-05-14, v5.20.1 2026-05-08, v5.20.0 2026-04-10,
    v5.19.0 2026-01-26), with one ~2.5-month gap between v5.19.0 and
    v5.20.0. Repo has 14k+ commits and open PRs under active review by
    Infobyte. No signs of maintenance-only mode or archival.

catalogue_fit:
  categories: [security, vulnerability-management, pentesting]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    None of the current 24 recipes cover security/vulnerability-management
    tooling — Faraday would be the first. It aggregates and deduplicates
    findings from 80+ external scanners (Nessus, OpenVAS, Nmap, Burp,
    Nuclei, etc.) into one workspace, which is a genuinely distinct
    workload from the productivity/media/dev-tooling apps already in the
    catalogue.
  usefulness: medium
  usefulness_rationale: >
    High value for a narrow audience (security teams, MSSPs, pentesters)
    who already run external scanners and want a self-hosted aggregation
    layer; low relevance to the bulk of AF's general SMB/hobbyist customer
    base, so overall catalogue usefulness lands medium rather than high.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot:
    - basic_auth_gate
    - faraday_admin_password
  secrets_expressible_today:
    - secret: basic_auth_gate
      mechanism: traefik_basic_auth
  blocking_issues:
    - >
      Faraday has its own login (single "faraday" admin account) and does
      not accept a pre-computed password hash for it. The account is
      created by `faraday-manage initdb`, which either auto-generates a
      random password and prints it once to container stdout/logs, or
      accepts an explicit plaintext value via `--password`/
      `--choose-password`. Our only customer-secret channel
      (`generated_from: "<algo>:ROOT_PASSWORD"`) only ever carries a hash
      (argon2/bcrypt), never the plaintext Faraday's CLI needs — so the
      root-password projection mechanism cannot set Faraday's native login
      directly. This is the genuine-plaintext-requirement case, a
      structural blocker for that specific mechanism.
    - >
      Practical workaround: gate the whole app behind Traefik
      `basic_auth` (root-password-hash-derived, expressible today) and
      leave Faraday's own auto-generated admin password as an internal,
      behind-the-gate credential — the same pattern already used for apps
      with a fixed/unchangeable default credential. This makes the app
      installable, but the customer still needs some way to retrieve
      Faraday's own generated password (or run
      `faraday-manage change-password`) after first boot — e.g. via
      container logs. Hostinger's own existing Faraday catalogue listing
      handles this today by having the customer read the admin password
      out of the `faraday-1` container logs post-deploy; it is unclear
      whether AF customers have an equivalent log-access path today.
  installable_today: true
  recommendation: build_with_caveats

summary: >
  Faraday is an active, actively-released (monthly cadence, last release
  13 days ago), GPL-3.0 open-source vulnerability-management platform with
  a single-port web UI and no overlap with any of our 24 existing recipes
  — it would be a genuinely new category for the catalogue. It is
  installable today only via the Traefik `basic_auth` gate pattern,
  because Faraday's own admin login needs a plaintext password (from its
  CLI) rather than the hash our `generated_from` mechanism supplies, and
  its self-generated internal admin password is only ever surfaced via
  container logs today. Recommend build_with_caveats: worth building
  behind a basic_auth gate, but flag the log-retrieval UX gap for
  Faraday's own login before shipping.
