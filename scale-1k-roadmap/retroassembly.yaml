slug: retroassembly
name: RetroAssembly
source_description: "Self-hosted browser-based retro game library supporting 25+ classic consoles"

upstream:
  url: https://retroassembly.com
  repo_url: https://github.com/arianrhodsandlot/retroassembly
  license: MIT
  docker_image: arianrhodsandlot/retroassembly
  compose_file_url: null
  compose_file_notes: >
    No official docker-compose.yaml/.yml file exists as a linkable
    artifact — not in the GitHub repo (root, or any docker/deploy/contrib
    directory; only a Dockerfile is present), and not on the project's own
    Docker Hub page. The GitHub README's self-hosting section contains no
    inline compose instructions at all and instead links out to
    "RetroAssembly's homepage on Docker Hub" for the quick-start. That
    Docker Hub page (arianrhodsandlot/retroassembly, the project's own
    account) embeds a docker-compose snippet directly in its description
    text alongside an equivalent `docker run` command, but it is prose in
    a page, not a downloadable/linkable file — the same situation recorded
    for Reiverr. No version is pinned in that snippet (image:
    arianrhodsandlot/retroassembly with no tag, i.e. implicitly `latest`).

version_health:
  latest_version: "v7 (image tag v7.260719.1051)"
  latest_release_date: "2026-07-19"
  release_cadence: active
  eol_status: active
  notes: >
    v7 tagged 2026-07-19, ~17 days before today (2026-08-05) — well inside
    a normal release window. Release history shows a sustained cadence of a
    major tagged version roughly every 4-8 weeks since the project's first
    Docker-ready release: v1 (2025-08-01), v2 (2025-08-30), v3
    (2025-10-18), v4 (2025-11-21), v5 (2026-01-17), v6 (2026-03-21), v7
    (2026-07-19). Each tag ships substantial new
    features (new console support, multi-user, auto-save), not just patch
    bumps. Docker Hub also publishes parallel `-unstable` dev builds on a
    similar cadence, confirming continuous active development. 1.1k GitHub
    stars, 53 forks, single primary maintainer, issues actively triaged,
    no archival notice.

catalogue_fit:
  categories: [media, entertainment]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24 recipes covers gaming/emulation — the
    closest neighbors (immich, syncthing) are photo/file-sync tools, not
    entertainment. RetroAssembly would be a genuinely new category: a
    single-container, self-hosted retro game (NES/SNES/Genesis/GB/PS1/N64/
    Arcade, 25+ platforms) emulator playable entirely in-browser, with
    customer-supplied ROM files and per-user save-state sync. No other
    candidate in the catalogue or its gaps so far competes for this niche.
  usefulness: medium
  usefulness_rationale: >
    Distinct, novel appeal (hobbyist/enthusiast audience) rather than
    broad business utility, and legality of ROM sourcing is entirely on
    the customer (the app itself ships no copyrighted content and is MIT
    licensed). Active development and a genuinely new catalogue slot argue
    for building it; niche appeal argues against high priority.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  RetroAssembly is a single-container web app (image
  arianrhodsandlot/retroassembly, port 8000, one data volume for
  ROMs/saves/settings) with no environment-variable configuration and no
  admin-login parameter to project a password into — the customer creates
  their own account entirely through the in-browser UI after first boot,
  the same pattern used by uptime-kuma in the current catalogue. That
  means there is no customer-supplied secret needed at /compose time and
  no blocking issue under the current mechanism. The project is actively
  maintained (tagged release 17 days ago, consistent ~6-week cadence for a
  year) and fills a category (gaming/entertainment) the catalogue does not
  currently touch. Recommend building now, pinning to Docker Hub tag
  `v7.260719.1051` (not `latest`).
