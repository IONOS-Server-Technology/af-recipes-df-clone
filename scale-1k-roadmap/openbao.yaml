slug: openbao
name: OpenBao
source_description: "Open-source secrets manager for storing and accessing sensitive credentials"

upstream:
  url: https://openbao.org
  repo_url: https://github.com/openbao/openbao
  license: MPL-2.0
  docker_image: openbao/openbao

version_health:
  latest_version: "2.6.1"
  latest_release_date: "2026-07-22"
  release_cadence: active
  eol_status: active
  notes: >
    Latest stable release (2.6.1) shipped 2026-07-22, ~2 weeks before this
    analysis (2026-08-05). Prior releases: 2.6.0 on 2026-07-14, 2.5.5 on
    2026-06-17, 2.5.4 on 2026-05-20, 2.5.3 on 2026-04-20 — a steady
    multi-week release cadence with both patch and feature releases.
    OpenBao is a Linux Foundation project (fork of HashiCorp Vault, created
    after Vault's 2023 BSL relicensing) with backing from IBM and other
    members; governance and cadence look sustainable, not a one-vendor
    side project.

catalogue_fit:
  categories: [security, secrets-management, devops]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Vaultwarden (already in the catalogue) is a personal/team Bitwarden-
    compatible password manager for end users. OpenBao is a machine/infra
    secrets manager: dynamic secret generation (cloud/DB credentials),
    PKI issuance, encryption-as-a-service, and audited API-driven access
    for applications and pipelines — a different audience (DevOps/platform
    engineers) and use case with no functional overlap in the current
    24-recipe catalogue.
  usefulness: medium
  usefulness_rationale: >
    Legitimate demand from customers running their own infra/CI who want a
    Vault-compatible secrets store without HashiCorp's BSL license. Value
    is capped for a single-VM AF deployment: OpenBao's dynamic-secrets and
    PKI features assume it's wired into other infrastructure (clouds,
    databases, CAs) that a lone AF instance doesn't provide out of the box,
    so much of its value only shows up once the customer does further
    integration work themselves.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues:
    - >
      OpenBao boots sealed and has no admin username/password concept at
      all — production storage backends require an operator-driven
      `bao operator init` (which mints a fresh root token and a set of
      Shamir unseal-key shares) followed by `bao operator unseal`. Both the
      root token and the unseal keys are generated by the app itself at
      init time and are the ONLY way to ever log in or unseal after a
      restart; they cannot be pre-supplied via env var/config for a
      production storage backend the way `generated_from` or
      `auto_generate` parameters work today.
    - >
      Even if install.sh runs init/unseal automatically during
      provisioning, there is no existing mechanism to capture that
      app-generated root token/unseal keys and surface them back to the
      customer post-deploy. Today's `auto_generate` pattern only covers
      secrets generated by af-api BEFORE the app boots and injected in via
      the env template (e.g. Vaultwarden's ADMIN_TOKEN) — not values the
      app itself produces once running. Without a delivery channel, the
      customer would receive a running-but-unusable, permanently sealed or
      inaccessible vault.
    - >
      A `-dev` mode exists that allows a fixed root token and auto-unseal,
      but it is explicitly unsuitable for anything beyond local testing
      (in-memory storage, no persistence, all data lost on restart) and
      is not a real option for a hosted recipe.
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  OpenBao is an actively maintained, Linux Foundation-governed Vault fork
  with a real and distinct use case from anything else in the catalogue
  (infra/API secrets management vs. Vaultwarden's personal password vault).
  It is not installable under the current mechanism, though: it has no
  admin login to project a root-password hash into, and its actual login
  credential (a root token) plus its unseal keys are generated by the app
  itself at init time with no existing channel to hand them back to the
  customer. This needs a new "capture app-generated secret and return it
  to the customer" mechanism — a bigger platform gap than the
  root-password-projection or basic-auth-gate work already in flight — so
  it should be revisited once that lands rather than attempted now.
