slug: dagu
name: Dagu
source_description: "DAG-based workflow scheduler with web UI for managing cron jobs and task pipelines"

upstream:
  url: https://dagu.sh/
  repo_url: https://github.com/dagucloud/dagu
  license: GPL-3.0 (core; vendor also offers a separate commercial embedding license per LICENSING.md — self-hosting under GPLv3 is unaffected)
  docker_image: ghcr.io/dagucloud/dagu

version_health:
  latest_version: "v2.11.4"
  latest_release_date: "2026-08-03"
  release_cadence: active
  eol_status: active
  notes: >
    As of today (2026-08-05), the latest tag (v2.11.4, 2026-08-03) is 2 days
    old. Recent tag history is dense and weekly-or-faster: v2.11.3
    (2026-08-02), v2.11.2 (2026-07-31), v2.11.1 (2026-07-27), v2.11.0
    (2026-07-26), v2.10.7 (2026-07-12), v2.10.6 (2026-07-11), v2.10.5
    (2026-07-10) — this is a genuinely fast-moving, currently active
    project, not a revival burst. One naming note for the reviewer: the
    project's GitHub organization was renamed from `dagu-org` to
    `dagucloud` at some point before this analysis — the `dagu-org/dagu`
    org still exists on GitHub but the live repo, docs, and container
    registry namespace are all now under `dagucloud` (repo
    `dagucloud/dagu`, image `ghcr.io/dagucloud/dagu`, docs at
    docs.dagu.sh / docs.dagu.cloud). Any recipe work should use the
    `dagucloud` namespace, not `dagu-org`.

catalogue_fit:
  categories: [automation, devops, infrastructure]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Dagu is a DAG-based job/pipeline scheduler (declarative YAML workflows,
    cron triggers, retries, per-step logs, shell/Docker/SSH/Kubernetes-Job
    steps) — a lightweight self-hosted Airflow alternative. n8n is the
    closest existing recipe by "automation" category but is a very
    different tool: node-based API/app integration (webhooks, third-party
    connectors, low-code business automation) rather than DAG/cron
    pipeline orchestration with per-step shell/container execution and run
    history. No recipe in the current catalogue covers scheduled
    multi-step pipeline orchestration; this is a distinct niche.
  usefulness: medium
  usefulness_rationale: >
    Real, distinct value for customers who want to schedule and observe
    multi-step jobs (backups, ETL, maintenance scripts) with a web UI and
    run history, without standing up something as heavy as Airflow. Value
    is capped by scope similar to the crontab-ui gap analysis: jobs run
    inside this one container's filesystem/environment, not directly on
    the customer's host or other AF recipe containers, unless the customer
    wires in extra mounts/networking themselves — so "orchestrate my whole
    server" framing overstates what ships out of the box. Still a more
    capable and more actively maintained tool than crontab-ui, with a much
    healthier upstream (weekly releases vs. a multi-year-dormant single
    maintainer project).

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [basic_auth_password]
  secrets_expressible_today:
    - secret: basic_auth_password
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_with_caveats

summary: >
  Dagu is a single-binary, single-container app (default web UI on :8080;
  additional ports 8090/8091/8092/50055 are only used for the
  distributed coordinator/worker mode, not needed for a standard
  single-instance recipe) with three built-in auth modes selected via
  DAGU_AUTH_MODE: none, basic, and builtin (JWT + user management,
  default). None of the documented credential env vars
  (DAGU_AUTH_BASIC_PASSWORD, DAGU_AUTH_BUILTIN_INITIAL_ADMIN_PASSWORD) are
  documented as accepting a pre-hashed value — both read as plaintext-only
  bootstrap credentials, so they are not expressible via `generated_from`
  (which only ever carries a hash). The mechanically sound path is to set
  DAGU_AUTH_MODE=none and gate the whole app behind a Traefik
  `basic_auth: true` credential instead (same pattern as Adminer/WUD/n8n's
  gate use), which makes this installable_today under the current
  mechanism. Combined with a very active, fast-releasing upstream (weekly
  tags, most recent 2 days old) and a real if scope-limited niche not
  covered by any existing recipe, this is a reasonable build candidate,
  caveated on the scope note above about jobs being confined to the
  container's own environment rather than the customer's full host.
