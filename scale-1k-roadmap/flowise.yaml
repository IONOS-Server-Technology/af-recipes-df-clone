slug: flowise
name: Flowise
source_description: "Open-source low-code tool for building LLM orchestration flows and AI agents"

upstream:
  url: https://flowiseai.com
  repo_url: https://github.com/FlowiseAI/Flowise
  license: Apache-2.0
  docker_image: flowiseai/flowise

version_health:
  latest_version: "flowise@3.1.4"
  latest_release_date: "2026-07-29"
  release_cadence: active
  eol_status: active
  notes: >
    3.1.4 released 2026-07-29, 7 days before today (2026-08-05). Preceding
    releases (3.1.0 through 3.1.3) landed roughly monthly from March through
    July 2026, and older 3.0.x tags before that at a similar cadence — a
    steady, uninterrupted release train, not a burst followed by silence.
    Docker Hub confirms the same tags with matching push timestamps. Repo is
    not archived, has 55.2k stars, 698 open issues under active triage, and
    3,627+ commits on main — clearly active development, no EOL signal.

catalogue_fit:
  categories: [ai, automation]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: [n8n, anythingllm, activepieces]
  differentiation: >
    Flowise is a drag-and-drop visual builder specifically for LLM
    chatflows and multi-agent flows (AgentFlow), with first-class nodes for
    chat models, vector stores, retrievers, and MCP tool exposure —
    narrower and more AI-specific than n8n's general-purpose node
    automation, but conceptually the same "visual low-code flow builder"
    shape already covered by n8n and, on the AI-agent side, by
    AnythingLLM's agent/RAG workspaces and Activepieces' AI-piece push. A
    customer who wants to visually wire together LLM calls, vector search,
    and tool use without code has a real reason to prefer Flowise's
    purpose-built AI canvas over generic n8n, but it is an incremental
    variant on an already-served need rather than a new capability.
  usefulness: medium
  usefulness_rationale: >
    Large, well-starred (55.2k), actively-shipping project with genuine
    demand and a distinct AI-native flow-builder angle, but it lands as the
    third or fourth recipe covering "visually build automations/AI
    workflows" (n8n, AnythingLLM, Activepieces already in scope), so it
    caps at medium rather than high — value is mostly about which flavor of
    that job a given customer prefers.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [JWT_AUTH_TOKEN_SECRET, JWT_REFRESH_TOKEN_SECRET, EXPRESS_SESSION_SECRET, TOKEN_HASH_SECRET, FLOWISE_SECRETKEY_OVERWRITE]
  secrets_expressible_today:
    - secret: JWT_AUTH_TOKEN_SECRET
      mechanism: server_generated_no_customer_input
    - secret: JWT_REFRESH_TOKEN_SECRET
      mechanism: server_generated_no_customer_input
    - secret: EXPRESS_SESSION_SECRET
      mechanism: server_generated_no_customer_input
    - secret: TOKEN_HASH_SECRET
      mechanism: server_generated_no_customer_input
    - secret: FLOWISE_SECRETKEY_OVERWRITE
      mechanism: server_generated_no_customer_input
  blocking_issues: []
  installable_today: true
  recommendation: build_with_caveats

summary: >
  Flowise is installable today with no customer-supplied value at all: the
  five JWT/session/encryption secrets are patternless strings the platform
  can generate server-side, and — confirmed against upstream docs and a
  GitHub issue on the v3.0.1+ auth rework — the admin account itself is
  created through Flowise's own first-visit setup wizard and then locked
  down (subsequent account-creation attempts require the existing
  admin's credentials), the same self-serve pattern already used by n8n,
  AnythingLLM, and Uptime Kuma, so no root-password projection or
  basic_auth gate is structurally required. The older FLOWISE_USERNAME/
  FLOWISE_PASSWORD basic-auth env vars from pre-3.0 versions are gone in
  current releases, so there is no plaintext-vs-hash mismatch to worry
  about either. It defaults to SQLite (no mandatory Postgres dependency,
  unlike n8n), keeping the stack single-container-simple. The open question
  is fit rather than mechanics: the catalogue already covers "visual
  low-code flow builder" (n8n) and adjacent "AI agent/RAG" ground
  (AnythingLLM, Activepieces already flagged as overlapping n8n), so a
  Flowise recipe should be weighed as one more entry in an increasingly
  crowded no-code/AI-flow niche rather than a capability the catalogue is
  currently missing.
