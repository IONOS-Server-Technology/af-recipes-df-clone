slug: librebooking
name: LibreBooking
source_description: "Open-source resource scheduling system for rooms, equipment, and shared assets"

upstream:
  url: https://librebooking.readthedocs.io/
  repo_url: https://github.com/LibreBooking/librebooking
  license: GPL-3.0
  docker_image: librebooking/librebooking

version_health:
  latest_version: "5.3.0"
  latest_release_date: "2026-08-03"
  release_cadence: active
  eol_status: active
  notes: >
    Monthly (sometimes sub-monthly) release cadence throughout 2026 —
    5.0.0 (2026-05-03), 5.0.1/5.0.2 (early-to-mid May), 5.0.3 (2026-06-03),
    5.1.0 (2026-06-07), 5.2.0 (2026-07-03), 5.3.0 (2026-08-03, 2 days before
    this analysis). Repo has 5,000+ commits, dozens of open issues/PRs under
    active triage. Clearly active, not maintenance-only. Project is a
    continuation of the discontinued open-source "Booked Scheduler"
    (phpScheduleIt lineage), rebranded LibreBooking after Booked Scheduler
    went closed-source/SaaS-only in 2020 — LibreBooking itself has diverged
    substantially since and is the actively maintained upstream, not an
    abandoned fork.

catalogue_fit:
  categories: [scheduling, resource-management, productivity]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    None of the current 24 recipes cover room/equipment/shared-asset
    booking or scheduling. Closest neighbors (Uptime Kuma, Portainer,
    Gitea) are unrelated domains. This would be a net-new category for the
    catalogue — useful to small orgs, coworking spaces, or teams wanting to
    schedule meeting rooms/equipment without a SaaS subscription.
  usefulness: medium
  usefulness_rationale: >
    Real, distinct use case with no in-catalogue competitor, but resource
    booking is a narrower niche than the productivity/automation/AI tools
    that dominate the current catalogue — likely lower demand than a
    generic top-of-funnel app.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [LB_DATABASE_PASSWORD, LB_INSTALL_PASSWORD]
  secrets_expressible_today:
    - secret: LB_DATABASE_PASSWORD
      mechanism: server_generated_no_customer_input
    - secret: LB_INSTALL_PASSWORD
      mechanism: server_generated_no_customer_input
  blocking_issues:
    - >
      Setting LB_DATABASE_PASSWORD/LB_INSTALL_PASSWORD only gets LibreBooking
      partway there. Per the official docker/RUN.md and docker/SETUP.md
      (github.com/LibreBooking/docker) and bin/entrypoint.sh, the Docker
      entrypoint only sed-patches config/config.php with the DB connection
      string and the install-password value — it does NOT create the
      database schema/tables or the admin account. Completing setup still
      requires visiting /install in a browser, entering the install
      password to unlock the wizard, clicking through "Create the
      database" and "Create the database user", then filling in and
      submitting a registration form (email/username/password) for the
      application administrator — all described in SETUP.md as one
      continuous /install-gated sequence, not a step reachable separately.
      install.sh could plausibly script these as server-side HTTP form
      posts using the server-generated LB_INSTALL_PASSWORD (no customer
      involvement needed for the DB-creation steps), the same way it
      already shells out for container orchestration. But the admin
      registration step is the actual blocker: that form takes a plaintext
      password and LibreBooking hashes it itself on submission, so there
      is no way to hand it a pre-computed hash the way
      generated_from:ROOT_PASSWORD projection expects (that mechanism is
      built for apps that read a hash directly off a config/env value, e.g.
      Vaultwarden's ADMIN_TOKEN — not for one that hashes whatever plaintext
      a form receives). install.sh never has the customer's plaintext root
      password, only a hash of it, so it cannot submit that registration
      form with a password the customer will actually be able to log in
      with later. Nor is this the n8n pattern (first visitor sets their own
      password live, in-app, no wizard gate): SETUP.md gives no evidence of
      a public registration route the customer could reach without first
      supplying the server-only install password, so we could not confirm a
      path for the customer to end up with a self-chosen admin credential
      at all. Resolving this would need either a documented
      install-password-independent registration endpoint (unconfirmed) or a
      new secret-delivery channel beyond generated_from/basic_auth
      (doesn't exist today) — flagging as a genuine blocker rather than
      glossing over it as a simple env-var equivalence to n8n.
  installable_today: false
  recommendation: build_with_caveats
  # Caveat (not blocking on its own): docs flag that reminder emails need a
  # job scheduler (cron) hitting a URL periodically — not required to boot
  # or use the app, but worth a documented cron/sidecar container follow-up
  # if this is revisited.

summary: >
  LibreBooking is an active, GPL-3.0 room/equipment/resource-booking web app
  with an official single-container Docker image (needs a MariaDB
  companion), a single HTTP port, and monthly releases through August 2026 —
  no EOL or dormancy concerns. It fills a category gap none of the current
  24 recipes cover. However, the Docker entrypoint only pre-populates
  config.php with the DB connection string and install-wizard password; it
  does not create the DB schema or the admin account. Per upstream's own
  docker/SETUP.md, admin registration is bundled inside the same
  install-password-gated /install wizard as the DB-creation steps, and that
  registration form takes a plaintext password the app hashes itself —
  incompatible with the generated_from:ROOT_PASSWORD mechanism (which only
  ever carries a hash), and with no confirmed customer-reachable path to
  set their own credential the way n8n's first-visitor flow allows. This is
  a real, unresolved gap under the current /compose mechanism, not a clean
  env-var equivalence to n8n — recommend build_with_caveats pending a
  hands-on spike to confirm whether a customer-reachable registration route
  exists independent of the install-password gate. Usefulness rated medium
  given the narrower niche relative to the catalogue's
  productivity/automation/AI focus.
