slug: evolution-api
name: Evolution API
source_description: "Open-source WhatsApp API for chatbots, automation, and messaging integrations"

upstream:
  url: https://evolutionfoundation.com.br
  repo_url: https://github.com/evolution-foundation/evolution-api
  license: Apache-2.0 (with additional brand-protection/logo-notice clauses per NOTICE/TRADEMARKS)
  docker_image: evoapicloud/evolution-api

version_health:
  latest_version: "2.4.0-rc2 (pre-release); v2.3.7 is the latest stable/non-license release"
  latest_release_date: "2026-05-17"
  release_cadence: active
  eol_status: active
  notes: >
    Repo was renamed from EvolutionAPI/evolution-api to
    evolution-foundation/evolution-api in 2026 as part of a "Evolution
    Foundation" rebrand; not a fork or abandonment, same project. Release
    history is frequent through 2025 (v2.3.0 2025-06-17 through v2.3.7
    2025-12-05, roughly monthly). Since then only two 2.4.0 release
    candidates have shipped (rc1 2026-05-06, rc2 2026-05-17) and neither has
    graduated to a full stable release as of today (2026-08-05) — about 2.9
    months since rc2 with no stable cut. Cadence is still "active" (project
    is clearly maintained, GitHub issue #2534 shows maintainers actively
    responding to community pushback), but the v2.4.0 line has stalled at
    RC status longer than any prior release gap in 2025, likely because of
    the license-activation controversy described below.

catalogue_fit:
  categories: [automation, communication]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24 recipes exposes a WhatsApp integration API.
    n8n (already in the catalogue) is the nearest neighbor — customers would
    likely pair the two (n8n workflows calling Evolution API to send/receive
    WhatsApp messages) rather than one replacing the other. This would be a
    genuinely new category (chatbot/messaging-automation backend), not a
    duplicate of anything shipping today.

  usefulness: medium
  usefulness_rationale: >
    WhatsApp business/chatbot automation is a real, popular use case
    (heavily promoted alongside n8n in the self-hosting/no-code community),
    so there is clear customer pull. Capped at medium rather than high
    because of the version_health uncertainty above (the actively-developed
    line now requires third-party license activation) and because the app's
    core value depends on WhatsApp Web session pairing (Baileys), which is
    inherently fragile to WhatsApp's own anti-automation enforcement and
    outside our control.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [AUTHENTICATION_API_KEY, basic_auth_gate_credential]
  secrets_expressible_today:
    - secret: AUTHENTICATION_API_KEY
      mechanism: server_generated_no_customer_input
    - secret: basic_auth_gate_credential
      mechanism: traefik_basic_auth
  blocking_issues:
    - >
      AUTHENTICATION_API_KEY is a single global secret compared as a literal
      string (an `apikey` request header checked for exact equality against
      the env var) — it is not a hashed/bcrypt-style login field. It cannot
      be the target of `generated_from: "<algo>:ROOT_PASSWORD"`, because
      that mechanism only ever projects a *hash* of the root password, and
      Evolution API has no way to compare a hash — the customer would end
      up needing to know the raw hash string as their literal API key,
      which they cannot derive themselves. Workaround: generate
      AUTHENTICATION_API_KEY randomly server-side (customer never needs to
      see or type it), bake it into both the API container and the
      Evolution Manager container's env (Manager supports pre-configuring
      VITE_EVOLUTION_API_KEY so its own login screen is bypassed), and put
      the real customer-facing gate in front via Traefik `basic_auth: true`
      (root-password projection) on both the API and Manager ports. This
      follows the schema's guidance that a fixed/hardcoded credential the
      app itself gives no way to change is fine once Traefik basic_auth is
      the actual auth boundary — so this is a workaround, not a hard
      blocker, and is reflected in secrets_expressible_today above.
    - >
      Starting at v2.4.0 (currently RC-only, see version_health), every
      instance must complete a one-time "license activation" handshake
      against the Evolution Foundation's own licensing server before the
      Manager dashboard becomes usable (unlicensed instances are redirected
      to an external registration/OAuth-style callback flow). This is
      exactly the "OAuth app registration / third-party account linking"
      case the schema calls a hard no — there is no channel for us to
      complete that handshake on the customer's behalf, and no channel for
      the customer to complete it themselves through our install flow. This
      only affects 2.4.0+; the last pre-license release, v2.3.7, has no
      such requirement and can be pinned instead.
    - >
      Because of the item above, a recipe would have to pin to v2.3.7
      (currently ~8 months old and not the line upstream is actively
      developing) to avoid the license wall, which conflicts with the
      version_health signal that v2.4.0 is where current development effort
      is going. Revisit once 2.4.0 either drops the mandatory-activation
      requirement (tracked in upstream issue #2534) or ships a
      self-hostable/offline activation path.
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  Evolution API would fill a real, distinct gap (WhatsApp/chatbot messaging
  backend, pairs naturally with the existing n8n recipe) and is actively
  developed. It is not installable today for two compounding reasons: its
  global AUTHENTICATION_API_KEY only works as a literal-compare secret
  (workaroundable via server-generated key + Traefik basic_auth, as noted
  above), but the actively-developed v2.4.0 line additionally requires an
  external license-activation handshake with the vendor's own licensing
  server, which has no expressible input channel under the current
  mechanism. Pinning to the last unlicensed release (v2.3.7) avoids the
  license wall but means shipping a recipe already behind upstream's current
  development focus. Recommend revisiting once upstream issue #2534
  (mandatory license activation breaking self-hosted deployments) resolves
  one way or the other.
