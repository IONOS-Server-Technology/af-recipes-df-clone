slug: deluge
name: Deluge
source_description: "Lightweight BitTorrent client with web interface and plugin support"

upstream:
  url: https://deluge-torrent.org
  repo_url: https://github.com/deluge-torrent/deluge
  license: GPL-3.0
  docker_image: linuxserver/deluge (pin to a version tag, e.g. 2.2.0-ls381 — do not follow upstream compose examples that use :latest)

version_health:
  latest_version: "2.2.0"
  latest_release_date: "2025-04-28"
  release_cadence: sporadic
  eol_status: active
  notes: >
    As of today (2026-08-05), the latest stable release (2.2.0) shipped
    roughly 15 months ago. Historical cadence is very uneven: 2.0.0-2.0.3
    landed in a burst in June 2019, then 2.0.4/2.0.5 in December 2021 (~2.5
    years later), 2.1.0/2.1.1 in June/July 2022, and 2.2.0 in April 2025
    (~3 years after that). Development is not dead — the readthedocs
    "latest" doc build shows an active 2.2.1.dev tree as of March 2026,
    and 2.2.0 itself included fixes for three GHSL-tagged security
    advisories — but stable releases land maybe once every 1-3 years, so
    treat this as sporadic rather than active. It is a mature,
    single-well-known-project (essentially the reference GPL BitTorrent
    client with a web UI), not a fork or abandoned mirror. The
    deluge-torrent/deluge GitHub repo is explicitly a read-only PR mirror
    (canonical development happens on git.deluge-torrent.org), which
    explains why it shows zero GitHub "Releases" despite ongoing upstream
    work.

catalogue_fit:
  categories: [media]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    No BitTorrent/download-client recipe exists in the current 24-recipe
    catalogue today. Deluge's web UI (port 8112) is a single HTTP
    endpoint and works behind Traefik the same way Syncthing's web UI
    does, even though — like Syncthing — the app also needs raw
    non-HTTP ports open for its actual protocol traffic (inbound torrent
    peer connections on 6881/tcp+udp, optional daemon port 58846 for
    thin clients). That precedent (Syncthing already ships with public
    non-HTTP ports alongside its web UI) means the raw-port requirement
    here is not a novel problem for the platform.
  usefulness: medium
  usefulness_rationale: >
    BitTorrent clients are a perennial self-hosted-app request (frequently
    paired with Sonarr/Radarr/Jellyfin-style media stacks that we don't
    carry either), and Deluge is one of the two or three most recognized
    open-source options alongside qBittorrent and Transmission. Usefulness
    is capped at medium rather than high because: (a) the upstream release
    cadence is slow enough that security-fix turnaround could lag, and (b)
    without a companion media-server/*arr recipe in the catalogue, a
    standalone Deluge instance is a less complete story for the "media
    automation" audience than it would be alongside those.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [BASIC_AUTH_GATE]
  secrets_expressible_today:
    - secret: BASIC_AUTH_GATE
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Deluge (via the linuxserver/deluge image) is a single-container app with
  a web UI on one HTTP port, so it is reverse-proxy compatible the same way
  Syncthing is, alongside raw torrent-protocol ports (6881/tcp+udp) that
  must stay open regardless of Traefik. Its WebUI ships a fixed, well-known
  default login (admin/deluge) with no environment variable or first-boot
  parameter to override it — the linuxserver image only exposes
  PUID/PGID/TZ/DELUGE_LOGLEVEL/UMASK, none of which touch auth — so the
  fix is the same pattern used elsewhere in this catalogue for apps with
  no overridable login of their own: a Traefik `basic_auth` gate projected
  from the root-password hash in front of the app (IF-1312). With that gate
  this is installable today with no blocking issues, so it is marked
  `build_now`. Whoever picks this up should still budget for manually
  tracking CVEs/point releases given upstream's sporadic release cadence
  (multi-year gaps between stable versions), rather than expecting routine
  upstream cadence to carry that load.
