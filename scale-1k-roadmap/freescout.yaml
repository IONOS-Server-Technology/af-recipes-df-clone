slug: freescout
name: FreeScout
source_description: "Lightweight open-source help desk and shared inbox system"

upstream:
  url: https://freescout.net/
  repo_url: https://github.com/freescout-help-desk/freescout
  license: AGPL-3.0
  docker_image: null # no image published by the FreeScout team; freescout.net/docker/ redirects to the third-party nfrastack/container-freescout project (docker.io/nfrastack/freescout, MIT-licensed wrapper — that license covers the wrapper, not the app)

version_health:
  latest_version: "1.8.232"
  latest_release_date: "2026-07-31"
  release_cadence: active
  eol_status: active
  notes: >
    Latest tag 1.8.232 shipped 2026-07-31, 6 days before this analysis
    (2026-08-05). The preceding releases (1.8.231, 1.8.230, 1.8.229...) land
    roughly weekly going back through mid-2026, so this is a genuinely
    active, frequently-patched project, not a stale one.

catalogue_fit:
  categories: [communication, business, productivity]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue is a ticketing/shared-inbox
    help desk. n8n (automation) and the CRM-adjacent tools we don't yet
    carry are the nearest conceptual neighbors but serve a different job;
    FreeScout would be a genuinely new category — self-hosted customer
    support for small teams who don't want a SaaS help desk subscription.
  usefulness: high
  usefulness_rationale: >
    Self-hosted help desk is a common, well-understood SMB need with real
    demand for a free alternative to Help Scout/Zendesk, and FreeScout is
    the most established free option in that space (AGPL-3.0, no per-seat
    licensing, active weekly releases).

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [BASIC_AUTH_GATE, DB_PASS]
  secrets_expressible_today:
    - secret: BASIC_AUTH_GATE
      mechanism: traefik_basic_auth
    - secret: DB_PASS
      mechanism: server_generated_no_customer_input
  blocking_issues:
    - "No official Docker image from the FreeScout team itself; the app's own docs (freescout.net/docker/) point to a third-party wrapper (nfrastack/container-freescout, MIT), which bundles PHP-FPM/Nginx plus a bootstrap script but is not maintained by the upstream project — a supply-chain/support caveat worth surfacing even though it doesn't block the /compose secret-projection mechanism."
    - "The wrapper's ADMIN_PASS (documented default 'freescout') and FreeScout's own `php artisan freescout:create-user` console command both take the admin password as PLAINTEXT that the app hashes internally — there is no documented path to hand FreeScout a pre-computed hash. generated_from: \"<algo>:ROOT_PASSWORD\" only ever produces a hash, so it cannot be projected onto ADMIN_PASS without turning the customer's real root password into an opaque string they'd never actually know or be able to log in with (same blocker already identified for apps-gaps/flarum.yaml). FreeScout's internal admin login therefore stays at whatever plaintext value the wrapper's env/default sets, unrelated to the customer's root password, and is not customer-meaningful — it's protected only by the outer Traefik basic_auth gate, not by generated_from."
  installable_today: true
  recommendation: build_with_caveats

summary: >
  FreeScout is an actively maintained (weekly releases), AGPL-3.0 self-hosted
  help desk with no overlap in our current 24-recipe catalogue and clear
  differentiated demand (a free Help Scout/Zendesk alternative). It's a
  Laravel/PHP app needing its own MySQL/MariaDB database plus a scheduler/
  queue worker, structurally similar to the paperless-ngx/akaunting
  app+db pattern, and sits behind a single HTTP port so it's fully
  reverse-proxy-compatible. Its own admin login only accepts a plaintext
  password that the app hashes internally (both the wrapper's ADMIN_PASS env
  var and FreeScout's `artisan freescout:create-user` CLI), so
  generated_from_root_password cannot express it — the same class of
  blocker already flagged for Flarum. Because FreeScout's UI is
  agent/admin-facing (customers interact by email, not by logging into the
  ticketing console), gating the whole app behind Traefik basic_auth with a
  generated_from_root_password credential is a legitimate substitute
  boundary here, unlike for a public-facing app like Flarum. Bootstrap then
  only needs that basic_auth gate credential plus a server-generated
  database password — no external API key or OAuth registration is
  required, so it clears the /compose constraint under this corrected
  mechanism. The one other real caveat: there is no image published by the
  FreeScout team itself, only a third-party Docker wrapper linked from
  their own docs, which should be flagged to whoever authors the recipe.
  Recommend build_with_caveats.
