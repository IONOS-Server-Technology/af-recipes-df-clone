slug: baikal
name: Baikal
source_description: "Self-hosted CalDAV and CardDAV server for calendars and contacts"

upstream:
  url: https://sabre.io/baikal/
  repo_url: https://github.com/sabre-io/Baikal
  license: GPL-3.0
  docker_image: ckulka/baikal

version_health:
  latest_version: "0.12.1"
  latest_release_date: "2026-08-05"
  release_cadence: active
  eol_status: active
  notes: >
    Latest upstream release (0.12.1) was published today (2026-08-05), two
    days after 0.12.0 (2026-08-03) — a quick follow-up fix release. Prior
    releases: 0.11.1 (2025-11-30), 0.11.0 (2025-11-29), 0.10.1 (2024-11-10),
    0.10.0 (2024-11-02). Repo is not archived and had a push today. Cadence
    is roughly one feature release every 9-12 months plus occasional
    same-week patch releases — steady maintenance-mode-style activity, not
    dormant. Caveat: the community Docker image (ckulka/baikal, the only
    packaged image — sabre-io ships no official one) is meaningfully behind
    upstream: its newest version-pinned tag is 0.10.1 (built 2025-07-31);
    there is no 0.11.x or 0.12.x image tag yet. A recipe pinned to the image
    today would ship an app version roughly two releases (~9 months) behind
    upstream's current release.

catalogue_fit:
  categories: [productivity, groupware]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    No existing recipe covers calendar/contact sync (CalDAV/CardDAV). Baikal
    is a lightweight, single-container alternative to running a full
    Nextcloud instance just for calendar and address-book sync across
    phones/desktops — useful to customers who want private
    calendar/contacts sync without a full groupware suite.
  usefulness: medium
  usefulness_rationale: >
    Clear, common self-hosting use case (calendar/contacts sync) with no
    catalogue overlap, but a narrow, single-purpose tool compared to our
    broader productivity/security recipes — a niche but real audience
    (privacy-conscious users replacing Google/iCloud calendar sync).

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot:
    - "Traefik basic-auth gate credential"
  secrets_expressible_today:
    - secret: "Traefik basic-auth gate credential"
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Baikal is an active, non-EOL CalDAV/CardDAV server filling a genuine gap
  in the current catalogue (no calendar/contacts recipe exists) and is
  reverse-proxy-compatible behind Traefik. It has no admin-credential env
  var of its own, so its exposed first-run setup wizard must be gated with
  a Traefik basic_auth credential projected from the root password —
  installable today via that mechanism, with no blocking issues. Note the
  only available Docker image (community-maintained ckulka/baikal) lags
  roughly two releases (~9 months) behind upstream's actively-updated
  0.12.x line, so the recipe would ship a visibly outdated app version
  unless that gap closes or we build our own image.
