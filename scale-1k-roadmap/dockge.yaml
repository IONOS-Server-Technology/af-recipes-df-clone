slug: dockge
name: Dockge
source_description: "Dockge is a fancy, easy-to-use, and reactive self-hosted Docker Compose stack manager"

upstream:
  url: https://dockge.org/
  repo_url: https://github.com/louislam/dockge
  license: MIT
  docker_image: louislam/dockge:1
  compose_file_url: https://raw.githubusercontent.com/louislam/dockge/master/compose.yaml
  compose_file_notes: >
    Official — this exact raw URL is the file the project's own README
    "How to Install" section tells users to `curl` down
    (github.com/louislam/dockge#-how-to-install, "Basic" variant). It is a
    rolling reference to the `master` branch, not version-pinned to a
    release tag (Dockge has no per-release compose-file asset). The repo
    ships only this one compose file (root `compose.yaml`, aka
    `docker-compose.yml`) — no separate dev/prod or database variant to
    choose between, since Dockge has no database. Note the README also
    documents an "Advanced" alternative — a dynamically generated file
    served from `https://dockge.kuma.pet/compose.yaml?...` with custom
    port/stacksPath query params — but the static `master`-branch raw file
    above is the default/basic path and the more directly citable "the
    project's own repo" source, so that's what's recorded here.

version_health:
  latest_version: "1.5.0"
  latest_release_date: "2025-03-30"
  release_cadence: slowing
  eol_status: active
  notes: >
    Latest tagged release is 1.5.0 (2025-03-30) — about 16 months before
    today (2026-08-05) with no tagged release since. The `1` and `latest`
    Docker Hub tags still point at that same 1.5.0 build, over a year
    stale. However, commits to `master` continued well past that tag
    (feature work like container control buttons and resource-usage
    stats, plus an XSS fix, as recently as 2026-04-19, ~3.5 months before
    today), and a `nightly` image tag is rebuilt continuously (within the
    last day). So the project is not dormant or abandoned — it's the same
    author/pattern as Uptime Kuma — but the versioned release train has
    stalled for well over a year while development moved to
    nightly-only builds, which is a real slowdown worth calling out
    rather than "active".

catalogue_fit:
  categories: [infrastructure, developer-tools]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: [portainer]
  differentiation: >
    Dockge is narrowly focused on editing and operating docker-compose.yaml
    stacks directly (compose editor with terminal, .env editing,
    multi-agent remote stacks, git-style file layout under
    /opt/stacks) rather than being a general Docker API management console.
    `recipes/portainer/` already covers the broader "web GUI for
    Docker" space (images, volumes, networks, RBAC/teams) and, being a
    heavier full Docker/Swarm management tool, is a superset of what
    Dockge offers for the specific "manage my compose stacks" job. Note
    portainer currently ships `enabled: false` in this catalogue, so
    there is no live customer-facing redundancy today, only a structural
    overlap against a disabled recipe.
  usefulness: medium
  usefulness_rationale: >
    Genuinely useful for a customer who wants to run their own
    docker-compose stacks alongside AF recipes on the same Docker host
    and prefers a lightweight, purpose-built compose editor over
    Portainer's heavier full-Docker-management surface. Capped at medium
    because the value proposition is narrow (a nicer UI over `docker
    compose` commands) and it meaningfully overlaps an existing recipe's
    job, even though that recipe is currently disabled.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Dockge is a single-container app (no database) exposing one HTTP port
  (5001) — directly Traefik-compatible on dockge.<base_domain>. Like
  Uptime Kuma and Actual Budget (same author's pattern), it ships with no
  default or env-var-based credential: on first browser visit it presents
  a setup screen where the customer creates their own admin
  username/password directly in the app UI, so af-api needs to pass no
  customer-specific secret at all — this clears the current /compose
  constraint with zero blocking issues, same as those two recipes. The
  app does need a read/write mount of the Docker socket (same privileged
  mount class already accepted for portainer and wud) to manage
  compose stacks. It overlaps functionally with the already-cataloged
  (but disabled) portainer recipe — both are "web UI over Docker" tools —
  and its versioned release train has stalled for 16+ months (last tag
  1.5.0, 2025-03-30) even though master/nightly development is ongoing,
  so the stable Docker Hub tag customers would pin to is over a year old;
  neither is a blocking issue. Recommend build_now: mechanically
  installable today with zero blocking issues.
