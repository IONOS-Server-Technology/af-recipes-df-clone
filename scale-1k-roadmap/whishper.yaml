slug: whishper
name: Whishper
source_description: "Self-hosted Whisper transcription suite with translation and subtitle editor"

upstream:
  url: https://whishper.net
  repo_url: https://github.com/pluja/whishper
  license: AGPL-3.0
  docker_image: docker.io/pluja/whishper:v3.1.4

version_health:
  latest_version: "v3.1.4"
  latest_release_date: "2024-09-17"
  release_cadence: dormant
  eol_status: maintenance-only
  notes: >
    Today is 2026-08-05. Latest tag v3.1.4 was published 2024-09-17 —
    roughly 1 year 10.5 months ago. Release history before that was tight
    (v2.0.0 Oct 2023 through v3.1.4 Sep 2024: v3.1.0 Nov 2023, v3.1.1 Dec
    2023, v3.1.2 Jan 2024, v3.1.3 Jan 2024, v3.1.4 Sep 2024), but nothing
    has shipped on the main branch since. The repository is
    not archived, and the README carries an explicit maintainer notice:
    "I am working on a complete rewrite of the project. Progress on this
    can be seen at v4 branch. Consequently, this branch will not receive
    any new releases or updates." That is the project itself declaring
    the branch our recipe would have to pin (main/v3.x, the only branch
    with tagged Docker images) frozen — not abandonment exactly, but the
    supported artifact is explicitly in maintenance-only limbo while all
    real development moves to an unreleased v4 with no published image or
    ETA. Treating this as anything more active than "maintenance-only /
    dormant" would be misleading.

catalogue_fit:
  categories: [ai, productivity, media]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24 recipes does local audio/video transcription,
    translation, or subtitle editing. Ollama and Open WebUI cover local LLM
    inference generally but not Whisper-specific speech-to-text workflows;
    paperless-ai/paperless-ngx are document-OCR, not audio. Whishper's pitch
    (drop in a media file or URL, get searchable text/SRT/VTT plus an
    in-browser subtitle editor, fully offline) is a genuinely distinct
    capability versus anything currently shipping.
  usefulness: medium
  usefulness_rationale: >
    The use case (local, private transcription/subtitling) has real
    appeal, but the frozen-since-late-2024 v3 branch is a meaningful
    downgrade risk: no bugfixes, no security patches, and the maintainer
    has publicly signaled attention is elsewhere until an unreleased
    rewrite lands. Building on the stale branch now risks shipping (and
    then having to re-plumb) a recipe against an architecture the
    upstream author has already deprecated in spirit.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot:
    - basic_auth_password
  secrets_expressible_today:
    - secret: basic_auth_password
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Whishper is mechanically installable today: it's a single-container app
  (as of v3.0.0's consolidation, plus MongoDB and LibreTranslate sidecars)
  behind one HTTP port, ships no built-in login of its own, and can be
  fully closed off with a mandatory Traefik basic_auth gate projected from
  the customer's root password — no external API keys or OAuth needed to
  boot, with no blocking issues to installability. Recommend build_now.
  Separately, note the upstream pinnable branch has had no release in ~1
  year 10.5 months and the maintainer has explicitly frozen it in favor of
  an unreleased v4 rewrite (see version_health) — worth flagging to
  whoever schedules the build, but that is a staleness/prioritization
  concern, not an installability blocker.
