slug: medusa
name: Medusa
source_description: "Automatic Video Library Manager for TV shows with Plex and Jellyfin support"

upstream:
  url: https://github.com/pymedusa/Medusa
  repo_url: https://github.com/pymedusa/Medusa
  license: GPL-3.0
  docker_image: lscr.io/linuxserver/medusa

version_health:
  latest_version: "1.0.25"
  latest_release_date: "2025-11-12"
  release_cadence: slowing
  eol_status: active
  notes: >
    Latest tagged release (1.0.25) shipped 2025-11-12, about 9 months before
    today (2026-08-05) — prior tags (1.0.24, 1.0.23) landed within weeks of
    each other in Oct 2024, so the cadence has slowed sharply since. However
    the repo is not dormant: the last commit to master ("Update plex.py",
    #12204) landed 2026-05-17, about 2.5 months ago, so development continues
    between tagged cuts. linuxserver/medusa rebuilds the same 1.0.25 app
    version regularly for base-image/dependency updates (most recently ~7
    days before today per Docker Hub), which is packaging churn, not app
    version churn. Name is not ambiguous — pymedusa/Medusa is the only
    project of this name matching the Hostinger description (TV library
    management with Plex/Jellyfin support); not to be confused with the
    e-commerce platform "Medusa" (medusajs/medusa) or the offensive-security
    login-brute-forcer tool "Medusa".

catalogue_fit:
  categories: [media]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Medusa is a Sick Beard fork (sibling to Sonarr/SickChill/SickGear) that
    automates TV-show discovery, search, and download-client handoff, then
    hands finished files to a media server. Nothing in the current 24-recipe
    catalogue does episode-tracking/automated acquisition — this is a
    genuinely new "media *arr" category, not a duplicate of anything shipped.
  usefulness: medium
  usefulness_rationale: >
    Real demand exists (Sonarr-class tools are extremely popular self-hosted
    apps), but Medusa specifically is the weaker, slower-moving fork versus
    Sonarr — smaller community, sparser releases, and no evidence in the repo
    of a maintained official docker-compose/Kubernetes deployment story beyond
    community images. A recipe for this category would arguably be higher
    value built against Sonarr itself.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: ["basic-auth gate credential (Traefik)"]
  secrets_expressible_today:
    - secret: basic-auth gate credential (Traefik)
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_with_caveats

summary: >
  Medusa is mechanically installable today: single container
  (lscr.io/linuxserver/medusa), one HTTP port (8081), Traefik-friendly, no
  forced login of its own so a Traefik basic_auth gate (root-password
  projection) fully covers first-boot access control — no blocking secrets.
  The catalogue gap it fills (automated TV episode acquisition feeding
  Plex/Jellyfin) is real and currently empty, but Medusa itself is the
  slower-moving, less-adopted fork in its niche (last tagged release
  2025-11-12, ~9 months ago, though commits continue). Recommend
  build_with_caveats: worth having something in this category, but consider
  evaluating Sonarr as the primary candidate for this slot before committing
  build time to Medusa specifically.
