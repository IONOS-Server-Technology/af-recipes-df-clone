slug: jackett
name: Jackett
source_description: "Torrent tracker proxy translating queries for Sonarr, Radarr, and other automation tools"

upstream:
  url: https://github.com/Jackett/Jackett
  repo_url: https://github.com/Jackett/Jackett
  license: GPL-2.0
  docker_image: linuxserver/jackett (pin to a version tag, e.g. v0.24.2330-ls484 — do not follow upstream examples that use :latest)
  compose_file_url: null
  compose_file_notes: >
    Jackett/Jackett itself ships no Docker packaging at all — it's a .NET
    app distributed as native binaries; its README just points to
    LinuxServer.io as the maintainer of the Docker image. LinuxServer.io's
    docker-jackett repo (checked root tree and README) has no standalone
    docker-compose.yaml/.yml file anywhere — the only compose config is a
    YAML snippet embedded in README.md under "docker-compose (recommended)",
    generated from readme-vars.yml, using image tag `lscr.io/linuxserver/
    jackett:latest` (rolling, not version-pinned). Since there is no
    standalone fetchable compose file, and the image maintainer (LinuxServer.
    io) is itself a third party relative to the Jackett project, compose_file_url
    is left null rather than pointing at either the README or a
    community-maintained file.

version_health:
  latest_version: "v0.24.2330"
  latest_release_date: "2026-08-05"
  release_cadence: active
  eol_status: active
  notes: >
    Latest tag v0.24.2330 shipped 2026-08-05 (today). Preceding tags
    (v0.24.2327, v0.24.2323, v0.24.2315, v0.24.2307, v0.24.2304,
    v0.24.2297, v0.24.2292, v0.24.2288, v0.24.2277) land roughly daily
    through late July/early August 2026 — this is a CI-driven
    near-continuous-deployment cadence (indexer definitions break
    frequently as tracker sites change markup, so the project ships small
    fixes constantly). Repo is not archived; 18k+ commits and ongoing
    development activity. Clearly active, not dormant.

catalogue_fit:
  categories: [media, automation, downloads]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue touches torrent-indexer
    automation. Jackett fills a narrow, well-defined niche: it normalizes
    dozens of public/private tracker sites into a single Torznab/API
    endpoint that other tools query. Like autobrr and Bazarr, it is a
    piece of a larger pipeline (indexer -> Jackett -> Sonarr/Radarr ->
    download client) rather than a self-contained destination a customer
    would use on its own — none of Sonarr, Radarr, or a download client
    (qBittorrent/Deluge/Transmission) exist as AF recipes today, so a
    standalone Jackett install has nothing downstream to feed.
  usefulness: low
  usefulness_rationale: >
    Recognized, widely-used tool in the self-hosted media-automation
    community, but of the three related niches researched so far
    (autobrr, Bazarr, Jackett), Jackett is the most upstream/dependent
    link in the chain: its only output is search results for other
    "*arr" apps to consume, so in isolation — with no Sonarr/Radarr and
    no download client in the catalogue — it produces literally nothing
    a customer can act on directly (no library, no downloads, no
    subtitles). Usefulness is lower than autobrr (which at least feeds a
    download client directly) and lower than Bazarr (which augments an
    existing library once pointed at Sonarr/Radarr). Recommend deferring
    until/unless AF decides to build a full media-automation stack.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [basic_auth_password]
  secrets_expressible_today:
    - secret: basic_auth_password
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Jackett (via linuxserver/jackett) is a single-container app with a web
  UI on one HTTP port (9117), no database dependency — structurally as
  simple as uptime-kuma or WUD, reverse-proxy compatible behind Traefik.
  It ships with no admin password set by default; an operator can
  optionally set one through the web UI or API, but it is hashed with a
  salted SHA-512 scheme the platform's `generated_from` projection
  (argon2/bcrypt only) does not support, and there is no environment
  variable to preconfigure it at boot. The correct fix is the same
  pattern used for Adminer/WUD/Bazarr/Deluge: gate the whole app behind a
  required Traefik `basic_auth`, projected from the customer's root
  password, rather than relying on Jackett's own optional/unsupported
  password field. With that gate in place this is mechanically
  installable today with no blocking issues (installable_today: true,
  blocking_issues: []), so the recommendation is `build_now`. Jackett's
  real-world value depends on Sonarr/Radarr and a download client existing
  downstream, and none of those exist in the current catalogue today, but
  that is a fact about catalogue overlap/sequencing, not a mechanism
  blocker, so it does not affect this recommendation.
