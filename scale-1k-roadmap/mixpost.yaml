slug: mixpost
name: Mixpost
source_description: "Self-hosted social media scheduler with multi-account calendar and workspaces"

upstream:
  url: https://mixpost.app/
  repo_url: https://github.com/inovector/mixpost
  license: MIT
  docker_image: inovector/mixpost:v2.6.0

version_health:
  latest_version: "2.6.0"
  latest_release_date: "2026-03-16"
  release_cadence: slowing
  eol_status: active
  notes: >
    ~4.7 months since 2.6.0 as of today (2026-08-05) — the longest gap in
    the release history except one (v2.3.0 on 2025-06-06 to 2.4.0 on
    2025-11-13, ~5 months). Prior cadence was otherwise roughly every 1-3
    months (2.4.0 on 2025-11-13, 2.5.0 on 2026-02-24, 2.6.0 on 2026-03-16).
    The last commit to main is the 2.6.0 changelog update on 2026-03-16 —
    no commits since. Repo is not archived, has 3,490 stars, 33 open issues,
    and issues are still being filed through June 2026, but there is no
    visible maintainer merge activity in the last ~4.7 months to confirm
    continued active development. Not flagging as maintenance-only/archived
    yet — no explicit EOL or maintenance-mode announcement, and the vendor
    (Inovector) still markets it as a live product with a paid Pro tier —
    but this is a project to re-check in a few months if the gap keeps
    growing.

catalogue_fit:
  categories: [productivity, marketing]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue does social media content
    scheduling/publishing. n8n could technically be wired up to post to
    social APIs via generic HTTP workflows, but that's a general automation
    tool requiring the customer to build the integration themselves, not a
    purpose-built calendar/scheduler UI. Mixpost fills a genuinely new
    "self-hosted Buffer alternative" niche for a small-business/marketing
    audience.
  usefulness: medium
  usefulness_rationale: >
    Real, distinct demand (self-hosted social scheduling is a common
    Buffer/Hootsuite-replacement search), but the free/Lite edition only
    supports Twitter/X, Facebook, and Mastodon out of the box — Instagram,
    LinkedIn, and TikTok require the paid Pro tier, which narrows appeal for
    a customer expecting a full Buffer replacement from the free recipe.
    Each connected social account also needs its own OAuth app registration
    (e.g. a Meta Developer app for Facebook) configured post-install by the
    customer, which is extra setup friction outside the recipe itself, though
    not a blocker for installability since it happens after first boot.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [traefik_basic_auth_gate]
  secrets_expressible_today:
    - secret: traefik_basic_auth_gate
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_with_caveats

summary: >
  Mixpost ships an official single-container Docker image (inovector/mixpost,
  pinned tags back to v1.1.0, current v2.6.0) alongside MySQL 8 and Redis —
  a three-service stack structurally similar to recipes/paperless-ngx and
  recipes/n8n, with one reverse-proxy-friendly HTTP port and the queue
  worker/scheduler running inside the app container itself (no extra raw
  ports). It ships with a fixed, undocumented-as-configurable default admin
  login (admin@example.com / changeme per official docs) rather than an
  env-var-driven first-boot admin bootstrap — the supported artisan flow
  (`mixpost-auth:create`) is interactive and needs a plaintext password we
  never have, so generated_from cannot project the customer's root-password
  hash into it. Per the schema's guidance on fixed/default admin credentials,
  this is not a structural blocker on its own: gating the whole app behind
  Traefik basic_auth (root-password-derived) makes that gate the real auth
  boundary, with the unchanged default Mixpost login sitting safely behind
  it — the same pattern used for MindsDB. That makes it mechanically
  installable today with a caveat worth flagging to a human reviewer:
  release cadence has visibly slowed (~4.7 months since the last tag, the
  longest gap on record besides one prior 5-month stretch) and the free
  edition's social-network coverage (X/Facebook/Mastodon only) is narrower
  than what "social media scheduler" implies without the paid Pro tier.
  Recommend build_with_caveats.
