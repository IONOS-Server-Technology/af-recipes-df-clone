slug: featbit
name: FeatBit
source_description: "Self-hosted feature flag platform, an open-source LaunchDarkly alternative"

upstream:
  url: https://www.featbit.co/
  repo_url: https://github.com/featbit/featbit
  license: MIT (core platform; a subset of "Professional"-tier features requires a paid license key — not evaluated here since the recipe would target the free Standalone/Standard deployment)
  docker_image: featbit/featbit-api-server:5.4.4 (also requires featbit/featbit-ui, featbit/featbit-evaluation-server, featbit/featbit-data-analytics-server — see catalogue_fit; upstream's own compose file pins none of these to a tag, using :latest throughout)

version_health:
  latest_version: "5.4.4"
  latest_release_date: "2026-07-10"
  release_cadence: active
  eol_status: active
  notes: >
    Latest tag 5.4.4 published 2026-07-10, about 4 weeks before today
    (2026-08-05); it was a same-day follow-up patch to 5.4.3 (also
    2026-07-10) fixing a version-display bug. Release history is dense
    and regular: 5.4.2 (2026-06-17), 5.4.1 (2026-06-12), 5.4.0
    (2026-06-03), 5.3.6 (2026-05-22), 5.3.5 (2026-05-17), 5.3.4
    (2026-05-14), 5.3.3 (2026-04-24), 5.3.2 (2026-04-20) — roughly weekly
    to bi-weekly cadence for months. Repo is not archived, has an active
    Discord community and regular commits on main. Clearly an active,
    well-maintained project.

catalogue_fit:
  categories: [developer-tools]
  has_web_ui: true
  reverse_proxy_compatible: false
  overlaps_with: []
  differentiation: >
    No existing recipe covers feature-flag/experimentation infrastructure;
    this is genuinely new ground for developer-facing self-hosted tooling
    that a customer would plug their own applications' SDKs into (similar
    audience shape to n8n or Gitea — infrastructure a developer builds on,
    not an end-user product).
  usefulness: medium
  usefulness_rationale: >
    Feature flags / LaunchDarkly-alternative is a real, recognizable
    category with no catalogue overlap, so it would add distinct value.
    Usefulness is capped at medium rather than high because of the
    architectural mismatch described below — as currently deployed it is
    not a good fit for our single-domain-per-recipe Traefik model.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [basic_auth_password]
  secrets_expressible_today: []
  blocking_issues:
    - >
      FeatBit is not a single-HTTP-surface app the way our recipes assume.
      Upstream's own compose file (ui, api-server, evaluation-server,
      da-server, postgresql — 5 containers even in the "Standalone"
      deployment tier) runs the UI as a browser SPA that calls
      API_URL and EVALUATION_URL as separate absolute origins configured
      at container-start time; there is no documented path-prefix/BASE_PATH
      option for api-server or evaluation-server to sit behind a single
      shared hostname via path-based Traefik routing. Per rfc/002-recipe-
      rules.md ("Declare at most one HTTP port per recipe: only the first
      gets a router"), only one of these services could ever get a
      Traefik router under a recipe — the other(s) would need their own
      publicly resolvable hostname or port, which the platform's
      one-subdomain-per-recipe (`<slug>.<base_domain>`) model doesn't
      support today. This is a structural reverse-proxy incompatibility,
      not merely a multi-container recipe (contrast with immich, a
      similarly multi-service stack that exposes exactly one public HTTP
      port).
    - >
      Separately, the initial admin login is a hardcoded seed-data
      credential (test@featbit.com / 123456) baked into the Postgres
      init scripts, not exposed via any documented env var on api-server
      or the UI. Per the schema this alone would not block installability
      — it could be gated behind Traefik basic_auth like other apps with
      fixed default credentials (hence secrets_required_at_first_boot
      names basic_auth_password) — but secrets_expressible_today is left
      empty because that gate can't actually be wired up: Traefik
      basic_auth on a single router would only cover the UI's origin,
      leaving the separately-addressed api-server/evaluation-server
      origins unprotected, so the mechanism doesn't reach the multi-origin
      surface. The multi-origin problem above is the real blocker, not the
      secret-input mechanism.
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  FeatBit is an active, well-maintained, MIT-licensed feature-flag platform
  that would fill a genuine gap in the catalogue (no existing recipe covers
  this category) and ships a web UI. However, its deployment architecture
  — a browser SPA calling separate API and evaluation-server origins
  directly, with no documented single-hostname/path-prefix mode — conflicts
  with the platform's one-public-HTTP-port-per-recipe Traefik model, not
  just with the "no arbitrary secret input" constraint. Its hardcoded
  default admin login would otherwise be handled cleanly via Traefik
  basic_auth, but that doesn't resolve the underlying multi-origin problem.
  Not recommended to build now; revisit if the platform gains a way to
  expose multiple HTTP services under one recipe (e.g. path-based routing
  with app-side base-path support, or multiple subdomains per recipe), or
  if a future FeatBit release adds a reverse-proxy-friendly single-origin
  mode.
