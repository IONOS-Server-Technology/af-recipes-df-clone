slug: baserow
name: Baserow
source_description: "Open-source no-code database and Airtable alternative for teams"

upstream:
  url: https://baserow.io/
  repo_url: https://github.com/baserow/baserow
  license: "MIT (core); premium/enterprise add-on modules under a separate proprietary license"
  docker_image: baserow/baserow

version_health:
  latest_version: "2.3.3"
  latest_release_date: "2026-07-21"
  release_cadence: active
  eol_status: active
  notes: >
    Latest tag 2.3.3 published 2026-07-21, ~2 weeks before today
    (2026-08-05). Release history shows a steady cadence of patch/minor
    releases roughly every 1-6 weeks (2.3.2 2026-07-15, 2.3.1/2.3.0
    2026-07-10, 2.2.2 2026-04-28, 2.2.1 2026-04-22, 2.2.0 2026-04-14, three
    2.1.x releases in Feb-Mar 2026). GitHub repo `pushed_at` is
    2026-08-05 (today), not archived, 5.5k stars. Docker Hub `develop-latest`
    tag was also updated today. No dormancy signal — this is an actively
    maintained project.

catalogue_fit:
  categories: [productivity, database]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    No recipe in the current 24-app catalogue is a no-code
    database/spreadsheet-hybrid tool. The closest neighbors by "structured
    data + team collaboration" spirit are n8n (workflow automation, not
    data storage) and paperless-ngx (document archive, not a general
    database builder). Baserow would be a genuinely new category —
    self-hosted Airtable-style table/database builder with forms, views,
    and API access — rather than a duplicate of anything already shipped.
  usefulness: high
  usefulness_rationale: >
    Airtable-alternative no-code databases are a well-known self-hosting
    draw with a distinct audience (teams building internal tools/trackers)
    from anything else in the catalogue, and the upstream is healthy and
    actively developed.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [SECRET_KEY, DATABASE_PASSWORD, REDIS_PASSWORD]
  secrets_expressible_today:
    - secret: SECRET_KEY
      mechanism: server_generated_no_customer_input
    - secret: DATABASE_PASSWORD
      mechanism: server_generated_no_customer_input
    - secret: REDIS_PASSWORD
      mechanism: server_generated_no_customer_input
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Baserow's official all-in-one image (baserow/baserow, embedding Postgres,
  Redis, backend, web-frontend and Caddy in one container) exposes a single
  HTTP(S) port and needs only three boot-time secrets (SECRET_KEY,
  DATABASE_PASSWORD, REDIS_PASSWORD), none of which are customer-facing —
  all can be server-generated with zero customer input, same as the
  Postgres/Redis passwords in existing recipes. Baserow has no fixed or
  env-var-driven admin credential to project at all: like the already-
  shipped n8n recipe, the first person to visit the domain completes an
  interactive signup and becomes the instance admin, so there is no
  root-password projection needed. Upstream is actively maintained (release
  2 weeks old, repo pushed to today) and MIT-licensed at the core, filling a
  genuine no-code-database category gap the catalogue currently lacks.
  Recommend build_now.
