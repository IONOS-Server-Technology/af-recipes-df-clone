slug: orangehrm
name: OrangeHRM
source_description: "Open-source HR platform for employee, leave, and recruitment management"

upstream:
  url: https://www.orangehrm.com/
  repo_url: https://github.com/orangehrm/orangehrm
  license: "GPL-3.0 (GPL-2.0-or-later prior to v5.6, converted to GPLv3 in v5.6)"
  docker_image: orangehrm/orangehrm
  compose_file_url: null
  compose_file_notes: >
    No official docker-compose file exists for deploying the app. The
    project's own wiki install guide (github.com/orangehrm/orangehrm/wiki/
    How-to-Install-via-Docker-image) documents only bare `docker run`
    commands for the web (orangehrm/orangehrm) and DB (mariadb:10.4)
    containers, wired together manually via container IPs — no compose
    file is linked or embedded anywhere in that guide, the README, or the
    Docker Hub page. The orangehrm/orangehrm-prod-environment,
    orangehrm-dev-environment, orangehrm-test-environment, and
    orangehrm-os-dev-environment repos under the orangehrm GitHub org do
    each contain a docker-compose.yml, but these are internal CI/QA
    tooling for building and testing OrangeHRM's own environment images
    (they mount local ./html source trees, use orangehrm-environment-images
    build artifacts rather than the published orangehrm/orangehrm app
    image, and are documented as such) — not a self-host deployment
    artifact, so they don't qualify as "official" for this purpose despite
    living in the official org. Community-authored compose files exist
    (e.g. azwanazlan/orangehrm-docker) but are not adopted here per the
    task's guidance to not treat community files as official.
  # OrangeHRM Inc. also sells a commercial "Advanced"/PRO product (per-
  # employee-per-month SaaS or self-managed) with modules like Performance,
  # Compensation, Surveys, an AI assistant ("Citra"), REST API access, and
  # payroll/ADP/QuickBooks connectors. Web search results for "OrangeHRM
  # 2025/2026 releases" surface that product's announcements (e.g. "8.0",
  # "Citra AI", "v6.5.11") alongside the open-source repo's own tags —
  # those are a different codebase/offering, not releases of
  # github.com/orangehrm/orangehrm. This analysis is scoped to the free
  # "Starter" open-source edition matching Hostinger's description and the
  # orangehrm/orangehrm Docker image, verified via the GitHub Releases API
  # (see version_health) rather than general web search summaries.

version_health:
  latest_version: "v5.9"
  latest_release_date: "2026-06-28"
  release_cadence: active
  eol_status: active
  notes: >
    Verified via `api.github.com/repos/orangehrm/orangehrm/releases`
    (general web search results for this project were unreliable/
    inconsistent about dates, so the raw API timestamps were used
    instead). v5.9 published 2026-06-28T23:46:59Z, ~5.5 weeks before this
    analysis (2026-08-05). Recent cadence: v5.6 (2024-01-28) -> v5.6.1
    (2024-03-27, ~2mo) -> v5.7 (2024-07-19, ~4mo) -> v5.8 (2025-11-21, a
    ~16-month gap) -> v5.8.1 (2026-04-06, ~4.5mo) -> v5.9 (2026-06-28,
    ~3mo). The one long gap (mid-2024 to late-2025) is real, but the last
    three releases have landed on a normal 3-5 month rhythm and the repo
    shows continuous commit activity (7,900+ commits, dozens of open
    issues/PRs actively triaged), so this reads as active, not slowing or
    dormant. Docker Hub's orangehrm/orangehrm image tracks releases
    closely: 5.9/latest pushed the same day as the GitHub tag.

catalogue_fit:
  categories: [human-resources, business]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue covers HR/people-management
    (employee records, leave/time tracking, recruitment pipeline). The
    closest adjacent gap is apps-gaps/akaunting.yaml (business accounting),
    a different function entirely. OrangeHRM would open a genuinely new
    business-software category for the catalogue.
  usefulness: high
  usefulness_rationale: >
    HR record-keeping (PII: salaries, leave, performance, applicant data)
    is a strong self-hosting/compliance draw for small-to-mid businesses,
    and the open-source "Starter" edition includes Employee Info, Leave,
    Time, and Recruitment modules out of the box, matching Hostinger's
    description exactly. The free edition is capped mainly by missing
    premium modules (Performance, Compensation, Surveys, an AI assistant)
    and by no REST API/payroll-connector access — those are paid-tier
    upsells, not artificial usage caps like Akaunting's BSL limits — so it
    remains a fully usable, unrestricted free product for its target
    audience (guidance suggests under ~50 employees).

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [BASIC_AUTH_GATE, WIZARD_DB_CONNECTION, WIZARD_ADMIN_ACCOUNT]
  secrets_expressible_today:
    - secret: BASIC_AUTH_GATE
      mechanism: traefik_basic_auth
  blocking_issues:
    - >
      A Traefik basic_auth gate (generated_from a hash of the customer's
      root password) can stop a random internet visitor from reaching the
      wizard before the customer does, but it does not solve the
      underlying problem: the wizard's DB-connection screen (host/port/
      name/user/password) and admin-account screen both require values
      typed in by whoever completes it, and there is no channel today for
      install.sh to hand a server-generated DB password to "whoever that
      is" — the customer would have to invent their own DB credentials
      by hand, which the app's own MariaDB container was never told to
      expect. WIZARD_DB_CONNECTION and WIZARD_ADMIN_ACCOUNT are listed as
      required but have no expressible mechanism.
    - >
      The official orangehrm/orangehrm image has no DB-config env vars at
      all — the Dockerfile (verified against github.com/orangehrm/orangehrm
      main branch) sets no ORANGEHRM_*/DB_* ENV and has no custom
      ENTRYPOINT/CMD; it's a bare php:8.3-apache image with the app code
      baked in. There is no install.sh-wireable channel for DB connection
      details, so `generated_from`/server-generated-secret projection onto
      a DB credential (as done for paperless-ngx-style apps) is not
      available for this image.
    - >
      Docker Hub's own README says to "install OrangeHRM using the web
      installer" — this is the only documented setup path for the image.
      The browser wizard (Fresh Install) asks for BOTH the DB connection
      (host/port/name/user/password) AND the admin account in the same
      flow, unlike Uptime Kuma's wizard which only asks for the admin
      account. Whoever visits first fills in both; there's no server-side
      pre-fill of DB details and no way to gate only the admin-creation
      step, so a first-boot race lets a random visitor set the DB
      credentials and admin login together.
    - >
      Two alternate non-wizard install paths exist and neither fits the
      current mechanism either: the deprecated installer/cli_install.php
      reads a static installer/cli_install_config.yaml that ships with a
      hardcoded default admin password (Ohrm@1423) and hardcoded default
      DB root/root credentials — usable only if the entire app sits behind
      a mandatory Traefik basic_auth gate (per SCHEMA.md's guidance on
      fixed/unchangeable default credentials), which is not how this
      analysis is currently scoped. The newer `php installer/console
      install:on-new-database` command explicitly refuses non-interactive
      execution (`if (!$input->isInteractive()) { ... return
      self::INVALID; }` in installer/Command/InstallOnNewDatabaseCommand.php),
      so it cannot be scripted by install.sh at all.
    - >
      A viable path would be install.sh pre-generating installer/config/Conf.php
      directly from the Conf.tpl.php template (host/port/name/user/pass
      filled with a server-generated DB password) and running the DB
      migrations install.sh would otherwise leave to the wizard — but this
      bypasses the installer entirely, is not exercised by any upstream CI
      or documented flow, and would need to be re-validated against
      Conf.tpl.php's exact placeholder names and the migration invocation
      on every OrangeHRM release. That's a materially more fragile,
      unsupported-by-upstream mechanism, not a like-for-like match to the
      documented env-var pattern used for paperless-ngx.
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  OrangeHRM ships as a single web container (orangehrm/orangehrm, PHP/
  Apache) with no DB-config env vars and no scriptable installer: the
  Dockerfile bakes in the app code with no ENTRYPOINT, the browser-based
  web installer (the only path Docker Hub's README documents) asks for
  both DB connection details and the admin account in one first-visit
  wizard with no server-side pre-fill, the deprecated static-YAML CLI
  installer ships hardcoded default credentials (admin password
  Ohrm@1423, DB root/root) that would need a whole-app Traefik basic_auth
  gate to be acceptable, and the new interactive installer console command
  explicitly refuses non-interactive execution. None of these match the
  current `generated_from`/env-var projection mechanism used for
  paperless-ngx-style multi-container apps, and there's no channel today
  to hand the wizard a server-generated DB password before a customer (or
  an internet-facing race) reaches it. Pinned Docker tags exist and track
  releases closely, and the project remains actively released (last tag
  ~5.5 weeks old) despite one unusually long historical gap in 2024-2025,
  so this is not an EOL/version concern. It fills a real HR/people-
  management gap in the catalogue and would be worth building once
  install.sh can either drive the DB connection step of the wizard
  programmatically or pre-generate Conf.php directly — but as things
  stand today it is blocked on the installer having no scriptable,
  non-interactive DB-setup path.
