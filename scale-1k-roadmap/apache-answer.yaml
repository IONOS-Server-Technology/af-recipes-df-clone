slug: apache-answer
name: Apache Answer
source_description: "Open-source Q&A platform for team knowledge sharing and community building"

upstream:
  url: https://answer.apache.org/
  repo_url: https://github.com/apache/answer
  license: Apache-2.0
  docker_image: apache/answer:2.0.2
  compose_file_url: https://raw.githubusercontent.com/apache/answer/v2.0.2/docker-compose.yaml
  compose_file_notes: >
    Official file, shipped at the repo root (github.com/apache/answer/
    blob/main/docker-compose.yaml). Only one variant exists — single
    `answer` service, apache/answer image, port 9080:80, one named volume,
    no external DB (SQLite by default), matching the summary below.
    Recorded URL is version-pinned to the v2.0.2 tag (matching
    docker_image above) rather than the rolling main-branch raw link, so
    it won't silently change out from under this recipe; re-pin the tag
    when docker_image is bumped.

version_health:
  latest_version: v2.0.2
  latest_release_date: "2026-07-21"
  release_cadence: active
  eol_status: active
  notes: >
    Graduated from Apache Incubator to a Top-Level Project on 2024-12-18.
    Repo pushed 2026-07-30 (6 days before this analysis). Three stable
    releases in 2026 so far (v2.0.0 Feb, v2.0.1 May, v2.0.2 Jul) plus RC
    tags for each, a steady ~2-3 month cadence. 15.6k GitHub stars, 102
    open issues actively triaged. No signs of slowdown or abandonment.

catalogue_fit:
  categories: [knowledge-base, community, collaboration]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    None of the 24 current recipes cover Q&A/community-forum or structured
    knowledge-base use cases (closest neighbors are paperless-ngx/paperless-ai
    for document management and gitea/opengist for code — different problem).
    Apache Answer fills a genuinely new category: internal team knowledge
    sharing or a public-facing help-center/community forum, backed by a
    known ASF brand.
  usefulness: medium
  usefulness_rationale: >
    Real, distinct demand (StackOverflow-style internal wikis / support
    forums are a common self-host ask) but a smaller and more specialized
    audience than general-purpose tools already in the catalogue.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Single-container app (apache/answer image, port 80 internally, one data
  volume, SQLite by default — no external DB or env vars required to boot),
  making it as simple to package as uptime-kuma or vaultwarden and fully
  Traefik-compatible. Admin account setup (email/password) happens through
  the app's own first-run web install wizard when a browser first hits the
  domain, the same pattern already shipped for immich — so no customer
  secret needs to pass through /compose at all, and there is no platform
  blocker. Actively maintained ASF top-level project with a healthy release
  cadence. Recommend building this recipe: it's mechanically straightforward
  and fills a category (Q&A / knowledge base) the catalogue currently lacks,
  though expected customer demand is more niche than our general-purpose
  recipes.
