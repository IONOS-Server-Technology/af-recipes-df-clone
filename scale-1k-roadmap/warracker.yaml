slug: warracker
name: Warracker
source_description: "Self-hosted warranty tracker with expiration alerts and document storage"

upstream:
  url: https://github.com/sassanix/Warracker
  repo_url: https://github.com/sassanix/Warracker
  license: AGPL-3.0
  docker_image: ghcr.io/sassanix/warracker/main

version_health:
  latest_version: "1.0.2"
  latest_release_date: "2025-10-30"
  release_cadence: active
  eol_status: active
  notes: >
    1.0.2 released 2025-10-30, about 9 months before today (2026-08-05).
    That gap looks large in isolation, but the tag history immediately
    before it is dense: 1.0.1 (2025-10-27), 1.0.0 (2025-10-25), and a run of
    beta tags through September/August 2025 (0.10.1.14-beta 2025-10-06,
    0.10.1.13-beta 2025-09-29, 0.10.1.12-beta 2025-09-18, 0.10.1.11-beta
    2025-09-07, 0.10.1.10-beta 2025-08-30) — effectively weekly cadence
    right up to the 1.0.0 stable milestone. The repo is not archived, has
    ~1.5k stars, 421 commits, and 49 open issues still being triaged, so the
    project reads as alive; the ~9-month quiet stretch since 1.0.2 looks
    more like a post-1.0-milestone lull than abandonment, but a reviewer
    should re-check for a newer tag before committing to a pinned version,
    since 9 months with zero tags is a meaningfully longer gap than this
    project's own history up to that point.

catalogue_fit:
  categories: [productivity, document-management, home-inventory]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue tracks physical-product
    warranties/receipts with expiration alerts — Paperless-ngx is general
    scanned-document management with no warranty-specific expiration
    logic, and no other recipe covers this niche. Warracker adds a
    narrow but concrete household/consumer use case: log a purchase,
    attach the receipt/document, get notified (email, Discord, Slack, or
    any Apprise-supported channel) before the warranty lapses, with CSV
    import/export and OIDC SSO on top.
  usefulness: medium
  usefulness_rationale: >
    Clear, easy-to-explain consumer use case with no catalogue overlap, but
    it's a narrower/more personal-life niche than the developer-tooling and
    infra-monitoring apps that dominate the current catalogue, so demand is
    likely lower-volume than, say, Uptime Kuma or n8n. Medium rather than
    high because of that narrower target audience combined with the
    upstream tempo caveat above.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot:
    - "Traefik basic-auth gate credential (protects the unauthenticated first-run signup page — Warracker has no admin-account env var; the first account anyone registers through the UI automatically becomes the Admin account)"
    - POSTGRES_PASSWORD
    - FLASK_SECRET_KEY
  secrets_expressible_today:
    - secret: "Traefik basic-auth gate credential"
      mechanism: traefik_basic_auth
    - secret: POSTGRES_PASSWORD
      mechanism: server_generated_no_customer_input
    - secret: FLASK_SECRET_KEY
      mechanism: server_generated_no_customer_input
  blocking_issues: []
  installable_today: true
  recommendation: build_with_caveats

summary: >
  Warracker is a Python/Flask + PostgreSQL warranty tracker with an
  official prebuilt image (ghcr.io/sassanix/warracker/main) and Nginx
  fronting the app on a single HTTP port (8005 externally in upstream's
  compose, 80 inside the container) — structurally close to Paperless-ngx
  or n8n (app + Postgres, single web port, fully reverse-proxy compatible
  behind Traefik). It has no environment variable to pre-seed an admin
  account; instead "the first account created becomes the Admin account"
  via an open signup page, the same pattern already handled in this
  catalogue via Traefik basic_auth (Bludit, An Otter Wiki) — gate that
  signup page with a customer-root-password-derived basic-auth credential
  so a stranger can't register and claim admin first. Every other secret
  (Postgres password, Flask session secret key) is a patternless
  server-generated value with no customer input needed; SMTP and OIDC SSO
  are optional extras, not required at first boot. Nothing structurally
  blocks it under the current /compose constraint. The main caveat is
  upstream tempo: the project is clearly active (1.5k stars, ongoing
  commits/issue triage) but has gone ~9 months without a new tagged
  release since 1.0.2, its longest gap yet, so re-verify for a newer
  release before pinning. Recommend building with caveats.
