slug: yopass
name: Yopass
source_description: "Encrypted one-time secret sharing via self-destructing links"

upstream:
  url: https://yopass.se
  repo_url: https://github.com/jhaals/yopass
  license: Apache-2.0 (core); newer features — OIDC auth, custom theming,
    audit logging, read receipts, webhooks — are gated behind a paid
    commercial license layered on top of the same repo/image
  docker_image: jhaals/yopass

version_health:
  latest_version: "14.8.0"
  latest_release_date: "2026-07-28"
  release_cadence: active
  eol_status: active
  notes: >
    Very active release cadence: 14.0.0 through 14.8.0 shipped between
    2026-05-28 and 2026-07-28, roughly one tagged release every 1-2 weeks,
    with 14.8.0 only about 8 days before today (2026-08-05). No sign of
    slowdown, archival, or EOL — commit history and PRs are ongoing.

catalogue_fit:
  categories: [security, productivity]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Yopass solves a different problem than anything already in the
    catalogue: ephemeral, self-destructing one-time secret sharing (e.g.
    "send me the API key" over Slack/email safely) rather than persistent
    credential storage (Vaultwarden). No existing recipe covers transient
    secret transmission.
  usefulness: medium
  usefulness_rationale: >
    A genuinely useful, low-friction utility for anyone regularly sharing
    passwords/tokens with teammates or clients, and it is extremely
    lightweight (two tiny containers, ~35MB image). Usefulness is capped at
    medium rather than high because it is a narrow single-purpose tool
    compared to broader platforms elsewhere in the catalogue, and its core
    value proposition (anonymous one-time links) is intentionally
    account-free, so there isn't much for a customer to configure or grow
    into over time.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Yopass is a two-container stack (jhaals/yopass web/API server + Memcached
  as the ephemeral secret store, per upstream's own
  deploy/docker-compose/insecure example) exposing a single HTTP port,
  cleanly reverse-proxy-compatible behind Traefik on yopass.<base_domain> —
  structurally similar to Uptime Kuma's single-public-port pattern, just
  with a small backing cache service like n8n's Postgres sidecar. It needs
  no customer-supplied secret at first boot at all: the free/open-source
  tier has no built-in accounts or admin login by design (secrets are
  encrypted client-side and shared via a one-time link containing the
  decryption key in the URL fragment — the app itself never sees plaintext
  and there is nothing for a customer to log into). This clears the current
  /compose constraint with zero blocking issues. The project is actively
  maintained with a fast release cadence, has no overlap with the existing
  catalogue, and is small and cheap to run, making it a solid build-now
  candidate — note only that the more advanced features (OIDC auth, audit
  logging, webhooks, read receipts) are commercially licensed add-ons not
  included in the free image, so the recipe would ship core secret-sharing
  functionality only.
