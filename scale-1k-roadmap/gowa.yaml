slug: gowa
name: GoWA
source_description: "WhatsApp REST API and web interface for multi-device messaging automation"

upstream:
  url: https://github.com/aldinokemal/go-whatsapp-web-multidevice
  repo_url: https://github.com/aldinokemal/go-whatsapp-web-multidevice
  license: MIT
  docker_image: aldinokemal2104/go-whatsapp-web-multidevice
  compose_file_url: https://raw.githubusercontent.com/aldinokemal/go-whatsapp-web-multidevice/main/docker-compose.yml
  compose_file_notes: >
    The repo ships exactly one docker-compose.yml, at its root, and it is
    a rolling reference to the default branch (main) — not version-pinned,
    no per-release compose asset exists. That file is the "build from
    source" dev variant only: it sets `build: context: . /
    dockerfile: ./docker/golang.Dockerfile` and does not reference the
    published aldinokemal2104/go-whatsapp-web-multidevice image at all, so
    it is not directly usable as-is for a recipe that should pull a
    pre-built image. The README's "Production Mode REST (docker compose)"
    section shows the actual production-oriented compose (using either
    Docker Hub aldinokemal2104/go-whatsapp-web-multidevice or GHCR
    ghcr.io/aldinokemal/go-whatsapp-web-multidevice, both untagged/latest)
    but only as an inline markdown snippet the user is told to create
    themselves — it is not a file the project publishes/hosts, so it
    doesn't qualify as an official compose_file_url on its own. Recorded
    the root docker-compose.yml as the official file per the rules (an
    actual repo file over a docs page), while noting it is the
    build-from-source variant, not the pre-built-image variant the
    README's embedded snippet uses.

version_health:
  latest_version: "v9.0.0"
  latest_release_date: "2026-07-19"
  release_cadence: active
  eol_status: active
  notes: >
    v9.0.0 shipped 2026-07-19, about 17 days before today (2026-08-05).
    Recent tag history is dense and regular: v8.11.0 (2026-07-13), v8.10.0
    (2026-07-03), v8.9.0 (2026-06-27), v8.8.0 (2026-06-19), v8.4.0
    (2026-04-18), going back to v7.3.1 (2025-07-26) — a sustained
    weekly-to-biweekly cadence for over a year, not a burst. Repo is not
    archived, has 4.4k stars, 1.1k forks, and only 9 open issues (fast
    triage). This is clearly one of the more actively maintained
    single-maintainer Go projects we've evaluated. Note: repo name is
    "go-whatsapp-web-multidevice"; "GoWA" is the project's own short
    branding for the same repo (confirmed via its README/release notes),
    not a separate or ambiguous upstream.

catalogue_fit:
  categories: [messaging, automation]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    No recipe in the current 24-recipe catalogue provides WhatsApp
    messaging/automation connectivity. GoWA ships a REST API plus a bundled
    dashboard (gowa-ui) for QR-code device pairing and chat management, and
    would pair naturally with the existing n8n recipe (workflows sending/
    receiving WhatsApp messages) similar to how a customer might use it
    with Evolution API or Evolution Go — two other WhatsApp-automation
    tools already analyzed in this apps-gaps set
    (apps-gaps/evolution-api.yaml, apps-gaps/evolution-go.yaml). Both of
    those are blocked_on_platform on external vendor license activation;
    GoWA has no such gate, making it the more immediately viable pick to
    cover this messaging-automation gap.
  usefulness: medium
  usefulness_rationale: >
    WhatsApp business/chatbot automation is a real, popular self-hosting
    use case with clear customer pull (frequently paired with n8n).
    Capped at medium rather than high because it's a narrower,
    single-purpose integration tool rather than broad general-audience
    software, and its core value (WhatsApp Web multi-device session
    pairing) is inherently dependent on WhatsApp's own anti-automation
    enforcement, which is outside our and upstream's control.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [basic_auth_gate_credential]
  secrets_expressible_today:
    - secret: basic_auth_gate_credential
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  GoWA is a single-container, single-port (3000) Go app with a bundled web
  dashboard, no external database, and no third-party API key or OAuth
  requirement — device pairing happens entirely via an in-app WhatsApp QR
  scan after login, which needs no secret from our provisioning flow. Its
  own optional APP_BASIC_AUTH is a plaintext user:pass compare (not
  hash-compatible with generated_from), so the recipe should leave it unset
  and put the actual auth boundary in front via Traefik basic_auth (root-
  password projection), exactly the pattern already used for apps with no
  built-in login. Combined with an unusually consistent weekly-to-biweekly
  release cadence and a genuine gap in the current catalogue (no WhatsApp
  automation tool today, and the two comparable candidates
  evolution-api/evolution-go are both blocked on vendor license
  activation), GoWA is installable today and a strong candidate to build
  now.
