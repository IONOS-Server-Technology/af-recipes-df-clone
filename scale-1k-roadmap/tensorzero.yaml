slug: tensorzero
name: TensorZero
source_description: "Open-source LLMOps gateway with built-in observability and prompt optimization"

upstream:
  url: https://www.tensorzero.com/
  repo_url: https://github.com/tensorzero/tensorzero
  license: "Apache-2.0"
  docker_image: tensorzero/gateway

version_health:
  latest_version: "2026.6.0"
  latest_release_date: "2026-06-04"
  release_cadence: dormant
  eol_status: archived
  notes: >
    The GitHub repository was archived by the owner on 2026-06-12 and is now
    read-only — no commits, issues, or PRs are possible anymore. 2026.6.0
    (2026-06-04) is the final release, itself a security fix for a
    high-risk vulnerability in the TensorZero Gateway (GHSA-824w-x939-6cmc).
    Per public reporting, the company (raised $7.3M, returned unspent
    capital to investors) shut down because the commercial layer built on
    top of the OSS gateway never reached sustainable product-market fit;
    the founders explicitly stopped maintaining the open-source project
    when they wound down. As of today (2026-08-05), that is under 2 months
    since the archive date — this is a fresh EOL, not a stale one, but it
    is unambiguous: no security patches, no LLM-provider API updates, no
    bug fixes will ever ship again for this project.

catalogue_fit:
  categories: [ai, developer-tools, observability]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue is an LLM-gateway/LLMOps
    product. open-webui + ollama is a local-model chat front-end, not a
    multi-provider API gateway with observability, evaluation, and
    experimentation features. TensorZero would have filled a real gap for
    customers building their own AI applications against hosted model
    APIs (OpenAI, Anthropic, Bedrock, etc.) who want a self-hosted
    logging/routing layer in front of them, rather than customers who just
    want to chat with a model in a browser.
  usefulness: low
  usefulness_rationale: >
    The underlying idea (self-hosted LLM gateway + observability) is
    useful and would have been a good differentiator, but shipping a
    recipe on top of an archived, unmaintained project handles security
    risk to the customer for no offsetting benefit — any future
    LLM-provider API change or CVE in the gateway will never be patched
    upstream. usefulness is scored on the app as it exists today
    (frozen), not on the idea.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [CLICKHOUSE_PASSWORD, LLM_PROVIDER_API_KEY]
  secrets_expressible_today:
    - secret: CLICKHOUSE_PASSWORD
      mechanism: server_generated_no_customer_input
  blocking_issues:
    - "TensorZero's entire purpose is routing inference calls to external LLM providers (OpenAI, Anthropic, AWS Bedrock, Azure, Google Gemini, Mistral, Groq, etc.) declared in the gateway's tensorzero.toml config. At least one provider API key is required for the gateway to do anything useful, and there is no channel today for a customer to supply an arbitrary external API key at first boot — this alone blocks installable_today independent of the EOL finding."
    - "Repo archived 2026-06-12 (read-only, final release 2026.6.0 on 2026-06-04) — shipping a recipe now means committing customers to an unmaintained gateway that will never receive security patches or provider-API compatibility updates."
    - "The TensorZero UI (tensorzero/ui image) itself requires gateway auth to be configured (2026.5.0 made this mandatory) and is a thin observability/eval front-end over ClickHouse + the gateway, not a self-contained admin app with its own generatable login — no single-parameter generated_from projection covers the real secret the app needs (the provider key), only a basic_auth gate on the UI, which does not unblock the gateway's own API-key requirement."
  installable_today: false
  recommendation: not_recommended

summary: >
  TensorZero is a two-container stack (tensorzero/gateway on :3000 backed by
  ClickHouse, plus an optional tensorzero/ui on :4000) that is structurally
  reverse-proxy-friendly — single HTTP surface per container, similar in
  shape to recipes/n8n's Postgres-backed pattern with ClickHouse standing in
  for Postgres. It would have filled a genuine gap (no LLM-gateway/LLMOps
  product exists in the current 24-recipe catalogue; open-webui/ollama
  serve a different job). However, two independent problems rule it out:
  the gateway cannot function without a customer-supplied external
  LLM-provider API key, which our current `/compose` mechanism has no
  channel to deliver, and — more decisively — the upstream repository was
  archived read-only on 2026-06-12 after the vendor shut down, meaning any
  recipe built on it today ships an unmaintained, permanently frozen
  gateway with no future security patches. Recommend not_recommended;
  revisit only if a maintained fork emerges.
