slug: raneto
name: Raneto
source_description: "Markdown-powered Node.js knowledge base wiki with file-based content storage"

upstream:
  url: https://raneto.com/
  repo_url: https://github.com/ryanlelek/Raneto
  license: MIT
  docker_image: raneto/raneto:0.18.1
  compose_file_url: null
  compose_file_notes: >
    No official docker-compose file is published anywhere by the project.
    The GitHub repo (github.com/ryanlelek/Raneto) ships only a Dockerfile
    at its root — no docker-compose.yaml/.yml in the repo, and none under
    a docker/, deploy/, or contrib/ directory (none of those directories
    exist). The official docs site (docs.raneto.com) documents only an
    npm-based install (npm install / npm start), with no Docker or
    docker-compose section on either its "Installing Raneto" or
    "Production Notes" pages. The project's marketing homepage
    (raneto.com) does display a docker-compose.yml-style code snippet
    (image raneto/raneto:0.18.1, port 8080, config/content volume mounts)
    as a page-embedded example, but it is not a file the project publishes
    or links to anywhere (no raw/release-asset URL exists for it) — it is
    illustrative marketing copy, not a canonical file, so it is not
    recorded as compose_file_url per this issue's "official" bar.

version_health:
  latest_version: "0.18.1"
  latest_release_date: "2026-03-11"
  release_cadence: sporadic
  eol_status: active
  notes: >
    v0.18.1 released 2026-03-11 — just under 5 months before today
    (2026-08-05). History shows a long dormant stretch followed by a
    recent revival: v0.17.8 (2024-02-22), then nothing for over 19
    months until v0.18.0 (2025-09-15), then v0.18.1 (2026-03-11). Before
    that, v0.17.x point releases trickled out roughly annually back to
    v0.17.0 (2021-03-28). Repo is not archived, the official Docker Hub
    image (raneto/raneto) was rebuilt for 0.18.1 the same day as the
    GitHub release and an "unstable" tag was pushed as recently as
    2026-03-18, and v0.18.0/0.18.1 shipped real modernization work
    (minimum Node.js bumped to v24 LTS, dependency upgrades, markdown
    escaping/sanitization fixes, rate limiting). Calling this "sporadic"
    rather than "active": one release in the last 5 months is fine, but
    the ~19-month silence immediately before it means the cadence is
    not yet proven regular — this looks like a project coming back from
    near-abandonment rather than one with an established release rhythm.

catalogue_fit:
  categories: [productivity, developer-tools]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue is a wiki/knowledge-base
    tool. Raneto's own distinguishing trait is flat markdown files with
    YAML front-matter and category folders, edited via a lightweight
    in-browser editor, with no database and no git/version history
    requirement — a simple, single-container knowledge-base option.
    For a human reviewer's awareness: separate gap analyses also cover
    an-otter-wiki and dokuwiki (apps-gaps/an-otter-wiki.yaml,
    apps-gaps/dokuwiki.yaml), which serve adjacent self-hosted-wiki use
    cases; that overlap is a later prioritization question, not a
    factor in this app's own merits.
  usefulness: medium
  usefulness_rationale: >
    Wikis/knowledge bases are a common self-hosting ask, and Raneto's
    no-database, flat-file-markdown model is a genuinely lightweight
    option for a customer who wants a simple internal wiki without
    provisioning a database. Its own version history is the main
    caveat on usefulness: a ~19-month dormant stretch immediately
    before the two most recent releases means the project's current
    cadence is not yet proven, even though those two releases did
    ship real modernization work.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [basic_auth_password]
  secrets_expressible_today:
    - secret: basic_auth_password
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Raneto is a single-container Node.js app (official image
  raneto/raneto, pinned e.g. 0.18.1) serving its UI on one HTTP port
  (8080 by default, 3000 on the LinuxServer.io community image), storing
  all content as flat markdown files in a configurable content
  directory with no external database — fully Traefik-compatible.
  Its own login system is optional and disabled by default; when
  enabled it only accepts a plaintext username/password via
  ADMIN_USERNAME/ADMIN_PASSWORD env vars or a config.js credentials
  array, the same plaintext-only pattern seen in An Otter Wiki and
  DokuWiki. Leaving Raneto's built-in auth off and gating its single
  HTTP surface with a Traefik basic_auth:true gate (password projected
  from the customer's root password via generated_from, same pattern as
  Adminer/n8n/WUD/An Otter Wiki/DokuWiki) clears the /compose constraint
  today with zero blocking issues, so this is mechanically
  installable_today with no blocker: build_now. Raneto's own release
  history — a ~19-month dormant gap immediately before its two most
  recent point releases — is noted in version_health as a usefulness
  caveat, not an installability blocker. (Separate gap analyses cover
  an-otter-wiki and dokuwiki for a human reviewer's awareness of
  adjacent wiki candidates; that overlap does not factor into this
  recommendation.)
