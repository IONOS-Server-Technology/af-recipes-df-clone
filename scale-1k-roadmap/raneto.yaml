slug: raneto
name: Raneto
source_description: "Markdown-powered Node.js knowledge base wiki with file-based content storage"

upstream:
  url: https://raneto.com/
  repo_url: https://github.com/ryanlelek/Raneto
  license: MIT
  docker_image: raneto/raneto:0.18.1

version_health:
  latest_version: "0.18.1"
  latest_release_date: "2026-03-11"
  release_cadence: sporadic
  eol_status: active
  notes: >
    v0.18.1 released 2026-03-11 — just under 5 months before today
    (2026-08-05). History shows a long dormant stretch followed by a
    recent revival: v0.17.8 (2024-02-22), then nothing for over 19
    months until v0.18.0 (2025-09-15), then v0.18.1 (2026-03-11). Before
    that, v0.17.x point releases trickled out roughly annually back to
    v0.17.0 (2021-03-28). Repo is not archived, the official Docker Hub
    image (raneto/raneto) was rebuilt for 0.18.1 the same day as the
    GitHub release and an "unstable" tag was pushed as recently as
    2026-03-18, and v0.18.0/0.18.1 shipped real modernization work
    (minimum Node.js bumped to v24 LTS, dependency upgrades, markdown
    escaping/sanitization fixes, rate limiting). Calling this "sporadic"
    rather than "active": one release in the last 5 months is fine, but
    the ~19-month silence immediately before it means the cadence is
    not yet proven regular — this looks like a project coming back from
    near-abandonment rather than one with an established release rhythm.

catalogue_fit:
  categories: [productivity, developer-tools]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue is a wiki/knowledge-base
    tool, so Raneto would target the same "self-hosted wiki" slot
    already flagged in the separate an-otter-wiki and dokuwiki gap
    analyses (apps-gaps/an-otter-wiki.yaml, apps-gaps/dokuwiki.yaml) —
    all three compete for one catalogue slot and only one (if any) is
    worth building. Compared to those two, Raneto is the weakest
    upstream: An Otter Wiki has a dense, multiple-releases-per-month
    2026 cadence and DokuWiki has 20+ years of continuous stewardship
    plus a huge plugin ecosystem, while Raneto spent over a year and a
    half dormant before its two most recent point releases. Raneto's
    one distinguishing trait — flat markdown files with YAML front-
    matter and category folders edited via a lightweight in-browser
    editor, no git/version history — is a narrower feature set than
    either competitor already analyzed, not an added capability.
  usefulness: low
  usefulness_rationale: >
    Wikis are a common self-hosting ask, but this is the third and
    least-differentiated candidate for the same slot: An Otter Wiki
    already covers the "simple, single-container, no-database markdown
    wiki" niche with a materially more active upstream, and DokuWiki
    covers the "mature, plugin-rich, no-database wiki" niche. Raneto
    doesn't add a capability neither of those has, and its recent
    19-month release gap is a real risk signal a customer-facing recipe
    shouldn't be built on top of when better-maintained alternatives in
    the same niche already exist.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [basic_auth_password]
  secrets_expressible_today:
    - secret: basic_auth_password
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: not_recommended

summary: >
  Raneto is a single-container Node.js app (official image
  raneto/raneto, pinned e.g. 0.18.1) serving its UI on one HTTP port
  (8080 by default, 3000 on the LinuxServer.io community image), storing
  all content as flat markdown files in a configurable content
  directory with no external database — fully Traefik-compatible.
  Its own login system is optional and disabled by default; when
  enabled it only accepts a plaintext username/password via
  ADMIN_USERNAME/ADMIN_PASSWORD env vars or a config.js credentials
  array, the same plaintext-only pattern seen in An Otter Wiki and
  DokuWiki. Leaving Raneto's built-in auth off and gating its single
  HTTP surface with a Traefik basic_auth:true gate (password projected
  from the customer's root password via generated_from, same pattern as
  Adminer/n8n/WUD/An Otter Wiki/DokuWiki) clears the /compose constraint
  today with zero hard blocking issues, so this is mechanically
  installable_today. However, it is not recommended: it would be the
  third wiki candidate competing for a slot two better-maintained
  alternatives already fill (apps-gaps/an-otter-wiki.yaml,
  apps-gaps/dokuwiki.yaml), it adds no capability over either, and its
  release history — a 19-month gap before the two most recent point
  releases — is a weaker version-health signal than both competitors.
