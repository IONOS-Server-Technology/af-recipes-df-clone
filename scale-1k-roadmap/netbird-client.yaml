slug: netbird-client
name: NetBird Client
source_description: "Secure WireGuard-based mesh VPN client with SSO and granular access controls"

upstream:
  url: https://netbird.io
  repo_url: https://github.com/netbirdio/netbird
  license: BUSL-1.1 (client/agent code; management server components dual-licensed, some under AGPL-3.0 for older releases — verify per-component before redistribution)
  docker_image: null
  compose_file_url: null
  compose_file_notes: >
    No official docker-compose file exists for the NetBird client/peer
    agent itself. docs.netbird.io/get-started/install/docker documents a
    bare `docker run` command as the primary method, plus an inline
    "example" compose snippet explicitly captioned "below is an example"
    for users to "configure to your specific needs" — not a canonical file
    the project publishes/versions, so it doesn't meet the bar set by this
    field. The only real compose files in the netbirdio/netbird repo
    (infrastructure_files/docker-compose.yml.tmpl and
    .yml.tmpl.traefik) stand up the self-hosted *management* server stack
    (signal, management, dashboard, coturn, etc.), not the client agent
    this recipe covers — different component, out of scope here. This is
    consistent with recipe_type_guess: native (install-script based, no
    container) recorded elsewhere in this file.

version_health:
  latest_version: "v0.76.1 (tag, 2026-07-31)"
  latest_release_date: "2026-07-31"
  release_cadence: active
  eol_status: active
  notes: >
    Actively maintained; tags show v0.71.4 (2026-05-21) followed by v0.76.1
    (2026-07-31), roughly one release every 2-4 weeks. As of today
    (2026-08-05) the most recent release is 5 days old. No EOL/deprecation
    signals found.

catalogue_fit:
  categories: [security, networking]
  has_web_ui: false
  reverse_proxy_compatible: false
  overlaps_with: [wg-easy]
  differentiation: >
    "NetBird Client" per the Hostinger catalogue slug is the mesh-network
    *peer agent*, not the self-hosted NetBird management/dashboard stack.
    It joins an existing NetBird network (the vendor's SaaS control plane
    or a separately self-hosted management server) and has no web UI, no
    exposed HTTP port, and no local admin/login of its own — a headless
    CLI daemon in the same category as claude-code/gemini-cli rather than
    a server a customer stands up and administers on its own domain.
    wg-easy, by contrast, is a full WireGuard server + web UI that IS the
    thing being administered — these solve different problems ("run a VPN
    client that joins a network I already have" vs. "stand up a new VPN
    server"), so no real overlap despite both being WireGuard-based.
  usefulness: low
  usefulness_rationale: >
    Provisioning an AF VM purely to run a mesh-VPN client has one
    legitimate use case: a customer who already runs a NetBird network
    wants a permanent cloud peer (e.g. a bastion/gateway reachable from
    anywhere over the mesh without exposing public ports). That's real but
    niche — most NetBird users install the client on devices they already
    have, not on a newly provisioned cloud instance whose only job is to be
    a mesh peer. Compared to the rest of the catalogue this is a narrow,
    single-purpose infra utility rather than a general-purpose self-hosted
    app.

installability:
  recipe_type_guess: native
  secrets_required_at_first_boot: [NB_SETUP_KEY]
  secrets_expressible_today: []
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Re-evaluated as recipe_type: native (per the claude-code/gemini-cli
  precedent for headless CLI agents) rather than docker-compose: netbird's
  own install script (curl -fsSL https://pkgs.netbird.io/install.sh | sh)
  installs the client directly on the VM's own kernel/network namespace, so
  the earlier --network host/--privileged concern from a docker-compose
  framing doesn't apply, and SCHEMA.md explicitly carves out "no web UI" as
  a non-blocker for native recipes. NB_SETUP_KEY has no projection
  mechanism — it's an external credential from the customer's own NetBird
  control plane — but that mirrors ANTHROPIC_API_KEY on claude-code and
  GEMINI_API_KEY on gemini-cli: declare it as a required:false
  documentation-only parameter, install the agent unconfigured, and let the
  customer run `netbird up --setup-key=<their key>` over SSH
  post-provisioning. Mechanically this is installable today under the
  established native-CLI pattern, with no blocking issues, so build_now.
