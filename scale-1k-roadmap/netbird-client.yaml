slug: netbird-client
name: NetBird Client
source_description: "Secure WireGuard-based mesh VPN client with SSO and granular access controls"

upstream:
  url: https://netbird.io
  repo_url: https://github.com/netbirdio/netbird
  license: BUSL-1.1 (client/agent code; management server components dual-licensed, some under AGPL-3.0 for older releases — verify per-component before redistribution)
  docker_image: netbirdio/netbird

version_health:
  latest_version: "v0.76.1 (tag, 2026-07-31)"
  latest_release_date: "2026-07-31"
  release_cadence: active
  eol_status: active
  notes: >
    Actively maintained; tags show v0.71.4 (2026-05-21) followed by v0.76.1
    (2026-07-31), roughly one release every 2-4 weeks. As of today
    (2026-08-05) the most recent release is 5 days old. No EOL/deprecation
    signals found.

catalogue_fit:
  categories: [security, networking]
  has_web_ui: false
  reverse_proxy_compatible: false
  overlaps_with: [wg-easy]
  differentiation: >
    "NetBird Client" per the Hostinger catalogue slug is the mesh-network
    *peer agent* (netbirdio/netbird image), not the self-hosted NetBird
    management/dashboard stack. It joins an existing NetBird network (the
    vendor's SaaS control plane or a separately self-hosted management
    server) and has no web UI, no exposed HTTP port, and no local
    admin/login of its own — it is functionally a headless VPN client
    daemon, not a server a customer stands up and administers on its own
    domain. wg-easy, by contrast, is a full WireGuard server + web UI that
    IS the thing being administered. These solve different problems: one is
    "run a VPN client that joins a network I already have," the other is
    "stand up a new VPN server."
  usefulness: low
  usefulness_rationale: >
    As a recipe on our platform (AF instances are themselves servers, not
    end-user devices joining someone else's mesh), a bare client agent has
    little standalone value — customers would typically install the
    NetBird client directly on their own devices, not provision an AF
    instance just to run it. It could plausibly be useful as a
    site-to-site gateway/router peer, but that's a stretch from what the
    Hostinger listing describes.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [NB_SETUP_KEY]
  secrets_expressible_today: []
  blocking_issues:
    - "The client requires NB_SETUP_KEY, a setup key issued by a NetBird management server (either NetBird's cloud SaaS account or a separately self-hosted management instance the customer already controls). This is an external, customer-supplied credential from a third-party control plane — there is no generated_from or basic_auth mechanism that can produce it, and it isn't a value af-api can derive or generate server-side."
    - "The container needs --network host and --privileged (or NET_ADMIN + /dev/net/tun) to manage WireGuard interfaces at the OS network-namespace level, which sits outside the profile of our reverse-proxy-fronted docker-compose recipes."
    - "No web UI and no HTTP port at all: nothing for Traefik to front, so the domain + basic_auth conventions our recipe mechanism assumes don't apply here."
  installable_today: false
  recommendation: not_recommended

summary: >
  "NetBird Client" is the headless mesh-VPN peer agent, not the full
  self-hosted NetBird server/dashboard (which is a materially different,
  heavier recipe candidate). It requires a setup key issued by an external
  NetBird control plane — a credential with no supply channel under the
  current root-password-projection/basic-auth mechanism — and has no web UI
  for Traefik to front. Combined with limited standalone usefulness as an
  AF-hosted recipe (customers join a mesh from their own devices, not from
  a provisioned server instance), this is not recommended today. If NetBird
  self-hosting is wanted in the catalogue, the management/dashboard stack
  (netbirdio/management + netbirdio/dashboard + signal/relay/coturn) would
  be the more sensible unit to evaluate instead of the client agent.
