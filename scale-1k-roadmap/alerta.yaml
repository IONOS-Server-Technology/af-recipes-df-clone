slug: alerta
name: Alerta
source_description: "Open-source alert management platform for consolidating monitoring alerts"

upstream:
  url: https://alerta.io/
  repo_url: https://github.com/alerta/alerta
  license: Apache-2.0
  docker_image: alerta/alerta-web:9.1.0

version_health:
  latest_version: "9.1.0"
  latest_release_date: "2026-03-28"
  release_cadence: active
  eol_status: active
  notes: >
    v9.1.0 tagged 2026-03-28 and pushed to Docker Hub the same window
    (~4 months before today, 2026-08-05). The gap before it was wide
    (v9.0.4 was Sep 2024, ~18 months earlier), but the run-up to v9.1.0
    shows a dense burst of commits (Mar 27-30, 2026) covering security
    fixes, a new CAS auth provider, and several bug fixes, with "claude"
    appearing as a co-committer alongside the maintainer — the repo is
    not archived and is clearly under active, ongoing maintenance as of
    today, not dormant or EOL.

catalogue_fit:
  categories: [monitoring]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Alerta is an alert-consolidation/dedup layer that receives pushed
    alerts (via HTTP API) from external monitoring producers — Prometheus,
    Nagios, Zabbix, Sensu, SNMP, syslog — and gives a single at-a-glance
    console across all of them. Uptime Kuma, the closest existing recipe,
    is a self-contained uptime checker that generates its own alerts by
    polling URLs/services directly; it does not ingest or de-duplicate
    alerts from other tools. No recipe in the current catalogue does what
    Alerta does, but its value only exists if the customer already runs
    separate monitoring tooling elsewhere and configures it to point at
    Alerta's API — it is not useful standalone out of the box.
  usefulness: low
  usefulness_rationale: >
    Legitimate, actively maintained SRE/DevOps tool, but it targets a
    narrow technical audience that already operates its own monitoring
    stack (Prometheus/Nagios/Zabbix/etc.) and wants a correlation layer on
    top — a materially smaller and more specialized slice of our
    self-host customer base than broadly-appealing recipes like n8n or
    Uptime Kuma. There is also no "getting started" value on day one: an
    empty Alerta instance shows nothing until a customer wires up external
    producers themselves, which most customers in this catalogue's target
    segment are unlikely to have.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [basic_auth_password, POSTGRES_PASSWORD, SECRET_KEY]
  secrets_expressible_today:
    - secret: basic_auth_password
      mechanism: traefik_basic_auth
    - secret: POSTGRES_PASSWORD
      mechanism: server_generated_no_customer_input
    - secret: SECRET_KEY
      mechanism: server_generated_no_customer_input
  blocking_issues: []
  installable_today: true
  recommendation: build_with_caveats

summary: >
  Alerta ships as a single web+API container (alerta/alerta-web, port 8080)
  backed by Postgres or MongoDB — structurally close to the n8n/
  paperless-ngx two-service template — and is under active upstream
  maintenance (v9.1.0, March 2026, with a dense recent commit history).
  Its own admin login (ADMIN_USERS/ADMIN_PASSWORD) is provisioned via a
  plaintext env var consumed directly by the `alertad` CLI at container
  start, with no support for a pre-hashed credential, so `generated_from`
  cannot target it directly the way it targets Vaultwarden's ADMIN_TOKEN.
  The workable path is to set AUTH_REQUIRED=False (no in-app login) and
  gate the whole app behind a Traefik `basic_auth: true` credential
  projected from the customer's root password, with Postgres password and
  Alerta's SECRET_KEY generated server-side. That makes it installable
  today, but the app's usefulness is narrow — it is only valuable to
  customers who already run other monitoring tools and wire them into
  Alerta's API, which is a poor fit for a one-click, empty-by-default
  catalogue entry. Recommend build_with_caveats: technically buildable,
  but low priority relative to broader-appeal gaps.
