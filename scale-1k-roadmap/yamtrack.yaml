  repo_url: https://github.com/FuzzyGrim/Yamtrack
  license: AGPL-3.0
  docker_image: ghcr.io/fuzzygrim/yamtrack

version_health:
  latest_version: "v0.25.3"
  latest_release_date: "2026-05-25"
  release_cadence: active
  eol_status: active
  notes: >
    Tagged releases roughly every 1-2 months (v0.25.0 on 2026-02-06,
    v0.25.1/v0.25.2 in April, v0.25.3 on 2026-05-25 — about 2.5 months
