slug: itflow
name: ITFlow
source_description: "Open-source PSA platform for MSPs with IT documentation, ticketing, and billing"

upstream:
  url: https://itflow.org/
  repo_url: https://github.com/itflow-org/itflow
  license: GPL-3.0
  docker_image: null

version_health:
  latest_version: "v26.08"
  latest_release_date: "2026-08-04"
  release_cadence: active
  eol_status: active
  notes: >
    v26.08 released 2026-08-04, one day before this analysis (2026-08-05).
    Upstream ships a consistent monthly cadence going back at least a year
    (v25.09 → v25.10 → v25.11 → v25.12 → v26.02 → v26.03 → v26.04 → v26.05 →
    v26.07 → v26.08), with active issue triage and 966 GitHub stars. Clearly
    active, not dormant or in maintenance-only mode.

catalogue_fit:
  categories: [business, productivity]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24-recipe catalogue is an MSP/PSA tool —
    client/contact/asset/license/domain/SSL/password/documentation
    management unified with ticketing and billing, plus a client portal.
    The closest recipes (paperless-ngx, paperless-ai) are document-archive
    tools, not MSP operations platforms. ITFlow would open a distinct
    "run an IT services business" category with clear appeal to hosting
    customers who are themselves MSPs or IT consultants.
  usefulness: medium
  usefulness_rationale: >
    Real niche demand from MSP/IT-consultant customers who want to own
    their client and billing data instead of paying for a SaaS PSA (e.g.
    Syncro, HaloPSA). Rated medium rather than high because the
    Docker packaging is community-maintained rather than official (see
    installability below) and upstream itself warns it hasn't had a
    third-party security assessment — a material caveat for a tool that
    stores client passwords and billing data.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [db_password, basic_auth_password]
  secrets_expressible_today:
    - secret: db_password
      mechanism: server_generated_no_customer_input
    - secret: basic_auth_password
      mechanism: traefik_basic_auth
  blocking_issues:
    - >
      No official Docker image. The only container packaging is
      itflow-org/itflow-docker, explicitly labeled by upstream as
      community-created and unsupported ("we don't 'officially' support
      Docker and are limited in our ability to assist"), and itself
      documented as "still in early beta ... may cause breakage upon
      updates." Building a recipe on it means pinning to an unofficial,
      beta-quality image with no upstream commitment to stability.
    - >
      Initial admin account (email + password) is created exclusively
      through a multi-step browser setup wizard (setup/index.php,
      form-posted and hashed with password_hash) — there is no env var
      or API channel to inject a fixed admin credential, so
      generated_from root-password projection cannot reach the app's own
      login. This alone is not a hard blocker (same pattern as
      InvoiceShelf, closed with a Traefik basic_auth gate over the setup
      window), but combined with the unofficial Docker packaging it adds
      to the overall risk of shipping this as a recipe today.
  installable_today: true
  recommendation: build_with_caveats

summary: >
  ITFlow is a PHP/MariaDB PSA app for MSPs (single admin web UI on one
  HTTP port, reverse-proxy friendly) with no self-hosted competitor in the
  current 24-recipe catalogue. Mechanically, a recipe could be built
  today: DB password auto-generated with no customer input, and the setup
  wizard's admin-account-creation window closed with a Traefik
  basic_auth gate (same pattern used for InvoiceShelf/n8n/Open WebUI).
  However, the only container packaging is an explicitly unofficial,
  community-maintained, "early beta" Docker image with no upstream
  support commitment, and upstream itself warns the app has not had a
  third-party security assessment for the sensitive data (client
  passwords, billing) it stores. Recommend build_with_caveats rather
  than build_now: mechanically installable, but a recipe should not pin
  to an explicitly unofficial, beta-quality image for an app handling
  client passwords and billing data without flagging that risk — worth
  revisiting once itflow-org officially adopts Docker packaging or the
  community image reaches a stated stable status.
