slug: beszel-agent
name: Beszel Agent
source_description: "Lightweight monitoring agent for Beszel server monitoring system"

upstream:
  url: https://beszel.dev/
  repo_url: https://github.com/henrygd/beszel
  license: MIT
  docker_image: "ghcr.io/henrygd/beszel/beszel-agent:0.18.7-alpine"

version_health:
  latest_version: "v0.18.7"
  latest_release_date: "2026-04-05"
  release_cadence: slowing
  eol_status: active
  notes: >
    v0.18.7 tagged 2026-04-05, exactly 4 months before today (2026-08-05).
    Release history through the 0.18.x line was dense before that
    (v0.18.0-v0.18.2 all on 2026-01-11/12, v0.18.3 on 2026-02-01, v0.18.4 on
    2026-02-20, v0.18.5/0.18.6 on 2026-03-27/29, v0.18.7 on 2026-04-05 —
    roughly weekly during Feb-Apr 2026), so a clean 4-month silence since is
    a real deceleration relative to the project's own recent cadence, not
    just noise. Repo is not archived and has no announced EOL; classifying
    as "active" but flagging the recent slowdown as worth re-checking before
    a build_now decision.

catalogue_fit:
  categories: [monitoring, infrastructure]
  has_web_ui: false
  reverse_proxy_compatible: false
  overlaps_with: []
  differentiation: >
    Beszel Agent is not a standalone application — it is the headless
    per-host half of a two-part system (hub + agent). It collects CPU,
    memory, disk, network, temperature, and Docker-container metrics on the
    box it runs on and pushes them over an outbound WebSocket to a separate
    "Beszel Hub" instance, which is the actual web dashboard. The hub is not
    itself a recipe in the current catalogue (no "beszel" or "beszel-hub"
    entry exists), so shipping the agent alone gives a customer no product
    to look at — there is nothing in our 24 recipes it functionally
    duplicates, but there is also nothing in our catalogue it usefully pairs
    with today.
  usefulness: low
  usefulness_rationale: >
    Even setting aside the installability blocker below, Beszel Agent has
    no standalone value on our platform: it only does something once
    pointed at a Beszel Hub the customer runs somewhere (their own VM,
    another provider, or a hub instance we would also need to catalogue and
    that they'd need to have already provisioned and configured). A
    monitoring-agent recipe with a mandatory dependency on infrastructure
    outside the recipe's own compose file, and outside our catalogue
    entirely, is a poor fit for a one-click, self-contained AF recipe.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [KEY, TOKEN, HUB_URL]
  secrets_expressible_today: []
  blocking_issues:
    - "KEY (the hub's SSH public key), TOKEN (a per-agent auth token), and
      HUB_URL (the hub's WebSocket endpoint) are all values generated by a
      separate, already-running Beszel Hub instance and must be copy/pasted
      by the customer into the agent's env at setup time. These are
      arbitrary, hub-issued values with no relationship to the customer's
      root password — generated_from cannot project them, and there is no
      login of the agent's own to gate with Traefik basic_auth (the agent
      has no HTTP/web UI at all). This is the 'external API key/token the
      app can't function without' no-channel case from SCHEMA.md, not a
      generated-secret or basic-auth case."
    - "Even if a customer-input channel existed, the agent has no public
      HTTP surface to route through Traefik — it makes only an outbound
      WebSocket connection to a hub URL, so 'reverse_proxy_compatible' and
      'domain' framing don't apply the way they do for our other recipes."
    - "No Beszel Hub recipe exists in the current catalogue for this agent
      to pair with, so even a hypothetical future customer-input mechanism
      would still leave the agent with nothing to connect to out of the
      box."
  installable_today: false
  recommendation: not_recommended

summary: >
  Beszel Agent is the headless, no-UI half of a hub/agent monitoring pair;
  the actual product (the Beszel dashboard) lives in a separate "hub"
  component that is not in our catalogue. At first boot it needs a hub
  public key, a per-agent token, and a hub WebSocket URL — three arbitrary
  values generated by that external hub, none of which our root-password
  projection or Traefik basic-auth mechanisms can supply, and none of which
  the customer has any way to enter today. Upstream is active but has
  slowed noticeably (no release in the 4 months since v0.18.7 on
  2026-04-05, versus a roughly weekly cadence just before that). Combining
  a hard, unaddressable secrets blocker with no standalone value on our
  platform, this is a clear not_recommended — building the hub first
  (itself a bigger undertaking, and still limited by the same
  no-external-token-input constraint for any customer wanting to add
  additional monitored hosts) would not change the agent-only verdict.
