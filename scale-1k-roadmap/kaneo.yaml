slug: kaneo
name: Kaneo
source_description: "Open-source project management with kanban boards and GitHub integration"

upstream:
  url: https://kaneo.app
  repo_url: https://github.com/usekaneo/kaneo
  license: MIT
  docker_image: ghcr.io/usekaneo/kaneo

version_health:
  latest_version: "2.13.0"
  latest_release_date: "2026-08-05"
  release_cadence: active
  eol_status: active
  notes: >
    v2.13.0 shipped today (2026-08-05); the release immediately before it,
    v2.12.2, shipped the day prior (2026-08-04) with a CVE fix and locale
    additions, and v2.12.0/2.12.1 shipped 2026-07-30 — this is an
    effectively daily release cadence over the last week, on top of a
    separate weekly-ish cadence for the companion `@kaneo/mcp` npm package
    (v0.1.6 through v0.1.9 all published 2026-08-04/05 alone). GHCR also
    publishes same-day `nightly-YYYYMMDD` tags. No dormancy or EOL signal
    whatsoever — this is one of the more actively shipped candidates
    analyzed to date.

catalogue_fit:
  categories: [productivity, project-management, developer-tools]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    None of the current 24 recipes cover Kanban-style project/task
    management — n8n is workflow automation, anytype-server is a personal
    notes/knowledge-base sync server, and gitea/opengist are source hosting,
    not task tracking. Kaneo (Trello/Linear/Jira-style boards, workspaces,
    projects, GitHub/Gitea repo linking, Slack/Discord webhooks, an MCP
    endpoint for AI-agent integration) would be a genuinely new category.
    Unlike apps-gaps/focalboard.yaml (the other Kanban candidate on file,
    marked not_recommended for a ~3-year-stale, "not currently maintained"
    upstream), Kaneo is under very active development, making it the
    stronger pick to actually build for this category.
  usefulness: high
  usefulness_rationale: >
    Self-hosted Kanban/PM tools are a well-known self-hosting want, and this
    is currently a gap in the catalogue. Kaneo packages cleanly as a single
    app container plus Postgres (the same shape as n8n/paperless-ngx),
    ships an official GHCR image with a pinned, dated tag, and is
    aggressively maintained upstream — low risk of shipping on top of
    something about to go stale.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [POSTGRES_PASSWORD, AUTH_SECRET, KANEO_SETUP_BASIC_AUTH_PASSWORD]
  secrets_expressible_today:
    - secret: POSTGRES_PASSWORD
      mechanism: server_generated_no_customer_input
    - secret: AUTH_SECRET
      mechanism: server_generated_no_customer_input
    - secret: KANEO_SETUP_BASIC_AUTH_PASSWORD
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Kaneo ships as a single official combined API+web container
  (ghcr.io/usekaneo/kaneo, pin to 2.13.0) plus Postgres, listening on one
  HTTP port (5173) with no extra raw ports needed — a clean fit behind
  Traefik on <slug>.<base_domain>, structurally close to the n8n/paperless-ngx
  template. It has no admin-bootstrap env var; instead any visitor can
  self-register a workspace account by default (DISABLE_REGISTRATION
  defaults to false), which is a first-user-to-register race exactly like
  the one that blocks apps-gaps/gogs.yaml — a stranger who reaches the
  domain first could register ahead of the real customer. Unlike Gogs,
  Kaneo has no conflicting need for its own HTTP Basic auth (no
  Basic-auth-based Git-over-HTTP flow), so the standard Traefik
  `basic_auth: true` gate cleanly closes that race: front the whole domain
  with a basic-auth login built from the customer's root-password hash,
  and only the customer can ever reach the signup form to create the first
  (owner) account. POSTGRES_PASSWORD and AUTH_SECRET (a JWT signing key)
  are both patternless secrets the app itself never surfaces to the
  customer, so they can be server-generated with no input channel needed.
  GitHub integration (Hostinger's headline feature) is an optional
  post-provision OAuth-app/webhook configuration done by the customer
  through the authenticated UI, not a first-boot requirement, so it does
  not block installability. Upstream is releasing essentially daily with
  no EOL signal. Recommend build_now.
