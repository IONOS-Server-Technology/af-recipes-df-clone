slug: beaverhabits
name: BeaverHabits
source_description: "Minimalist self-hosted habit tracker focused on daily check-ins and streaks"

upstream:
  url: https://github.com/daya0576/beaverhabits
  repo_url: https://github.com/daya0576/beaverhabits
  license: BSD-3-Clause
  docker_image: daya0576/beaverhabits

version_health:
  latest_version: "0.10.0"
  latest_release_date: "2026-07-26"
  release_cadence: active
  eol_status: active
  notes: >
    Latest tag v0.10.0 published 2026-07-26, ~10 days before today
    (2026-08-05). 28 tagged releases since 2024-05, with a steady cadence
    of roughly one release every 3-6 weeks through 2026 (v0.8.0 2025-12-02,
    v0.8.1 2026-01-04, v0.8.2 2026-02-03, v0.9.0 2026-02-20, v0.9.1
    2026-05-20, v0.10.0 2026-07-26). Repo is not archived, 1.8k stars, ~20
    open issues, and the latest release adds active new functionality
    (WebSocket sync for a companion iOS app), so this is a healthy,
    actively maintained project.

catalogue_fit:
  categories: [productivity, lifestyle]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Nothing in the current 24 recipes covers personal habit/streak
    tracking — the closest is Anytype (personal notes/wiki) which is a
    different use case entirely. BeaverHabits fills a distinct
    "quantified self" / personal-productivity niche: a lightweight,
    goal-free daily check-in grid, comparable to apps like Loop Habit
    Tracker or streaks apps.
  usefulness: medium
  usefulness_rationale: >
    Simple, low-resource, broadly relatable app (habit tracking has wide
    consumer appeal beyond developers/power users), but it's a single-user
    personal tool rather than infrastructure, so ceiling on usage depth per
    install is lower than e.g. n8n or Immich.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: []
  secrets_expressible_today: []
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  BeaverHabits is a single-container app on one HTTP port (8080), backed
  by either a local JSON file or SQLite (HABITS_STORAGE=USER_DISK or
  DATABASE) — no external DB service needed, and it sits cleanly behind
  Traefik on <slug>.<base_domain>. It has its own login/signup screen, but
  the admin account is created interactively by the first visitor through
  that UI (same pattern as Uptime Kuma), not via any env var af-api would
  need to inject, so there is no customer-supplied secret required at
  first boot. By default the signup form is open to any visitor; a fixed
  (non-customer-supplied) MAX_USER_COUNT=1 env value should be baked into
  the recipe's docker-compose so registration locks after the first
  account is created, closing that open-signup window without needing any
  projected secret. Upstream is actively maintained (release 10 days ago,
  steady multi-week cadence, no EOL signals). No overlap with the current
  catalogue. Recommend building the recipe.
