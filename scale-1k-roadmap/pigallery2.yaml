slug: pigallery2
name: PiGallery2
source_description: "Self-hosted directory-first photo gallery for archives and shared albums"

upstream:
  url: https://bpatrik.github.io/pigallery2/
  repo_url: https://github.com/bpatrik/pigallery2
  license: MIT
  docker_image: bpatrik/pigallery2:3.5.2

version_health:
  latest_version: "3.5.2"
  latest_release_date: "2026-01-24"
  release_cadence: slowing
  eol_status: active
  notes: >
    v3.5.2 (2026-01-24) is the latest tagged release, ~6.4 months before
    today (2026-08-05) — a real slowdown versus the preceding cadence
    (3.0.0 on 2025-10-28 -> 3.0.1 five days later -> 3.1.0 on 2025-12-07,
    roughly five-week gaps). However, `master` is not stale: commits
    continue steadily past the 3.5.2 tag (e.g. 2026-05-30, six commits on
    2026-06-06/07 implementing glob search support for issue #1133, and
    most recently 2026-07-05, about a month before today). This is a
    single-maintainer (bpatrik) project that has simply gone longer than
    usual between cut releases while development itself continues — not
    dormant, not archived, no EOL signal.

catalogue_fit:
  categories: [media]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: [immich, photoprism, photoview, librephotos, home-gallery]
  differentiation: >
    PiGallery2 is explicitly "directory-first": it indexes an existing,
    read-only photo folder tree as-is (no upload/backup pipeline, no
    managed library, no mobile app) — architecturally the closest match in
    the catalogue is recipes-gaps/photoview.yaml (also a read-only directory
    browser with a single lightweight backend and no ingestion story), not
    Immich's full backup-and-sync suite. Its own edges over Photoview are
    "photo frame" slideshow/kiosk mode and ORCID-linked sharing; it lacks
    Photoview's face recognition and RAW-specific handling. Against Immich,
    PhotoProject, and LibrePhotos it is strictly lighter-weight (single
    container, file-based/optional SQLite state, no ML service, no
    Postgres/Redis) but offers none of their AI search, face grouping, or
    phone auto-backup.
  usefulness: low
  usefulness_rationale: >
    This is now the fifth self-hosted photo-gallery candidate analyzed
    against the same Immich slot, and the second (after Photoview) whose
    core pitch is "point it at an already-organized folder tree and
    browse/share it" rather than backup-and-organize. That niche was
    already judged low-value and not_recommended for Photoview on the same
    reasoning: Immich's AI search/face recognition/mobile backup covers the
    broader audience, and a customer who specifically wants directory-first
    browsing is a narrow wedge. PiGallery2 adds a photo-frame/kiosk mode and
    ORCID sharing that Photoview lacks, but neither is enough to justify a
    third or fourth photo-app slot in the catalogue. It also requires photos
    to already exist on the server's filesystem in a mounted read-only
    folder — there is no in-app upload/backup flow, so a customer would need
    a separate mechanism (SFTP, a file-manager recipe) just to get content
    into it, a real usability gap versus Immich's own upload/mobile-backup
    flow.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [basic_auth_password]
  secrets_expressible_today:
    - secret: basic_auth_password
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: not_recommended

summary: >
  PiGallery2 is mechanically simple to package: the official
  `docker/docker-compose/pigallery2-only` example is a single container
  (bpatrik/pigallery2) on one HTTP port (80), needing no external database
  (state lives in an internal SQLite-backed `db-data` volume) and no
  external API keys or OAuth — reverse-proxy-compatible with our Traefik
  setup out of the box. Its only credential concern is a fixed,
  unchangeable-via-env admin/admin default login (same pattern already
  documented for Kanboard and Cronicle): there is no environment variable
  or config option to set the initial admin password or a pre-computed hash
  of it, so `generated_from` can't target it directly, but per SCHEMA.md
  that's not a hard blocker — gating the whole app behind a mandatory
  Traefik `basic_auth: true` (keyed off the customer's root-password hash)
  moves the real internet-facing auth boundary in front of the weak
  internal default, making it installable_today. The recommendation is
  still not_recommended: this is the second directory-first/read-only photo
  browser analyzed (after photoview.yaml) competing for the same slot
  Immich already fills, it requires photos to be placed on the server's
  filesystem through some other channel since it has no upload/backup flow
  of its own, and while upstream development is still active on `master`,
  the tagged-release cadence has visibly slowed (6.4 months since 3.5.2, a
  single maintainer). Not worth a build over the existing Immich recipe.
