slug: nextchat
name: NextChat
source_description: "Self-hosted AI chat UI for OpenAI, Claude, Gemini, and 20+ providers"

upstream:
  url: https://github.com/ChatGPTNextWeb/NextChat
  repo_url: https://github.com/ChatGPTNextWeb/NextChat
  license: MIT
  docker_image: yidadaa/chatgpt-next-web
  compose_file_url: https://raw.githubusercontent.com/ChatGPTNextWeb/NextChat/main/docker-compose.yml
  compose_file_notes: >-
    Official — lives at the repo root (docker-compose.yml) of
    ChatGPTNextWeb/NextChat itself, the same repo the README's docker run
    instructions point to. This is a rolling reference to the default
    (main) branch, not pinned to a release tag — the repo has no
    release-asset-hosted compose file. It defines two profile-gated
    services sharing one image (yidadaa/chatgpt-next-web): a "no-proxy"
    profile and a "proxy" profile that adds PROXY_URL for routing through
    an upstream proxy; no GPU/CPU or sqlite/postgres variants exist since
    the app is stateless and has no bundled inference engine or database.

version_health:
  latest_version: "v2.16.1"
  latest_release_date: "2025-07-29"
  release_cadence: dormant
  eol_status: active
  notes: >-
    Recomputed directly from the GitHub releases API on 2026-08-06:
    v2.16.1 published 2025-07-29 — that is over a year old (~12.3 months)
    as of today (2026-08-05), not ~1 week as an earlier draft of this file
    incorrectly stated. Tagged-release history before it: v2.16.0 shipped
    2025-02-16 (~5.3 months before v2.16.1), and v2.15.6 through v2.15.8
    shipped roughly weekly in Oct-Nov 2024 (~3 months before v2.16.0). So
    the tagged-release cadence, already uneven, effectively stopped over a
    year ago — no new tag in the last 12+ months. However, the repo itself
    is not dormant: `pushed_at`/most recent commit on `main` is 2026-07-06
    (~1 month old), 847 open issues, 88.5k+ GitHub stars, not archived.
    Classified `release_cadence: dormant` because the tagged-release track
    record shows nothing shipped in over a year; `eol_status: active`
    because ongoing commit and issue activity indicates the project is
    still maintained upstream, just not cutting tagged releases on a
    predictable schedule (or possibly moving to untagged/rolling
    `:latest`-style distribution — the Docker image itself was not checked
    for a same-period update cadence).

catalogue_fit:
  categories: [ai]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: [open-webui]
  differentiation: >-
    Same "chat UI in front of an LLM" shape as Open WebUI, but a different
    model: NextChat has no bundled inference engine (no Ollama sidecar,
    negligible RAM/disk floor) and is built around bring-your-own-key
    access to 20+ hosted providers (OpenAI, Claude, Gemini, DeepSeek,
    Azure, etc.) entered directly in the browser Settings panel, rather
    than local/self-hosted models. It would appeal to a customer who wants
    a lightweight, private front-end for API keys they already pay for,
    without also running a GPU/CPU-heavy local model stack.
  usefulness: medium
  usefulness_rationale: >-
    Legitimate, distinct niche (lightweight BYOK multi-provider chat
    front-end vs. open-webui's local-model-first design) and cheap to run,
    but it's still one more entry in the same broad "AI chat" category, and
    its core value depends entirely on the customer already holding paid
    third-party API keys they manage themselves post-install — the app
    itself contributes little beyond a UI shell around keys the platform
    has no visibility into.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [access_gate_credential]
  secrets_expressible_today:
    - secret: access_gate_credential
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >-
  NextChat boots with zero required env vars: all provider API keys
  (OPENAI_API_KEY, GOOGLE_API_KEY, ANTHROPIC_API_KEY, etc.) are optional
  server-side fallbacks, and by default each visitor enters their own
  provider API key directly in the app's Settings UI, which the app then
  uses per-request — that key never needs to reach our recipe mechanism at
  all, since it's a runtime credential the customer manages themselves
  inside the app after install, not a first-boot secret we provision. The
  app's own `CODE` access-password env var is a plaintext shared-password
  comparison (not hashable via `generated_from`), so instead of using it we
  would leave it unset and put a Traefik `basic_auth: true` gate in front
  of the whole app on its public port — the same pattern already used for
  n8n and Open WebUI — to avoid shipping an open, unauthenticated public
  endpoint. That makes it mechanically installable today with no blocking
  issues, so it is recommended as `build_now`. Separately, for context: the
  pinned Docker image tag (v2.16.1) and its upstream GitHub tag are both
  dated 2025-07-29 — over a year stale as of today (2026-08-05), with no
  newer tagged release or image build since, even though the repo's `main`
  branch is still committed to monthly and issues are actively triaged (847
  open). This staleness is not a blocking issue for installability and does
  not affect the recommendation.
