slug: your-spotify
name: Your Spotify
source_description: "Self-hosted Spotify listening statistics dashboard with rich charts and history"

upstream:
  url: https://github.com/Yooooomi/your_spotify
  repo_url: https://github.com/Yooooomi/your_spotify
  license: GPL-3.0
  docker_image: yooooomi/your_spotify_server (+ yooooomi/your_spotify_client)

version_health:
  latest_version: "1.20.0"
  latest_release_date: "2024-05-24"
  release_cadence: sporadic
  eol_status: active
  notes: >
    Latest tagged release (1.20.0) is from 2024-05-24 — over 2 years old as
    of today (2026-08-05), with no SemVer release since. However, the
    master branch is not dormant: commit history shows active work as
    recently as 2026-07-10 (e.g. "fixed crashing mui menu item"), and a
    `nightly` Docker tag is pushed continuously off master (content-hash
    tags a few weeks old at time of research). So this is a project that
    develops actively but has stopped cutting formal releases — pinning to
    the last tagged version (`1.20.0`) would mean shipping a build over two
    years stale, while the only current alternative is an unpinned/rotating
    `nightly` tag, which conflicts with the "pinned, current stable tag"
    requirement for a new recipe. Repo is not archived; 126 open issues and
    13 open PRs suggest normal maintainer-bandwidth backlog, not abandonment.

catalogue_fit:
  categories: [media, analytics]
  has_web_ui: true
  reverse_proxy_compatible: false
  overlaps_with: []
  differentiation: >
    Nothing in the current 24 recipes does personal listening-history
    analytics. Closest neighbors are dashboard-style apps like Uptime Kuma
    or Home Assistant, but none touch music/streaming data. This would be a
    genuinely new category for the catalogue (personal media analytics) with
    broad casual appeal for anyone with a Spotify account.
  usefulness: medium
  usefulness_rationale: >
    Popular, well-known self-hosted project with real demand (frequently
    recommended in self-hosting communities), but its value is entirely
    gated on the customer completing a Spotify Developer OAuth app
    registration before the recipe does anything useful — a meaningfully
    higher setup barrier than a one-click "give it a domain" app, which caps
    usefulness below apps that work immediately after install.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot: [spotify_client_id, spotify_client_secret]
  secrets_expressible_today: []
  blocking_issues:
    - >
      The app is functionally inert without `SPOTIFY_PUBLIC` (Spotify OAuth
      client ID) and `SPOTIFY_SECRET` (Spotify OAuth client secret) — both
      obtained by the customer registering their own app in the Spotify
      Developer dashboard and pointing its OAuth redirect URI at their
      deployed instance's domain. This is exactly the "OAuth app
      registration / third-party account linking" case the schema calls
      `no` — there is no channel today for af-api to project an
      externally-issued, customer-specific value like this into `/compose`.
    - >
      Ships as two separate HTTP services (server on :8080, client on
      :3000) with no built-in reverse-proxy path-routing between them in
      the example compose file — the client is configured to call the
      server via its own `API_ENDPOINT`, so putting both behind one
      `<slug>.<base_domain>` Traefik router needs either a rewrite of the
      client's env-driven API base URL scheme or a second subdomain/path
      rule per service. Solvable at recipe-authoring time, but it is not
      "single port, drop-in" like most of the current catalogue — noted
      here since it compounds the OAuth blocker rather than standing alone.
    - >
      No admin login of its own beyond the Spotify OAuth flow, so a
      Traefik `basic_auth` gate is not a substitute credential path here —
      it would just add an extra login in front of an app that still can't
      function without the customer's own Spotify app credentials.
  installable_today: false
  recommendation: blocked_on_platform

summary: >
  Your Spotify would fill a genuinely new niche (personal listening-history
  analytics) not covered by any of the current 24 recipes, and the upstream
  project is under active development. But it is blocked on two independent
  grounds: it hard-requires a customer-supplied Spotify OAuth client
  ID/secret with no projection mechanism today, and the last formal release
  is over two years stale (development has continued on master/nightly but
  without new version tags), so there is no good pinned-tag choice even if
  the OAuth blocker were solved. Revisit once the platform has an external
  API-credential input channel; at that point also re-check whether upstream
  has resumed cutting tagged releases.
