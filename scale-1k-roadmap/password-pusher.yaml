slug: password-pusher
name: Password Pusher
source_description: "Self-hosted secret sharing with one-time, expiring links for passwords and files"

upstream:
  url: https://pwpush.com
  repo_url: https://github.com/pglombardo/PasswordPusher
  license: Apache-2.0
  docker_image: pglombardo/pwpush

version_health:
  latest_version: v2.9.7
  latest_release_date: 2026-08-02
  release_cadence: active
  eol_status: active
  notes: >
    Latest tag (v2.9.7) shipped 4 days before this analysis (2026-08-06),
    with v2.9.0-v2.9.7 all landing within the preceding 5 weeks (2026-07-03
    to 2026-08-02) — several releases per week, including a security fix in
    v2.9.6 (unauthorized deletion of anonymous pushes). Project has run
    since well before 2020 and continues shipping new features (e.g.
    "Auto-dispatch" email delivery added in v2.9.0) as well as a
    self-hosted "Pro" tier, both signs of an actively maintained, commercially
    backed OSS project rather than maintenance-only.

catalogue_fit:
  categories: [security, productivity, secret-sharing]
  has_web_ui: true
  reverse_proxy_compatible: true
  overlaps_with: []
  differentiation: >
    Distinct from Vaultwarden (long-term password vault for the customer's
    own credentials) — Password Pusher is a one-shot, expiring-link
    mechanism for handing a secret (password, file, or URL) to a third
    party who does not have an account on the instance. No existing recipe
    in the catalogue covers ephemeral secret/file sharing.
  usefulness: medium
  usefulness_rationale: >
    Useful, narrow-purpose tool (onboarding credentials, one-off file
    drops) that a subset of customers — IT/ops teams, agencies handing
    off client credentials — would value; not a broad-appeal app like a
    password manager or dashboard, so demand is likely lower-volume than
    top-tier catalogue entries.

installability:
  recipe_type_guess: docker-compose
  secrets_required_at_first_boot:
    - basic_auth_password
  secrets_expressible_today:
    - secret: basic_auth_password
      mechanism: traefik_basic_auth
  blocking_issues: []
  installable_today: true
  recommendation: build_now

summary: >
  Password Pusher is a single-container (SQLite-backed), single-HTTP-port
  app with no mandatory login of its own — anonymous push creation/viewing
  is the default behavior — so it fits the recipe mechanism cleanly via a
  Traefik basic_auth gate on the whole app, exactly the pattern already
  used for n8n/Immich/Open WebUI. Upstream is actively released (multiple
  tags in the last month, security fixes still landing) and Apache-2.0
  licensed. It fills a real gap (ephemeral secret/file sharing) with no
  overlap in the current 24-recipe catalogue; the optional multi-user
  "admin dashboard" feature requires a shell-exec + email-reset flow to
  provision (no automated channel), but that's a non-required bonus
  feature, not a blocker for shipping the core app. Recommend build_now.
