services:
  nats:
    image: nats:2.14.4
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - /opt/nats/config:/etc/nats:ro
      - /opt/nats/data:/data/jetstream
    networks:
      - nats-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  nats-network:
    driver: bridge
