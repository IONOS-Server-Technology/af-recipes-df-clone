id: nats
enabled: false
display_name: NATS
description: Cloud-native messaging system with pub/sub, request-reply, and persistent streaming via JetStream.
short_description:
  en: "Connect your applications and microservices with a fast, lightweight message broker — pub/sub, request-reply, and durable streaming in one."
  de: "Verbinde Anwendungen und Microservices mit einem schnellen, leichtgewichtigen Message Broker — Pub/Sub, Request-Reply und dauerhaftes Streaming in einem."
  es: "Conecta tus aplicaciones y microservicios con un broker de mensajes rápido y ligero — pub/sub, request-reply y streaming duradero en uno."
  fr: "Connectez vos applications et microservices avec un broker de messages rapide et léger — pub/sub, request-reply et streaming durable en un seul outil."
  it: "Connetti le tue applicazioni e microservizi con un message broker veloce e leggero — pub/sub, request-reply e streaming persistente in uno."
  nl: "Verbind je applicaties en microservices met een snelle, lichtgewicht message broker — pub/sub, request-reply en duurzame streaming in één."
  pl: "Połącz swoje aplikacje i mikroserwisy szybkim, lekkim brokerem wiadomości — pub/sub, request-reply i trwały streaming w jednym."
categories:
  - infrastructure
  - developer-tools
app_version: "2.14.4"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://nats.io/
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/nats/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/cncf/artwork/main/projects/nats/icon/color/nats-icon-color.svg
logo_license: trademark-nominative-fair-use
logo_sha256: aac605abe0da4e658508e0fe48cbb128df0a71afff977f88eac455269426d510

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 4222
    protocol: tcp
    public: true
    http: false
    description: NATS client connections
  - port: 8222
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: NATS monitoring HTTP interface

parameters:
  - name: NATS_PASSWORD
    display_name: NATS Client Password
    type: password
    description: Password for authenticating NATS client connections.
    generated_from: "bcrypt:ROOT_PASSWORD"
