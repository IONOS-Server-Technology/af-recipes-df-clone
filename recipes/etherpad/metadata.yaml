id: etherpad
enabled: false
display_name: Etherpad
description: Real-time collaborative text editor with live editing and version history.
short_description:
  en: "Edit notes and documents together in real time — a self-hosted collaborative pad with full version history."
  de: "Notizen und Dokumente gemeinsam in Echtzeit bearbeiten — ein selbst gehosteter kollaborativer Editor mit vollständigem Versionsverlauf."
  es: "Edita notas y documentos juntos en tiempo real — un editor colaborativo autoalojado con historial de versiones completo."
  fr: "Éditez notes et documents ensemble en temps réel — un éditeur collaboratif auto-hébergé avec historique de versions complet."
  it: "Modifica note e documenti insieme in tempo reale — un editor collaborativo self-hosted con cronologia versioni completa."
  nl: "Bewerk notities en documenten samen in realtime — een zelf gehoste collaboratieve editor met volledige versiegeschiedenis."
  pl: "Edytuj notatki i dokumenty razem w czasie rzeczywistym — samodzielnie hostowany edytor współpracy z pełną historią wersji."
categories:
  - productivity
  - communication
app_version: "3.3.3"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/ether/etherpad
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/etherpad/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/ether/etherpad/develop/src/etherpad_icon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: e2fdb596a57078a5b677b20715dc3b22d546b8448545d9ba997a6a0d786c7d11

app_min_ram_mb: 2048
app_min_disk_mb: 20480


# basic_auth: Etherpad's main pad-editing UI has no built-in login by default — any
# visitor who reaches the URL can view and edit pads. The Traefik basic_auth gate
# closes this open-access window during setup (same pattern as n8n/HedgeDoc,
# RFC-001 §4.3.1). The separate /admin plugin-management panel is protected by
# ADMIN_PASSWORD independently, so the basic_auth gate is the customer-facing
# access boundary for pads. Trade-off: the gate is router-wide, so no URL under
# the domain (including any future webhook-style integrations) bypasses it until
# the customer runs '/root/auth.sh off etherpad'.
ports:
  - port: 9001
    protocol: tcp
    public: true
    basic_auth: true
    description: Etherpad Web UI

parameters:
  - name: ADMIN_PASSWORD
    display_name: Admin Password
    type: password
    description: Password for the Etherpad /admin plugin-management panel, server-generated at first boot.

  - name: DB_PASS
    display_name: Database Password
    type: password
    description: PostgreSQL password for the Etherpad database user, server-generated at first boot.
