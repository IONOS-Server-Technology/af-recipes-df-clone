id: plausible-analytics
enabled: false
display_name: Plausible Analytics
description: Privacy-first, lightweight web analytics — a cookie-free Google Analytics alternative.
short_description:
  en: "Track website traffic without invading privacy — Plausible is a lightweight, cookie-free analytics tool that is GDPR-friendly by design."
  de: "Website-Traffic datenschutzkonform messen — Plausible ist ein schlankes, cookie-freies Analysetool, das von Grund auf DSGVO-konform ist."
  es: "Analiza el tráfico web sin vulnerar la privacidad — Plausible es una herramienta sin cookies y conforme al RGPD por diseño."
  fr: "Analysez votre trafic web sans violer la vie privée — Plausible est un outil d'analyse léger, sans cookies et conforme au RGPD."
  it: "Monitora il traffico del sito rispettando la privacy — Plausible è uno strumento leggero, senza cookie e conforme al GDPR."
  nl: "Analyseer websiteverkeer zonder privacyinbreuk — Plausible is een lichtgewicht, cookievrij analysetool dat standaard AVG-conform is."
  pl: "Śledź ruch na stronie bez naruszania prywatności — Plausible to lekkie narzędzie analityczne bez ciasteczek, zgodne z RODO."
categories:
  - monitoring
app_version: "v3.2.1"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://plausible.io
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/plausible-analytics/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/plausible/analytics/master/priv/static/images/ce/logo_light.svg
logo_license: trademark-nominative-fair-use
logo_sha256: e078e35fb7597fea7a7c296510c0d54b8c2f5ba1561413a20e20ccd392dfe08a

app_min_ram_mb: 2048
app_min_disk_mb: 20480

# basic_auth closes the open-registration race window. On first launch Plausible's
# MaybeDisableRegistration plug bypasses DISABLE_REGISTRATION (even when set to
# invite_only) until at least one user exists in the DB, so whoever reaches the URL
# first becomes the instance owner. The Traefik basic_auth gate makes the signup form
# unreachable until the customer has authenticated — the same trade-off as n8n and
# immich. The entire router is behind the prompt, including any tracking script
# endpoints; the customer removes the gate once their first account is created with
# '/root/auth.sh off plausible-analytics'. See apps-gaps/plausible-analytics.yaml
# (summary) for the full analysis of this design decision.
ports:
  - port: 8000
    protocol: tcp
    public: true
    basic_auth: true
    description: Plausible Analytics Web UI

parameters:
  - name: SECRET_KEY_BASE
    display_name: Secret Key Base
    type: password
    description: Random ≥64-byte secret used for session signing. Generated by install.sh.

  - name: POSTGRES_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL password for the internal Plausible database. Generated by install.sh.
