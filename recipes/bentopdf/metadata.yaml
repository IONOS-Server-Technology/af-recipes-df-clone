id: bentopdf
enabled: false
display_name: BentoPDF
description: Privacy-first browser-based PDF toolkit for merging, splitting, converting, and editing PDFs.
short_description:
  en: "Merge, split, compress, convert, and edit PDFs in your browser — all processing happens client-side, so your files never leave your server."
  de: "PDFs zusammenführen, aufteilen, komprimieren, konvertieren und bearbeiten — alles im Browser, Dateien verlassen Ihren Server nicht."
  es: "Fusiona, divide, comprime, convierte y edita PDFs en el navegador — todo el procesamiento es local, tus archivos no salen del servidor."
  fr: "Fusionnez, divisez, compressez, convertissez et éditez des PDF dans le navigateur — traitement local, vos fichiers ne quittent pas le serveur."
  it: "Unisci, dividi, comprimi, converti e modifica PDF nel browser — elaborazione lato client, i file non lasciano il server."
  nl: "Voeg PDF's samen, splits, comprimeer, converteer en bewerk in de browser — alle verwerking is lokaal, bestanden verlaten uw server niet."
  pl: "Łącz, dziel, kompresuj, konwertuj i edytuj pliki PDF w przeglądarce — przetwarzanie lokalne, pliki nie opuszczają serwera."
categories:
  - productivity
  - utilities
app_version: "2.8.7"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/alam00000/bentopdf
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/bentopdf/0.2.0/logo.svg
logo_source: https://bentopdf.com/images/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: d6b8387399066ab45dff2b51f3f5a7f83dcfca76f7ca5f2bcb83c8360e53a031

app_min_ram_mb: 256
app_min_disk_mb: 2048

# BentoPDF has no built-in login — all PDF operations run client-side in the browser via WASM;
# no file content reaches the server. basic_auth: true gates the subdomain with the customer's
# server password via Traefik, same pattern as Adminer and Stirling PDF, to keep the subdomain
# from being anonymously usable by anyone who finds it.
ports:
  - port: 8080
    protocol: tcp
    public: true
    basic_auth: true
    description: BentoPDF Web UI
