services:
  bentopdf:
    image: ghcr.io/alam00000/bentopdf-simple:2.8.7
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - bentopdf-network
    healthcheck:
      # BentoPDF serves its main UI on / — a 200 means the static web server is up.
      # Using 127.0.0.1 (not localhost) to avoid DNS resolving to ::1 when only IPv4 is bound.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  bentopdf-network:
    driver: bridge
