id: hievents
enabled: false
display_name: Hi.Events
description: Self-hosted event management and ticketing platform with Stripe-powered payments.
short_description:
  en: "Create event pages, sell tickets, and manage attendees on your own server — a self-hosted Eventbrite alternative with your own Stripe account."
  de: "Veranstaltungsseiten erstellen, Tickets verkaufen und Teilnehmer auf dem eigenen Server verwalten — selbst gehostete Alternative zu Eventbrite."
  es: "Crea páginas de eventos, vende entradas y gestiona asistentes en tu propio servidor — alternativa autoalojada a Eventbrite con tu cuenta Stripe."
  fr: "Créez des pages d'événements, vendez des billets et gérez les participants sur votre serveur — alternative auto-hébergée à Eventbrite."
  it: "Crea pagine eventi, vendi biglietti e gestisci i partecipanti sul tuo server — alternativa self-hosted a Eventbrite con il tuo account Stripe."
  nl: "Maak evenementpagina's, verkoop tickets en beheer deelnemers op je eigen server — een zelfgehost alternatief voor Eventbrite met Stripe."
  pl: "Twórz strony wydarzeń, sprzedawaj bilety i zarządzaj uczestnikami na własnym serwerze — samodzielnie hostowana alternatywa dla Eventbrite."
categories:
  - productivity
app_version: "v.1.11.0-beta"
recipe_version: "0.1.1"
recipe_type: docker-compose
upstream_url: https://github.com/HiEventsDev/hi.events
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/hievents/0.1.1/logo.svg
logo_source: https://raw.githubusercontent.com/HiEventsDev/hi.events/main/frontend/public/logos/hi-events-icon-dark.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 6912f7afbedbfd1658fabef62be9fe645032a34c6185c441b0056e50092adef0

app_min_ram_mb: 2048
app_min_disk_mb: 20480


# basic_auth closes the first-visit registration race. Hi.Events ships with open
# registration (APP_DISABLE_REGISTRATION=false) and no admin env-var login — the
# first user to reach /auth/register becomes the instance owner. The Traefik
# basic_auth gate makes the signup form unreachable until the customer authenticates.
#
# Trade-off: while the gate is on, every request to the subdomain — including
# external ticket buyers following a link to an event — hits the basic_auth prompt.
# Customers must remove the gate once their account exists:
#     /root/auth.sh off hievents
#
# Same pattern as n8n (IF-1312) and immich.
ports:
  - port: 80
    protocol: tcp
    public: true
    basic_auth: true
    description: Hi.Events Web UI

parameters:
  - name: APP_KEY
    display_name: Application Encryption Key
    type: password
    description: Laravel application encryption key. Generated by install.sh at deploy time.

  - name: JWT_SECRET
    display_name: JWT Secret
    type: password
    description: JWT token signing secret. Generated by install.sh at deploy time.

  - name: POSTGRES_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password. Generated by install.sh at deploy time.
