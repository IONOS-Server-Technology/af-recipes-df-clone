id: readeck
enabled: false
display_name: Readeck
description: Self-hosted read-it-later app that archives readable web content forever.
short_description:
  en: "Save articles, videos, and web pages as a clean, permanent, ad-free copy — your own self-hosted read-it-later library."
  de: "Artikel, Videos und Webseiten als saubere, dauerhafte, werbefreie Kopie speichern — Ihre eigene selbst gehostete Read-it-later-Bibliothek."
  es: "Guarda artículos, vídeos y páginas web como una copia limpia, permanente y sin anuncios — tu propia biblioteca de lectura diferida autoalojada."
  fr: "Enregistrez articles, vidéos et pages web en copie propre, permanente et sans publicité — votre propre bibliothèque de lecture hors ligne auto-hébergée."
  it: "Salva articoli, video e pagine web come copia pulita, permanente e senza pubblicità — la tua libreria read-it-later self-hosted."
  nl: "Sla artikelen, video's en webpagina's op als schone, permanente, advertentievrije kopie — je eigen zelf-gehoste read-it-later-bibliotheek."
  pl: "Zapisuj artykuły, filmy i strony jako czystą, trwałą kopię bez reklam — własna biblioteka do późniejszego czytania na własnym serwerze."
categories:
  - productivity
app_version: "0.22.3"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://codeberg.org/readeck/readeck
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/readeck/0.2.0/logo.svg
logo_source: https://readeck.org/media/favicons/favicon.d57024ea.svg
logo_license: trademark-nominative-fair-use
logo_sha256: f4cedf5b4b1248fefd22c8945dfffc72b2b962a805e7b824d9fc0c1d71a52164

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 8000
    protocol: tcp
    public: true
    description: Readeck Web UI
