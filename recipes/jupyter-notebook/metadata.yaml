id: jupyter-notebook
enabled: false
display_name: Jupyter Notebook
description: Interactive notebook environment for live code, data analysis, and visualisations.
short_description:
  en: "Run Jupyter Notebook on your own server — write code in cells, analyse data, and build interactive visualisations without cloud lock-in."
  de: "Jupyter Notebook auf dem eigenen Server — Code in Zellen schreiben, Daten analysieren und interaktive Visualisierungen erstellen."
  es: "Ejecuta Jupyter Notebook en tu servidor — escribe código en celdas, analiza datos y crea visualizaciones interactivas sin depender de la nube."
  fr: "Jupyter Notebook sur votre propre serveur — écrivez du code en cellules, analysez des données et créez des visualisations interactives."
  it: "Esegui Jupyter Notebook sul tuo server — scrivi codice nelle celle, analizza dati e crea visualizzazioni interattive senza dipendere dal cloud."
  nl: "Draai Jupyter Notebook op je eigen server — schrijf code in cellen, analyseer data en maak interactieve visualisaties zonder de cloud."
  pl: "Uruchom Jupyter Notebook na własnym serwerze — pisz kod w komórkach, analizuj dane i twórz interaktywne wizualizacje bez chmury."
categories:
  - developer-tools
  - education
app_version: "7.6.1"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://jupyter.org
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/jupyter-notebook/0.2.0/logo.svg
logo_source: https://jupyter.org/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: e29f9097a84ed773b4654af19964df8ded4d0e59a31e9dbe03aa5c7043a4a147

app_min_ram_mb: 1024
app_min_disk_mb: 5120

ports:
  - port: 8888
    protocol: tcp
    public: true
    http: true
    description: Jupyter Notebook Web UI

parameters:
  # generated_from (IF-1420): HASHED_PASSWORD is derived from the customer's server
  # (root) password at compose time. Upstream documents NOTEBOOK_ARGS passing
  # --PasswordIdentityProvider.hashed_password as an argon2id PHC string, which maps
  # directly onto the argon2 mechanism. The customer logs in with their server password.
  - name: HASHED_PASSWORD
    display_name: Login Password
    type: password
    generated_from: "argon2:ROOT_PASSWORD"
    description: >-
      Password hash for the Jupyter Notebook login page. Derived from your server
      password at install time — log in to Jupyter Notebook with that same password.
