id: formio
enabled: false
display_name: Form.io
description: Open-source form builder and data management platform with REST API.
short_description:
  en: "Build forms visually and expose a REST API for every submission — all data stays on your own server."
  de: "Formulare visuell erstellen und für jede Einsendung eine REST-API bereitstellen — alle Daten bleiben auf dem eigenen Server."
  es: "Crea formularios visualmente y expón una API REST para cada envío — todos los datos permanecen en tu servidor."
  fr: "Créez des formulaires visuellement et exposez une API REST pour chaque soumission — toutes les données restent sur votre serveur."
  it: "Crea moduli visivamente e ottieni un'API REST per ogni invio — tutti i dati rimangono sul tuo server."
  nl: "Bouw formulieren visueel en maak een REST API voor elke inzending — alle data blijft op je eigen server."
  pl: "Twórz formularze wizualnie i udostępniaj REST API dla każdego zgłoszenia — wszystkie dane pozostają na Twoim serwerze."
categories:
  - productivity
  - developer-tools
app_version: "rc"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/formio/formio
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/formio/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/formio/formio/main/portal/public/icon-formio-small.svg
logo_license: trademark-nominative-fair-use
logo_sha256: e7bfb72c3fb48b298678bdba0d8492548afcd9a26a0a2d2c84c8fb0f5f238f3a

app_min_ram_mb: 2048
app_min_disk_mb: 20480

ports:
  - port: 3001
    protocol: tcp
    public: true
    description: Form.io Web UI and API

parameters:
  - name: ROOT_PASSWORD
    display_name: Admin Password
    type: password
    generated_from: "argon2:ROOT_PASSWORD"
    description: Password for the Form.io project-admin account. Derived from your server password — log in with your server password.
