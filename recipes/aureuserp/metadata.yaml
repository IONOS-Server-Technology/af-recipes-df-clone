id: aureuserp
enabled: false
display_name: AureusERP
description: Open-source ERP platform for managing finance, HR, inventory, sales, and CRM.
short_description:
  en: "Self-host a complete ERP suite — manage finance, HR, inventory, sales, and CRM on your own server without SaaS fees."
  de: "ERP-Suite selbst hosten — Finanzen, HR, Lager, Vertrieb und CRM auf eigenem Server verwalten, ohne SaaS-Kosten."
  es: "Aloja tu propio ERP completo — gestiona finanzas, RRHH, inventario, ventas y CRM en tu servidor sin cuotas SaaS."
  fr: "Hébergez une suite ERP complète — gérez finances, RH, stocks, ventes et CRM sur votre serveur sans abonnement SaaS."
  it: "Ospita una suite ERP completa — gestisci finanze, HR, inventario, vendite e CRM sul tuo server senza costi SaaS."
  nl: "Host een complete ERP-suite zelf — beheer financiën, HR, voorraad, verkoop en CRM op je eigen server zonder SaaS-kosten."
  pl: "Samodzielnie hostuj kompletny system ERP — zarządzaj finansami, HR, magazynem, sprzedażą i CRM bez opłat SaaS."
categories:
  - finance
  - productivity
app_version: "1.5.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/aureuserp/aureuserp
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/aureuserp/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/aureuserp/aureuserp/master/public/images/logo.svg
logo_license: trademark-nominative-fair-use
logo_sha256: e55735607cdce010839c2e89c1c760d0ee473cc816bc01a26f74c1bad4ee785e

app_min_ram_mb: 2048
app_min_disk_mb: 20480

# basic_auth: AureusERP creates its admin account (admin@example.com / admin@123) via
# `php artisan erp:install` at first boot with credentials that cannot be overridden by
# env vars (confirmed in aureuserp/dev-docs#5). The platform's basic-auth gate closes the
# unauthenticated-takeover window until the customer changes those defaults and runs
# /root/auth.sh off aureuserp. Trade-off: inbound requests receive 401 until the gate
# is lifted, same accepted pattern as n8n and odoo.
ports:
  - port: 80
    protocol: tcp
    public: true
    basic_auth: true
    description: AureusERP Web UI
