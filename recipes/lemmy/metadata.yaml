id: lemmy
enabled: false
display_name: Lemmy
description: Federated link aggregator and discussion platform for self-hosted community forums.
short_description:
  en: "Run your own federated community forum — Lemmy connects to the wider fediverse via ActivityPub."
  de: "Betreiben Sie Ihr eigenes föderiertes Community-Forum — Lemmy verbindet sich via ActivityPub mit dem Fediverse."
  es: "Gestiona tu propio foro comunitario federado — Lemmy se conecta al fediverso a través de ActivityPub."
  fr: "Hébergez votre propre forum communautaire fédéré — Lemmy se connecte au fediverse via ActivityPub."
  it: "Gestisci il tuo forum comunitario federato — Lemmy si connette al fediverso tramite ActivityPub."
  nl: "Beheer je eigen gefedereerd communityforum — Lemmy verbindt zich via ActivityPub met het fediverse."
  pl: "Prowadź własne sfederowane forum społecznościowe — Lemmy łączy się z fediverse przez ActivityPub."
categories:
  - communication
app_version: "0.19.20"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/LemmyNet/lemmy
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/lemmy/0.2.0/logo.svg
logo_source: https://join-lemmy.org/static/assets/icons/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 1b8e9d53fd76c20bbc875fb9a2c5b9f9d273f443ad64a8bea43c142b0f71c458

app_min_ram_mb: 4096
app_min_disk_mb: 20480


# basic_auth (IF-1312): a fresh Lemmy instance shows an in-browser setup screen — the first
# visitor to reach it creates the admin account (same open-registration pattern as n8n and
# Misskey, both of which use basic_auth: true for the same reason). The Traefik basic-auth
# gate ensures the customer is the one who reaches the setup form first, closing that
# takeover window. The customer disables it once their admin account exists:
#
#     /root/auth.sh off lemmy
ports:
  - port: 80
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: Lemmy Web UI (via internal nginx proxy)
