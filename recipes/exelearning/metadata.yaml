id: exelearning
enabled: false
display_name: eXeLearning
description: Open-source authoring tool for interactive SCORM and HTML5 educational content.
short_description:
  en: "Create and publish interactive SCORM and HTML5 e-learning courses with a self-hosted open-source authoring tool."
  de: "Interaktive SCORM- und HTML5-E-Learning-Kurse erstellen und veröffentlichen — mit einem selbstgehosteten Open-Source-Autorenwerkzeug."
  es: "Crea y publica cursos e-learning interactivos SCORM y HTML5 con una herramienta de autoría de código abierto autoalojada."
  fr: "Créez et publiez des cours e-learning interactifs SCORM et HTML5 avec un outil d'édition open source auto-hébergé."
  it: "Crea e pubblica corsi e-learning interattivi SCORM e HTML5 con uno strumento di authoring open source self-hosted."
  nl: "Maak en publiceer interactieve SCORM- en HTML5-e-learningcursussen met een zelfgehoste open-source auteurstool."
  pl: "Twórz i publikuj interaktywne kursy e-learningowe SCORM i HTML5 za pomocą samodzielnie hostowanego narzędzia open source."
categories:
  - education
  - productivity
app_version: "${TAG:-latest}"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://exelearning.net/en/home-2/
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/exelearning/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/exelearning/exelearning/main/public/icon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: db60c99c10d95755f02a2d6c0cde86d54226e3378c7afaa6456a8ec61e5581b7

app_min_ram_mb: 256
app_min_disk_mb: 5120

ports:
  - port: 8080
    protocol: tcp
    public: true
    description: eXeLearning Web UI

parameters:
  - name: ADMIN_PASSWORD
    display_name: Admin Password
    type: password
    generated_from: "argon2:ROOT_PASSWORD"
    description: Password for the admin account. Derived from your server password — log in with that password after install.
