services:
  exelearning:
    image: ghcr.io/exelearning/exelearning:${TAG:-latest}
    restart: unless-stopped
    environment:
      - APP_ENV=prod
      - APP_DEBUG=0
      - APP_SECRET=${APP_SECRET}
      - APP_ONLINE_MODE=1
      - ONLINE_THEMES_INSTALL=0
      - DB_DRIVER=pdo_sqlite
      - DB_PATH=/mnt/data/exelearning.db
      - DB_SERVER_VERSION=3.32
      - FILES_DIR=/mnt/data/
      - APP_AUTH_METHODS=password
      - AUTH_CREATE_USERS=true
      - ADMIN_EMAIL=admin@localhost
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - API_JWT_SECRET=${API_JWT_SECRET}
    ports:
      - "8080:8080"
    volumes:
      - /opt/exelearning/data:/mnt/data
    networks:
      - exelearning-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  exelearning-network:
    driver: bridge
