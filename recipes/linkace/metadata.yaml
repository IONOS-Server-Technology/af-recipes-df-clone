id: linkace
enabled: false
display_name: LinkAce
description: Self-hosted bookmark archive with link monitoring, broken-link detection, tagging, and a REST API.
short_description:
  en: "Archive and monitor your bookmarks privately — LinkAce watches for broken links and snapshots pages on your own server."
  de: "Lesezeichen privat archivieren und überwachen — LinkAce erkennt tote Links und sichert Seiteninhalte auf dem eigenen Server."
  es: "Archiva y monitoriza tus marcadores de forma privada — LinkAce detecta enlaces rotos y guarda instantáneas en tu servidor."
  fr: "Archivez et surveillez vos favoris en privé — LinkAce détecte les liens brisés et prend des captures sur votre serveur."
  it: "Archivia e monitora i tuoi segnalibri privatamente — LinkAce rileva i link interrotti e salva le pagine sul tuo server."
  nl: "Archiveer en monitor je bladwijzers privé — LinkAce detecteert gebroken links en slaat paginamomentopnames op je server op."
  pl: "Archiwizuj i monitoruj zakładki prywatnie — LinkAce wykrywa martwe linki i zapisuje migawki stron na twoim serwerze."
categories:
  - productivity
app_version: "v2.6.1"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/Kovah/LinkAce
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/linkace/0.2.0/logo.svg
logo_source: https://www.linkace.org/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 2c99feecf681d23372731ee3dae2c2e438ad1998a64c13b5de0dbc7e8a5abaef

app_min_ram_mb: 2048
app_min_disk_mb: 20480

# LinkAce's setup wizard claims the first visitor.
# basic_auth: true gates the whole frontend behind Traefik until the customer
# completes setup and turns auth off: /root/auth.sh off linkace
ports:
  - port: 80
    protocol: tcp
    public: true
    basic_auth: true
    description: LinkAce Web UI

parameters:
  - name: APP_KEY
    display_name: Application Key
    type: password
    description: Laravel application key used for session encryption.

  - name: DB_PASSWORD
    display_name: Database Password
    type: password
    description: MariaDB database password for LinkAce.

  - name: REDIS_PASSWORD
    display_name: Redis Password
    type: password
    description: Redis authentication password.

  - name: MEILI_MASTER_KEY
    display_name: Meilisearch Master Key
    type: password
    description: Master key for the Meilisearch full-text search engine.
