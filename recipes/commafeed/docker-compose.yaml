services:
  commafeed:
    image: athou/commafeed:7.2.1-h2
    restart: unless-stopped
    ports:
      - "8082:8082"
    volumes:
      - /opt/commafeed/data:/data
    networks:
      - commafeed-network
    healthcheck:
      # CommaFeed serves its web UI on / — a 200 means the app is up.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  commafeed-network:
    driver: bridge
