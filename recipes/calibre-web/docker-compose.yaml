services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:0.6.26
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    ports:
      - "8083:8083"
    volumes:
      - /opt/calibre-web/config:/config
      - /opt/calibre-web/books:/books
    networks:
      - calibre-web-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  calibre-web-network:
    driver: bridge
