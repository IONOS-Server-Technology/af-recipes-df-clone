  de: "Eigene Kurzlinks auf dem Server erstellen und mit Klick-Analytik verfolgen — mit REST-API, Tags und eigener Domain."
  es: "Crea y rastrea enlaces cortos en tu propio servidor — con analítica de clics, API REST y organización por etiquetas."
  fr: "Créez et suivez des liens courts sur votre serveur — avec statistiques de clics, API REST et organisation par tags."
  it: "Crea e monitora link brevi sul tuo server — con analisi dei clic, REST API e organizzazione tramite tag."
  nl: "Maak en volg korte links op je eigen server — met klikanalyse, REST API en tag-gebaseerde organisatie."
  pl: "Twórz i śledź krótkie linki na własnym serwerze — z analizą kliknięć, REST API i organizacją tagami."
categories:
  - productivity
