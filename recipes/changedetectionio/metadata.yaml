id: changedetectionio
enabled: false
display_name: changedetection.io
description: Website change detection and monitoring tool with visual selection and notifications.
short_description:
  en: "Get notified the moment a webpage changes — track price drops, restock alerts, or any content update with visual diffing."
  de: "Erhalte sofortige Benachrichtigungen bei Änderungen auf Webseiten – Preisänderungen, Lagerbestände und beliebige Inhaltsaktualisierungen mit visuellem Diff."
  es: "Recibe alertas al instante cuando cambia una página web — rastrea bajadas de precio, reposiciones de stock o cualquier actualización de contenido."
  fr: "Soyez notifié dès qu'une page web change — suivez les baisses de prix, les alertes de réapprovisionnement ou toute mise à jour de contenu."
  it: "Ricevi notifiche istantanee quando una pagina web cambia — traccia cali di prezzo, ritorni in stock o qualsiasi aggiornamento di contenuto."
  nl: "Ontvang meldingen zodra een webpagina verandert — volg prijsdalingen, voorraadwaarschuwingen of willekeurige inhoudswijzigingen."
  pl: "Otrzymuj powiadomienia natychmiast po zmianie strony internetowej — śledź spadki cen, powroty produktów do sprzedaży lub dowolne zmiany treści."
categories:
  - monitoring
  - productivity
app_version: "0.55.8"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/dgtlmoon/changedetection.io
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/changedetectionio/0.2.0/logo.svg
logo_source: https://changedetection.io/themes/cdio/assets/images/favicons/safari-pinned-tab.svg
logo_license: trademark-nominative-fair-use
logo_sha256: c43f767186ce5ad7e0ada06e09f4b6eb80f05673cfb98630c7ddc3bbaa5e80a5

app_min_ram_mb: 256
app_min_disk_mb: 2048

# changedetection.io ships with no authentication until the customer manually sets a
# password in Settings. basic_auth: true gates the public port behind the customer's
# server password via Traefik (traefik_basic_auth mechanism), matching the same shape
# as Adminer — no generated_from parameter is needed.
ports:
  - port: 5000
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: changedetection.io Web UI
