id: ampache
enabled: false
display_name: Ampache
description: Self-hosted music and video streaming server with Subsonic API compatibility and mobile client support.
short_description:
  en: "Stream your personal music and video library from anywhere, with Subsonic API support for Android and iOS clients."
  de: "Streame deine persönliche Musik- und Videobibliothek von überall – mit Subsonic-API-Unterstützung für Android und iOS."
  es: "Transmite tu biblioteca personal de música y vídeo desde cualquier lugar con soporte para la API Subsonic."
  fr: "Diffusez votre bibliothèque musicale et vidéo depuis n'importe où, avec prise en charge de l'API Subsonic pour mobiles."
  it: "Trasmetti la tua libreria musicale e video da ovunque, con supporto all'API Subsonic per client Android e iOS."
  nl: "Stream je persoonlijke muziek- en videobibliotheek overal vandaan, met Subsonic API-ondersteuning voor Android en iOS."
  pl: "Streamuj swoją bibliotekę muzyczną i wideo z dowolnego miejsca, z obsługą Subsonic API dla Androida i iOS."
categories:
  - media
app_version: "7.10.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/ampache/ampache
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/ampache/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/selfhst/icons/png/ampache.png
logo_license: trademark-nominative-fair-use
logo_sha256: b38c2e33d3ef8319798dc98d3a4bdd1477a33d25ffc6d7d96d6841bf3fc37fe8

app_min_ram_mb: 512
app_min_disk_mb: 10240

ports:
  - port: 80
    protocol: tcp
    public: true
    description: Ampache Web UI

parameters:
  - name: AMPACHE_ADMIN_PASSWORD
    display_name: Admin Password
    type: password
    generated_from: "bcrypt:ROOT_PASSWORD"
    description: Admin account password. Derived from your server password — log in to Ampache with that password.
