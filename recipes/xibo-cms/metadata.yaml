id: xibo-cms
enabled: false
display_name: Xibo CMS
description: Open-source digital signage CMS for scheduling and pushing content to a network of displays.
short_description:
  en: "Schedule and push digital signage content to a network of displays — open-source CMS with layout authoring, playlists, and real-time player sync."
  de: "Digital Signage-Inhalte planen und auf Displays übertragen — Open-Source-CMS mit Layout-Editor, Playlisten und Echtzeit-Player-Synchronisierung."
  es: "Programa y envía contenido de señalización digital a pantallas — CMS open-source con diseños, listas de reproducción y sincronización en tiempo real."
  fr: "Planifiez et diffusez de la signalétique numérique vers vos écrans — CMS open-source avec éditeur de mise en page, playlists et synchronisation temps réel."
  it: "Pianifica e invia contenuti di segnaletica digitale a una rete di schermi — CMS open-source con editor di layout, playlist e sincronizzazione in tempo reale."
  nl: "Plan en verzend digitale signage-inhoud naar schermen — open-source CMS met layout-editor, afspeellijsten en realtime-spelerssynchronisatie."
  pl: "Planuj i wysyłaj treści cyfrowego oznakowania do ekranów — CMS open-source z edytorem układów, playlistami i synchronizacją odtwarzaczy w czasie rzeczywistym."
categories:
  - media
  - infrastructure
app_version: "release-4.5.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/xibosignage/xibo-cms
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/xibo-cms/0.2.0/logo.svg
logo_source: https://xibosignage.com/hubfs/XIBO%20Logo-05.png
logo_license: trademark-nominative-fair-use
logo_sha256: 6844f6b3131b9c15f5bde9759fb983b4659f1985f6065e4554ad4e2f3dc44691

app_min_ram_mb: 2560
app_min_disk_mb: 20480

ports:
  - port: 80
    protocol: tcp
    public: true
    description: Xibo CMS Web UI
  - port: 9505
    protocol: tcp
    public: true
    http: false
    description: XMR real-time push messaging to display players

parameters:
  - name: MYSQL_PASSWORD
    display_name: Database Password
    type: password
    description: MySQL password for the Xibo CMS database user, generated by install.sh.
