id: rackula
enabled: false
display_name: Rackula
description: Drag-and-drop server rack layout designer for homelabs and data centers.
short_description:
  en: "Plan and document your server rack layouts visually — drag-and-drop real device artwork from the NetBox library, then export to PNG, PDF, or SVG."
  de: "Server-Rack-Layouts visuell planen und dokumentieren – echte Geräte aus der NetBox-Bibliothek per Drag-and-Drop anordnen und als PNG, PDF oder SVG exportieren."
  es: "Planifica y documenta el diseño de tu rack de servidores visualmente: arrastra elementos reales de la biblioteca NetBox y exporta a PNG, PDF o SVG."
  fr: "Planifiez et documentez visuellement vos baies de serveurs — glissez-déposez des icônes réelles de la bibliothèque NetBox, puis exportez en PNG, PDF ou SVG."
  it: "Pianifica e documenta visivamente i layout dei rack server — trascina dispositivi reali dalla libreria NetBox ed esporta in PNG, PDF o SVG."
  nl: "Ontwerp en documenteer server-rackindelingen visueel — versleep echte apparaatpictogrammen uit de NetBox-bibliotheek en exporteer naar PNG, PDF of SVG."
  pl: "Planuj i dokumentuj układy szaf serwerowych wizualnie — przeciągaj prawdziwe urządzenia z biblioteki NetBox i eksportuj do PNG, PDF lub SVG."
categories:
  - infrastructure

# upstream compose file (deploy/docker-compose.persist.yml) uses
# ghcr.io/rackulalives/rackula:persist — a rolling alias for the
# persistent-stack variant. Adopted verbatim per IF-1501 (upstream floats
# a rolling alias; do not resolve to a pinned release tag).
app_version: "persist"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/RackulaLives/Rackula
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/rackula/0.2.0/logo.svg
logo_source: https://www.racku.la/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: c197824318e0f81dbd43ceccb8dd6ee06d092779f4d6a6f133b398bac4e4c5aa

# Frontend (nginx + static): 128 MB limit; API (Node/Bun): 64 MB limit.
# Combined headroom rounds to 256 MB, matching the standard floor for
# two-container recipes without a database.
app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  # Rackula ships no authentication of its own (auth mode kept at "none").
  # basic_auth: true gates the public port with Traefik HTTP basic auth
  # (username: admin / server password) — the same pattern used for WUD and
  # changedetection.io. This matches the traefik_basic_auth mechanism listed
  # in apps-gaps/rackula.yaml and the guidance in apps-gaps summary.
  - port: 8080
    protocol: tcp
    public: true
    basic_auth: true
    description: Web UI

parameters:
  # RACKULA_API_WRITE_TOKEN protects the API's PUT/DELETE routes. It is an
  # opaque random token shared only between the nginx frontend and the API
  # sidecar — no customer input needed. install.sh generates it (e.g.
  # openssl rand -hex 32) and writes it to .env; neither the API nor af-api
  # expose or validate it from metadata at runtime (IF-944). Documented here
  # for recipe-author reference; mechanism in apps-gaps: server_generated_no_customer_input.
  - name: RACKULA_API_WRITE_TOKEN
    display_name: API Write Token
    type: password
    description: >
      Random token that authorises the nginx frontend to call the API's
      write routes (PUT/DELETE). Generated by install.sh; customers never
      need to supply or know this value.
