id: n8n
enabled: true
display_name: n8n
description: Low-code workflow automation tool to connect various apps and APIs.
short_description:
  en: "Automate workflows and connect apps without coding — n8n runs entirely on your own server."
  de: "Workflows automatisieren und Apps verbinden — ohne Programmierung, vollständig auf Ihrem Server."
  es: "Automatiza flujos de trabajo y conecta aplicaciones sin programar — n8n se ejecuta completamente en tu servidor."
  fr: "Automatisez des flux de travail et connectez des applications sans coder — n8n fonctionne entièrement sur votre serveur."
  it: "Automatizza flussi di lavoro e collega applicazioni senza programmazione — n8n gira completamente sul tuo server."
  nl: "Automatiseer workflows en koppel apps zonder code te schrijven — n8n draait volledig op je eigen server."
  pl: "Automatyzuj przepływy pracy i łącz aplikacje bez programowania — n8n działa w całości na twoim serwerze."
categories:
  - automation
app_version: "2.32.6"
recipe_version: "1.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/n8n-io/n8n

app_min_ram_mb: 2048
app_min_disk_mb: 20480


# basic_auth (IF-1312), decided by PM on 2026-08-04: basic auth in front of the
# complete application, username `admin` plus the server password chosen at order time.
#
# What this protects: a fresh n8n reports showSetupOnFirstLoad and hands the owner
# account to whoever asks first, so an unclaimed instance can be taken over by anyone
# who reaches the URL. Behind the prompt, the setup screen is not reachable at all.
#
# What it costs, stated plainly because it will generate support questions: while the
# prompt is on, *every* inbound webhook gets a 401, and receiving webhooks is what most
# customers install n8n for. The customer turns it off once their account exists:
#
#     /root/auth.sh off n8n
#
# That is named in the password prompt itself (see basic_auth_realm in af-core) and
# belongs in the customer documentation.
ports:
  - port: 5678
    protocol: tcp
    public: true
    basic_auth: true
    description: n8n Web UI

parameters:
  - name: APP_DOMAIN
    display_name: Domain
    type: domain
    description: Domain name for accessing n8n (e.g., n8n.example.com).

  - name: N8N_ADMIN_EMAIL
    display_name: Admin Email
    type: email
    description: Email address for the n8n admin account.

  - name: POSTGRES_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password.

  - name: N8N_ENCRYPTION_KEY
    display_name: Encryption Key
    type: password
    description: Key used to encrypt credentials stored in n8n.


