id: pihole
display_name: Pi-hole
description: Network-wide DNS ad-blocker, accessible exclusively via WireGuard VPN. Requires wg-easy to be installed and running first.
short_description:
  en: "Block ads and trackers for every device on your network using a lightweight DNS-based filter."
  de: "Werbung und Tracker für alle Netzwerkgeräte mit einem DNS-basierten Filter blockieren."
  es: "Bloquea anuncios y rastreadores en todos los dispositivos de tu red con un filtro DNS ligero."
  fr: "Bloquez publicités et traceurs sur tous les appareils de votre réseau avec un filtre DNS léger."
  it: "Blocca annunci e tracker per ogni dispositivo della tua rete con un filtro DNS leggero."
  nl: "Blokkeer advertenties en trackers voor elk apparaat op je netwerk met een lichtgewicht DNS-filter."
  pl: "Blokuj reklamy i śledzenie na wszystkich urządzeniach w sieci za pomocą lekkiego filtra DNS."
categories:
  - security
app_version: "2024.07.0"
recipe_version: "2.0.0"
recipe_type: docker-compose
upstream_url: https://github.com/pi-hole/pi-hole

app_min_ram_mb: 256
app_min_disk_mb: 2048

supported_os:
  - ubuntu-26.04

ports:
  - port: 8080
    protocol: tcp
    public: false
    description: Pi-hole Web UI (accessible via VPN at http://WG_INTERFACE_IP:8080/admin/)
  - port: 53
    protocol: tcp
    public: false
    description: DNS (TCP) — WireGuard interface only
  - port: 53
    protocol: udp
    public: false
    description: DNS (UDP) — WireGuard interface only

parameters:
  - name: WEBPASSWORD
    display_name: Web Password
    type: password
    required: false
    auto_generate: true
    description: Password for the Pi-hole web interface (auto-generated if not provided).
  - name: WG_INTERFACE_IP
    display_name: WireGuard Interface IP
    type: string
    required: false
    default: "10.8.0.1"
    description: IP address of the WireGuard server interface (wg0). Default matches wg-easy defaults.

notes: |
  Recommended: install together with wg-easy so DNS is only accessible via VPN.

incompatible_with_apps:
  - adguard-home
