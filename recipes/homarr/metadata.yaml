id: homarr
enabled: false
display_name: Homarr
description: Self-hosted start page to organize and monitor all your services from one place.
short_description:
  en: "Organize all your self-hosted services on a single, customizable dashboard with live status widgets and quick-launch links."
  de: "Alle selbst gehosteten Dienste auf einem anpassbaren Dashboard mit Live-Status-Widgets und Schnellstartlinks verwalten."
  es: "Organiza todos tus servicios autoalojados en un panel personalizable con widgets de estado en vivo y accesos directos."
  fr: "Organisez tous vos services auto-hébergés sur un tableau de bord personnalisable avec widgets de statut en direct."
  it: "Organizza tutti i tuoi servizi self-hosted in un pannello personalizzabile con widget di stato in tempo reale."
  nl: "Beheer al je zelf-gehoste diensten op één aanpasbaar dashboard met live-statuswidgets en snelkoppelingen."
  pl: "Zarządzaj wszystkimi samodzielnie hostowanymi usługami z jednego konfigurowalnego panelu z widżetami statusu na żywo."
categories:
  - infrastructure
  - monitoring
  - productivity
app_version: "1.73.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/homarr-labs/homarr
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/homarr/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/homarr.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 0976b9aacb1c60070626902001da7a940cb8bbde1f8d4f13eaef4a6fe1c9b19d

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 7575
    protocol: tcp
    public: true
    basic_auth: true
    description: Homarr Web UI

parameters:
  - name: SECRET_ENCRYPTION_KEY
    display_name: Encryption Key
    type: password
    description: Key used to encrypt credentials stored by Homarr. Generated randomly at install time.
