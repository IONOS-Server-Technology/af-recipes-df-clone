id: tandoor-recipes
enabled: false
display_name: Tandoor Recipes
description: Self-hosted recipe manager with meal planning, shopping lists, and AI-assisted recipe import.
short_description:
  en: "Manage your recipe collection, plan meals for the week, and build shopping lists — a self-hosted recipe manager with AI-assisted import."
  de: "Rezeptsammlung verwalten, Mahlzeiten planen und Einkaufslisten erstellen – selbst gehosteter Rezeptmanager mit KI-gestütztem Import."
  es: "Gestiona tus recetas, planifica comidas y crea listas de la compra en un gestor auto-alojado con importación asistida por IA."
  fr: "Gérez vos recettes, planifiez vos repas et créez des listes de courses dans un gestionnaire auto-hébergé avec import IA."
  it: "Gestisci le tue ricette, pianifica i pasti e crea liste della spesa in un gestore self-hosted con importazione assistita dall'IA."
  nl: "Beheer je recepten, plan maaltijden en maak boodschappenlijsten in een zelf-gehoste receptmanager met AI-import."
  pl: "Zarządzaj przepisami, planuj posiłki i twórz listy zakupów w self-hosted menedżerze z importem wspomaganym przez AI."
categories:
  - productivity
  - home
app_version: "2.6.13"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/TandoorRecipes/recipes
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/tandoor-recipes/0.2.0/logo.svg
logo_source: https://tandoor.dev/static/assets/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 2f462ecd79bfcdae7d09a753d29bbf38bf227086365c90d6772a7eb17f2accf4

app_min_ram_mb: 2048
app_min_disk_mb: 20480

ports:
  # Tandoor has no env-var path for first-account creation: signup is closed by
  # default (ENABLE_SIGNUP=0) and the only documented route without exec-ing into
  # the container is to open signup temporarily. install.sh sets ENABLE_SIGNUP=1
  # so the customer can register via the UI, but gates the entire frontend behind
  # Traefik basic-auth (server root password) so only the customer reaches the
  # signup form and claims the first (superuser) account. Same pattern as
  # mealie/n8n (IF-1312). Inbound webhooks are not a concern for a recipe manager,
  # so the basic-auth trade-off is clean.
  - port: 80
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: Tandoor Recipes Web UI

parameters:
  - name: POSTGRES_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password, generated randomly by install.sh.

  - name: SECRET_KEY
    display_name: Django Secret Key
    type: password
    description: Django application secret key, generated randomly by install.sh.
