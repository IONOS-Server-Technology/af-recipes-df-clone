services:
  web:
    image: vabene1111/recipes:2.6.13
    restart: unless-stopped
    labels:
      - "wud.trigger.include=ntfy.notify,dockercompose.apply"
      - "wud.compose.file=/opt/tandoor-recipes/docker-compose.yaml"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DB_ENGINE=django.db.backends.postgresql
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=djangouser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=djangodb
      - ALLOWED_HOSTS=${AF_APP_DOMAIN}
      # Signup is open so the first visitor claims the superuser slot. The entire
      # frontend is gated behind Traefik basic-auth (server root password), so only
      # the customer reaches this form — same pattern as mealie/n8n (IF-1312).
      - ENABLE_SIGNUP=1
      - GUNICORN_MEDIA=0
      - TZ=UTC
    ports:
      - "80:80"
    volumes:
      - staticfiles:/opt/recipes/staticfiles
      - /opt/tandoor-recipes/mediafiles:/opt/recipes/mediafiles
    networks:
      - tandoor-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    labels:
      - "wud.watch=false"
    environment:
      - POSTGRES_DB=djangodb
      - POSTGRES_USER=djangouser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - /opt/tandoor-recipes/postgres:/var/lib/postgresql/data
    networks:
      - tandoor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djangouser -d djangodb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  staticfiles:

networks:
  tandoor-network:
    driver: bridge
