services:
  lakefs:
    image: treeverse/lakefs:1
    restart: unless-stopped
    environment:
      - LAKEFS_DATABASE_TYPE=local
      - LAKEFS_BLOCKSTORE_TYPE=local
    ports:
      - "8080:8080"
    volumes:
      - /opt/lakefs/data:/home/lakefs/.lakefs
    networks:
      - lakefs-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/_health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  lakefs-network:
    driver: bridge
