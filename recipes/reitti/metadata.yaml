id: reitti
enabled: false
display_name: Reitti
description: Self-hosted location tracking and personal timeline as a Google Timeline alternative.
short_description:
  en: "Track your location history and explore your personal timeline — a privacy-focused Google Timeline replacement you host yourself."
categories:
  - productivity
app_version: "5"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/dedicatedcode/reitti
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/reitti/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/reitti.svg
logo_license: trademark-nominative-fair-use
logo_sha256: d102fdc7a3ef5dcb78ce73da7161a452a57d42f384e9aee7c8831a228ceda6a7

app_min_ram_mb: 4096
app_min_disk_mb: 51200

# basic_auth (IF-1312 precedent, same pattern as immich): a fresh Reitti has no
# login — whoever loads the URL first runs the setup wizard and claims the admin
# account. This is identical to the unclaimed-instance exposure that triggered
# basic_auth on immich. The trade-off is that the whole Traefik router goes behind
# the prompt, including inbound OwnTracks/GPSLogger ingestion paths; the customer
# turns it off once their account exists with `/root/auth.sh off reitti`.
ports:
  - port: 8080
    protocol: tcp
    public: true
    basic_auth: true
    description: Reitti Web UI
