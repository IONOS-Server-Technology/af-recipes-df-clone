services:
  watcharr:
    image: ghcr.io/sbondco/watcharr:4.2.1
    restart: unless-stopped
    ports:
      - "3080:3080"
    volumes:
      - /opt/watcharr/data:/data
    networks:
      - watcharr-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  watcharr-network:
    driver: bridge
