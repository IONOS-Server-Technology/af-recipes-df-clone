id: watcharr
enabled: false
display_name: Watcharr
description: Self-hosted watch list for movies, TV shows, anime, and video games.
short_description:
  en: "Track what you've watched and what's next — a self-hosted watch list for movies, TV, anime, and games."
  de: "Verfolge, was du gesehen hast und was noch aussteht — selbstgehostete Merkliste für Filme, Serien, Anime und Spiele."
  es: "Controla qué has visto y qué viene después — una lista de seguimiento autoalojada para películas, series, anime y juegos."
  fr: "Suivez ce que vous avez regardé et ce qui vous attend — liste auto-hébergée pour films, séries, anime et jeux."
  it: "Tieni traccia di cosa hai visto e cosa c'è dopo — lista self-hosted per film, serie, anime e videogiochi."
  nl: "Houd bij wat je gekeken hebt en wat er nog op staat — een zelf-gehoste kijklijst voor films, series, anime en games."
  pl: "Śledź, co obejrzałeś i co masz jeszcze do obejrzenia — samodzielna lista dla filmów, seriali, anime i gier."
categories:
  - media
  - productivity
app_version: "4.2.1"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/sbondCo/Watcharr
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/watcharr/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/watcharr.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 8aeefc5ee7b9e874ff7963335b0f7210bae76145d34cb3f7027e4c04b0628c1b

app_min_ram_mb: 256
app_min_disk_mb: 2048

# basic_auth (IF-1312): Watcharr has no admin credential settable at container boot —
# the first registrant via the in-app signup form becomes admin. A Traefik basic_auth
# gate closes the setup-takeover window until the customer completes their own signup.
# Same pattern as n8n, Open WebUI, and Immich. The customer can remove it once their
# admin account is created: /root/auth.sh off watcharr
ports:
  - port: 3080
    protocol: tcp
    public: true
    basic_auth: true
    description: Watcharr Web UI
