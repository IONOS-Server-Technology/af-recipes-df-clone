id: paperless-ai
enabled: false
curated: false
display_name: Paperless-AI
description: AI-powered document analysis and auto-tagging companion for Paperless-ngx.
short_description:
  en: "Automatically tag and categorize your Paperless-ngx documents using AI — less manual work, smarter archives."
  de: "Paperless-ngx-Dokumente automatisch mit KI verschlagworten und kategorisieren — weniger Aufwand, intelligenteres Archiv."
  es: "Etiqueta y categoriza automáticamente tus documentos Paperless-ngx con IA — menos trabajo manual, archivos más inteligentes."
  fr: "Étiquetez et catégorisez automatiquement vos documents Paperless-ngx avec l'IA — moins de travail, archives plus intelligentes."
  it: "Classifica e categorizza automaticamente i documenti Paperless-ngx con AI — meno lavoro manuale, archivi più intelligenti."
  nl: "Tag en categoriseer je Paperless-ngx-documenten automatisch met AI — minder handmatig werk, slimmere archieven."
  pl: "Automatycznie taguj i kategoryzuj dokumenty Paperless-ngx za pomocą AI — mniej pracy ręcznej, inteligentniejsze archiwa."
categories:
  - productivity
  - ai
app_version: "2.6.1"
recipe_version: "1.1.0"
recipe_type: docker-compose
upstream_url: https://github.com/clusterzx/paperless-ai
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/paperless-ai/1.1.0/logo.svg
logo_source: https://avatars.githubusercontent.com/u/32274973?s=460&v=4
logo_license: trademark-nominative-fair-use
logo_sha256: 63f5feb83db2f3ed9d4a9bc9e60b97ef7ee81bfd7dab93f1f7e5dbbc5cddf6a8

app_min_ram_mb: 512
app_min_disk_mb: 5120


ports:
  - port: 3003
    protocol: tcp
    public: true
    description: Paperless-AI Web UI

parameters:
  - name: PAPERLESS_URL
    display_name: Paperless-ngx URL
    type: string
    description: Full URL of your Paperless-ngx instance (e.g., http://paperless.example.com).
  - name: PAPERLESS_API_TOKEN
    display_name: Paperless API Token
    type: password
    description: API token from your Paperless-ngx instance (Settings → API Token).
  - name: AI_PROVIDER
    display_name: AI Provider
    type: string
    default: openai
    description: AI provider to use (openai or ollama).
  - name: OPENAI_API_KEY
    display_name: OpenAI API Key
    type: password
    description: OpenAI API key (required if AI_PROVIDER=openai).

