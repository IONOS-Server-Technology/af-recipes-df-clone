services:
  paperless-ai:
    image: clusterzx/paperless-ai:2.6.1
    restart: unless-stopped
    environment:
      - PAPERLESS_AI_PORT=3003
      - PAPERLESS_BASE_URL=${PAPERLESS_URL}
      - PAPERLESS_API_TOKEN=${PAPERLESS_API_TOKEN}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "3003:3003"
    volumes:
      - /opt/paperless-ai/data:/app/data
    networks:
      - paperless-ai-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3003/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  paperless-ai-network:
    driver: bridge
