id: yopass
enabled: false
display_name: Yopass
description: Encrypted one-time secret sharing via self-destructing links.
short_description:
  en: "Share passwords and secrets safely with anyone using encrypted, self-destructing one-time links."
  de: "Teilen Sie Passwörter und Geheimnisse sicher mit jedermann über verschlüsselte, selbstlöschende Einmallinks."
  es: "Comparte contraseñas y secretos de forma segura con cualquiera mediante enlaces cifrados de un solo uso."
  fr: "Partagez des mots de passe et secrets en toute sécurité via des liens chiffrés à usage unique qui s'autodétruisent."
  it: "Condividi password e segreti in modo sicuro con chiunque tramite link cifrati monouso che si autodistruggono."
  nl: "Deel wachtwoorden en geheimen veilig met iedereen via versleutelde, zelfvernietigende eenmalige links."
  pl: "Udostępniaj hasła i sekrety bezpiecznie każdemu za pomocą zaszyfrowanych, samoniszczących się jednorazowych linków."
categories:
  - security
  - productivity
app_version: "14.8.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/jhaals/yopass
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/yopass/0.2.0/logo.svg
logo_source: https://yopass.se/logo/yopass.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 0275ccbcc3af8efd11f8171e42597d947b4ef9ea59c571c2d3e4dd08512b6a8e

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 80
    protocol: tcp
    public: true
    description: Yopass Web UI
