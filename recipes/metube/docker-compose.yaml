services:
  metube:
    image: ghcr.io/alexta69/metube:2026.08.04
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - /opt/metube/downloads:/downloads
    networks:
      - metube-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  metube-network:
    driver: bridge
