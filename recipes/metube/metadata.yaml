id: metube
enabled: false
display_name: MeTube
description: Self-hosted web interface for yt-dlp, enabling video and audio downloads from YouTube and hundreds of other sites.
short_description:
  en: "Download videos and audio from YouTube and hundreds of other sites through a simple web UI powered by yt-dlp."
  de: "Videos und Audio von YouTube und Hunderten anderer Seiten über eine einfache Web-Oberfläche herunterladen."
  es: "Descarga vídeos y audio de YouTube y cientos de otros sitios a través de una interfaz web sencilla."
  fr: "Téléchargez des vidéos et de l'audio depuis YouTube et des centaines d'autres sites via une interface web simple."
  it: "Scarica video e audio da YouTube e da centinaia di altri siti tramite una semplice interfaccia web."
  nl: "Download video's en audio van YouTube en honderden andere sites via een eenvoudige webinterface."
  pl: "Pobieraj filmy i audio z YouTube i setek innych serwisów przez prosty interfejs webowy."
categories:
  - media
  - utilities
app_version: "2026.08.04"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/alexta69/metube
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/metube/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/metube.svg
logo_license: trademark-nominative-fair-use
logo_sha256: d476bcfbd3afd87194d582df12f77a20c4f2383a4b2f2c5d0e3a717b4a6c6e8d

app_min_ram_mb: 256
app_min_disk_mb: 2048

# MeTube has no built-in authentication of its own — confirmed against upstream docs.
# basic_auth: true gates the frontend behind the customer's server password via Traefik,
# covering the basic_auth_gate_credential from installability.secrets_expressible_today.
ports:
  - port: 8081
    protocol: tcp
    public: true
    basic_auth: true
    description: MeTube Web UI
