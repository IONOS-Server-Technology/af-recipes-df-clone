id: mediago
enabled: false
display_name: MediaGo
description: Self-hosted video downloader supporting YouTube, Bilibili, M3U8 streams, and 1000+ sites.
short_description:
  en: "Download videos from YouTube, Bilibili, M3U8 streams, and 1000+ sites through a self-hosted web interface."
  de: "Videos von YouTube, Bilibili, M3U8-Streams und über 1000 Websites über eine selbst gehostete Weboberfläche herunterladen."
  es: "Descarga vídeos de YouTube, Bilibili, streams M3U8 y más de 1000 sitios mediante una interfaz web autoalojada."
  fr: "Téléchargez des vidéos depuis YouTube, Bilibili, les flux M3U8 et plus de 1000 sites via une interface web auto-hébergée."
  it: "Scarica video da YouTube, Bilibili, flussi M3U8 e oltre 1000 siti tramite un'interfaccia web self-hosted."
  nl: "Download video's van YouTube, Bilibili, M3U8-streams en 1000+ sites via een zelf-gehoste webinterface."
  pl: "Pobieraj filmy z YouTube, Bilibili, strumieni M3U8 i ponad 1000 serwisów przez własny interfejs webowy."
categories:
  - media
  - utilities
app_version: "3.5.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/mediago-dev/mediago
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/mediago/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/mediago-dev/mediago/master/assets/mediago.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 7e989492e7d3f39b2dc6ec930e039848b3fcd785cd74aa8511561bcf804c8e43

app_min_ram_mb: 256
app_min_disk_mb: 2048

# MediaGo has no built-in authentication — the web UI is open to anyone who can reach the
# port. basic_auth: true gates it behind the customer's server password via Traefik, matching
# the traefik_basic_auth mechanism from installability.secrets_expressible_today.
ports:
  - port: 8899
    protocol: tcp
    public: true
    basic_auth: true
    description: MediaGo Web UI
