services:
  mediago:
    image: caorushizi/mediago:3.5.0
    restart: unless-stopped
    ports:
      - "8899:8899"
    volumes:
      - /opt/mediago/downloads:/root/mediago/downloads
    networks:
      - mediago-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8899/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  mediago-network:
    driver: bridge
