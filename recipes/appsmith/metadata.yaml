id: appsmith
enabled: false
display_name: Appsmith
description: Open-source low-code platform for building internal tools, admin panels, and dashboards connected to any database or API.
short_description:
  en: "Build custom internal tools, admin panels, and dashboards with a drag-and-drop low-code builder — connected to your databases and APIs."
  de: "Interne Tools, Admin-Panels und Dashboards per Drag-and-Drop erstellen — verbunden mit Datenbanken und APIs."
  es: "Crea herramientas internas, paneles de administración y dashboards con un constructor low-code conectado a tus bases de datos y APIs."
  fr: "Créez des outils internes, des panneaux d'administration et des tableaux de bord avec un builder low-code connecté à vos bases de données et APIs."
  it: "Crea strumenti interni, pannelli di amministrazione e dashboard con un builder low-code collegato a database e API."
  nl: "Bouw interne tools, beheerpanelen en dashboards met een drag-and-drop low-code builder verbonden met databases en API's."
  pl: "Twórz wewnętrzne narzędzia, panele administracyjne i dashboardy z builderem low-code podłączonym do baz danych i API."
categories:
  - developer-tools
  - productivity
app_version: "v2.2"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/appsmithorg/appsmith
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/appsmith/0.2.0/logo.svg
logo_source: https://www.appsmith.com/favicon.png
logo_license: trademark-nominative-fair-use
logo_sha256: b257cb1e86487b5404465650a8adcded76c77e02067b6c0d53e3aa8c3cc69154

# All-in-one image bundles Mongo, Redis, and Postgres internally; the container
# manages those passwords itself — no customer input needed. The ~8 GB RAM footprint
# reflects all three embedded services running inside the single image.
app_min_ram_mb: 8192
app_min_disk_mb: 20480

# basic_auth closes the open-signup race: on a fresh install Appsmith redirects to
# /setup/welcome, which grants Instance Administrator rights to whoever completes the
# wizard first. An anonymous visitor who reaches the URL before the customer can claim
# that admin account (see GHSA-9wcp-79g5-5c3c, fixed in 1.99+). Behind the basic-auth
# prompt the setup screen is not reachable at all.
#
# What it costs: while the prompt is active any inbound API call gets a 401. The
# customer turns it off once their admin account exists:
#
#     /root/auth.sh off appsmith
ports:
  - port: 80
    protocol: tcp
    public: true
    basic_auth: true
    description: Appsmith Web UI
