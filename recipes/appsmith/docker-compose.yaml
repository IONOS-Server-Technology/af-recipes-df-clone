services:
  appsmith:
    image: appsmith/appsmith-ce:v2.2
    restart: unless-stopped
    environment:
      - APPSMITH_DISABLE_TELEMETRY=true
    ports:
      - "80:80"
    volumes:
      - /opt/appsmith/stacks:/appsmith-stacks
    networks:
      - appsmith-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

networks:
  appsmith-network:
    driver: bridge
