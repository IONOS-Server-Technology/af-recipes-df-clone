services:
  cyberchef:
    image: ghcr.io/gchq/cyberchef:11.3.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - cyberchef-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  cyberchef-network:
    driver: bridge
