id: cyberchef
enabled: false
display_name: CyberChef
description: Web-based tool for encryption, encoding, compression, and data analysis operations.
short_description:
  en: "Encode, decode, encrypt, hash, and analyse data with 500+ chainable operations — all client-side in your browser."
  de: "Daten kodieren, dekodieren, verschlüsseln, hashen und analysieren — mit 500+ verkettbaren Operationen, direkt im Browser."
  es: "Codifica, decodifica, cifra, hashea y analiza datos con más de 500 operaciones encadenables — todo en el navegador."
  fr: "Encodez, décodez, chiffrez, hachez et analysez des données avec 500+ opérations chaînables — tout dans le navigateur."
  it: "Codifica, decodifica, cifra, esegui hash e analizza dati con 500+ operazioni concatenabili — tutto nel browser."
  nl: "Codeer, decodeer, versleutel, hash en analyseer data met 500+ koppelbare bewerkingen — volledig in de browser."
  pl: "Koduj, dekoduj, szyfruj, hashuj i analizuj dane z 500+ łączonymi operacjami — wszystko w przeglądarce."
categories:
  - security
  - developer-tools
app_version: "11.3.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/gchq/CyberChef
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/cyberchef/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/cyberchef.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 8bbf95526dff6d96b01fe3557adc8ecaef0659ad6ef6608275fed89e911e83d9

app_min_ram_mb: 256
app_min_disk_mb: 1024

# CyberChef has no login and no server-side state — all operations run client-side in the
# browser on data the customer pastes in, exactly like the public GCHQ-hosted instance.
# It exposes no API, no credentials, and no persisted customer data, so basic_auth: true
# would add friction without meaningful security benefit (unlike draw.io or Stirling PDF,
# which either persist state or expose server-side processing that warrants gating).
ports:
  - port: 8080
    protocol: tcp
    public: true
    description: CyberChef Web UI
