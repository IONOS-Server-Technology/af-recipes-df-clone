id: dashy
enabled: false
display_name: Dashy
description: Self-hostable personal dashboard for organising links to your services, with status checking, widgets, and themes.
short_description:
  en: "Your self-hosted homepage — organise links to all your services in one place, with live status checks, widgets, and custom themes."
  de: "Deine selbst gehostete Startseite – alle Dienste auf einen Blick, mit Statusprüfungen, Widgets und Designanpassungen."
  es: "Tu página de inicio autohospedada — organiza los enlaces a todos tus servicios con verificaciones de estado, widgets y temas."
  fr: "Votre page d'accueil auto-hébergée — centralisez vos services avec vérifications de statut, widgets et thèmes personnalisés."
  it: "La tua homepage self-hosted — organizza i link ai tuoi servizi con controlli di stato, widget e temi personalizzati."
  nl: "Je zelf-gehoste startpagina — beheer links naar al je diensten met statuscontroles, widgets en aangepaste thema's."
  pl: "Twoja własna strona startowa — zbierz linki do wszystkich usług z kontrolą statusu, widżetami i motywami."
categories:
  - home
  - productivity
app_version: "4.5.6"
recipe_version: "0.3.0"
recipe_type: docker-compose
upstream_url: https://dashy.to
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/dashy/0.3.0/logo.svg
logo_source: https://dashy.to/img/dashy.png
logo_license: trademark-nominative-fair-use
logo_sha256: 1b0e42a3954399070f08a3507fb8cfd3a0674bb9489507cc721ab72d834e0439

app_min_ram_mb: 256
app_min_disk_mb: 2048

# Dashy ships with no built-in auth enabled by default. basic_auth: true gates the
# entire frontend behind the customer's server password via Traefik, matching the
# traefik_basic_auth mechanism listed in installability.secrets_expressible_today.
ports:
  - port: 8080
    protocol: tcp
    public: true
    basic_auth: true
    description: Dashy Web UI
