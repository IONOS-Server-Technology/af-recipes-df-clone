services:
  dashy:
    image: lissy93/dashy:4.5.6
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /opt/dashy/user-data:/app/user-data
    networks:
      - dashy-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  dashy-network:
    driver: bridge
