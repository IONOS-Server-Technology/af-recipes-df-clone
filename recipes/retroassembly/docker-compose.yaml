services:
  retroassembly:
    image: arianrhodsandlot/retroassembly:v7.260719.1051
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /opt/retroassembly/data:/data
    networks:
      - retroassembly-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  retroassembly-network:
    driver: bridge
