id: retroassembly
enabled: false
display_name: RetroAssembly
description: Self-hosted browser-based retro game library supporting 25+ classic consoles.
short_description:
  en: "Play classic retro games from 25+ consoles directly in your browser with per-user save-state sync."
  de: "Spiele klassische Retro-Spiele von 25+ Konsolen direkt im Browser mit benutzerspezifischem Spielstand-Sync."
  es: "Juega juegos retro clásicos de más de 25 consolas directamente en tu navegador con sincronización de partidas por usuario."
  fr: "Jouez à des jeux rétro classiques de plus de 25 consoles directement dans votre navigateur avec synchronisation des sauvegardes par utilisateur."
  it: "Gioca a classici giochi retro di oltre 25 console direttamente nel browser con sincronizzazione dei salvataggi per utente."
  nl: "Speel klassieke retro-games van meer dan 25 consoles direct in je browser met per-gebruiker opslaan van speelstanden."
  pl: "Graj w klasyczne gry retro z ponad 25 konsol bezpośrednio w przeglądarce z synchronizacją stanu gry dla każdego użytkownika."
categories:
  - gaming
