services:
  redmine:
    image: redmine:7.0.0
    restart: unless-stopped
    environment:
      - REDMINE_DB_POSTGRES=postgres
      - REDMINE_DB_DATABASE=redmine
      - REDMINE_DB_USERNAME=redmine
      - REDMINE_DB_PASSWORD=${REDMINE_DB_PASSWORD}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
    ports:
      - "3000:3000"
    volumes:
      - /opt/redmine/data:/usr/src/redmine/files
    networks:
      - redmine-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=redmine
      - POSTGRES_USER=redmine
      - POSTGRES_PASSWORD=${REDMINE_DB_PASSWORD}
    volumes:
      - /opt/redmine/postgres:/var/lib/postgresql/data
    networks:
      - redmine-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine -d redmine"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  redmine-network:
    driver: bridge
