services:
  web:
    image: ghcr.io/we-promise/sure:stable
    restart: unless-stopped
    labels:
      - "wud.trigger.include=ntfy.notify,dockercompose.apply"
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      POSTGRES_USER: sure_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sure_production
      SELF_HOSTED: "true"
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "false"
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1
    ports:
      - "3000:3000"
    volumes:
      - app-storage:/rails/storage
    networks:
      - sure-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    dns:
      - 8.8.8.8
      - 1.1.1.1

  worker:
    image: ghcr.io/we-promise/sure:stable
    command: bundle exec sidekiq
    restart: unless-stopped
    labels:
      - "wud.watch=false"
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      POSTGRES_USER: sure_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sure_production
      SELF_HOSTED: "true"
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "false"
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1
    volumes:
      - app-storage:/rails/storage
    networks:
      - sure-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1

  db:
    image: postgres:16
    restart: unless-stopped
    labels:
      - "wud.watch=false"
    environment:
      POSTGRES_USER: sure_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sure_production
    volumes:
      - /opt/sure/postgres:/var/lib/postgresql/data
    networks:
      - sure-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sure_user -d sure_production"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    labels:
      - "wud.watch=false"
    volumes:
      - /opt/sure/redis:/data
    networks:
      - sure-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  app-storage:

networks:
  sure-network:
    driver: bridge
