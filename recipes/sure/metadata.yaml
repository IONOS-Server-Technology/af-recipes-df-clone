id: sure
enabled: false
display_name: Sure
description: Self-hosted personal finance app for net worth and investment tracking.
short_description:
  en: "Track net worth, investments, and bank accounts in a self-hosted finance app that keeps your financial data on your own server."
  de: "Nettovermögen, Investitionen und Bankkonten im selbst gehosteten Finance-App verwalten — Finanzdaten bleiben auf Ihrem eigenen Server."
  es: "Rastrea tu patrimonio neto, inversiones y cuentas bancarias en una app financiera autoalojada que mantiene tus datos en tu propio servidor."
  fr: "Suivez votre patrimoine net, vos investissements et vos comptes bancaires dans une app financière auto-hébergée qui garde vos données sur votre serveur."
  it: "Tieni traccia del patrimonio netto, degli investimenti e dei conti bancari in un'app finanziaria self-hosted che mantiene i dati sul tuo server."
  nl: "Volg vermogen, beleggingen en bankrekeningen in een zelf-gehoste finance-app die je financiële gegevens op je eigen server houdt."
  pl: "Śledź wartość netto, inwestycje i konta bankowe w samodzielnie hostowanej aplikacji finansowej, która przechowuje Twoje dane na własnym serwerze."
categories:
  - finance
app_version: "stable"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/we-promise/sure
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/sure/0.2.0/logo.svg
logo_source: https://sure.am/safari-pinned-tab.svg
logo_license: trademark-nominative-fair-use
logo_sha256: f3cd91c940adc95d10b80c563fd0f3a04746e114a29eff8f7606a51f7f710c27

app_min_ram_mb: 2048
app_min_disk_mb: 20480

# basic_auth: Sure has no pre-created admin account — the first user to reach the
# sign-up screen creates their own account and gains full access. The Traefik gate
# closes that setup-takeover window before the customer's first login.
# Trade-off: inbound requests get 401 until the customer disables auth once their
# account exists: /root/auth.sh off sure
ports:
  - port: 3000
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: Sure Web UI

parameters:
  - name: SECRET_KEY_BASE
    display_name: Secret Key Base
    type: password
    description: Rails secret key base for session signing and encryption, generated by install.sh.

  - name: POSTGRES_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password generated by install.sh.
