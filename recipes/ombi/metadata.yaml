id: ombi
enabled: false
display_name: Ombi
description: Self-hosted media request management for Plex, Emby, and Jellyfin.
short_description:
  en: "Let your Plex, Emby, or Jellyfin users request movies and TV shows through a clean self-hosted interface."
  de: "Ermöglicht Ihren Plex-, Emby- oder Jellyfin-Nutzern, Filme und Serien über eine eigene Oberfläche anzufordern."
  es: "Permite a tus usuarios de Plex, Emby o Jellyfin solicitar películas y series a través de una interfaz propia."
  fr: "Permettez à vos utilisateurs Plex, Emby ou Jellyfin de demander films et séries via une interface auto-hébergée."
  it: "Consenti ai tuoi utenti Plex, Emby o Jellyfin di richiedere film e serie tramite un'interfaccia self-hosted."
  nl: "Laat je Plex-, Emby- of Jellyfin-gebruikers films en series aanvragen via een eigen interface."
  pl: "Pozwól użytkownikom Plex, Emby lub Jellyfin na zgłaszanie filmów i seriali przez własny interfejs."
categories:
  - media
app_version: "4.53.10"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/Ombi-app/Ombi
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/ombi/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/ombi.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 83617e94c3cbcbc9faf6d8676de162fd0878941f1f5746a13e9f644a4cab5c54

app_min_ram_mb: 512
app_min_disk_mb: 2048

ports:
  - port: 3579
    protocol: tcp
    public: true
    description: Ombi Web UI
