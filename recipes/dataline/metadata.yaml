id: dataline
enabled: false
display_name: Dataline
description: AI-powered SQL chat interface for exploring and visualising any database with natural language.
short_description:
  en: "Ask questions about your database in plain English — Dataline generates SQL, runs it, and shows results as tables or charts."
  de: "In natürlicher Sprache mit der Datenbank chatten — Dataline generiert SQL, führt es aus und zeigt Ergebnisse als Tabellen oder Diagramme."
  es: "Haz preguntas a tu base de datos en lenguaje natural — Dataline genera SQL, lo ejecuta y muestra los resultados como tablas o gráficos."
  fr: "Interrogez votre base de données en langage naturel — Dataline génère le SQL, l'exécute et affiche les résultats en tableaux ou graphiques."
  it: "Interroga il tuo database in linguaggio naturale — Dataline genera SQL, lo esegue e mostra i risultati come tabelle o grafici."
  nl: "Stel vragen aan je database in gewone taal — Dataline genereert SQL, voert het uit en toont resultaten als tabellen of grafieken."
  pl: "Zadawaj pytania do bazy danych w naturalnym języku — Dataline generuje SQL, wykonuje go i wyświetla wyniki jako tabele lub wykresy."
categories:
  - ai
  - developer-tools
app_version: "1.2.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/RamiAwar/dataline
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/dataline/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/RamiAwar/dataline/main/frontend/src/assets/images/logo_w_border.png
logo_license: trademark-nominative-fair-use
logo_sha256: 50a81628711ac195e0369d6386bc1d2f025fce9dc88bf056e0d0794a4140e42a

app_min_ram_mb: 512
app_min_disk_mb: 2048

# basic_auth: Dataline has no mandatory login — AUTH_USERNAME/AUTH_PASSWORD are optional
# plaintext env vars that are off by default, leaving the app fully open. Without a gate,
# any first visitor can access all connected database connections and query results.
# basic_auth: true fronts the app with the customer's server password via Traefik,
# following the same pattern as draw.io and n8n.
#
# What it costs: the Traefik router covers the entire app, including any future API
# endpoints. The customer can disable it once they have configured Dataline's own auth:
#
#     /root/auth.sh off dataline
#
# The OpenAI API key for AI features is entered through Dataline's own settings UI after
# first login — it is a bring-your-own-key step, not a first-boot secret.
ports:
  - port: 7377
    protocol: tcp
    public: true
    basic_auth: true
    description: Dataline Web UI
