services:
  databasus:
    image: databasus/databasus:v3.51.0
    restart: unless-stopped
    ports:
      - "4005:4005"
    volumes:
      - /opt/databasus/data:/databasus-data
    networks:
      - databasus-network
    healthcheck:
      test: ["CMD", "databasus", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  databasus-network:
    driver: bridge
