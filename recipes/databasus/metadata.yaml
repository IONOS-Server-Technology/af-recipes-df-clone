id: databasus
enabled: false
display_name: Databasus
description: Automated backup tool for PostgreSQL, MySQL, and MongoDB databases with scheduling and point-in-time recovery.
short_description:
  en: "Schedule and automate encrypted backups for your PostgreSQL, MySQL, and MongoDB databases with point-in-time recovery."
  de: "Verschlüsselte Backups für PostgreSQL-, MySQL- und MongoDB-Datenbanken planen und automatisieren, mit Point-in-Time-Recovery."
  es: "Programa y automatiza copias de seguridad cifradas para tus bases de datos PostgreSQL, MySQL y MongoDB con recuperación puntual."
  fr: "Planifiez et automatisez des sauvegardes chiffrées pour vos bases de données PostgreSQL, MySQL et MongoDB avec récupération ponctuelle."
  it: "Pianifica e automatizza backup cifrati per i tuoi database PostgreSQL, MySQL e MongoDB con ripristino point-in-time."
  nl: "Plan en automatiseer versleutelde back-ups voor je PostgreSQL-, MySQL- en MongoDB-databases met herstel op een bepaald tijdstip."
  pl: "Planuj i automatyzuj zaszyfrowane kopie zapasowe baz danych PostgreSQL, MySQL i MongoDB z odzyskiwaniem do punktu w czasie."
categories:
  - utilities
app_version: "v3.51.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://databasus.com/
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/databasus/0.2.0/logo.svg
logo_source: https://databasus.com/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 5c235353204ee3a24fc8701ad8b6fa79858a222e10ed5353ef3f2e2718e78a62

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 4005
    protocol: tcp
    public: true
    http: true
    description: Databasus Web UI
