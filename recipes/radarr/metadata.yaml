id: radarr
enabled: false
display_name: Radarr
description: Automated movie collection manager for Usenet and torrent download clients.
short_description:
  en: "Automatically track, download, and organize your movie collection with a sleek web UI."
  de: "Filmsammlung automatisch verfolgen, herunterladen und organisieren – mit übersichtlicher Web-Oberfläche."
  es: "Rastrea, descarga y organiza automáticamente tu colección de películas con una interfaz web elegante."
  fr: "Suivez, téléchargez et organisez automatiquement votre collection de films via une interface web claire."
  it: "Traccia, scarica e organizza automaticamente la tua raccolta di film con un'interfaccia web intuitiva."
  nl: "Volg, download en organiseer automatisch je filmcollectie via een overzichtelijke webinterface."
  pl: "Automatycznie śledź, pobieraj i organizuj swoją kolekcję filmów dzięki przejrzystemu interfejsowi webowemu."
