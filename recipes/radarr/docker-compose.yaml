services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls313
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    ports:
      - "7878:7878"
    volumes:
      - /opt/radarr/config:/config
    networks:
      - radarr-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7878/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  radarr-network:
    driver: bridge
