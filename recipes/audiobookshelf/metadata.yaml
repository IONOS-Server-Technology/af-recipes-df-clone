id: audiobookshelf
enabled: false
display_name: Audiobookshelf
description: Self-hosted audiobook and podcast server with multi-user support and progress sync.
short_description:
  en: "Stream your audiobook and podcast library from your own server, with per-user progress sync and a companion mobile app."
  de: "Hörbuch- und Podcast-Bibliothek vom eigenen Server streamen, mit benutzerspezifischer Fortschrittssynchronisierung und mobiler App."
  es: "Transmite tu biblioteca de audiolibros y podcasts desde tu propio servidor, con sincronización de progreso por usuario y app móvil."
  fr: "Diffusez votre bibliothèque d'audiolibres et podcasts depuis votre serveur, avec synchronisation de progression par utilisateur et app mobile."
  it: "Riproduci la tua libreria di audiolibri e podcast dal tuo server, con sincronizzazione dei progressi per utente e app mobile."
  nl: "Stream je audioboek- en podcastbibliotheek vanaf je eigen server, met gebruikersspecifieke voortgangssynchronisatie en mobiele app."
  pl: "Streamuj swoją bibliotekę audiobooków i podcastów z własnego serwera, z synchronizacją postępu per użytkownik i aplikacją mobilną."
categories:
  - media
app_version: "2.36.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/advplyr/audiobookshelf
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/audiobookshelf/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/advplyr/audiobookshelf/master/client/static/icon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 746122a58b044c4fd04fccba4d733586d86ec0e1b400ccbb2181d071a6dfcb8e

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 80
    protocol: tcp
    public: true
    description: Audiobookshelf Web UI
