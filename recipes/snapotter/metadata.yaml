id: snapotter
enabled: false
display_name: SnapOtter
description: Self-hosted file-processing suite for image, video, audio, PDF conversion, compression, OCR, and local-AI editing.
short_description:
  en: "Convert, compress, and edit images, videos, audio, and PDFs on your own server — with local AI replacing cloud SaaS tools."
  de: "Bilder, Videos, Audio und PDFs auf dem eigenen Server konvertieren, komprimieren und bearbeiten — mit lokaler KI statt Cloud-SaaS."
  es: "Convierte, comprime y edita imágenes, vídeos, audio y PDF en tu servidor — con IA local en lugar de herramientas SaaS en la nube."
  fr: "Convertissez, compressez et modifiez images, vidéos, audio et PDF sur votre serveur — avec IA locale à la place des outils SaaS cloud."
  it: "Converti, comprimi e modifica immagini, video, audio e PDF sul tuo server — con AI locale al posto dei SaaS cloud."
  nl: "Converteer, comprimeer en bewerk afbeeldingen, video's, audio en pdf's op je server — met lokale AI in plaats van cloud-SaaS."
  pl: "Konwertuj, kompresuj i edytuj obrazy, filmy, audio i PDF na własnym serwerze — z lokalną AI zamiast chmurowych SaaS."
categories:
  - productivity
  - media
  - ai
app_version: "v2.2.0"
recipe_version: "0.1.1"
recipe_type: docker-compose
upstream_url: https://github.com/snapotter-hq/SnapOtter
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/snapotter/0.1.1/logo.svg
logo_source: https://raw.githubusercontent.com/snapotter-hq/SnapOtter/main/branding/logo-512-on-dark.png
logo_license: trademark-nominative-fair-use
logo_sha256: fad049b9bfa4b65c914480afee7d9280b763db250a6320dd0656c7ba4900ea06

app_min_ram_mb: 2048
app_min_disk_mb: 20480

# basic_auth (setup-takeover protection): SnapOtter ships with a fixed default
# admin/admin login that the app forces the user to change on first web login.
# Without this gate, anyone who reaches the URL before the owner's first visit
# can set the permanent admin password. The customer turns it off once their
# account exists: /root/auth.sh off snapotter
ports:
  - port: 1349
    protocol: tcp
    public: true
    basic_auth: true
    description: SnapOtter Web UI
