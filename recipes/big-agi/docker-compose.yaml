services:
  big-agi:
    image: ghcr.io/enricoros/big-agi:v2.0.5
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - big-agi-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  big-agi-network:
    driver: bridge
