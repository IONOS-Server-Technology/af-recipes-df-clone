id: big-agi
enabled: false
display_name: Big-AGI
description: Multi-model AI workspace with parallel model comparison across 500+ LLMs.
short_description:
  en: "Chat with 500+ AI models — OpenAI, Anthropic, Gemini and more — from one self-hosted workspace. Compare models side by side with Beam."
  de: "Mit 500+ KI-Modellen chatten — OpenAI, Anthropic, Gemini und mehr — in einem selbstgehosteten Workspace. Modelle mit Beam parallel vergleichen."
  es: "Chatea con más de 500 modelos de IA — OpenAI, Anthropic, Gemini y más — en un workspace autoalojado. Compara modelos en paralelo con Beam."
  fr: "Discutez avec plus de 500 modèles d'IA — OpenAI, Anthropic, Gemini et plus — depuis un workspace auto-hébergé. Comparez-les en parallèle avec Beam."
  it: "Chatta con oltre 500 modelli IA — OpenAI, Anthropic, Gemini e altri — da un workspace self-hosted. Confronta i modelli in parallelo con Beam."
  nl: "Chat met 500+ AI-modellen — OpenAI, Anthropic, Gemini en meer — vanuit één zelfgehoste workspace. Vergelijk modellen parallel met Beam."
  pl: "Rozmawiaj z ponad 500 modelami AI — OpenAI, Anthropic, Gemini i innymi — z samodzielnie hostowanego workspace. Porównuj modele równolegle z Beam."
categories:
