id: wikijs
enabled: false
display_name: Wiki.js
description: Modern, powerful wiki platform for team documentation with Markdown, WYSIWYG editing, and granular access control.
short_description:
  en: "Build a team wiki or knowledge base on your own server — Markdown, WYSIWYG editing, full-text search, and access control included."
  de: "Team-Wiki oder Wissensdatenbank auf dem eigenen Server — mit Markdown, WYSIWYG-Editor, Volltextsuche und Zugriffskontrolle."
  es: "Crea una wiki de equipo o base de conocimiento en tu propio servidor — con Markdown, edición WYSIWYG, búsqueda de texto completo y control de acceso."
  fr: "Créez un wiki d'équipe ou une base de connaissances sur votre serveur — avec Markdown, édition WYSIWYG, recherche plein texte et contrôle d'accès."
  it: "Crea una wiki di team o una knowledge base sul tuo server — con Markdown, editor WYSIWYG, ricerca full-text e controllo degli accessi."
  nl: "Bouw een teamwiki of kennisbank op je eigen server — met Markdown, WYSIWYG-editor, volledige tekstzoekfunctie en toegangscontrole."
  pl: "Zbuduj wiki zespołową lub bazę wiedzy na własnym serwerze — z Markdown, edytorem WYSIWYG, wyszukiwaniem pełnotekstowym i kontrolą dostępu."
categories:
  - productivity
app_version: "2.5.314"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/requarks/wiki
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/wikijs/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/wikijs.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 6aeb1d65059ed6dbc57d489cfc764322678661d985394573ef7b790112dbdfb6

app_min_ram_mb: 2048
app_min_disk_mb: 20480

ports:
  - port: 3000
    protocol: tcp
    public: true
    description: Wiki.js Web UI

parameters:
  - name: DB_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password for Wiki.js.
