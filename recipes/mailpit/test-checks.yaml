# Per-recipe override (see tests/checks/manifest.yaml's "Per-recipe override" section) —
# a full replace of the default per_app check list, not a merge.
#
# Drops "basic-auth" (the app_password_enforced_mailpit check). That check
# (if-image-tests/app-tests/application-factory/check-app-password.sh) asserts
# AF's own cookie-based gate (IF-1490): an anonymous request to a protected app
# must redirect to /_af/login, never answer 401 directly — 401 is specifically
# what the removed Traefik basicauth middleware used to do, and the check treats
# it as that regression reappearing.
#
# Mailpit doesn't use AF's gate at all — it enforces its own password via
# MP_UI_AUTH (real HTTP Basic Auth, bcrypt hash of the server password,
# metadata.yaml's MAILPIT_ADMIN_PASSWORD parameter), which answers 401 by
# design. The check can't tell that apart from the old middleware regression,
# so it fails unconditionally regardless of whether the recipe is correct.
# There's no field to declare "this app does its own Basic Auth" — dropping
# the check is the only option today, which does mean mailpit's password
# enforcement has no automated coverage in this suite.
checks:
  - template: install-dir
    scope: per_app
    gate: always
  - template: compose-file-persisted
    scope: per_app
    gate: always
  - template: env-file-persisted
    scope: per_app
    gate: always
  - template: health-check
    scope: per_app
    gate: always
  - template: traefik-route
    scope: per_app
    gate: traefik_route
