id: kapowarr
enabled: false
display_name: Kapowarr
description: Self-hosted comic book manager for automated downloading and organization.
short_description:
  en: "Automatically download and organize your comic book and manga collection with a self-hosted manager that integrates with common download sources."
  de: "Comicsammlungen automatisch herunterladen und organisieren mit einem selbst gehosteten Manager, der gängige Downloadquellen unterstützt."
  es: "Descarga y organiza automáticamente tu colección de cómics y manga con un gestor autoalojado integrado con fuentes de descarga comunes."
  fr: "Téléchargez et organisez automatiquement vos BD et mangas avec un gestionnaire auto-hébergé compatible avec les sources de téléchargement courantes."
  it: "Scarica e organizza automaticamente la tua raccolta di fumetti e manga con un gestore self-hosted integrato con le fonti di download più comuni."
  nl: "Download en organiseer automatisch je strip- en mangacollectie met een zelfgehoste manager die integreert met gangbare downloadbronnen."
  pl: "Automatycznie pobieraj i organizuj kolekcję komiksów i mangi za pomocą samodzielnie hostowanego managera zintegrowanego z popularnymi źródłami pobierania."
categories:
  - media
app_version: "V1.3.1"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/Casvt/Kapowarr
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/kapowarr/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/kapowarr.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 7f8f7000cf7c7945ea1d89ef71b8d18a440c8ad31a2fb73b4a82255b27c1721a

app_min_ram_mb: 256
app_min_disk_mb: 2048

# Kapowarr has no mandatory built-in login — authentication is an optional toggle
# configured later in its own settings UI, not via env vars or a setup wizard.
# basic_auth: true gates the single public HTTP port behind the customer's server
# password (traefik_basic_auth mechanism), the same pattern used by Adminer.
ports:
  - port: 5656
    protocol: tcp
    public: true
    basic_auth: true
    description: Kapowarr Web UI
