id: hemmelig
enabled: false
display_name: Hemmelig
description: Share end-to-end encrypted secrets through self-destructing one-time links.
short_description:
  en: "Share passwords, API keys, and sensitive data securely via one-time links that self-destruct after reading."
  de: "Passwörter, API-Schlüssel und sensible Daten sicher über einmalig lesbare Links teilen, die sich danach selbst zerstören."
  es: "Comparte contraseñas, claves API y datos sensibles de forma segura mediante enlaces de un solo uso que se autodestruyen."
  fr: "Partagez mots de passe, clés API et données sensibles en toute sécurité via des liens à usage unique qui s'autodétruisent."
  it: "Condividi password, chiavi API e dati sensibili in modo sicuro tramite link monouso che si autodistruggono dopo la lettura."
  nl: "Deel wachtwoorden, API-sleutels en gevoelige gegevens veilig via eenmalige links die zichzelf vernietigen na het lezen."
  pl: "Udostępniaj hasła, klucze API i wrażliwe dane bezpiecznie przez jednorazowe linki, które samozniszczają się po odczytaniu."
categories:
  - security
  - productivity
app_version: "v7"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/HemmeligOrg/Hemmelig.app
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/hemmelig/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/HemmeligOrg/Hemmelig.app/v7/logo.svg
logo_license: trademark-nominative-fair-use
logo_sha256: c52187b146ef4be975811f873280018386517fcabdc997b9ffd82f3a387e6d5a

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 3000
    protocol: tcp
    public: true
    description: Hemmelig Web UI
