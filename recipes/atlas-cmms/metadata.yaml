# 5 containers: postgres, Java/Spring backend, React frontend, MinIO, nginx.
# RAM: Spring backend (~1 GB) + Postgres + MinIO + nginx + frontend = ~2 GB floor.
# Disk: business records and file attachments (no bulk media); 10 GB is a safe floor.
app_min_ram_mb: 2048
app_min_disk_mb: 10240

# basic_auth closes an open-signup race identical to the one documented for appsmith
# and n8n: a fresh Atlas CMMS instance has no pre-seeded admin account — the first
# visitor to complete the sign-up flow creates an organization and becomes its admin.
# ALLOWED_ORGANIZATION_ADMINS can restrict sign-up to a list of email addresses, but
# AF has no per-customer channel to populate that list at bootstrap time, so it cannot
# close the race on its own. Traefik basic_auth gates the entire UI until the customer
# has claimed their admin account, then the customer runs:
#
#     /root/auth.sh off atlas-cmms
#
# What it costs: all paths behind the Traefik router (including any API callbacks)
# return 401 while the gate is active, which matters only if external integrations
# are configured before the gate is removed.
ports:
  - port: 80
    protocol: tcp
    public: true
    basic_auth: true
    description: Atlas CMMS Web UI (served by the bundled nginx reverse proxy)
