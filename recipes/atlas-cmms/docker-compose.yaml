services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /opt/atlas-cmms/postgres:/var/lib/postgresql/data
    networks:
      - atlas-cmms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - /opt/atlas-cmms/minio:/data
    networks:
      - atlas-cmms-network
    command: server --address ":9000" --console-address ":9001" /data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    image: intelloop/atlas-cmms-backend:v1.8.0
    restart: unless-stopped
    environment:
      DB_URL: postgres/atlas
      DB_USER: atlas
      DB_PWD: ${POSTGRES_PASSWORD}
      PUBLIC_API_URL: https://${AF_APP_DOMAIN}/api
      PUBLIC_FRONT_URL: https://${AF_APP_DOMAIN}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: atlas-bucket
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      STORAGE_TYPE: minio
      PUBLIC_MINIO_ENDPOINT: https://${AF_APP_DOMAIN}/storage
      SPRING_PROFILES_ACTIVE: prod
      INVITATION_VIA_EMAIL: "false"
      ENABLE_EMAIL_NOTIFICATIONS: "false"
      ENABLE_SSO: "false"
      ALLOWED_ORGANIZATION_ADMINS: ""
      LICENSE_KEY: ""
      LICENSE_FINGERPRINT_REQUIRED: "false"
    volumes:
      - /opt/atlas-cmms/logo:/app/static/images
      - /opt/atlas-cmms/config:/app/static/config
    networks:
      - atlas-cmms-network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    image: intelloop/atlas-cmms-frontend:v1.8.0
    restart: unless-stopped
    environment:
      API_URL: /api
      INVITATION_VIA_EMAIL: "false"
      CLOUD_VERSION: "false"
      NODE_ENV: production
      ENABLE_SSO: "false"
      HOME_URL: https://atlas-cmms.com
    networks:
      - atlas-cmms-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /opt/atlas-cmms/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - atlas-cmms-network
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  atlas-cmms-network:
    driver: bridge
