id: oxicloud
enabled: false
display_name: OxiCloud
description: Lightweight Rust-based self-hosted cloud storage with Nextcloud client support.
short_description:
  en: "Store and sync your files on your own server — with WebDAV/CalDAV/CardDAV, sharing, full-text search, and OIDC/SSO support."
  de: "Dateien auf dem eigenen Server speichern und synchronisieren — mit WebDAV/CalDAV/CardDAV, Freigabe, Volltextsuche und OIDC/SSO."
  es: "Almacena y sincroniza archivos en tu propio servidor — con WebDAV/CalDAV/CardDAV, compartición, búsqueda de texto completo y OIDC/SSO."
  fr: "Stockez et synchronisez vos fichiers sur votre propre serveur — avec WebDAV/CalDAV/CardDAV, partage, recherche plein texte et OIDC/SSO."
  it: "Archivia e sincronizza file sul tuo server — con WebDAV/CalDAV/CardDAV, condivisione, ricerca full-text e OIDC/SSO."
  nl: "Sla bestanden op en synchroniseer ze op je eigen server — met WebDAV/CalDAV/CardDAV, delen, full-text zoeken en OIDC/SSO."
  pl: "Przechowuj i synchronizuj pliki na własnym serwerze — z WebDAV/CalDAV/CardDAV, udostępnianiem, wyszukiwaniem pełnotekstowym i OIDC/SSO."
categories:
  - storage
  - productivity
app_version: "0.8.7"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/AtalayaLabs/OxiCloud
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/oxicloud/0.2.0/logo.svg
logo_source: https://atalayalabs.github.io/OxiCloud/logo.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 2399c4e9bacd0ce85741964ea48a2b2c8f0e1b80a71722521c8e4f90ca2919d3

app_min_ram_mb: 512
app_min_disk_mb: 10240

ports:
  - port: 8086
    protocol: tcp
    public: true
    description: OxiCloud Web UI
