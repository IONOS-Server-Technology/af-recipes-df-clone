id: sqlpage
enabled: false
display_name: SQLPage
description: SQL-only web application builder that renders interactive sites from queries.
short_description:
  en: "Build interactive internal tools and dashboards by writing plain SQL — no frontend code required."
  de: "Interaktive interne Tools und Dashboards mit reinem SQL erstellen – kein Frontend-Code nötig."
  es: "Crea herramientas internas interactivas y paneles escribiendo SQL puro, sin necesidad de código frontend."
  fr: "Créez des outils internes interactifs et des tableaux de bord en écrivant du SQL pur — sans code frontend."
  it: "Crea strumenti interni interattivi e dashboard scrivendo SQL puro — nessun codice frontend necessario."
  nl: "Bouw interactieve interne tools en dashboards met gewone SQL — geen frontend-code vereist."
  pl: "Twórz interaktywne narzędzia wewnętrzne i dashboardy pisząc zwykły SQL — bez kodu frontendowego."
categories:
  - developer-tools
app_version: "v0.45.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/sqlpage/SQLPage
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/sqlpage/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/sqlpage/SQLPage/main/sqlpage/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: b47817f59be6ecacbbcdc5546ffc7372a565bd82dd1e37ff07b78a85a3140777

app_min_ram_mb: 256
app_min_disk_mb: 2048

# SQLPage has no built-in login of its own — without OIDC configuration the app is
# accessible without authentication. Since it runs customer-authored SQL against a live
# database, leaving it open is the same risk pattern as Adminer, so it ships behind a
# mandatory Traefik basic_auth gated by the customer's server password.
ports:
  - port: 8080
    protocol: tcp
    public: true
    basic_auth: true
    description: SQLPage Web UI
