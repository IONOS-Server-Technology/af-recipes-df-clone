services:
  sqlpage:
    image: lovasoa/sqlpage:v0.45.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /opt/sqlpage/data:/var/www/site
    networks:
      - sqlpage-network
    healthcheck:
      # SQLPage's lovasoa/sqlpage image ships only the binary on debian:bookworm-slim —
      # no curl or wget. bash's built-in /dev/tcp performs a TCP-level port check.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  sqlpage-network:
    driver: bridge
