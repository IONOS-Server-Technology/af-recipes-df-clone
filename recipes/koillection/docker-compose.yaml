services:
  koillection:
    image: koillection/koillection:1.8.3
    restart: unless-stopped
    environment:
      - APP_ENV=prod
      - APP_SECRET=${APP_SECRET}
      - DATABASE_URL=postgresql://koillection:${DB_PASSWORD}@db:5432/koillection?serverVersion=16&charset=utf8
      - JWT_PASSPHRASE=${JWT_PASSPHRASE}
      - TRUSTED_PROXIES=127.0.0.1,REMOTE_ADDR
      - CORS_ALLOW_ORIGIN=https://${AF_APP_DOMAIN}
    ports:
      - "80:80"
    volumes:
      - /opt/koillection/uploads:/var/www/html/public/uploads
    networks:
      - koillection-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=koillection
      - POSTGRES_USER=koillection
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - /opt/koillection/postgres:/var/lib/postgresql/data
    networks:
      - koillection-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koillection -d koillection"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  koillection-network:
    driver: bridge
