id: koillection
enabled: false
display_name: Koillection
description: Self-hosted collection manager for cataloging books, games, vinyl, and more.
short_description:
  en: "Catalog and manage your physical collections — books, games, vinyl, stamps, and more — with custom fields and tags."
  de: "Physische Sammlungen katalogisieren und verwalten — Bücher, Spiele, Vinyl, Briefmarken und mehr — mit eigenen Feldern und Tags."
  es: "Cataloga y gestiona tus colecciones físicas — libros, juegos, vinilos, sellos y más — con campos y etiquetas personalizados."
  fr: "Cataloguez et gérez vos collections physiques — livres, jeux, vinyles, timbres et plus — avec des champs et tags personnalisés."
  it: "Cataloga e gestisci le tue collezioni fisiche — libri, giochi, vinili, francobolli e altro — con campi e tag personalizzati."
  nl: "Catalogiseer en beheer je fysieke collecties — boeken, games, vinyl, postzegels en meer — met aangepaste velden en tags."
  pl: "Kataloguj i zarządzaj fizycznymi kolekcjami — książki, gry, winyle, znaczki i więcej — z własnymi polami i tagami."
categories:
  - productivity
app_version: "1.8.3"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/koillection/koillection
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/koillection/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/koillection/koillection/1.8/assets/img/logo.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 2ec643b7d3b6fa0fd4daa1f87ce965bb4bdf048cfd310bc4770d9e923c25316d

app_min_ram_mb: 512
app_min_disk_mb: 5120

ports:
  - port: 80
    protocol: tcp
    public: true
    description: Koillection Web UI

parameters:
  - name: DB_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password.

  - name: APP_SECRET
    display_name: Application Secret
    type: password
    description: Symfony application secret used for cryptographic signing.

  - name: JWT_PASSPHRASE
    display_name: JWT Passphrase
    type: password
    description: Passphrase for JWT token signing keys.
