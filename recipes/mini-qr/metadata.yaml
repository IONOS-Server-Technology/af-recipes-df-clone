id: mini-qr
enabled: false
display_name: Mini QR
description: Self-hosted QR code generator with custom styles, logo embedding, and batch CSV export.
short_description:
  en: "Generate branded QR codes with custom colours and logos, scan codes from camera or image, and export in bulk — self-hosted and private."
  de: "QR-Codes mit eigenem Branding, Farben und Logo erstellen, per Kamera oder Bild scannen und als Batch exportieren – selbst gehostet."
  es: "Genera códigos QR personalizados con colores y logos propios, escanea desde cámara o imagen y exporta en lote — autoalojado y privado."
  fr: "Créez des QR codes à votre image avec couleurs et logo, scannez depuis la caméra ou une image et exportez en masse — auto-hébergé."
  it: "Genera QR code con colori e logo personalizzati, scansiona da fotocamera o immagine ed esporta in batch — self-hosted e privato."
  nl: "Maak QR-codes met eigen kleuren en logo, scan via camera of afbeelding en exporteer in bulk — volledig zelf gehost en privé."
  pl: "Twórz kody QR z własnym brandingiem, skanuj z kamery lub zdjęcia i eksportuj zbiorczo — w pełni samodzielnie hostowane i prywatne."
categories:
  - productivity
app_version: "v0.32.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/lyqht/mini-qr
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/mini-qr/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/lyqht/mini-qr/main/public/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: fce28b3b5a763d027097863abc5b585b0c95f90e6169f7c676052c697a7a2a65

app_min_ram_mb: 256
app_min_disk_mb: 512

ports:
  - port: 80
    protocol: tcp
    public: true
    http: true
    description: Mini QR Web UI
