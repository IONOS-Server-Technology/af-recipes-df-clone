services:
  mini-qr:
    image: ghcr.io/lyqht/mini-qr:v0.32.0
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - mini-qr-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  mini-qr-network:
    driver: bridge
