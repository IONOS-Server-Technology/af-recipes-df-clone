services:
  mqttx:
    image: emqx/mqttx-web:v1.13.0
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - mqttx-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  mqttx-network:
    driver: bridge
