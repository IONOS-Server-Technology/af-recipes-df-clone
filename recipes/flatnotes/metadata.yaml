id: flatnotes
enabled: false
display_name: flatnotes
description: Database-less Markdown note-taking app with wikilinks and full-text search.
short_description:
  en: "A lightweight, database-free note-taking app that stores your Markdown files in a flat folder with wikilinks and full-text search."
  de: "Leichtgewichtige, datenbankfreie Notiz-App, die Markdown-Dateien in einem flachen Ordner mit Wikilinks und Volltextsuche speichert."
  es: "Aplicación de notas ligera y sin base de datos que almacena archivos Markdown con wikilinks y búsqueda de texto completo."
  fr: "Application de prise de notes légère et sans base de données, stockant vos fichiers Markdown avec des wikilinks et une recherche plein texte."
  it: "App per appunti leggera e senza database che archivia file Markdown con wikilink e ricerca full-text."
  nl: "Lichtgewicht, databasevrije notitie-app die Markdown-bestanden opslaat in een platte map met wikilinks en volledige tekstzoekopdracht."
  pl: "Lekka aplikacja do notatek bez bazy danych, przechowująca pliki Markdown w płaskim folderze z wikilinkami i wyszukiwaniem pełnotekstowym."
categories:
  - productivity
app_version: "v5.5.4"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/dullage/flatnotes
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/flatnotes/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/flatnotes.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 33e1be16e4f719d6211f35294248c77950e107038cb71f0d3724a1bb1e8c4474

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 8080
    protocol: tcp
    public: true
    basic_auth: true
    description: flatnotes Web UI
