id: meshcentral
enabled: false
display_name: MeshCentral
description: Self-hosted remote monitoring and management platform for desktops, servers, and IoT devices.
short_description:
  en: "Remotely manage, monitor, and take control of desktops, servers, and IoT devices from a single self-hosted web dashboard."
  de: "Desktops, Server und IoT-Geräte remote verwalten, überwachen und steuern – zentral über ein selbst gehostetes Web-Dashboard."
  es: "Gestiona, monitoriza y controla de forma remota equipos, servidores y dispositivos IoT desde un panel web auto-alojado."
  fr: "Gérez, surveillez et contrôlez à distance vos postes, serveurs et appareils IoT depuis un tableau de bord web auto-hébergé."
  it: "Gestisci, monitora e controlla da remoto desktop, server e dispositivi IoT da un'unica dashboard web self-hosted."
  nl: "Beheer, monitor en bedien op afstand desktops, servers en IoT-apparaten vanuit één zelf-gehoste webdashboard."
  pl: "Zdalnie zarządzaj, monitoruj i steruj komputerami, serwerami i urządzeniami IoT z jednego samodzielnie hostowanego panelu."
categories:
  - infrastructure
  - monitoring
app_version: "1.2.4"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/Ylianst/MeshCentral
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/meshcentral/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/selfhst/icons/png/meshcentral.png
logo_license: trademark-nominative-fair-use
logo_sha256: 0a26fd1ac4e2087dd494bf91b03950473950ca60b0f89e2a4f2e9b460e079646

app_min_ram_mb: 512
app_min_disk_mb: 10240

ports:
  - port: 443
    protocol: tcp
    public: true
    http: true
    description: MeshCentral Web UI and agent connections
