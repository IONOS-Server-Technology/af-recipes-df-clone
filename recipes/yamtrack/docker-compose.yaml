services:
  yamtrack:
    image: ghcr.io/fuzzygrim/yamtrack:v0.25.3
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=redis://yamtrack-redis:6379/0
      - REGISTRATION=true
    ports:
      - "8000:8000"
    volumes:
      - /opt/yamtrack/data:/app/data
    networks:
      - yamtrack-network
    depends_on:
      yamtrack-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  yamtrack-celery:
    image: ghcr.io/fuzzygrim/yamtrack:v0.25.3
    restart: unless-stopped
    command: celery -A config worker -l INFO
    labels:
      - "wud.watch=false"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=redis://yamtrack-redis:6379/0
    volumes:
      - /opt/yamtrack/data:/app/data
    networks:
      - yamtrack-network
    depends_on:
      yamtrack-redis:
        condition: service_healthy
      yamtrack:
        condition: service_started

  yamtrack-redis:
    image: redis:7-alpine
    restart: unless-stopped
    labels:
      - "wud.watch=false"
    volumes:
      - /opt/yamtrack/redis:/data
    networks:
      - yamtrack-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  yamtrack-network:
    driver: bridge
