id: beaverhabits
enabled: false
display_name: BeaverHabits
description: Minimalist self-hosted habit tracker for daily check-ins and streak monitoring.
short_description:
  en: "Build and track daily habits with a lightweight self-hosted check-in grid and streak counter."
  de: "Tägliche Gewohnheiten mit einem leichtgewichtigen Self-hosted-Check-in-Raster und Streak-Zähler aufbauen und verfolgen."
  es: "Construye y realiza un seguimiento de hábitos diarios con una cuadrícula de registro auto-hospedada y un contador de rachas."
  fr: "Construisez et suivez vos habitudes quotidiennes avec une grille d'enregistrement auto-hébergée et un compteur de séries."
  it: "Costruisci e monitora le abitudini quotidiane con una griglia di check-in self-hosted e un contatore di serie."
  nl: "Bouw en volg dagelijkse gewoonten met een lichtgewicht zelf-gehoste check-in-raster en streakteller."
  pl: "Buduj i śledź codzienne nawyki za pomocą lekkiej samodzielnie hostowanej siatki meldowania i licznika serii."
categories:
  - productivity
app_version: "0.10.0"
