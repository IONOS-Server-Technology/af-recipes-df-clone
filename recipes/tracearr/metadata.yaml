id: tracearr
enabled: false
display_name: Tracearr
description: Stream monitoring dashboard for Plex, Jellyfin, and Emby with account-sharing detection.
short_description:
  en: "Monitor watch history, stream analytics, and detect account sharing across your Plex, Jellyfin, and Emby media servers."
  de: "Schauhistorie, Stream-Analysen und Account-Sharing-Erkennung für Plex, Jellyfin und Emby auf einem Server."
  es: "Monitoriza el historial de visualización, analíticas de stream y detecta el uso compartido en Plex, Jellyfin y Emby."
  fr: "Surveillez l'historique de visionnage, les analytiques et détectez le partage de compte sur Plex, Jellyfin et Emby."
  it: "Monitora la cronologia di visione, le analitiche e individua la condivisione di account su Plex, Jellyfin ed Emby."
  nl: "Bekijk kijkgeschiedenis, stream-analyse en detecteer accountdeling op Plex, Jellyfin en Emby."
  pl: "Monitoruj historię oglądania, analitykę strumieni i wykrywaj współdzielenie kont na Plex, Jellyfin i Emby."
categories:
  - media
  - monitoring
app_version: "v2.1.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/connorgallopo/Tracearr
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/tracearr/0.2.0/logo.svg
logo_source: https://tracearr.com/images/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 3e6493f790030b6e6cb633282f2555262b3c685fd21b1ed2334b8676c8036158

app_min_ram_mb: 2048
app_min_disk_mb: 20480

ports:
  - port: 3000
    protocol: tcp
    public: true
    description: Tracearr Web UI

parameters:
  - name: JWT_SECRET
    display_name: JWT Secret
    type: password
    description: Secret used to sign session JWTs. Generated by install.sh.
  - name: COOKIE_SECRET
    display_name: Cookie Secret
    type: password
    description: Secret used for cookie signing. Generated by install.sh.
  - name: DB_PASSWORD
    display_name: Database Password
    type: password
    description: Internal TimescaleDB password. Generated by install.sh.
