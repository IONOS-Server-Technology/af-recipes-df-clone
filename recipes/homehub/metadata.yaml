id: homehub
enabled: false
display_name: HomeHub
description: Private family dashboard for shared notes, shopping lists, chores, and expense tracking.
short_description:
  en: "Keep your household organised with shared notes, shopping lists, chores, and expense tracking — all in one lightweight app."
  de: "Den Haushalt organisieren mit geteilten Notizen, Einkaufslisten, Aufgaben und Ausgabenverfolgung — alles in einer leichten App."
  es: "Organiza tu hogar con notas compartidas, listas de la compra, tareas y seguimiento de gastos — todo en una app ligera."
  fr: "Organisez votre foyer avec des notes partagées, des listes de courses, des tâches et un suivi des dépenses — en une seule app légère."
  it: "Organizza la famiglia con note condivise, liste della spesa, compiti e monitoraggio delle spese — tutto in un'app leggera."
  nl: "Organiseer je huishouden met gedeelde notities, boodschappenlijsten, klusjes en uitgavenbeheer — alles in één lichte app."
  pl: "Zorganizuj gospodarstwo domowe dzięki wspólnym notatkom, listom zakupów, obowiązkom i śledzeniu wydatków — w jednej lekkiej aplikacji."
categories:
  - productivity
app_version: "0.2.3.4"
recipe_version: "0.3.0"
recipe_type: docker-compose
upstream_url: https://github.com/surajverma/homehub
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/homehub/0.3.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/homehub.svg
logo_license: trademark-nominative-fair-use
logo_sha256: e28c09dc2caad2416dbe172bc7cb31bd252e52d2f759045c792fc1550f83472b

app_min_ram_mb: 256
app_min_disk_mb: 2048

# HomeHub's own config.yml password is an optional whole-site gate ("leave blank
# for password-less access" per upstream docs) — not a per-user admin account.
# There is no customer delivery channel for a randomly generated value, so it is
# left blank here and basic_auth: true gates the frontend instead (server root
# password). Once configured to your liking: /root/auth.sh off homehub
ports:
  - port: 5000
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: HomeHub Web UI
