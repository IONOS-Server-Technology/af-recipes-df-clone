services:
  chevereto:
    image: chevereto/chevereto:4.5.5
    restart: unless-stopped
    environment:
      - CHEVERETO_DB_HOST=mariadb
      - CHEVERETO_DB_PORT=3306
      - CHEVERETO_DB_USER=chevereto
      - CHEVERETO_DB_PASS=${DB_PASSWORD}
      - CHEVERETO_DB_NAME=chevereto
    ports:
      - "8080:80"
    volumes:
      - /opt/chevereto/content:/var/www/html/content
    networks:
      - chevereto-network
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=chevereto
      - MYSQL_USER=chevereto
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - /opt/chevereto/mariadb:/var/lib/mysql
    networks:
      - chevereto-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  chevereto-network:
    driver: bridge
