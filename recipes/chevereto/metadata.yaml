id: chevereto
enabled: false
display_name: Chevereto
description: Self-hosted image and video sharing platform with user accounts and albums.
short_description:
  en: "Host your own image-sharing community — Chevereto gives you multi-user galleries, albums, and hotlink-friendly embeds on your own server."
  de: "Betreiben Sie Ihre eigene Bild-Sharing-Community — Chevereto bietet Multi-User-Galerien, Alben und hotlink-freundliche Einbindungen auf Ihrem Server."
  es: "Gestiona tu propia comunidad de imágenes — Chevereto ofrece galerías multiusuario, álbumes y embeds aptos para hotlinks en tu propio servidor."
  fr: "Hébergez votre propre communauté de partage d'images — Chevereto propose des galeries multi-utilisateurs, des albums et des intégrations hotlink."
  it: "Gestisci la tua community di condivisione immagini — Chevereto offre gallerie multiutente, album ed embed hotlink sul tuo server."
  nl: "Beheer je eigen image-sharingcommunity — Chevereto biedt multi-user galerijen, albums en hotlink-vriendelijke embeds op je eigen server."
  pl: "Prowadź własną społeczność udostępniania obrazów — Chevereto oferuje galerie wielu użytkowników, albumy i hotlink-przyjazne osadzanie."
categories:
  - media
app_version: "4.5.5"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/chevereto/chevereto
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/chevereto/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/chevereto.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 06eeac1ad42d0bced21ec37a3c88264b1b17c0f9cd71ce26f2d6508b5a729c16

app_min_ram_mb: 2048
app_min_disk_mb: 20480

ports:
  - port: 8080
    protocol: tcp
    public: true
    description: Chevereto Web UI

parameters:
  - name: DB_PASSWORD
    display_name: Database Password
    type: password
    description: MySQL/MariaDB database password used by Chevereto and its database service.
