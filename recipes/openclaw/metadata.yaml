id: openclaw
enabled: true
curated: true
display_name: OpenClaw
description: Self-hosted AI agent runtime that executes tasks via messaging apps like Telegram.
short_description:
  en: "Let an AI agent handle tasks for you via Telegram and other messaging apps — automated and running on your server."
  de: "KI-Agenten Aufgaben per Telegram und andere Messenger erledigen lassen — automatisiert und selbstgehostet."
  es: "Deja que un agente de IA gestione tareas por ti vía Telegram y otras apps de mensajería — automatizado y autoalojado."
  fr: "Laissez un agent IA gérer des tâches pour vous via Telegram et d'autres messageries — automatisé et auto-hébergé."
  it: "Lascia che un agente AI gestisca i tuoi compiti via Telegram e altre app di messaggistica — automatizzato e self-hosted."
  nl: "Laat een AI-agent taken voor je uitvoeren via Telegram en andere berichtenapps — geautomatiseerd en zelf gehost."
  pl: "Pozwól agentowi AI wykonywać zadania za Ciebie przez Telegram i inne komunikatory — zautomatyzowane i samodzielnie hostowane."
categories:
  - ai
  - automation
app_version: "2026.7.1-2"
recipe_version: "1.3.1"
recipe_type: docker-compose
upstream_url: https://github.com/openclaw/openclaw

app_min_ram_mb: 2048
app_min_disk_mb: 20480


# basic_auth (IF-1312, mechanism replaced in IF-1490): the whole interface sits
# behind the platform's login page, which takes the server password chosen at
# order time. The field name predates the mechanism; renaming it is tracked
# separately. Note that the Gateway API shares this port with the Web UI, so a
# programmatic client cannot reach it while the password is on — the login page
# issues a session cookie and there is no header a client could send instead.
ports:
  - port: 18789
    protocol: tcp
    public: true
    basic_auth: true
    description: OpenClaw Gateway API and Web UI

# auth_gate_post_login_fragment: the Control UI reads its gateway token from the URL
# fragment, so the platform's login page can hand it over and the customer never has to
# find it. A fragment never leaves the browser, so the token stays out of proxy logs and
# out of the Referer. ${...} is resolved by Compose from this app's own .env, not by the
# API.
auth_gate_post_login_fragment: "token=${OPENCLAW_GATEWAY_TOKEN}"

# auth_off_notice: with the login page gone, so is the token handover above -- the Control UI
# then asks for the gateway token itself, and the customer has no other way to learn where it
# is. Printed by the on-VM switch right after it turns the password off. It names the file,
# never the value: the token stays on the machine that already holds it.
auth_off_notice: >-
  The login page handed the gateway token to the Control UI for you. Without it the
  Control UI asks for the token itself: read it on this server with
  `grep OPENCLAW_GATEWAY_TOKEN /opt/openclaw/.env` and paste it in. New browsers are also
  no longer paired automatically while the password is off, so a pairing request stays
  pending until you turn the password back on.

parameters:
  - name: OPENCLAW_GATEWAY_TOKEN
    display_name: Gateway Token
    type: password
    description: Authentication token for the gateway API.

  - name: ANTHROPIC_API_KEY
    display_name: Anthropic API Key
    type: string
    description: API key for Claude models (set at least one model provider key).

  - name: OPENAI_API_KEY
    display_name: OpenAI API Key
    type: string
    description: API key for OpenAI models.

  - name: OPENROUTER_API_KEY
    display_name: OpenRouter API Key
    type: string
    description: API key for OpenRouter (access to multiple model providers, including free-tier models).

  - name: GEMINI_API_KEY
    display_name: Gemini API Key
    type: string
    description: API key for Google Gemini models.

  - name: TELEGRAM_BOT_TOKEN
    display_name: Telegram Bot Token
    type: string
    description: Telegram bot token for receiving messages (create via @BotFather).


