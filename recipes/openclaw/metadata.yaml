id: openclaw
enabled: true
display_name: OpenClaw
description: Self-hosted AI agent runtime that executes tasks via messaging apps like Telegram.
short_description:
  en: "Let an AI agent handle tasks for you via Telegram and other messaging apps — automated and running on your server."
  de: "KI-Agenten Aufgaben per Telegram und andere Messenger erledigen lassen — automatisiert und selbstgehostet."
  es: "Deja que un agente de IA gestione tareas por ti vía Telegram y otras apps de mensajería — automatizado y autoalojado."
  fr: "Laissez un agent IA gérer des tâches pour vous via Telegram et d'autres messageries — automatisé et auto-hébergé."
  it: "Lascia che un agente AI gestisca i tuoi compiti via Telegram e altre app di messaggistica — automatizzato e self-hosted."
  nl: "Laat een AI-agent taken voor je uitvoeren via Telegram en andere berichtenapps — geautomatiseerd en zelf gehost."
  pl: "Pozwól agentowi AI wykonywać zadania za Ciebie przez Telegram i inne komunikatory — zautomatyzowane i samodzielnie hostowane."
categories:
  - ai
  - automation
app_version: "2026.2.26"
recipe_version: "1.0.0"
base_image: IF-ubuntu-26.04-server-cloudimg-amd64_af.qcow2
recipe_type: docker-compose
upstream_url: https://github.com/openclaw/openclaw

app_min_ram_mb: 2048
app_min_disk_mb: 20480

supported_os:
  - ubuntu-26.04

ports:
  - port: 18789
    protocol: tcp
    public: true
    description: OpenClaw Gateway API and Web UI

preinstall_cmds:
  - mkdir -p /opt/openclaw/config /opt/openclaw/workspace
  - chmod 777 /opt/openclaw/config /opt/openclaw/workspace
  - "echo '{\"gateway\":{\"controlUi\":{\"dangerouslyAllowHostHeaderOriginFallback\":true}}}' > /opt/openclaw/config/openclaw.json"
  - chmod 666 /opt/openclaw/config/openclaw.json

parameters:
  - name: APP_DOMAIN
    display_name: Domain
    type: domain
    required: true
    description: Domain name for accessing OpenClaw (e.g., openclaw.example.com).

  - name: OPENCLAW_GATEWAY_TOKEN
    display_name: Gateway Token
    type: password
    required: false
    auto_generate: true
    description: Authentication token for the gateway API (auto-generated if not provided).

  - name: ANTHROPIC_API_KEY
    display_name: Anthropic API Key
    type: string
    required: false
    description: API key for Claude models (set at least one model provider key).

  - name: OPENAI_API_KEY
    display_name: OpenAI API Key
    type: string
    required: false
    description: API key for OpenAI models.

  - name: GEMINI_API_KEY
    display_name: Gemini API Key
    type: string
    required: false
    description: API key for Google Gemini models.

  - name: TELEGRAM_BOT_TOKEN
    display_name: Telegram Bot Token
    type: string
    required: false
    description: Telegram bot token for receiving messages (create via @BotFather).


incompatible_with_apps: []

# Logo (rendered in app catalogue thumbnails)
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/openclaw/1.0.0/logo.svg
