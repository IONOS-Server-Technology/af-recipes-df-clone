id: wiremock
enabled: false
display_name: WireMock
description: HTTP API mock server for simulating REST services and testing edge cases.
short_description:
  en: "Stand up a programmable HTTP mock server to simulate REST APIs, inject faults, and test edge cases without hitting real services."
  de: "Einen programmierbaren HTTP-Mock-Server für REST-APIs starten, um Fehler zu injizieren und Edge Cases zu testen."
  es: "Levanta un servidor HTTP mock programable para APIs REST, inyecta fallos y prueba casos extremos sin acceder a servicios reales."
  fr: "Déployez un serveur mock HTTP programmable pour simuler des API REST, injecter des pannes et tester des cas limites."
  it: "Avvia un server HTTP mock programmabile per simulare API REST, iniettare guasti e testare casi limite."
  nl: "Start een programmeerbare HTTP-mockserver voor REST API's, injecteer fouten en test randgevallen."
  pl: "Uruchom programowalny serwer HTTP mock do symulowania API REST, wstrzykiwania błędów i testowania przypadków brzegowych."
categories:
  - developer-tools
app_version: "3.13.2"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://wiremock.org/
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/wiremock/0.2.0/logo.svg
logo_source: https://wiremock.org/images/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: e90f0276bf53d3f29a6f121ef4aec1046b72025045d5b4756dcbd531c53889ce

app_min_ram_mb: 512
app_min_disk_mb: 2048

ports:
  - port: 8080
    protocol: tcp
    public: true
    basic_auth: true
    description: WireMock HTTP API and admin endpoint (/__admin)
