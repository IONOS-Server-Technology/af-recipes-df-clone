id: silex
enabled: false
display_name: Silex
description: Open-source no-code website builder with drag-and-drop editing and clean HTML output.
short_description:
  en: "Build and publish a website visually with a drag-and-drop editor — no coding required, you own the HTML."
  de: "Website visuell per Drag-and-drop erstellen und veröffentlichen — kein Code nötig, Sie behalten das HTML."
  es: "Crea y publica tu sitio web visualmente con un editor drag-and-drop — sin código, el HTML es tuyo."
  fr: "Créez et publiez votre site web visuellement par glisser-déposer — sans code, le HTML vous appartient."
  it: "Crea e pubblica il tuo sito web visivamente con un editor drag-and-drop — senza codice, l'HTML è tuo."
  nl: "Bouw en publiceer je website visueel met een drag-and-drop editor — geen code nodig, jij behoudt de HTML."
  pl: "Buduj i publikuj stronę internetową metodą drag-and-drop — bez kodu, HTML pozostaje twój."
categories:
  - productivity
app_version: "3.9.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/silexlabs/Silex
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/silex/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/silex.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 3dfdfa4a648ef9147631f7178b59ba0461de50d7b7e285144f88f2f947747b6c

app_min_ram_mb: 256
app_min_disk_mb: 5120

# basic_auth (traefik_basic_auth mechanism from apps-gaps/silex.yaml):
# Silex in filesystem-connector mode (STORAGE_CONNECTORS=fs, HOSTING_CONNECTORS=fs)
# ships no built-in login. Anyone reaching the URL can edit the site, so a Traefik
# basic-auth gate is mandatory. The customer disables it once their use-case allows
# open access: /root/auth.sh off silex
ports:
  - port: 6805
    protocol: tcp
    public: true
    basic_auth: true
    description: Silex Web UI
