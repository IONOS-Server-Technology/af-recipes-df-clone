services:
  vaultwarden:
    image: vaultwarden/server:1.37.1
    restart: unless-stopped
    labels:
      - "wud.trigger.include=ntfy.notify,dockercompose.apply"
      - "wud.compose.file=/opt/vaultwarden/docker-compose.yml"
    environment:
      - DOMAIN=https://${AF_APP_DOMAIN}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED:-false}
      - WEBSOCKET_ENABLED=true
      - ROCKET_PORT=8080
    ports:
      - "8080"
    volumes:
      - /opt/vaultwarden/data:/data
    networks:
      - vaultwarden-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/alive || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  vaultwarden-network:
    driver: bridge
