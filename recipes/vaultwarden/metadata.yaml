id: vaultwarden
enabled: true
display_name: Vaultwarden
description: Lightweight Bitwarden-compatible password manager server.
short_description:
  en: "Store and sync passwords across all your devices with a self-hosted, Bitwarden-compatible password manager."
  de: "Passwörter geräteübergreifend speichern und synchronisieren — mit einem selbstgehosteten, Bitwarden-kompatiblen Manager."
  es: "Almacena y sincroniza contraseñas en todos tus dispositivos con un gestor autoalojado compatible con Bitwarden."
  fr: "Stockez et synchronisez vos mots de passe sur tous vos appareils avec un gestionnaire compatible Bitwarden auto-hébergé."
  it: "Archivia e sincronizza le password su tutti i dispositivi con un gestore self-hosted compatibile con Bitwarden."
  nl: "Bewaar en synchroniseer wachtwoorden op al je apparaten met een zelf-gehoste, Bitwarden-compatibele wachtwoordmanager."
  pl: "Przechowuj i synchronizuj hasła na wszystkich urządzeniach z samodzielnie hostowanym menedżerem kompatybilnym z Bitwarden."
categories:
  - security
app_version: "1.37.0"
recipe_version: "1.1.0"
recipe_type: docker-compose
upstream_url: https://github.com/dani-garcia/vaultwarden

app_min_ram_mb: 256
app_min_disk_mb: 5120


ports:
  - port: 8080
    protocol: tcp
    public: true
    description: Vaultwarden Web UI (routed via Traefik on 80/443)

parameters:
  # generated_from (IF-1420): ADMIN_TOKEN is derived from the customer's server
  # (root) password at /compose time, so they reach /admin with the password they
  # already have instead of a second generated token they would have to look up.
  #
  # Two constraints for the af-api side of this:
  # - Vaultwarden only treats ADMIN_TOKEN as a hash when it is an argon2id PHC
  #   string ($argon2id$v=19$…); a bare value is compared as plaintext. So the
  #   hash has to be argon2id, and the plaintext never leaves af-api. The
  #   `argon2` algorithm token below always emits this format (af-api's
  #   credentials.py uses argon2-cffi's PasswordHasher, which defaults to
  #   argon2id) — there is no separate "argon2id" token to declare.
  # - A PHC string is dollar-heavy and this value reaches the container via
  #   ${ADMIN_TOKEN} in docker-compose.yaml, so its dollars need doubling on the
  #   way into .env — the same escaping IF-1312 added for the bcrypt basic-auth
  #   hash (basic_auth_env_line in af-api).
  - name: ADMIN_TOKEN
    display_name: Admin Token
    type: password
    generated_from: "argon2:ROOT_PASSWORD"
    description: Secret token for the /admin panel. Derived from your server password — log in at /admin with that password.
  - name: SIGNUPS_ALLOWED
    display_name: Allow Signups
    type: boolean
    default: true
    description: Whether to allow new user registrations.


