id: vaultwarden
enabled: true
display_name: Vaultwarden
description: Lightweight Bitwarden-compatible password manager server.
short_description:
  en: "Store and sync passwords across all your devices with a self-hosted, Bitwarden-compatible password manager."
  de: "Passwörter geräteübergreifend speichern und synchronisieren — mit einem selbstgehosteten, Bitwarden-kompatiblen Manager."
  es: "Almacena y sincroniza contraseñas en todos tus dispositivos con un gestor autoalojado compatible con Bitwarden."
  fr: "Stockez et synchronisez vos mots de passe sur tous vos appareils avec un gestionnaire compatible Bitwarden auto-hébergé."
  it: "Archivia e sincronizza le password su tutti i dispositivi con un gestore self-hosted compatibile con Bitwarden."
  nl: "Bewaar en synchroniseer wachtwoorden op al je apparaten met een zelf-gehoste, Bitwarden-compatibele wachtwoordmanager."
  pl: "Przechowuj i synchronizuj hasła na wszystkich urządzeniach z samodzielnie hostowanym menedżerem kompatybilnym z Bitwarden."
categories:
  - security
app_version: "1.32.7"
recipe_version: "1.0.0"
recipe_type: docker-compose
upstream_url: https://github.com/dani-garcia/vaultwarden

app_min_ram_mb: 256
app_min_disk_mb: 5120

supported_os:
  - ubuntu-26.04

ports:
  - port: 80
    protocol: tcp
    public: true
    description: Vaultwarden Web UI

parameters:
  - name: APP_DOMAIN
    display_name: Domain
    type: domain
    required: true
    description: Domain for accessing Vaultwarden (e.g., vault.example.com).
  - name: ADMIN_TOKEN
    display_name: Admin Token
    type: password
    required: false
    auto_generate: true
    description: Secret token for the /admin panel (auto-generated if not provided).
  - name: SIGNUPS_ALLOWED
    display_name: Allow Signups
    type: boolean
    required: false
    default: true
    description: Whether to allow new user registrations.

incompatible_with_apps: []
