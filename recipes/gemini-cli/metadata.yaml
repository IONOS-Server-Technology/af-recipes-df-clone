id: gemini-cli
enabled: false
display_name: Gemini CLI
description: Command-line tool to interact with Google's Gemini models.
short_description:
  en: "Access Google's Gemini AI from your terminal — generate text, analyze files, and automate tasks with a powerful AI model."
  de: "Google Gemini KI direkt im Terminal nutzen — Texte generieren, Dateien analysieren und Aufgaben mit KI automatisieren."
  es: "Accede a la IA Gemini de Google desde tu terminal — genera textos, analiza archivos y automatiza tareas."
  fr: "Accédez à l'IA Gemini de Google depuis votre terminal — générez du texte, analysez des fichiers et automatisez des tâches."
  it: "Accedi all'IA Gemini di Google dal terminale — genera testi, analizza file e automatizza attività."
  nl: "Toegang tot Google's Gemini AI vanuit je terminal — genereer tekst, analyseer bestanden en automatiseer taken."
  pl: "Korzystaj z AI Gemini od Google w terminalu — generuj tekst, analizuj pliki i automatyzuj zadania."
categories:
  - developer-tools
  - ai
app_version: "1.0.0"
recipe_version: "1.0.0"
recipe_type: native
upstream_url: https://github.com/google-gemini/gemini-cli

app_min_ram_mb: 1024
app_min_disk_mb: 5120


ports: []

parameters:
  - name: GEMINI_API_KEY
    display_name: Gemini API Key
    type: string
    required: false
    description: API key for Google Gemini models (obtain from https://aistudio.google.com/apikey). Can also authenticate via Google OAuth interactively.


incompatible_with_apps: []

