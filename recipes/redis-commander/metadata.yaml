id: redis-commander
enabled: false
display_name: Redis Commander
description: Web-based Redis management UI with key browser and command console.
short_description:
  en: "Browse, edit and query your Redis keys through a clean web UI — ships with a built-in Redis server so no separate setup is needed."
  de: "Redis-Schlüssel über eine Weboberfläche durchsuchen, bearbeiten und abfragen — mit integriertem Redis-Server, kein separates Setup nötig."
  es: "Navega, edita y consulta tus claves Redis desde una interfaz web — incluye servidor Redis integrado, sin configuración adicional."
  fr: "Parcourez, modifiez et interrogez vos clés Redis via une interface web — livrée avec un serveur Redis intégré, sans installation supplémentaire."
  it: "Sfoglia, modifica e interroga le chiavi Redis da un'interfaccia web — con server Redis integrato, nessuna configurazione separata necessaria."
  nl: "Blader, bewerk en bevraag Redis-sleutels via een webinterface — inclusief ingebouwde Redis-server, geen extra configuratie vereist."
  pl: "Przeglądaj, edytuj i odpytuj klucze Redis przez interfejs webowy — z wbudowanym serwerem Redis, bez dodatkowej konfiguracji."
categories:
  - developer-tools
app_version: "0.9.1"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://joeferner.github.io/redis-commander/
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/redis-commander/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/joeferner/redis-commander/gh-pages/images/banner.png
logo_license: trademark-nominative-fair-use
logo_sha256: 01449800c57700b98263f7115faeba97d005d9db350307400f91f53c30506a53

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 8081
    protocol: tcp
    public: true
    http: true
    description: Redis Commander Web UI

parameters:
  - name: HTTP_PASSWORD_HASH
    display_name: Web UI Password Hash
    type: password
    generated_from: "bcrypt:ROOT_PASSWORD"
    description: "Bcrypt hash of the server password used to authenticate against the Redis Commander UI. Log in with your server password."
