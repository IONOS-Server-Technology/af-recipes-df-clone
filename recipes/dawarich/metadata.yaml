id: dawarich
enabled: false
display_name: Dawarich
description: Self-hosted location history tracker with heatmaps and travel statistics.
short_description:
  en: "Track and visualize your location history on your own server — heatmaps, trip statistics, and travel posters from your GPS data."
  de: "Standortverlauf selbst hosten und visualisieren — Heatmaps, Reisestatistiken und Reiseposter aus Ihren GPS-Daten."
  es: "Registra y visualiza tu historial de ubicación en tu propio servidor — mapas de calor, estadísticas de viaje y pósteres desde tus datos GPS."
  fr: "Hébergez et visualisez votre historique de localisation — cartes de chaleur, statistiques de voyage et affiches depuis vos données GPS."
  it: "Traccia e visualizza la cronologia della tua posizione sul tuo server — mappe di calore, statistiche di viaggio e poster dai dati GPS."
  nl: "Beheer en visualiseer je locatiegeschiedenis op je eigen server — heatmaps, reisstatistieken en reisposters van je GPS-data."
  pl: "Śledź i wizualizuj historię lokalizacji na własnym serwerze — mapy ciepła, statystyki podróży i plakaty z danych GPS."
categories:
  - productivity
app_version: "1.11.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/Freika/dawarich
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/dawarich/0.2.0/logo.svg
logo_source: https://dawarich.app/img/icon-512.png
logo_license: trademark-nominative-fair-use
logo_sha256: 0d900c865287d131496ae3da6782f8936751ace65d0f337bb0c49f687dbd5c06

app_min_ram_mb: 2048
app_min_disk_mb: 20480

# basic_auth: Dawarich seeds a fixed, publicly-known demo account (demo@dawarich.app /
# safepassword) with no environment variable to override it at first boot. A Traefik
# basic-auth gate closes that setup-takeover window — the well-known credential is
# unreachable until the customer changes it. The customer turns the gate off with
# '/root/auth.sh off dawarich' after setting their own login.
ports:
  - port: 3000
    protocol: tcp
    public: true
    basic_auth: true
    description: Dawarich Web UI

parameters:
  - name: SECRET_KEY_BASE
    display_name: Secret Key Base
    type: password
    description: Rails secret key base; generated at install time.

  - name: POSTGRES_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password; generated at install time.
