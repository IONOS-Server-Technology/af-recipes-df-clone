id: chartdb
enabled: false
display_name: ChartDB
description: Open-source database schema diagram editor with AI-assisted DDL export and interactive ER-diagram visualization.
short_description:
  en: "Visualize and edit your database schema with an interactive ER-diagram editor and AI-assisted DDL export for migrations."
  de: "Datenbankschema mit interaktivem ER-Diagramm-Editor visualisieren und bearbeiten – mit KI-gestütztem DDL-Export für Migrationen."
  es: "Visualiza y edita el esquema de tu base de datos con un editor ER interactivo y exportación DDL asistida por IA para migraciones."
  fr: "Visualisez et éditez votre schéma de base de données avec un éditeur ER interactif et un export DDL assisté par IA pour les migrations."
  it: "Visualizza e modifica lo schema del tuo database con un editor ER interattivo ed esportazione DDL assistita dall'IA per le migrazioni."
  nl: "Visualiseer en bewerk je databaseschema met een interactieve ER-diagrameditor en AI-ondersteunde DDL-export voor migraties."
  pl: "Wizualizuj i edytuj schemat bazy danych za pomocą interaktywnego edytora ER i wspomaganego AI eksportu DDL dla migracji."
categories:
  - developer-tools
# No upstream compose file exists (compose_file_url: null in apps-gaps/chartdb.yaml).
# Picking the current latest stable release tag (1.20.1, 2026-04-07) per IF-1501 rule 3.
app_version: "1.20.1"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/chartdb/chartdb
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/chartdb/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/selfhst/icons/png/chartdb.png
logo_license: trademark-nominative-fair-use
logo_sha256: f7ada9d57943f14301b5faec261593447d5cfa7084d269c5ccb7ceb657a01f43

app_min_ram_mb: 256
app_min_disk_mb: 1024

# ChartDB has no built-in login — all diagram state lives in the browser, and DB
# connections are supplied manually per-session. basic_auth: true gates the UI with the
# customer's server password via Traefik (the same mechanism used by hermes-agent).
# No inbound webhooks or API callbacks are expected, so the router-wide auth prompt
# is not a trade-off here — it only affects browser access to the UI.
ports:
  - port: 80
    protocol: tcp
    public: true
    basic_auth: true
    description: ChartDB Web UI
