services:
  chartdb:
    image: ghcr.io/chartdb/chartdb:1.20.1
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "80:80"
    networks:
      - chartdb-network
    healthcheck:
      # ChartDB serves its SPA on / — a 200 means the web server is up.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  chartdb-network:
    driver: bridge
