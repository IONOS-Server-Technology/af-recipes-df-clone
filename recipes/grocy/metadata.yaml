id: grocy
enabled: false
display_name: Grocy
description: Self-hosted grocery and household management with inventory, shopping lists, and meal planning.
short_description:
  en: "Manage household groceries, track food inventory and expiry dates, build shopping lists, and plan meals — all self-hosted."
  de: "Lebensmittelvorräte verwalten, Ablaufdaten verfolgen, Einkaufslisten erstellen und Mahlzeiten planen — selbst gehostet."
  es: "Gestiona tu despensa, controla fechas de caducidad, crea listas de compras y planifica comidas de forma autoalojada."
  fr: "Gérez vos stocks alimentaires, suivez les dates de péremption, créez des listes de courses et planifiez vos repas."
  it: "Gestisci le scorte alimentari, monitora le scadenze, crea liste della spesa e pianifica i pasti in modo self-hosted."
  nl: "Beheer voedselvoorraden, volg houdbaarheidsdatums bij, maak boodschappenlijsten en plan maaltijden — zelf gehost."
  pl: "Zarządzaj zapasami spożywczymi, śledź daty ważności, twórz listy zakupów i planuj posiłki — hostowane samodzielnie."
categories:
  - home
  - productivity
app_version: "4.6.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://grocy.info/
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/grocy/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/grocy/grocy/master/public/img/icon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 710fc3007bd3fc8e5fb24b3870349e12bd180de35d5926b88b50c1e5784df8a3

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 80
    protocol: tcp
    public: true
    basic_auth: true
    description: Grocy Web UI
