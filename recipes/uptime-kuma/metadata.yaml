id: uptime-kuma
enabled: false
display_name: Uptime Kuma
description: Self-hosted monitoring tool for tracking uptime of websites and services.
short_description:
  en: "Monitor your websites and services and receive instant alerts the moment something goes offline."
  de: "Websites und Dienste überwachen und sofort benachrichtigt werden, wenn etwas nicht erreichbar ist."
  es: "Monitoriza tus sitios web y servicios y recibe alertas instantáneas cuando algo falla."
  fr: "Surveillez vos sites web et services et recevez des alertes instantanées dès qu'une panne survient."
  it: "Monitora i tuoi siti web e servizi e ricevi avvisi istantanei quando qualcosa va offline."
  nl: "Monitor je websites en diensten en ontvang directe meldingen zodra er iets offline gaat."
  pl: "Monitoruj strony i usługi i otrzymuj natychmiastowe alerty, gdy coś przestaje działać."
categories:
  - monitoring
app_version: "1.23.16"
recipe_version: "1.0.0"
recipe_type: docker-compose
upstream_url: https://github.com/louislam/uptime-kuma

app_min_ram_mb: 256
app_min_disk_mb: 2048

supported_os:
  - ubuntu-26.04

ports:
  - port: 3001
    protocol: tcp
    public: true
    description: Uptime Kuma Web UI

parameters:
  - name: APP_DOMAIN
    display_name: Domain
    type: domain
    required: true
    description: Domain for accessing Uptime Kuma (e.g., status.example.com).

incompatible_with_apps: []
