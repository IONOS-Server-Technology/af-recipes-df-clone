services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v2.7.5
    restart: unless-stopped
    environment:
      - DB_HOSTNAME=postgres
      - DB_PORT=5432
      - DB_DATABASE_NAME=immich
      - DB_USERNAME=immich
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOSTNAME=redis
    ports:
      - "2283:2283"
    volumes:
      - /opt/immich/upload:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    networks:
      - immich-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2283/api/server/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v2.7.5
    restart: unless-stopped
    volumes:
      - /opt/immich/model-cache:/cache
    networks:
      - immich-network

  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    networks:
      - immich-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    restart: unless-stopped
    environment:
      - POSTGRES_DB=immich
      - POSTGRES_USER=immich
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - /opt/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - immich-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  immich-network:
    driver: bridge
