id: immich
enabled: true
display_name: Immich
description: High-performance self-hosted photo and video management solution.
short_description:
  en: "Back up and organize your photos and videos on your own server — with AI-powered search, albums, and sharing."
  de: "Fotos und Videos auf dem eigenen Server sichern und organisieren — mit KI-Suche, Alben und Freigabefunktion."
  es: "Haz copias de seguridad y organiza tus fotos y vídeos en tu propio servidor — con búsqueda por IA, álbumes y compartición."
  fr: "Sauvegardez et organisez vos photos et vidéos sur votre propre serveur — avec recherche IA, albums et partage."
  it: "Fai il backup e organizza foto e video sul tuo server — con ricerca AI, album e condivisione."
  nl: "Maak back-ups van je foto's en video's op je eigen server — met AI-zoekfunctie, albums en delen."
  pl: "Twórz kopie zapasowe i organizuj zdjęcia oraz filmy na własnym serwerze — z wyszukiwaniem AI, albumami i udostępnianiem."
categories:
  - media
app_version: "3.0.3"
recipe_version: "2.1.0"
recipe_type: docker-compose
upstream_url: https://github.com/immich-app/immich

app_min_ram_mb: 4096
app_min_disk_mb: 51200


# basic_auth (IF-1312): closes a gap flagged in Björn Jäger's review of this story
# (Finding 2) — the 2026-08-04 PM decision names immich alongside n8n, wud and
# openclaw, but this recipe never got the flag.
#
# What this protects: a fresh Immich is not initialised and its admin sign-up endpoint
# is live, so an unclaimed instance can be taken over by anyone who reaches the URL
# before the customer's first visit — the same class of exposure the n8n and wud
# comments above document, measured live on an unclaimed instance during the review.
#
# What it costs: the whole router goes behind the prompt, including API traffic, and
# Immich's mobile app talks to that same origin — non-browser clients get a 401 too.
# Unlike n8n's webhook trade-off this has not been measured against the mobile app
# itself; flag that explicitly if this recipe is reviewed again before merge. The
# customer turns the prompt off once their account exists, with
# '/root/auth.sh off immich', named in the password prompt.
ports:
  - port: 2283
    protocol: tcp
    public: true
    basic_auth: true
    description: Immich Web UI

parameters:
  - name: DB_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password.


