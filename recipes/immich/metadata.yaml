id: immich
enabled: true
display_name: Immich
description: High-performance self-hosted photo and video management solution.
short_description:
  en: "Back up and organize your photos and videos on your own server — with AI-powered search, albums, and sharing."
  de: "Fotos und Videos auf dem eigenen Server sichern und organisieren — mit KI-Suche, Alben und Freigabefunktion."
  es: "Haz copias de seguridad y organiza tus fotos y vídeos en tu propio servidor — con búsqueda por IA, álbumes y compartición."
  fr: "Sauvegardez et organisez vos photos et vidéos sur votre propre serveur — avec recherche IA, albums et partage."
  it: "Fai il backup e organizza foto e video sul tuo server — con ricerca AI, album e condivisione."
  nl: "Maak back-ups van je foto's en video's op je eigen server — met AI-zoekfunctie, albums en delen."
  pl: "Twórz kopie zapasowe i organizuj zdjęcia oraz filmy na własnym serwerze — z wyszukiwaniem AI, albumami i udostępnianiem."
categories:
  - media
app_version: "3.0.3"
recipe_version: "2.1.0"
recipe_type: docker-compose
upstream_url: https://github.com/immich-app/immich

app_min_ram_mb: 4096
app_min_disk_mb: 51200


ports:
  - port: 2283
    protocol: tcp
    public: true
    description: Immich Web UI

parameters:
  - name: APP_DOMAIN
    display_name: Domain
    type: domain
    description: Domain for accessing Immich (e.g., photos.example.com).
  - name: DB_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password.


# Logo (rendered in app catalogue thumbnails)
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/immich/2.1.0/logo.svg
