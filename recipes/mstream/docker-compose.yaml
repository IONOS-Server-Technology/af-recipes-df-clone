services:
  mstream:
    image: lscr.io/linuxserver/mstream:6.19.3
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
    ports:
      - "3000"
    volumes:
      - /opt/mstream/config:/config
      - /opt/mstream/music:/music
    networks:
      - mstream-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  mstream-network:
    driver: bridge
