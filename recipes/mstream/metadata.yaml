id: mstream
enabled: false
display_name: mStream
description: Lightweight self-hosted music streaming server with native iOS and Android apps.
short_description:
  en: "Stream your personal music library from your own server — with native iOS and Android apps for on-the-go playback."
  de: "Musikbibliothek vom eigenen Server streamen — mit nativen iOS- und Android-Apps für unterwegs."
  es: "Transmite tu biblioteca musical desde tu propio servidor, con apps nativas para iOS y Android."
  fr: "Diffusez votre bibliothèque musicale depuis votre serveur, avec des apps iOS et Android natives."
  it: "Riproduci la tua libreria musicale dal tuo server, con app native per iOS e Android."
  nl: "Stream je muziekbibliotheek vanaf je eigen server — met native iOS- en Android-apps voor onderweg."
  pl: "Streamuj swoją bibliotekę muzyczną z własnego serwera — z natywnymi aplikacjami na iOS i Android."
categories:
  - media
app_version: "6.19.3"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/IrosTheBeggar/mStream
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/mstream/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/IrosTheBeggar/mStream/master/webapp/assets/img/mstream-icon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 90f0858fa447ce555c1235a28a27d354712ebc9ed37a54cf1e48724fbc93f70b

app_min_ram_mb: 256
app_min_disk_mb: 2048

# mStream runs in public mode (no login) by default — the admin/user account is created
# interactively through the web UI after first boot; there is no env-var channel for a
# first-boot credential. basic_auth: true puts a Traefik prompt in front so an unclaimed
# instance cannot be reached by anyone before the owner configures it.
ports:
  - port: 3000
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: mStream Web UI
