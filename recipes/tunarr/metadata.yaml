id: tunarr
enabled: false
display_name: Tunarr
description: Build custom live TV channels from Plex, Jellyfin, and Emby libraries.
short_description:
  en: "Turn your Plex, Jellyfin, or Emby library into scheduled live TV channels with an HDHomeRun-compatible tuner."
  de: "Verwandeln Sie Ihre Plex-, Jellyfin- oder Emby-Bibliothek in geplante Live-TV-Kanäle mit einem HDHomeRun-kompatiblen Tuner."
  es: "Convierte tu biblioteca de Plex, Jellyfin o Emby en canales de TV programados con un sintonizador compatible con HDHomeRun."
  fr: "Transformez votre bibliothèque Plex, Jellyfin ou Emby en chaînes TV programmées avec un tuner compatible HDHomeRun."
  it: "Trasforma la tua libreria Plex, Jellyfin o Emby in canali TV programmati con un sintonizzatore compatibile con HDHomeRun."
  nl: "Zet je Plex-, Jellyfin- of Emby-bibliotheek om in geplande live-tv-kanalen met een HDHomeRun-compatibele tuner."
  pl: "Zamień bibliotekę Plex, Jellyfin lub Emby w zaplanowane kanały telewizji na żywo z tunerem zgodnym z HDHomeRun."
categories:
  - media
app_version: "edge"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/chrisbenincasa/tunarr
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/tunarr/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/chrisbenincasa/tunarr/main/web/public/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: b8556bfa20283db7dd2df992024498da29fe062319b6385e9e30470314f394ef

app_min_ram_mb: 256
app_min_disk_mb: 2048

# basic_auth: Tunarr ships with no built-in login — the web UI is open to anyone who
# reaches the URL. basic_auth: true closes that window using the customer's server
# password. Tunarr receives no inbound webhooks or OAuth callbacks, so there is no
# external-caller cost to the prompt being router-wide.
ports:
  - port: 8000
    protocol: tcp
    public: true
    basic_auth: true
    description: Tunarr Web UI
