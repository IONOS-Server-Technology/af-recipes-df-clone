services:
  tunarr:
    image: chrisbenincasa/tunarr:edge
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /opt/tunarr/config:/config
    networks:
      - tunarr-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  tunarr-network:
    driver: bridge
