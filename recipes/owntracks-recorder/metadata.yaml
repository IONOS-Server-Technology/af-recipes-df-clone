id: owntracks-recorder
enabled: false
display_name: OwnTracks Recorder
description: Self-hosted backend storing and visualizing OwnTracks phone location data.
short_description:
  en: "Record and visualize your phone's GPS location history on your own server — a privacy-first alternative to Google/Apple location tracking."
  de: "GPS-Standortverlauf des Smartphones auf dem eigenen Server aufzeichnen und visualisieren – datenschutzfreundliche Alternative zu Google/Apple."
  es: "Registra y visualiza el historial de ubicación GPS de tu teléfono en tu propio servidor — alternativa a Google/Apple centrada en la privacidad."
  fr: "Enregistrez et visualisez l'historique GPS de votre téléphone sur votre propre serveur — une alternative respectueuse de la vie privée à Google/Apple."
  it: "Registra e visualizza la cronologia GPS del tuo telefono sul tuo server — un'alternativa privata a Google/Apple location history."
  nl: "Registreer en visualiseer de GPS-locatiegeschiedenis van je telefoon op je eigen server — een privacyvriendelijk alternatief voor Google/Apple."
  pl: "Rejestruj i wizualizuj historię lokalizacji GPS telefonu na własnym serwerze — prywatna alternatywa dla Google/Apple."
categories:
  - monitoring
  - home
app_version: "1.0.1"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/owntracks/recorder
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/owntracks-recorder/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/owntracks/owntracks/master/assets/logos/glyph.png
logo_license: trademark-nominative-fair-use
logo_sha256: ad5c34ca29110171684a58e55f193bbd6680baf5e6538cae6e7a35419b5d6254

app_min_ram_mb: 256
app_min_disk_mb: 2048

# OwnTracks Recorder has no built-in authentication — upstream docs and community
# deployment guides uniformly rely on a fronting reverse proxy for HTTP Basic auth.
# basic_auth: true gates the web UI and the /pub ingest endpoint behind the
# customer's server password (traefik_basic_auth mechanism from installability).
ports:
  - port: 8083
    protocol: tcp
    public: true
    basic_auth: true
    description: Web UI and location ingest endpoint
