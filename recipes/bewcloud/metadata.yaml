id: bewcloud
enabled: false
display_name: bewCloud
description: Lightweight self-hosted cloud storage with web file manager and CalDAV/CardDAV sync.
short_description:
  en: "Personal cloud storage with a web file manager plus calendar and contacts sync — a lightweight Nextcloud alternative that runs on your own server."
  de: "Persönliche Cloud-Speicherung mit Web-Dateimanager sowie Kalender- und Kontaktsync — eine schlanke Nextcloud-Alternative auf Ihrem Server."
  es: "Almacenamiento en nube personal con gestor de archivos web y sincronización de calendario y contactos — una alternativa ligera a Nextcloud en tu servidor."
  fr: "Stockage cloud personnel avec gestionnaire de fichiers web et synchronisation agenda/contacts — une alternative légère à Nextcloud sur votre serveur."
  it: "Archiviazione cloud personale con gestore file web e sincronizzazione calendario e contatti — un'alternativa leggera a Nextcloud sul tuo server."
  nl: "Persoonlijke cloudopslag met webbestandsbeheer en synchronisatie van agenda en contacten — een lichtgewicht Nextcloud-alternatief op je eigen server."
  pl: "Osobista pamięć chmurowa z menedżerem plików i synchronizacją kalendarza i kontaktów — lekka alternatywa dla Nextcloud na własnym serwerze."
categories:
  - productivity
  - storage
app_version: "4.15.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/bewcloud/bewcloud
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/bewcloud/0.2.0/logo.svg
logo_source: https://bewcloud.com/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 82c2ab605e44382fd3e31f430b9574be45d539b72cdc1974ccca7221e9f2ef14

app_min_ram_mb: 1024
app_min_disk_mb: 20480

ports:
  - port: 8000
    protocol: tcp
    public: true
    description: bewCloud Web UI
