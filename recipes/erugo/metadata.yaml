id: erugo
enabled: false
display_name: Erugo
description: Self-hosted file-sharing with password protection and expiry controls.
short_description:
  en: "Share files securely with password-protected, expiring links — your own self-hosted WeTransfer alternative."
  de: "Dateien sicher teilen mit passwortgeschützten, ablaufenden Links – die selbstgehostete WeTransfer-Alternative."
  es: "Comparte archivos de forma segura con enlaces protegidos por contraseña y con fecha de vencimiento."
  fr: "Partagez des fichiers en toute sécurité avec des liens protégés par mot de passe et à durée limitée."
  it: "Condividi file in modo sicuro con link protetti da password e con scadenza."
  nl: "Deel bestanden veilig met wachtwoordbeveiligde, verlopende links – jouw zelfgehoste WeTransfer-alternatief."
  pl: "Udostępniaj pliki bezpiecznie za pomocą linków chronionych hasłem i z datą wygaśnięcia."
categories:
  - media
app_version: "0.2.15"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/ErugoOSS/Erugo
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/erugo/0.2.0/logo.svg
logo_source: https://erugo.app/icon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: a3fbf05ad8247f101b09af53bfa5042ecbe4fa0ca80518b2473565a86f7c90ae

app_min_ram_mb: 512
app_min_disk_mb: 2048

ports:
  - port: 80
    protocol: tcp
    public: true
    http: true
    description: Erugo Web UI
