services:
  erugo:
    image: wardy784/erugo:0.2.15
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /opt/erugo/storage:/var/www/html/storage
    networks:
      - erugo-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  erugo-network:
    driver: bridge
