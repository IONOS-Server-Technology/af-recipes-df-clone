id: infisical
enabled: false
display_name: Infisical
description: Open-source secrets manager for syncing env variables and API keys across teams and infrastructure.
short_description:
  en: "Manage and sync secrets, API keys, and environment variables across your team and infrastructure — entirely on your own server."
  de: "Geheimnisse, API-Schlüssel und Umgebungsvariablen teamweit und in der Infrastruktur verwalten und synchronisieren — vollständig auf Ihrem Server."
  es: "Gestiona y sincroniza secretos, claves API y variables de entorno en tu equipo e infraestructura — completamente en tu propio servidor."
  fr: "Gérez et synchronisez secrets, clés API et variables d'environnement pour votre équipe et infrastructure — entièrement sur votre serveur."
  it: "Gestisci e sincronizza segreti, chiavi API e variabili d'ambiente nel tuo team e infrastruttura — interamente sul tuo server."
  nl: "Beheer en synchroniseer secrets, API-sleutels en omgevingsvariabelen voor je team en infrastructuur — volledig op je eigen server."
  pl: "Zarządzaj i synchronizuj sekrety, klucze API i zmienne środowiskowe w zespole i infrastrukturze — całkowicie na własnym serwerze."
categories:
  - security
  - developer-tools
app_version: "v0.162.16-postgres"
recipe_version: "0.1.1"
recipe_type: docker-compose
upstream_url: https://github.com/Infisical/infisical
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/infisical/0.1.1/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/png/infisical.png
logo_license: trademark-nominative-fair-use
logo_sha256: 98c1fbdba63fd0427a69dbef848fa6950e7cb765e7a747e3fe52d614ba0b115f

app_min_ram_mb: 2048
app_min_disk_mb: 20480

ports:
  - port: 8080
    protocol: tcp
    public: true
    description: Infisical Web UI

parameters:
  - name: ENCRYPTION_KEY
    display_name: Encryption Key
    type: password
    description: Key used to encrypt secrets stored in Infisical.

  - name: AUTH_SECRET
    display_name: Auth Secret
    type: password
    description: JWT secret used for signing authentication tokens.

  - name: POSTGRES_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password.
