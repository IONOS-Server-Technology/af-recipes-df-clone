services:
  kanboard:
    image: kanboard/kanboard:v1.2.53
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /opt/kanboard/data:/var/www/app/data
    networks:
      - kanboard-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  kanboard-network:
    driver: bridge
