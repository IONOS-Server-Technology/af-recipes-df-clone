id: privatebin
enabled: false
display_name: PrivateBin
description: Zero-knowledge encrypted pastebin for secure, ephemeral text and secret sharing.
short_description:
  en: "Share encrypted snippets and secrets securely — the server never sees the plaintext. Pastes can expire or burn after reading; no accounts needed."
  de: "Verschlüsselte Snippets und Geheimnisse sicher teilen — der Server sieht nur Chiffretext. Pastes können ablaufen oder sich nach dem Lesen selbst löschen."
  es: "Comparte fragmentos cifrados de forma segura — el servidor nunca ve el texto en claro. Los pastes pueden caducar o autodestruirse tras su lectura."
  fr: "Partagez des extraits chiffrés en toute sécurité — le serveur ne voit jamais le texte en clair. Les pastes peuvent expirer ou s'autodétruire après lecture."
  it: "Condividi frammenti cifrati in modo sicuro — il server non vede mai il testo in chiaro. I paste possono scadere o autodistruggersi dopo la lettura."
  nl: "Deel versleutelde fragmenten veilig — de server ziet nooit de leesbare tekst. Pastes kunnen verlopen of zichzelf verwijderen na het lezen."
  pl: "Bezpiecznie udostępniaj zaszyfrowane fragmenty — serwer nigdy nie widzi tekstu jawnego. Pasty mogą wygasać lub samodzielnie usuwać się po przeczytaniu."
categories:
  - security
  - productivity
app_version: "2.0.5"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/PrivateBin/PrivateBin
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/privatebin/0.2.0/logo.svg
logo_source: https://privatebin.info/theme/img/safari-pinned-tab.svg
logo_license: trademark-nominative-fair-use
logo_sha256: e2c2a0e60c390b017e73e976e0f4764ac75a6be811efed2859ef781e67f1f533

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 8080
    protocol: tcp
    public: true
    description: PrivateBin Web UI
