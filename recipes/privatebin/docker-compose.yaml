services:
  privatebin:
    image: privatebin/nginx-fpm-alpine:2.0.5
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /opt/privatebin/data:/srv/data
    networks:
      - privatebin-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  privatebin-network:
    driver: bridge
