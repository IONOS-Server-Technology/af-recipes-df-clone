id: openpanel
enabled: false
display_name: OpenPanel
description: Privacy-first product analytics with real-time dashboards, funnels, and session replay.
short_description:
  en: "Self-host your product analytics with full data ownership — event tracking, funnels, and session replay without sending data to third parties."
  de: "Produktanalyse selbst hosten mit voller Datenkontrolle — Event-Tracking, Funnels und Session-Replay ohne Daten an Dritte zu senden."
  es: "Aloja tu analítica de producto con control total de los datos — seguimiento de eventos, embudos y repetición de sesiones sin enviar datos a terceros."
  fr: "Hébergez vos analytics produit avec une maîtrise totale des données — suivi d'événements, entonnoirs et replay de session sans tiers."
  it: "Ospita la tua analytics di prodotto con controllo totale dei dati — tracciamento eventi, funnel e session replay senza invii a terze parti."
  nl: "Host je productanalyse met volledige gegevensbeheer — event-tracking, funnels en sessie-replay zonder data naar derden te sturen."
  pl: "Hostuj własną analitykę produktu z pełną kontrolą danych — śledzenie zdarzeń, lejki i odtwarzanie sesji bez wysyłania danych do stron trzecich."
categories:
  - monitoring
  - developer-tools
app_version: "2"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/Openpanel-dev/openpanel
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/openpanel/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/openpanel.svg
logo_license: trademark-nominative-fair-use
logo_sha256: a9555a82d66601cc2fa5230d718dc6621f623fbc58a6476cb492bfc61518be09

app_min_ram_mb: 4096
app_min_disk_mb: 20480

# basic_auth closes the first-registrant-becomes-admin race: OpenPanel has no env-var
# path to pre-seed an admin account. Its own docs say "the first user to register
# becomes the admin" and registration is auto-disabled after that — anyone who reaches
# the signup URL before the customer becomes the permanent owner. The Traefik
# basic_auth gate makes the signup form unreachable until the customer authenticates,
# the same pattern as n8n, immich, and plausible-analytics. The customer removes the
# gate once their account exists with '/root/auth.sh off openpanel'.
# Trade-off: the router gate also covers the event-ingestion API path that external
# sites hit to send tracking events — the customer will need to disable basic_auth
# before pointing any tracked site at this instance. See apps-gaps/openpanel.yaml
# (blocking_issues) for the full analysis.
ports:
  - port: 3000
    protocol: tcp
    public: true
    basic_auth: true
    description: OpenPanel Dashboard Web UI

parameters:
  - name: POSTGRES_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL password for the OpenPanel database. Generated by install.sh.

  - name: COOKIE_SECRET
    display_name: Cookie Secret
    type: password
    description: Secret used to sign session cookies. Generated by install.sh.
