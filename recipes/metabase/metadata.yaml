id: metabase
enabled: false
display_name: Metabase
description: Open-source business intelligence platform for data visualization and analytics.
short_description:
  en: "Connect your data and build charts and dashboards — no engineering effort required."
  de: "Verbinden Sie Ihre Daten und erstellen Sie Diagramme und Dashboards — ohne Entwicklungsaufwand."
  es: "Conecta tus datos y crea gráficos y paneles — sin esfuerzo de ingeniería."
  fr: "Connectez vos données et créez des graphiques et tableaux de bord — sans effort d'ingénierie."
  it: "Collega i tuoi dati e crea grafici e dashboard — senza sforzo di ingegneria."
  nl: "Koppel je data en bouw grafieken en dashboards — zonder ontwikkelwerk."
  pl: "Połącz swoje dane i twórz wykresy oraz panele — bez wysiłku inżynieryjnego."
categories:
  - productivity
app_version: "v0.63.13"
recipe_version: "0.2.1"
recipe_type: docker-compose
upstream_url: https://github.com/metabase/metabase
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/metabase/0.2.1/logo.svg
logo_source: https://www.metabase.com/images/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: e07dc3fb57f1e047280a48ba59584aa5187f0c22dd60a910064c93a058a6b13d

app_min_ram_mb: 2048
app_min_disk_mb: 20480


# basic_auth (IF-1312/IF-1490): Metabase has no env-var-based admin bootstrap — its
# first-run setup wizard is completed interactively in the browser, and whoever visits
# first claims the owner account. The platform login page (server password) gates the
# whole app until the customer completes setup themselves; see apps-gaps/metabase.yaml
# summary and the identical n8n/immich/open-webui/openclaw/wud trade-off.
# Once Metabase is configured:
# /root/auth.sh off metabase
ports:
  - port: 3000
    protocol: tcp
    public: true
    basic_auth: true
    description: Metabase Web UI

parameters:
  - name: POSTGRES_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password for Metabase's application database.
