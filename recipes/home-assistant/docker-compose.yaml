services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:2025.4.4
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Berlin}
    ports:
      - "8123:8123"
    volumes:
      - /opt/home-assistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    networks:
      - home-assistant-network
    privileged: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8123/api/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  home-assistant-network:
    driver: bridge
