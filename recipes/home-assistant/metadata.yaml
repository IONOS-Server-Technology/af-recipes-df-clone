id: home-assistant
enabled: false
display_name: Home Assistant
description: Open source home automation platform for local control and privacy.
short_description:
  en: "Control all your smart home devices in one place — local, private, and compatible with over 1,000 integrations."
  de: "Alle Smart-Home-Geräte zentral steuern — lokal, privat und kompatibel mit über 1.000 Integrationen."
  es: "Controla todos tus dispositivos de hogar inteligente en un lugar — local, privado y compatible con más de 1.000 integraciones."
  fr: "Contrôlez tous vos appareils domotiques en un seul endroit — local, privé et compatible avec plus de 1.000 intégrations."
  it: "Gestisci tutti i tuoi dispositivi smart home in un unico posto — locale, privato e compatibile con oltre 1.000 integrazioni."
  nl: "Bedien al je slimme apparaten op één plek — lokaal, privé en compatibel met meer dan 1.000 integraties."
  pl: "Steruj wszystkimi urządzeniami smart home w jednym miejscu — lokalne, prywatne i kompatybilne z ponad 1.000 integracjami."
categories:
  - automation
app_version: "2025.4.4"
recipe_version: "1.0.0"
recipe_type: docker-compose
upstream_url: https://github.com/home-assistant/core

app_min_ram_mb: 1024
app_min_disk_mb: 10240

supported_os:
  - ubuntu-26.04

ports:
  - port: 8123
    protocol: tcp
    public: true
    description: Home Assistant Web UI

parameters:
  - name: APP_DOMAIN
    display_name: Domain
    type: domain
    required: true
    description: Domain for accessing Home Assistant (e.g., ha.example.com).
  - name: TZ
    display_name: Timezone
    type: string
    required: false
    default: Europe/Berlin
    description: Timezone for Home Assistant (e.g., Europe/Berlin).

notes: |
  Home Assistant runs in bridge network mode (port 8123 mapped).
  For full local device discovery (Bluetooth, USB, mDNS), host network mode
  is recommended but not suitable for cloud server deployments.

incompatible_with_apps: []
