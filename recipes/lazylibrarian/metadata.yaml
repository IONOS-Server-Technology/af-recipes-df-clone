id: lazylibrarian
enabled: false
display_name: LazyLibrarian
description: Self-hosted automation tool for tracking and downloading ebooks and audiobooks by author or series.
short_description:
  en: "Automatically track and download ebooks and audiobooks by your favourite authors — a Sonarr/Radarr-style manager for your book library."
  de: "E-Books und Hörbücher deiner Lieblingsautoren automatisch verfolgen und herunterladen – ein Sonarr/Radarr-ähnlicher Manager für deine Buchsammlung."
  es: "Sigue y descarga automáticamente ebooks y audiolibros de tus autores favoritos — un gestor de biblioteca de libros estilo Sonarr/Radarr."
  fr: "Suivez et téléchargez automatiquement vos ebooks et livres audio par auteur ou série — un gestionnaire de bibliothèque façon Sonarr/Radarr."
  it: "Traccia e scarica automaticamente ebook e audiolibri dei tuoi autori preferiti — un gestore della libreria in stile Sonarr/Radarr."
  nl: "Volg en download automatisch e-books en luisterboeken van je favoriete auteurs — een Sonarr/Radarr-achtige manager voor je boekbibliotheek."
  pl: "Automatycznie śledź i pobieraj e-booki i audiobooki ulubionych autorów — menedżer biblioteki książkowej w stylu Sonarr/Radarr."
categories:
  - media
  - automation
app_version: "68d7be35-ls315"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://lazylibrarian.gitlab.io/
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/lazylibrarian/0.2.0/logo.svg
logo_source: https://gitlab.com/LazyLibrarian/LazyLibrarian/-/raw/master/data/images/ll512.png
logo_license: trademark-nominative-fair-use
logo_sha256: 4d6f7abdf261b09eb9e1098202cd351fc9f528f73fa1cf55fbc3967cd6bba9da

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 5299
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: LazyLibrarian Web UI
