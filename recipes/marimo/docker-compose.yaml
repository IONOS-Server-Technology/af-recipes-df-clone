services:
  marimo:
    image: ghcr.io/marimo-team/marimo:0.24.0
    restart: unless-stopped
    command: ["edit", "--no-token", "--headless", "--host", "0.0.0.0", "--port", "8080"]
    working_dir: /notebooks
    ports:
      - "8080:8080"
    volumes:
      - /opt/marimo/notebooks:/notebooks
    networks:
      - marimo-network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/')\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  marimo-network:
    driver: bridge
