services:
  odoo:
    image: odoo:19.0
    restart: unless-stopped
    ports:
      - "8069:8069"
    volumes:
      - /opt/odoo/odoo-data:/var/lib/odoo
      - /opt/odoo/config:/etc/odoo
    networks:
      - odoo-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8069/web/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    labels:
      # Database — never auto-update (schema migrations are not automatic).
      - "wud.watch=false"
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - /opt/odoo/postgres:/var/lib/postgresql/data
    networks:
      - odoo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  odoo-network:
    driver: bridge
