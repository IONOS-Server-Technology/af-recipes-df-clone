  it: "Genera e converti PDF a livello di codice — HTML, documenti Office e Markdown tramite una REST API headless."
  nl: "Genereer en converteer PDF's programmatisch — HTML, Office-documenten en Markdown via een headless REST API."
  pl: "Generuj i konwertuj pliki PDF programistycznie — HTML, dokumenty Office i Markdown przez headless REST API."
