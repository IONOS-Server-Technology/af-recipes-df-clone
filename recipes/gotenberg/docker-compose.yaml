services:
  gotenberg:
    image: gotenberg/gotenberg:8.34.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - gotenberg-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  gotenberg-network:
    driver: bridge
