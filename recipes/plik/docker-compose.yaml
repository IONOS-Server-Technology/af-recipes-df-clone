services:
  plik:
    image: rootgg/plik:1.4.2
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /opt/plik/data:/home/plik/server/files
      - /opt/plik/plik.db:/home/plik/server/plik.db
    networks:
      - plik-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  plik-network:
    driver: bridge
