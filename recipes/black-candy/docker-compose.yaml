services:
  black-candy:
    image: ghcr.io/blackcandy-org/blackcandy:3.2.0
    restart: unless-stopped
    environment:
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
    ports:
      - "3000:3000"
    volumes:
      - /opt/black-candy/storage:/app/storage
    networks:
      - black-candy-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  black-candy-network:
    driver: bridge
