  de: "Selbst gehostete Notification-Infrastruktur für E-Mail, SMS, Push und In-App — mit visuellen Workflow-Vorlagen und Provider-Integrationen."
  es: "Aloja tu propia infraestructura de notificaciones — email, SMS, push e in-app — con plantillas de flujo de trabajo e integraciones de proveedores."
  fr: "Hébergez votre couche de notifications — e-mail, SMS, push et in-app — avec des templates de flux de travail et des intégrations de fournisseurs."
  it: "Ospita la tua infrastruttura di notifiche — email, SMS, push e in-app — con template di flusso di lavoro e integrazioni provider."
  nl: "Host je eigen notificatie-infrastructuur — e-mail, SMS, push en in-app — met visuele workflow-sjablonen en ingebouwde providerintegraties."
  pl: "Hostuj własną infrastrukturę powiadomień — e-mail, SMS, push i in-app — z wizualnymi szablonami przepływów i integracjami dostawców."
categories:
  - developer-tools
  - automation
app_version: "3.19.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/novuhq/novu
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/novu/0.2.0/logo.svg
