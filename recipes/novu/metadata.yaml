logo_sha256: 08a1eafbd5221415bbb13580cc74f62563a40d358747f50b306b9cef77963205

app_min_ram_mb: 4096
app_min_disk_mb: 20480


# basic_auth: closes the same setup-takeover window documented for n8n and immich
# (IF-1312). A fresh Novu dashboard has an open self-signup flow — anyone who reaches
# the URL before the customer's first visit can create the owner account. The prompt
# blocks that window until the customer completes setup.
#
# Trade-off: basic_auth covers the whole router, including any API calls made from
# the dashboard's browser JS (VITE_API_HOSTNAME). If path-based Traefik routing is
# used in the compose file, the API path is protected too — external notification
# triggers (webhooks) go to the API, not the dashboard port. The customer disables
# the prompt once their account exists: /root/auth.sh off novu
ports:
  - port: 4000
    protocol: tcp
    public: true
    basic_auth: true
    description: Novu Dashboard Web UI

parameters:
  - name: JWT_SECRET
    display_name: JWT Secret
    type: password
    description: Secret used to sign and verify JWT tokens for API and WebSocket authentication.

  - name: STORE_ENCRYPTION_KEY
    display_name: Store Encryption Key
    type: password
    description: 32-character key used to encrypt notification provider credentials at rest.

  - name: NOVU_SECRET_KEY
    display_name: Novu Secret Key
    type: password
    description: Internal secret key used for Novu service-to-service authentication.

  - name: MONGO_INITDB_ROOT_PASSWORD
    display_name: MongoDB Root Password
    type: password
    description: Root password for the MongoDB database that stores notifications and subscriber data.
