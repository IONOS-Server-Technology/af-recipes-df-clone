id: microbin
enabled: false
display_name: MicroBin
description: Lightweight self-hosted pastebin, file sharer, and URL shortener written in Rust.
short_description:
  en: "Share text snippets, files, and shortened URLs instantly — no account required, with optional end-to-end encryption."
  de: "Textschnipsel, Dateien und verkürzte URLs sofort teilen — kein Konto erforderlich, mit optionaler Ende-zu-Ende-Verschlüsselung."
  es: "Comparte fragmentos de texto, archivos y URLs acortadas al instante — sin cuenta, con cifrado de extremo a extremo opcional."
  fr: "Partagez des extraits de texte, des fichiers et des URLs raccourcies instantanément — sans compte, avec chiffrement de bout en bout optionnel."
  it: "Condividi frammenti di testo, file e URL abbreviate all'istante — senza account, con crittografia end-to-end opzionale."
  nl: "Deel tekstfragmenten, bestanden en verkorte URL's direct — geen account nodig, met optionele end-to-end versleuteling."
  pl: "Udostępniaj fragmenty tekstu, pliki i skrócone linki natychmiast — bez konta, z opcjonalnym szyfrowaniem end-to-end."
categories:
  - productivity
  - developer-tools
app_version: "2.1.4"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/szabodanika/microbin
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/microbin/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/microbin.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 1a4b800bc2d54c37cd586b0acf972ab795c9cb6723495758d8361189d0121af8

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 8080
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: MicroBin Web UI
