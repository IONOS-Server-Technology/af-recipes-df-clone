id: siyuan
enabled: false
display_name: SiYuan
description: Privacy-first personal knowledge management with block-based editing, backlinks, and full offline support.
short_description:
  en: "Build a private knowledge base with block-based notes, backlinks, and bi-directional linking — fully offline, no cloud required."
  de: "Erstelle eine private Wissensdatenbank mit blockbasierten Notizen, Backlinks und bidirektionalen Verknüpfungen — vollständig offline."
  es: "Crea una base de conocimiento privada con notas en bloques, backlinks y enlaces bidireccionales — completamente sin conexión."
  fr: "Créez une base de connaissances privée avec des notes en blocs, des backlinks et des liens bidirectionnels — entièrement hors ligne."
  it: "Crea una base di conoscenza privata con note a blocchi, backlink e collegamenti bidirezionali — completamente offline."
  nl: "Bouw een privé kennisbank met op blokken gebaseerde notities, backlinks en bidirectionele koppelingen — volledig offline."
  pl: "Zbuduj prywatną bazę wiedzy z blokowymi notatkami, backlinkami i dwukierunkowym linkowaniem — w pełni offline."
categories:
  - productivity
app_version: "3.7.3"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/siyuan-note/siyuan
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/siyuan/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/siyuan-note/siyuan/master/app/stage/icon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: dc16e0f4fb8ba285f6ac281ea4a772504be245dd11480c7dac45f4483aed8e06

app_min_ram_mb: 512
app_min_disk_mb: 5120

# basic_auth: SiYuan's native auth (SIYUAN_ACCESS_AUTH_CODE) does a plaintext string
# comparison in the kernel — generated_from cannot project a hash into it. Instead the
# kernel runs with SIYUAN_ACCESS_AUTH_CODE_BYPASS=true (lock screen disabled, every
# request granted admin role) and the whole subdomain is protected by Traefik basic auth
# using the customer's server password — the same pattern as Stirling PDF and draw.io.
ports:
  - port: 6806
    protocol: tcp
    public: true
    basic_auth: true
    description: SiYuan Web UI
