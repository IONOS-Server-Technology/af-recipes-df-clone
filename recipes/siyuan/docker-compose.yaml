services:
  siyuan:
    image: b3log/siyuan:v3.7.3
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - SIYUAN_ACCESS_AUTH_CODE_BYPASS=true
    ports:
      - "6806:6806"
    volumes:
      - /opt/siyuan/workspace:/siyuan/workspace
    networks:
      - siyuan-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6806/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  siyuan-network:
    driver: bridge
