services:
  yuvomi:
    image: ghcr.io/ulsklyc/yuvomi:v1.87.0
    restart: unless-stopped
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY}
    ports:
      - "3000:3000"
    volumes:
      - /opt/yuvomi/data:/app/data
    networks:
      - yuvomi-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  yuvomi-network:
    driver: bridge
