id: freecad
enabled: false
display_name: FreeCAD
description: Browser-accessible parametric 3D CAD modeler for engineering and design.
short_description:
  en: "Run FreeCAD in your browser — a full parametric 3D CAD workstation, accessible from anywhere with no local install needed."
  de: "FreeCAD im Browser nutzen — eine vollständige parametrische 3D-CAD-Workstation, überall erreichbar ohne lokale Installation."
  es: "Ejecuta FreeCAD en tu navegador — una completa estación de trabajo CAD 3D paramétrica, accesible desde cualquier lugar sin instalación local."
  fr: "Utilisez FreeCAD dans votre navigateur — un poste de travail CAO 3D paramétrique complet, accessible partout sans installation locale."
  it: "Esegui FreeCAD nel browser — una completa workstation CAD 3D parametrica, accessibile da qualsiasi luogo senza installazione locale."
  nl: "Gebruik FreeCAD in je browser — een volledige parametrische 3D CAD-werkstation, overal toegankelijk zonder lokale installatie."
  pl: "Uruchom FreeCAD w przeglądarce — pełna parametryczna stacja robocza 3D CAD, dostępna z dowolnego miejsca bez lokalnej instalacji."
categories:
  - productivity
  - utilities
app_version: "1.1.3"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://www.freecad.org/
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/freecad/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/FreeCAD/FreeCAD/main/src/Gui/Icons/freecad.svg
logo_license: trademark-nominative-fair-use
logo_sha256: ffe5d51f04bc510998f8ed4fd22a15c5937e92d32da8f607f779dceb1f22a41c

app_min_ram_mb: 2048
app_min_disk_mb: 10240

ports:
  - port: 3000
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: FreeCAD Web UI (KasmVNC desktop, routed via Traefik on 80/443)
