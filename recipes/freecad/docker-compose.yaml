services:
  freecad:
    image: lscr.io/linuxserver/freecad:1.1.3
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    ports:
      - "3000:3000"
    volumes:
      - /opt/freecad/config:/config
    networks:
      - freecad-network
    healthcheck:
      # KasmVNC web interface on port 3000; a 200 means the desktop session is up.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  freecad-network:
    driver: bridge
