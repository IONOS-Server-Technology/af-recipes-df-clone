services:
  kavita:
    image: jvmilazz0/kavita:0.9.0.2
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - /opt/kavita/data:/kavita/data
    networks:
      - kavita-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  kavita-network:
    driver: bridge
