id: kavita
enabled: false
display_name: Kavita
description: Self-hosted digital library for comics, manga, and ebooks.
short_description:
  en: "Read your comics, manga, and ebook collection from any device with a self-hosted digital library and companion mobile app."
  de: "Comics, Manga und E-Books aus der eigenen Bibliothek auf jedem Gerät lesen – selbst gehostet, mit mobiler Begleit-App."
  es: "Lee tu colección de cómics, manga y libros electrónicos desde cualquier dispositivo con una biblioteca digital autoalojada."
  fr: "Lisez vos comics, mangas et ebooks depuis n'importe quel appareil grâce à une bibliothèque numérique auto-hébergée."
  it: "Leggi la tua collezione di fumetti, manga ed ebook da qualsiasi dispositivo con una libreria digitale self-hosted."
  nl: "Lees je comics, manga en e-books op elk apparaat vanuit een zelf gehoste digitale bibliotheek met mobiele app."
  pl: "Czytaj swoje komiksy, mangę i e-booki na dowolnym urządzeniu dzięki samodzielnie hostowanej bibliotece cyfrowej."
categories:
  - media
app_version: "0.9.0.2"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/Kareadita/Kavita
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/kavita/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/Kareadita/Kavita/develop/UI/Web/src/assets/images/logo.svg
logo_license: trademark-nominative-fair-use
logo_sha256: a8ede41701d66b0c1f2556a10a156b391457a09c1b0910878eb1ad914da09cba

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
