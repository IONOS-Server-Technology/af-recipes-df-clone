services:
  expensave:
    image: algirdasc/expensave:v1.0.10
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql://expensave:${DATABASE_PASSWORD}@mariadb:3306/expensave
    ports:
      - "18000:18000"
    volumes:
      - /opt/expensave/data:/var/www/html/var
    networks:
      - expensave-network
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=expensave
      - MYSQL_USER=expensave
      - MYSQL_PASSWORD=${DATABASE_PASSWORD}
    volumes:
      - /opt/expensave/mariadb:/var/lib/mysql
    networks:
      - expensave-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  expensave-network:
    driver: bridge
