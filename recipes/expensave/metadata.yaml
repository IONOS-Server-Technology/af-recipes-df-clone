id: expensave
enabled: false
display_name: Expensave
description: Self-hosted personal and family expense tracker with a self-service registration flow.
short_description:
  en: "Track personal and family expenses on your own server — full data ownership with no subscription fees."
  de: "Persönliche und Familienausgaben auf dem eigenen Server verwalten — volle Datenkontrolle, keine Abonnementgebühren."
  es: "Registra gastos personales y familiares en tu propio servidor — control total de los datos, sin cuotas de suscripción."
  fr: "Suivez vos dépenses personnelles et familiales sur votre propre serveur — données sous votre contrôle, sans abonnement."
  it: "Traccia le spese personali e familiari sul tuo server — controllo totale dei dati, senza abbonamento."
  nl: "Beheer persoonlijke en gezinsuitgaven op je eigen server — volledige controle over je data, geen abonnementskosten."
  pl: "Śledź wydatki osobiste i rodzinne na własnym serwerze — pełna kontrola danych bez opłat abonamentowych."
categories:
  - finance
  - productivity
app_version: "v1.0.10"
