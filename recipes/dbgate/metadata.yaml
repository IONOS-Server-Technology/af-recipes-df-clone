id: dbgate
enabled: false
display_name: DbGate
description: Cross-platform SQL and NoSQL database administration tool with a visual query designer.
short_description:
  en: "Browse, query, and manage MySQL, PostgreSQL, MongoDB, SQLite, and more from a single browser-based interface."
  de: "MySQL, PostgreSQL, MongoDB, SQLite und mehr über eine einzige browserbasierte Oberfläche verwalten und abfragen."
  es: "Navega, consulta y gestiona MySQL, PostgreSQL, MongoDB, SQLite y más desde una sola interfaz web."
  fr: "Parcourez, interrogez et gérez MySQL, PostgreSQL, MongoDB, SQLite et d'autres bases de données depuis une interface web unique."
  it: "Sfoglia, interroga e gestisci MySQL, PostgreSQL, MongoDB, SQLite e altro da un'unica interfaccia browser."
  nl: "Blader, queryeer en beheer MySQL, PostgreSQL, MongoDB, SQLite en meer vanuit één browserinterface."
  pl: "Przeglądaj, odpytuj i zarządzaj MySQL, PostgreSQL, MongoDB, SQLite i innymi bazami z jednego interfejsu przeglądarkowego."
categories:
  - developer-tools
app_version: "7.2.4"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/dbgate/dbgate
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/dbgate/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/dbgate/dbgate/master/misc/icon.png
logo_license: trademark-nominative-fair-use
logo_sha256: 7d143c7ad5103f8c9714453e6c2f74e70712a144899a86621282ee0bcc0ad99e

app_min_ram_mb: 512
app_min_disk_mb: 2048

ports:
  - port: 3000
    protocol: tcp
    public: true
    basic_auth: true
    description: DbGate Web UI
