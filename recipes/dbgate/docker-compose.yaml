services:
  dbgate:
    image: dbgate/dbgate:7.2.4
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /opt/dbgate/data:/root/.dbgate
    networks:
      - dbgate-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  dbgate-network:
    driver: bridge
