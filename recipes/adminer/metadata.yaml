id: adminer
enabled: false
display_name: Adminer
description: Full-featured database management interface supporting MySQL, PostgreSQL, SQLite, and more.
short_description:
  en: "Manage any database visually through a lightweight web interface — supports MySQL, PostgreSQL, SQLite, and 8+ more systems."
  de: "Datenbanken visuell verwalten über ein schlankes Web-Interface – unterstützt MySQL, PostgreSQL, SQLite und mehr."
  es: "Administra cualquier base de datos visualmente mediante una interfaz web ligera — compatible con MySQL, PostgreSQL, SQLite y más."
  fr: "Gérez n'importe quelle base de données visuellement via une interface web légère — MySQL, PostgreSQL, SQLite et plus."
  it: "Gestisci qualsiasi database visualmente tramite un'interfaccia web leggera — MySQL, PostgreSQL, SQLite e altri."
  nl: "Beheer elke database visueel via een lichtgewicht webinterface — ondersteunt MySQL, PostgreSQL, SQLite en meer."
  pl: "Zarządzaj dowolną bazą danych wizualnie przez lekki interfejs webowy — MySQL, PostgreSQL, SQLite i inne."
categories:
  - developer-tools
app_version: "5.5.1"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://www.adminer.org/
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/adminer/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/adminer.svg
logo_license: trademark-nominative-fair-use
logo_sha256: b06fb7806cefefd53fb44ce69aeb99fdf090017ea1e3dc064ae09604ad5761c8

app_min_ram_mb: 256
app_min_disk_mb: 2048

# Adminer has no built-in login of its own — its "login" screen is a per-connection
# DB credential form the user fills in at each visit. basic_auth: true gates the
# unauthenticated page behind the customer's server password (traefik_basic_auth
# mechanism from installability.secrets_expressible_today).
ports:
  - port: 8080
    protocol: tcp
    public: true
    basic_auth: true
    description: Adminer Web UI
