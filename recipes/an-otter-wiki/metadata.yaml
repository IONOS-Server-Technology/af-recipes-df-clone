id: an-otter-wiki
enabled: false
display_name: An Otter Wiki
description: Lightweight self-hosted wiki with Git-backed pages and Markdown editing.
short_description:
  en: "A lightweight self-hosted wiki with Markdown editing and Git-backed page history — single container, no database required."
  de: "Ein leichtgewichtiges selbstgehostetes Wiki mit Markdown-Bearbeitung und Git-gesichertem Seitenverlauf — ein Container, keine Datenbank."
  es: "Una wiki autoalojada ligera con edición en Markdown e historial de páginas respaldado por Git — un solo contenedor, sin base de datos."
  fr: "Un wiki auto-hébergé léger avec édition Markdown et historique des pages sauvegardé par Git — un seul conteneur, sans base de données."
  it: "Un wiki leggero self-hosted con editing Markdown e cronologia delle pagine basata su Git — un singolo container, nessun database richiesto."
  nl: "Een lichtgewicht zelf-gehoste wiki met Markdown-bewerking en Git-backed paginageschiedenis — één container, geen database vereist."
  pl: "Lekka, samodzielnie hostowana wiki z edycją Markdown i historią stron opartą na Git — jeden kontener, bez bazy danych."
categories:
  - productivity
  - developer-tools
app_version: "2"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://otterwiki.com/
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/an-otter-wiki/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/an-otter-wiki.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 1cd46c65a8c442cfc31fc9a8e0d11ab0d39844c96044c7a073d656458645dd43

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 80
    protocol: tcp
    public: true
    basic_auth: true
    description: An Otter Wiki Web UI
