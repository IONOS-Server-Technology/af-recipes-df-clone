services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.22.0
    restart: unless-stopped
    environment:
      - BASE_URL=https://${AF_APP_DOMAIN}
      - ALLOW_SIGNUP=false
    ports:
      - "9000:9000"
    volumes:
      - /opt/mealie/data:/app/data
    networks:
      - mealie-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/api/app/about || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  mealie-network:
    driver: bridge
