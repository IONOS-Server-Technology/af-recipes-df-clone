id: metamcp
enabled: false
display_name: MetaMCP
description: MCP aggregator and gateway — manage all your MCP servers in one place.
short_description:
  en: "Aggregate all your MCP servers into one gateway — give Claude, Cursor, and other AI clients a single managed endpoint instead of wiring each one separately."
  de: "Alle MCP-Server in einem Gateway bündeln — Claude, Cursor und andere KI-Clients mit einem einzigen verwalteten Endpunkt verbinden."
  es: "Agrega todos tus servidores MCP en una pasarela — da a Claude, Cursor y otros clientes de IA un único punto de acceso gestionado."
  fr: "Centralisez vos serveurs MCP dans une passerelle — offrez à Claude, Cursor et autres clients IA un point d'accès unique et géré."
  it: "Aggrega tutti i tuoi server MCP in un gateway — dai a Claude, Cursor e altri client AI un unico endpoint gestito."
  nl: "Bundel al je MCP-servers in één gateway — geef Claude, Cursor en andere AI-clients één centraal beheerd eindpunt."
  pl: "Agreguj wszystkie serwery MCP w jednej bramce — udostępnij Claude, Cursor i innym klientom AI jeden zarządzany punkt końcowy."
categories:
  - ai
  - developer-tools
app_version: "v2.4.22"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/metatool-ai/metamcp
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/metamcp/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/metatool-ai/metamcp/ai-dev/docs/favicon.png
logo_license: trademark-nominative-fair-use
logo_sha256: 01536429e552c0d252c1bcd4afd458e33ad25af35e7f5c66c9a679acd7b670ad

app_min_ram_mb: 2048
app_min_disk_mb: 20480

# basic_auth (IF-1312): MetaMCP's in-app signup form is open by default
# (BOOTSTRAP_DISABLE_REGISTRATION_UI is false), meaning anyone reaching the URL before
# the customer registers could self-register as a regular user. The prompt closes that
# window. Once the customer has created their own account, they can turn it off:
#     /root/auth.sh off metamcp
ports:
  - port: 12008
    protocol: tcp
    public: true
    basic_auth: true
    description: MetaMCP Web UI

parameters:
  - name: POSTGRES_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password for MetaMCP.

  - name: BETTER_AUTH_SECRET
    display_name: Auth Secret
    type: password
    description: Secret key used by Better Auth to sign sessions and tokens.

  - name: BOOTSTRAP_USER_PASSWORD
    display_name: Bootstrap User Password
    type: password
    description: >
      Password for the auto-created bootstrap account. The customer's real access path is
      MetaMCP's in-app signup form; this account is a server-generated placeholder they
      never need to use directly.
