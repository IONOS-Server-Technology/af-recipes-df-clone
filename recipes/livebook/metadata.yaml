id: livebook
enabled: false
display_name: Livebook
description: Interactive Elixir notebooks for data science, machine learning, and real-time collaboration.
short_description:
  en: "Write and run Elixir code in interactive notebooks with real-time collaboration, Smart cells, and machine learning support."
  de: "Schreibe und führe Elixir-Code in interaktiven Notebooks aus — mit Echtzeit-Zusammenarbeit, Smart Cells und ML-Unterstützung."
  es: "Escribe y ejecuta código Elixir en notebooks interactivos con colaboración en tiempo real, Smart cells y soporte de aprendizaje automático."
  fr: "Rédigez et exécutez du code Elixir dans des notebooks interactifs avec collaboration en temps réel, Smart cells et support ML."
  it: "Scrivi ed esegui codice Elixir in notebook interattivi con collaborazione in tempo reale, Smart cells e supporto per il machine learning."
  nl: "Schrijf en voer Elixir-code uit in interactieve notebooks met realtime samenwerking, Smart cells en ondersteuning voor machine learning."
  pl: "Pisz i uruchamiaj kod Elixir w interaktywnych notebookach z współpracą w czasie rzeczywistym, Smart cells i obsługą uczenia maszynowego."
categories:
  - developer-tools
  - ai
app_version: "0.19.9"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://livebook.dev
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/livebook/0.2.0/logo.svg
logo_source: https://livebook.dev/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: b75455d49fccb1189e45e72bcf853b23d8bd26a265dab34e4c28295d068c3876

app_min_ram_mb: 256
app_min_disk_mb: 2048

# Livebook's built-in auth (token or LIVEBOOK_PASSWORD) is disabled at compose
# time so that Traefik's basic_auth is the sole gate — the same pattern as
# Adminer. The apps-gaps analysis lists BASIC_AUTH_CREDENTIAL via the
# traefik_basic_auth mechanism, which maps to basic_auth: true here rather than
# to a parameters[] entry; no generated_from hash is needed.
# The 8081 iframe port is only required for plain-HTTP deployments; behind
# HTTPS/Traefik, Livebook iframes load from livebookusercontent.com so no
# second port needs routing.
ports:
  - port: 8080
    protocol: tcp
    public: true
    basic_auth: true
    description: Livebook Web UI
