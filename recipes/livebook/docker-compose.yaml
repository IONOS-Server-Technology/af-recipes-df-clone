services:
  livebook:
    image: ghcr.io/livebook-dev/livebook:0.19.9
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Disable Livebook's built-in token auth; access is gated by the
      # Traefik basic-auth middleware declared in metadata.yaml (basic_auth: true).
      - LIVEBOOK_TOKEN_ENABLED=false
      - LIVEBOOK_DATA_PATH=/data
    volumes:
      - /opt/livebook/data:/data
    networks:
      - livebook-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  livebook-network:
    driver: bridge
