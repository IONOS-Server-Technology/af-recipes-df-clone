id: adventurelog
enabled: false
display_name: AdventureLog
description: Self-hosted travel tracker and trip planner with interactive maps.
short_description:
  en: "Track your travels, plan trips, and build an interactive map of everywhere you've been — entirely on your own server."
  de: "Reisen verfolgen, Trips planen und eine interaktive Karte aller besuchten Orte aufbauen — vollständig auf dem eigenen Server."
  es: "Registra tus viajes, planifica escapadas y crea un mapa interactivo de todos los lugares visitados — en tu propio servidor."
  fr: "Suivez vos voyages, planifiez des séjours et construisez une carte interactive de vos destinations — entièrement sur votre serveur."
  it: "Tieni traccia dei tuoi viaggi, pianifica avventure e crea una mappa interattiva dei luoghi visitati — sul tuo server."
  nl: "Leg je reizen vast, plan trips en bouw een interactieve kaart van alle bezochte plekken — volledig op je eigen server."
  pl: "Śledź swoje podróże, planuj wyprawy i twórz interaktywną mapę odwiedzonych miejsc — na własnym serwerze."
categories:
  - productivity
  - media
app_version: "v0.12.1"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/seanmorley15/AdventureLog
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/adventurelog/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/seanmorley15/AdventureLog/main/brand/adventurelog.svg
logo_license: trademark-nominative-fair-use
logo_sha256: e3a8195536dc63683eecc4ba95c7ceadc4ecb42357e67814f2c85df6d28a1a1e

app_min_ram_mb: 2048
app_min_disk_mb: 20480

ports:
  - port: 80
    protocol: tcp
    public: true
    description: AdventureLog Web UI

parameters:
  - name: DJANGO_ADMIN_PASSWORD
    display_name: Admin Password
    type: password
    generated_from: "argon2:ROOT_PASSWORD"
    description: Initial Django admin password, derived from the server root password at first boot.
