id: rustdesk
enabled: false
display_name: RustDesk
description: Open-source remote desktop relay and rendezvous server for self-hosted NAT-traversing remote access.
short_description:
  en: "Self-host the relay and rendezvous server behind RustDesk — enables your clients to reach any device behind NAT without exposing RDP or VNC ports."
  de: "Relay- und Rendezvous-Server für RustDesk selbst hosten — Clients erreichen Geräte hinter NAT, ohne RDP- oder VNC-Ports freizugeben."
  es: "Hospeda tu propio servidor relay y rendezvous de RustDesk — los clientes alcanzan dispositivos tras NAT sin exponer puertos RDP o VNC."
  fr: "Hébergez le serveur relay et rendezvous de RustDesk — vos clients atteignent n'importe quel appareil derrière NAT sans exposer de ports RDP ou VNC."
  it: "Ospita il server relay e rendezvous di RustDesk — i client raggiungono dispositivi dietro NAT senza esporre porte RDP o VNC."
  nl: "Host de relay- en rendezvousserver van RustDesk zelf — clients bereiken apparaten achter NAT zonder RDP- of VNC-poorten bloot te stellen."
  pl: "Hostuj własny serwer relay i rendezvous RustDesk — klienci docierają do urządzeń za NAT bez otwierania portów RDP ani VNC."
categories:
  - networking
  - infrastructure
app_version: "1.1.16"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/rustdesk/rustdesk-server
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/rustdesk/0.2.0/logo.svg
logo_source: https://rustdesk.com/docs/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 12a4b26d7d46c836ef340c3b87c83b93e21fd5f5c08050c868df2d1700332fce

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 21115
    protocol: tcp
    public: true
    http: false
    description: hbbs NAT type test
  - port: 21116
    protocol: tcp
    public: true
    http: false
    description: hbbs registration and relay (TCP)
  - port: 21116
    protocol: udp
    public: true
    http: false
    description: hbbs UDP hole-punching
  - port: 21117
    protocol: tcp
    public: true
    http: false
    description: hbbr relay
