id: invoiceshelf
enabled: false
display_name: InvoiceShelf
description: Open-source invoicing and expense-tracking platform for small businesses.
short_description:
  en: "Create invoices, estimates, and expense reports — and let clients pay online with a self-hosted billing platform."
  de: "Rechnungen, Angebote und Ausgaben selbst hosten — und Kunden direkt über eine eigene Abrechnungsplattform online bezahlen lassen."
  es: "Crea facturas, presupuestos e informes de gastos — y permite a tus clientes pagar online con una plataforma de facturación autoalojada."
  fr: "Créez des factures, devis et notes de frais — et permettez à vos clients de payer en ligne avec une plateforme de facturation auto-hébergée."
  it: "Crea fatture, preventivi e note spese — e consenti ai clienti di pagare online con una piattaforma di fatturazione self-hosted."
  nl: "Maak facturen, offertes en onkostenoverzichten — en laat klanten online betalen met een zelf-gehoste facturatieplatform."
  pl: "Twórz faktury, wyceny i raporty wydatków — i pozwól klientom płacić online z własnoręcznie hostowaną platformą fakturowania."
categories:
  - finance
app_version: "2.4.2"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/InvoiceShelf/InvoiceShelf
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/invoiceshelf/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/InvoiceShelf/InvoiceShelf/3.x/resources/static/img/logo-mark.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 355900f6017b8f72bf39345d9c65f5478ac8c5a4762d469d188d7f6cb018f775

app_min_ram_mb: 512
app_min_disk_mb: 5120

# basic_auth protects the first-run setup wizard (same pattern as n8n).
# InvoiceShelf has no admin credential at boot — whoever reaches the setup
# URL first claims the owner account. Putting the platform's login page in
# front closes that window; the customer completes the wizard self-service
# and then owns their own credentials. Once the account exists, the customer
# can drop the prompt with `/root/auth.sh off invoiceshelf`.
ports:
  - port: 8090
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: InvoiceShelf Web UI
