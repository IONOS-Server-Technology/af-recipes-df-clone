id: gramps-web
enabled: false
display_name: Gramps Web
description: Self-hosted genealogy platform for building and sharing family trees.
short_description:
  en: "Build and share your family tree privately — Gramps Web is a collaborative genealogy platform that runs entirely on your own server."
  de: "Stammbaum privat aufbauen und teilen — Gramps Web ist eine kollaborative Genealogie-Plattform, die vollständig auf dem eigenen Server läuft."
  es: "Construye y comparte tu árbol genealógico de forma privada — Gramps Web es una plataforma colaborativa de genealogía que funciona completamente en tu servidor."
  fr: "Construisez et partagez votre arbre généalogique en privé — Gramps Web est une plateforme de généalogie collaborative sur votre propre serveur."
  it: "Costruisci e condividi il tuo albero genealogico in privato — Gramps Web è una piattaforma collaborativa di genealogia che gira interamente sul tuo server."
  nl: "Bouw en deel je stamboom privé — Gramps Web is een collaboratief genealogieplatform dat volledig op je eigen server draait."
  pl: "Buduj i udostępniaj swoje drzewo genealogiczne prywatnie — Gramps Web to współpracująca platforma genealogiczna działająca w całości na twoim serwerze."
categories:
  - productivity
app_version: "26.7.1"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/gramps-project/gramps-web
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/gramps-web/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/gramps-web.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 80560711ba1414e2d2823771ee716564260ebda3c7c1f2b588098e007ecfc228

app_min_ram_mb: 2048
app_min_disk_mb: 20480


# basic_auth: closes the first-boot owner-takeover race — a fresh Gramps Web instance
# has no pre-provisioned admin credential; it shows a public sign-up form to whoever
# reaches the URL first. Behind this prompt the form is unreachable until the customer
# has set up their own Gramps Web account through the gate. The customer disables it
# once their account exists with '/root/auth.sh off gramps-web'.
#
# What it costs: every request to the grampsweb origin goes through the prompt,
# including any API calls from the companion Gramps desktop app. The customer turns
# the prompt off once they have created their own admin account.
ports:
  - port: 5000
    protocol: tcp
    public: true
    basic_auth: true
    description: Gramps Web UI
