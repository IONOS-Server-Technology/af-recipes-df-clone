services:
  grampsweb:
    image: ghcr.io/gramps-project/grampsweb:26.7.1
    restart: unless-stopped
    environment:
      - GRAMPSWEB_TREE=Gramps Web
      - GRAMPSWEB_CELERY_CONFIG__broker_url=redis://grampsweb-redis:6379/0
      - GRAMPSWEB_CELERY_CONFIG__result_backend=redis://grampsweb-redis:6379/0
      - GRAMPSWEB_RATELIMIT_STORAGE_URI=redis://grampsweb-redis:6379/1
    ports:
      - "5000:5000"
    volumes:
      - /opt/gramps-web/users:/app/users
      - /opt/gramps-web/index:/app/indexdir
      - /opt/gramps-web/thumbnails:/app/thumbnail_cache
      - /opt/gramps-web/cache:/app/cache
      - /opt/gramps-web/secret:/app/secret
      - /opt/gramps-web/grampsdb:/root/.gramps/grampsdb
      - /opt/gramps-web/media:/app/media
      - /opt/gramps-web/tmp:/tmp
    networks:
      - gramps-web-network
    depends_on:
      grampsweb-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  grampsweb-celery:
    image: ghcr.io/gramps-project/grampsweb:26.7.1
    restart: unless-stopped
    command: celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=2
    environment:
      - GRAMPSWEB_TREE=Gramps Web
      - GRAMPSWEB_CELERY_CONFIG__broker_url=redis://grampsweb-redis:6379/0
      - GRAMPSWEB_CELERY_CONFIG__result_backend=redis://grampsweb-redis:6379/0
      - GRAMPSWEB_RATELIMIT_STORAGE_URI=redis://grampsweb-redis:6379/1
    volumes:
      - /opt/gramps-web/users:/app/users
      - /opt/gramps-web/index:/app/indexdir
      - /opt/gramps-web/thumbnails:/app/thumbnail_cache
      - /opt/gramps-web/cache:/app/cache
      - /opt/gramps-web/secret:/app/secret
      - /opt/gramps-web/grampsdb:/root/.gramps/grampsdb
      - /opt/gramps-web/media:/app/media
      - /opt/gramps-web/tmp:/tmp
    networks:
      - gramps-web-network
    depends_on:
      grampsweb-redis:
        condition: service_healthy
      grampsweb:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A gramps_webapi.celery inspect ping --timeout 10 2>&1 | grep -q pong || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s

  grampsweb-redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    labels:
      - "wud.watch=false"
    volumes:
      - /opt/gramps-web/valkey:/data
    networks:
      - gramps-web-network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  gramps-web-network:
    driver: bridge
