id: karaoke-eternal
enabled: false
display_name: Karaoke Eternal
description: Self-hosted karaoke party platform where guests queue songs via mobile browser.
short_description:
  en: "Host karaoke nights where guests browse and queue songs from their phones while you control a fullscreen player."
  de: "Karaoke-Abende veranstalten, bei denen Gäste per Smartphone Songs durchsuchen und in die Warteschlange stellen."
  es: "Organiza noches de karaoke donde los invitados buscan y ponen canciones en cola desde sus teléfonos."
  fr: "Organisez des soirées karaoké où les invités parcourent et ajoutent des chansons depuis leur téléphone."
  it: "Organizza serate karaoke dove gli ospiti cercano e accodano brani dal loro smartphone."
  nl: "Organiseer karaokeavonden waarbij gasten nummers zoeken en in de wachtrij zetten via hun telefoon."
  pl: "Organizuj wieczory karaoke, na których goście przeglądają i kolejkują utwory ze swoich telefonów."
categories:
  - media
app_version: "2.0.2"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/bhj/KaraokeEternal
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/karaoke-eternal/0.2.0/logo.svg
logo_source: https://www.karaoke-eternal.com/images/logo_mic.png
logo_license: trademark-nominative-fair-use
logo_sha256: 7f872dfe5ee3403d6d40e2825563c55353e38bd347a8f20beeaf4df28ab4f833

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 8080
    protocol: tcp
    public: true
    description: Karaoke Eternal Web UI (guest queue + fullscreen player)
