services:
  karaoke-eternal:
    image: radrootllc/karaoke-eternal:2.0.2
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /opt/karaoke-eternal/data:/data
    networks:
      - karaoke-eternal-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  karaoke-eternal-network:
    driver: bridge
