id: zipline
enabled: false
display_name: Zipline
description: ShareX-compatible file and image upload server with a modern dashboard and URL shortener.
short_description:
  en: "Upload files, images, and screenshots from ShareX or any tool, then share them instantly from your own server."
  de: "Dateien, Bilder und Screenshots mit ShareX oder anderen Tools hochladen und sofort vom eigenen Server teilen."
  es: "Sube archivos, imágenes y capturas con ShareX u otras herramientas y compártelos desde tu propio servidor."
  fr: "Téléversez fichiers, images et captures ShareX depuis n'importe quel outil et partagez-les depuis votre serveur."
  it: "Carica file, immagini e screenshot con ShareX o altri strumenti e condividili dal tuo server."
  nl: "Upload bestanden, afbeeldingen en screenshots via ShareX of andere tools en deel ze direct vanaf je server."
  pl: "Przesyłaj pliki, obrazy i zrzuty ekranu przez ShareX lub inne narzędzia i udostępniaj je ze swojego serwera."
categories:
  - media
app_version: "4.6.5"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/diced/zipline
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/zipline/0.2.0/logo.svg
logo_source: https://zipline.diced.sh/favicons/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 46339f1503bae4006ce3874a734b811e84488862f29bae2d8e27faea830d01ee

app_min_ram_mb: 2048
app_min_disk_mb: 20480

ports:
  - port: 3000
    protocol: tcp
    public: true
    description: Zipline Web UI

parameters:
  - name: CORE_SECRET
    display_name: Core Secret
    type: password
    description: Secret key used to sign cookies and sessions.

  - name: POSTGRES_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password.
