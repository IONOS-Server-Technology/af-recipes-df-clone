services:
  ersatztv:
    image: ghcr.io/ersatztv/legacy:26.7.1
    restart: unless-stopped
    ports:
      - "8409:8409"
    volumes:
      - /opt/ersatztv/data:/root/.local/share/ersatztv
    networks:
      - ersatztv-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8409/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  ersatztv-network:
    driver: bridge
