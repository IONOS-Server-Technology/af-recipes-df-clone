id: ollama
enabled: false
display_name: Ollama
description: Tool to run large language models (LLMs) locally on your hardware.
short_description:
  en: "Run powerful AI language models locally on your server — private, offline, and fully under your control."
  de: "Leistungsstarke KI-Sprachmodelle lokal auf dem Server betreiben — privat, offline, vollständig selbst kontrolliert."
  es: "Ejecuta potentes modelos de lenguaje IA localmente en tu servidor — privado, sin conexión y bajo tu control."
  fr: "Exécutez de puissants modèles de langage IA localement sur votre serveur — privé, hors ligne et sous votre contrôle."
  it: "Esegui potenti modelli linguistici AI localmente sul tuo server — privato, offline e sotto il tuo pieno controllo."
  nl: "Voer krachtige AI-taalmodellen lokaal uit op je server — privé, offline en volledig onder jouw controle."
  pl: "Uruchamiaj zaawansowane modele językowe AI lokalnie na serwerze — prywatnie, offline i pod pełną kontrolą."
categories:
  - ai
app_version: "0.7.1"
recipe_version: "1.0.0"
recipe_type: docker-compose
upstream_url: https://github.com/ollama/ollama

app_min_ram_mb: 8192
app_min_disk_mb: 51200

supported_os:
  - ubuntu-26.04

ports:
  - port: 11434
    protocol: tcp
    public: true
    description: Ollama API

parameters:
  - name: APP_DOMAIN
    display_name: Domain
    type: domain
    required: true
    description: Domain name for accessing the Ollama API (e.g., ollama.example.com).

  - name: OLLAMA_DEFAULT_MODEL
    display_name: Default Model
    type: string
    required: false
    default: "llama3.2"
    description: Model to pull on first start (e.g., llama3.2, mistral, gemma2).


notes: >
  Ollama performs significantly better with GPU acceleration. On CPU-only VPS
  instances, inference will be slow. Recommended for BMC (bare-metal cloud)
  servers with GPU passthrough. CPU-only deployments are functional but should
  be limited to small models (≤3B parameters).

incompatible_with_apps: []

