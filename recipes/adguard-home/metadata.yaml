name: adguard-home
display_name: AdGuard Home
description: Network-wide DNS ad-blocker, accessible exclusively via WireGuard VPN. Requires wg-easy to be installed and running first.
categories:
  - security
app_version: "v0.107.63"
recipe_version: "2.0.0"
recipe_type: docker-compose
upstream_url: https://github.com/AdguardTeam/AdGuardHome

app_min_ram_mb: 256
app_min_disk_mb: 2048

supported_os:
  - ubuntu-26.04

ports:
  - port: 80
    protocol: tcp
    public: false
    description: AdGuard Home Web UI (accessible via VPN at http://WG_INTERFACE_IP/admin/)
  - port: 53
    protocol: tcp
    public: false
    description: DNS (TCP) — WireGuard interface only
  - port: 53
    protocol: udp
    public: false
    description: DNS (UDP) — WireGuard interface only

parameters:
  - name: WG_INTERFACE_IP
    display_name: WireGuard Interface IP
    type: string
    required: false
    default: "10.8.0.1"
    description: IP address of the WireGuard server interface (wg0). Default matches wg-easy defaults.

notes: |
  Recommended: install together with wg-easy so DNS is only accessible via VPN.

incompatible_with_apps:
  - pihole
