services:
  autobrr:
    image: ghcr.io/autobrr/autobrr:v1.83.0
    restart: unless-stopped
    ports:
      - "7474:7474"
    volumes:
      - /opt/autobrr/data:/config
    networks:
      - autobrr-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7474/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  autobrr-network:
    driver: bridge
