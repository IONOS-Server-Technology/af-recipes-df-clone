id: wbo
enabled: false
display_name: WBO
description: Real-time collaborative whiteboard for team brainstorming and remote meetings.
short_description:
  en: "Draw and brainstorm together in real time on an infinite shared whiteboard."
  de: "Gemeinsam in Echtzeit auf einer unendlichen, geteilten Whiteboard-Fläche zeichnen und brainstormen."
  es: "Dibuja y genera ideas juntos en tiempo real en una pizarra compartida infinita."
  fr: "Dessinez et brainstormez ensemble en temps réel sur un tableau blanc partagé et infini."
  it: "Disegna e fai brainstorming insieme in tempo reale su una lavagna condivisa infinita."
  nl: "Teken en brainstorm samen in realtime op een oneindig gedeeld whiteboard."
  pl: "Rysuj i burz mózgi razem w czasie rzeczywistym na nieskończonej, wspólnej tablicy."
categories:
  - productivity
app_version: "v2.17.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/lovasoa/whitebophir
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/wbo/0.2.0/logo.svg
logo_source: https://wbo.ophir.dev/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: c2bdada1220844e50a94deec7a211fbe4c99cca162f107090c3f155920f64805

app_min_ram_mb: 256
app_min_disk_mb: 2048

# WBO has no built-in login of its own — any board URL is open to anyone who has the
# link. basic_auth: true places a Traefik prompt in front of the whole app so it does
# not sit open on the internet. The trade-off (inbound URLs get 401 until auth.sh off
# is run) is acceptable here because WBO has no inbound webhook or OAuth callback flow.
ports:
  - port: 80
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: WBO Web UI
