services:
  wbo:
    image: lovasoa/wbo:v2.17.0
    restart: unless-stopped
    environment:
      - WBO_SERVER_PORT=80
    ports:
      - "80:80"
    volumes:
      - /opt/wbo/data:/opt/app/server-data
    networks:
      - wbo-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  wbo-network:
    driver: bridge
