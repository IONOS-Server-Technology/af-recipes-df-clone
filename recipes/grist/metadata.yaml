id: grist
enabled: false
display_name: Grist
description: Open-source spreadsheet-database hybrid for building data applications without code.
short_description:
  en: "Build structured data apps and internal tools with a spreadsheet-meets-database interface — no coding required."
  de: "Strukturierte Datenanwendungen und interne Tools mit einer Tabellenkalkulationsschnittstelle aufbauen — ohne Programmierung."
  es: "Crea aplicaciones de datos estructurados y herramientas internas con una interfaz de hoja de cálculo y base de datos, sin programar."
  fr: "Créez des applications de données et outils internes avec une interface tableur-base de données — sans écrire de code."
  it: "Crea applicazioni dati strutturate e strumenti interni con un'interfaccia foglio-calcolo/database — senza programmare."
  nl: "Bouw gestructureerde data-apps en interne tools met een spreadsheet-database interface — geen code nodig."
  pl: "Buduj aplikacje danych i narzędzia wewnętrzne z interfejsem arkusz-baza danych — bez programowania."
categories:
  - productivity
  - developer-tools
app_version: "1.7.17"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/gristlabs/grist-core
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/grist/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/grist.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 70a148a689063e9fc2a1f1741f8ff0bd055655414aa9da472f02991037f1b26b

app_min_ram_mb: 512
app_min_disk_mb: 2048

# basic_auth (Traefik gate pattern): Grist is configured with
# GRIST_IN_SERVICE=true (skips the boot-key wizard) and
# GRIST_DEFAULT_EMAIL (single-user mode, no interactive login). The app has
# no login boundary of its own in this configuration, so Traefik basic auth
# protects the entire frontend — the customer's server password is the only
# credential. This is the same pattern as SearXNG, An Otter Wiki, and Grav.
ports:
  - port: 8484
    protocol: tcp
    public: true
    basic_auth: true
    description: Grist Web UI
