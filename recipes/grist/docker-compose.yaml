services:
  grist:
    image: gristlabs/grist:1.7.17
    restart: unless-stopped
    environment:
      - GRIST_IN_SERVICE=true
      - GRIST_DEFAULT_EMAIL=admin@localhost
    ports:
      - "8484:8484"
    volumes:
      - /opt/grist/data:/persist
    networks:
      - grist-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8484/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  grist-network:
    driver: bridge
