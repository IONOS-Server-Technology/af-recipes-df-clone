id: romm
enabled: false
display_name: RomM
description: Self-hosted ROM manager for scanning, browsing, and playing retro games in the browser.
short_description:
  en: "Scan, browse, and play your retro ROM library in the browser — metadata, artwork, and in-browser emulation all in one place."
  de: "Retro-ROM-Bibliothek im Browser durchsuchen und spielen — Metadaten, Artwork und Emulation an einem Ort."
  es: "Explora y juega tu biblioteca ROM retro en el navegador — metadatos, imágenes y emulación integrada en un solo lugar."
  fr: "Parcourez et jouez votre bibliothèque ROM rétro dans le navigateur — métadonnées, visuels et émulation intégrés au même endroit."
  it: "Sfoglia e gioca la tua libreria ROM retro nel browser — metadati, immagini e emulazione integrata in un unico posto."
  nl: "Blader door je retro ROM-bibliotheek en speel in de browser — metadata, artwork en ingebouwde emulatie op één plek."
  pl: "Przeglądaj i graj w swoją retro bibliotekę ROM w przeglądarce — metadane, grafika i emulacja w jednym miejscu."
categories:
  - gaming
  - media
app_version: "5.1.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/rommapp/romm
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/romm/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/rommapp/romm/master/frontend/public/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 0782145f36c90f0be6d21a7dd4bcc01911a2823507b05910512cf9394a23b897

app_min_ram_mb: 2048
app_min_disk_mb: 20480

ports:
  - port: 8080
    protocol: tcp
    public: true
    description: RomM Web UI

parameters:
  - name: ROMM_AUTH_SECRET_KEY
    display_name: Auth Secret Key
    type: password
    description: Secret key used for JWT token signing and session security.

  - name: DB_PASSWD
    display_name: Database Password
    type: password
    description: MariaDB password for the RomM application user.

  - name: MARIADB_ROOT_PASSWORD
    display_name: MariaDB Root Password
    type: password
    description: MariaDB root user password.
