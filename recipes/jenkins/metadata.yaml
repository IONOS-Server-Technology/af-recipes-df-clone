id: jenkins
enabled: false
display_name: Jenkins
description: Open-source automation server for building, testing, and deploying software.
short_description:
  en: "Run your own CI/CD pipelines with the world's most widely adopted open-source automation server."
  de: "Eigene CI/CD-Pipelines betreiben mit dem weltweit meistgenutzten Open-Source-Automation-Server."
  es: "Ejecuta tus propias pipelines de CI/CD con el servidor de automatización de código abierto más utilizado del mundo."
  fr: "Exécutez vos propres pipelines CI/CD avec le serveur d'automatisation open source le plus utilisé au monde."
  it: "Esegui le tue pipeline CI/CD con il server di automazione open source più diffuso al mondo."
  nl: "Draai je eigen CI/CD-pipelines met de meestgebruikte open-source automatiseringsserver ter wereld."
  pl: "Uruchom własne pipeline'y CI/CD z najpopularniejszym serwerem automatyzacji open source na świecie."
categories:
  - developer-tools
  - automation
app_version: "2.568.2-lts"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/jenkinsci/jenkins
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/jenkins/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/jenkinsci/jenkins/master/war/src/main/webapp/images/svgs/logo.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 7d672e6d48fe9494831714e77aa038dbc660e85c2e8926b278742b9549734c63

app_min_ram_mb: 512
app_min_disk_mb: 10240

ports:
  - port: 8080
    protocol: tcp
    public: true
    description: Jenkins Web UI

parameters:
  - name: JENKINS_ADMIN_PASSWORD
    display_name: Admin Password
    type: password
    generated_from: "bcrypt:ROOT_PASSWORD"
    description: Password for the initial Jenkins admin account. Derived from your server password — log in as 'admin' with that password.
