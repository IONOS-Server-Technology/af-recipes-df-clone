services:
  jenkins:
    image: jenkins/jenkins:2.568.2-lts
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - /opt/jenkins/data:/var/jenkins_home
    networks:
      - jenkins-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  jenkins-network:
    driver: bridge
