id: actual-budget
enabled: false
display_name: Actual Budget
description: Privacy-focused, self-hosted personal finance app with envelope budgeting.
short_description:
  en: "Track your finances and budget with envelope-style budgeting, kept entirely on your own server."
categories:
  - productivity
app_version: "26.8.0"
recipe_version: "0.2.1"
recipe_type: docker-compose
upstream_url: https://github.com/actualbudget/actual
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/actual-budget/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/actual-budget.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 24cd347961c6bb5c435dfd0477f8db5fee59bb6290bf7dd11ed50c2df361b478

app_min_ram_mb: 256
app_min_disk_mb: 4096


# Actual Budget ships no credentials at first boot — whoever reaches the URL first
# completes the server-password setup wizard and becomes admin. basic_auth: true gates
# the frontend through Traefik HTTP basic auth (server root password) so only an
# authorized user can run the wizard. Once Actual Budget is configured:
# /root/auth.sh off actual-budget
ports:
  - port: 5006
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: Actual Budget Web UI
