name: claude-code
display_name: Claude Code
description: Agentic AI tool for terminal-based coding and automated command execution.
short_description:
  en: "AI coding assistant that reads, writes, and executes code directly in your terminal — powered by Anthropic's Claude."
  de: "KI-Coding-Assistent, der Code direkt im Terminal liest, schreibt und ausführt — betrieben von Claude von Anthropic."
  es: "Asistente de programación con IA que lee, escribe y ejecuta código en tu terminal — impulsado por Claude de Anthropic."
  fr: "Assistant de codage IA qui lit, écrit et exécute du code dans votre terminal — propulsé par Claude d'Anthropic."
  it: "Assistente di coding con IA che legge, scrive ed esegue codice nel terminale — basato su Claude di Anthropic."
  nl: "AI-programmeerassistent die code leest, schrijft en uitvoert in je terminal — aangedreven door Claude van Anthropic."
  pl: "Asystent programowania AI czytający, piszący i wykonujący kod w terminalu — oparty na Claude od Anthropic."
categories:
  - developer-tools
  - ai
app_version: "1.0.0"
recipe_version: "1.0.0"
recipe_type: native
upstream_url: https://github.com/anthropics/claude-code

app_min_ram_mb: 2048
app_min_disk_mb: 10240

supported_os:
  - ubuntu-26.04

ports: []

parameters:
  - name: ANTHROPIC_API_KEY
    display_name: Anthropic API Key
    type: string
    required: false
    description: API key for Claude models. Can also be configured interactively after install via browser login.


incompatible_with_apps: []
