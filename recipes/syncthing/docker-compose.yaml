services:
  syncthing:
    image: syncthing/syncthing:1.29.6
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
    volumes:
      - /opt/syncthing/config:/var/syncthing/config
      - /opt/syncthing/data:/var/syncthing/data
    networks:
      - syncthing-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8384/rest/noauth/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  syncthing-network:
    driver: bridge
