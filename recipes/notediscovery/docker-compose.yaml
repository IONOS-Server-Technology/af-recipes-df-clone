services:
  notediscovery:
    image: ghcr.io/gamosoft/notediscovery:v0.30.1
    restart: unless-stopped
    environment:
      - TZ=UTC
      - AUTHENTICATION_ENABLED=false
    ports:
      - "8000:8000"
    volumes:
      - /opt/notediscovery/data:/app/data
    networks:
      - notediscovery-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  notediscovery-network:
    driver: bridge
