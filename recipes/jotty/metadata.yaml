id: jotty
enabled: false
display_name: Jotty
description: Lightweight note-taking and checklist app with Markdown editing and Kanban boards.
short_description:
  en: "Take notes, build checklists and manage Kanban boards in a self-hosted, file-based app — no database required."
  de: "Notizen anlegen, Checklisten erstellen und Kanban-Boards verwalten — selbst gehostet, dateibasiert, ohne Datenbank."
  es: "Toma notas, crea listas de tareas y gestiona tableros Kanban en una app autoalojada basada en archivos, sin base de datos."
  fr: "Prenez des notes, gérez des listes et des tableaux Kanban dans une application auto-hébergée sans base de données."
  it: "Prendi appunti, crea checklist e gestisci board Kanban in un'app self-hosted basata su file, senza database."
  nl: "Maak notities, checklists en Kanban-borden in een zelf gehoste, bestandsgebaseerde app — zonder database."
  pl: "Twórz notatki, listy kontrolne i tablice Kanban w aplikacji self-hosted opartej na plikach — bez bazy danych."
categories:
  - productivity
app_version: "1.25.1"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/fccview/jotty
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/jotty/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/fccview/jotty/main/public/app-icons/logos/favicon-variation.svg
logo_license: trademark-nominative-fair-use
logo_sha256: a073aa49507bb762e2a16fe85e1a0e144c68742d63fbb85280ce078db5787180

app_min_ram_mb: 256
app_min_disk_mb: 2048

# basic_auth closes the first-boot setup-takeover window: the first visitor to /auth/setup
# becomes the admin, so an unclaimed instance can be seized by anyone who reaches the URL
# before the customer completes setup. The same pattern is used for n8n (IF-1312).
# Jotty's own login is the long-term access control; the prompt is removed once the customer
# has created their account via /root/auth.sh off jotty.
ports:
  - port: 3000
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: Jotty Web UI
