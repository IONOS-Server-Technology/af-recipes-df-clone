id: memgraph
enabled: false
display_name: Memgraph
description: In-memory graph database with Memgraph Lab UI for real-time Cypher queries on connected data.
short_description:
  en: "In-memory graph database with Memgraph Lab UI — query connected data with Cypher for AI agent memory and real-time graph analytics."
  de: "In-Memory-Graphdatenbank mit Memgraph Lab UI — verbundene Daten mit Cypher für KI-Agentenspeicher und Echtzeit-Graphanalysen abfragen."
  es: "Base de datos de grafos en memoria con interfaz Memgraph Lab — consulta datos conectados con Cypher para IA y análisis de grafos."
  fr: "Base de données graphe en mémoire avec l'interface Memgraph Lab — interrogez des données connectées avec Cypher pour les agents IA et l'analyse de graphes."
  it: "Database a grafo in memoria con interfaccia Memgraph Lab — interroga dati connessi con Cypher per memoria di agenti IA e analisi di grafi in tempo reale."
  nl: "In-memory graafdatabase met Memgraph Lab UI — bevraag verbonden data met Cypher voor AI-agentgeheugen en real-time grafiekanalyse."
  pl: "Baza danych grafów w pamięci z interfejsem Memgraph Lab — zapytuj dane z Cypher dla pamięci agentów AI i analityki grafów."
categories:
  - developer-tools
  - ai
app_version: "3.12.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://memgraph.com/
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/memgraph/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/memgraph/design/master/src/assets/img/img-logo-mark.svg
logo_license: trademark-nominative-fair-use
logo_sha256: f275cf2402f54c082d1c11434f746e6a4bf9714102fc8dcd18ba4e3ed589888b

app_min_ram_mb: 1024
app_min_disk_mb: 5120

# Memgraph Lab (port 3000) has no built-in login screen; basic_auth: true gates it
# behind the customer's server password via Traefik (traefik_basic_auth mechanism).
# Memgraph's Bolt port (7687) is kept internal to the compose network only.
ports:
  - port: 3000
    protocol: tcp
    public: true
    basic_auth: true
    description: Memgraph Lab Web UI
