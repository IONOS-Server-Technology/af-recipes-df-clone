id: corteza
enabled: false
display_name: Corteza
description: Open-source low-code platform for building custom business apps and CRM.
short_description:
  en: "Build custom CRM and business apps without code — Corteza runs data models, workflows, and forms on your own server."
  de: "Eigene CRM- und Business-Apps ohne Code erstellen — Corteza betreibt Datenmodelle, Workflows und Formulare auf Ihrem Server."
  es: "Crea CRM y apps de negocio sin código — Corteza ejecuta modelos de datos, flujos de trabajo y formularios en tu servidor."
  fr: "Créez des apps CRM et métier sans code — Corteza gère données, workflows et formulaires sur votre serveur."
  it: "Crea app CRM e business senza codice — Corteza gestisce modelli di dati, workflow e form sul tuo server."
  nl: "Bouw eigen CRM- en bedrijfsapps zonder code — Corteza beheert datamodellen, workflows en formulieren op je server."
  pl: "Twórz własny CRM i aplikacje biznesowe bez kodu — Corteza zarządza modelami danych, przepływami i formularzami na Twoim serwerze."
categories:
  - productivity
app_version: "2024.9.9"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/cortezaproject/corteza
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/corteza/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/cortezaproject/corteza/2024.9.x/server/assets/src/icon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 552a78ff3fadb2cedeb9222574a8b20c707f7211c477b2e2afb782a2e2dc0ac1

app_min_ram_mb: 2048
app_min_disk_mb: 20480

ports:
  - port: 80
    protocol: tcp
    public: true
    description: Corteza Web UI

parameters:
  - name: POSTGRES_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password, generated at install time.

  - name: AUTH_JWT_SECRET
    display_name: JWT Signing Secret
    type: password
    description: Secret key used to sign authentication tokens, generated at install time.
