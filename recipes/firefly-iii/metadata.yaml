id: firefly-iii
enabled: false
display_name: Firefly III
description: Self-hosted personal finance manager with budgets, bills, accounts, and detailed reports.
short_description:
  en: "Track accounts, budgets, bills, and spending in a private finance manager that runs entirely on your own server."
  de: "Konten, Budgets, Rechnungen und Ausgaben im eigenen Finanzmanager verwalten — vollständig auf Ihrem Server."
  es: "Gestiona cuentas, presupuestos, facturas y gastos en un gestor de finanzas privado en tu propio servidor."
  fr: "Gérez comptes, budgets, factures et dépenses dans un gestionnaire de finances privé sur votre propre serveur."
  it: "Gestisci conti, budget, bollette e spese in un gestore finanziario privato interamente sul tuo server."
  nl: "Beheer rekeningen, budgetten, facturen en uitgaven in een privé-financiënbeheerder op je eigen server."
  pl: "Zarządzaj kontami, budżetami, rachunkami i wydatkami w prywatnym menedżerze finansów na własnym serwerze."
categories:
  - productivity
app_version: "6.6.6"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://www.firefly-iii.org/
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/firefly-iii/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/firefly-iii.svg
logo_license: trademark-nominative-fair-use
logo_sha256: d6e644dc1c0c02432b76ea68419628ef44284f00022818ca173b5c00ad89ebf6

app_min_ram_mb: 2048
app_min_disk_mb: 20480

ports:
  - port: 8080
    protocol: tcp
    public: true
    description: Firefly III Web UI

parameters:
  - name: APP_KEY
    display_name: Application Key
    type: password
    description: Laravel application encryption key generated by install.sh.
  - name: DB_PASSWORD
    display_name: Database Password
    type: password
    description: MariaDB database password generated by install.sh.
  - name: STATIC_CRON_TOKEN
    display_name: Cron Token
    type: password
    description: Token used to authenticate the scheduled cron job, generated by install.sh.
