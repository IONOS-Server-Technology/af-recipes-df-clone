services:
  firefly:
    image: fireflyiii/core:6.6.6
    restart: unless-stopped
    environment:
      - APP_KEY=${APP_KEY}
      - APP_URL=https://${AF_APP_DOMAIN}
      - APP_ENV=production
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=firefly
      - DB_USERNAME=firefly
      - DB_PASSWORD=${DB_PASSWORD}
      - STATIC_CRON_TOKEN=${STATIC_CRON_TOKEN}
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
      - LOG_CHANNEL=stack
      - TRUSTED_PROXIES=**
    ports:
      - "8080:8080"
    volumes:
      - /opt/firefly-iii/upload:/var/www/html/storage/upload
    networks:
      - firefly-network
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=firefly
      - MYSQL_USER=firefly
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - /opt/firefly-iii/mariadb:/var/lib/mysql
    networks:
      - firefly-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cron:
    image: alpine:3.20
    restart: unless-stopped
    command: >-
      sh -c "while true; do wget -qO- http://firefly:8080/api/v1/cron/${STATIC_CRON_TOKEN}; sleep 3600; done"
    networks:
      - firefly-network
    depends_on:
      firefly:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  firefly-network:
    driver: bridge
