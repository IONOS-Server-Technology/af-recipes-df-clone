id: paperless-ngx
enabled: false
display_name: Paperless-ngx
description: Document management system that transforms physical documents into a searchable archive.
short_description:
  en: "Scan, manage, and search all your documents digitally — turn paper piles into a structured, searchable archive."
  de: "Dokumente digitalisieren, verwalten und durchsuchen — Papierstapel in ein strukturiertes, durchsuchbares Archiv verwandeln."
  es: "Digitaliza, gestiona y busca todos tus documentos — convierte pilas de papel en un archivo estructurado y buscable."
  fr: "Numérisez, gérez et recherchez tous vos documents — transformez des piles de papier en archive structurée et consultable."
  it: "Digitalizza, gestisci e cerca tutti i tuoi documenti — trasforma pile di carta in un archivio strutturato e consultabile."
  nl: "Scan, beheer en doorzoek al je documenten digitaal — verander papierbergen in een gestructureerd, doorzoekbaar archief."
  pl: "Digitalizuj, zarządzaj i przeszukuj wszystkie dokumenty — zamień stosy papieru w ustrukturyzowane, przeszukiwalne archiwum."
categories:
  - productivity
app_version: "2.14.7"
recipe_version: "1.1.0"
recipe_type: docker-compose
upstream_url: https://github.com/paperless-ngx/paperless-ngx

app_min_ram_mb: 2048
app_min_disk_mb: 20480


ports:
  - port: 8000
    protocol: tcp
    public: true
    description: Paperless-ngx Web UI

parameters:
  - name: APP_DOMAIN
    display_name: Domain
    type: domain
    description: Domain for accessing Paperless-ngx (e.g., docs.example.com).
  - name: ADMIN_USER
    display_name: Admin Username
    type: string
    description: Initial admin username.
  - name: ADMIN_PASSWORD
    display_name: Admin Password
    type: password
    description: Initial admin password.
  - name: DB_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL password.
  - name: SECRET_KEY
    display_name: Secret Key
    type: password
    description: Django secret key.
  - name: REDIS_PASSWORD
    display_name: Redis Password
    type: password
    description: Redis password.


# Logo (rendered in app catalogue thumbnails)
