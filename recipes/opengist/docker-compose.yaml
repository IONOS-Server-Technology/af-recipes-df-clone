services:
  opengist:
    image: ghcr.io/thomiceli/opengist:1.8.4
    restart: unless-stopped
    environment:
      - OG_SECRET_KEY=${SECRET_KEY}
      - OG_EXTERNAL_URL=https://${APP_DOMAIN}
      - OG_SSH_LISTEN_HOST=0.0.0.0
      - OG_SSH_PORT=2223
      - OG_HTTP_HOST=0.0.0.0
      - OG_HTTP_PORT=6157
    ports:
      - "6157:6157"
      - "2223:22"
    volumes:
      - /opt/opengist/data:/opengist
    networks:
      - opengist-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6157/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  opengist-network:
    driver: bridge
