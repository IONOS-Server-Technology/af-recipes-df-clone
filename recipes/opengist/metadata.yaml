id: opengist
enabled: false
display_name: OpenGist
description: Self-hosted pastebin and Gist service powered by Git.
short_description:
  en: "Share code snippets and text files with syntax highlighting — your self-hosted alternative to GitHub Gist."
  de: "Code-Snippets und Textdateien mit Syntax-Highlighting teilen — die selbstgehostete Alternative zu GitHub Gist."
  es: "Comparte fragmentos de código y archivos de texto con resaltado de sintaxis — tu alternativa autoalojada a GitHub Gist."
  fr: "Partagez des extraits de code et fichiers texte avec coloration syntaxique — votre alternative auto-hébergée à GitHub Gist."
  it: "Condividi snippet di codice e file di testo con evidenziazione della sintassi — alternativa self-hosted a GitHub Gist."
  nl: "Deel codefragmenten en tekstbestanden met syntaxismarkering — jouw zelf gehoste alternatief voor GitHub Gist."
  pl: "Udostępniaj fragmenty kodu i pliki tekstowe z podświetlaniem składni — samodzielnie hostowana alternatywa dla GitHub Gist."
categories:
  - developer-tools
app_version: "1.8.4"
recipe_version: "1.0.0"
recipe_type: docker-compose
upstream_url: https://github.com/nicholaswilde/opengist

app_min_ram_mb: 256
app_min_disk_mb: 5120

supported_os:
  - ubuntu-26.04

ports:
  - port: 6157
    protocol: tcp
    public: true
    description: OpenGist Web UI
  - port: 2223
    protocol: tcp
    public: true
    description: OpenGist SSH (Git clone)

parameters:
  - name: APP_DOMAIN
    display_name: Domain
    type: domain
    required: true
    description: Domain for accessing OpenGist (e.g., gist.example.com).
  - name: SECRET_KEY
    display_name: Secret Key
    type: password
    required: false
    auto_generate: true
    description: Secret key for session security (auto-generated if not provided).

incompatible_with_apps:
  - gitea

# Logo (rendered in app catalogue thumbnails)
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/opengist/1.0.0/logo.svg
logo_sha256: 85b89b9c7aaf50871040ce1d6dec0b0c7a2155b90b9a967b7b5de3adae5b0c7d
logo_license: trademark-nominative-fair-use
logo_source: https://github.com/thomiceli/opengist/blob/master/public/img/opengist.svg
