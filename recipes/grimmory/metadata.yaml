id: grimmory
enabled: false
display_name: Grimmory
description: Self-hosted book collection manager with built-in reader and device sync.
short_description:
  en: "Manage your ebook, comic, and audiobook library with a built-in reader and Kobo/KOReader/OPDS sync."
  de: "E-Book-, Comic- und Hörbuchbibliothek mit eingebautem Reader und Kobo/KOReader/OPDS-Sync verwalten."
  es: "Administra tu biblioteca de ebooks, cómics y audiolibros con lector integrado y sincronización Kobo/KOReader/OPDS."
  fr: "Gérez votre bibliothèque d'ebooks, BD et audiolivres avec lecteur intégré et synchronisation Kobo/KOReader/OPDS."
  it: "Gestisci la tua libreria di ebook, fumetti e audiolibri con lettore integrato e sincronizzazione Kobo/KOReader/OPDS."
  nl: "Beheer je ebook-, strip- en luisterboekbibliotheek met ingebouwde lezer en Kobo/KOReader/OPDS-synchronisatie."
  pl: "Zarządzaj biblioteką ebook, komiksów i audiobooków z wbudowanym czytnikiem i synchronizacją Kobo/KOReader/OPDS."
categories:
  - media
app_version: "v3.2.4"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/grimmory-tools/grimmory
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/grimmory/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/grimmory.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 9c06d00a63a25ad9c6af19705291305b53ea0fe9e85143eb432787a58ac66052

app_min_ram_mb: 2048
app_min_disk_mb: 20480

# basic_auth gates the first-boot setup wizard. Grimmory boots straight into a public
# setup page with no admin-credential env var — whoever loads the URL first claims the
# owner account. Behind the prompt only the customer can reach that wizard.
#
# Trade-off: basic_auth covers the entire Traefik router, so any inbound OPDS or API
# call also receives a 401 until the customer disables it with `/root/auth.sh off grimmory`
# once their admin account is created.
ports:
  - port: 6060
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: Grimmory Web UI

parameters:
  - name: DB_PASSWORD
    display_name: Database Password
    type: password
    description: MariaDB password for the grimmory database user. Generated by install.sh.

  - name: MARIADB_ROOT_PASSWORD
    display_name: MariaDB Root Password
    type: password
    description: Root password for the MariaDB instance. Generated by install.sh.
