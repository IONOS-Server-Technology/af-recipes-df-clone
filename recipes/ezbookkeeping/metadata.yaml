id: ezbookkeeping
enabled: false
display_name: ezBookKeeping
description: Lightweight personal finance tracker with mobile PWA and receipt scanning.
short_description:
  en: "Track your personal finances, scan receipts, and manage your budget — all on your own server."
  de: "Verfolge deine Finanzen, scanne Belege und behalte dein Budget im Blick — auf deinem eigenen Server."
  es: "Controla tus finanzas personales, escanea recibos y gestiona tu presupuesto en tu propio servidor."
  fr: "Suivez vos finances personnelles, numérisez vos reçus et gérez votre budget sur votre propre serveur."
  it: "Tieni traccia delle tue finanze, scansiona le ricevute e gestisci il budget sul tuo server."
  nl: "Volg je persoonlijke financiën, scan bonnetjes en beheer je budget op je eigen server."
  pl: "Śledź swoje finanse, skanuj paragony i zarządzaj budżetem na własnym serwerze."
categories:
  - finance
app_version: "latest-snapshot"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/mayswind/ezbookkeeping
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/ezbookkeeping/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/png/ezbookkeeping.png
logo_license: trademark-nominative-fair-use
logo_sha256: e5e69b94773a6c6414d63f5d6749d2682cbfae344434c965d94adde756f5b2d5

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 8080
    protocol: tcp
    public: true
    description: Web UI
