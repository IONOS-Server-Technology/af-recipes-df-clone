services:
  ezbookkeeping:
    image: mayswind/ezbookkeeping:latest-snapshot
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /opt/ezbookkeeping/data:/ezbookkeeping/data
    networks:
      - ezbookkeeping-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080 > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  ezbookkeeping-network:
    driver: bridge
