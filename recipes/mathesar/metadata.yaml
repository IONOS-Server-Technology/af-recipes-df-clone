id: mathesar
enabled: false
display_name: Mathesar
description: Spreadsheet-style web interface for exploring and editing PostgreSQL databases.
short_description:
  en: "Browse and edit your PostgreSQL data in a spreadsheet-style interface — no SQL required."
  de: "PostgreSQL-Daten in einer Tabellenoberfläche durchsuchen und bearbeiten — ganz ohne SQL-Kenntnisse."
  es: "Explora y edita tus datos de PostgreSQL con una interfaz de hoja de cálculo — sin necesidad de SQL."
  fr: "Parcourez et modifiez vos données PostgreSQL dans une interface tableur — sans connaissance du SQL."
  it: "Esplora e modifica i tuoi dati PostgreSQL con un'interfaccia a foglio di calcolo — senza conoscere SQL."
  nl: "Blader door en bewerk je PostgreSQL-data in een spreadsheet-interface — zonder SQL-kennis."
  pl: "Przeglądaj i edytuj dane PostgreSQL w arkuszowym interfejsie — bez znajomości SQL."
categories:
  - developer-tools
app_version: "0.12.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/mathesar-foundation/mathesar
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/mathesar/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/mathesar.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 86791afc978d08d4a3ddb791e34d14a1d4e6a9c773f7377568fa2adb64b22ed7

app_min_ram_mb: 2048
app_min_disk_mb: 20480


# basic_auth: closes the setup-takeover window — a fresh Mathesar presents an interactive
# setup wizard on first visit, so an unclaimed instance can be configured by whoever
# reaches the URL first. Same pattern accepted for immich. The customer turns the prompt
# off once their account exists: /root/auth.sh off mathesar
ports:
  - port: 8000
    protocol: tcp
    public: true
    basic_auth: true
    description: Mathesar Web UI
