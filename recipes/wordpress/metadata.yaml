id: wordpress
enabled: false
display_name: WordPress
description: The world's most popular open-source CMS for building websites and blogs.
short_description:
  en: "Build and publish any website or blog with the world's most popular open-source CMS — fully self-hosted."
  de: "Erstelle und veröffentliche jede Website oder Blog mit dem beliebtesten Open-Source-CMS der Welt — vollständig selbst gehostet."
  es: "Crea y publica cualquier sitio web o blog con el CMS de código abierto más popular del mundo — completamente auto-alojado."
  fr: "Créez et publiez n'importe quel site web ou blog avec le CMS open source le plus populaire au monde — entièrement auto-hébergé."
  it: "Crea e pubblica qualsiasi sito web o blog con il CMS open source più popolare al mondo — completamente self-hosted."
  nl: "Bouw en publiceer elke website of blog met het populairste open-source CMS ter wereld — volledig zelf gehost."
  pl: "Twórz i publikuj dowolną stronę lub blog z najpopularniejszym na świecie CMS-em open source — w pełni samodzielnie hostowanym."
categories:
  - productivity
app_version: "7.0.2-php8.3-apache"
recipe_version: "0.2.1"
recipe_type: docker-compose
upstream_url: https://wordpress.org/
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/wordpress/0.2.1/logo.svg
logo_source: https://raw.githubusercontent.com/WordPress/WordPress/master/wp-admin/images/wordpress-logo.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 43d32d64430f2fa259237ad738421aecb89609a6af01eb3a60cf8a3b93a78ecb

app_min_ram_mb: 512
app_min_disk_mb: 20480

# WordPress ships no credentials at first boot — whoever reaches the URL first
# completes the install wizard and becomes admin. basic_auth: true gates the
# frontend through Traefik HTTP basic auth (server root password) so only an
# authorized user can run the wizard. Once WordPress is configured:
# /root/auth.sh off wordpress
ports:
  - port: 80
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: WordPress Web UI
