services:
  usertour:
    image: usertour/usertour:0.9.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://usertour:${POSTGRES_PASSWORD}@db:5432/usertour?schema=usertour&sslmode=prefer
      - DATABASE_DIRECT_URL=postgresql://usertour:${POSTGRES_PASSWORD}@db:5432/usertour?schema=usertour&sslmode=prefer
      - Redis_HOST=redis
      - Redis_PORT=6379
      - Redis_PASS=${REDIS_PASSWORD}
      - Redis_TLS=false
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
      - APP_HOMEPAGE_URL=https://${AF_APP_DOMAIN}
    ports:
      - "8011:80"
    volumes:
      - /opt/usertour/data:/app/data
    networks:
      - usertour-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=usertour
      - POSTGRES_USER=usertour
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - /opt/usertour/db:/var/lib/postgresql/data
    networks:
      - usertour-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usertour -d usertour"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - /opt/usertour/redis:/data
    networks:
      - usertour-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  usertour-network:
    driver: bridge
