id: usertour
enabled: false
display_name: Usertour
description: Self-hosted platform for in-app product tours, onboarding checklists, and user surveys.
short_description:
  en: "Build and self-host in-app product tours, onboarding checklists, and user surveys without sending your data to a third-party SaaS."
  de: "In-App-Produkttouren, Onboarding-Checklisten und Nutzerbefragungen selbst hosten – ohne Daten an einen Drittanbieter zu senden."
  es: "Crea y aloja tus propios recorridos de producto, checklists de incorporación y encuestas de usuarios sin depender de un SaaS externo."
  fr: "Hébergez vous-même des visites guidées in-app, des checklists d'intégration et des sondages utilisateur sans envoyer vos données à un tiers."
  it: "Ospita tour di prodotto in-app, checklist di onboarding e sondaggi utente senza inviare dati a terze parti."
  nl: "Bouw en host zelf in-app productrondleidingen, onboarding-checklists en gebruikersonderzoeken zonder data naar een externe SaaS te sturen."
  pl: "Twórz i hostuj samodzielnie interaktywne przewodniki po produkcie, listy kontrolne wdrożeń i ankiety użytkowników bez zewnętrznego SaaS."
categories:
  - productivity
  - developer-tools
app_version: "0.9.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/usertour/usertour
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/usertour/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/usertour.svg
logo_license: trademark-nominative-fair-use
logo_sha256: de5999c325bff838436d56423ef34b52d5877a922fc08d07332152858251e601

app_min_ram_mb: 2048
app_min_disk_mb: 20480

ports:
  - port: 8011
    protocol: tcp
    public: true
    description: Usertour Web UI

parameters:
  - name: JWT_SECRET
    display_name: JWT Secret
    type: password
    description: Secret key used to sign and verify authentication tokens.

  - name: POSTGRES_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password.

  - name: REDIS_PASSWORD
    display_name: Redis Password
    type: password
    description: Redis cache password.
