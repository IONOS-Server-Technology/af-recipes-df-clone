id: anytype-server
enabled: false
curated: false
display_name: AnyType Server
description: Self-hosted sync server for AnyType — a privacy-focused note-taking and knowledge management app.
short_description:
  en: "Sync your AnyType notes, tasks, and knowledge base privately across all your devices — no third-party cloud required."
  de: "AnyType-Notizen, Aufgaben und Wissen privat auf allen Geräten synchronisieren — ohne Drittanbieter-Cloud."
  es: "Sincroniza notas, tareas y base de conocimiento de AnyType en todos tus dispositivos — sin nube de terceros."
  fr: "Synchronisez vos notes, tâches et base de connaissances AnyType sur tous vos appareils — sans cloud tiers."
  it: "Sincronizza note, attività e base di conoscenza di AnyType su tutti i dispositivi — senza cloud di terzi."
  nl: "Synchroniseer je AnyType-notities, taken en kennisbank privé op al je apparaten — zonder cloudopslag van derden."
  pl: "Synchronizuj notatki, zadania i bazę wiedzy AnyType na wszystkich urządzeniach — bez chmury zewnętrznych dostawców."
categories:
  - productivity
app_version: "0.4.0"
recipe_version: "1.1.0"
recipe_type: docker-compose
upstream_url: https://github.com/anyproto/any-sync-dockercompose

app_min_ram_mb: 2048
app_min_disk_mb: 20480


ports:
  - port: 4830
    protocol: tcp
    public: true
    http: false
    description: any-sync-coordinator
  - port: 4730
    protocol: tcp
    public: true
    http: false
    description: any-sync-filenode
  - port: 4630
    protocol: tcp
    public: true
    http: false
    description: any-sync-node
  - port: 9000
    protocol: tcp
    public: false
    description: MinIO S3 API

parameters:
  - name: MONGO_PASSWORD
    display_name: MongoDB Password
    type: password
    description: MongoDB password.
  - name: MINIO_ACCESS_KEY
    display_name: MinIO Access Key
    type: password
    description: MinIO access key.
  - name: MINIO_SECRET_KEY
    display_name: MinIO Secret Key
    type: password
    description: MinIO secret key.


