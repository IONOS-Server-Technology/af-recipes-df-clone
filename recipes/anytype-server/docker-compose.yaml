services:
  any-sync-coordinator:
    image: ghcr.io/anyproto/any-sync-coordinator:v0.4.0
    restart: unless-stopped
    ports:
      - "4830:4830"
    volumes:
      - /opt/anytype-server/coordinator:/data
    networks:
      - anytype-network
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4830 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  any-sync-filenode:
    image: ghcr.io/anyproto/any-sync-filenode:v0.4.0
    restart: unless-stopped
    ports:
      - "4730:4730"
    volumes:
      - /opt/anytype-server/filenode:/data
    networks:
      - anytype-network
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4730 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  any-sync-node:
    image: ghcr.io/anyproto/any-sync-node:v0.4.0
    restart: unless-stopped
    ports:
      - "4630:4630"
    volumes:
      - /opt/anytype-server/node:/data
    networks:
      - anytype-network
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4630 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=anytype
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - /opt/anytype-server/mongo:/data/db
    networks:
      - anytype-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2025-01-20T22-14-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
    volumes:
      - /opt/anytype-server/minio:/data
    networks:
      - anytype-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  anytype-network:
    driver: bridge
