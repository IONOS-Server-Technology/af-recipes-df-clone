id: baserow
enabled: false
display_name: Baserow
description: Open-source no-code database and Airtable alternative for teams.
short_description:
  en: "Build and manage databases without code — a self-hosted Airtable alternative with views, forms, and a REST API."
  de: "Datenbanken ohne Code erstellen und verwalten — eine selbstgehostete Airtable-Alternative mit Views, Formularen und REST-API."
  es: "Crea y gestiona bases de datos sin código — una alternativa autoalojada a Airtable con vistas, formularios y API REST."
  fr: "Créez et gérez des bases de données sans code — une alternative à Airtable auto-hébergée avec vues, formulaires et API REST."
  it: "Crea e gestisci database senza codice — un'alternativa self-hosted ad Airtable con viste, moduli e API REST."
  nl: "Bouw en beheer databases zonder code — een zelf-gehoste Airtable-alternatief met views, formulieren en REST API."
  pl: "Twórz i zarządzaj bazami danych bez kodu — samodzielnie hostowana alternatywa dla Airtable z widokami, formularzami i API REST."
categories:
  - productivity
  - developer-tools
app_version: "2.3.3"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/baserow/baserow
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/baserow/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/baserow.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 09fbde72cc2cd5993a57b290b941a7b902f63407e72539a1582c0744427553c3

app_min_ram_mb: 2048
app_min_disk_mb: 20480


# basic_auth: a fresh Baserow instance presents an interactive signup screen
# and makes whoever signs up first the instance admin — the same setup-takeover
# window as n8n. Putting the platform's login prompt in front closes that window.
#
# Cost: while the prompt is active, any API calls (e.g. third-party integrations
# using Baserow's REST API) receive a 401. Once the admin account is created the
# customer turns it off:
#
#     /root/auth.sh off baserow
#
# The Baserow all-in-one image also supports pre-seeding an admin via
# BASEROW_ADMIN_EMAIL / BASEROW_ADMIN_PASSWORD env vars, but those are not in
# apps-gaps/baserow.yaml's secrets_expressible_today — the interactive-signup
# path is the designed intent for this recipe. If a later task adds those vars,
# basic_auth can be removed.
ports:
  - port: 80
    protocol: tcp
    public: true
    basic_auth: true
    description: Baserow Web UI

parameters:
  - name: SECRET_KEY
    display_name: Secret Key
    type: password
    description: Django secret key used for cryptographic signing. Server-generated at install time.

  - name: DATABASE_PASSWORD
    display_name: Database Password
    type: password
    description: Password for the embedded PostgreSQL instance. Server-generated at install time.

  - name: REDIS_PASSWORD
    display_name: Redis Password
    type: password
    description: Password for the embedded Redis instance. Server-generated at install time.
