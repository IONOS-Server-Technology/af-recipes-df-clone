id: gitea
enabled: false
display_name: Gitea
description: Lightweight self-hosted Git service with web interface.
short_description:
  en: "Host your own Git server with pull requests, issue tracking, and CI/CD — lightweight and fully self-hosted."
  de: "Eigenen Git-Server mit Pull Requests, Issue-Tracking und CI/CD betreiben — schlank und vollständig selbstgehostet."
  es: "Aloja tu propio servidor Git con pull requests, seguimiento de issues y CI/CD — ligero y completamente autoalojado."
  fr: "Hébergez votre propre serveur Git avec pull requests, suivi des issues et CI/CD — léger et entièrement auto-hébergé."
  it: "Ospita il tuo server Git con pull request, issue tracking e CI/CD — leggero e completamente self-hosted."
  nl: "Host je eigen Git-server met pull requests, issue-tracking en CI/CD — lichtgewicht en volledig zelf gehost."
  pl: "Hostuj własny serwer Git z pull requestami, śledzeniem zgłoszeń i CI/CD — lekki i w pełni samodzielnie hostowany."
categories:
  - developer-tools
app_version: "1.22.6"
recipe_version: "1.1.0"
recipe_type: docker-compose
upstream_url: https://github.com/go-gitea/gitea

app_min_ram_mb: 512
app_min_disk_mb: 20480


ports:
  - port: 3000
    protocol: tcp
    public: true
    description: Gitea Web UI
  - port: 2222
    protocol: tcp
    public: true
    http: false
    description: Gitea SSH

parameters:
  - name: POSTGRES_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL password.
  - name: GITEA_ADMIN_USER
    display_name: Admin Username
    type: string
    description: Initial admin username.
  - name: GITEA_ADMIN_EMAIL
    display_name: Admin Email
    type: email
    description: Email address for the admin account.
  - name: GITEA_ADMIN_PASSWORD
    display_name: Admin Password
    type: password
    description: Initial admin password.


# Logo (rendered in app catalogue thumbnails)
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/gitea/1.1.0/logo.svg
