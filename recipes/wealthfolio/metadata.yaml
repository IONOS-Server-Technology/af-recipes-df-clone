id: wealthfolio
enabled: false
display_name: Wealthfolio
description: Self-hosted personal finance and investment portfolio tracker.
short_description:
  en: "Track your investments, net worth, and portfolio performance with a self-hosted, privacy-first finance app."
  de: "Investitionen, Nettovermögen und Portfolio-Performance selbst gehostet und datenschutzfreundlich nachverfolgen."
  es: "Sigue tus inversiones, patrimonio neto y rendimiento de cartera con una app financiera autoalojada."
  fr: "Suivez vos investissements, votre patrimoine net et vos performances de portefeuille en auto-hébergement."
  it: "Monitora investimenti, patrimonio netto e rendimento del portafoglio con un'app finanziaria self-hosted."
  nl: "Volg je beleggingen, nettovermogen en portefeuilleprestaties met een zelfgehoste privacyvriendelijke financiële app."
  pl: "Śledź inwestycje, majątek netto i wyniki portfela z samodzielnie hostowaną aplikacją finansową."
categories:
  - productivity
app_version: "3.6.2"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/wealthfolio/wealthfolio
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/wealthfolio/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/wealthfolio.svg
logo_license: trademark-nominative-fair-use
logo_sha256: d84f8d92716ba5f85e68f3a75d7b89c5be2bd05cffa3396ef8f330f412628c08

app_min_ram_mb: 512
app_min_disk_mb: 2048

ports:
  - port: 8088
    protocol: tcp
    public: true
    description: Wealthfolio Web UI

parameters:
  # WF_AUTH_PASSWORD_HASH: Wealthfolio only accepts an Argon2id PHC string here —
  # no signup flow, no default admin. The generated_from projection (IF-1420) emits
  # exactly that format, so the customer logs in with their server password.
  - name: WF_AUTH_PASSWORD_HASH
    display_name: Admin Password Hash
    type: password
    generated_from: "argon2:ROOT_PASSWORD"
    description: Argon2id hash of the admin password. Derived from your server password — log in with that password.

  # WF_SECRET_KEY: patternless 32-byte random value for session signing; the customer
  # never sees or inputs this. install.sh generates it via `openssl rand -base64 32`.
  - name: WF_SECRET_KEY
    display_name: Secret Key
    type: password
    description: 32-byte random secret used for session signing. Generated by install.sh via openssl rand.
