services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: buzz
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /opt/buzz/postgres:/var/lib/postgresql/data
    networks:
      - buzz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz -d buzz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - /opt/buzz/redis:/data
    networks:
      - buzz-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BUZZ_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${BUZZ_S3_SECRET_KEY}
    volumes:
      - /opt/buzz/minio:/data
    networks:
      - buzz-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    # No restart: key at all - Compose's own default when omitted is "no"
    # (don't restart), same behavior as an explicit restart: "no". Omitting
    # it entirely sidesteps a confirmed AF /compose rendering bug: quoting
    # this value in the source file doesn't help, because AF's renderer
    # re-serializes the compose file through a YAML library that drops the
    # quotes again, and af-api's bootstrap-side validator then rejects the
    # unquoted "no" as a boolean where it expects a string.
    environment:
      MC_HOST_local: http://${BUZZ_S3_ACCESS_KEY}:${BUZZ_S3_SECRET_KEY}@minio:9000
    entrypoint: ["/bin/sh", "-c", "mc mb --ignore-existing local/buzz"]
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - buzz-network

  buzz:
    image: ghcr.io/block/buzz:main
    restart: unless-stopped
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      DATABASE_URL: postgres://buzz:${POSTGRES_PASSWORD}@postgres:5432/buzz
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: buzz
      BUZZ_GIT_REPO_PATH: /data/git
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_RELAY_PRIVATE_KEY: ${BUZZ_RELAY_PRIVATE_KEY}
      BUZZ_GIT_HOOK_HMAC_SECRET: ${BUZZ_GIT_HOOK_HMAC_SECRET}
      # RELAY_URL (no BUZZ_ prefix - crates/buzz-relay/src/config.rs) binds the
      # relay's "deployment community" to this host at first boot. Left unset
      # it defaults to ws://localhost:3000, so every request through Traefik
      # (Host: buzz.<AF_APP_DOMAIN>) resolves to no configured community and
      # the relay returns 404 - confirmed live: requests fail exactly this way
      # without this var, and succeed once it matches the real public host.
      RELAY_URL: wss://${AF_APP_DOMAIN}
      # BUZZ_SERVE_GIT_WEB_GUI defaults to false (crates/buzz-relay/src/config.rs).
      # Without it, a browser hitting "/" still gets the NIP-11 JSON relay info
      # document, not the web UI - confirmed live: the bundled index.html/assets
      # exist in the image regardless, but router.rs only serves them from "/"
      # when this is true. BUZZ_WEB_DIR itself is already baked into the image
      # as a default env var, so nothing else needs to be set for this to work.
      BUZZ_SERVE_GIT_WEB_GUI: "true"
      # Defaults (32 writers x 3 rounds = 96 total CAS races against MinIO on
      # every boot) hit a confirmed, still-open upstream bug on this specific
      # probe: block/buzz#2723 - the S3 client sets no request timeout, and a
      # single stalled MinIO connection under many concurrent writers hangs
      # the probe (and therefore the whole boot) forever, with no error and
      # no health-port ever binding. The fix PR (block/buzz#2724, a bounded
      # per-op timeout + overall deadline) is still open, unmerged. Lowering
      # width/rounds reduces how many concurrent connections can stall at
      # once - it does not eliminate the bug, just narrows the window - while
      # still genuinely exercising the CAS mechanism this probe exists to
      # verify, rather than disabling it via BUZZ_GIT_CONFORMANCE_PROBE=false.
      BUZZ_GIT_PROBE_WRITERS: "4"
      BUZZ_GIT_PROBE_ROUNDS: "1"
    ports:
      - "3000:3000"
    volumes:
      - /opt/buzz/git:/data/git
    networks:
      - buzz-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/_readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  buzz-network:
    driver: bridge
