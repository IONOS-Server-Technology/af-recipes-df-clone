id: buzz
enabled: false
display_name: Buzz
description: Self-hosted Nostr relay workspace where humans and AI agents collaborate in shared channels, threads, and workflows.
short_description:
  en: "Run your own private workspace where people and AI agents collaborate in shared channels over a self-hosted Nostr relay."
  de: "Eigener privater Arbeitsbereich, in dem Menschen und KI-Agenten gemeinsam in einem selbst gehosteten Nostr-Relay kommunizieren."
  es: "Aloja tu propio espacio de trabajo privado donde personas y agentes IA colaboran en canales compartidos mediante un relay Nostr autoalojado."
  fr: "Hébergez votre propre espace de travail privé où personnes et agents IA collaborent dans des canaux partagés via un relais Nostr auto-hébergé."
  it: "Gestisci il tuo spazio di lavoro privato dove persone e agenti IA collaborano in canali condivisi tramite un relay Nostr self-hosted."
  nl: "Beheer uw eigen privé-werkruimte waar mensen en AI-agenten samenwerken in gedeelde kanalen via een zelf gehoste Nostr-relay."
  pl: "Uruchom własną prywatną przestrzeń roboczą, w której ludzie i agenty AI współpracują w udostępnionych kanałach przez własny przekaźnik Nostr."
categories:
  - communication
  - ai
app_version: "main"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/block/buzz
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/buzz/0.2.0/logo.svg
logo_source: https://buzz.xyz/sites/buzz/icon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 6eca82ca260d9907e2e5952c6a3be742b434e7245f7f4d8c9796b79e0e2bb23d

app_min_ram_mb: 2048
app_min_disk_mb: 20480

# Port 3000 is the Buzz relay's HTTP server which handles WebSocket upgrades for Nostr
# clients (Buzz Desktop, any NIP-42-capable client). basic_auth is intentionally absent:
# Traefik's basic-auth middleware intercepts the HTTP Upgrade request before it is
# forwarded, which breaks all WebSocket connections and makes the relay non-functional.
#
# RELAY_OWNER_PUBKEY — open relay mode verified against upstream source:
#   crates/buzz-relay/src/config.rs reads the var as:
#     std::env::var("RELAY_OWNER_PUBKEY").ok()
#   .ok() converts a missing variable to None — no panic, no startup failure. Additionally,
#   deploy/compose/compose.yml applies no :? constraint to RELAY_OWNER_PUBKEY; only
#   POSTGRES_PASSWORD, REDIS_PASSWORD, BUZZ_S3_ACCESS_KEY, and BUZZ_S3_SECRET_KEY carry
#   that constraint. The README (deploy/compose/README.md) confirms it is required only
#   "when closed relay mode is enabled". Without it the relay boots, accepts connections
#   from any NIP-42-authenticated client, and applies no membership gate.
#
# Out-of-band product experience (known limitation, not a blocker): customers must
# install Buzz Desktop (a separate Tauri app) on their own machine and point it at this
# relay's WebSocket URL. This is structurally identical to WireGuard (client-side setup
# is out-of-band) or Matrix Synapse (requires a Matrix client the customer installs
# independently). The recipe deploys the server; client configuration is the customer's
# own step, not a missing provisioning action.
ports:
  - port: 3000
    protocol: tcp
    public: true
    http: true
    description: Buzz relay (WebSocket)

# All parameters below are internal secrets generated by install.sh.
# None of these are customer-facing — the customer never needs to know any of these
# values to use the relay (they authenticate via their own Nostr keypair in Buzz Desktop).
parameters:
  - name: POSTGRES_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL password — generated by install.sh; the customer does not need this value.

  - name: REDIS_PASSWORD
    display_name: Redis Password
    type: password
    description: Redis authentication password — generated by install.sh; the customer does not need this value.

  - name: BUZZ_S3_ACCESS_KEY
    display_name: MinIO Access Key
    type: password
    description: MinIO/S3 access key for media storage — generated by install.sh; the customer does not need this value.

  - name: BUZZ_S3_SECRET_KEY
    display_name: MinIO Secret Key
    type: password
    description: MinIO/S3 secret key for media storage — generated by install.sh; the customer does not need this value.

  - name: BUZZ_RELAY_PRIVATE_KEY
    display_name: Relay Private Key
    type: password
    description: Nostr private key (64-char hex) that identifies this relay — generated once by install.sh and must remain stable across restarts; the customer does not need this value.

  - name: BUZZ_GIT_HOOK_HMAC_SECRET
    display_name: Git Hook HMAC Secret
    type: password
    description: HMAC signing key for git webhook events — generated by install.sh; the customer does not need this value.
