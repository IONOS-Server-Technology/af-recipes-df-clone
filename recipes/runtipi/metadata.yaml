id: runtipi
enabled: false
display_name: Runtipi
description: Self-hosted app store and homeserver manager for easy application deployment.
short_description:
  en: "Deploy dozens of self-hosted apps with one click — your personal app store for your home server."
  de: "Dutzende selbstgehostete Apps mit einem Klick installieren — der persönliche App Store für den eigenen Server."
  es: "Despliega docenas de aplicaciones autoalojadas con un clic — tu tienda de apps personal para tu servidor doméstico."
  fr: "Déployez des dizaines d'applications auto-hébergées en un clic — votre app store personnel pour votre serveur."
  it: "Installa decine di app self-hosted con un clic — il tuo app store personale per il server di casa."
  nl: "Implementeer tientallen zelf-gehoste apps met één klik — jouw persoonlijke app-winkel voor je homeserver."
  pl: "Wdrażaj dziesiątki samodzielnie hostowanych aplikacji jednym kliknięciem — twój osobisty sklep z aplikacjami."
categories:
  - infrastructure
app_version: "3.7.0"
recipe_version: "1.1.0"
recipe_type: docker-compose
upstream_url: https://github.com/runtipi/runtipi
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/runtipi/1.1.0/logo.svg
logo_source: https://raw.githubusercontent.com/runtipi/runtipi/develop/packages/frontend/public/icons/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: d987a5f16eecc1db860b14cff0230636fb356c812cf3edf76cf081fc59d9aad0

app_min_ram_mb: 1024
app_min_disk_mb: 20480


ports:
  - port: 80
    protocol: tcp
    public: true
    description: Runtipi Web UI (HTTP)
  - port: 443
    protocol: tcp
    public: true
    description: Runtipi Web UI (HTTPS)

parameters:
  - name: JWT_SECRET
    display_name: JWT Secret
    type: password
    description: Secret for JWT token signing.
  - name: POSTGRES_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password.

