# basic_auth (traefik_basic_auth mechanism, per apps-gaps/fuxa.yaml):
# FUXA ships a fixed hardcoded default login (admin/123456) with no environment
# variable to override it at boot — the password can only be changed after the
# customer logs in with the default credential. The Traefik basic_auth gate closes
# the exposure window before the customer reaches the in-app login and changes the
# default. This same gate also incidentally mitigates the five unauthenticated-RCE
# advisories the project shipped before v1.3.1 (all patched in 1.3.3, but the
# defence-in-depth is worth keeping for an ICS-adjacent app).
# Trade-off: basic_auth gates the entire router, including HTTP calls from field
# devices that POST data to the FUXA REST/WebSocket API. If customers have devices
# pushing data directly to the FUXA endpoint, they will need to disable the gate
# once the in-app password is changed: /root/auth.sh off fuxa
ports:
  - port: 1881
    protocol: tcp
    public: true
    basic_auth: true
    description: FUXA Web UI and REST/WebSocket API
