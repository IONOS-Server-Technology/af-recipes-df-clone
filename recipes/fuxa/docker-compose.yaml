services:
  fuxa:
    image: frangoteam/fuxa:1.3.3
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - "1881:1881"
    volumes:
      - /opt/fuxa/db:/app/fuxa/db
      - /opt/fuxa/logs:/app/fuxa/logs
      - /opt/fuxa/images:/app/fuxa/images
      - /opt/fuxa/projects:/app/fuxa/projects
      - /opt/fuxa/export:/app/fuxa/export
    networks:
      - fuxa-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1881/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  fuxa-network:
    driver: bridge
