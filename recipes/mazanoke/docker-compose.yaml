services:
  mazanoke:
    image: ghcr.io/civilblur/mazanoke:1.1.6
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - mazanoke-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  mazanoke-network:
    driver: bridge
