id: mazanoke
enabled: false
display_name: Mazanoke
description: Browser-based image optimizer with batch resize, format conversion (HEIC/AVIF/TIFF to JPG/PNG/WebP/ICO), and EXIF/metadata stripping.
short_description:
  en: "Optimize, convert, and strip metadata from images entirely in your browser — no files leave your server."
  de: "Bilder direkt im Browser optimieren, konvertieren und Metadaten entfernen — keine Dateien verlassen Ihren Server."
  es: "Optimiza, convierte y elimina metadatos de imágenes en el navegador — sin enviar archivos a servicios externos."
  fr: "Optimisez, convertissez et supprimez les métadonnées de vos images dans le navigateur — sans quitter votre serveur."
  it: "Ottimizza, converti e rimuovi i metadati delle immagini nel browser — nessun file lascia il tuo server."
  nl: "Optimaliseer, converteer en verwijder metadata van afbeeldingen in de browser — bestanden verlaten je server niet."
  pl: "Optymalizuj, konwertuj i usuwaj metadane zdjęć w przeglądarce — żadne pliki nie opuszczają Twojego serwera."
categories:
  - utilities
  - media
# Upstream compose pins ghcr.io/civilblur/mazanoke:latest (a rolling alias).
# IF-1501 forbids the literal string "latest", so the current stable release
# tag is used instead — the one case where a fresh value is chosen.
app_version: "1.1.6"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/civilblur/mazanoke
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/mazanoke/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/mazanoke.svg
logo_license: trademark-nominative-fair-use
logo_sha256: ae015436dc738c4baebcb304378558dd8dd9fc2ecc220d2a4b9f7d1a52309ffe

app_min_ram_mb: 128
app_min_disk_mb: 1536

# Mazanoke has no built-in accounts — all image processing happens client-side
# in the browser. basic_auth: true gates the nginx frontend with Traefik's
# shared admin/server-password credential (same pattern as WUD), so anonymous
# access to the UI is not possible.
ports:
  - port: 80
    protocol: tcp
    public: true
    basic_auth: true
    description: Mazanoke web UI
