id: kutt
enabled: false
display_name: Kutt
description: Modern self-hosted URL shortener with custom domains, click analytics, and REST API.
short_description:
  en: "Shorten URLs with custom domains, set passwords or expiry dates on links, and track click analytics — all self-hosted."
  de: "URLs mit eigenen Domains kürzen, Links mit Passwort oder Ablaufdatum schützen und Klickstatistiken abrufen."
  es: "Acorta URLs con dominios personalizados, protege enlaces con contraseña o fecha de expiración y consulta estadísticas de clics."
  fr: "Raccourcissez des URLs avec des domaines personnalisés, protégez les liens et suivez les statistiques de clics."
  it: "Accorcia URL con domini personalizzati, imposta password o scadenze sui link e monitora le statistiche dei clic."
  nl: "Verkorte URL's aanmaken met eigen domeinen, links beveiligen met wachtwoord of vervaldatum en klikstatistieken bekijken."
  pl: "Skracaj adresy URL z własnymi domenami, chroń linki hasłem lub datą ważności i śledź statystyki kliknięć."
categories:
  - utilities
  - productivity
app_version: "v3.2.6"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/thedevs-network/kutt
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/kutt/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/selfhst/icons/png/kutt.png
logo_license: trademark-nominative-fair-use
logo_sha256: 090ef4856732869b2594ab75186fcb4e7111e3d4b2f9947b80fb98bf82f0d56c

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 3000
    protocol: tcp
    public: true
    description: Kutt Web UI

parameters:
  - name: JWT_SECRET
    display_name: JWT Secret
    type: password
    description: Secret key used to sign JWT tokens. Generated randomly at install time by install.sh.
