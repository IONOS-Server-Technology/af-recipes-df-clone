name: portainer
display_name: Portainer
description: GUI for managing Docker environments easily.
short_description:
  en: "Manage your Docker containers, images, volumes, and networks through an intuitive web interface."
  de: "Docker-Container, Images, Volumes und Netzwerke über eine übersichtliche Web-Oberfläche verwalten."
  es: "Gestiona tus contenedores Docker, imágenes, volúmenes y redes a través de una interfaz web intuitiva."
  fr: "Gérez vos conteneurs Docker, images, volumes et réseaux via une interface web intuitive."
  it: "Gestisci container Docker, immagini, volumi e reti tramite un'interfaccia web intuitiva."
  nl: "Beheer je Docker-containers, images, volumes en netwerken via een intuïtieve webinterface."
  pl: "Zarządzaj kontenerami Docker, obrazami, woluminami i sieciami przez intuicyjny interfejs webowy."
categories:
  - infrastructure
app_version: "2.25.1"
recipe_version: "1.0.0"
recipe_type: docker-compose
upstream_url: https://github.com/portainer/portainer

app_min_ram_mb: 512
app_min_disk_mb: 10240

supported_os:
  - ubuntu-26.04

ports:
  - port: 9443
    protocol: tcp
    public: true
    description: Portainer Web UI (HTTPS)
  - port: 8000
    protocol: tcp
    public: false
    description: Edge Agent TCP tunnel

parameters:
  - name: APP_DOMAIN
    display_name: Domain
    type: domain
    required: true
    description: Domain name for accessing Portainer (e.g., portainer.example.com).


incompatible_with_apps: []
