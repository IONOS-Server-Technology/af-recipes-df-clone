services:
  navidrome:
    image: deluan/navidrome:0.63.2
    restart: unless-stopped
    ports:
      - "4533:4533"
    volumes:
      - /opt/navidrome/data:/data
      - /opt/navidrome/music:/music:ro
    networks:
      - navidrome-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4533/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  navidrome-network:
    driver: bridge
