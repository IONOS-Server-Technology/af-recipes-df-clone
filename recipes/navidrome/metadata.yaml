id: navidrome
enabled: false
display_name: Navidrome
description: Self-hosted music server and streamer compatible with Subsonic/Airsonic clients.
short_description:
  en: "Stream your personal music collection from anywhere using any Subsonic-compatible app or web browser."
  de: "Eigene Musiksammlung von überall streamen – mit jeder Subsonic-kompatiblen App oder im Webbrowser."
  es: "Transmite tu colección musical personal desde cualquier lugar con cualquier app compatible con Subsonic."
  fr: "Écoutez votre collection musicale depuis n'importe où avec toute application compatible Subsonic."
  it: "Riproduci la tua collezione musicale da ovunque con qualsiasi app compatibile con Subsonic."
  nl: "Stream je persoonlijke muziekcollectie overal vandaan met elke Subsonic-compatibele app of webbrowser."
  pl: "Streamuj swoją kolekcję muzyczną z dowolnego miejsca za pomocą dowolnej aplikacji kompatybilnej z Subsonic."
categories:
  - media
app_version: "0.63.2"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://www.navidrome.org
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/navidrome/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/navidrome.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 9a1c6ae16e608aba634c531d2aef43f41e0c114266823263d222b1c5fe1573c0

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 4533
    protocol: tcp
    public: true
    description: Navidrome Web UI
