id: elabftw
enabled: false
display_name: eLabFTW
description: Open-source electronic lab notebook for experiments, samples, and protocols.
short_description:
  en: "Keep structured records of experiments, samples, and protocols in a self-hosted electronic lab notebook built for research teams."
  de: "Experimente, Proben und Protokolle strukturiert dokumentieren — im selbstgehosteten elektronischen Laborbuch für Forschungsteams."
  es: "Registra experimentos, muestras y protocolos de forma estructurada en un cuaderno de laboratorio electrónico auto-alojado para equipos de investigación."
  fr: "Consignez expériences, échantillons et protocoles dans un cahier de laboratoire électronique auto-hébergé conçu pour les équipes de recherche."
  it: "Documenta esperimenti, campioni e protocolli in modo strutturato in un quaderno di laboratorio elettronico self-hosted per team di ricerca."
  nl: "Leg experimenten, samples en protocollen gestructureerd vast in een zelf-gehoste elektronisch laboratoriumboek voor onderzoeksteams."
  pl: "Rejestruj eksperymenty, próbki i protokoły w self-hostowanym elektronicznym notatniku laboratoryjnym dla zespołów badawczych."
categories:
  - productivity
  - education
app_version: stable
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/elabftw/elabftw
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/elabftw/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/elabftw/elabftw/master/web/assets/images/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 5e887366247996e1937cef4caebfab9918e7cb8ea5a1717c5daa73911215fa2c

app_min_ram_mb: 2048
app_min_disk_mb: 20480

ports:
  - port: 443
    protocol: tcp
    public: true
    description: eLabFTW Web UI

parameters:
  - name: DB_PASSWORD
    display_name: Database Password
    type: password
    description: MySQL database password. Generated by install.sh at install time — no customer input required.

  - name: MYSQL_ROOT_PASSWORD
    display_name: MySQL Root Password
    type: password
    description: MySQL root password. Generated by install.sh at install time — no customer input required.

  - name: SECRET_KEY
    display_name: Application Secret Key
    type: password
    description: Application secret key for session security. Generated by install.sh at install time — no customer input required.
