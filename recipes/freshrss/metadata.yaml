id: freshrss
enabled: false
display_name: FreshRSS
description: Self-hosted RSS and Atom feed aggregator with a web-based reader, multi-user support, and mobile-client API compatibility.
short_description:
  en: "Aggregate and read your RSS and Atom feeds in one place — self-hosted, with multi-user support and mobile app compatibility."
  de: "RSS- und Atom-Feeds zentral lesen — selbst gehostet, mit Mehrbenutzerunterstützung und Kompatibilität mit mobilen Apps."
  es: "Agrega y lee tus fuentes RSS y Atom en un solo lugar — autoalojado, con soporte multiusuario y compatibilidad con aplicaciones móviles."
  fr: "Agrégez et lisez vos flux RSS et Atom en un seul endroit — auto-hébergé, avec support multi-utilisateurs et compatibilité mobile."
  it: "Aggrega e leggi i tuoi feed RSS e Atom in un unico posto — self-hosted, con supporto multi-utente e compatibilità con app mobile."
  nl: "Lees al je RSS- en Atom-feeds op één plek — zelf gehost, met ondersteuning voor meerdere gebruikers en compatibiliteit met mobiele apps."
  pl: "Agreguj i czytaj kanały RSS i Atom w jednym miejscu — samodzielnie hostowany, z obsługą wielu użytkowników i kompatybilnością mobilną."
categories:
  - productivity
  - media
app_version: "1.29.1"
recipe_version: "0.2.1"
recipe_type: docker-compose
upstream_url: https://github.com/FreshRSS/FreshRSS
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/freshrss/0.2.1/logo.svg
logo_source: https://raw.githubusercontent.com/FreshRSS/FreshRSS/edge/p/themes/icons/icon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: d2c325dbc66c402648affc3fd0bd928ad99ee307479527aec9907e8723d67a29

app_min_ram_mb: 256
app_min_disk_mb: 2048

# FreshRSS ships no credentials at first boot — whoever reaches the URL first
# completes the install wizard and becomes admin. basic_auth: true gates the
# frontend through Traefik HTTP basic auth (server root password) so only an
# authorized user can run the wizard. Once FreshRSS is configured:
# /root/auth.sh off freshrss
ports:
  - port: 80
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: FreshRSS Web UI
