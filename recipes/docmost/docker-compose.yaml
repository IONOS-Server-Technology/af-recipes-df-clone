services:
  docmost:
    image: docmost/docmost:v0.95.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_URL=https://${AF_APP_DOMAIN}
      - APP_SECRET=${APP_SECRET}
      - DATABASE_URL=postgresql://docmost:${POSTGRES_PASSWORD}@db:5432/docmost
      - REDIS_URL=redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - /opt/docmost/storage:/app/data/storage
    networks:
      - docmost-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_DB=docmost
      - POSTGRES_USER=docmost
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - /opt/docmost/db:/var/lib/postgresql/data
    networks:
      - docmost-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmost -d docmost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - /opt/docmost/redis:/data
    networks:
      - docmost-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  docmost-network:
    driver: bridge
