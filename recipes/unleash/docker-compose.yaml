services:
  web:
    image: unleashorg/unleash-server:8.1.0
    restart: unless-stopped
    labels:
      - "wud.trigger.include=ntfy.notify,dockercompose.apply"
      - "wud.compose.file=/opt/unleash/docker-compose.yaml"
    environment:
      - DATABASE_URL=postgresql://unleash:${POSTGRES_PASSWORD}@db:5432/unleash
      - INIT_POSTGRES_USER=unleash
      - INIT_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - INIT_POSTGRES_DB=unleash
    ports:
      - "4242:4242"
    networks:
      - unleash-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4242/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    labels:
      - "wud.watch=false"
    environment:
      - POSTGRES_DB=unleash
      - POSTGRES_USER=unleash
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - /opt/unleash/postgres:/var/lib/postgresql/data
    networks:
      - unleash-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash -d unleash"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  unleash-network:
    driver: bridge
