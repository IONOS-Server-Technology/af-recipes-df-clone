services:
  whodb:
    image: clidey/whodb:0.127.0
    restart: unless-stopped
    environment:
      - WHODB_ENCRYPTION_KEY=${WHODB_ENCRYPTION_KEY}
    ports:
      - "8080:8080"
    volumes:
      - /opt/whodb/data:/var/lib/whodb
    networks:
      - whodb-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  whodb-network:
    driver: bridge
