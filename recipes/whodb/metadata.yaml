id: whodb
enabled: false
display_name: WhoDB
description: Lightweight database browser for Postgres, MySQL, MariaDB, SQLite, MongoDB, Redis, and more.
short_description:
  en: "Browse and manage any database through a modern web interface — supports Postgres, MySQL, MariaDB, SQLite, MongoDB, Redis, and more."
  de: "Datenbanken komfortabel über ein modernes Web-Interface verwalten — unterstützt Postgres, MySQL, MariaDB, SQLite, MongoDB, Redis und mehr."
  es: "Explora y gestiona cualquier base de datos mediante una interfaz web moderna — compatible con Postgres, MySQL, MariaDB, SQLite, MongoDB, Redis y más."
  fr: "Parcourez et gérez n'importe quelle base de données via une interface web moderne — MySQL, PostgreSQL, SQLite, MongoDB, Redis et plus."
  it: "Sfoglia e gestisci qualsiasi database tramite un'interfaccia web moderna — Postgres, MySQL, MariaDB, SQLite, MongoDB, Redis e altro."
  nl: "Beheer elke database via een moderne webinterface — ondersteunt Postgres, MySQL, MariaDB, SQLite, MongoDB, Redis en meer."
  pl: "Przeglądaj i zarządzaj dowolną bazą danych przez nowoczesny interfejs webowy — Postgres, MySQL, MariaDB, SQLite, MongoDB, Redis i więcej."
categories:
  - developer-tools
app_version: "0.127.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/clidey/whodb
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/whodb/0.2.0/logo.svg
logo_source: https://whodb.com/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: cf11ef286cd3944f4a5c2fe2571d91a29f8a608da73e527a3f41d94805f45c77

app_min_ram_mb: 256
app_min_disk_mb: 2048

# WhoDB has no built-in admin login — its UI is a per-session database connection form
# the user fills in interactively. basic_auth: true gates the unauthenticated UI behind
# the customer's server password (traefik_basic_auth mechanism, same pattern as Adminer).
ports:
  - port: 8080
    protocol: tcp
    public: true
    basic_auth: true
    description: WhoDB Web UI
