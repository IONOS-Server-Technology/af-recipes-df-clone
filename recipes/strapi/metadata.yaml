id: strapi
enabled: false
display_name: Strapi
description: Open-source headless CMS for building customizable content APIs with REST and GraphQL.
short_description:
  en: "Define content types and expose them instantly over REST or GraphQL — Strapi is a self-hosted headless CMS built for developers."
  de: "Inhaltstypen definieren und sofort über REST oder GraphQL bereitstellen — Strapi ist ein selbst gehostetes Headless-CMS für Entwickler."
  es: "Define tipos de contenido y exponlos de inmediato vía REST o GraphQL — Strapi es un CMS headless autoalojado pensado para desarrolladores."
  fr: "Définissez des types de contenu et exposez-les via REST ou GraphQL — Strapi est un CMS headless auto-hébergé conçu pour les développeurs."
  it: "Definisci tipi di contenuto ed esponili via REST o GraphQL — Strapi è un CMS headless self-hosted pensato per gli sviluppatori."
  nl: "Definieer inhoudstypen en stel ze direct beschikbaar via REST of GraphQL — Strapi is een self-hosted headless CMS voor ontwikkelaars."
  pl: "Definiuj typy treści i udostępniaj je przez REST lub GraphQL — Strapi to samodzielnie hostowany headless CMS dla programistów."
categories:
  - developer-tools
app_version: "5.51.2"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://strapi.io
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/strapi/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/strapi/strapi/develop/packages/core/admin/admin/src/assets/images/logo-strapi-2022.svg
logo_license: trademark-nominative-fair-use
logo_sha256: fd3480a6d6b42d9a40ec1599a301322e813e1dd7e04a46771cb56e03c16c043b

app_min_ram_mb: 1024
app_min_disk_mb: 20480


# basic_auth: Strapi has no env var to pre-provision an admin account — first boot
# presents an open /admin registration form, so anyone reaching the URL first claims
# ownership. The platform's basic-auth gate (server root password) closes that window
# until the customer completes setup and runs /root/auth.sh off strapi. Same accepted
# trade-off as n8n and Ghost: all inbound requests (including API calls from an external
# frontend) see 401 until the gate is removed — document this clearly to customers.
ports:
  - port: 1337
    protocol: tcp
    public: true
    basic_auth: true
    description: Strapi Admin Panel and API
