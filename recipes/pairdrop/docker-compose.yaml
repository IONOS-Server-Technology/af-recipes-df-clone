services:
  pairdrop:
    image: ghcr.io/schlagmichdoch/pairdrop:1.11.2
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - pairdrop-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  pairdrop-network:
    driver: bridge
