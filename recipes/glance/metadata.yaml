id: glance
enabled: false
display_name: Glance
description: Self-hosted dashboard that aggregates feeds, widgets, and server status in one place.
short_description:
  en: "Put your RSS feeds, Reddit, Hacker News, weather, Docker stats, and more on one self-hosted homepage."
categories:
  - productivity
app_version: "v0.8.5"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/glanceapp/glance
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/glance/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/glanceapp/glance/main/internal/glance/static/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: eb920a441372d4c81d10c1a0a2ca3a9655df459018904d2d85eb8fac74af11e3

app_min_ram_mb: 256
app_min_disk_mb: 1024


ports:
  - port: 8080
    protocol: tcp
    public: true
    description: Glance Web UI

parameters:
  - name: GLANCE_ADMIN_PASSWORD_HASH
    display_name: Admin Password Hash
    type: password
    generated_from: "bcrypt:ROOT_PASSWORD"
    description: Bcrypt hash of the admin password, derived from your server password. Set as password-hash in glance.yml.
