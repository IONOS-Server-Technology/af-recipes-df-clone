services:
  onetimesecret:
    image: onetimesecret/onetimesecret:v0.26.1
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      - SECRET=${SECRET}
      - REDIS_URL=redis://:${VALKEY_PASSWORD}@valkey:6379
      - AUTH_ENABLED=false
      - HOST=0.0.0.0
      - PORT=3000
    ports:
      - "3000:3000"
    networks:
      - onetimesecret-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command: valkey-server --requirepass ${VALKEY_PASSWORD} --appendonly yes
    volumes:
      - /opt/onetimesecret/valkey:/data
    networks:
      - onetimesecret-network
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a ${VALKEY_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  onetimesecret-network:
    driver: bridge
