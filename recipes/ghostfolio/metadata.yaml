id: ghostfolio
enabled: false
display_name: Ghostfolio
description: Open-source wealth management software for tracking investment portfolios.
short_description:
  en: "Track stocks, ETFs, and crypto in a self-hosted portfolio manager that keeps your financial data off third-party servers."
  de: "Aktien, ETFs und Krypto im selbst gehosteten Portfolio-Manager verfolgen — Finanzdaten bleiben auf Ihrem eigenen Server."
  es: "Rastrea acciones, ETFs y criptomonedas en un gestor de cartera autoalojado que mantiene tus datos financieros en tu propio servidor."
  fr: "Suivez actions, ETF et crypto dans un gestionnaire de portefeuille auto-hébergé qui garde vos données financières sur votre propre serveur."
  it: "Tieni traccia di azioni, ETF e criptovalute in un gestore di portafoglio self-hosted che mantiene i tuoi dati finanziari sul tuo server."
  nl: "Volg aandelen, ETF's en crypto in een zelf-gehoste portefeuillebeheerder die je financiële gegevens op je eigen server houdt."
  pl: "Śledź akcje, ETF-y i kryptowaluty w samodzielnie hostowanym menedżerze portfela, który przechowuje Twoje dane finansowe na własnym serwerze."
categories:
  - productivity
app_version: "3.42.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/ghostfolio/ghostfolio
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/ghostfolio/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/ghostfolio.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 1f5912c5c0e06b8cb42bb3bde214a2a36fdcc285f829ff41e3b56f824119aa17

app_min_ram_mb: 2048
app_min_disk_mb: 20480

# basic_auth required because Ghostfolio has no first-boot-reachable login: anyone who
# reaches the UI can self-register and claim admin by promoting themselves via a direct DB
# query. The Traefik gate closes the setup-takeover window while the admin bootstraps.
# Trade-off: inbound requests (e.g. data-import callbacks) get 401 until the customer
# disables auth via /root/auth.sh off ghostfolio once their account exists.
ports:
  - port: 3333
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: Ghostfolio Web UI

parameters:
  - name: POSTGRES_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password generated by install.sh.

  - name: REDIS_PASSWORD
    display_name: Redis Password
    type: password
    description: Redis password generated by install.sh.

  - name: ACCESS_TOKEN_SALT
    display_name: Access Token Salt
    type: password
    description: Salt used to hash access tokens, generated by install.sh.

  - name: JWT_SECRET_KEY
    display_name: JWT Secret Key
    type: password
    description: Key used to sign JWT tokens, generated by install.sh.
