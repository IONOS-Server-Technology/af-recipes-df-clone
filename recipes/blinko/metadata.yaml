id: blinko
enabled: false
display_name: Blinko
description: AI-powered note-taking and microblogging platform with Markdown support and task management.
short_description:
  en: "Capture notes, tasks, and microblog posts in one self-hosted web app with Markdown, search, and optional AI-assisted retrieval."
  de: "Notizen, Aufgaben und Mikroblog-Beiträge in einer selbst gehosteten Web-App erfassen — mit Markdown, Suche und optionaler KI-gestützter Abfrage."
  es: "Captura notas, tareas y publicaciones de microblog en una aplicación web autoalojada con Markdown, búsqueda y recuperación asistida por IA opcional."
  fr: "Capturez notes, tâches et billets de microblog dans une application web auto-hébergée avec Markdown, recherche et récupération assistée par IA en option."
  it: "Cattura note, attività e post di microblog in un'unica app web self-hosted con Markdown, ricerca e recupero assistito dall'IA opzionale."
  nl: "Leg notities, taken en microblogberichten vast in één zelf-gehoste web-app met Markdown, zoeken en optionele AI-ondersteunde opvraging."
  pl: "Rejestruj notatki, zadania i wpisy na mikroblogu w jednej aplikacji webowej z obsługą Markdown, wyszukiwaniem i opcjonalnym pobieraniem wspomaganym przez AI."
categories:
  - productivity
app_version: "1.8.8"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/blinkospace/blinko
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/blinko/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/blinko.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 79782447fdd5a989e051904f20a1da564d334b363474e3d927d3215cc62e41aa

app_min_ram_mb: 2048
app_min_disk_mb: 20480

ports:
  - port: 1111
    protocol: tcp
    public: true
    description: Blinko Web UI
