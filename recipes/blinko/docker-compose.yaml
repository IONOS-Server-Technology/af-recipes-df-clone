services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blinko
      POSTGRES_USER: blinko
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /opt/blinko/postgres:/var/lib/postgresql/data
    networks:
      - blinko-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blinko -d blinko"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  blinko:
    image: blinkospace/blinko:1.8.8
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://blinko:${POSTGRES_PASSWORD}@postgres:5432/blinko?schema=public
      NEXTAUTH_URL: https://${AF_APP_DOMAIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    ports:
      - "1111:1111"
    volumes:
      - /opt/blinko/data:/app/.blinko
    networks:
      - blinko-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1111/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

networks:
  blinko-network:
    driver: bridge
