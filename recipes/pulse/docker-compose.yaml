services:
  pulse:
    image: rcourtman/pulse:6.1.2
    restart: unless-stopped
    environment:
      - PULSE_AUTH_PASS=${PULSE_AUTH_PASS}
    ports:
      - "7655:7655"
    volumes:
      - /opt/pulse/data:/app/data
    networks:
      - pulse-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7655/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  pulse-network:
    driver: bridge
