id: pulse
enabled: false
display_name: Pulse
description: Real-time monitoring dashboard for Proxmox, Docker, and Kubernetes infrastructure.
short_description:
  en: "Monitor your Proxmox nodes, Docker hosts, and Kubernetes clusters with a unified real-time dashboard."
  de: "Überwachen Sie Ihre Proxmox-Knoten, Docker-Hosts und Kubernetes-Cluster mit einem einheitlichen Echtzeit-Dashboard."
  es: "Monitoriza tus nodos Proxmox, hosts Docker y clústeres Kubernetes con un panel de control unificado en tiempo real."
  fr: "Surveillez vos nœuds Proxmox, hôtes Docker et clusters Kubernetes via un tableau de bord unifié en temps réel."
  it: "Monitora i tuoi nodi Proxmox, host Docker e cluster Kubernetes con una dashboard unificata in tempo reale."
  nl: "Monitor je Proxmox-nodes, Docker-hosts en Kubernetes-clusters via een geïntegreerd realtime dashboard."
  pl: "Monitoruj węzły Proxmox, hosty Docker i klastry Kubernetes za pomocą zunifikowanego panelu w czasie rzeczywistym."
categories:
  - monitoring
  - infrastructure
app_version: "6.1.2"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/rcourtman/Pulse
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/pulse/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/pulse.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 6541fca543ea7bcbfc545fff624a7be9dad874d8bc40f1c80b333d7efbb66986

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 7655
    protocol: tcp
    public: true
    description: Pulse Web UI

parameters:
  - name: PULSE_AUTH_PASS
    display_name: Admin Password
    type: password
    generated_from: "bcrypt:ROOT_PASSWORD"
    description: >
      Admin password for the Pulse web UI. Set via PULSE_AUTH_PASS, which accepts
      a bcrypt hash — auto-computed from the server root password at install time.
