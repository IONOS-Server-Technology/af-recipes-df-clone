services:
  teable:
    image: ghcr.io/teableio/teable:release.2026-08-06T11-43-30Z.2519
    restart: unless-stopped
    environment:
      - PUBLIC_ORIGIN=https://${AF_APP_DOMAIN}
      - POSTGRES_URL=postgresql://teable:${POSTGRES_PASSWORD}@postgres:5432/teable
      - REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379/0
      - BACKEND_JWT_SECRET=${BACKEND_JWT_SECRET}
    ports:
      - "3000:3000"
    volumes:
      - /opt/teable/data:/app/.assets
    networks:
      - teable-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  postgres:
    image: postgres:15.4-alpine
    restart: unless-stopped
    labels:
      - "wud.watch=false"
    environment:
      - POSTGRES_DB=teable
      - POSTGRES_USER=teable
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - /opt/teable/postgres:/var/lib/postgresql/data
    networks:
      - teable-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teable -d teable"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.2.4-alpine
    restart: unless-stopped
    labels:
      - "wud.watch=false"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - /opt/teable/redis:/data
    networks:
      - teable-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  teable-network:
    driver: bridge
