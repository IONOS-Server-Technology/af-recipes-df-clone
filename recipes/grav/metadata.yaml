id: grav
enabled: false
display_name: Grav
description: Modern flat-file CMS that requires no database, just files and folders.
short_description:
  en: "Build and publish a website with a modern flat-file CMS — no database needed, just files and folders on your own server."
  de: "Eine Website mit einem modernen Flat-File-CMS erstellen und veröffentlichen — keine Datenbank nötig, nur Dateien und Ordner auf dem eigenen Server."
  es: "Crea y publica una web con un CMS moderno sin base de datos — solo archivos y carpetas en tu propio servidor."
  fr: "Créez et publiez un site web avec un CMS flat-file moderne — sans base de données, juste des fichiers et dossiers sur votre propre serveur."
  it: "Crea e pubblica un sito web con un CMS flat-file moderno — nessun database, solo file e cartelle sul tuo server."
  nl: "Bouw en publiceer een website met een modern flat-file CMS — geen database nodig, alleen bestanden en mappen op je eigen server."
  pl: "Twórz i publikuj strony z nowoczesnym CMS-em bez bazy danych — tylko pliki i foldery na własnym serwerze."
categories:
  - productivity
app_version: "2.0.15"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://getgrav.org/
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/grav/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/grav.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 5247a16a115c7dbd6ad5aa27fb96ea8bf0aa8882a3d317d4896dda99c538fc62

app_min_ram_mb: 512
app_min_disk_mb: 5120


# basic_auth protects Grav's first-run admin-creation form: Admin2's setup wizard is
# unauthenticated, so the first visitor to the URL claims the admin account before the
# customer does. The Traefik basic-auth gate (server root password) closes that window.
# The customer removes it after creating their admin account:
#
#     /root/auth.sh off grav
#
# Same accepted trade-off as n8n and ghost: inbound requests see 401 until the gate
# comes down, but the setup-takeover window it closes was judged worse.
ports:
  - port: 80
    protocol: tcp
    public: true
    basic_auth: true
    description: Grav Web UI
