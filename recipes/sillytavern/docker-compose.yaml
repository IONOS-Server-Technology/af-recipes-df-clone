services:
  sillytavern:
    image: ghcr.io/sillytavern/sillytavern:release
    restart: unless-stopped
    labels:
      - "wud.trigger.include=ntfy.notify,dockercompose.apply"
      - "wud.compose.file=/opt/sillytavern/docker-compose.yml"
    ports:
      - "8000"
    volumes:
      - /opt/sillytavern/config:/home/user/app/config
      - /opt/sillytavern/data:/home/user/app/data
    networks:
      - sillytavern-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  sillytavern-network:
    driver: bridge
