id: wud
enabled: false
composition: true
display_name: What's Up Docker
description: Auto-injected composition app — monitors Docker containers and enables one-click manual image updates via the WUD web UI.
short_description:
  en: "Stay on top of Docker image updates — get notified when newer versions of your running containers are available."
  de: "Docker-Image-Updates im Blick behalten — benachrichtigt werden, wenn neue Versionen laufender Container verfügbar sind."
  es: "Mantente al tanto de las actualizaciones de imágenes Docker — recibe notificaciones cuando haya nuevas versiones de tus contenedores."
  fr: "Restez informé des mises à jour d'images Docker — recevez des notifications dès que de nouvelles versions de vos conteneurs sont disponibles."
  it: "Tieni sotto controllo gli aggiornamenti delle immagini Docker — ricevi notifiche quando sono disponibili nuove versioni dei tuoi container."
  nl: "Houd Docker-image-updates bij — ontvang meldingen wanneer nieuwere versies van je containers beschikbaar zijn."
  pl: "Śledź aktualizacje obrazów Docker — otrzymuj powiadomienia, gdy dostępne są nowe wersje twoich kontenerów."
categories:
  - infrastructure
app_version: "8.2.2"
recipe_version: "2.0.0"
recipe_type: docker-compose
upstream_url: https://github.com/getwud/wud

app_min_ram_mb: 128
app_min_disk_mb: 1536

supported_os:
  - ubuntu-26.04

ports: []

parameters:
  - name: BASE_DOMAIN
    display_name: Base Domain
    type: domain
    required: true
    description: Customer's base domain (e.g., h12345.stratoserver.net). WUD UI is served at updates.<base_domain>.

  - name: WUD_ADMIN_PASSWORD
    display_name: WUD Admin Password
    type: password
    required: false
    auto_generate: true
    description: Password for the WUD web UI (auto-generated if not provided). Log in at updates.<base_domain> with username "admin".

notes: >
  Composition app — auto-included by af-core when the customer selects at least one docker-compose recipe.
  Hidden from the customer-facing catalogue (enabled: false). The WUD web UI is accessible at
  updates.<base_domain> behind HTTP Basic auth (username: admin).
  SECURITY: The Docker socket is mounted read-write. This is an accepted architectural trade-off
  required for WUD's one-click apply feature (dockercompose trigger rewrites compose files and
  recreates containers). A compromised WUD container has root-equivalent access to the host via
  the Docker daemon. Mitigations: auto-generated strong password, TLS via Traefik + Let's Encrypt,
  WUD only accessible at updates.<base_domain> (not on a raw port), wud.watch=false prevents
  WUD from updating itself.
  Notification triggers (ntfy/SMTP) ship in .env but are disabled by default; the customer enables
  them by editing /opt/wud/.env and restarting the service.
  af-core injects /opt/<app>:/opt/<app> bind-mounts for each recipe that carries the
  dockercompose.apply trigger label, enabling one-click updates from the WUD UI.

preinstall_cmds:
  - docker network create traefik-net 2>/dev/null || true
