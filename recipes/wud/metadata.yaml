name: wud
display_name: What's Up Docker
description: Monitor Docker containers and get notified when new image versions are available.
short_description:
  en: "Stay on top of Docker image updates — get notified when newer versions of your running containers are available."
  de: "Docker-Image-Updates im Blick behalten — benachrichtigt werden, wenn neue Versionen laufender Container verfügbar sind."
  es: "Mantente al tanto de las actualizaciones de imágenes Docker — recibe notificaciones cuando haya nuevas versiones de tus contenedores."
  fr: "Restez informé des mises à jour d'images Docker — recevez des notifications dès que de nouvelles versions de vos conteneurs sont disponibles."
  it: "Tieni sotto controllo gli aggiornamenti delle immagini Docker — ricevi notifiche quando sono disponibili nuove versioni dei tuoi container."
  nl: "Houd Docker-image-updates bij — ontvang meldingen wanneer nieuwere versies van je containers beschikbaar zijn."
  pl: "Śledź aktualizacje obrazów Docker — otrzymuj powiadomienia, gdy dostępne są nowe wersje twoich kontenerów."
categories:
  - monitoring
app_version: "6.5.0"
recipe_version: "1.0.0"
recipe_type: docker-compose
upstream_url: https://github.com/fmartinou/whats-up-docker

app_min_ram_mb: 256
app_min_disk_mb: 2048

supported_os:
  - ubuntu-26.04

ports:
  - port: 3002
    protocol: tcp
    public: true
    description: WUD Web UI

parameters:
  - name: APP_DOMAIN
    display_name: Domain
    type: domain
    required: true
    description: Domain for accessing WUD (e.g., wud.example.com).

incompatible_with_apps:
  - gitea
