id: wud
enabled: false
docker_auto_inject: true
display_name: What's Up Docker
description: Auto-injected composition app — monitors Docker containers and enables one-click manual image updates via the WUD web UI.
short_description:
  en: "Stay on top of Docker image updates — get notified when newer versions of your running containers are available."
  de: "Docker-Image-Updates im Blick behalten — benachrichtigt werden, wenn neue Versionen laufender Container verfügbar sind."
  es: "Mantente al tanto de las actualizaciones de imágenes Docker — recibe notificaciones cuando haya nuevas versiones de tus contenedores."
  fr: "Restez informé des mises à jour d'images Docker — recevez des notifications dès que de nouvelles versions de vos conteneurs sont disponibles."
  it: "Tieni sotto controllo gli aggiornamenti delle immagini Docker — ricevi notifiche quando sono disponibili nuove versioni dei tuoi container."
  nl: "Houd Docker-image-updates bij — ontvang meldingen wanneer nieuwere versies van je containers beschikbaar zijn."
  pl: "Śledź aktualizacje obrazów Docker — otrzymuj powiadomienia, gdy dostępne są nowe wersje twoich kontenerów."
categories:
  - infrastructure
# PINNED to 8.2.2 — do NOT bump to 8.3.0. WUD 8.3.0 has a dockercompose trigger
# regression (upstream PR #946: an always-false image match) that turns
# dockercompose.apply into a silent no-op — one-click updates report success and
# change nothing. Confirmed on a live VM. Revisit only once a fixed release ships.
app_version: "8.2.2"
recipe_version: "2.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/getwud/wud

app_min_ram_mb: 128
app_min_disk_mb: 1536

# Port 3000 is WUD's web UI. Declaring it public: true lets the af-core renderer
# wire the Traefik route (Host(`wud.<base_domain>`) + Let's Encrypt) and strip the
# host port binding on ship — exactly like every other docker-compose recipe.
#
# basic_auth (IF-1312) closes the gap IF-808 left open: WUD has no login of its
# own, and this route reaches an API that holds the Docker socket read-write, so
# anonymous access must not be possible. Traefik answers 401 for the whole route
# — UI and /api/* alike — with username `admin` and the server password the
# customer chose at order time. WUD is the reference consumer for the feature.
ports:
  - port: 3000
    protocol: tcp
    public: true
    basic_auth: true
    description: WUD web UI

