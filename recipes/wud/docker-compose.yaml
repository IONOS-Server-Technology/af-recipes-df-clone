services:
  wud:
    image: getwud/wud:8.3.0
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/wud/store:/store
      # af-core injects /opt/<app>:/opt/<app> bind-mounts here for each recipe
      # that carries the dockercompose.apply trigger label, so WUD can rewrite
      # and recreate those stacks on demand.
    networks:
      - wud-network
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wud.rule=Host(`updates.${BASE_DOMAIN}`)"
      - "traefik.http.routers.wud.entrypoints=websecure"
      - "traefik.http.routers.wud.tls.certresolver=le"
      - "traefik.http.services.wud.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik-net"
      # WUD must not watch itself — it cannot safely apply its own update.
      - "wud.watch=false"
    healthcheck:
      # Accepts both 200 (no auth) and 401 (auth enabled) as healthy.
      # Using 127.0.0.1 — localhost resolves to ::1 only in current Docker
      # networking, but WUD binds to 0.0.0.0 (IPv4).
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/registries | grep -qE '^(200|401)$'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  wud-network:
    driver: bridge
  traefik-net:
    external: true
