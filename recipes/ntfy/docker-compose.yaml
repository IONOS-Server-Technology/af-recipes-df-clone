services:
  ntfy:
    image: binwiederhier/ntfy:2.27.0
    command: serve
    restart: unless-stopped
    environment:
      - NTFY_BASE_URL=https://${AF_APP_DOMAIN}
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
    ports:
      - "80:80"
    volumes:
      - /opt/ntfy/cache:/var/cache/ntfy
    networks:
      - ntfy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  ntfy-network:
    driver: bridge
