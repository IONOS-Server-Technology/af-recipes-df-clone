id: teammapper
enabled: false
display_name: TeamMapper
description: Real-time collaborative mind mapping for teams.
short_description:
  en: "Brainstorm and map ideas together in real time — TeamMapper runs entirely on your own server."
  de: "Gemeinsam Ideen in Echtzeit sammeln und strukturieren — TeamMapper läuft vollständig auf Ihrem Server."
  es: "Lluvia de ideas y mapas mentales colaborativos en tiempo real — TeamMapper se ejecuta en tu propio servidor."
  fr: "Créez des cartes mentales collaboratives en temps réel — TeamMapper tourne entièrement sur votre serveur."
  it: "Brainstorming e mappe mentali collaborative in tempo reale — TeamMapper gira interamente sul tuo server."
  nl: "Ideeën samen in kaart brengen in real time — TeamMapper draait volledig op je eigen server."
  pl: "Wspólne tworzenie map myśli w czasie rzeczywistym — TeamMapper działa w całości na twoim serwerze."
categories:
  - productivity
  - communication
app_version: "v0.2.9-3"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/b310-digital/teammapper
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/teammapper/0.2.0/logo.svg
logo_source: https://teammapper.org/assets/icons/teammapper.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 71f757f7e38663a0ec74f58ed59cfd05873046b13ddac5326bef5ac2e8041a1b

app_min_ram_mb: 2048
app_min_disk_mb: 20480

# basic_auth: TeamMapper has no built-in user accounts — access is link-based only.
# Without this gate the instance sits open on the internet. The customer turns it off
# with `/root/auth.sh off teammapper` once they are done with initial setup (or leave
# it on permanently for a private instance). Inbound webhook/callback paths are not
# a concern for this app type.
ports:
  - port: 3000
    protocol: tcp
    public: true
    basic_auth: true
    description: TeamMapper Web UI

parameters:
  - name: POSTGRES_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password for TeamMapper.

  - name: JWT_SECRET
    display_name: JWT Secret
    type: password
    description: Secret key used to sign JWT tokens for session management.
