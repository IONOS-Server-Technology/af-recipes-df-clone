services:
  glpi:
    image: glpi/glpi:11.0.8
    restart: unless-stopped
    environment:
      - GLPI_DB_HOST=mariadb
      - GLPI_DB_USER=glpiuser
      - GLPI_DB_NAME=glpidb
      - GLPI_DB_PASSWORD=${GLPI_DB_PASSWORD}
    ports:
      - "80:80"
    volumes:
      - /opt/glpi/files:/var/www/html/files
      - /opt/glpi/marketplace:/var/www/html/marketplace
    networks:
      - glpi-network
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=glpidb
      - MYSQL_USER=glpiuser
      - MYSQL_PASSWORD=${GLPI_DB_PASSWORD}
    volumes:
      - /opt/glpi/mariadb:/var/lib/mysql
    networks:
      - glpi-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  glpi-network:
    driver: bridge
