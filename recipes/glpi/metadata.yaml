id: glpi
enabled: false
display_name: GLPI
description: Open-source IT asset management and help desk platform for IT operations and ITIL-style service management.
short_description:
  en: "Manage IT assets, track support tickets, and run your help desk with this self-hosted ITIL-ready platform."
  de: "IT-Assets verwalten, Support-Tickets verfolgen und den Help Desk mit dieser selbst gehosteten ITIL-fähigen Plattform betreiben."
  es: "Gestiona activos de TI, realiza seguimiento de tickets y opera tu help desk con esta plataforma auto-alojada preparada para ITIL."
  fr: "Gérez les actifs IT, suivez les tickets d'assistance et exploitez votre help desk avec cette plateforme auto-hébergée compatible ITIL."
  it: "Gestisci asset IT, monitora i ticket di supporto e gestisci il tuo help desk con questa piattaforma self-hosted conforme ITIL."
  nl: "Beheer IT-assets, volg supporttickets en run je helpdesk met dit zelf gehoste ITIL-klare platform."
  pl: "Zarządzaj zasobami IT, śledź zgłoszenia wsparcia i prowadź help desk z tą samodzielnie hostowaną platformą zgodną z ITIL."
categories:
  - productivity
  - infrastructure
app_version: "11.0.8"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://www.glpi-project.org
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/glpi/0.2.0/logo.svg
logo_source: https://www.glpi-project.org/wp-content/uploads/2025/10/glpi-logo-ig.png
logo_license: trademark-nominative-fair-use
logo_sha256: 4798ee8a96ea709c6784c97a7834dcdb931c0d49828369a271c0e4e3add8ec65

app_min_ram_mb: 512
app_min_disk_mb: 20480

ports:
  - port: 80
    protocol: tcp
    public: true
    basic_auth: true
    description: GLPI Web UI

parameters:
  - name: GLPI_DB_PASSWORD
    display_name: Database Password
    type: password
    description: MySQL database password for the GLPI database user, server-generated at first boot.
