id: code-server
enabled: false
display_name: Code-Server
description: VS Code running in the browser for remote development from any device.
short_description:
  en: "Edit and run code from any device with VS Code running right in your browser."
  de: "Code von jedem Gerät aus bearbeiten und ausführen — mit VS Code direkt im Browser."
  es: "Edita y ejecuta código desde cualquier dispositivo con VS Code directamente en tu navegador."
  fr: "Modifiez et exécutez du code depuis n'importe quel appareil avec VS Code dans votre navigateur."
  it: "Modifica ed esegui codice da qualsiasi dispositivo con VS Code direttamente nel browser."
  nl: "Bewerk en voer code uit vanaf elk apparaat met VS Code rechtstreeks in je browser."
  pl: "Edytuj i uruchamiaj kod z dowolnego urządzenia dzięki VS Code prosto w przeglądarce."
categories:
  - developer-tools
  - productivity
app_version: "4.131.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/coder/code-server
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/code-server/0.2.0/logo.svg
logo_source: https://coder.com/favicon-192x192-light.svg
logo_license: trademark-nominative-fair-use
logo_sha256: d2a80f0e48bf016753fdca05a86930b39bf5133c17c8604c0aa5439340052a67

app_min_ram_mb: 1024
app_min_disk_mb: 2048

ports:
  - port: 8080
    protocol: tcp
    public: true
    http: true
    description: Code-Server Web UI

parameters:
  # generated_from (IF-1420): HASHED_PASSWORD is derived from the customer's server
  # (root) password at /compose time. Upstream documents HASHED_PASSWORD as taking
  # an argon2 hash (auth: password / hashed-password in config.yaml), which maps
  # directly onto the argon2 mechanism, so the customer logs in with the password
  # they already have instead of a separate generated secret.
  - name: HASHED_PASSWORD
    display_name: Login Password
    type: password
    generated_from: "argon2:ROOT_PASSWORD"
    description: Password required to log in to the Code-Server web UI. Derived from your server password — log in with that password.
