id: karakeep
enabled: false
display_name: Karakeep
description: Self-hosted bookmark manager with AI-powered tagging and full-text search.
short_description:
  en: "Save links, screenshots, and full pages — AI auto-tags everything and full-text search finds it instantly."
  de: "Links, Screenshots und Seiten speichern — KI taggt automatisch und Volltextsuche findet alles sofort."
  es: "Guarda enlaces, capturas y páginas enteras — la IA etiqueta todo automáticamente y la búsqueda lo encuentra."
  fr: "Sauvegardez liens, captures et pages entières — l'IA tague automatiquement et la recherche retrouve tout."
  it: "Salva link, screenshot e pagine intere — l'IA tagga automaticamente e la ricerca full-text trova tutto."
  nl: "Sla links, screenshots en volledige pagina's op — AI tagt alles en zoeken in volledige tekst vindt het meteen."
  pl: "Zapisuj linki, zrzuty i całe strony — AI taguje automatycznie, a wyszukiwanie pełnotekstowe znajdzie wszystko."
categories:
  - productivity
  - ai
app_version: "${KARAKEEP_VERSION:-release}"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://karakeep.app/
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/karakeep/0.2.0/logo.svg
logo_source: https://karakeep.app/icons/logo-icon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 26cebc667a368d5f05222923e09f06a924eb05c417f5640dbcea541804fdcbf1

app_min_ram_mb: 2048
app_min_disk_mb: 20480

ports:
  - port: 3000
    protocol: tcp
    public: true
    description: Karakeep Web UI
