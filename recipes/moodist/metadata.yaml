id: moodist
enabled: false
display_name: Moodist
description: Ambient soundscape mixer with Pomodoro timer and sleep timer for focus and relaxation.
short_description:
  en: "Fill your space with calming ambient sounds, set a Pomodoro timer, and wind down with a sleep timer — all in one distraction-free app."
  de: "Beruhigende Umgebungsklänge abspielen, Pomodoro-Timer starten und mit dem Sleep-Timer entspannen — alles in einer ablenkungsfreien App."
  es: "Llena tu espacio con sonidos ambientales, activa un temporizador Pomodoro y relájate con un temporizador de sueño — todo en una app sin distracciones."
  fr: "Remplissez votre espace de sons ambiants apaisants, configurez un minuteur Pomodoro et décompressez avec un minuteur de sommeil."
  it: "Riempi il tuo spazio di suoni ambientali rilassanti, imposta un timer Pomodoro e concludi la giornata con un timer del sonno."
  nl: "Vul je ruimte met rustgevende omgevingsgeluiden, stel een Pomodoro-timer in en ontspan met een slaaptimer — alles in één app."
  pl: "Wypełnij przestrzeń kojącymi dźwiękami otoczenia, ustaw timer Pomodoro i wycisz się z timerem snu — wszystko w jednej aplikacji."
categories:
  - productivity
app_version: "2.6.1"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/remvze/moodist
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/moodist/0.2.0/logo.svg
logo_source: https://moodist.mvze.net/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: e1be2b4910db1dc211ea3a9613e960e5b95bd5c2e3d5cd331b6dfeac45f18784

app_min_ram_mb: 256
app_min_disk_mb: 2048

# Moodist has no built-in login — the app is a public frontend with no auth of its own.
# basic_auth: true gates it behind the customer's server password (traefik_basic_auth
# mechanism from installability.secrets_expressible_today).
ports:
  - port: 8080
    protocol: tcp
    public: true
    basic_auth: true
    description: Moodist Web UI
