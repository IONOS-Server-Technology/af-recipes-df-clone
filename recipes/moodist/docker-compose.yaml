services:
  moodist:
    image: ghcr.io/remvze/moodist:2.6.1
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - moodist-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  moodist-network:
    driver: bridge
