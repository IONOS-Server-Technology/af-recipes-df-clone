id: esphome
enabled: false
display_name: ESPHome
description: Firmware configuration and OTA update dashboard for ESP8266/ESP32/RP2040 microcontrollers.
short_description:
  en: "Build and update ESP8266/ESP32 microcontroller firmware from a browser-based dashboard using simple YAML configuration."
  de: "ESP8266/ESP32-Firmware per Browser-Dashboard und YAML-Konfiguration erstellen und per OTA aktualisieren."
  es: "Crea y actualiza firmware de microcontroladores ESP8266/ESP32 desde un panel web usando configuración YAML."
  fr: "Créez et mettez à jour le firmware de microcontrôleurs ESP8266/ESP32 depuis un tableau de bord web avec une configuration YAML."
  it: "Crea e aggiorna il firmware per microcontrollori ESP8266/ESP32 da un pannello web con configurazione YAML."
  nl: "Bouw en update ESP8266/ESP32-microcontrollerfirmware via een browser-dashboard met YAML-configuratie."
  pl: "Buduj i aktualizuj oprogramowanie mikrocontrolerów ESP8266/ESP32 z przeglądarki przy użyciu konfiguracji YAML."
categories:
  - home
  - developer-tools
app_version: "2026.7.4"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://esphome.io/
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/esphome/0.2.0/logo.svg
logo_source: https://esphome.io/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 12d00a3d30eb648cb6c22f3e5499399e3751a8350d72d7dcf2ee820d58f7f7dd

app_min_ram_mb: 512
app_min_disk_mb: 2048

ports:
  - port: 6052
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: ESPHome dashboard Web UI
