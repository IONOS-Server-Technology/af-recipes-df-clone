services:
  handbrake:
    image: jlesage/handbrake:v26.07.2
    restart: unless-stopped
    ports:
      - "5800:5800"
    volumes:
      - /opt/handbrake/config:/config
      - /opt/handbrake/storage:/storage
      - /opt/handbrake/watch:/watch
      - /opt/handbrake/output:/output
    networks:
      - handbrake-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5800/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  handbrake-network:
    driver: bridge
