id: sonarr
enabled: false
display_name: Sonarr
description: Automated TV show collection manager and organizer for Usenet and torrent download clients.
short_description:
  en: "Automatically track, download, and organize your TV show collection with a sleek web UI."
  de: "TV-Serien-Sammlung automatisch verfolgen, herunterladen und organisieren – mit übersichtlicher Web-Oberfläche."
  es: "Rastrea, descarga y organiza automáticamente tu colección de series de televisión con una interfaz web elegante."
  fr: "Suivez, téléchargez et organisez automatiquement votre collection de séries TV via une interface web claire."
  it: "Traccia, scarica e organizza automaticamente la tua raccolta di serie TV con un'interfaccia web intuitiva."
  nl: "Volg, download en organiseer automatisch je tv-seriecollectie via een overzichtelijke webinterface."
  pl: "Automatycznie śledź, pobieraj i organizuj swoją kolekcję seriali dzięki przejrzystemu interfejsowi webowemu."
categories:
  - media
  - automation
app_version: "4.0.19.2979"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://sonarr.tv
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/sonarr/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/Sonarr/Sonarr/v5-develop/frontend/src/Content/Images/logo.svg
logo_license: trademark-nominative-fair-use
logo_sha256: f83c9c90f0330f014419b34a1de205ed77384573f2809647f0108c6f198e19b4

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 8989
    protocol: tcp
    public: true
    http: true
    description: "Web UI"
