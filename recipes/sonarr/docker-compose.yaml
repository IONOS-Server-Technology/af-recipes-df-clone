services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls291
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    ports:
      - "8989:8989"
    volumes:
      - /opt/sonarr/config:/config
    networks:
      - sonarr-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8989/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  sonarr-network:
    driver: bridge
