services:
  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice:v9.0.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /opt/gowa/storages:/app/storages
    networks:
      - gowa-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  gowa-network:
    driver: bridge
