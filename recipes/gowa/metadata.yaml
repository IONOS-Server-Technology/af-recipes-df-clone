id: gowa
enabled: false
display_name: GoWA
description: WhatsApp REST API and web interface for multi-device messaging automation.
short_description:
  en: "Send and receive WhatsApp messages from your own server — GoWA bridges WhatsApp Web to a REST API with a built-in management dashboard."
  de: "WhatsApp-Nachrichten vom eigenen Server senden und empfangen — GoWA verbindet WhatsApp Web mit einer REST-API und einem integrierten Dashboard."
  es: "Envía y recibe mensajes de WhatsApp desde tu propio servidor — GoWA conecta WhatsApp Web a una API REST con un panel de gestión integrado."
  fr: "Envoyez et recevez des messages WhatsApp depuis votre propre serveur — GoWA relie WhatsApp Web à une API REST avec un tableau de bord intégré."
  it: "Invia e ricevi messaggi WhatsApp dal tuo server — GoWA collega WhatsApp Web a una REST API con una dashboard di gestione integrata."
  nl: "Stuur en ontvang WhatsApp-berichten vanaf je eigen server — GoWA verbindt WhatsApp Web met een REST API en een ingebouwd beheerdashboard."
  pl: "Wysyłaj i odbieraj wiadomości WhatsApp z własnego serwera — GoWA łączy WhatsApp Web z REST API i wbudowanym panelem zarządzania."
categories:
  - automation
  - communication
app_version: "v9.0.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/aldinokemal/go-whatsapp-web-multidevice
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/gowa/0.2.0/logo.svg
logo_source: https://github.com/aldinokemal/go-whatsapp-web-multidevice/raw/main/gallery/gowa.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 3907a51842361ce2794cba470a56fd34b672c41bee79b2af357b13ebec3205b8

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 3000
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: GoWA Web UI and REST API
