display_name: LNbits
description: Self-hosted Lightning wallet with tip jars, paywalls, and creator subscriptions.
short_description:
  en: "Manage Lightning wallets, accept Bitcoin tips and payments, and build paywalls or subscription links — all self-hosted."
  de: "Lightning-Wallets verwalten, Bitcoin-Tips und Zahlungen empfangen sowie Paywalls oder Abonnement-Links erstellen — alles selbst gehostet."
  es: "Gestiona wallets Lightning, acepta propinas y pagos en Bitcoin, y crea paywalls o enlaces de suscripción — todo autoalojado."
  fr: "Gérez des portefeuilles Lightning, acceptez des pourboires et paiements Bitcoin, et créez des paywalls ou liens d'abonnement — auto-hébergé."
  it: "Gestisci portafogli Lightning, accetta mance e pagamenti Bitcoin e crea paywall o link di abbonamento — tutto self-hosted."
  nl: "Beheer Lightning-wallets, ontvang Bitcoin-tips en betalingen, en maak paywalls of abonnementslinks — volledig zelf gehost."
  pl: "Zarządzaj portfelami Lightning, przyjmuj napiwki i płatności Bitcoin oraz twórz paywalle i linki subskrypcyjne — wszystko self-hosted."
