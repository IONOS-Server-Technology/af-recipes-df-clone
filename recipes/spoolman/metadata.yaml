id: spoolman
enabled: false
display_name: Spoolman
description: 3D printing filament spool tracker with inventory management and QR code labels.
short_description:
  en: "Track your 3D printing filament spools, monitor remaining material, and generate QR labels — all on your own server."
  de: "3D-Druck-Filamentspulen verwalten, verbleibende Mengen überwachen und QR-Labels erstellen — auf dem eigenen Server."
  es: "Gestiona tus bobinas de filamento para impresión 3D, controla el material restante y genera etiquetas QR en tu propio servidor."
  fr: "Gérez vos bobines de filament pour impression 3D, suivez les quantités restantes et générez des étiquettes QR sur votre serveur."
  it: "Tieni traccia delle bobine di filamento per la stampa 3D, monitora il materiale rimasto e genera etichette QR sul tuo server."
  nl: "Beheer je 3D-print filamentspolen, controleer resterende hoeveelheden en maak QR-labels aan op je eigen server."
  pl: "Zarządzaj szpulami filamentu do druku 3D, monitoruj pozostały materiał i generuj etykiety QR na własnym serwerze."
categories:
  - utilities
  - home
app_version: "0.26.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/Donkie/Spoolman
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/spoolman/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/spoolman.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 271b631d0288367c7a9db6481292150ae3c8153cc71264b6ba544e6c02868111

app_min_ram_mb: 256
app_min_disk_mb: 2048

# Spoolman has no authentication of its own; upstream wiki explicitly warns about this
# and recommends securing it before exposure. basic_auth: true gates access via
# Traefik using the server password, matching the pattern used by n8n and Open WebUI.
ports:
  - port: 8000
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: Spoolman Web UI
