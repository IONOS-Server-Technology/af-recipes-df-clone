id: cloudreve
enabled: false
display_name: Cloudreve
description: Self-hosted cloud storage platform with file management and sharing capabilities.
short_description:
  en: "Self-hosted personal cloud drive with web upload, folder browsing, share links, and multi-user accounts."
  de: "Selbst gehosteter persönlicher Cloud-Speicher mit Web-Upload, Ordnerverwaltung, Freigabelinks und Mehrbenutzerkonten."
  es: "Almacenamiento en la nube personal autoalojado con carga web, exploración de carpetas, enlaces para compartir y cuentas multiusuario."
  fr: "Stockage cloud personnel auto-hébergé avec upload web, navigation dans les dossiers, liens de partage et comptes multi-utilisateurs."
  it: "Archiviazione cloud personale self-hosted con upload web, navigazione cartelle, link di condivisione e account multi-utente."
  nl: "Zelf-gehoste persoonlijke cloudopslag met web-upload, mapnavigatie, deellinks en meerdere gebruikersaccounts."
  pl: "Własny osobisty serwer chmury z przesyłaniem plików, przeglądaniem folderów, linkami do udostępniania i wieloma kontami użytkowników."
categories:
  - productivity
  - media
app_version: "v4"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/cloudreve/cloudreve
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/cloudreve/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/cloudreve.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 9cd406d32e63f326727f8d3ecc6c6dec8f68dc5cc78016705f114ad3966498f5

app_min_ram_mb: 512
app_min_disk_mb: 5120

# Port 5212 is Cloudreve's default web UI port.
#
# basic_auth: not set — Cloudreve has its own user account system; the customer
# would face two prompts if basic_auth were enabled (RFC-001 §4.3.1).
# Trade-off to document: the first visitor to the web UI registers as instance
# administrator (same first-user window as n8n). Unlike n8n, Cloudreve is not
# webhook-driven, so basic_auth could be set at lower cost — but since the app
# provides real authentication for all subsequent access, the app's own login
# is the correct access control boundary. Task 2 should note this window in
# the install documentation.
ports:
  - port: 5212
    protocol: tcp
    public: true
    description: Cloudreve Web UI
