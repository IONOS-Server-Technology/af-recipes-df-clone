id: manyfold
enabled: false
display_name: Manyfold
description: Self-hosted 3D printing model library manager with tagging, search, and print job integrations.
short_description:
  en: "Organise and browse your 3D printing model library on your own server — with tagging, search, and OctoPrint integrations."
  de: "3D-Druckmodell-Bibliothek auf dem eigenen Server verwalten und durchsuchen — mit Tagging, Suche und OctoPrint-Integration."
  es: "Organiza y explora tu biblioteca de modelos de impresión 3D en tu propio servidor — con etiquetas, búsqueda e integraciones con OctoPrint."
  fr: "Organisez et parcourez votre bibliothèque de modèles d'impression 3D sur votre serveur — avec étiquettes, recherche et intégrations OctoPrint."
  it: "Organizza e sfoglia la tua libreria di modelli per stampa 3D sul tuo server — con tag, ricerca e integrazione OctoPrint."
  nl: "Beheer en doorzoek je 3D-printmodelbibliotheek op je eigen server — met tags, zoekfunctie en OctoPrint-integraties."
  pl: "Zarządzaj i przeglądaj bibliotekę modeli do druku 3D na własnym serwerze — z tagowaniem, wyszukiwaniem i integracjami OctoPrint."
categories:
  - media
app_version: "v0.147.1"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/manyfold3d/manyfold
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/manyfold/0.2.0/logo.svg
logo_source: https://manyfold.app/images/roundel.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 07afca021950213d366f4249b0fefa1d042547ddcdb8e92c64abd9f7622d6360

app_min_ram_mb: 2048
app_min_disk_mb: 20480

# basic_auth: Manyfold's admin account is created through a first-visit web setup
# wizard — identical to the Immich pattern (IF-1312). Before setup completes the
# admin sign-up endpoint is open, so an unclaimed instance can be taken over by
# anyone who reaches the URL first. Once the customer's own account exists they
# remove the prompt with '/root/auth.sh off manyfold'. Multiuser mode is opt-in
# via MULTIUSER env var; the app does authenticate its own users after setup, so
# this flag should be reviewed at that point if the webhook/API trade-off matters.
ports:
  - port: 3214
    protocol: tcp
    public: true
    basic_auth: true
    description: Manyfold Web UI
