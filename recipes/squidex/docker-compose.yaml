services:
  squidex:
    image: squidex/squidex:7
    restart: unless-stopped
    environment:
      - URLS__BASEURL=https://${AF_APP_DOMAIN}/
      - ASPNETCORE_URLS=http://+:80
      - EVENTSTORE__MONGODB__CONFIGURATION=mongodb://squidex:${MONGO_PASSWORD}@mongo:27017/squidex?authSource=admin
      - STORE__MONGODB__CONFIGURATION=mongodb://squidex:${MONGO_PASSWORD}@mongo:27017/squidex?authSource=admin
    ports:
      - "80:80"
    volumes:
      - /opt/squidex/assets:/app/Assets
    networks:
      - squidex-network
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  mongo:
    image: mongo:6
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=squidex
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - /opt/squidex/mongo:/data/db
    networks:
      - squidex-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand({ping:1})' --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  squidex-network:
    driver: bridge
