id: squidex
enabled: false
display_name: Squidex
description: Open-source headless CMS with GraphQL and REST APIs for structured content management.
short_description:
  en: "Manage and deliver content through GraphQL and REST APIs on your own server — a headless CMS for developers and content teams."
  de: "Inhalte per GraphQL und REST APIs über den eigenen Server verwalten und ausliefern — headloses CMS für Entwickler und Content-Teams."
  es: "Gestiona y entrega contenido a través de GraphQL y REST APIs en tu propio servidor — un CMS headless para desarrolladores y equipos de contenido."
  fr: "Gérez et diffusez du contenu via des API GraphQL et REST sur votre propre serveur — un CMS headless pour développeurs et équipes de contenu."
  it: "Gestisci e distribuisci contenuti tramite API GraphQL e REST sul tuo server — un CMS headless per sviluppatori e team di contenuto."
  nl: "Beheer en lever content via GraphQL en REST API's op je eigen server — een headless CMS voor ontwikkelaars en contentteams."
  pl: "Zarządzaj i udostępniaj treści przez API GraphQL i REST na własnym serwerze — bezgłowy CMS dla programistów i zespołów contentowych."
categories:
  - developer-tools
app_version: "7"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/Squidex/squidex
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/squidex/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/Squidex/squidex/master/media/logo-squared.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 61e04cc64c960be435b1b992f23eec4661a4c2a70c4565c17c4e5d3a9535e128

app_min_ram_mb: 2048
app_min_disk_mb: 20480

ports:
  - port: 80
    protocol: tcp
    public: true
    description: Squidex Web UI

parameters:
  - name: MONGO_PASSWORD
    display_name: MongoDB Password
    type: password
    description: MongoDB internal database password.
