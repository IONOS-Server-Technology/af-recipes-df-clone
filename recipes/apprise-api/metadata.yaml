id: apprise-api
enabled: false
display_name: Apprise API
description: Lightweight REST API gateway for sending push notifications to 120+ services via a single HTTP endpoint.
short_description:
  en: "Route notifications to Slack, Discord, Telegram, email and 120+ other services from a single self-hosted REST API endpoint."
  de: "Benachrichtigungen an Slack, Discord, Telegram, E-Mail und 120+ andere Dienste über einen einzigen selbstgehosteten REST-API-Endpunkt senden."
  es: "Enruta notificaciones a Slack, Discord, Telegram, correo electrónico y más de 120 servicios desde un único endpoint REST autoalojado."
  fr: "Routez des notifications vers Slack, Discord, Telegram, e-mail et plus de 120 services depuis un unique point d'entrée REST auto-hébergé."
  it: "Instrada notifiche a Slack, Discord, Telegram, email e oltre 120 altri servizi da un singolo endpoint REST self-hosted."
  nl: "Stuur notificaties naar Slack, Discord, Telegram, e-mail en 120+ andere diensten via één zelf-gehost REST API-eindpunt."
  pl: "Kieruj powiadomienia do Slacka, Discorda, Telegrama, e-maila i ponad 120 innych serwisów z jednego własnego punktu końcowego REST API."
categories:
  - automation
  - communication
app_version: "v1.5.2"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/caronc/apprise-api
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/apprise-api/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/caronc/apprise-api/master/apprise_api/api/templates/icons/apprise-logo.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 66aa76823b6aafbcfdd1b5977eec81d12b8aa637ae6fcc18d007cf2d4b1b02e8

app_min_ram_mb: 256
app_min_disk_mb: 1024

# basic_auth (RFC-001 §4.3.1): Apprise API ships with no built-in authentication —
# upstream docs explicitly delegate auth to the reverse proxy. Without a gate the URL
# is an open notification relay and an open config-management UI. The Traefik
# basic-auth gate closes that window and is fully expressible via the platform's
# root-password-hash mechanism. The customer removes the gate with
# '/root/auth.sh off apprise-api' if inbound webhook callers (e.g. Uptime Kuma,
# n8n) cannot send Basic Auth credentials.
ports:
  - port: 8000
    protocol: tcp
    public: true
    basic_auth: true
    description: Apprise API Web UI and REST API
