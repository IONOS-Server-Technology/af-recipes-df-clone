services:
  web-check:
    image: lissy93/web-check:2.2.2
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - web-check-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  web-check-network:
    driver: bridge
