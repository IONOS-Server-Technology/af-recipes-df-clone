id: web-check
enabled: false
display_name: Web-Check
description: OSINT tool for comprehensive website security analysis, covering DNS, SSL, headers, open ports, and tech stack.
short_description:
  en: "Point-and-shoot website security analysis — inspect DNS, SSL, open ports, and tech stack without sending targets to a third-party service."
  de: "Website-Sicherheitsanalyse auf einen Klick — DNS, SSL, offene Ports und Tech-Stack prüfen, ohne Zieldomains an Dritte weiterzugeben."
  es: "Análisis de seguridad web a golpe de clic — inspecciona DNS, SSL, puertos y tecnología sin enviar los dominios objetivo a servicios de terceros."
  fr: "Analyse de sécurité web en un clic — inspectez DNS, SSL, ports ouverts et stack technique sans transmettre vos cibles à un service tiers."
  it: "Analisi di sicurezza web in un clic — esamina DNS, SSL, porte aperte e tech stack senza inviare i tuoi target a servizi di terze parti."
  nl: "Website-beveiligingsanalyse met één klik — inspecteer DNS, SSL, open poorten en tech stack zonder doeldomeinen naar een derde partij te sturen."
  pl: "Analiza bezpieczeństwa witryn jednym kliknięciem — sprawdzaj DNS, SSL, otwarte porty i stos technologiczny bez wysyłania celów do zewnętrznych usług."
categories:
  - security
  - networking
  - developer-tools
app_version: "2.2.2"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/Lissy93/web-check
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/web-check/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/web-check.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 7f6aa5f003021da7c3989874f7f1d37e51c7921b745ddb3370fc20673af72fa8

app_min_ram_mb: 256
app_min_disk_mb: 2048

# Web-Check has no built-in authentication — by design, it runs fully stateless
# with no accounts or login screen. basic_auth: true gates the UI behind the
# customer's server password (Traefik basic auth, username: admin). This is
# required because leaving it open would allow anyone to use the customer's
# server as an OSINT scanning proxy against arbitrary targets.
ports:
  - port: 3000
    protocol: tcp
    public: true
    basic_auth: true
    description: Web-Check web UI
