id: fleet
enabled: false
display_name: Fleet
description: Open-source device management and endpoint security platform powered by osquery.
short_description:
  en: "Manage and monitor all your devices from one place — Fleet delivers real-time host inventory, policy compliance, and vulnerability data via osquery."
  de: "Geräte zentral verwalten und überwachen — Fleet liefert Echtzeit-Inventar, Richtlinienkonformität und Schwachstellendaten per osquery."
  es: "Gestione todos sus dispositivos desde un único lugar — Fleet ofrece inventario, cumplimiento de políticas y datos de vulnerabilidad via osquery."
  fr: "Gérez et surveillez tous vos appareils depuis un seul tableau de bord — Fleet fournit inventaire, conformité et données de vulnérabilité via osquery."
  it: "Gestisci e monitora i tuoi dispositivi in un unico posto — Fleet offre inventario real-time, conformità alle policy e dati sulle vulnerabilità via osquery."
  nl: "Beheer en monitor al uw apparaten vanuit één dashboard — Fleet levert realtime inventaris, beleidsconformiteit en kwetsbaarheidsdata via osquery."
  pl: "Zarządzaj wszystkimi urządzeniami z jednego miejsca — Fleet dostarcza inwentarz w czasie rzeczywistym, zgodność z politykami i dane o lukach via osquery."
categories:
  - security
  - monitoring
app_version: "v4.90.1"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/fleetdm/fleet
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/fleet/0.2.0/logo.svg
logo_source: https://fleetdm.com/images/press-kit/fleet-logo-mark.svg
logo_license: trademark-nominative-fair-use
logo_sha256: af837c1f08e391f1335323ecf907bc2b9bddf254b5122da596d8ca0319a73f98

app_min_ram_mb: 2048
app_min_disk_mb: 20480

ports:
  - port: 1337
    protocol: tcp
    public: true
    description: Fleet Web UI

parameters:
  - name: MYSQL_ROOT_PASSWORD
    display_name: MySQL Root Password
    type: password
    description: Root password for the MySQL database server.

  - name: MYSQL_PASSWORD
    display_name: MySQL User Password
    type: password
    description: Password for the Fleet MySQL database user.

  - name: FLEET_SERVER_PRIVATE_KEY
    display_name: Fleet Server Private Key
    type: password
    description: Private key used by the Fleet server for signing operations.
