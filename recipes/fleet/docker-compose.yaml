services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=fleet
      - MYSQL_USER=fleet
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - /opt/fleet/mysql:/var/lib/mysql
    cap_add:
      - SYS_NICE
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u fleet -p$$MYSQL_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:6-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - /opt/fleet/redis:/data
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  fleet-init:
    image: alpine:3.20
    volumes:
      - /opt/fleet/data:/data
      - /opt/fleet/logs:/logs
      - /opt/fleet/vulndb:/vulndb
    command: sh -c "chown -R 100:101 /data /logs /vulndb"

  fleet:
    image: fleetdm/fleet:v4.90.1
    restart: unless-stopped
    command: sh -c "/usr/bin/fleet prepare db --no-prompt && /usr/bin/fleet serve"
    environment:
      - FLEET_REDIS_ADDRESS=redis:6379
      - FLEET_MYSQL_ADDRESS=mysql:3306
      - FLEET_MYSQL_DATABASE=fleet
      - FLEET_MYSQL_USERNAME=fleet
      - FLEET_MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - FLEET_SERVER_ADDRESS=0.0.0.0:1337
      - FLEET_SERVER_TLS=false
      - FLEET_SERVER_PRIVATE_KEY=${FLEET_SERVER_PRIVATE_KEY}
      - FLEET_VULNERABILITIES_DATABASES_PATH=/vulndb
    ports:
      - "1337:1337"
    volumes:
      - /opt/fleet/data:/fleet
      - /opt/fleet/logs:/logs
      - /opt/fleet/vulndb:/vulndb
    networks:
      - fleet-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      fleet-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1337/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

networks:
  fleet-network:
    driver: bridge
