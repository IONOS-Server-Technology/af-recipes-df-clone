id: the-lounge
enabled: false
display_name: The Lounge
description: Self-hosted, always-on web IRC client.
short_description:
  en: "Stay always connected to IRC — The Lounge runs on your server and keeps your chat sessions alive 24/7."
  de: "Immer mit IRC verbunden bleiben — The Lounge läuft auf deinem Server und hält Chat-Sitzungen rund um die Uhr aktiv."
  es: "Mantente siempre conectado a IRC — The Lounge corre en tu servidor y mantiene tus sesiones de chat activas las 24 horas."
  fr: "Restez toujours connecté à IRC — The Lounge tourne sur votre serveur et maintient vos sessions de chat actives 24h/24."
  it: "Rimani sempre connesso a IRC — The Lounge gira sul tuo server e mantiene le sessioni di chat attive 24 ore su 24."
  nl: "Blijf altijd verbonden met IRC — The Lounge draait op je server en houdt je chatsessies 24/7 actief."
  pl: "Pozostań zawsze połączony z IRC — The Lounge działa na Twoim serwerze i utrzymuje sesje czatu aktywne przez całą dobę."
categories:
  - communication
app_version: "4.5.2"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/thelounge/thelounge
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/the-lounge/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/thelounge/thelounge/master/client/public/img/icon-black-transparent-bg.svg
logo_license: trademark-nominative-fair-use
logo_sha256: b9695aea3cfcdedab33e2e5b4d542529e4045a3d53e1fc8f03b658f24b390945

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 9000
    protocol: tcp
    public: true
    description: The Lounge Web UI

parameters:
  # ADMIN_PASSWORD_HASH is a bcrypt hash of the customer's server password (ROOT_PASSWORD),
  # written by install.sh into ${THELOUNGE_HOME}/users/<name>.json — the same file that
  # `thelounge add` / `thelounge reset` would produce. The plaintext never leaves af-api.
  - name: ADMIN_PASSWORD_HASH
    display_name: Admin Password Hash
    type: password
    generated_from: "bcrypt:ROOT_PASSWORD"
    description: "Bcrypt hash of the admin user's login password. Written to the user config file by install.sh — log in with your server password."
