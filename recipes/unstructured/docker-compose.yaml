services:
  unstructured:
    image: quay.io/unstructured-io/unstructured-api:0.1.10
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - unstructured-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  unstructured-network:
    driver: bridge
