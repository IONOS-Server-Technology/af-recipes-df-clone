id: unstructured
enabled: false
display_name: Unstructured
description: Document processing REST API for parsing and chunking files into AI-ready structured elements.
short_description:
  en: "Parse PDFs, Office documents, images, and more into structured elements ready for RAG pipelines and LLM fine-tuning."
  de: "Verarbeite PDFs, Office-Dokumente, Bilder und mehr zu strukturierten Elementen für RAG-Pipelines und LLM-Training."
  es: "Analiza PDFs, documentos Office, imágenes y más en elementos estructurados listos para pipelines RAG y fine-tuning de LLM."
  fr: "Analysez des PDFs, documents Office, images et plus en éléments structurés prêts pour les pipelines RAG et le fine-tuning LLM."
  it: "Analizza PDF, documenti Office, immagini e altro in elementi strutturati pronti per pipeline RAG e fine-tuning LLM."
  nl: "Verwerk PDF's, Office-documenten, afbeeldingen en meer naar gestructureerde elementen voor RAG-pipelines en LLM fine-tuning."
  pl: "Przetwarzaj pliki PDF, dokumenty Office, obrazy i inne na ustrukturyzowane elementy gotowe do potoków RAG i fine-tuningu LLM."
categories:
  - ai
  - developer-tools
app_version: "0.1.10"
recipe_version: "0.3.0"
recipe_type: docker-compose
upstream_url: https://github.com/Unstructured-IO/unstructured-api
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/unstructured/0.3.0/logo.svg
logo_source: https://raw.githubusercontent.com/Unstructured-IO/unstructured-api/main/img/unstructured_logo.svg
logo_license: trademark-nominative-fair-use
logo_sha256: cf8451bfe45c17b641933836e4370e094da4c6a515c8f010178908fc45de3c2d

app_min_ram_mb: 512
app_min_disk_mb: 4096

ports:
  - port: 8000
    protocol: tcp
    public: true
    http: true
    basic_auth: true
    description: Unstructured API
