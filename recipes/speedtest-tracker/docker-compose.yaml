services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:1.14.7
    restart: unless-stopped
    environment:
      - APP_KEY=${APP_KEY}
      - ADMIN_EMAIL=admin@localhost
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DB_CONNECTION=sqlite
    ports:
      - "80:80"
    volumes:
      - /opt/speedtest-tracker/data:/config
    networks:
      - speedtest-tracker-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  speedtest-tracker-network:
    driver: bridge
