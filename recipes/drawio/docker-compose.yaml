services:
  drawio:
    image: jgraph/drawio:31.3.2
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - drawio-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  drawio-network:
    driver: bridge
