id: drawio
enabled: false
display_name: draw.io
description: Open-source diagramming tool for flowcharts, UML, network diagrams, and org charts.
short_description:
  en: "Create and share flowcharts, UML diagrams, and network maps with a self-hosted, open-source diagramming tool."
  de: "Flussdiagramme, UML-Diagramme und Netzwerkkarten erstellen und teilen — mit einem selbstgehosteten Open-Source-Tool."
  es: "Crea y comparte diagramas de flujo, UML y mapas de red con una herramienta de diagramación de código abierto autoalojada."
  fr: "Créez et partagez des diagrammes de flux, UML et cartes réseau avec un outil de diagramme open-source auto-hébergé."
  it: "Crea e condividi diagrammi di flusso, UML e mappe di rete con uno strumento di diagrammazione open-source self-hosted."
  nl: "Maak en deel stroomschema's, UML-diagrammen en netwerkkaarten met een zelf-gehoste, open-source diagrammatool."
  pl: "Twórz i udostępniaj schematy blokowe, diagramy UML i mapy sieci za pomocą samodzielnie hostowanego narzędzia open-source."
categories:
  - productivity
  - developer-tools
app_version: "31.3.2"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/jgraph/drawio
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/drawio/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/draw-io.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 1e56bbc812d45d84fda06650484e627d9bd1184887726db0948bb227a9d80120

app_min_ram_mb: 512
app_min_disk_mb: 2048

# basic_auth: draw.io has no built-in authentication — the editor is fully client-side
# and diagrams are saved locally or to optional third-party integrations (Google Drive,
# OneDrive, GitHub). Without a gate, the editor would be reachable unauthenticated on
# the public internet. basic_auth: true fronts it with the customer's server password
# via Traefik — the same pattern used by n8n and other no-login apps in this catalogue.
ports:
  - port: 8080
    protocol: tcp
    public: true
    basic_auth: true
    description: draw.io Web UI
