id: spliit
enabled: false
display_name: Spliit
description: Open-source Splitwise alternative for tracking and splitting group expenses.
short_description:
  en: "Track and split shared expenses with friends or housemates — a self-hosted Splitwise alternative with no account required."
  de: "Gemeinsame Ausgaben mit Freunden oder Mitbewohnern verfolgen und aufteilen — eine selbst gehostete Splitwise-Alternative ohne Konto."
  es: "Registra y divide gastos compartidos con amigos o compañeros de piso — una alternativa a Splitwise autoalojada sin cuenta necesaria."
  fr: "Suivez et partagez les dépenses communes avec vos amis ou colocataires — une alternative auto-hébergée à Splitwise sans compte requis."
  it: "Tieni traccia e suddividi le spese condivise con amici o coinquilini — un'alternativa self-hosted a Splitwise senza account."
  nl: "Bijhouden en verdelen van gedeelde uitgaven met vrienden of huisgenoten — een zelf-gehoste Splitwise-alternatief zonder account."
  pl: "Śledź i dziel wspólne wydatki ze znajomymi lub współlokatorami — samodzielnie hostowana alternatywa dla Splitwise bez konta."
categories:
  - finance
  - productivity
app_version: "1.19.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/spliit-app/spliit
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/spliit/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/spliit.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 2af46225c493bd0bc48bf120d8f209b4a59f54319df971ee9194f2700d18155f

app_min_ram_mb: 2048
app_min_disk_mb: 20480

# basic_auth: Spliit has no built-in login or account system — any user who knows
# the group URL can view and edit expenses. basic_auth gates the entire frontend
# with the server password so the instance is not open to the internet by default.
# The trade-off (inbound webhooks blocked) does not apply here — Spliit has no
# webhook surface, so there is no cost to leaving it on.
ports:
  - port: 3000
    protocol: tcp
    public: true
    basic_auth: true
    description: Spliit Web UI

parameters:
  - name: POSTGRES_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password generated by install.sh.
