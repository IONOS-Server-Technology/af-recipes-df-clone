id: stirling-pdf
enabled: false
display_name: Stirling PDF
description: Locally hosted web-based PDF manipulation tool with 50+ operations including merge, split, convert, OCR, and signing.
short_description:
  en: "Merge, split, convert, compress, OCR, sign, and redact PDFs — all server-side, all on your own infrastructure."
  de: "PDFs zusammenführen, teilen, konvertieren, komprimieren, OCR, signieren und schwärzen — serverseitig, auf eigener Infrastruktur."
  es: "Combina, divide, convierte, comprime, aplica OCR, firma y redacta PDFs — todo en el servidor, en tu propia infraestructura."
  fr: "Fusionnez, divisez, convertissez, compressez, appliquez l'OCR, signez et caviardez des PDFs — côté serveur, sur votre propre infrastructure."
  it: "Unisci, dividi, converti, comprimi, OCR, firma e oscura PDF — tutto lato server, sulla tua infrastruttura."
  nl: "Voeg samen, splits, converteer, comprimeer, OCR, onderteken en anonimiseer PDF's — server-side, op je eigen infrastructuur."
  pl: "Łącz, dziel, konwertuj, kompresuj, OCR, podpisuj i redaguj pliki PDF — wszystko po stronie serwera, na własnej infrastrukturze."
categories:
  - productivity
  - utilities
app_version: "2.14.2"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/Stirling-Tools/Stirling-PDF
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/stirling-pdf/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/Stirling-Tools/Stirling-PDF/main/app/core/src/main/resources/static/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 85c9f60b2bd8b4b72feb2d1c6495efd126b22792ff2b4267c2dd820abcee595f

app_min_ram_mb: 1024
app_min_disk_mb: 5120

# basic_auth: Stirling PDF is deployed with SECURITY_ENABLELOGIN=false (the upstream's own
# reference compose file for reverse-proxy deployments), so it has no built-in login.
# basic_auth: true gates the entire subdomain with the customer's server password via
# Traefik — the same Adminer/draw.io/WUD pattern. This sidesteps the plaintext-only
# initial-admin-password constraint (SECURITY_INITIALLOGIN_PASSWORD cannot be expressed
# via generated_from) by simply not enabling the app's own auth at all.
ports:
  - port: 8080
    protocol: tcp
    public: true
    basic_auth: true
    description: Stirling PDF Web UI
