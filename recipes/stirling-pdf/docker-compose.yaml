services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:2.14.2
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Disable built-in login — the whole subdomain is gated by Traefik basic_auth instead.
      SECURITY_ENABLELOGIN: "false"
      DOCKER_ENABLE_SECURITY: "false"
    volumes:
      - /opt/stirling-pdf/configs:/configs
      - /opt/stirling-pdf/logs:/logs
    networks:
      - stirling-pdf-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  stirling-pdf-network:
    driver: bridge
