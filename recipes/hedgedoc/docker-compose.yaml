services:
  hedgedoc:
    image: quay.io/hedgedoc/hedgedoc:1.11.1
    restart: unless-stopped
    environment:
      - CMD_DOMAIN=${AF_APP_DOMAIN}
      - CMD_PROTOCOL_USESSL=true
      - CMD_URL_ADDPORT=false
      - CMD_DB_URL=postgres://hedgedoc:${POSTGRES_PASSWORD}@postgres:5432/hedgedoc
      - CMD_SESSION_SECRET=${SESSION_SECRET}
    ports:
      - "3000:3000"
    volumes:
      - /opt/hedgedoc/uploads:/hedgedoc/public/uploads
    networks:
      - hedgedoc-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    labels:
      - "wud.watch=false"
    environment:
      - POSTGRES_DB=hedgedoc
      - POSTGRES_USER=hedgedoc
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - /opt/hedgedoc/postgres:/var/lib/postgresql/data
    networks:
      - hedgedoc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hedgedoc -d hedgedoc"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  hedgedoc-network:
    driver: bridge
