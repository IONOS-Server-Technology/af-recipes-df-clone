id: papra
enabled: false
display_name: Papra
description: Minimalistic open-source document management and archiving platform.
short_description:
  en: "Archive, search and tag your documents with a self-hosted, single-container document management system."
  de: "Dokumente archivieren, durchsuchen und taggen — mit einem selbst gehosteten, schlanken Dokumentenmanagementsystem."
  es: "Archiva, busca y etiqueta tus documentos con un sistema de gestión documental autoalojado y de contenedor único."
  fr: "Archivez, recherchez et étiquetez vos documents avec un système de gestion documentaire auto-hébergé monoconteneur."
  it: "Archivia, cerca e tagga i tuoi documenti con un sistema di gestione documentale self-hosted in un solo contenitore."
  nl: "Archiveer, doorzoek en tag je documenten met een zelf-gehoste documentbeheersysteem in één container."
  pl: "Archiwizuj, przeszukuj i taguj dokumenty w samodzielnie hostowanym systemie zarządzania dokumentami w jednym kontenerze."
categories:
  - productivity
app_version: "26.6.1"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/papra-hq/papra
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/papra/0.2.0/logo.svg
logo_source: https://papra.app/favicon.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 3b5d7416b47031b60d47bf7ecaf63a0ec5ad10f0035743eb4856d1c7a026021b

app_min_ram_mb: 256
app_min_disk_mb: 5120

ports:
  - port: 1221
    protocol: tcp
    public: true
    description: Papra Web UI

parameters:
  - name: AUTH_SECRET
    display_name: Auth Secret
    type: password
    description: Secret key used for authentication token signing. Generated automatically at install time.
