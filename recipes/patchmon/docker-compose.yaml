services:
  server:
    image: ghcr.io/patchmon/patchmon-server:2.0.2
    restart: unless-stopped
    hostname: patchmon-server
    environment:
      - PORT=3000
      - CORS_ORIGIN=https://${AF_APP_DOMAIN}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - DATABASE_URL=postgresql://patchmon_user:${POSTGRES_PASSWORD}@database:5432/patchmon_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      - GUACD_ADDRESS=guacd:4822
    ports:
      - "3000:3000"
    networks:
      - patchmon-network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      guacd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=patchmon_db
      - POSTGRES_USER=patchmon_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - /opt/patchmon/postgres:/var/lib/postgresql/data
    networks:
      - patchmon-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchmon_user -d patchmon_db"]
      interval: 10s
      timeout: 5s
      retries: 7
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - patchmon-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    networks:
      - patchmon-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4822 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  patchmon-network:
    driver: bridge
