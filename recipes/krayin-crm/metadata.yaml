id: krayin-crm
enabled: false
display_name: Krayin CRM
description: Open-source Laravel CRM for leads, pipelines, quotes, and contact management.
short_description:
  en: "Manage leads, sales pipelines, contacts, and quotes with a self-hosted, MIT-licensed CRM built on Laravel."
  de: "Leads, Vertriebspipelines, Kontakte und Angebote verwalten — mit einem selbstgehosteten, MIT-lizenzierten CRM auf Laravel-Basis."
  es: "Gestiona clientes potenciales, pipelines de ventas, contactos y presupuestos con un CRM auto-alojado bajo licencia MIT."
  fr: "Gérez leads, pipelines de vente, contacts et devis avec un CRM auto-hébergé sous licence MIT construit sur Laravel."
  it: "Gestisci lead, pipeline di vendita, contatti e preventivi con un CRM self-hosted con licenza MIT basato su Laravel."
  nl: "Beheer leads, verkooppijplijnen, contacten en offertes met een zelf-gehoste, MIT-gelicentieerde CRM op Laravel."
  pl: "Zarządzaj leadami, pipeline sprzedaży, kontaktami i ofertami z samodzielnie hostowanym CRM na licencji MIT zbudowanym na Laravel."
categories:
  - productivity
app_version: "2.2.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/krayin/laravel-crm
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/krayin-crm/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/krayin/laravel-crm/2.2/packages/Webkul/Admin/src/Resources/assets/images/logo.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 71555d38d34b3f4a0262d6acd67bf1883617610483841bca5cc299dc04af7dce

app_min_ram_mb: 512
app_min_disk_mb: 20480

# basic_auth: the webkul/krayin image ships a hardcoded, non-overridable default admin
# login (admin@example.com / admin123) with no env var to change it. Traefik basic auth
# is the mandatory customer-facing auth boundary per the fixed-credential pattern
# (SCHEMA.md). The trade-off: external callers (e.g. API integrations) will receive a
# 401 until the customer disables it with `/root/auth.sh off krayin-crm`.
ports:
  - port: 80
    protocol: tcp
    public: true
    basic_auth: true
    description: Krayin CRM Web UI

parameters:
  - name: DB_PASSWORD
    display_name: Database Password
    type: password
    description: MySQL database password. Generated by install.sh at install time — no customer input required.
