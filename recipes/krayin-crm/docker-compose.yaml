services:
  krayin-crm:
    image: webkul/krayin:2.2.0
    restart: unless-stopped
    environment:
      - APP_URL=https://${AF_APP_DOMAIN}
      - DB_PASSWORD=${DB_PASSWORD}
    ports:
      - "80:80"
    volumes:
      - /opt/krayin-crm/mysql:/var/lib/mysql
      - /opt/krayin-crm/storage:/var/www/html/storage
    networks:
      - krayin-crm-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  krayin-crm-network:
    driver: bridge
