id: twenty
enabled: false
display_name: Twenty
description: Modern open-source CRM for managing customer relationships and sales pipelines.
short_description:
  en: "Manage contacts, deals, and sales pipelines on your own server — a self-hosted alternative to Salesforce and HubSpot."
  de: "Kontakte, Deals und Vertriebspipelines auf dem eigenen Server verwalten — eine selbstgehostete Alternative zu Salesforce und HubSpot."
  es: "Gestiona contactos, deals y pipelines de ventas en tu propio servidor — una alternativa autohospedada a Salesforce y HubSpot."
  fr: "Gérez contacts, affaires et pipelines commerciaux sur votre propre serveur — une alternative auto-hébergée à Salesforce et HubSpot."
  it: "Gestisci contatti, deal e pipeline di vendita sul tuo server — un'alternativa self-hosted a Salesforce e HubSpot."
  nl: "Beheer contacten, deals en verkooppipelines op je eigen server — een zelfgehost alternatief voor Salesforce en HubSpot."
  pl: "Zarządzaj kontaktami, transakcjami i lejkami sprzedaży na własnym serwerze — samodzielnie hostowana alternatywa dla Salesforce i HubSpot."
categories:
  - productivity
app_version: "${TAG:-latest}"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/twentyhq/twenty
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/twenty/0.2.0/logo.svg
logo_source: https://mintcdn.com/twenty/vG9yThgsV6f7S2k3/logo.svg?fit=max&auto=format&n=vG9yThgsV6f7S2k3&q=85&s=8c6cbd9599fa6e3dd24b6b737a4c8d49
logo_license: trademark-nominative-fair-use
logo_sha256: 08099dafd0afec66cd1e0596991fce7a3342bc1cb74d17dc935f7c29a0005fd3

app_min_ram_mb: 4096
app_min_disk_mb: 51200

# basic_auth: Twenty's self-service sign-up flow — exactly the same exposure as Immich.
# A fresh, unclaimed instance has its admin sign-up endpoint live and reachable by anyone
# who hits the URL before the customer's first visit, so the first visitor becomes the
# account owner. Behind the prompt, that endpoint is not reachable at all.
#
# What it costs: the Traefik router covers the full origin, including any API traffic
# from external integrations. The customer removes the prompt once their account is set up:
#
#     /root/auth.sh off twenty
#
# That command is named in the password prompt itself.
ports:
  - port: 3000
    protocol: tcp
    public: true
    basic_auth: true
    description: Twenty Web UI

# All three secrets are server_generated_no_customer_input — randomly generated by
# install.sh, not derived from ROOT_PASSWORD, matching the immich/Immich pattern.
parameters:
  - name: PG_DATABASE_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password for the Twenty database.

  - name: ENCRYPTION_KEY
    display_name: Encryption Key
    type: password
    description: Key used to encrypt sensitive data stored by Twenty.

  - name: APP_SECRET
    display_name: Application Secret
    type: password
    description: Secret key used for signing tokens and session data.
