id: taxhacker
enabled: false
display_name: TaxHacker
description: AI-powered accounting tool for processing receipts and invoices automatically.
short_description:
  en: "Scan receipts and invoices, let AI extract amounts and categories, and keep your finances organized — all on your own server."
  de: "Belege und Rechnungen scannen, Beträge und Kategorien per KI extrahieren und Finanzen verwalten — vollständig auf eigenem Server."
  es: "Escanea recibos y facturas, extrae importes y categorías con IA, y mantén tus finanzas organizadas — todo en tu propio servidor."
  fr: "Scannez reçus et factures, laissez l'IA extraire montants et catégories, et gérez vos finances — entièrement sur votre serveur."
  it: "Scansiona ricevute e fatture, estrai importi e categorie con l'IA, e tieni le finanze in ordine — tutto sul tuo server."
  nl: "Scan bonnen en facturen, laat AI bedragen en categorieën extraheren, en houd je financiën bij — volledig op je eigen server."
  pl: "Skanuj paragony i faktury, wyodrębniaj kwoty i kategorie za pomocą AI i zarządzaj finansami — wszystko na własnym serwerze."
categories:
  - productivity
  - finance
  - ai
app_version: "v0.8.5"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/vas3k/TaxHacker
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/taxhacker/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/vas3k/TaxHacker/main/public/macos-dock-icon.png
logo_license: trademark-nominative-fair-use
logo_sha256: bd55e0f5f9e6144f492cd8a08feb017455f9c6c87e3382114703c0f5d62e6860

app_min_ram_mb: 2048
app_min_disk_mb: 20480

ports:
  - port: 7331
    protocol: tcp
    public: true
    basic_auth: true
    description: TaxHacker Web UI

parameters:
  - name: POSTGRES_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password.

  - name: BETTER_AUTH_SECRET
    display_name: Auth Secret Key
    type: password
    description: Secret key for signing authentication tokens.
