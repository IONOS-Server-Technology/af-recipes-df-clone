id: donetick
enabled: false
display_name: Donetick
description: Collaborative task and chore manager with scheduling, rotation, and mobile app support.
short_description:
  en: "Manage household chores and recurring tasks with natural-language scheduling, rotation, and mobile apps."
  de: "Haushaltsaufgaben und wiederkehrende To-dos mit natürlicher Sprache, Rotation und mobilen Apps verwalten."
  es: "Gestiona tareas del hogar y responsabilidades recurrentes con programación en lenguaje natural y apps móviles."
  fr: "Gérez les tâches ménagères et les responsabilités récurrentes avec planification en langage naturel et applications mobiles."
  it: "Gestisci i compiti domestici e le responsabilità ricorrenti con pianificazione in linguaggio naturale e app mobili."
  nl: "Beheer huishoudelijke taken en terugkerende verantwoordelijkheden met taakplanning in gewone taal en mobiele apps."
  pl: "Zarządzaj obowiązkami domowymi i cyklicznymi zadaniami z planowaniem w języku naturalnym i aplikacjami mobilnymi."
categories:
  - productivity
  - home
app_version: "v0.1.76"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/donetick/donetick
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/donetick/0.2.0/logo.svg
logo_source: https://raw.githubusercontent.com/donetick/donetick/develop/assets/logo.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 8450cfa58c1069016ef18fcdef627d66092fd8eadf9a1ca5d0c81b13a7ecd7f7

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 2021
    protocol: tcp
    public: true
    description: Donetick Web UI

parameters:
  # JWT_SECRET is generated by install.sh at first boot — a 32+ character random key
  # used to sign session tokens. Nothing customer-facing reads this value, so it is
  # generated server-side with no customer input (same pattern as n8n's N8N_ENCRYPTION_KEY).
  - name: JWT_SECRET
    display_name: JWT Secret
    type: password
    description: Secret key for signing JWT session tokens. Generated automatically at install time.
