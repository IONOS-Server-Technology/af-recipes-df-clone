services:
  hister:
    image: ghcr.io/asciimoo/hister:v0.17.0
    restart: unless-stopped
    ports:
      - "4433:4433"
    volumes:
      - /opt/hister/data:/data
    networks:
      - hister-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4433/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  hister-network:
    driver: bridge
