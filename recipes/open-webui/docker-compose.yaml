services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.11.0
    restart: unless-stopped
    labels:
      - "wud.trigger.include=ntfy.notify,dockercompose.apply"
      - "wud.compose.file=/opt/open-webui/docker-compose.yml"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_URL=https://${AF_APP_DOMAIN}
    ports:
      - "8080"
    volumes:
      - /opt/open-webui/data:/app/backend/data
    networks:
      - open-webui-network
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ollama:
    image: ollama/ollama:0.32.5
    restart: unless-stopped
    # Independently versioned backend; watched so its updates can be applied too.
    labels:
      - "wud.trigger.include=ntfy.notify,dockercompose.apply"
      - "wud.compose.file=/opt/open-webui/docker-compose.yml"
    volumes:
      - /opt/open-webui/ollama:/root/.ollama
    networks:
      - open-webui-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  open-webui-network:
    driver: bridge
