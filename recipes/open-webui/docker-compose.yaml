services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.9.2
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_URL=https://${APP_DOMAIN}
    ports:
      - "3004:8080"
    volumes:
      - /opt/open-webui/data:/app/backend/data
    networks:
      - open-webui-network
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ollama:
    image: ollama/ollama:0.7.1
    restart: unless-stopped
    volumes:
      - /opt/open-webui/ollama:/root/.ollama
    networks:
      - open-webui-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11434/api/tags > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  open-webui-network:
    driver: bridge
