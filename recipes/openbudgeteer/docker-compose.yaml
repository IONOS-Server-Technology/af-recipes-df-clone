services:
  openbudgeteer:
    image: axelander/openbudgeteer:1.11
    restart: unless-stopped
    environment:
      - CONNECTION_PROVIDER=mariadb
      - CONNECTION_SERVER=mariadb
      - CONNECTION_PORT=3306
      - CONNECTION_DATABASE=openbudgeteer
      - CONNECTION_USER=openbudgeteer
      - CONNECTION_PASSWORD=${DB_PASSWORD}
      - REDIS_CONNECTION=redis,password=${REDIS_PASSWORD},allowAdmin=true
      - APPSETTINGS_AUTH_ENABLED=false
    ports:
      - "8080:8080"
    networks:
      - openbudgeteer-network
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=openbudgeteer
      - MYSQL_USER=openbudgeteer
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - /opt/openbudgeteer/mariadb:/var/lib/mysql
    networks:
      - openbudgeteer-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - /opt/openbudgeteer/redis:/data
    networks:
      - openbudgeteer-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  openbudgeteer-network:
    driver: bridge
