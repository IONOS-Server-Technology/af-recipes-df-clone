services:
  mail-archiver:
    image: s1t5/mailarchiver:2607.5
    restart: unless-stopped
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=mailarchiver;Username=mailarchiver;Password=${POSTGRES_PASSWORD}
      - Authentication__Password=${APP_ADMIN_PASSWORD}
    ports:
      - "5000:5000"
    volumes:
      - /opt/mail-archiver/data:/app/data
    networks:
      - mail-archiver-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=mailarchiver
      - POSTGRES_USER=mailarchiver
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - /opt/mail-archiver/postgres:/var/lib/postgresql/data
    networks:
      - mail-archiver-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailarchiver -d mailarchiver"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  mail-archiver-network:
    driver: bridge
