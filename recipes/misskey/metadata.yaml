app_min_ram_mb: 2048
app_min_disk_mb: 20480


# basic_auth (IF-1312): a fresh Misskey instance has no admin account — the first user
# to register on an unclaimed instance becomes admin. The Traefik basic-auth gate
# (the customer's server password, hashed by the platform) ensures the customer is
# the one who reaches the signup form first, closing that takeover window.
#
# The upstream config documents an optional `setupPassword` config key aimed at hosted
# providers, but it is a plain-string-equality check (confirmed in source at
# packages/backend/src/server/api/endpoints/admin/accounts/create.ts) — it cannot
# carry a generated hash, so it cannot be used as a substitute for basic_auth here.
#
# What it costs: the basic-auth prompt covers the entire router, so API requests from
# ActivityPub federation peers also hit it while the gate is on. The customer disables
# it once their admin account exists:
#
#     /root/auth.sh off misskey
ports:
  - port: 3000
    protocol: tcp
    public: true
    basic_auth: true
    description: Misskey Web UI

parameters:
  - name: POSTGRES_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password for the Misskey database. Generated by install.sh.
