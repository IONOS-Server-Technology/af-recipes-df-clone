services:
  misskey:
    image: misskey/misskey:2026.7.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /opt/misskey/.config:/misskey/.config:ro
      - /opt/misskey/files:/misskey/files
    networks:
      - misskey-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - misskey-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=misskey
      - POSTGRES_USER=misskey
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - /opt/misskey/postgres:/var/lib/postgresql/data
    networks:
      - misskey-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misskey -d misskey"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  misskey-network:
    driver: bridge
