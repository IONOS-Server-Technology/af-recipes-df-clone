services:
  9router:
    image: decolua/9router:0.5.50
    restart: unless-stopped
    environment:
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - INITIAL_PASSWORD=${INITIAL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "20128:20128"
    volumes:
      - /opt/9router/data:/app/data
    networks:
      - 9router-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:20128/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  9router-network:
    driver: bridge
