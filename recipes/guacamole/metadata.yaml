id: guacamole
enabled: false
display_name: Apache Guacamole
description: Clientless remote desktop gateway supporting VNC, RDP, and SSH via browser.
short_description:
  en: "Access any desktop remotely via your browser — no client installation needed, supports RDP, VNC, and SSH."
  de: "Jeden Desktop per Browser fernsteuern — ohne Client-Installation, unterstützt RDP, VNC und SSH."
  es: "Accede a cualquier escritorio remotamente desde tu navegador — sin instalación de cliente, soporta RDP, VNC y SSH."
  fr: "Accédez à n'importe quel bureau à distance via votre navigateur — sans client à installer, supporte RDP, VNC et SSH."
  it: "Accedi a qualsiasi desktop da remoto tramite browser — senza client da installare, supporta RDP, VNC e SSH."
  nl: "Toegang tot elk bureaublad via je browser — geen clientinstallatie nodig, ondersteunt RDP, VNC en SSH."
  pl: "Zdalny dostęp do dowolnego pulpitu przez przeglądarkę — bez instalacji klienta, obsługuje RDP, VNC i SSH."
categories:
  - infrastructure
app_version: "1.5.5"
recipe_version: "1.1.0"
recipe_type: docker-compose
upstream_url: https://github.com/apache/guacamole-server
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/guacamole/1.1.0/logo.svg
logo_source: https://raw.githubusercontent.com/apache/guacamole-client/main/guacamole/src/main/frontend/src/images/logo-vector.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 41381e1607d502851acee8f1404da08971b249f28a59cd5bac84f85773f7fefa

app_min_ram_mb: 1024
app_min_disk_mb: 10240


ports:
  - port: 8080
    protocol: tcp
    public: true
    description: Apache Guacamole Web UI (routed via Traefik on 80/443)

parameters:
  - name: DB_PASSWORD
    display_name: Database Password
    type: password
    description: PostgreSQL database password.

