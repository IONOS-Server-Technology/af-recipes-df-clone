id: apache-answer
enabled: false
display_name: Apache Answer
description: Open-source Q&A platform for team knowledge sharing and community building.
short_description:
  en: "Build a self-hosted Q&A community or internal knowledge base where teams can ask questions, share answers, and capture institutional knowledge."
  de: "Erstelle eine selbstgehostete Q&A-Community oder interne Wissensdatenbank, in der Teams Fragen stellen, Antworten teilen und Wissen festhalten können."
  es: "Crea una comunidad Q&A autoalojada o base de conocimiento interna donde los equipos puedan hacer preguntas, compartir respuestas y documentar el saber colectivo"
  fr: "Créez une communauté Q&A auto-hébergée ou une base de connaissances où les équipes peuvent poser des questions, partager des réponses et capitaliser le savoir."
  it: "Crea una community Q&A self-hosted o una knowledge base interna dove i team possono fare domande, condividere risposte e preservare le conoscenze aziendali."
  nl: "Bouw een zelf-gehoste Q&A-community of interne kennisbank waar teams vragen kunnen stellen, antwoorden delen en kennis vastleggen."
  pl: "Zbuduj własną platformę Q&A lub wewnętrzną bazę wiedzy, gdzie zespoły mogą zadawać pytania, dzielić się odpowiedziami i gromadzić wiedzę."
categories:
  - productivity
  - communication
app_version: "2.0.2"
recipe_version: "0.2.0"
recipe_type: docker-compose
upstream_url: https://github.com/apache/answer
logo_url: https://appfactory.s3.eu-central-3.ionoscloud.com/recipes/apache-answer/0.2.0/logo.svg
logo_source: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/apache-answer.svg
logo_license: trademark-nominative-fair-use
logo_sha256: 47dfe4aa039a6032ce70e377c9516488cc57ac300708c5f9720425cf64999bcb

app_min_ram_mb: 256
app_min_disk_mb: 2048

ports:
  - port: 80
    protocol: tcp
    public: true
    description: Apache Answer Web UI
