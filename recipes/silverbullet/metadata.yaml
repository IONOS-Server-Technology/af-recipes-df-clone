id: silverbullet
enabled: false
display_name: SilverBullet
description: Self-hosted Markdown note-taking with live queries and a plugin system.
short_description:
  en: "Write and link Markdown notes in a fast, self-hosted knowledge base with live queries and Space Lua scripting."
  de: "Markdown-Notizen schreiben und verknüpfen — in einer schnellen, selbstgehosteten Wissensdatenbank mit Live-Abfragen und Space Lua."
  es: "Escribe y enlaza notas en Markdown en una base de conocimiento autoalojada con consultas en vivo y scripts Space Lua."
  fr: "Rédigez et liez des notes Markdown dans une base de connaissances auto-hébergée avec requêtes en direct et scripts Space Lua."
  it: "Scrivi e collega note Markdown in una knowledge base self-hosted con query live e scripting Space Lua."
  nl: "Schrijf en koppel Markdown-notities in een snelle, zelf-gehoste kennisbank met live queries en Space Lua scripting."
  pl: "Pisz i łącz notatki Markdown w szybkiej, samodzielnie hostowanej bazie wiedzy z zapytaniami na żywo i skryptami Space Lua."
categories:
  - productivity
app_version: "2.10.0"
recipe_version: "0.2.0"
recipe_type: docker-compose
