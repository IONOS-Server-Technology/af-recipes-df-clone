services:
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:2.10.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /opt/silverbullet/space:/space
    networks:
      - silverbullet-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  silverbullet-network:
    driver: bridge
