# IF-1310 — bootstrap log forwarding, on-VM half.
#
# Included from recipe-health-check.conf, so it runs on every leg. Nothing is uploaded
# and nothing is started: the forwarder is baked into the AF image and run by
# af-log-forwarder.service, so by the time these tests reach the VM over SSH it has
# already done its work and af-finalize has already ended it.
#
# That ordering is the point rather than an inconvenience. SSH only opens after
# handover, so anything still running at this moment is running on a machine that now
# belongs to the customer.
#
# Whether the log actually got out is checked on the other side, from af-api's own log
# (scripts/verify_bootstrap_log.py). It has to be: the whole reason the endpoint exists
# is a VM nobody can reach, so the VM is the wrong place to ask whether its log
# escaped. What is checked here is the half only the VM can answer.
#
# Tests that depend on af-finalize having run carry af_FIN_ in their name, so the
# workflow's `--testsuite-exclude af_FIN_` skips them while finalize_disabled is on.
# Under that switch the forwarder is deliberately left running and they must not fail.
#
# These checks are unconditional, and a presence probe would be wrong
# ------------------------------------------------------------------
# An earlier version gated each check on the forwarder being present — binary on disk or
# entries in the journal — so an image predating the feature would pass instead of fail.
# It is gone for two reasons.
#
# It could not work as written. `journalctl -t af-log-forwarder` prints "-- No entries --"
# on stdout when there is nothing to show, so `grep -q .` matched unconditionally and the
# gate never closed once. On run 32148221959 all three gated checks failed exactly as
# before, which is the only reason that break was noticed at all.
#
# And the idea is unsound even implemented correctly. A probe cannot tell "this image
# predates the forwarder" from "this image has one that silently did nothing" — and after
# a handover af-finalize has removed the binary and the unit by design, so absence is a
# normal end state rather than evidence about the image.
#
# So the expectation stays hard. If an image line ever legitimately lags the feature, the
# exclusion belongs in the workflow, where a reviewer sees it — the same visible mechanism
# `--testsuite-exclude af_FIN_` already uses — not in a check that quietly turns itself
# off. What makes this safe in the meantime is the merge order: af-cloud-init before
# af-recipes.

[require_env]
SERVERIP
SSH_KEY_ABSPATH

[exec_vm]
class = Plugins.Ssh.Session
host = $SERVERIP
user = root
private_key_file = $SSH_KEY_ABSPATH

# ── the forwarder ran ────────────────────────────────────────────────────────
# Read from the journal, which retains the unit's output after the unit itself is
# removed. That is what makes this checkable at all on the handover path.

[test_log_forwarder_started]
class = Plugins.Ssh.Test
executors = exec_vm
comment = The forwarder started and reported which sources it follows
cmd = journalctl -b --no-pager -t af-log-forwarder | grep -q "forwarding .* source(s) to "
expected_exitcode = 0

[test_log_forwarder_followed_both_sources]
class = Plugins.Ssh.Test
executors = exec_vm
comment = Both the install log and the journal were followed
cmd = journalctl -b --no-pager -t af-log-forwarder | grep -q "source install started" && journalctl -b --no-pager -t af-log-forwarder | grep -q "source journal started"
expected_exitcode = 0

[test_log_forwarder_endpoint_derived_not_hardcoded]
class = Plugins.Ssh.Test
executors = exec_vm
comment = The endpoint was derived from bootstrap_url, so no host is baked into the image
cmd = journalctl -b --no-pager -t af-log-forwarder | grep -q "source(s) to http.*://.*/api/v1/bootstrap-log"
expected_exitcode = 0

[test_log_forwarder_no_unhandled_failure]
class = Plugins.Ssh.Test
executors = exec_vm
comment = The forwarder never hit its catch-all, which would mean a bug rather than a network problem
cmd = ! journalctl -b --no-pager -t af-log-forwarder | grep -q "forwarder failed"
expected_exitcode = 0

# ── the forwarder is gone ────────────────────────────────────────────────────
# A forwarder alive at this moment follows the journal of a machine that now belongs
# to the customer and keeps shipping it to af-api. Scrubbing the install log does not
# help: that file is gone, but journalctl keeps producing new lines.

# The bracket in the pattern is load-bearing, not decoration. ImageTester runs these
# through `bash -c`, so the pattern itself is part of a live command line, and a plain
# `pgrep -af af-log-forwarder` matches the shell that is running the pgrep. Both of these
# checks reported a surviving process on their first live run for exactly that reason,
# with the only "match" being their own invoking shell — a false positive that reads
# identically to the failure they exist to catch. `[a]f-...` cannot match itself because
# the literal characters no longer appear consecutively.
#
# Matching the binary path rather than the bare name as well: the name used to appear in
# the journal child's command line via a --cursor-file argument, so this check caught
# children by accident. That argument is gone; children have their own check below.
[test_af_FIN_log_forwarder_process_gone]
class = Plugins.Ssh.Test
executors = exec_vm
comment = No forwarder process is alive now that SSH is open
cmd = ! pgrep -af "[/]usr/local/sbin/af-log-forwarder"
expected_exitcode = 0

[test_af_FIN_log_forwarder_children_gone]
class = Plugins.Ssh.Test
executors = exec_vm
comment = Its tail and journalctl children died with it, so nothing follows the customer's journal
cmd = ! pgrep -af "[j]ournalctl --boot --follow" && ! pgrep -af "[t]ail -F -n \+1 /var/log/cloud-init-application-factory.log"
expected_exitcode = 0

[test_af_FIN_log_forwarder_unit_removed]
class = Plugins.Ssh.Test
executors = exec_vm
comment = The unit file and its wants-symlink are removed, so a reboot cannot revive it
cmd = test ! -e /etc/systemd/system/af-log-forwarder.service && test ! -e /etc/systemd/system/cloud-init.target.wants/af-log-forwarder.service
expected_exitcode = 0

[test_af_FIN_log_forwarder_binary_removed]
class = Plugins.Ssh.Test
executors = exec_vm
comment = The forwarder itself is removed along with the rest of AF's footprint
cmd = test ! -e /usr/local/sbin/af-log-forwarder
expected_exitcode = 0

[test_af_FIN_log_forwarder_unknown_to_systemd]
class = Plugins.Ssh.Test
executors = exec_vm
comment = systemd no longer knows the unit, so nothing can start it again
cmd = ! systemctl is-enabled af-log-forwarder.service 2>/dev/null && ! systemctl is-active --quiet af-log-forwarder.service
expected_exitcode = 0

# Both halves of a clean stop, because they are different claims: the handler ran at all,
# and the close then happened on the main path. The handler deliberately does no socket
# work -- closing from inside it would splice the terminating chunk into whatever chunk
# the loop was mid-write on -- so "signal received" and "stream closed" are two separate
# lines from two separate places, and only both together mean the stop worked as designed.
[test_af_FIN_log_forwarder_closed_its_stream_on_the_signal]
class = Plugins.Ssh.Test
executors = exec_vm
comment = The forwarder handled SIGTERM itself and closed the stream from its main path
cmd = journalctl -b --no-pager -t af-log-forwarder | grep -q "signal SIGTERM" && journalctl -b --no-pager -t af-log-forwarder | grep -q "closing the stream"
expected_exitcode = 0

# ── evidence out ─────────────────────────────────────────────────────────────
# The parent config already dumps the journal and pulls /tmp/af-logs; this adds only
# the forwarder's own output as a separate file, so a failure above can be read
# without hunting through the whole boot journal.

[test_log_forwarder_journal_dump]
class = Plugins.Ssh.Test
executors = exec_vm
comment = Keep the forwarder's own journal alongside the other AF logs
cmd = mkdir -p /tmp/af-logs && (journalctl -b --no-pager -t af-log-forwarder > /tmp/af-logs/af-log-forwarder.journal || true)
expected_exitcode = 0
