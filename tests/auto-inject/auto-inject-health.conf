[require_env]
SERVERIP
SSH_KEY_ABSPATH
WORKFLOW_HOMEDIR

[exec_vm]
class = Plugins.Ssh.Session
host = $SERVERIP
user = root
private_key_file = $SSH_KEY_ABSPATH

# Auto-inject recipes (docker_auto_inject: true) are injected into every
# docker-compose recipe VM. Verify each the same way as the carrier recipe:
# upload its health-check.sh and run it on the VM (no URL arg => Docker-CI mode,
# which waits for the container's docker healthcheck). A single SSH session
# (SFTP upload + exec) instead of the previous per-command ssh/scp calls.
# wud is currently the only auto-inject recipe; add a block if another is
# introduced. Assumes the carrier is docker-compose (all enabled recipes are).
[test_auto_inject_wud]
class = Plugins.UploadExecute.Test
executors = exec_vm
src = $WORKFLOW_HOMEDIR/recipes/wud/health-check.sh
dst = /tmp/af-hc-wud.sh
cmd = bash /tmp/af-hc-wud.sh
expected_exitcode = 0
