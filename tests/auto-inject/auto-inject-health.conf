[require_env]
SERVERIP
SSH_KEY_ABSPATH
WORKFLOW_HOMEDIR
# IF-1458: needed by the basic-auth check below, which reaches wud through
# Traefik at wud.$BASE_DOMAIN from outside. AF_ROOT_PASSWORD_FILE is the *path* to
# the server password (never the value — ShellExecutor logs the environment at DEBUG
# and the logs are uploaded as an artifact).
BASE_DOMAIN
AF_ROOT_PASSWORD_FILE

[exec_vm]
class = Plugins.Ssh.Session
host = $SERVERIP
user = root
private_key_file = $SSH_KEY_ABSPATH

# IF-1458: the auth check must run from the test runner, not from the VM. This
# file previously only had exec_vm, because every check here ran against the
# container locally. Curling wud.$BASE_DOMAIN from the VM itself would mean the
# host reaching its own public IP -- the hairpin-NAT case check-traefik-cert.sh
# documents -- and it would also not prove what an external client sees.
[exec_local]
class = Plugins.Shell.Session

# Auto-inject recipes (docker_auto_inject: true) are injected into every
# docker-compose recipe VM. Verify each the same way as the carrier recipe:
# upload its health-check.sh and run it on the VM (no URL arg => Docker-CI mode,
# which waits for the container's docker healthcheck). A single SSH session
# (SFTP upload + exec) instead of the previous per-command ssh/scp calls.
# wud is currently the only auto-inject recipe; add a block if another is
# introduced. Assumes the carrier is docker-compose (all enabled recipes are).
[test_auto_inject_wud]
class = Plugins.UploadExecute.Test
executors = exec_vm
src = $WORKFLOW_HOMEDIR/recipes/wud/health-check.sh
dst = /tmp/af-hc-wud.sh
cmd = bash /tmp/af-hc-wud.sh
expected_exitcode = 0

# IF-1458: wud is protected (IF-1312) but auto-injected, so it is never a matrix
# recipe and the per-recipe basic-auth test never covers it. It gets both stages
# here instead, on every docker-compose VM. Also satisfies IF-940 AC3: a future
# auto-inject recipe is picked up by adding a block here, with no pipeline change.
#
# wud's own health-check.sh above cannot stand in for this: it accepts both 200
# and 401 as healthy, and it talks to the container directly rather than through
# Traefik, so it never sees the middleware at all.
#
# The credentialed stage could be argued away by inference -- the renderer puts
# auto-injected and selected recipes through one code path (`_add_app(inject_id)`),
# so a hash that authenticates for n8n authenticates here. It is tested directly
# anyway: wud is the only protected app that never appears as a matrix recipe, and
# it fronts an API holding the Docker socket read-write (IF-808), so "proven by
# inference" is a thin guarantee for the one route where a broken credential would
# matter most. Costs one extra request per VM.
#
# `true` is hard-coded rather than derived: wud being protected is the premise of
# this test, not something to look up.
[test_auto_inject_wud_basic_auth]
class = Plugins.Shell.Test
executors = exec_local
comment = wud rejects anonymous access (401) and accepts admin + server password (200)
cmd = bash $WORKFLOW_HOMEDIR/if-image-tests/app-tests/application-factory/check-basic-auth.sh --app wud --expect-protected true --with-credentials
expected_exitcode = 0
