# GENERATED by scripts/gen-health-check-conf.py -- do not edit by hand.
# Apps in this selection: immich, n8n
# base_domain: af-test.invalid
# Traefik TLS blocks: none (--expect-le-staging not passed: this run did not request the LE staging directory, so af-api renders no caserver line to assert)
#
# WRITE THIS FILE INTO tests/ (the directory that contains auto-inject/).
# [include_auto_inject] is currently parked (IF-1465, wud has docker_auto_inject:
# false) and is not emitted, so it resolves nothing right now, but the file still
# belongs there: restoring that include uses the relative path "auto-inject", which
# the TestSuite resolves against the directory of the *including* config -- not the
# cwd -- and a missing include target is a hard exit before a single test runs, so
# this config placed anywhere else would abort the entire suite once it is live again.
# [test_AF Logs pull] likewise scp's into ./af-logs relative to that directory,
# which is the path the workflow uploads as the test-results artifact.
#
# Every per-app section name carries the app id as a suffix. That is not cosmetic:
# the TestSuite parses with configparser's default strict mode, and a duplicate section
# name raises DuplicateSectionError -- the run exits 1, not silently with a green pass.
# The suite does key loaded test cases by name into a dict, causing overwrites across
# includes with the same section prefix, but that is one layer up and never happens
# within the single file this generator emits.

# Only names declared here are expanded where they appear as $VAR below. An
# undeclared variable is left in place literally, with no warning -- which is why
# BASE_DOMAIN has to be listed whenever the routing blocks are emitted.
[require_env]
SERVERIP
RECIPE_NAME
WORKFLOW_HOMEDIR
SSH_KEY_ABSPATH
AF_API_URL
AF_BOOTSTRAP_URL
BASE_DOMAIN
AF_ROOT_PASSWORD_FILE

[exec_local]
class = Plugins.Shell.Session

[exec_vm]
class = Plugins.Ssh.Session
host = $SERVERIP
user = root
private_key_file = $SSH_KEY_ABSPATH

[include_recipe-additonal-image-tests]
path = $WORKFLOW_HOMEDIR/if-image-tests/app-tests/application-factory/recipe_install_addtional.conf

# ---- per-VM checks: one VM serves the whole selection, so these run once ----

# Curl the endpoint the VM genuinely redeems its token against, i.e. the
# bootstrap_url from its own cloud-init. Do NOT rebuild this from AF_API_URL: on
# both real clusters bootstrap is served on a separate public host, and the mTLS
# main host refuses the certless request a VM makes (http_code 000, curl 55/35).
# It only worked against AF_API_URL while prod was on nginx, which kept
# /api/v1/bootstrap certless on the main host via a per-path exemption; the Envoy
# SecurityPolicy covers the whole main route, so that exemption is gone.
# The blocking "Verify the af-api host split" workflow step asserts the same
# reachability from the runner, plus that the main host does refuse a certless
# request. This one is the VM's own view of it.
[test_bootstrap_reachable]
class = Plugins.Ssh.Test
executors = exec_vm
cmd = curl -sS -o /dev/null -w "bootstrap http_code=%{http_code}\n" --max-time 10 $AF_BOOTSTRAP_URL
expected_exitcode = 0

[test_docker_images]
class = Plugins.Ssh.Test
executors = exec_vm
cmd = docker images
expected_exitcode = 0

# ---- per-app checks for "immich" ----

[test_install_dir_immich]
class = Plugins.Ssh.Test
executors = exec_vm
cmd = ls -la /opt/immich/
expected_exitcode = 0

# IF-1383: the compose definition must persist in /opt/immich after install and
# the handover scrub, not just live in the temp extract dir that cloud-init
# deletes. test_install_dir_immich above only proves the directory exists (it
# passed even under the bug, when /opt/immich held only a data volume) — these
# two prove the files the definition needs are actually there. The renderer writes
# docker-compose.yml (.yml) and .env into /opt/immich.
#
# Assumes an activated docker-compose recipe. Only enabled: true recipes reach
# this suite, and all currently enabled recipes are docker-compose; if a native
# recipe is ever activated these two checks must be gated on recipe_type (native
# recipes ship no compose file or .env).
[test_compose_file_persisted_immich]
class = Plugins.Ssh.Test
executors = exec_vm
cmd = test -f /opt/immich/docker-compose.yml
expected_exitcode = 0

[test_env_file_persisted_immich]
class = Plugins.Ssh.Test
executors = exec_vm
cmd = test -f /opt/immich/.env
expected_exitcode = 0

# Upload the recipe's health-check.sh to the VM and run it there, so it can
# curl the app on localhost and inspect docker state. Uploads via SFTP over the
# exec_vm SSH session, then runs cmd on that same session.
# dst stays under /tmp: an unwritable or non-existent dst directory raises an
# uncaught ValueError out of the UploadExecute plugin, which aborts every
# remaining test in the run instead of just failing this one.
[test_health_check_immich]
class = Plugins.UploadExecute.Test
executors = exec_vm
src = $WORKFLOW_HOMEDIR/recipes/immich/health-check.sh
dst = /tmp/af-hc-immich.sh
cmd = bash /tmp/af-hc-immich.sh
expected_exitcode = 0

# Traefik routing smoke check for immich. With a base_domain in the /compose
# payload, af-api stops publishing each app's host port and routes it through
# Traefik at immich.$BASE_DOMAIN instead. Every container can therefore be
# healthy on the internal docker network while nothing is reachable from outside:
# a broken Traefik render leaves the container health checks fully green, so this
# is the only block that catches it.
#
# --resolve rather than -H "Host: ...": it sets SNI and the Host header to the same
# name, so the check keeps routing if sniStrict is ever turned on, and it exercises
# the URL a real client would use. -k stays either way -- af-test.invalid can never
# obtain an ACME certificate, so Traefik answers with its self-signed default cert.
#
# Asserted as a regex over the status line, not a fixed code, because several
# unrelated codes all prove the same thing:
#   pass  2xx, 3xx (any redirect), 401, 403 -- Traefik matched a router for this
#         host and forwarded upstream. Whether the app then demands a login is
#         not this test's business.
#   fail  404 -- Traefik is listening but has no router for this host, the usual
#         symptom of a bad render.
#   fail  5xx -- a router exists but the upstream did not answer. Not strictly a
#         routing bug, and test_health_check_immich should catch it first, but
#         there is no reading of a 5xx here that is good news.
#   fail  000 -- nothing is listening on :443 at all. curl also exits non-zero
#         there, so expected_exitcode = 0 catches it a second way (and covers
#         TLS-level failures, which never produce a status code).
[test_traefik_route_immich]
class = Plugins.Ssh.Test
executors = exec_vm
cmd = curl -k -sS -o /dev/null -w "traefik route immich http_code=%{http_code}\n" --max-time 10 --resolve immich.$BASE_DOMAIN:443:127.0.0.1 https://immich.$BASE_DOMAIN/
expected_stdout = http_code=(2[0-9][0-9]|3[0-9][0-9]|401|403)$
comparator_stdout = regex
expected_exitcode = 0

# IF-1490: the app password must be in force from outside exactly as immich's metadata
# declares. Runs on exec_local, like the cert check, because a VM curling its own public
# IP hits hairpin NAT. --expect-protected is baked in as true.
#
# One test, both directions: a protected recipe must send an anonymous visitor to /_af/login,
# an unprotected one must not. --with-credentials then adds a login stage -- on a protected
# recipe the server password must be issued a session cookie that reaches the app (a redirect
# alone only proves some gate is attached), plus a deliberately wrong password that must be
# refused; on an unprotected one it is a control that /_af/login serves no page. The password
# is read from a file, never the cmd line.
#
# Until IF-1490 this asserted Traefik's basicauth middleware and a 401; that middleware is
# gone, so the old assertion failed on every protected recipe while the product worked.
[test_app_password_enforced_immich]
class = Plugins.Shell.Test
executors = exec_local
comment = App password enforced as declared for immich, probed anonymously and with a login
cmd = bash $WORKFLOW_HOMEDIR/if-image-tests/app-tests/application-factory/check-app-password.sh --app immich --expect-protected true --with-credentials
expected_exitcode = 0

