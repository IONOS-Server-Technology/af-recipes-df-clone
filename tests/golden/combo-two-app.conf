# ---- post-install diagnostics: informational, never fails the run ----

[test_resource_usage]
class = Plugins.Ssh.Test
executors = exec_vm
comment = Record actual RAM, disk and per-container memory for this selection
cmd = (echo "--- free -m ---"; free -m; echo "--- df -h / ---"; df -h /; echo "--- docker stats ---"; docker stats --no-stream --format '{{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}') 2>&1 || true
expected_exitcode = 0

# IF-1310. Included in every leg: every VM in this pipeline runs the forwarder, so
# "did the log get out, and is the forwarder gone afterwards" is an ordinary property
# of a healthy bootstrap. The teardown half carries af_FIN_ and is skipped
# automatically while finalize_disabled is on.
[include_bootstrap_log]
path = bootstrap-log

[test_AF Logs dump]
class = Plugins.Ssh.Test
executors = exec_vm
comment = Dump the journal
cmd = mkdir -p /tmp/af-logs && journalctl > /tmp/af-logs/server.journal && (test -e /var/log/cloud-init-application-factory.log && cp /var/log/cloud-init-application-factory.log /tmp/af-logs || true)
expected_exitcode = 0

[test_AF Logs pull]
class = Plugins.Ssh.Test
executors = exec_local
comment = Pull Servers Journal Dump
cmd = scp -r -i $SSH_KEY_ABSPATH -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@$SERVERIP:/tmp/af-logs af-logs
expected_exitcode = 0
