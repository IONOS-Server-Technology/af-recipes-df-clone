[require_env]
SERVERIP
RECIPE_NAME
WORKFLOW_HOMEDIR
SSH_KEY_ABSPATH
AF_API_URL
AF_BOOTSTRAP_URL
BASE_DOMAIN

[exec_local]
class = Plugins.Shell.Session

[exec_vm]
class = Plugins.Ssh.Session
host = $SERVERIP
user = root
private_key_file = $SSH_KEY_ABSPATH

[include_recipe-additonal-image-tests]
path = $WORKFLOW_HOMEDIR/if-image-tests/app-tests/application-factory/recipe_install_addtional.conf

# Curl the endpoint the VM genuinely redeems its token against, i.e. the
# bootstrap_url from its own cloud-init. Do NOT rebuild this from AF_API_URL: on
# both real clusters bootstrap is served on a separate public host, and the mTLS
# main host refuses the certless request a VM makes (http_code 000, curl 55/35).
# It only worked against AF_API_URL while prod was on nginx, which kept
# /api/v1/bootstrap certless on the main host via a per-path exemption; the Envoy
# SecurityPolicy covers the whole main route, so that exemption is gone.
# The blocking "Verify the af-api host split" workflow step asserts the same
# reachability from the runner, plus that the main host does refuse a certless
# request. This one is the VM's own view of it.
[test_bootstrap_reachable]
class = Plugins.Ssh.Test
executors = exec_vm
cmd = curl -sS -o /dev/null -w "bootstrap http_code=%{http_code}\n" --max-time 10 $AF_BOOTSTRAP_URL
expected_exitcode = 0

[test_docker_images]
class = Plugins.Ssh.Test
executors = exec_vm
cmd = docker images
expected_exitcode = 0

[test_install_dir]
class = Plugins.Ssh.Test
executors = exec_vm
cmd = ls -la /opt/$RECIPE_NAME/
expected_exitcode = 0

# IF-1383: the compose definition must persist in /opt/<app> after install and
# the handover scrub, not just live in the temp extract dir that cloud-init
# deletes. test_install_dir above only proves the directory exists (it passed
# even under the bug, when /opt/<app> held only a data volume) — these two prove
# the files the definition needs are actually there. The renderer writes
# docker-compose.yml (.yml) and .env into /opt/<app>.
#
# Assumes an activated docker-compose recipe. Only enabled: true recipes reach
# this suite, and all currently enabled recipes are docker-compose; if a native
# recipe is ever activated these two checks must be gated on recipe_type (native
# recipes ship no compose file or .env).
[test_compose_file_persisted]
class = Plugins.Ssh.Test
executors = exec_vm
cmd = test -f /opt/$RECIPE_NAME/docker-compose.yml
expected_exitcode = 0

[test_env_file_persisted]
class = Plugins.Ssh.Test
executors = exec_vm
cmd = test -f /opt/$RECIPE_NAME/.env
expected_exitcode = 0

# Upload the recipe's health-check.sh to the VM and run it there, so it can
# curl the app on localhost and inspect docker state. Uploads via SFTP over the
# exec_vm SSH session, then runs cmd on that same session.
[test_health_check]
class = Plugins.UploadExecute.Test
executors = exec_vm
src = $WORKFLOW_HOMEDIR/recipes/$RECIPE_NAME/health-check.sh
dst = /tmp/af-hc-$RECIPE_NAME.sh
cmd = bash /tmp/af-hc-$RECIPE_NAME.sh
expected_exitcode = 0

# IF-1386: the rendered Traefik compose must point ACME at LE *staging*, never
# production (IF-1385) -- a direct config check, independent of DNS/ACME
# challenge timing (unlike test_traefik_https_cert_issuer below). Value must
# match LE_CASERVER as set on the ephemeral test af-api Deployment
# (af-recipes/scripts/k8s_helper.py) -- keep both in sync if that ever changes.
[test_traefik_le_staging_configured]
class = Plugins.Ssh.Test
executors = exec_vm
comment = Traefik compose renders the LE staging ACME directory
cmd = cat /opt/traefik/docker-compose.yml
expected_stdout = --certificatesresolvers.le.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
comparator_stdout = in
expected_exitcode = 0

# IF-1386: prove the app is reachable through Traefik from the outside (not
# just healthy on localhost, per test_health_check above) and that Traefik is
# serving the LE *staging* cert, never production (IF-1385). Runs from the
# runner (exec_local) like a real client would connect, using the script
# shipped in if-image-tests (already checked out on the runner).
[test_traefik_https_cert_issuer]
class = Plugins.Shell.Test
executors = exec_local
comment = App reachable via Traefik over HTTPS; served cert issuer must be LE staging
cmd = bash $WORKFLOW_HOMEDIR/if-image-tests/app-tests/application-factory/check-traefik-cert.sh
expected_exitcode = 0

[include_auto_inject]
path = auto-inject

[test_AF Logs dump]
class = Plugins.Ssh.Test
executors = exec_vm
comment = Dump the journal
cmd = mkdir -p /tmp/af-logs && journalctl > /tmp/af-logs/server.journal && (test -e /var/log/cloud-init-application-factory.log && cp /var/log/cloud-init-application-factory.log /tmp/af-logs || true)
expected_exitcode = 0

[test_AF Logs pull]
class = Plugins.Ssh.Test
executors = exec_local
comment = Pull Servers Journal Dump
cmd = scp -r -i $SSH_KEY_ABSPATH -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@$SERVERIP:/tmp/af-logs af-logs
expected_exitcode = 0