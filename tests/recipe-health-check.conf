[require_env]
SERVERIP
RECIPE_NAME
WORKFLOW_HOMEDIR
SSH_KEY_ABSPATH
AF_API_URL
AF_BOOTSTRAP_URL
BASE_DOMAIN
# IF-1458: "true"/"false" from scripts/recipe-wants-basic-auth.py, and the *path* to
# the server password the workflow handed to /compose. A path, not the password:
# ShellExecutor passes the whole environment to each test and logs it at DEBUG, and
# the run's logs are uploaded as an artifact, which GitHub's add-mask does not cover.
RECIPE_BASIC_AUTH
AF_ROOT_PASSWORD_FILE

[exec_local]
class = Plugins.Shell.Session

[exec_vm]
class = Plugins.Ssh.Session
host = $SERVERIP
user = root
private_key_file = $SSH_KEY_ABSPATH

[include_recipe-additonal-image-tests]
path = $WORKFLOW_HOMEDIR/if-image-tests/app-tests/application-factory/recipe_install_addtional.conf

# Curl the endpoint the VM genuinely redeems its token against, i.e. the
# bootstrap_url from its own cloud-init. Do NOT rebuild this from AF_API_URL: on
# both real clusters bootstrap is served on a separate public host, and the mTLS
# main host refuses the certless request a VM makes (http_code 000, curl 55/35).
# It only worked against AF_API_URL while prod was on nginx, which kept
# /api/v1/bootstrap certless on the main host via a per-path exemption; the Envoy
# SecurityPolicy covers the whole main route, so that exemption is gone.
# The blocking "Verify the af-api host split" workflow step asserts the same
# reachability from the runner, plus that the main host does refuse a certless
# request. This one is the VM's own view of it.
[test_bootstrap_reachable]
class = Plugins.Ssh.Test
executors = exec_vm
cmd = curl -sS -o /dev/null -w "bootstrap http_code=%{http_code}\n" --max-time 10 $AF_BOOTSTRAP_URL
expected_exitcode = 0

[test_docker_images]
class = Plugins.Ssh.Test
executors = exec_vm
cmd = docker images
expected_exitcode = 0

[test_install_dir]
class = Plugins.Ssh.Test
executors = exec_vm
cmd = ls -la /opt/$RECIPE_NAME/
expected_exitcode = 0

# IF-1383: the compose definition must persist in /opt/<app> after install and
# the handover scrub, not just live in the temp extract dir that cloud-init
# deletes. test_install_dir above only proves the directory exists (it passed
# even under the bug, when /opt/<app> held only a data volume) — these two prove
# the files the definition needs are actually there. The renderer writes
# docker-compose.yml (.yml) and .env into /opt/<app>.
#
# Assumes an activated docker-compose recipe. Only enabled: true recipes reach
# this suite, and all currently enabled recipes are docker-compose; if a native
# recipe is ever activated these two checks must be gated on recipe_type (native
# recipes ship no compose file or .env).
[test_compose_file_persisted]
class = Plugins.Ssh.Test
executors = exec_vm
cmd = test -f /opt/$RECIPE_NAME/docker-compose.yml
expected_exitcode = 0

[test_env_file_persisted]
class = Plugins.Ssh.Test
executors = exec_vm
cmd = test -f /opt/$RECIPE_NAME/.env
expected_exitcode = 0

# Upload the recipe's health-check.sh to the VM and run it there, so it can
# curl the app on localhost and inspect docker state. Uploads via SFTP over the
# exec_vm SSH session, then runs cmd on that same session.
[test_health_check]
class = Plugins.UploadExecute.Test
executors = exec_vm
src = $WORKFLOW_HOMEDIR/recipes/$RECIPE_NAME/health-check.sh
dst = /tmp/af-hc-$RECIPE_NAME.sh
cmd = bash /tmp/af-hc-$RECIPE_NAME.sh
expected_exitcode = 0

[test_traefik_le_staging_configured]
class = Plugins.Ssh.Test
executors = exec_vm
comment = Traefik compose renders the LE staging ACME directory
cmd = cat /opt/traefik/docker-compose.yml
expected_stdout = --certificatesresolvers.le.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
comparator_stdout = in
expected_exitcode = 0

[test_traefik_https_cert_issuer]
class = Plugins.Shell.Test
executors = exec_local
comment = App reachable via Traefik over HTTPS; served cert issuer must be LE staging
cmd = bash $WORKFLOW_HOMEDIR/if-image-tests/app-tests/application-factory/check-traefik-cert.sh
expected_exitcode = 0

# IF-1490: the app password must actually be in force from outside. Runs on exec_local
# for the same reason as the cert check above -- a VM curling its own public IP hits
# hairpin NAT.
#
# One test for both directions: a recipe that declares a password must send an anonymous
# visitor to /_af/login, one that does not must not (a mis-scoped rollout is a finding
# either way). $RECIPE_BASIC_AUTH carries which case this recipe is; the workflow derives
# it from metadata.yaml with the same rule af-api applies. The variable still says
# basic_auth because the recipe field does -- renaming that field is its own change, since
# the Shop reads it.
#
# --with-credentials adds a second stage. On a protected recipe it logs in for real: the
# server password must be issued a session cookie and that cookie must reach the app,
# because a redirect alone only proves *some* gate is attached -- IF-1312's near-miss was
# a Compose-mangled hash producing a permanent, plausible-looking rejection. It also sends
# a deliberately wrong password, which is the only probe here that tells a gate checking
# the password from one waving everyone through. On an unprotected recipe the stage is a
# control: /_af/login must not serve a page at all.
#
# Until IF-1490 this asserted Traefik's basicauth middleware and a 401. That middleware is
# gone -- basic auth *is* the Authorization header, and it overwrote the one an app's own
# frontend sends -- so the old assertion failed on every protected recipe while the product
# worked.
#
# The password is read from the file named by AF_ROOT_PASSWORD_FILE; it never appears
# on this cmd line, which ImageTester logs verbatim into the uploaded artifact.
[test_app_password_enforced]
class = Plugins.Shell.Test
executors = exec_local
comment = App password enforced as declared, probed anonymously and with a login
cmd = bash $WORKFLOW_HOMEDIR/if-image-tests/app-tests/application-factory/check-app-password.sh --app $RECIPE_NAME --expect-protected $RECIPE_BASIC_AUTH --with-credentials
expected_exitcode = 0

# IF-1465: parked while wud — the only auto-inject recipe — has docker_auto_inject:
# false. The blocks in tests/auto-inject/ assert a wud container is running on the VM
# and that Traefik answers 401/200 at wud.$BASE_DOMAIN; with nothing injected they fail
# on every recipe leg, not just wud's. Restore this section together with the flag.
# When that happens, the 401 in those blocks needs the same treatment this section just
# got: wud declares a password, so it answers 302 to /_af/login now, not 401 (IF-1490).
# [include_auto_inject]
# path = auto-inject

# IF-1310. Included in every leg rather than gated behind a dispatch input: every VM
# in this pipeline runs the forwarder, so "did the log get out, and is the forwarder
# gone afterwards" is an ordinary property of a healthy bootstrap, not a special
# occasion. The teardown half carries af_FIN_ and is skipped automatically while
# finalize_disabled is on.
[include_bootstrap_log]
path = bootstrap-log

[test_AF Logs dump]
class = Plugins.Ssh.Test
executors = exec_vm
comment = Dump the journal
cmd = mkdir -p /tmp/af-logs && journalctl > /tmp/af-logs/server.journal && (test -e /var/log/cloud-init-application-factory.log && cp /var/log/cloud-init-application-factory.log /tmp/af-logs || true)
expected_exitcode = 0

[test_AF Logs pull]
class = Plugins.Ssh.Test
executors = exec_local
comment = Pull Servers Journal Dump
cmd = scp -r -i $SSH_KEY_ABSPATH -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@$SERVERIP:/tmp/af-logs af-logs
expected_exitcode = 0
