[require_env]
SERVERIP
RECIPE_NAME
WORKFLOW_HOMEDIR
SSH_KEY_ABSPATH
AF_API_URL

[exec_local]
class = Plugins.Shell.Session

[exec_vm]
class = Plugins.Ssh.Session
host = $SERVERIP
user = root
private_key_file = $SSH_KEY_ABSPATH

[test_bootstrap_reachable]
class = Plugins.Ssh.Test
executors = exec_vm
cmd = curl -sS -o /dev/null -w "bootstrap http_code=%{http_code}\n" --max-time 10 $AF_API_URL/bootstrap
expected_exitcode = 0

[test_docker_images]
class = Plugins.Ssh.Test
executors = exec_vm
cmd = docker images
expected_exitcode = 0

[test_install_dir]
class = Plugins.Ssh.Test
executors = exec_vm
cmd = ls -la /opt/$RECIPE_NAME/
expected_exitcode = 0

[test_health_check]
class = Plugins.Shell.Test
executors = exec_local
cmd = bash $WORKFLOW_HOMEDIR/recipes/$RECIPE_NAME/health-check.sh
expected_exitcode = 0

[test_debug_sleep]
class = Plugins.Shell.Test
executors = exec_local
cmd = sleep 3000000
expected_exitcode = 0

[include_auto_inject]
path = auto-inject
